{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Gabay{% endblock %}</title>
  <meta name="description" content="{% block description %}Gabay — NMAT & MCAT study companion{% endblock %}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,650&family=Sora:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'portal/css/site.css' %}?v=20260825c">
  <link rel="stylesheet" href="{% static 'portal/css/tutor.css' %}?v=20260825c">
</head>
<body>
  <div class="csrf-slot" hidden>{% csrf_token %}</div>
  {% block body %}{% endblock %}
  <footer class="site-footer">
    <div class="site-footer-inner">
      <span>Gabay · NMAT & MCAT study companion</span>
      <span>Swappable AI study coach</span>
    </div>
  </footer>
  <script src="{% static 'portal/js/site.js' %}?v=20260825c" defer></script>
</body>
</html>
