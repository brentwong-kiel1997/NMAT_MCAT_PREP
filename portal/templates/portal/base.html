{% load static %}
<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Gabay{% endblock %}</title>
  <meta name="description" content="{% block description %}Gabay — NMAT 菲律宾医学院入学与 MCAT 备考个人助手{% endblock %}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,650&family=Sora:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'portal/css/site.css' %}">
  <link rel="stylesheet" href="{% static 'portal/css/tutor.css' %}">
</head>
<body>
  {% block body %}{% endblock %}
  <footer class="site-footer">
    <div class="site-footer-inner">
      <span data-i18n data-zh="Gabay · NMAT & MCAT 个人备考助手" data-en="Gabay · NMAT & MCAT study companion">Gabay · NMAT &amp; MCAT 个人备考助手</span>

</html>
