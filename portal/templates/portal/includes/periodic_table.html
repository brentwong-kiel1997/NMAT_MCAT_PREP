{# Periodic table dialog — exam fidelity aid (the real MCAT provides one;  #}
{# NMAT lists constants in-stem). Data: [Z, symbol, mass, category].       #}
<div class="pt-overlay" id="exam-pt" hidden>
  <div class="pt-dialog" role="dialog" aria-modal="true" aria-label="Periodic table">
    <header class="pt-head">
      <strong>Periodic table of the elements</strong>
      <button type="button" class="btn pt-close" id="exam-pt-close">Close ✕</button>
    </header>
    <div class="pt-grid" id="pt-grid"></div>
    <div class="pt-legend">
      <span class="pt-k pt-alkali"></span>alkali
      <span class="pt-k pt-alkaline"></span>alkaline earth
      <span class="pt-k pt-transition"></span>transition
      <span class="pt-k pt-post"></span>post-transition
      <span class="pt-k pt-metalloid"></span>metalloid
      <span class="pt-k pt-nonmetal"></span>nonmetal
      <span class="pt-k pt-halogen"></span>halogen
      <span class="pt-k pt-noble"></span>noble gas
      <span class="pt-k pt-lanthanide"></span>lanthanide
      <span class="pt-k pt-actinide"></span>actinide
    </div>
  </div>
</div>
<script>
(function () {
  "use strict";
  // [Z, symbol, atomic mass, category]
  var E = [
    [1,"H",1.008,"nonmetal"],[2,"He",4.003,"noble"],[3,"Li",6.94,"alkali"],[4,"Be",9.012,"alkaline"],
    [5,"B",10.81,"metalloid"],[6,"C",12.011,"nonmetal"],[7,"N",14.007,"nonmetal"],[8,"O",15.999,"nonmetal"],

    [13,"Al",26.982,"post"],[14,"Si",28.085,"metalloid"],[15,"P",30.974,"nonmetal"],[16,"S",32.06,"nonmetal"],
    [17,"Cl",35.45,"halogen"],[18,"Ar",39.948,"noble"],[19,"K",39.098,"alkali"],[20,"Ca",40.078,"alkaline"],
    [21,"Sc",44.956,"transition"],[22,"Ti",47.867,"transition"],[23,"V",50.942,"transition"],[24,"Cr",51.996,"transition"],
    [25,"Mn",54.938,"transition"],[26,"Fe",55.845,"transition"],[27,"Co",58.933,"transition"],[28,"Ni",58.693,"transition"],
    [29,"Cu",63.546,"transition"],[30,"Zn",65.38,"transition"],[31,"Ga",69.723,"post"],[32,"Ge",72.630,"metalloid"],
    [33,"As",74.922,"metalloid"],[34,"Se",78.971,"nonmetal"],[35,"Br",79.904,"halogen"],[36,"Kr",83.798,"noble"],
    [37,"Rb",85.468,"alkali"],[38,"Sr",87.62,"alkaline"],[39,"Y",88.906,"transition"],[40,"Zr",91.224,"transition"],
    [41,"Nb",92.906,"transition"],[42,"Mo",95.95,"transition"],[43,"Tc",98,"transition"],[44,"Ru",101.07,"transition"],
    [45,"Rh",102.906,"transition"],[46,"Pd",106.42,"transition"],[47,"Ag",107.868,"transition"],[48,"Cd",112.414,"transition"],
    [49,"In",114.818,"post"],[50,"Sn",118.710,"post"],[51,"Sb",121.760,"metalloid"],[52,"Te",127.60,"metalloid"],
    [53,"I",126.904,"halogen"],[54,"Xe",131.293,"noble"],[55,"Cs",132.905,"alkali"],[56,"Ba",137.327,"alkaline"],
    [57,"La",138.905,"lanthanide"],[58,"Ce",140.116,"lanthanide"],[59,"Pr",140.908,"lanthanide"],[60,"Nd",144.242,"lanthanide"],
    [61,"Pm",145,"lanthanide"],[62,"Sm",150.36,"lanthanide"],[63,"Eu",151.964,"lanthanide"],[64,"Gd",157.25,"lanthanide"],

    [109,"Mt",278,"post"],[110,"Ds",281,"post"],[111,"Rg",282,"post"],[112,"Cn",285,"transition"],
    [113,"Nh",286,"post"],[114,"Fl",289,"post"],[115,"Mc",290,"post"],[116,"Lv",293,"post"],
    [117,"Ts",294,"halogen"],[118,"Og",294,"noble"]
  ];
  function pos(z) {
    if (z === 1) return [1, 1];
    if (z === 2) return [1, 18];
    if (z <= 4) return [2, z - 2];
    if (z <= 10) return [2, z + 8];
    if (z <= 12) return [3, z - 10];
    if (z <= 18) return [3, z];
    if (z <= 36) return [4, z - 18];
    if (z <= 54) return [5, z - 36];
    if (z === 55) return [6, 1];
    if (z === 56) return [6, 2];
    if (z <= 71) return [9, z - 57 + 3];          // lanthanide row
    if (z <= 86) return [6, z - 68];              // 72→g4 … 86→g18
    if (z === 87) return [7, 1];
    if (z === 88) return [7, 2];
    if (z <= 103) return [10, z - 89 + 3];        // actinide row
    return [7, z - 100];                          // 104→g4 … 118→g18
  }
  var grid = document.getElementById("pt-grid");
  if (!grid) return;
  E.forEach(function (e) {
    var z = e[0], rc = pos(z);
    var cell = document.createElement("div");
    cell.className = "pt-el pt-" + e[3];
    cell.style.gridRow = rc[0];
    cell.style.gridColumn = rc[1];
    cell.innerHTML = "<span class='pt-z'>" + z + "</span><span class='pt-sym'>" + e[1] +
                     "</span><span class='pt-mass'>" + e[2] + "</span>";
    cell.title = e[1] + " · " + e[2] + " u";
    grid.appendChild(cell);
  });
  var overlay = document.getElementById("exam-pt");
  document.getElementById("exam-pt-open").addEventListener("click", function () {
    overlay.hidden = false;
  });
  document.getElementById("exam-pt-close").addEventListener("click", function () {
    overlay.hidden = true;
  });
  overlay.addEventListener("click", function (ev) {
    if (ev.target === overlay) overlay.hidden = true;
  });
  document.addEventListener("keydown", function (ev) {
    if (ev.key === "Escape") overlay.hidden = true;
  });
})();
</script>
