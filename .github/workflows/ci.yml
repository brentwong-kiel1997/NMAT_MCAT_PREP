name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # weasyprint needs system pango/cairo — CI only exercises the test
      # suite and the content validator, so skip it (nothing imports it lazily
      # outside the PDF view).
      - name: Install deps
        run: pip install "Django>=5.0,<6" "PyYAML>=6,<7" "cryptography>=42"

      - name: Django checks
        run: |
          export DJANGO_SECRET_KEY=ci-test-key-not-secret
          python manage.py check
          python manage.py makemigrations --check --dry-run

      - name: Content validation
        run: |
          export DJANGO_SECRET_KEY=ci-test-key-not-secret
          python manage.py validate_content

      - name: Tests
        run: |
          export DJANGO_SECRET_KEY=ci-test-key-not-secret
          python manage.py test -v 1
