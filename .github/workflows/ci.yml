name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # install the exact production lockfile; weasyprint's wheels install
      # fine (only rendering needs system pango, which CI never triggers)
      - name: Install deps
        run: pip install -r requirements.lock

      - name: Django checks
        run: |
          export DJANGO_SECRET_KEY=ci-test-key-not-secret
          python manage.py check
          python manage.py makemigrations --check --dry-run

      - name: Content validation
        run: |
          export DJANGO_SECRET_KEY=ci-test-key-not-secret
          python manage.py validate_content

      - name: Tests
        run: |
          export DJANGO_SECRET_KEY=ci-test-key-not-secret
          python manage.py test -v 1
