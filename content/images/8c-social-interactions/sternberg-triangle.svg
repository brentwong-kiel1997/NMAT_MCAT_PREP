<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 344" font-family="system-ui, sans-serif">
  <rect width="500" height="344" fill="#fffdf8"/>
  <text x="250" y="32" font-size="18" font-weight="700" fill="#0d3d3a" text-anchor="middle">Sternberg's Triangular Model of Love</text>
  <text x="250" y="52" font-size="12" fill="#666" text-anchor="middle">three components, eight types</text>

  <rect x="40" y="70" width="420" height="52" rx="8" fill="#105652" opacity="0.08" stroke="#105652" stroke-width="1.5"/>
  <text x="60" y="92" font-size="15" font-weight="600" fill="#0d3d3a">Intimacy</text>
  <text x="60" y="110" font-size="12" fill="#44423a">closeness, connectedness</text>
  <text x="250" y="133" font-size="16" fill="#105652" text-anchor="middle">↓</text>
  <rect x="40" y="136" width="420" height="52" rx="8" fill="#0e7490" opacity="0.08" stroke="#0e7490" stroke-width="1.5"/>
  <text x="60" y="158" font-size="15" font-weight="600" fill="#0d3d3a">Passion</text>
  <text x="60" y="176" font-size="12" fill="#44423a">attraction, romance</text>
  <text x="250" y="199" font-size="16" fill="#105652" text-anchor="middle">↓</text>
  <rect x="40" y="202" width="420" height="52" rx="8" fill="#105652" opacity="0.08" stroke="#105652" stroke-width="1.5"/>
  <text x="60" y="224" font-size="15" font-weight="600" fill="#0d3d3a">Commitment</text>
  <text x="60" y="242" font-size="12" fill="#44423a">decision to maintain</text>
  <text x="250" y="265" font-size="16" fill="#105652" text-anchor="middle">↓</text>
  <rect x="40" y="268" width="420" height="52" rx="8" fill="#0e7490" opacity="0.08" stroke="#0e7490" stroke-width="1.5"/>
  <text x="60" y="290" font-size="15" font-weight="600" fill="#0d3d3a">All three = Consummate</text>
  <text x="60" y="308" font-size="12" fill="#44423a">any subset = a named type</text>
</svg>