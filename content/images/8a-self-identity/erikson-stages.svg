<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 542" font-family="system-ui, sans-serif">
  <rect width="500" height="542" fill="#fffdf8"/>
  <text x="250" y="32" font-size="18" font-weight="700" fill="#0d3d3a" text-anchor="middle">Erikson's Eight Stages</text>
  <text x="250" y="52" font-size="12" fill="#666" text-anchor="middle">psychosocial crises across the lifespan</text>

  <rect x="40" y="70" width="420" height="52" rx="8" fill="#105652" opacity="0.08" stroke="#105652" stroke-width="1.5"/>
  <text x="60" y="92" font-size="15" font-weight="600" fill="#0d3d3a">Trust vs. Mistrust</text>
  <text x="60" y="110" font-size="12" fill="#44423a">infancy — is the world safe?</text>
  <text x="250" y="133" font-size="16" fill="#105652" text-anchor="middle">↓</text>
  <rect x="40" y="136" width="420" height="52" rx="8" fill="#0e7490" opacity="0.08" stroke="#0e7490" stroke-width="1.5"/>
  <text x="60" y="158" font-size="15" font-weight="600" fill="#0d3d3a">Autonomy vs. Shame</text>
  <text x="60" y="176" font-size="12" fill="#44423a">toddler — will vs. control</text>
  <text x="250" y="199" font-size="16" fill="#105652" text-anchor="middle">↓</text>
  <rect x="40" y="202" width="420" height="52" rx="8" fill="#105652" opacity="0.08" stroke="#105652" stroke-width="1.5"/>
  <text x="60" y="224" font-size="15" font-weight="600" fill="#0d3d3a">Industry vs. Inferiority</text>
  <text x="60" y="242" font-size="12" fill="#44423a">school age — competence</text>
  <text x="250" y="265" font-size="16" fill="#105652" text-anchor="middle">↓</text>
  <rect x="40" y="268" width="420" height="52" rx="8" fill="#0e7490" opacity="0.08" stroke="#0e7490" stroke-width="1.5"/>
  <text x="60" y="290" font-size="15" font-weight="600" fill="#0d3d3a">Identity vs. Role Confusion</text>
  <text x="60" y="308" font-size="12" fill="#44423a">adolescence — who am I?</text>
  <text x="250" y="331" font-size="16" fill="#105652" text-anchor="middle">↓</text>
  <rect x="40" y="334" width="420" height="52" rx="8" fill="#105652" opacity="0.08" stroke="#105652" stroke-width="1.5"/>
  <text x="60" y="356" font-size="15" font-weight="600" fill="#0d3d3a">Intimacy vs. Isolation</text>
  <text x="60" y="374" font-size="12" fill="#44423a">young adult — deep bonds</text>
  <text x="250" y="397" font-size="16" fill="#105652" text-anchor="middle">↓</text>
  <rect x="40" y="400" width="420" height="52" rx="8" fill="#0e7490" opacity="0.08" stroke="#0e7490" stroke-width="1.5"/>
  <text x="60" y="422" font-size="15" font-weight="600" fill="#0d3d3a">Generativity vs. Stagnation</text>
  <text x="60" y="440" font-size="12" fill="#44423a">midlife — contribution</text>
  <text x="250" y="463" font-size="16" fill="#105652" text-anchor="middle">↓</text>
  <rect x="40" y="466" width="420" height="52" rx="8" fill="#105652" opacity="0.08" stroke="#105652" stroke-width="1.5"/>
  <text x="60" y="488" font-size="15" font-weight="600" fill="#0d3d3a">Integrity vs. Despair</text>
  <text x="60" y="506" font-size="12" fill="#44423a">late life — looking back</text>
</svg>