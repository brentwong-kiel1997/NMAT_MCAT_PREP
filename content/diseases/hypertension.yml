slug: hypertension
name: Essential Hypertension
short: Most hypertension has no single cause; it is the leading modifiable risk factor for cardiovascular
  and cerebrovascular events.
systems:
- Cardiovascular
- Renal
exams:
- Enrichment
exam_fit: Extension reading serving biology/pathophysiology intuition; the NMAT syllabus is introductory
  coursework, not clinical management; MCAT transfers the mechanisms, not guideline-level drug regimens.
pathogen: 'Multifactorial: genetics, salt sensitivity, sympathetic tone, RAAS, vascular stiffening'
transmission: Not applicable.
pathophysiology:
- Imbalance between cardiac output and peripheral resistance; chronic elevation drives vascular remodeling.
- 'RAAS: renin → angiotensin II → aldosterone → sodium retention and vasoconstriction.'
- 'Target organs: heart (LVH), brain, kidney, retina, vasculature.'
clinical:
- Usually asymptomatic ("silent"); headache is not a reliable marker.
- 'Emergency: markedly elevated BP with acute target-organ damage (encephalopathy, ACS, pulmonary edema).'
- 'Long term: stroke, heart failure, CKD, PAD.'
diagnosis:
- Repeated, standardized measurement; office and ambulatory readings corroborate each other.
- 'Secondary clues: young onset, hypokalemia, abdominal bruit, paroxysmal episodes.'
treatment:
- Salt restriction, weight loss, exercise, alcohol moderation.
- 'First-line classes: ACEI/ARB, CCB, thiazide diuretic (individualized).'
- With diabetes/CKD, ACEI/ARB are often preferred (exam favorite).
high_yield:
- BP = CO × TPR — formula-level understanding questions.
- 'ACEI: dry cough, hyperkalemia, angioedema; contraindicated in pregnancy.'
- Essential (primary) disease dominates — think common causes first, then screen for secondary.
- 'MCAT angle: homeostasis, negative feedback, and endocrine axes.'
mcat_bridge: Circulatory physiology, hormonal regulation, and homeostasis.
nmat_bridge: Cardiovascular pharmacology and target-organ damage pathways.
