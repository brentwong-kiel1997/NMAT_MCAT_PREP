slug: myocardial-infarction
name: Myocardial Infarction
short: Acute coronary occlusion causing myocyte necrosis; ischemic time and reperfusion are the life-or-death
  axis.
systems:
- Cardiovascular
exams:
- Enrichment
exam_fit: Extension reading serving biology/pathophysiology intuition; the NMAT syllabus is introductory
  coursework, not clinical management; MCAT transfers the mechanisms, not guideline-level drug regimens.
pathogen: Usually atherosclerotic plaque rupture + thrombosis
transmission: 'Not applicable. Risk factors: smoking, hypertension, diabetes, dyslipidemia, family history.'
pathophysiology:
- Oxygen supply–demand mismatch → ischemia → injury → necrosis (time-dependent).
- 'STEMI: transmural injury with ST elevation; NSTEMI: predominantly subendocardial.'
- 'Necrosis biomarkers: (high-sensitivity) troponin is the key marker.'
clinical:
- Crushing chest pressure radiating to the left arm/jaw; diaphoresis, nausea.
- Women, diabetics, and the elderly may present atypically.
- 'Complications: arrhythmia, heart failure, ventricular aneurysm, mechanical complications (memorize
  the time windows).'
diagnosis:
- ECG + troponin + clinical presentation.
- 'STEMI: recognize the urgent reperfusion criteria.'
treatment:
- Memory frameworks like MONA-BASH at awareness level; the core is antiplatelet, anticoagulation, and
  reperfusion.
- 'STEMI: primary PCI preferred; thrombolysis when PCI is unavailable.'
- 'Secondary prevention: statin, dual antiplatelet therapy, β-blocker, ACEI, lifestyle.'
high_yield:
- '"Time is muscle": the door-to-balloon concept.'
- Troponin is more specific/sensitive than CK-MB (modern exam standard).
- Left anterior descending occlusion typically involves the anterior wall.
- 'MCAT: interrupted aerobic metabolism → lactate, ATP depletion, membrane-pump failure.'
mcat_bridge: Cellular respiration, membrane potential, and circulatory anatomy.
nmat_bridge: Acute coronary syndrome classification and emergency priorities.
