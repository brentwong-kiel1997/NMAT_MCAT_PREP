slug: type-2-diabetes
name: Type 2 Diabetes Mellitus
short: Insulin resistance + relative insulin secretory failure; the core disease of the metabolic syndrome
  and a high-frequency topic for both NMAT and MCAT.
systems:
- Endocrine
- Metabolic
exams:
- Enrichment
exam_fit: Extension reading serving biology/pathophysiology intuition; the NMAT syllabus is introductory
  coursework, not clinical management; MCAT transfers the mechanisms, not guideline-level drug regimens.
pathogen: Non-communicable; genetic susceptibility + environment (obesity, sedentary lifestyle, diet)
transmission: Not applicable (non-communicable). Familial clustering and lifestyle links.
pathophysiology:
- Adipose/muscle become insulin-insensitive → compensatory hyperinsulinemia.
- Beta cells gradually decompensate → hyperglycemia.
- 'Chronic hyperglycemia: AGEs, oxidative stress, micro- and macrovascular damage.'
clinical:
- Polydipsia, polyuria, polyphagia, fatigue; often insidious onset.
- 'Complications: retinopathy, nephropathy, neuropathy, ASCVD, foot ulcers.'
- 'Acute: HHS (hyperosmolar hyperglycemic state) more than DKA (DKA tilts toward type 1).'
diagnosis:
- Fasting glucose ≥126 mg/dL, or HbA1c ≥6.5%, or 2-hour OGTT ≥200 (memorize the thresholds).
- Symptoms plus random glucose ≥200 also establishes the diagnosis.
treatment:
- Lifestyle is the foundation; metformin is the classic first-line oral agent (reduces hepatic glucose
  output).
- 'Others: SGLT2 inhibitors, GLP-1 receptor agonists, insulin as disease progresses.'
- Control BP and lipids; screen retinal exam and urine albumin.
high_yield:
- Insulin resistance (type 2) vs absolute deficiency (type 1) — a favorite mechanism question.
- 'Metformin: GI side effects; lactic acidosis is rare but classically associated.'
- HbA1c reflects roughly the 2–3 month average glucose.
- 'MCAT: signal transduction (insulin-receptor tyrosine kinase) is a frequent tie-in.'
mcat_bridge: Hormone signaling, metabolic pathways, feedback regulation, and chronic-disease epidemiology.
nmat_bridge: Endocrine physiology, diagnostic thresholds, and first-line drug mechanisms.
