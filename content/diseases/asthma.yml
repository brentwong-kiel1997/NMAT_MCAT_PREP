slug: asthma
name: Asthma
short: Reversible airway obstruction + hyperresponsiveness + chronic inflammation; type I hypersensitivity
  and the Th2 pathway are the mechanistic core.
systems:
- Respiratory
- Immunologic
exams:
- Enrichment
exam_fit: Extension reading serving biology/pathophysiology intuition; the NMAT syllabus is introductory
  coursework, not clinical management; MCAT transfers the mechanisms, not guideline-level drug regimens.
pathogen: Non-infectious; triggers include allergens, infection, exercise, cold air
transmission: Not applicable.
pathophysiology:
- Th2 cytokines IL-4/IL-5/IL-13 → IgE class switching, eosinophilia, mucus hypersecretion.
- 'Early phase: bronchospasm; late phase: inflammatory cell influx.'
- 'Long term: airway remodeling (thickened basement membrane, smooth-muscle hyperplasia).'
clinical:
- Episodic wheeze, dyspnea, chest tightness, dry cough; worse at night and early morning.
- Expiratory wheezing; accessory-muscle use in severe attacks.
- In critical attacks the chest may go "silent" (almost no wheeze) — a danger sign.
diagnosis:
- 'Spirometry: reversible FEV1 improvement (bronchodilator responsiveness).'
- Peak-flow variability; allergy workup as indicated.
treatment:
- 'Relief: short-acting β2 agonist (SABA).'
- 'Control: inhaled corticosteroid (ICS) is the anti-inflammatory cornerstone; LABA may be added.'
- 'Severe: systemic steroids, magnesium, escalation (biologics — awareness level only).'
high_yield:
- Type I hypersensitivity = IgE + mast-cell degranulation.
- Poor ICS adherence is a common cause of uncontrolled disease.
- Aspirin-sensitive asthma ↔ nasal polyps (Samter's triad) — awareness level.
- 'Versus COPD: reversibility, age of onset, and smoking history are the key discriminators.'
mcat_bridge: Hypersensitivity classifications and respiratory mechanics (increased resistance).
nmat_bridge: Immune pathology and the inhaled-therapy stepwise approach.
