slug: acute-kidney-injury
name: Acute Kidney Injury
short: Abrupt loss of kidney function over hours to days; classify pre-renal / intrinsic / post-renal
  first, then answer mechanism questions.
systems:
- Renal
exams:
- Enrichment
exam_fit: Extension reading serving biology/pathophysiology intuition; the NMAT syllabus is introductory
  coursework, not clinical management; MCAT transfers the mechanisms, not guideline-level drug regimens.
pathogen: Causes classified as hypoperfusion, parenchymal injury, obstruction
transmission: Not applicable.
pathophysiology:
- 'Pre-renal: reduced effective circulating volume → lower GFR (kidney structure initially intact, process
  reversible).'
- 'Acute tubular necrosis (ATN): ischemic or toxic injury; muddy-brown granular casts are typical.'
- 'Post-renal: urinary obstruction → pressure injury to nephrons.'
clinical:
- Oliguria or non-oliguria; fatigue, nausea, edema, hypertension.
- Hyperkalemia, metabolic acidosis, volume overload, uremic symptoms.
- Medication history (NSAIDs, aminoglycosides, contrast) matters.
diagnosis:
- Acute creatinine rise, urine-output changes.
- FeNa/FeUrea, urinalysis, ultrasound to exclude obstruction.
- 'Pre-renal vs ATN: urine sodium and concentrating ability — the classic comparison question.'
treatment:
- Correct the cause and restore perfusion; stop nephrotoxic drugs.
- 'Manage complications: hyperkalemia, acidosis, pulmonary edema.'
- 'Dialysis indications: the AEIOU mnemonic (Acidosis, Electrolytes, Intoxication, Overload, Uremia).'
high_yield:
- 'Localize first: pre-renal / intrinsic / post-renal.'
- Muddy-brown granular casts ↔ ATN.
- ACEI + NSAID + diuretic can combine into hemodynamic AKI.
- 'MCAT: filtration, reabsorption, and homeostasis (potassium / acid-base).'
mcat_bridge: Renal physiology and body-fluid electrolyte balance.
nmat_bridge: Clinical classification reasoning and acute-care priorities.
