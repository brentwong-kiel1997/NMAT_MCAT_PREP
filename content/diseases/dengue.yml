slug: dengue
name: Dengue Fever
short: Dengue virus transmitted by Aedes aegypti; a common arboviral disease in the Philippines. Exam-relevant
  themes are plasma leakage and antibody-dependent enhancement.
systems:
- Infectious
- Hematologic
exams:
- Enrichment
exam_fit: Extension reading serving biology/pathophysiology intuition; the NMAT syllabus is introductory
  coursework, not clinical management; MCAT transfers the mechanisms, not guideline-level drug regimens.
pathogen: Dengue virus (Flavivirus, +ssRNA); serotypes DENV-1–4
transmission: Aedes aegypti (daytime biting); human–mosquito–human cycle.
pathophysiology:
- Infects endothelium and immune cells, triggering a cytokine-storm-like response.
- Secondary infection with a heterologous serotype can worsen disease via ADE (antibody-dependent enhancement).
- Vascular permeability increases → plasma leakage → shock (DSS) and bleeding risk.
clinical:
- Sudden high fever, severe headache, retro-orbital pain, myalgia/arthralgia ("breakbone fever").
- Rash, thrombocytopenia, leukopenia.
- 'The dangerous phase often follows defervescence: abdominal pain, persistent vomiting, mucosal bleeding,
  rising hematocrit.'
diagnosis:
- NS1 antigen (early), IgM/IgG serology, PCR.
- 'Monitoring: platelets, hematocrit, vital signs, and fluid balance.'
treatment:
- 'Mainly supportive: cautious fluid replacement; avoid NSAIDs (bleeding risk).'
- Recognize the plasma-leakage window and follow severe-dengue fluid management.
- No specific first-line antiviral is a standard exam fact.
high_yield:
- Worry most AFTER the fever falls — the classic trap question.
- 'ADE: non-neutralizing antibodies facilitate viral entry into Fc-receptor cells.'
- 'Versus chikungunya/Zika: marked thrombocytopenia favors dengue.'
- Vector control = eliminating standing-water containers (a Philippine community point).
mcat_bridge: Viral structure, vector transmission, humoral immunity, and the ADE mechanism.
nmat_bridge: Tropical medicine and public health; laboratory values and danger-sign recognition.
