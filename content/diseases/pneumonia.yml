slug: pneumonia
name: Community-Acquired Pneumonia
short: Alveolar infection causing exudate and impaired gas exchange; the pathogen spectrum and empirical
  therapy are high-yield exam topics.
systems:
- Respiratory
- Infectious
exams:
- Enrichment
exam_fit: Extension reading serving biology/pathophysiology intuition; the NMAT syllabus is introductory
  coursework, not clinical management; MCAT transfers the mechanisms, not guideline-level drug regimens.
pathogen: 'Typical: Streptococcus pneumoniae; atypical: Mycoplasma, Chlamydia, Legionella'
transmission: Aspiration of colonized oropharyngeal flora, or droplets; disease when host defenses fail.
pathophysiology:
- Pathogens reach distal airways → inflammatory exudate fills alveoli.
- V/Q mismatch and shunt → hypoxemia.
- Lobar vs bronchopneumonia patterns are classic exam contrasts.
clinical:
- Fever, productive cough, dyspnea, pleuritic pain; crackles/consolidation signs on exam.
- 'Pneumococcus: abrupt rigors, rust-colored sputum (the classic description).'
- Elderly patients may present atypically (confusion, low-grade fever).
diagnosis:
- Clinical picture plus infiltrate on chest X-ray.
- Sputum/blood cultures and urinary antigens (pneumococcus/Legionella) when needed.
- CURB-65 and similar scores for severity stratification (as a memory framework).
treatment:
- Empirical coverage of typical ± atypical organisms (per local guidelines).
- Oxygen, fluids, antipyretic support.
- 'Vaccines: pneumococcal and influenza vaccination reduce risk.'
high_yield:
- Streptococcus pneumoniae is the most common bacterial cause of CAP.
- 'Mycoplasma: young patients, dry cough, extrapulmonary features; no cell wall → β-lactams ineffective.'
- 'Legionella: water-system exposure, hyponatremia, GI symptoms.'
- Consolidation = bronchial breath sounds and increased tactile fremitus.
mcat_bridge: Gas exchange, inflammation, and immune system response.
nmat_bridge: Respiratory pathology and the reasoning behind empirical antimicrobial choice.
