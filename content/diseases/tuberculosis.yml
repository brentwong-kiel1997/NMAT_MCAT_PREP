slug: tuberculosis
name: Tuberculosis
short: Chronic granulomatous infection with Mycobacterium tuberculosis; a high-burden disease in the Philippines.
  Read as a biology/immunology extension, not a standalone NMAT clinical subject.
systems:
- Respiratory
- Infectious
exams:
- Enrichment
exam_fit: MCAT — immunology/infection fundamentals transfer well; NMAT — only indirectly useful when it
  maps onto intro cell/immune concepts; clinical management details are outside the CEM scope.
pathogen: Mycobacterium tuberculosis (acid-fast bacillus, intracellular pathogen)
transmission: Airborne droplet nuclei; risk is highest in enclosed spaces with prolonged exposure.
pathophysiology:
- Inhaled bacilli are phagocytosed by alveolar macrophages but survive intracellularly.
- Cell-mediated immunity (Th1 / IFN-γ) drives granuloma formation that contains the spread.
- Primary infection is usually latent (LTBI); immunosuppression can reactivate it into active TB.
clinical:
- Chronic cough, hemoptysis, night sweats, weight loss, low-grade afternoon fever.
- Cavitary lesions classically in the apical-posterior upper lobes (reactivation disease).
- 'Extrapulmonary sites: lymph nodes, bone, genitourinary tract, meninges (TB meningitis); miliary TB is disseminated disease, not a single site.'
diagnosis:
- Sputum acid-fast smear, GeneXpert / NAAT, culture (gold standard but slow).
- 'Chest X-ray: upper-lobe infiltrates or cavitation.'
- 'LTBI: TST or IGRA (neither distinguishes active from latent disease).'
treatment:
- 'Active pulmonary TB: RIPE (Rifampin, Isoniazid, Pyrazinamide, Ethambutol) intensive phase followed
  by continuation phase.'
- Watch hepatotoxicity, optic neuritis (ethambutol), orange discoloration of urine (rifampin).
- 'LTBI: short-course isoniazid or rifampin regimens per guidelines.'
high_yield:
- Granuloma = macrophages + lymphocytes; caseous necrosis is the classic pathology.
- BCG vaccination can skew the TST; IGRA is relatively unaffected by BCG.
- HIV is one of the strongest reactivation risk factors; presentation may be atypical when CD4 is low.
- 'Philippine context: high public-health burden — exposure history and crowded housing matter.'
mcat_bridge: Links cell-mediated immunity, granulomatous inflammation, and public-health epidemiology
  (transmission models of infectious disease).
nmat_bridge: 'Biology/health science: pathogen, immune evasion, acid-fast staining, and first-line drug
  side effects.'
