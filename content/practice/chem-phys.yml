slug: chem-phys
items:
- id: cp-1
  q: 'A small drop in vessel radius typically makes laminar flow:'
  choices:
    A: Almost unchanged
    B: Drop sharply (highly radius-sensitive)
    C: Must rise
    D: Independent of radius
  answer: B
  explain: Poiseuille flow scales with radius to the fourth power.
  chapter: 4B · Fluids for circulation and gas exchange
- id: cp-2
  q: 'At equilibrium in a reversible reaction:'
  choices:
    A: Forward and reverse rates are equal; macroscopic composition is steady
    B: All reactions stop
    C: Only products remain
    D: Temperature must be zero
  answer: A
  explain: 'Equilibrium is dynamic: reactions continue microscopically while macroscopic amounts stay
    constant.'
  chapter: 5E · Chemical thermodynamics and kinetics
- id: cp-3
  q: 'A strong electrolyte in aqueous solution:'
  choices:
    A: Ionizes almost completely
    B: Does not ionize at all
    C: Exists only as neutral molecules
    D: Cannot conduct electricity
  answer: A
  explain: E.g., NaCl and strong acids/bases dissociate nearly fully; weak electrolytes dissociate partially.
  chapter: 5A · Unique nature of water and its solutions
- id: cp-4
  q: 'In a series circuit, the current:'
  choices:
    A: Is the same through each element
    B: Differs randomly at each element
    C: Is always zero
    D: Exists only inside the battery
  answer: A
  explain: One path in series → charge conservation gives the same current everywhere; voltage divides
    across elements.
  chapter: 4C · Electrochemistry and electrical circuits
- id: cp-5
  q: 'For sound in air (a longitudinal wave), particle vibration is:'
  choices:
    A: Parallel to the direction of propagation
    B: Perpendicular to propagation
    C: There is no vibration
    D: Only transverse, never longitudinal
  answer: A
  explain: Longitudinal waves travel via compressions and rarefactions; transverse waves vibrate perpendicular
    to travel.
  chapter: 4D · Light and sound interacting with matter
- id: cp-6
  q: 'Gel electrophoresis separates DNA fragments mainly by:'
  choices:
    A: Size (length)
    B: Color
    C: Odor
    D: Radioactivity alone
  answer: A
  explain: Negatively charged DNA migrates toward the anode; shorter fragments move faster.
  chapter: 5C · Separation and purification methods
- id: cp-7
  q: 'Half-life is:'
  choices:
    A: Time for activity of a radionuclide to fall by half
    B: Time for any reaction to reach 50% completion (general kinetics)
    C: Electron orbital radius
    D: Half the speed of light
  answer: A
  explain: Radioactive decay is exponential; half-life is the characteristic time for first-order decay.
  chapter: 4E · Atoms, nuclear decay, electronic structure
- id: cp-8
  q: 'In the photoelectric effect, raising intensity (above threshold frequency) mainly increases:'
  choices:
    A: Max KE per electron
    B: Number of electrons emitted per time
    C: Work function
    D: Threshold frequency
  answer: B
  explain: Intensity sets photon count → photocurrent; frequency sets max KE.
  chapter: 4E · Atoms, nuclear decay, electronic structure
