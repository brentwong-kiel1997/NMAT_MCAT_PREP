slug: cars
items:
- id: cars-1
  q: 'On CARS, an option that is true in the world but absent from the passage is usually:'
  choices:
    A: Preferred
    B: A strong distractor to eliminate
    C: Equal to the main idea
    D: Proof of author bias
  answer: B
  explain: CARS is passage-bound; externally true claims without textual support are traps.
  chapter: Reasoning Within the Text
- id: cars-2
  q: 'Topic relates to thesis as:'
  choices:
    A: Always identical
    B: Topic is the subject; thesis is the author’s claim
    C: Thesis only appears in the last sentence
    D: Topic matters more so claims can be ignored
  answer: B
  explain: Separate what it’s about from what it argues.
  chapter: Foundations of Comprehension
- id: cars-3
  q: 'Reasoning Beyond the Text items usually require you to:'
  choices:
    A: Import outside facts and ignore the author’s principle
    B: Apply the passage principle consistently to a new scenario
    C: Only count word frequency
    D: Invert the author’s conclusion
  answer: B
  explain: Beyond-text reasoning still has to keep the passage principle intact.
  chapter: Reasoning Beyond the Text
- id: cars-4
  q: 'On CARS, options with extreme wording (always, never, only) should usually be:'
  choices:
    A: Chosen first
    B: Treated skeptically—they often overstate the passage
    C: Chosen while ignoring the stem
    D: Assumed to equal the author’s view
  answer: B
  explain: Academic prose is qualified; absolutist options are often overgeneralized distractors.
  chapter: Reasoning Within the Text
- id: cars-5
  q: 'When judging a paragraph’s function, ask:'
  choices:
    A: What role it plays in the argument (define, exemplify, rebut, etc.)
    B: Whether it is the longest paragraph
    C: Whether it contains numbers
    D: The author’s nationality
  answer: A
  explain: Structure questions test informational role, not isolated fact recall.
  chapter: Foundations of Comprehension
- id: cars-6
  q: 'An analogy item (Beyond the Text) works only if:'
  choices:
    A: The correspondence matches the passage principle
    B: The new scenario is as unfamiliar as possible
    C: It may violate the author’s premises
    D: Surface wording similarity is enough
  answer: A
  explain: Valid analogies preserve the logical relation, not mere surface similarity.
  chapter: Reasoning Beyond the Text
- id: cars-7
  q: 'Tone questions should be answered using:'
  choices:
    A: Overall diction and rhetorical stance in the text
    B: Your personal opinion of the topic
    C: The shortest option
    D: Publication year alone
  answer: A
  explain: Tone comes from word choice (cautious, critical, approving, etc.) and must be text-supported.
  chapter: Foundations of Comprehension
- id: cars-8
  q: 'CARS weaken questions should preferentially attack:'
  choices:
    A: The author’s hometown
    B: A key assumption or evidence link
    C: Font size
    D: Paragraph count
  answer: B
  explain: Weaken targets the reasoning structure, not irrelevant author trivia.
  chapter: Reasoning Beyond the Text
- id: cars-9
  q: 'Within-the-text reasoning answers must:'
  choices:
    A: Rely on outside specialist knowledge
    B: Be supported by passage evidence
    C: Always contradict the author
    D: Be as long as possible
  answer: B
  explain: Within the Text emphasizes locating textual support.
  chapter: Reasoning Within the Text
