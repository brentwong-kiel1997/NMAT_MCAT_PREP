slug: biochemistry
items:
- id: bioc-1
  q:
    zh: 酶通过下列哪项加速反应？
    en: 'Enzymes speed reactions primarily by:'
  choices:
    A:
      zh: 提高反应温度
      en: Raising temperature
    B:
      zh: 降低活化能
      en: Lowering activation energy
    C:
      zh: 改变 ΔG° 正负号
      en: Changing the sign of ΔG°
    D:
      zh: 消灭所有产物
      en: Destroying all products
  answer: B
  explain:
    zh: 酶稳定过渡态、降低活化能；不改变总热力学 ΔG。
    en: Enzymes stabilize the transition state and lower Ea; overall ΔG is unchanged.
  chapter: 1A · Proteins and amino acids
- id: bioc-2
  q:
    zh: 氧化磷酸化直接依赖：
    en: 'Oxidative phosphorylation most directly depends on:'
  choices:
    A:
      zh: 跨线粒体内膜的质子梯度
      en: A proton gradient across the inner mitochondrial membrane
    B:
      zh: 细胞核内的转录速率
      en: Nuclear transcription rate
    C:
      zh: 细胞膜胆固醇比例 alone
      en: Plasma-membrane cholesterol alone
    D:
      zh: 高尔基体出芽
      en: Golgi budding
  answer: A
  explain:
    zh: ETC 泵质子，ATP 合酶利用质子回流合成 ATP。
    en: ETC pumps protons; ATP synthase uses the return flow.
  chapter: 1D · Bioenergetics and fuel metabolism
- id: bioc-3
  q:
    zh: 蛋白质一级结构指的是：
    en: 'Primary protein structure refers to:'
  choices:
    A:
      zh: 氨基酸线性序列
      en: The linear sequence of amino acids
    B:
      zh: α 螺旋比例 alone
      en: Alpha-helix content alone
    C:
      zh: 多个亚基组装
      en: Assembly of multiple subunits
    D:
      zh: 与配体结合的位置 alone
      en: The binding site alone
  answer: A
  explain:
    zh: 一级结构是肽链顺序，决定更高层次折叠与功能。
    en: Primary structure is residue order, which constrains higher-order folding and function.
  chapter: 1A · Proteins and amino acids
- id: bioc-4
  q:
    zh: 转录发生在细胞的哪个区室（真核生物）？
    en: Where does transcription occur in eukaryotes?
  choices:
    A:
      zh: 细胞核
      en: Nucleus
    B:
      zh: 线粒体膜间隙 alone
      en: Mitochondrial intermembrane space alone
    C:
      zh: 高尔基体腔
      en: Golgi lumen
    D:
      zh: 细胞膜外
      en: Outside the plasma membrane
  answer: A
  explain:
    zh: DNA → mRNA 在核内；成熟 mRNA 出核后在胞质翻译。
    en: DNA is transcribed to mRNA in the nucleus; mature mRNA is translated in the cytoplasm.
  chapter: 1B · Gene to protein
- id: bioc-5
  q:
    zh: 点突变若造成错义（missense），意味着：
    en: 'A missense point mutation means:'
  choices:
    A:
      zh: 一个密码子编码不同氨基酸
      en: One codon codes for a different amino acid
    B:
      zh: 提前出现终止密码子
      en: A premature stop codon appears
    C:
      zh: 不改变氨基酸序列
      en: The amino acid sequence is unchanged
    D:
      zh: 删除整条染色体
      en: An entire chromosome is deleted
  answer: A
  explain:
    zh: 错义突变改变单个氨基酸；无义突变引入终止；同义突变不改变氨基酸。
    en: Missense swaps one amino acid; nonsense introduces stop; silent leaves the protein sequence unchanged.
  chapter: 1C · Heritable information & diversity
- id: bioc-6
  q:
    zh: 糖酵解的净产物（每分子葡萄糖）是：
    en: 'The net products of glycolysis per glucose are:'
  choices:
    A:
      zh: 2 ATP、2 NADH、2 丙酮酸
      en: 2 ATP, 2 NADH, 2 pyruvate
    B:
      zh: 38 ATP、无 NADH
      en: 38 ATP, no NADH
    C:
      zh: 仅 CO₂
      en: Only CO₂
    D:
      zh: 仅氧气
      en: Only O₂
  answer: A
  explain:
    zh: 糖酵解在胞质进行；消耗 2 ATP、产生 4 ATP，净得 2 ATP 与 2 NADH。
    en: Glycolysis occurs in the cytosol; 2 ATP invested and 4 produced → net 2 ATP plus 2 NADH.
  chapter: 1D · Bioenergetics and fuel metabolism
- id: bioc-7
  q:
    zh: 竞争性抑制剂对酶动力学的影响通常是：
    en: 'A competitive inhibitor typically:'
  choices:
    A:
      zh: Km 增大、Vmax 不变
      en: Increases Km with unchanged Vmax
    B:
      zh: Vmax 降为零、Km 不变
      en: Drops Vmax to zero with unchanged Km
    C:
      zh: Km 与 Vmax 均不变
      en: Leaves both Km and Vmax unchanged
    D:
      zh: 使酶变性沉淀
      en: Denatures and precipitates the enzyme
  answer: A
  explain:
    zh: 竞争抑制剂与底物争活性位点；高底物浓度可克服抑制，Vmax 可达。
    en: Competitive inhibitors bind the active site; high substrate can overcome inhibition, so Vmax is
      reachable.
  chapter: Chemistry · Biochemistry（CEM）
- id: bch-8
  q:
    zh: 竞争性抑制典型地使：
    en: 'Competitive inhibition typically:'
  choices:
    A:
      zh: Km 升高，Vmax 不变
      en: Raises Km, leaves Vmax unchanged
    B:
      zh: Km 降低，Vmax 升高
      en: Lowers Km and raises Vmax
    C:
      zh: Km 与 Vmax 都降低
      en: Lowers both Km and Vmax
    D:
      zh: Km 不变，Vmax 升高
      en: Leaves Km unchanged and raises Vmax
  answer: A
  explain:
    zh: 竞争抑制剂与底物争活性位点，可用更多底物克服（Vmax 可达）。
    en: Competitor fights for the active site; more substrate can still reach Vmax.
  chapter: Enzymes and regulation
- id: bch-9
  q:
    zh: 糖酵解净产 ATP（每葡萄糖）约为：
    en: 'Net ATP from glycolysis per glucose is about:'
  choices:
    A:
      zh: '0'
      en: '0'
    B:
      zh: '2'
      en: '2'
    C:
      zh: '32'
      en: '32'
    D:
      zh: 36–38
      en: 36–38
  answer: B
  explain:
    zh: 消耗 2、产生 4，净 2 ATP（另有 NADH）。
    en: Uses 2 and makes 4 → net 2 ATP (plus NADH).
  chapter: Metabolism and bioenergetics
