slug: biochemistry
items:
- id: bioc-1
  q: 'Enzymes speed reactions primarily by:'
  choices:
    A: Raising temperature
    B: Lowering activation energy
    C: Changing the sign of ΔG°
    D: Destroying all products
  answer: B
  explain: Enzymes stabilize the transition state and lower Ea; overall ΔG is unchanged.
  chapter: 1A · Proteins and amino acids
- id: bioc-2
  q: 'Oxidative phosphorylation most directly depends on:'
  choices:
    A: A proton gradient across the inner mitochondrial membrane
    B: Nuclear transcription rate
    C: Plasma-membrane cholesterol alone
    D: Golgi budding
  answer: A
  explain: ETC pumps protons; ATP synthase uses the return flow.
  chapter: 1D · Bioenergetics and fuel metabolism
- id: bioc-3
  q: 'Primary protein structure refers to:'
  choices:
    A: The linear sequence of amino acids
    B: Alpha-helix content alone
    C: Assembly of multiple subunits
    D: The binding site alone
  answer: A
  explain: Primary structure is residue order, which constrains higher-order folding and function.
  chapter: 1A · Proteins and amino acids
- id: bioc-4
  q: Where does transcription occur in eukaryotes?
  choices:
    A: Nucleus
    B: Mitochondrial intermembrane space alone
    C: Golgi lumen
    D: Outside the plasma membrane
  answer: A
  explain: DNA is transcribed to mRNA in the nucleus; mature mRNA is translated in the cytoplasm.
  chapter: 1B · Gene to protein
- id: bioc-5
  q: 'A missense point mutation means:'
  choices:
    A: One codon codes for a different amino acid
    B: A premature stop codon appears
    C: The amino acid sequence is unchanged
    D: An entire chromosome is deleted
  answer: A
  explain: Missense swaps one amino acid; nonsense introduces stop; silent leaves the protein sequence
    unchanged.
  chapter: 1C · Heritable information & diversity
- id: bioc-6
  q: 'The net products of glycolysis per glucose are:'
  choices:
    A: 2 ATP, 2 NADH, 2 pyruvate
    B: 38 ATP, no NADH
    C: Only CO₂
    D: Only O₂
  answer: A
  explain: Glycolysis occurs in the cytosol; 2 ATP invested and 4 produced → net 2 ATP plus 2 NADH.
  chapter: 1D · Bioenergetics and fuel metabolism
- id: bioc-7
  q: 'A competitive inhibitor typically:'
  choices:
    A: Increases Km with unchanged Vmax
    B: Drops Vmax to zero with unchanged Km
    C: Leaves both Km and Vmax unchanged
    D: Denatures and precipitates the enzyme
  answer: A
  explain: Competitive inhibitors bind the active site; high substrate can overcome inhibition, so Vmax
    is reachable.
  chapter: Chemistry · Biochemistry（CEM）
- id: bch-8
  q: 'Competitive inhibition typically:'
  choices:
    A: Raises Km, leaves Vmax unchanged
    B: Lowers Km and raises Vmax
    C: Lowers both Km and Vmax
    D: Leaves Km unchanged and raises Vmax
  answer: A
  explain: Competitor fights for the active site; more substrate can still reach Vmax.
  chapter: Enzymes and regulation
- id: bch-9
  q: 'Net ATP from glycolysis per glucose is about:'
  choices:
    A: '0'
    B: '2'
    C: '32'
    D: 36–38
  answer: B
  explain: Uses 2 and makes 4 → net 2 ATP (plus NADH).
  chapter: Metabolism and bioenergetics
