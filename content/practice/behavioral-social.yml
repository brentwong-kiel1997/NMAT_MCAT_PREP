slug: behavioral-social
items:
- id: beh-1
  q: 'In classical conditioning, the conditioned stimulus starts as:'
  choices:
    A: A stimulus that already elicits the response
    B: A neutral stimulus that comes to elicit the response after pairing
    C: A punisher
    D: A reinforcement schedule
  answer: B
  explain: A neutral cue paired with a UCS becomes a CS.
  chapter: Psychology
- id: beh-2
  q: 'The fundamental attribution error tends to:'
  choices:
    A: Overweight situation, underweight disposition
    B: Overweight disposition, underweight situation
    C: Deny all attribution
    D: Occur only in labs
  answer: B
  explain: Observers over-attribute others’ acts to personality vs situation.
  chapter: FC8 · Self, others, interactions
- id: beh-3
  q: 'In operant conditioning, reinforcement serves to:'
  choices:
    A: Decrease the chance the behavior recurs
    B: Increase the chance the behavior recurs
    C: Change attitudes only, never behavior
    D: Eliminate all stimuli
  answer: B
  explain: Reinforcement raises target-behavior frequency; punishment lowers it.
  chapter: Psychology
- id: beh-4
  q: 'Short-term memory capacity and duration are roughly:'
  choices:
    A: Unlimited capacity, lifelong
    B: Limited (~7±2 chunks), seconds to a minute
    C: Visual only, no auditory
    D: Identical to long-term memory
  answer: B
  explain: STM holds few chunks briefly; rehearsal and chunking extend retention.
  chapter: Psychology
- id: beh-5
  q: 'Social norms differ from laws mainly because norms:'
  choices:
    A: Are shared group expectations, not always formally enforced
    B: Apply only inside one person’s mind
    C: Are always looser than laws
    D: Are unrelated to behavior
  answer: A
  explain: Norms rely on socialization and informal sanction; laws are codified with formal enforcement.
  chapter: Sociology and Anthropology
- id: beh-6
  q: 'Figure–ground organization in perception means:'
  choices:
    A: Splitting a scene into a salient object and a less salient background
    B: Denying depth perception
    C: Processing only audition
    D: All stimuli are equally salient
  answer: A
  explain: The perceptual system tends to organize one region as figure and the rest as ground.
  chapter: FC6 · Perceive, think, react
- id: beh-7
  q: 'Cognitive dissonance theory predicts that when attitudes and behavior clash, people often:'
  choices:
    A: Change attitudes or reinterpret behavior to reduce discomfort
    B: Permanently lose memory
    C: Only increase arousal with no psychological change
    D: Always admit error immediately
  answer: A
  explain: Inconsistency is aversive, motivating attitude/belief shifts to restore consistency.
  chapter: FC7 · Behavior and behavior change
- id: beh-8
  q: 'The bystander effect is:'
  choices:
    A: More bystanders lower the chance any one person helps
    B: People never help when alone
    C: Affects only auditory attention
    D: Unrelated to diffusion of responsibility
  answer: A
  explain: Diffusion of responsibility and pluralistic ignorance reduce helping; clear responsibility
    weakens the effect.
  chapter: FC8 · Self, others, interactions
- id: beh-9
  q: 'Social facilitation typically means:'
  choices:
    A: Others’ presence improves simple/well-learned performance
    B: Others’ presence always worsens all performance
    C: No social influence at all
    D: Occurs only online
  answer: A
  explain: Arousal helps simple tasks; complex novel tasks may suffer.
  chapter: FC9 · Cultural and social differences
