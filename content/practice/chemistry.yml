slug: chemistry
items:
- id: chem-1
  q: 'A buffer resists pH change mainly because it has:'
  choices:
    A: Equal strong acid and strong base
    B: A weak acid and its conjugate base (or weak base + conjugate acid)
    C: Only pure water
    D: Elemental metals
  answer: B
  explain: Weak acid/conjugate-base pairs neutralize small added acid or base.
  chapter: General Chemistry
- id: chem-2
  q: 'Le Chatelier’s principle says a stressed equilibrium will:'
  choices:
    A: Stop reacting forever
    B: Shift to counteract the stress
    C: Only shift toward products
    D: Change atom identities
  answer: B
  explain: The system shifts to partially offset concentration/pressure/temperature stress.
  chapter: General Chemistry
- id: chem-3
  q: 'Accuracy differs from precision in that accuracy is about:'
  choices:
    A: Results clustering together
    B: Results near the true value
    C: Instrument price
    D: Sample color
  answer: B
  explain: Accuracy = closeness to truth; precision = repeatability.
  chapter: Analytical Chemistry
- id: chem-4
  q: 'A catalyst speeds a reaction by:'
  choices:
    A: Raising ΔG of the reaction
    B: Providing a lower-activation-energy path
    C: Changing product element identities
    D: Permanently consuming reactants against K
  answer: B
  explain: Catalysts change the path and lower Ea; overall ΔG / equilibrium position stay the same.
  chapter: 5E · Chemical thermodynamics and kinetics
- id: chem-5
  q: Which solution has a pH closest to 7 at 25 °C?
  choices:
    A: 0.1 M HCl
    B: 0.1 M NaOH
    C: Pure water
    D: Concentrated sulfuric acid
  answer: C
  explain: Neutral water has pH 7; strong acid/base solutions are far from 7.
  chapter: General Chemistry
- id: chem-6
  q: 'Carbon is tetravalent in organic chemistry mainly because it:'
  choices:
    A: Has 4 valence electrons and forms 4 covalent bonds
    B: Forms only ionic bonds
    C: Its nucleus is negatively charged
    D: Cannot form double bonds
  answer: A
  explain: Carbon’s hybridization allows single, double, and triple bonds that scaffold organic molecules.
  chapter: Organic Chemistry
- id: chem-7
  q: 'The titration endpoint is closest to:'
  choices:
    A: The experimental point where indicator color changes
    B: Zero solution volume
    C: A reaction that never occurs
    D: Doubling sample mass
  answer: A
  explain: The endpoint is signaled by indicator/instrument; the equivalence point is theoretical—they
    should be close.
  chapter: Analytical Chemistry
- id: chem-8
  q: 'Hydrogen bonding in water mainly contributes to its high specific heat by:'
  choices:
    A: Absorbing heat to break H-bonds without large temperature rise
    B: Making water boil at 0 °C
    C: Eliminating intermolecular forces
    D: Making water a strong electrolyte
  answer: A
  explain: The H-bond network stores thermal energy, buffering temperature swings—critical for life.
  chapter: 5A · Water and its solutions
- id: chem-9
  q: 'Raising temperature on an endothermic reaction typically:'
  choices:
    A: Increases K
    B: Decreases K
    C: Fixes K at 1
    D: Has no relation to K
  answer: A
  explain: Heating favors products in endothermic reactions (K rises); exothermic reactions show the opposite.
  chapter: 5E · Chemical thermodynamics and kinetics
- id: chem-10
  q: 'The peptide bond in proteins is mainly characterized by:'
  choices:
    A: Partial double-bond character and planarity
    B: Spontaneous cleavage at physiological pH
    C: Linking only lipids
    D: Containing no nitrogen
  answer: A
  explain: Resonance gives the peptide bond planarity and restricted rotation, shaping the protein backbone.
  chapter: Biochemistry
- id: chem-11
  q: 'For weak acid HA with pKa=4.8, at pH=4.8 the ratio [A⁻]/[HA] is about:'
  choices:
    A: '0.1'
    B: '1'
    C: '10'
    D: '100'
  answer: B
  explain: 'Henderson–Hasselbalch: at pH=pKa the conjugate base/acid ratio is ~1.'
  chapter: General Chemistry
- id: chem-12
  q: How does a catalyst affect a reversible reaction?
  choices:
    A: Changes equilibrium constant K
    B: Speeds forward and reverse rates, reaching equilibrium sooner
    C: Speeds only the forward reaction
    D: Raises ΔG
  answer: B
  explain: Catalysts affect both directions equally and do not change equilibrium composition.
  chapter: 5E · Chemical thermodynamics and kinetics
