slug: psych-soc
items:
- id: ps-1
  q: 'An absolute threshold is:'
  choices:
    A: The minimum intensity detectable (under a statistical definition)
    B: The smallest difference between two stimuli
    C: The maximum tolerable stimulus
    D: Mean reaction time
  answer: A
  explain: Absolute = detect presence; difference = detect change.
  chapter: 6A · Sensing the environment
- id: ps-2
  q: 'The just noticeable difference (JND) measures:'
  choices:
    A: The smallest detectable difference between two stimuli
    B: The absolute threshold
    C: Maximum pain tolerance
    D: Years of memory retention
  answer: A
  explain: JND concerns change detection; absolute threshold concerns detecting presence.
  chapter: 6A · Sensing the environment
- id: ps-3
  q: 'Bottom-up (data-driven) processing relies mainly on:'
  choices:
    A: Features of the sensory input itself
    B: Prior expectations alone
    C: Ignoring the stimulus entirely
    D: Using only long-term memory
  answer: A
  explain: Bottom-up builds percepts from sensory data; top-down uses context and expectations.
  chapter: 6B · Making sense of the environment
- id: ps-4
  q: 'The fight-or-flight response mainly involves the:'
  choices:
    A: Sympathetic nervous system
    B: Parasympathetic digestion alone
    C: Visual cortex alone
    D: Cerebellar language area
  answer: A
  explain: Sympathetic activation raises heart rate, breathing, and glucose mobilization for threat response.
  chapter: 6C · Responding to the world
- id: ps-5
  q: 'In classical conditioning, extinction is:'
  choices:
    A: Weakening of the CR after repeated CS without UCS
    B: Permanent deletion of memory genes
    C: Reinforcement increasing behavior
    D: Occurring only in operant conditioning
  answer: A
  explain: Extinction reflects learned inhibition, not erasure; spontaneous recovery can occur.
  chapter: 7A · Individual influences on behavior
- id: ps-6
  q: 'Conformity is most famously linked to:'
  choices:
    A: Asch’s line-judgment studies
    B: The Miller–Urey experiment
    C: The double-slit experiment
    D: The Krebs cycle
  answer: A
  explain: Asch showed group pressure can make people give clearly wrong answers.
  chapter: 7B · Social processes that influence behavior
- id: ps-7
  q: 'The central route to persuasion emphasizes:'
  choices:
    A: Argument quality and careful elaboration
    B: Celebrity attractiveness alone
    C: Number of stimuli alone
    D: Rejecting all information
  answer: A
  explain: Central route uses logic and evidence; peripheral route uses cues and heuristics.
  chapter: 7C · Attitude and behavior change
- id: ps-8
  q: 'The self-serving bias is the tendency to:'
  choices:
    A: Credit success to oneself and failures to external factors
    B: Always blame oneself
    C: Deny any self
    D: Remember only others’ failures
  answer: A
  explain: This bias protects self-esteem and a positive self-image.
  chapter: 8B · Social thinking
- id: ps-9
  q: 'Social stratification refers to:'
  choices:
    A: Hierarchical ranking and unequal distribution of status and resources
    B: Perfectly equal resources for everyone
    C: Geological rock layers only
    D: Neuronal lamination only
  answer: A
  explain: Stratification reflects structural inequality across class, education, income, and related
    dimensions.
  chapter: 10A · Social inequality
- id: ps-10
  q: 'After pairing a bell with food, the bell alone elicits salivation. The bell is the:'
  choices:
    A: Unconditioned stimulus
    B: Conditioned stimulus
    C: Unconditioned response
    D: Extinguished reinforcer
  answer: B
  explain: The once-neutral cue becomes the conditioned stimulus (CS).
  chapter: 6B · Making sense of the environment
- id: ps-11
  q: 'Socioeconomic status (SES) usually does NOT include:'
  choices:
    A: Income
    B: Education
    C: Occupation
    D: Blood type
  answer: D
  explain: SES composites income, education, occupation — not blood type.
  chapter: 10A · Social inequality
