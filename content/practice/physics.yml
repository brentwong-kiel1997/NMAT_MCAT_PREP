slug: physics
items:
- id: phy-1
  q: 'If net work on an object is positive, its kinetic energy:'
  choices:
    A: Must decrease
    B: Must increase
    C: Stays the same
    D: Is unrelated to work
  answer: B
  explain: 'Work–energy theorem: net work equals change in kinetic energy.'
  chapter: Mechanics
- id: phy-2
  q: 'The continuity equation for ideal flow mainly says:'
  choices:
    A: Smaller area → higher speed (volume flow conserved)
    B: Pressure is equal everywhere
    C: Temperature must rise
    D: Density must be zero
  answer: A
  explain: 'For incompressible flow: A₁v₁ = A₂v₂.'
  chapter: 4B · Fluids, circulation, gas exchange
- id: phy-3
  q: 'Ohm’s law relates V, I, and R as:'
  choices:
    A: V = I/R
    B: V = IR
    C: V = I + R
    D: V = R/I
  answer: B
  explain: V = IR is the basic linear-resistor relation.
  chapter: Electricity and Magnetism
- id: phy-4
  q: 'Photon energy relates to frequency as:'
  choices:
    A: E = hf
    B: E = h/f
    C: E = f/h
    D: E = h + f
  answer: A
  explain: E = hf (or E = hc/λ).
  chapter: Modern Physics
- id: phy-5
  q: 'In uniform circular motion, centripetal acceleration points:'
  choices:
    A: Tangent to the path, same as velocity
    B: Toward the center of the circle
    C: Away from the center
    D: Is zero
  answer: B
  explain: Centripetal acceleration changes velocity direction; velocity is tangential, acceleration points
    inward.
  chapter: Mechanics
- id: phy-6
  q: 'For an ideal gas undergoing isothermal expansion, ΔU equals:'
  choices:
    A: A large positive value
    B: Zero (ideal-gas internal energy depends only on temperature)
    C: Negative infinity
    D: Equals pressure
  answer: B
  explain: Ideal-gas internal energy is a function of T; isothermal means ΔU = 0.
  chapter: Thermodynamics
- id: phy-7
  q: 'When light goes from air into glass, it generally:'
  choices:
    A: Speeds up with longer wavelength
    B: Slows and bends toward the normal (refraction)
    C: Does not refract
    D: Changes frequency
  answer: B
  explain: Light slows in a denser medium; the refracted ray bends toward the normal.
  chapter: Vibrations, Waves, and Optics
- id: phy-8
  q: 'In a parallel circuit, the voltage across each branch:'
  choices:
    A: Is the same
    B: Is proportional to resistance
    C: Is always zero
    D: Is random
  answer: A
  explain: Parallel elements share the same potential difference; total current splits among branches.
  chapter: Electricity and Magnetism
- id: phy-9
  q: 'The photoelectric effect shows that light has:'
  choices:
    A: Wave nature only, no particle nature
    B: Quantized energy (photons)
    C: Energy independent of frequency
    D: Infinitely long wavelength
  answer: B
  explain: Electrons emit only when hf exceeds the work function; classical waves cannot explain a cutoff
    frequency.
  chapter: Modern Physics
- id: phy-10
  q: 'By Bernoulli’s principle (ideal, steady, incompressible flow), where a pipe narrows:'
  choices:
    A: Speed rises and static pressure drops
    B: Speed falls and static pressure rises
    C: Both speed and pressure stay constant
    D: Density must be zero
  answer: A
  explain: Continuity (Av = constant) raises speed in a narrow region; Bernoulli links higher speed to
    lower static pressure.
  chapter: 4B · Fluids, circulation, gas exchange
- id: phy-11
  q: In ideal flow, what happens to speed where a pipe narrows?
  choices:
    A: Decreases
    B: Increases
    C: Stays the same
    D: Becomes zero
  answer: B
  explain: 'Continuity: A₁v₁=A₂v₂; smaller area means higher speed.'
  chapter: Fluids
- id: phy-12
  q: 'If voltage across a capacitor doubles at fixed C, stored charge:'
  choices:
    A: Halves
    B: Unchanged
    C: Doubles
    D: Quadruples
  answer: C
  explain: Q=CV; at fixed C, Q scales with V.
  chapter: Electricity and Magnetism
