slug: verbal
items:
- id: verb-1
  q: 'WORD : DICTIONARY :: NOTE : ?'
  choices:
    A: Symphony
    B: Composer
    C: Silence
    D: Volume
  answer: A
  explain: Words are collected in a dictionary; notes are organized into a symphony.
  chapter: Analogies
- id: verb-2
  q: 'For reading-comprehension detail items, the safest move is to:'
  choices:
    A: Trust first impressions
    B: Relocate in the passage, then compare options
    C: Pick the longest option
    D: Ignore contrast markers
  answer: B
  explain: Details need textual support — relocate first.
  chapter: Reading Comprehension
- id: verb-3
  q: 'SURGEON : SCALPEL :: WRITER : ?'
  choices:
    A: Pen
    B: Hospital
    C: Patient
    D: Medicine
  answer: A
  explain: Profession to characteristic tool—a scalpel for a surgeon, a pen for a writer.
  chapter: Analogies
- id: verb-4
  q: 'HOT : COLD :: GENEROUS : ?'
  choices:
    A: Stingy
    B: Wealthy
    C: Happy
    D: Tall
  answer: A
  explain: 'Antonym relation: hot/cold, generous/stingy.'
  chapter: Analogies
- id: verb-5
  q: 'Inference items differ from detail items because inferences:'
  choices:
    A: Must be reasonably drawn though not stated verbatim
    B: May ignore the text entirely
    C: Must copy the passage word for word
    D: Test only vocabulary
  answer: A
  explain: Inferences need a textual evidence chain but need not be verbatim quotes.
  chapter: Reading Comprehension
- id: verb-6
  q: 'TREE : FOREST :: STAR : ?'
  choices:
    A: Galaxy
    B: Planet
    C: Moon
    D: Telescope
  answer: A
  explain: 'Part-to-whole: trees make a forest; stars (collectively) make a galaxy.'
  chapter: Analogies
- id: ver-7
  q: 'Analogy: doctor : hospital :: teacher : ?'
  choices:
    A: textbook
    B: school
    C: student
    D: chalk
  answer: B
  explain: Profession mapped to primary workplace.
  chapter: Word Analogies / Vocabulary
- id: ver-8
  q: 'Main-idea reading items should prioritize finding:'
  choices:
    A: The most vivid example
    B: The author’s central claim
    C: Definitions of rare words
    D: The author’s hometown
  answer: B
  explain: Main idea is the author’s central claim, not a detail or example.
  chapter: Reading Comprehension / Verbal Ability
