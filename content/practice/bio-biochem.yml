slug: bio-biochem
items:
- id: bb-1
  q: 'Peptide-bond formation involves:'
  choices:
    A: Hydrolysis that consumes water
    B: Condensation linking amino acids with water loss
    C: Breaking all hydrogen bonds
    D: Changing element identities
  answer: B
  explain: Carboxyl + amino condense with water loss; hydrolysis reverses it.
  chapter: 1A · Proteins and amino acids
- id: bb-2
  q: 'In the DNA double helix, base pairing follows:'
  choices:
    A: A–T (2 H-bonds), G–C (3 H-bonds)
    B: A–G, T–C
    C: Random pairing of any bases
    D: Only U participates
  answer: A
  explain: Watson–Crick pairing enables complementary-strand replication and transcription templates.
  chapter: 1C · Heritable information & diversity
- id: bb-3
  q: 'Ribosomes directly:'
  choices:
    A: Catalyze peptide-bond formation (translation)
    B: Replicate DNA
    C: Synthesize fatty acids
    D: Pump protons
  answer: A
  explain: Ribosomes read mRNA; tRNAs deliver amino acids; rRNA/protein components catalyze peptide elongation.
  chapter: 1B · Gene to protein
- id: bb-4
  q: 'The plasma membrane bilayer is mainly built from:'
  choices:
    A: Phospholipids
    B: Free glucose
    C: Nucleic acid duplexes
    D: Metallic ion crystals
  answer: A
  explain: Amphipathic phospholipids form the bilayer; proteins and cholesterol are embedded within.
  chapter: 2A · Assemblies of molecules, cells, cell groups
- id: bb-5
  q: 'The terminal electron acceptor in aerobic respiration is:'
  choices:
    A: O₂
    B: N₂
    C: CO₂
    D: Glucose
  answer: A
  explain: Complex IV passes electrons to O₂ forming H₂O, completing the ETC.
  chapter: 1D · Bioenergetics and fuel metabolism
- id: bb-6
  q: 'A defining feature of stem cells is:'
  choices:
    A: Self-renewal plus differentiation potential
    B: Inability to divide
    C: Loss of the nucleus
    D: Production of only one terminal cell type ever
  answer: A
  explain: Stem cells replenish themselves and can differentiate; potency varies by stem-cell type.
  chapter: 2C · Division, differentiation, specialization
- id: bb-7
  q: 'In the nephron, the glomerulus mainly:'
  choices:
    A: Filters plasma to form filtrate
    B: Synthesizes insulin
    C: Generates action-potential conduction
    D: Secretes bile
  answer: A
  explain: The glomerular barrier retains cells and large proteins; tubules reabsorb and secrete to refine
    urine.
  chapter: 3B · Main organ systems
- id: bb-8
  q: 'Oxidative phosphorylation directly depends on:'
  choices:
    A: Golgi vesicle traffic
    B: Inner-membrane proton gradient driving ATP synthase
    C: Nuclear transcription
    D: Cytoskeletal contraction
  answer: B
  explain: ETC pumps protons; ATP synthase uses the return flow to make ATP.
  chapter: 1D · Bioenergetics and fuel metabolism
