slug: inductive-reasoning
items:
- id: ind-1
  q: 'On figure-series items, prioritize:'
  choices:
    A: Guessing every rule at once then quitting
    B: Tracking position, count, fill, and rotation separately
    C: Only color, ignore shape
    D: Picking the middle option
  answer: B
  explain: Rules often stack — separate threads are safer.
  chapter: Figure Series
- id: ind-2
  q: 'On figure-grouping items, the first step is usually to:'
  choices:
    A: Find the attribute shared by most figures
    B: Pick a group at random
    C: Count vertices only, ignore shape
    D: Assume there is no rule
  answer: A
  explain: Grouping tests shared features; the odd figure is often the key.
  chapter: Figure Grouping
- id: ind-3
  q: 'In the number series 2, 6, 18, 54, … the next term is most likely:'
  choices:
    A: '162'
    B: '108'
    C: '72'
    D: '60'
  answer: A
  explain: 'Geometric sequence with ratio 3: 54 × 3 = 162.'
  chapter: Number and Letter Series
- id: ind-4
  q: 'An “every other term” rule in a figure series means:'
  choices:
    A: Odd and even positions may follow different sub-rules
    B: The series has only two terms
    C: Rotation must be ignored
    D: The answer is always A
  answer: A
  explain: Alternating rules are common—e.g., odd terms rotate, even terms add elements.
  chapter: Figure Series
- id: ind-5
  q: 'In figure grouping, the most reliable strategy is to:'
  choices:
    A: Pick the group that looks nicest
    B: Find a consistent rule and test all options
    C: Guess randomly
    D: Ignore shape and use color only
  answer: B
  explain: Inductive items test rule consistency, not aesthetic preference.
  chapter: Figure Grouping
