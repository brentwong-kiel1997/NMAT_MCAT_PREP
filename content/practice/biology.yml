slug: biology
items:
- id: bio-1
  q: Which best distinguishes prokaryotic from eukaryotic cells?
  choices:
    A: Presence of ribosomes
    B: Membrane-bound nucleus
    C: Ability to metabolize
    D: Presence of a cell membrane
  answer: B
  explain: Eukaryotes have a membrane-bound nucleus/compartments; both have ribosomes and membranes.
  chapter: Cells and Cellular Processes
- id: bio-2
  q: 'The main role of negative feedback is to:'
  choices:
    A: Amplify deviation to finish a brief process
    B: Keep the internal environment relatively stable
    C: Increase mutation rate
    D: Block all physiological change
  answer: B
  explain: Negative feedback opposes drift from set points; positive feedback amplifies (e.g., labor).
  chapter: 'Life Processes: Regulation and Homeostasis'
- id: bio-3
  q: 'A key meiotic contribution to genetic diversity is:'
  choices:
    A: Mitotic copying without segregation
    B: Crossing over and independent assortment
    C: Deleting all heterozygous loci
    D: Blocking DNA replication
  answer: B
  explain: Crossing over and independent assortment reshuffle allele combinations.
  chapter: Genetics
- id: bio-4
  q: 'Energy flow in ecosystems is basically:'
  choices:
    A: Fully cyclic with no loss
    B: One-way with stepwise dissipation
    C: Cycling only inside producers
    D: Identical to matter cycling
  answer: B
  explain: Energy moves one way with heat loss; matter can cycle.
  chapter: Organisms and Their Environment
- id: bio-5
  q: 'Active transport differs from simple diffusion mainly because it:'
  choices:
    A: Moves down a gradient without energy
    B: Can move against a gradient using ATP (or an electrochemical gradient)
    C: Occurs only through nuclear pores
    D: Transports only gases
  answer: B
  explain: Active transport uses carriers/pumps and energy; simple diffusion follows a gradient without
    metabolic energy.
  chapter: Cells and Cellular Processes
- id: bio-6
  q: 'Mendel’s law of segregation states that:'
  choices:
    A: Alleles of a gene separate into gametes during gamete formation
    B: All genes are permanently linked
    C: Dominant alleles disappear
    D: Gametes are always diploid
  answer: A
  explain: Meiosis puts one allele of each pair into each gamete, restoring haploidy.
  chapter: Genetics
- id: bio-7
  q: Insulin raises or lowers blood glucose?
  choices:
    A: Raises it
    B: Lowers it (promotes uptake and storage)
    C: Has no effect on glucose
    D: Affects only blood calcium
  answer: B
  explain: Insulin drives glucose into cells and promotes glycogen/fat synthesis, lowering blood glucose.
  chapter: 'Life Processes: Regulation and Homeostasis'
- id: bio-8
  q: 'A food web better reflects an ecosystem’s:'
  choices:
    A: Single linear feeding path
    B: Complex feeding links among many species
    C: Energy cycling with no loss
    D: Equal biomass at every trophic level
  answer: B
  explain: Most species participate in multiple feeding links; webs are more realistic than single chains.
  chapter: Organisms and Their Environment
- id: bio-9
  q: 'After mitosis, daughter cells have chromosome number:'
  choices:
    A: Halved
    B: The same as the parent (diploidy maintained)
    C: Quadrupled
    D: Randomly variable
  answer: B
  explain: Mitosis duplicates then evenly partitions chromosomes, yielding genetically identical diploid
    daughters.
  chapter: 2C · Cell division, differentiation, specialization
- id: bio-10
  q: 'Compared with viruses, prokaryotic cells typically have:'
  choices:
    A: Ribosomes and cytoplasm capable of independent metabolism
    B: A membrane-bound nucleus
    C: Replication only inside a host
    D: No genetic material
  answer: A
  explain: Prokaryotes are free-living cells; viruses depend on host machinery and lack full cellular
    organization.
  chapter: 2B · Prokaryotes and viruses
- id: bio-11
  q: 'Cell differentiation during development mainly means:'
  choices:
    A: The genome is randomly deleted
    B: Different cell types selectively express different genes
    C: All cells become functionally identical
    D: All protein synthesis stops
  answer: B
  explain: Differentiation arises from regulated gene expression, not wholesale DNA change (except somatic
    mutations).
  chapter: Development
- id: bio-12
  q: 'The “all-or-none” property of a neuronal action potential means:'
  choices:
    A: Stronger stimuli produce larger single action potentials
    B: At threshold a fixed-size spike occurs; below threshold, none
    C: Neurons never fire
    D: Synaptic transmission needs no neurotransmitter
  answer: B
  explain: Single spike amplitude is constant; stimulus strength mainly affects firing frequency.
  chapter: 3A · Nervous & endocrine coordination
- id: bio-13
  q: Where does transcription mainly occur in eukaryotic cells?
  choices:
    A: Cytoplasm
    B: Nucleus
    C: Golgi apparatus
    D: Lysosome
  answer: B
  explain: Eukaryotic transcription is nuclear; translation occurs on cytoplasmic ribosomes.
  chapter: Genetics
- id: bio-14
  q: Which best matches natural selection?
  choices:
    A: Individuals actively change genes to fit the environment
    B: Individuals with advantageous variants leave more offspring
    C: All variants are transmitted equally
    D: The environment directly creates needed mutations
  answer: B
  explain: Selection acts via differential reproductive success on existing variation.
  chapter: Unity and Diversity of Life
