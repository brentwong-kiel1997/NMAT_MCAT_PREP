slug: perceptual-acuity
items:
- id: perc-1
  q: 'The key reminder on mirror-image items is:'
  choices:
    A: A mirror equals a 180° rotation
    B: Left–right mirroring is not the same as rotation
    C: Asymmetric features can be ignored
    D: Only compare area
  answer: B
  explain: Mirroring flips left–right; rotation is a different transform.
  chapter: Mirror Image
- id: perc-2
  q: 'A useful strategy on hidden-figure items is to:'
  choices:
    A: Lock onto the target outline and match segments in the clutter
    B: Look only at the figure’s center
    C: Ignore line orientation
    D: Closing one eye is always faster
  answer: A
  explain: Piecewise outline matching beats unfocused whole-figure scanning.
  chapter: Hidden Figure
- id: perc-3
  q: 'To decide whether two columns show identical information, you should:'
  choices:
    A: Compare character by character, watching confusable glyphs (0/O)
    B: Check only first and last characters
    C: Assume they are always identical
    D: Ignore all punctuation
  answer: A
  explain: Subtle differences often hide in middle characters, punctuation, or case.
  chapter: Identical Information
- id: perc-4
  q: 'A horizontal mirror flip differs from a vertical flip because:'
  choices:
    A: Horizontal swaps left–right; vertical swaps top–bottom
    B: They are identical
    C: Mirroring equals translation
    D: Only color changes
  answer: A
  explain: Mirror-axis orientation sets which axis flips; neither is the same as rotation.
  chapter: Mirror Image
- id: per-5
  q: 'In mirror items, a vertical-axis reflection mainly changes:'
  choices:
    A: Up–down positions
    B: Left–right positions
    C: Color
    D: Number of sides
  answer: B
  explain: Vertical-axis mirrors swap left–right; horizontal mirrors swap up–down.
  chapter: Mirror Image
