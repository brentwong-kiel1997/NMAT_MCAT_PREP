tips:
- exam: NMAT
  title: Part 1 time budget
  body: 'CEM BOI pacing: Verbal ~30 min, Inductive ~35 min, Quantitative ~40 min, Perceptual ~30 min.
    Practice full Part 1 on those clocks, then adjust for weak areas.'
- exam: NMAT
  title: Part 2 four-subject rotation
  body: Biology, Physics, Social Science, Chemistry — 30 items each in 90 minutes. Don’t drain time on
    one subject; ~45 s per item average, mark hard ones and return.
- exam: NMAT
  title: Social Science scope
  body: CEM lists Psychology plus Sociology and Anthropology — not psychology alone. Anthropology culture
    items appear; study both BOI blocks.
- exam: NMAT
  title: Biochemistry inside Chemistry
  body: NMAT has no separate Biochemistry subtest; CEM nests it under Chemistry. Overlap with MCAT Bio/Biochem
    can share Gabay biochemistry chapters.
- exam: MCAT
  title: Test-day section order
  body: 'AAMC fixed order: Chem/Phys → CARS → Bio/Biochem → Psych/Soc, with optional ~10-minute breaks.
    Simulate endurance in that order.'
- exam: MCAT
  title: Chem/Phys FC weighting
  body: AAMC weights FC4 ~40% and FC5 ~60% within Chem/Phys. Gabay chapters follow official Content Categories
    4A–5E, not prep-percent splits.
- exam: MCAT
  title: Bio/Biochem FC weighting
  body: 'AAMC: FC1 ~55%, FC2 ~20%, FC3 ~25%. Biochemistry-heavy FC1 (1A–1D) dominates; cross-review with
    NMAT Chemistry·Biochemistry.'
- exam: MCAT
  title: Anthropology on Psych/Soc
  body: MCAT Psych/Soc emphasizes psychology and sociology (AAMC FC6–10); anthropology isn’t a separate
    axis like NMAT. Cultural content appears in FC9 categories.
- exam: MCAT
  title: CARS has no content outline
  body: 'CARS follows AAMC’s three skills: Foundations, Within the Text, Beyond the Text. No science memorization
    — train passage pacing and evidence location.'
- exam: BOTH
  title: Gabay shared subject pages
  body: Biology, Chemistry, Physics, and Behavioral-Social are shared across NMAT Part 2 and multiple
    MCAT sections. Chapters merge CEM BOI and AAMC categories without inventing extra subjects.
- exam: BOTH
  title: Passage vs standalone items
  body: NMAT is mostly standalone multiple choice; MCAT science sections are passage-heavy. MCAT trains
    graphs, experimental design, and data tables; NMAT trains speed and breadth.
- exam: BOTH
  title: Outline before drill
  body: Use CEM BOI and AAMC What’s on the MCAT as the chapter spine; notes and practice attach to official
    headings — no invented pseudo-chapters.
- exam: BOTH
  title: Rewrite notes in exam English
  body: Whatever language you think in, re-express each point in the exam's own English phrasing — stem
    words like 'most nearly', 'EXCEPT', and 'best explains' carry grading weight. Write one English line
    per concept, then test yourself from that line alone.
- exam: MCAT
  title: Science section reading order
  body: For passages, skim figures and question stems first, then locate evidence; tackle standalone concept
    items directly. In 95 minutes for 59 items, reserve 5–8 min for marked questions.
- exam: NMAT
  title: Part 1 perceptual fatigue control
  body: Hidden Figure / Mirror sets tire the eyes. Blink-rest every 8–10 items; warm up with Identical
    Information before hidden figures.
- exam: NMAT
  title: Part 2 four-subject time boxes
  body: About 30 items per subject. Inside each subject, triage must-know / guess / mark-and-return so
    one calculation doesn’t sink the section.
- exam: MCAT
  title: Experimental-design checklist
  body: Track IV, DV, controls, confounders, and sample. Many Chem/Phys and Bio/Biochem items test design
    logic more than formula recall.
- exam: MCAT
  title: Psych/Soc term precision
  body: Distinguish classical/operant, assimilation/accommodation, incidence/prevalence, stereotype/discrimination/prejudice.
    Near-synonym traps are common.
- exam: BOTH
  title: Wrong-item three questions
  body: ① Concept gap or carelessness? ② Which official chapter? ③ Can you teach it in one sentence? If
    not, return to Gabay notes and cards.
- exam: BOTH
  title: How to use formula sheets
  body: Formula sheets are triggers, not a question bank. State meaning and traps, then drill the matching
    practice set.
- exam: BOTH
  title: Final 48 hours
  body: Stop opening new chapters; review misses, glossary, and high-yield formulas. Sleep and logistics
    beat last-minute cramming.
