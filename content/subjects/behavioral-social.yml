slug: behavioral-social
name: Behavioral & Social Sciences
exams:
- NMAT
- MCAT
summary: Psych, sociology, anthropology overlap; NMAT Social Science ↔ MCAT Psych/Soc.
nmat_role: NMAT Part 2 · Social Science（Psychology / Sociology and Anthropology）
mcat_role: MCAT Psychological, Social, and Biological Foundations of Behavior
source_note: 'NMAT per CEM BOI: Psychology + Sociology and Anthropology. MCAT per AAMC FC6–10.'
exam_notes:
  NMAT: Social Science = psychology + sociology + anthropology at intro depth.
  MCAT: Mostly psych/soc with some biology; anthropology is not a separate MCAT spine.
chapters:
