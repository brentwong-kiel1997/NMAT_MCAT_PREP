slug: biology
name: Biology
exams:
- NMAT
- MCAT
summary: Cells, genetics, homeostasis, ecology, life processes — both exams, different depth/item style.
nmat_role: NMAT Part 2 · Biology (30 items)
mcat_role: Core of MCAT Bio/Biochem; also appears lightly in Chem/Phys
source_note: NMAT chapter titles from CEM BOI Part 2 Biology; MCAT lists overlapping AAMC Content Categories.
exam_notes:
  NMAT: Aligned to intro biology; concepts plus understanding/applying/analyzing.
  MCAT: Interwoven with biochem; many passage items; research design and data reasoning.
chapters:
- heading: NMAT · CEM BOI chapters
  items:
  - title: Unity and Diversity of Life
    points:
    - Unity and diversity of life
    - Intro ideas in classification and evolution
  - title: Cells and Cellular Processes
    points:
    - Cell structure and function
    - Cellular processes (intro metabolism, membrane transport, etc.)
  - title: Genetics
    points:
    - Transmission of genetic information
    - Intro variation and inheritance patterns
  - title: The World of Plants and Animals
    points:
    - Intro world of plants and animals
    - Common structure/function comparison points
  - title: Development
    points:
    - Basic developmental concepts
  - title: 'Life Processes: Regulation and Homeostasis'
    points:
    - Regulation and homeostasis
    - Maintaining the internal environment
  - title: Organisms and Their Environment
    points:
    - Organisms and their environment
    - Intro ecological relationships
- heading: MCAT · related Content Categories (AAMC)
  items:
  - title: 1C · Heritable information & genetic diversity
    points:
    - Transmission across generations
    - Processes that increase genetic diversity
  - title: 2A · Assemblies of molecules, cells, and cell groups
    points:
    - Organization from single cells to multicellular assemblies
  - title: 2B · Prokaryotes and viruses
    points:
    - Structure, growth, physiology, and genetics
  - title: 2C · Cell division, differentiation, specialization
    points:
    - Division, differentiation, and specialization
  - title: 3A · Nervous & endocrine coordination
    points:
    - How nervous/endocrine systems coordinate organs
  - title: 3B · Main organ systems
    points:
    - Structure and integrative functions of major organ systems
kind: shared
