chapters:
- heading:
    zh: 大知识点 / 章节
    en: Major topics / chapters
  items:
  - title: Analogies（词义类比）
    points:
    - zh: 识别词对关系（同义、反义、部分-整体、因果、程度等）
      en: Identify word-pair relations (synonym, antonym, part-whole, cause, degree, etc.)
    - zh: 把关系迁移到选项，排除貌合神离干扰项
      en: Transfer the relation to choices; eliminate look-alike distractors
  - title: Reading Comprehension（阅读理解）
    points:
    - zh: 抓主旨与段落功能
      en: Capture main idea and paragraph function
    - zh: 细节定位与推断（不超出文本）
      en: Detail location and inference (stay inside the text)
    - zh: 语气/态度与论证结构
      en: Tone/attitude and argument structure
