exam: nmat
section: part2-chemistry
label: Chemistry
subject: chemistry
block: part2
items_expected: 30
items:
- id: nmat-p2c-001
  q: How many electrons does the ion 56Fe3+ contain? (Z of Fe = 26)
  choices:
    A: 26 electrons
    B: 29 electrons
    C: 23 electrons
    D: 20 electrons
  answer: C
  explain: 'Neutrons = 56 - 26 = 30, but charge depends only on the electron count: e- = Z - charge =
    26 - 3 = 23.'
  distractors:
    A: 26 is the proton count; a 3+ charge means three electrons were removed.
    B: 29 adds the charge to Z instead of subtracting it.
    D: 20 subtracts the charge from the mass number (56) instead of from Z.
  chapter: 4e-atoms-nuclear-decay-electronic-structure
- id: nmat-p2c-002
  q: Which of these elements has the highest first ionization energy?
  choices:
    A: Ar
    B: Mg
    C: Al
    D: Na
  answer: A
  explain: 'First IE climbs left to right across a period and peaks at the noble gas: Na 496, Mg 738,
    Al 578, Ar 1521 kJ/mol; the intact 3s2 3p6 shell is hardest to empty.'
  distractors:
    B: Mg sits only third across period 3; 738 kJ/mol is far below the noble-gas value.
    C: Al's lone 3p electron is easier to remove than Mg's 3s pair, so its IE dips to 578 kJ/mol.
    D: Na has the LOWEST first IE in period 3 (496 kJ/mol); its single 3s electron leaves easily.
  chapter: 4e-atoms-nuclear-decay-electronic-structure
- id: nmat-p2c-003
  q: What is the maximum number of electrons in one atom that may have n = 3 and l = 2?
  choices:
    A: '2'
    B: '10'
    C: '6'
    D: '14'
  answer: B
  explain: l = 2 is a d subshell, which holds 2l + 1 = 5 orbitals x 2 electrons = 10 electrons.
  distractors:
    A: 2 is the capacity of a single orbital, not of the whole subshell.
    C: 6 is the capacity of a p subshell (l = 1).
    D: 14 is the capacity of an f subshell (l = 3).
  chapter: 4e-atoms-nuclear-decay-electronic-structure
- id: nmat-p2c-004
  q: Judged purely by strength of intermolecular attraction, which pure liquid has the highest normal
    boiling point?
  choices:
    A: propane (CH3CH2CH3)
    B: dimethyl ether (CH3OCH3)
    C: ethanol (CH3CH2OH)
    D: chloroethane (CH3CH2Cl)
  answer: C
  explain: Ethanol's O-H lets it donate hydrogen bonds (bp 78 C), the strongest intermolecular force in
    this set; ether and chloroethane stop at dipole-dipole and propane at dispersion.
  distractors:
    A: Propane is nonpolar, so only London dispersion holds it together (bp -42 C).
    B: Dimethyl ether is polar but carries no O-H, so it cannot donate a hydrogen bond (bp -24 C).
    D: Chloroethane offers only dipole-dipole plus dispersion; no H sits on N, O or F (bp 12 C).
  chapter: 5b-molecules-and-intermolecular-interactions
- id: nmat-p2c-005
  q: Which molecule contains polar bonds but has a net dipole moment of zero?
  choices:
    A: CO2
    B: SO2
    C: H2O
    D: NH3
  answer: A
  explain: CO2 is linear (180 degrees) with two identical C=O dipoles pointing exactly opposite, so they
    cancel; all three alternatives are bent or pyramidal and stay polar.
  distractors:
    B: SO2 is bent, so its two bond dipoles add to a net moment.
    C: H2O is bent with two lone pairs on oxygen and is strongly polar.
    D: NH3 is trigonal pyramidal, so its three N-H dipoles cannot cancel.
  chapter: 5b-molecules-and-intermolecular-interactions
- id: nmat-p2c-006
  q: The hybridization of each carbon atom in acetylene (HCCH) is
  choices:
    A: sp3
    B: sp
    C: sp2
    D: sp3d
  answer: B
  explain: Each alkyne carbon has only two domains (one C-H sigma, one C-C sigma), so it mixes one s and
    one p orbital to sp, leaving two unhybridized p orbitals for the two pi bonds (180 degrees).
  distractors:
    A: sp3 implies four electron domains and tetrahedral geometry.
    C: sp2 belongs to a double-bonded carbon with three electron domains.
    D: sp3d requires an expanded octet, which second-row carbon cannot reach.
  chapter: 5b-molecules-and-intermolecular-interactions
- id: nmat-p2c-007
  q: For N2 + 3 H2 -> 2 NH3, a sealed vessel holds 6.0 mol N2 and 9.0 mol H2. The maximum moles of NH3
    formed is
  choices:
    A: 12 mol
    B: 9.0 mol
    C: 4.5 mol
    D: 6.0 mol
  answer: D
  explain: 'Burning all 6.0 mol N2 would need 18 mol H2, so H2 limits: NH3 = 9.0 x (2/3) = 6.0 mol.'
  distractors:
    A: 12 mol assumes all 6.0 mol of N2 reacts, i.e. that H2 is in excess, which it is not.
    B: 9.0 mol assumes a 1:1 H2-to-NH3 mole ratio; the balanced ratio is 3:2.
    C: 4.5 mol inverts the ratio and uses 1 mol NH3 per 2 mol H2.
  chapter: general-chemistry
- id: nmat-p2c-008
  q: The percent by mass of water in copper(II) sulfate pentahydrate, CuSO4.5H2O, is
  choices:
    A: 64.0%
    B: 56.4%
    C: 36.1%
    D: 7.2%
  answer: C
  explain: M(CuSO4) = 63.5 + 32.1 + 4(16.0) = 159.6; add 5(18.0) = 90.0 for the waters, total 249.6 g/mol;
    %H2O = 90.0/249.6 x 100 = 36.1%.
  distractors:
    A: 64.0% is the CuSO4 fraction (159.6/249.6), not the water's.
    B: 56.4% divides by the anhydrous salt mass (159.6) instead of the whole hydrate mass.
    D: 7.2% counts only one water of crystallization (18.0/249.6).
  chapter: general-chemistry
- id: nmat-p2c-009
  q: A 0.500 g sample of a gas occupies 250 mL at 25.0 C and 1.00 atm. Its molar mass is about
  choices:
    A: 48.9 g/mol
    B: 24.5 g/mol
    C: 12.2 g/mol
    D: 97.9 g/mol
  answer: A
  explain: M = mRT/PV = (0.500)(0.0821)(298) / (1.00)(0.250) = 48.9 g/mol, with V in liters and T in kelvin.
  distractors:
    B: 24.5 doubles the volume in the denominator (0.500 L was used).
    C: 12.2 uses 0.125 L, a fourfold volume error.
    D: 97.9 doubles the mass (1.00 g used instead of 0.500 g).
  chapter: general-chemistry
- id: nmat-p2c-010
  q: How many grams of NaOH (40.0 g/mol) are needed to prepare 250 mL of 0.500 M solution?
  choices:
    A: 2.50 g
    B: 5.00 g
    C: 20.0 g
    D: 0.125 g
  answer: B
  explain: n = MV = 0.500 x 0.250 = 0.125 mol; mass = 0.125 x 40.0 = 5.00 g.
  distractors:
    A: 2.50 g halves the moles, as if the volume were 125 mL.
    C: 20.0 g uses the molarity 0.500 as though it were a mole amount.
    D: 0.125 g reports the mole amount (0.125 mol) as a mass.
  chapter: 5a-unique-nature-of-water-and-its-solutions
- id: nmat-p2c-011
  q: What volume of 12.0 M HCl stock solution is required to prepare 2.00 L of 0.150 M acid?
  choices:
    A: 160 mL
    B: 250 mL
    C: 2.50 mL
    D: 25.0 mL
  answer: D
  explain: C1V1 = C2V2 gives V1 = (0.150)(2.00)/12.0 = 0.0250 L = 25.0 mL.
  distractors:
    A: 160 mL multiplies by the stock concentration instead of dividing by it.
    B: 250 mL is a factor-of-10 decimal slip (0.250 L).
    C: 2.50 mL is a factor-of-10 slip in the other direction (0.00250 L).
  chapter: 5a-unique-nature-of-water-and-its-solutions
- id: nmat-p2c-012
  q: An equal mass of fat releases about twice the energy of carbohydrate chiefly because
  choices:
    A: it carries more oxygen atoms per carbon
    B: its glycerol backbone is the main fuel
    C: its fatty acyl chains are highly reduced, so each carbon delivers more electrons to the respiratory
      chain
    D: it is a polymer of glucose units
  answer: C
  explain: Fatty acyl carbons are held in mostly C-H bonds, so beta-oxidation loads far more NADH and
    FADH2 per carbon; carbohydrates already carry one oxygen per carbon and are partly oxidized.
  distractors:
    A: 'Backwards: fats carry far LESS oxygen per carbon than carbohydrates do.'
    B: The fatty acyl chains, not the glycerol backbone, supply most of the energy.
    D: Glucose polymers are starch or glycogen; triglycerides are esters of glycerol and fatty acids.
  chapter: 5d-biologically-relevant-molecules
- id: nmat-p2c-013
  q: The pH of 0.0030 M HCl at 25 C is
  choices:
    A: '2.52'
    B: '3.00'
    C: '3.48'
    D: '11.48'
  answer: A
  explain: HCl is a strong acid, so [H+] = 3.0 x 10^-3 M and pH = -log(3.0 x 10^-3) = 3.00 - 0.48 = 2.52.
  distractors:
    B: 3.00 uses only the exponent of 10 and ignores the 3.0 coefficient.
    C: 3.48 ADDS log 3.0 to the exponent instead of subtracting it.
    D: 11.48 is 14 - 2.52, reading an acidic solution as basic (pOH).
  chapter: 5a-unique-nature-of-water-and-its-solutions
- id: nmat-p2c-014
  q: A buffer contains 0.20 M acetic acid and 0.60 M sodium acetate (pKa = 4.76). Its pH is
  choices:
    A: '4.76'
    B: '5.24'
    C: '4.28'
    D: '5.86'
  answer: B
  explain: 'Henderson-Hasselbalch: pH = pKa + log([A-]/[HA]) = 4.76 + log(0.60/0.20) = 4.76 + 0.48 = 5.24.'
  distractors:
    A: 4.76 is the pH only when [A-] = [HA]; here base is three times the acid.
    C: 4.28 inverts the ratio, using log(0.20/0.60) = -0.48.
    D: 5.86 uses the natural log (ln 3 = 1.10) instead of log base 10.
  chapter: 5a-unique-nature-of-water-and-its-solutions
- id: nmat-p2c-015
  q: What volume of 0.100 M NaOH completely neutralizes 25.0 mL of 0.150 M H2SO4?
  choices:
    A: 37.5 mL
    B: 150 mL
    C: 18.8 mL
    D: 75.0 mL
  answer: D
  explain: n(H2SO4) = 0.0250 x 0.150 = 3.75 mmol; OH- required = 2 x 3.75 = 7.50 mmol; V = 7.50/0.100
    = 75.0 mL.
  distractors:
    A: 37.5 mL ignores the 2:1 stoichiometry and treats H2SO4 as monoprotic.
    B: 150 mL uses 0.0500 M for the base, a decimal slip in its concentration.
    C: 18.8 mL divides by 2 instead of multiplying by 2, inverting the mole ratio.
  chapter: analytical-chemistry
- id: nmat-p2c-016
  q: Counting only citric acid cycle contributions for one glucose (both acetyl-CoA; NADH = 2.5 ATP, FADH2
    = 1.5 ATP), the ATP-equivalent yield is
  choices:
    A: '10'
    B: '15'
    C: '20'
    D: '22'
  answer: C
  explain: Each turn gives 3 NADH (7.5) + 1 FADH2 (1.5) + 1 GTP (1) = 10; two acetyl-CoA per glucose means
    2 x 10 = 20.
  distractors:
    A: 10 counts a single turn; one glucose yields two acetyl-CoA, hence two turns.
    B: 15 counts only the NADH (3 x 2.5 = 7.5 per turn) and drops FADH2 and GTP.
    D: 22 adds glycolysis's net 2 ATP to a cycle-only total.
  chapter: biochemistry
- id: nmat-p2c-017
  q: Given delta-Hf degrees of -277.7 (C2H5OH l), -393.5 (CO2 g) and -285.8 (H2O l) kJ/mol, delta-H for
    C2H5OH(l) + 3 O2 -> 2 CO2(g) + 3 H2O(l) is
  choices:
    A: -1367 kJ/mol
    B: -1644 kJ/mol
    C: -277.7 kJ/mol
    D: +1367 kJ/mol
  answer: A
  explain: delta-Hrxn = [2(-393.5) + 3(-285.8)] - (-277.7) = -1644.4 + 277.7 = -1366.7, about -1367 kJ/mol.
  distractors:
    B: -1644 omits the ethanol reactant term, i.e. never adds back +277.7.
    C: -277.7 is the delta-Hf of ethanol itself, not of the reaction.
    D: +1367 has the sign backwards; that is the endothermic reverse reaction.
  chapter: 5e-chemical-thermodynamics-and-kinetics
- id: nmat-p2c-018
  q: For a process with delta-H = +40.0 kJ/mol and delta-S = +150 J/(mol.K), delta-G at 310 K is
  choices:
    A: +6.5 kJ/mol, nonspontaneous
    B: -6.5 kJ/mol, spontaneous
    C: +40 kJ/mol, nonspontaneous
    D: +86.5 kJ/mol, nonspontaneous
  answer: B
  explain: delta-G = delta-H - T.delta-S = 40.0 - 310(0.150) = 40.0 - 46.5 = -6.5 kJ/mol, spontaneous
    at 310 K.
  distractors:
    A: +6.5 reverses the subtraction and computes T.delta-S - delta-H.
    C: +40 uses delta-H alone and ignores the T.delta-S term.
    D: +86.5 ADDS T.delta-S instead of subtracting it (40.0 + 46.5).
  chapter: 5e-chemical-thermodynamics-and-kinetics
- id: nmat-p2c-019
  q: For 2 SO2(g) + O2(g) <=> 2 SO3(g), delta-H = -198 kJ, which change shifts the equilibrium toward
    reactants?
  choices:
    A: decreasing the container volume
    B: adding more O2
    C: removing SO3 as it forms
    D: raising the temperature
  answer: D
  explain: Heat is a product of this exothermic reaction, so raising T drives the reverse (endothermic)
    direction; every other listed change favors the forward shift.
  distractors:
    A: Compression favors the side with fewer gas moles, 3 -> 2, which is the product side.
    B: Adding a reactant drives the reaction forward, not back.
    C: Removing a product pulls the reaction to the right to replace it.
  chapter: 5e-chemical-thermodynamics-and-kinetics
- id: nmat-p2c-020
  q: In initial-rate runs for A + B -> products, doubling [A] at fixed [B] quadruples the rate, while
    doubling [B] at fixed [A] doubles the rate. The overall reaction order is
  choices:
    A: '1'
    B: '2'
    C: '3'
    D: '4'
  answer: C
  explain: 2^x = 4 gives x = 2 for A and 2^y = 2 gives y = 1 for B, so the overall order is 2 + 1 = 3
    (k = 2.0e-3/[(0.10)^2(0.10)] = 2.0).
  distractors:
    A: 1 reads only the B dependence from the data.
    B: 2 reads only the A dependence from the data.
    D: 4 treats both reactants as second order (2 + 2).
  chapter: 5e-chemical-thermodynamics-and-kinetics
- id: nmat-p2c-021
  q: A first-order reaction has k = 2.31 x 10^-2 /min. Its half-life is
  choices:
    A: 30.0 min
    B: 43.3 min
    C: 15.0 min
    D: 60.0 min
  answer: A
  explain: t1/2 = 0.693/k = 0.693/0.0231 = 30.0 min, independent of the starting concentration.
  distractors:
    B: 43.3 min is 1/k, forgetting the 0.693 factor.
    C: 15.0 min halves the half-life.
    D: 60.0 min doubles the half-life.
  chapter: 5e-chemical-thermodynamics-and-kinetics
- id: nmat-p2c-022
  q: Given E degrees of +0.34 V for Cu2+/Cu and -0.76 V for Zn2+/Zn, the standard cell potential of the
    Daniell cell is
  choices:
    A: +0.34 V
    B: +1.10 V
    C: -1.10 V
    D: +0.76 V
  answer: B
  explain: E cell = E cathode - E anode = (+0.34) - (-0.76) = +1.10 V, positive as a spontaneous galvanic
    cell requires.
  distractors:
    A: +0.34 V is the cathode potential alone.
    C: -1.10 V flips the sign, giving the nonspontaneous electrolytic direction.
    D: +0.76 V is the anode's oxidation potential alone.
  chapter: general-chemistry
- id: nmat-p2c-023
  q: How many grams of copper (63.5 g/mol) plate out when 2.00 A flows through CuSO4(aq) for 965 s?
  choices:
    A: 1.27 g
    B: 0.318 g
    C: 0.0635 g
    D: 0.635 g
  answer: D
  explain: Q = It = 2.00 x 965 = 1930 C; n(e-) = 1930/96,500 = 0.0200 mol; Cu2+ + 2e- -> Cu gives 0.0100
    mol, so mass = 0.0100 x 63.5 = 0.635 g.
  distractors:
    A: 1.27 g uses 0.0200 mol Cu, ignoring that 2 e- reduce each Cu2+.
    B: 0.318 g assumes four electrons per copper atom.
    C: 0.0635 g slips a decimal in the charge, using 193 C instead of 1930 C.
  chapter: general-chemistry
- id: nmat-p2c-024
  q: Careful oxidation of 2-butanol, a secondary alcohol, produces
  choices:
    A: butanal
    B: butanoic acid
    C: butanone
    D: butane
  answer: C
  explain: 'A secondary alcohol holds one carbinol hydrogen, and losing it gives the ketone: 2-butanol
    -> 2-butanone; aldehydes and acids arise only from primary alcohols.'
  distractors:
    A: Butanal comes from oxidizing the primary alcohol 1-butanol.
    B: Butanoic acid requires a primary alcohol plus vigorous oxidation.
    D: Oxidation removes hydrogen and adds oxygen; it cannot strip the skeleton back to an alkane.
  chapter: organic-chemistry
- id: nmat-p2c-025
  q: Which single reagent distinguishes an aldehyde from a ketone?
  choices:
    A: Tollens' reagent (Ag+ in ammonia)
    B: bromine in CCl4
    C: sodium borohydride
    D: 2,4-dinitrophenylhydrazine
  answer: A
  explain: Aldehydes oxidize easily and reduce Ag+ to metallic silver (a mirror); ketones cannot be oxidized
    this way, so no mirror forms.
  distractors:
    B: Br2 in CCl4 tests C=C unsaturation, not the aldehyde/ketone difference.
    C: NaBH4 reduces both aldehydes and ketones, so it cannot distinguish them.
    D: 2,4-DNPH forms a precipitate with BOTH aldehydes and ketones.
  chapter: organic-chemistry
- id: nmat-p2c-026
  q: Addition of HBr to propene, with no peroxides present, gives which major product?
  choices:
    A: 1-bromopropane
    B: 2-bromopropane
    C: propane
    D: 1,2-dibromopropane
  answer: B
  explain: 'Markovnikov addition: H goes to the CH2 end, leaving the more stable secondary carbocation
    at C-2 for Br- to attack, so 2-bromopropane dominates.'
  distractors:
    A: 1-bromopropane is the anti-Markovnikov product, obtained only with peroxides.
    C: Propane would mean adding H alone; HBr adds both H and Br across the double bond.
    D: 1,2-dibromopropane requires Br2, not HBr.
  chapter: organic-chemistry
- id: nmat-p2c-027
  q: Which technique separates mixture components by their differential partitioning between a stationary
    phase and a mobile phase?
  choices:
    A: distillation
    B: filtration
    C: recrystallization
    D: chromatography
  answer: D
  explain: Chromatography resolves a mixture because each component spends a different fraction of its
    time sorbed on the stationary phase versus being carried by the mobile phase.
  distractors:
    A: Distillation separates by volatility, that is by boiling point.
    B: Filtration separates by particle size or solubility.
    C: Recrystallization separates by how solubility changes with temperature.
  chapter: 5c-separation-and-purification-methods
- id: nmat-p2c-028
  q: Two miscible liquids boil at 78 C and 82 C. The best way to separate them is
  choices:
    A: simple distillation
    B: evaporation to dryness
    C: fractional distillation
    D: decantation
  answer: C
  explain: A 4 C gap is far below the roughly 25 C that one vaporization cycle can resolve, so a fractionating
    column's many repeated condensations are needed.
  distractors:
    A: Simple distillation gives one vaporization cycle, useless for a 4 C boiling-point gap.
    B: Evaporation to dryness discards the more volatile liquid instead of purifying it.
    D: Decantation separates immiscible layers or solids, not two miscible liquids.
  chapter: 5c-separation-and-purification-methods
- id: nmat-p2c-029
  q: Complete hydrolysis of the disaccharide sucrose (table sugar) yields which monosaccharides?
  choices:
    A: glucose + fructose
    B: glucose + galactose
    C: glucose only
    D: fructose only
  answer: A
  explain: Sucrose is a glucose-(1->2)-fructose disaccharide, so hydrolysis ('inversion') releases one
    glucose and one fructose.
  distractors:
    B: Glucose + galactose is the hydrolysis of lactose.
    C: Glucose alone is what maltose (or starch) hydrolysis gives.
    D: Fructose alone ignores the glucose unit of the disaccharide.
  chapter: 5d-biologically-relevant-molecules
- id: nmat-p2c-030
  q: An enzyme has Vmax = 60 umol/min and Km = 2.0 mM. At [S] = 6.0 mM the initial velocity is
  choices:
    A: 30 umol/min
    B: 45 umol/min
    C: 20 umol/min
    D: 60 umol/min
  answer: B
  explain: v = Vmax[S]/(Km + [S]) = 60 x 6.0/(2.0 + 6.0) = 360/8.0 = 45 umol/min.
  distractors:
    A: 30 is Vmax/2, which holds only at [S] = Km = 2.0 mM, not 6.0 mM.
    C: 20 inverts the Michaelis ratio, computing Vmax x Km/[S] = 60 x 2/6.
    D: 60 assumes saturation, but [S] >> Km needs roughly ten times Km.
  chapter: biochemistry
