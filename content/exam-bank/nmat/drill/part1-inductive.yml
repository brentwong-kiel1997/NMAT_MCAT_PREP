section: drill-part1-inductive
label: Inductive Reasoning drill
subject: inductive-reasoning
block: part1
_drill: true
items:
- id: nmat-d-p1i-001
  q: What number continues the series? 2, 4, 7, 14, 17, 34, ___
  choices:
    A: '37'
    B: '51'
    C: '68'
    D: '71'
  answer: A
  explain: 'The operations alternate: x 2, then + 3. So 2, 4 (x 2), 7 (+ 3), 14 (x 2), 17 (+ 3), 34 (x
    2), and 34 + 3 = 37.'
  distractors:
    B: Adds the two previous terms (34 + 17), a Fibonacci habit the series does not use.
    C: Doubles the last term again and skips the '+ 3' step.
    D: 'Applies both operations to one term: 34 x 2 + 3.'
  chapter: number-and-letter-series
- id: nmat-d-p1i-002
  q: What number continues the series? 2, 3, 7, 16, 32, ___
  choices:
    A: '48'
    B: '55'
    C: '57'
    D: '64'
  answer: C
  explain: The gaps are the squares 1, 4, 9, 16, so the next gap is 25 and 32 + 25 = 57.
  distractors:
    A: Repeats the previous difference of 16 instead of taking the next square.
    B: Assumes the differences rise by a steady 7 (16 + 7 = 23).
    D: Jumps to the next perfect square rather than adding 25 to the last term.
  chapter: number-and-letter-series
- id: nmat-d-p1i-003
  q: What number continues the series? 6, 120, 8, 110, 10, 100, 12, ___
  choices:
    A: '80'
    B: '90'
    C: '95'
    D: '14'
  answer: B
  explain: 'Two series are interleaved: the odd positions rise by 2 (6, 8, 10, 12) and the even positions
    fall by 10 (120, 110, 100, 90).'
  distractors:
    A: Steps the second sub-series down by 20 instead of by 10.
    C: Halves the drop, taking 5 from 100 rather than 10.
    D: Continues the odd-position sub-series (+ 2) instead of the even one.
  chapter: number-and-letter-series
- id: nmat-d-p1i-004
  q: What number continues the series? 100, 92, 85, 79, 74, ___
  choices:
    A: '65'
    B: '69'
    C: '71'
    D: '70'
  answer: D
  explain: 'The drops shrink by one each time: -8, -7, -6, -5, so the next drop is 4 and 74 - 4 = 70.'
  distractors:
    A: Assumes the drop keeps growing and takes 9 from 74.
    B: Repeats the previous drop of 5.
    C: Uses a drop of 3, one step back in the pattern.
  chapter: number-and-letter-series
- id: nmat-d-p1i-005
  q: What letter continues the series? B, F, K, Q, X, ___
  choices:
    A: E
    B: F
    C: G
    D: Z
  answer: B
  explain: 'The steps grow by one: +4, +5, +6, +7. X is the 24th letter, so 24 + 8 = 32, and 32 - 26 =
    6, the letter F.'
  distractors:
    A: Counts the alphabet from zero, so the wrap lands one place early.
    C: Steps 9 past X instead of 8.
    D: Stops at the wrap without continuing past it.
  chapter: number-and-letter-series
- id: nmat-d-p1i-006
  q: What pair continues the series? A3, C6, E9, G12, ___
  choices:
    A: I15
    B: H15
    C: I12
    D: J15
  answer: A
  explain: The letters advance two places (A, C, E, G, I) and the numbers rise by 3 (3, 6, 9, 12, 15),
    giving I15.
  distractors:
    B: Steps the letter by one place instead of two.
    C: Holds the number still; the number rises by 3 each frame.
    D: Steps the letter by three places instead of two.
  chapter: number-and-letter-series
- id: nmat-d-p1i-007
  q: What number continues the series? 3, 10, 31, 94, ___
  choices:
    A: '282'
    B: '279'
    C: '376'
    D: '283'
  answer: D
  explain: 'Each term is three times the one before, plus 1: 3 x 3 + 1 = 10, 10 x 3 + 1 = 31, 31 x 3 +
    1 = 94, 94 x 3 + 1 = 283.'
  distractors:
    A: Multiplies by 3 but drops the '+ 1'.
    B: Subtracts 3 instead of adding 1.
    C: Multiplies by 4 instead of by 3.
  chapter: number-and-letter-series
- id: nmat-d-p1i-008
  q: What number continues the series? 4, 6, 10, 14, 22, ___
  choices:
    A: '24'
    B: '28'
    C: '26'
    D: '34'
  answer: C
  explain: 'Every term is twice a prime: 2 x 2, 2 x 3, 2 x 5, 2 x 7, 2 x 11, so the next is 2 x 13 = 26.'
  distractors:
    A: Reads the series as ordinary consecutive even numbers.
    B: Adds the previous gap of 8 once more.
    D: Skips a prime and doubles 17 instead of 13.
  chapter: number-and-letter-series
- id: nmat-d-p1i-009
  q: What number continues the series? 40, 38, 34, 28, 20, ___
  choices:
    A: '10'
    B: '12'
    C: '11'
    D: '8'
  answer: A
  explain: 'The gaps grow by two each time: -2, -4, -6, -8, so the next gap is -10 and 20 - 10 = 10.'
  distractors:
    B: Repeats the previous drop of 8.
    C: Uses a drop of 9, halfway between the last two steps.
    D: Restarts the doubling and drops 12 from 20.
  chapter: number-and-letter-series
- id: nmat-d-p1i-010
  q: What letter continues the series? Z, W, V, S, R, ___
  choices:
    A: Q
    B: O
    C: N
    D: L
  answer: B
  explain: 'The steps alternate -3 and -1: Z -3 W, W -1 V, V -3 S, S -1 R, so R -3 = the 15th letter,
    O.'
  distractors:
    A: Applies the - 1 step once more instead of the - 3 step.
    C: Combines the two alternating steps into a single - 4.
    D: Applies - 3 twice, giving 18 - 3 - 3 = 12.
  chapter: number-and-letter-series
- id: nmat-d-p1i-011
  q: 'Each frame is a square with a single dot placed in one of its four corners. Frame 1: the dot sits
    in the top-left corner. Frame 2: the top-right corner. Frame 3: the bottom-right corner. Which corner
    holds the dot in Frame 4?'
  choices:
    A: the top-left corner
    B: the top-right corner
    C: the bottom-right corner
    D: the bottom-left corner
  answer: D
  explain: 'The dot visits the corners clockwise: top-left, top-right, bottom-right, and then bottom-left.'
  distractors:
    A: That is where the dot began; it does not return there until Frame 5.
    B: That follows a counter-clockwise walk, but the dot moves clockwise.
    C: That is Frame 3's position, which the dot has already left.
  chapter: figure-series
- id: nmat-d-p1i-012
  q: Frame 1 shows 2 dots arranged as 1 row of 2. Frame 2 shows 6 dots arranged as 2 rows of 3. Frame
    3 shows 12 dots arranged as 3 rows of 4. What does Frame 4 show?
  choices:
    A: 16 dots arranged as 4 rows of 4
    B: 25 dots arranged as 5 rows of 5
    C: 20 dots arranged as 4 rows of 5
    D: 12 dots arranged as 3 rows of 4
  answer: C
  explain: Frame n holds n rows of n + 1 dots, so Frame 4 holds 4 x 5 = 20 dots.
  distractors:
    A: Squares the row count; the grid is always one column wider than it is tall.
    B: Skips ahead to the next square number instead of the next rectangular grid.
    D: Repeats Frame 3 instead of extending the pattern.
  chapter: figure-series
- id: nmat-d-p1i-013
  q: 'Each frame shows a single arrow. Frame 1: a solid arrow pointing right. Frame 2: a hollow arrow
    pointing down. Frame 3: a solid arrow pointing left. What does Frame 4 show?'
  choices:
    A: a solid arrow pointing up
    B: a hollow arrow pointing up
    C: a hollow arrow pointing down
    D: a solid arrow pointing left
  answer: B
  explain: The direction turns 90 degrees clockwise each frame (right, down, left, up) while the fill
    alternates solid, hollow, solid, hollow.
  distractors:
    A: Gets the quarter turn but keeps Frame 3's solid fill; the fill alternates.
    C: Repeats Frame 2 instead of turning another quarter.
    D: Repeats Frame 3, ignoring both the turn and the change of fill.
  chapter: figure-series
- id: nmat-d-p1i-014
  q: 'Frame 1: a circle. Frame 2: a circle with a square drawn inside it. Frame 3: a circle with a square
    inside it and a triangle inside the square. What does Frame 4 show?'
  choices:
    A: a circle, a square, a triangle, and a smaller circle nested inside the triangle
    B: a circle, a square, a triangle, and a smaller square inside the triangle
    C: a circle, a square, and a larger triangle drawn outside the square
    D: a circle and a square only, with the triangle removed
  answer: A
  explain: One new shape is nested inside the innermost shape each frame, cycling circle, square, triangle,
    circle.
  distractors:
    B: Restarts the cycle with a square; the shapes repeat in the order circle, square, triangle.
    C: The nesting grows inward, not outward.
    D: No shape is ever removed; each frame keeps every earlier shape.
  chapter: figure-series
- id: nmat-d-p1i-015
  q: 'A strip of six cells is numbered 1 to 6 from left to right. Frame 1: a black dot in cell 1 and a
    white dot in cell 6. Each frame the black dot moves one cell right and the white dot one cell left.
    What does Frame 4 show?'
  choices:
    A: the black dot in cell 3 and the white dot in cell 4
    B: the black dot in cell 5 and the white dot in cell 2
    C: the black dot in cell 4 and the white dot in cell 3
    D: the black dot in cell 4 and the white dot in cell 4
  answer: C
  explain: From Frame 1 three moves take the black dot to cell 4 and the white dot to cell 3, so the two
    have swapped sides.
  distractors:
    A: Stops the dots where they first meet in Frame 3; both keep moving.
    B: Moves each dot two cells per frame instead of one.
    D: Assumes the dots merge when they cross; they pass through each other.
  chapter: figure-series
- id: nmat-d-p1i-016
  q: 'Frame 1: one small square. Frame 2: two identical squares side by side. Frame 3: four identical
    squares arranged 2 by 2. What does Frame 4 show?'
  choices:
    A: six identical squares arranged in two rows of three
    B: sixteen squares arranged 4 by 4
    C: twelve squares arranged in three rows of four
    D: eight identical squares arranged in two rows of four
  answer: D
  explain: 'The number of squares doubles each frame: 1, 2, 4, 8, and eight squares sit as two rows of
    four.'
  distractors:
    A: Adds two squares per frame instead of doubling.
    B: Squares the count instead of doubling it.
    C: Multiplies the count by 3 instead of by 2.
  chapter: figure-series
- id: nmat-d-p1i-017
  q: 'A circle is divided into four quadrants: north, east, south and west. Frame 1: the north quadrant
    is shaded and a dot sits in the east quadrant. Each frame the shaded quadrant turns one step clockwise
    while the dot turns one step counter-clockwise. What does Frame 4 show?'
  choices:
    A: the west quadrant shaded and the dot in the south quadrant
    B: the east quadrant shaded and the dot in the north quadrant
    C: the west quadrant shaded and the dot in the north quadrant
    D: the south quadrant shaded and the dot in the west quadrant
  answer: A
  explain: The shading runs N, E, S, W clockwise while the dot runs E, N, W, S counter-clockwise, so Frame
    4 shades west and holds the dot in the south.
  distractors:
    B: That is Frame 2; both figures have moved two further steps by Frame 4.
    C: Turns both figures the same way; they move in opposite directions.
    D: Reads the shading as turning counter-clockwise instead of clockwise.
  chapter: figure-series
- id: nmat-d-p1i-018
  q: 'Frame 1: a small upward-pointing triangle on the left half of the frame. Each frame the triangle
    doubles in size and moves to the other half of the frame, and on every second frame it points downward.
    What does Frame 4 show?'
  choices:
    A: an extra-large upward-pointing triangle on the right half of the frame
    B: an extra-large downward-pointing triangle on the right half of the frame
    C: an extra-large downward-pointing triangle on the left half of the frame
    D: a large upward-pointing triangle on the left half of the frame
  answer: B
  explain: Size doubles (small, medium, large, extra large), the half swaps each frame (left, right, left,
    right), and the point flips on even frames.
  distractors:
    A: The doubling and the move are right, but the triangle points down on every second frame.
    C: Fails to swap halves; the triangle changes sides each frame.
    D: Repeats Frame 3, ignoring both the doubling and the flip.
  chapter: figure-series
- id: nmat-d-p1i-019
  q: 'Four figures are shown: the capital letters A, B, R and P. Which letter does not belong with the
    other three?'
  choices:
    A: the capital letter A
    B: the capital letter R
    C: the capital letter B
    D: the capital letter P
  answer: C
  explain: A, R and P each enclose a single region; B encloses two, one in each of its two bowls.
  distractors:
    A: Its counter under the crossbar encloses exactly one region, as R and P do.
    B: Its bowl encloses exactly one region, as A and P do.
    D: Its bowl encloses exactly one region, as A and R do.
  chapter: figure-grouping
- id: nmat-d-p1i-020
  q: 'Four figures are shown: an isosceles trapezoid, a parallelogram, an isosceles triangle, and a rectangle
    that is not a square. Which figure does not belong with the other three?'
  choices:
    A: the isosceles trapezoid
    B: the isosceles triangle
    C: the rectangle that is not a square
    D: the parallelogram
  answer: D
  explain: The trapezoid, the triangle and the rectangle all have at least one line of symmetry; a parallelogram
    has none and matches itself only under a half turn.
  distractors:
    A: It has a line of symmetry between its two slanted sides.
    B: It has a line of symmetry from its apex to the midpoint of its base.
    C: It has two lines of symmetry, one through each pair of midpoints.
  chapter: figure-grouping
- id: nmat-d-p1i-021
  q: 'Four figures are shown: a square with a dot at the midpoint of each of its four sides, a triangle
    with a dot at each of its three corners, a pentagon with a dot at the midpoint of each of its five
    sides, and a hexagon with a dot at the midpoint of each of its six sides. Which figure does not belong
    with the other three?'
  choices:
    A: the triangle with a dot at each of its three corners
    B: the square with dots at the midpoints of its four sides
    C: the pentagon with dots at the midpoints of its five sides
    D: the hexagon with dots at the midpoints of its six sides
  answer: A
  explain: In the square, the pentagon and the hexagon every dot marks the midpoint of a side; the triangle
    puts its dots on corners.
  distractors:
    B: Its dots sit at side midpoints, as in the pentagon and the hexagon.
    C: Its dots also sit at side midpoints.
    D: Its dots also sit at side midpoints.
  chapter: figure-grouping
- id: nmat-d-p1i-022
  q: 'Four figures are shown: an equilateral triangle, a square, a regular hexagon and a regular pentagon.
    Which figure cannot, by itself, tile a flat surface without gaps or overlaps?'
  choices:
    A: the equilateral triangle
    B: the square
    C: the regular pentagon
    D: the regular hexagon
  answer: C
  explain: Tiling around a point needs an interior angle that divides 360 degrees; the pentagon's 108
    degrees does not, so gaps are left over.
  distractors:
    A: Six of them fit around a point because 6 x 60 = 360 degrees, so triangles tile.
    B: Four of them fit around a point because 4 x 90 = 360 degrees.
    D: Three of them fit around a point because 3 x 120 = 360 degrees.
  chapter: figure-grouping
- id: nmat-d-p1i-023
  q: 'Four figures are shown: a circle, a figure eight (a curve crossing itself once at a single point),
    a square, and a triangle. Which figure does not belong with the other three?'
  choices:
    A: the circle
    B: the figure eight
    C: the square
    D: the triangle
  answer: B
  explain: Circle, square and triangle are simple closed curves whose outlines never cross themselves;
    the figure eight crosses once.
  distractors:
    A: A circle is a simple closed curve that never crosses itself.
    C: A square's sides meet only at its four corners and never cross.
    D: A triangle's sides meet only at its three corners and never cross.
  chapter: figure-grouping
- id: nmat-d-p1i-024
  q: 'Four capital letters are shown: N, M, Z and H. Which letter does not belong with the other three?'
  choices:
    A: N
    B: Z
    C: H
    D: M
  answer: D
  explain: N, Z and H each use three straight strokes; M uses four.
  distractors:
    A: 'N is drawn with three straight strokes: two verticals and one diagonal.'
    B: 'Z is drawn with three straight strokes: two horizontals and one diagonal.'
    C: 'H is drawn with three straight strokes: two verticals and one crossbar.'
  chapter: figure-grouping
- id: nmat-d-p1i-025
  q: 'Four figures are shown: a square, a regular hexagon, a five-pointed star and an equilateral triangle.
    Which figure does not belong with the other three?'
  choices:
    A: the five-pointed star
    B: the square
    C: the regular hexagon
    D: the equilateral triangle
  answer: A
  explain: Square, hexagon and triangle are convex, with no interior angle over 180 degrees; a star's
    inner notches are reflex angles.
  distractors:
    B: Every interior angle of a square is 90 degrees, so it bulges outward everywhere.
    C: Its interior angles are all 120 degrees, again all under 180.
    D: Its three interior angles are 60 degrees each.
  chapter: figure-grouping
