items:
- id: nmat-d-p2s-001
  q: A trainer wants a dog to roll over. She first rewards the dog merely for lying down, then only
    for rolling onto its side, and finally only for completing the roll. This procedure is
  choices:
    A: shaping, reinforcing successive approximations toward the target behavior
    B: classical conditioning, because the reward follows a signal
    C: punishment, because the earlier responses are no longer rewarded
    D: negative reinforcement, because a signal stops once the dog complies
  answer: A
  explain: Reinforcing closer and closer approximations to the final act is shaping; the criterion
    is raised at each stage until only the complete roll is paid off.
  distractors:
    B: no neutral stimulus is being paired with an unconditioned one; consequences, not signals,
      drive the change
    C: withholding a reward is omission, not punishment; no aversive stimulus is ever presented
    D: nothing aversive is removed; the contingency adds a reward
  chapter: fc7-behavior-and-behavior-change
- id: nmat-d-p2s-002
  q: A dog's salivation to a bell was extinguished by repeated bell-without-food trials. A week later
    the bell alone again brings a small amount of salivation. This return is
  choices:
    B: spontaneous recovery, showing that extinction suppressed rather than erased the association
    A: acquisition, because the bell is gaining strength for the first time
    C: generalization, because a different tone was presented
    D: extinction, because the conditioned response had disappeared permanently
  answer: B
  explain: A response that returns after a rest following extinction is spontaneous recovery, evidence
    that the original learning was inhibited rather than wiped out.
  distractors:
    A: the association was already learned; this is a reappearance after a rest
    C: no new stimulus is involved; the original conditioned stimulus produced the response
    D: the response came back, which is exactly what extinction alone does not predict
  chapter: psychology
- id: nmat-d-p2s-003
  q: A child who watched a model being praised for hitting an inflatable doll later hits it far more
    often than a child who saw the model scolded. The difference demonstrates
  choices:
    C: vicarious reinforcement, learning the consequences of an act by watching them happen to someone
      else
    A: classical conditioning, because the model's praise was paired with the doll
    B: direct operant conditioning, since the child was reinforced for hitting
    D: insight learning, a sudden restructuring of how the toy works
  answer: C
  explain: 'Bandura''s finding: observing a model''s consequences changes the observer''s behavior,
    which is vicarious (or observational) learning rather than personal reinforcement.'
  distractors:
    A: the effect depends on observed consequences, not on stimulus pairing
    B: the observer was never rewarded personally; the model's outcome did the work
    D: nothing about the toy's workings was discovered; only its consequences changed
  chapter: psychology
- id: nmat-d-p2s-004
  q: Rats that wandered a maze for days with no food in the goal box ran it almost flawlessly as
    soon as food was finally placed there, matching rats rewarded all along. This shows
  choices:
    D: latent learning, a cognitive map formed without reward and revealed only when a reward appears
    A: shaping, because the delayed reward finally shaped the running response
    B: spontaneous recovery of a previously extinguished response
    C: discrimination learning between rewarded and unrewarded arms of the maze
  answer: D
  explain: 'Tolman''s latent learning: unrewarded exploration still builds a cognitive map, which
    stays hidden until a reward makes performance worthwhile.'
  distractors:
    A: no successive approximations were reinforced during the unrewarded wandering
    B: nothing had been extinguished; the response had never yet been displayed
    C: the rats did not learn which arms paid off; they learned the maze's layout
  chapter: psychology
- id: nmat-d-p2s-005
  q: A student is quizzed every Friday and studies hardest on Thursday nights, slacking off just
    after each quiz. Which schedule of reinforcement is at work?
  choices:
    D: fixed interval, which produces a post-reinforcement pause and a burst as the deadline nears
    A: fixed ratio, because the quiz rewards a set number of study responses
    B: variable ratio, because the exact study time needed is unpredictable
    C: continuous reinforcement, because every study session earns a quiz
  answer: D
  explain: A fixed interval schedule rewards the first response after a set time, producing the scalloped
    pattern of a pause followed by accelerating effort.
  distractors:
    A: the contingency is on time since the last quiz, not on a count of responses
    B: the interval is perfectly predictable at seven days
    C: most study sessions earn nothing; reward comes only at the interval's end
  chapter: fc7-behavior-and-behavior-change
- id: nmat-d-p2s-006
  q: A child who loved drawing produces far fewer pictures after her preschool begins giving prizes
    for each one. The best explanation is
  choices:
    A: the overjustification effect, an external reward undermines intrinsic interest
    B: positive reinforcement, which by definition strengthens the rewarded behavior
    C: extinction, because her drawings were no longer being noticed
    D: classical conditioning that paired the prize with the crayons
  answer: A
  explain: 'Lepper''s overjustification effect: paying for an already enjoyed activity shifts the
    perceived reason for doing it from interest to reward, and interest falls when the reward stops.'
  distractors:
    B: the behavior fell rather than rose, so reinforcement cannot be the explanation
    C: the drawings drew more attention than ever; they were paid for
    D: no conditioned emotional response to the crayons is at issue
  chapter: fc7-behavior-and-behavior-change
- id: nmat-d-p2s-007
  q: After memorizing her new mobile number, Ana finds she can no longer recall her old one. This
    failure is
  choices:
    B: retroactive interference, in which new learning disrupts recall of older material
    A: proactive interference, because the old number blocks the new one
    C: encoding failure, because the old number was never stored
    D: decay, because the memory simply faded with the passage of time
  answer: B
  explain: Newer learning interfering with older memories is retroactive interference; proactive
    interference would run the other way, old blocking new.
  distractors:
    A: that reverses the direction; here the newer item is the one doing the disrupting
    C: the old number was stored and used for years; the failure is at retrieval
    D: time alone is not the culprit; the interfering new learning is
  chapter: fc6-perceive-think-react
- id: nmat-d-p2s-008
  q: Scuba divers who memorized a word list underwater recall it far better when tested underwater
    than on land. This illustrates
  choices:
    C: context-dependent memory, because the physical setting supplies the retrieval cues present
      at encoding
    A: the testing effect, because retrieval practice strengthened the memory
    B: mood-congruent memory, because the environment matched the divers' mood
    D: anterograde amnesia for the list learned on land
  answer: C
  explain: 'Godden and Baddeley''s divers showed context-dependent memory: retrieval is best when
    the external cues at recall match those at encoding.'
  distractors:
    A: no repeated retrieval is involved; only the setting of the single test changed
    B: the match is to the external setting, not to an internal emotional state
    D: no memory disorder is involved; both groups encoded normally
  chapter: fc6-perceive-think-react
- id: nmat-d-p2s-009
  q: A manager who is convinced night-shift workers are lazy reads only the late-clock-in records
    and never looks at the early ones. This is
  choices:
    C: confirmation bias, seeking out and weighting evidence that supports an existing belief
    A: the availability heuristic, because late arrivals spring to mind easily
    B: hindsight bias, because the outcome now seems predictable in advance
    D: in-group favoritism, since he protects members of his own shift
  answer: C
  explain: Searching only for evidence that supports a prior belief, and ignoring the rest, is confirmation
    bias.
  distractors:
    A: the issue is selective evidence-gathering, not ease of recall
    B: nothing has happened yet to be judged 'predictable'; the search itself is biased
    D: no group membership or resource allocation is at stake
  chapter: fc6-perceive-think-react
- id: nmat-d-p2s-010
  q: After saturation news coverage of one plane crash, travellers judge flying far more dangerous
    than driving. This judgment illustrates
  choices:
    D: the availability heuristic, estimating frequency by how easily examples come to mind
    A: the representativeness heuristic, matching flying to a prototype of disaster
    B: anchoring, adjusting insufficiently from a first number they were given
    C: the fundamental attribution error, blaming the pilots' character
  answer: D
  explain: Judging an event's frequency by how easily instances are retrieved is the availability
    heuristic; vivid, heavily reported events are overestimated.
  distractors:
    A: no similarity-to-a-prototype judgment is being made; it is ease of retrieval
    B: no starting figure was offered for adjustment
    C: the judgment concerns event frequency, not a person's disposition
  chapter: fc6-perceive-think-react
- id: nmat-d-p2s-011
  q: Linda is 31, outspoken, and studied philosophy. Asked whether she is more likely to be a bank
    teller or a bank teller active in feminist causes, most people pick the second. The error is
  choices:
    A: representativeness with base-rate neglect, since the conjunction of two categories can never
      be more probable than one of them alone
    B: the availability heuristic, because feminist bank tellers are more vivid
    C: anchoring, because her age of 31 anchors the estimate
    D: functional fixedness, an inability to think of Linda in a new role
  answer: A
  explain: 'The conjunction fallacy (representativeness plus base-rate neglect): adding ''active
    in feminist causes'' makes the description fit better while making the category strictly smaller
    and so less likely.'
  distractors:
    B: the draw is the match between description and category, not vividness in memory
    C: no numerical anchor drives this judgment
    D: that is a problem-solving rigidity, not a probability error
  chapter: fc6-perceive-think-react
- id: nmat-d-p2s-012
  q: A committee that already leans toward a plan spends two hours discussing it, and members leave
    more decided and more extreme than when they arrived. This is
  choices:
    A: group polarization, in which deliberation among the like-minded intensifies the prevailing
      tendency
    B: groupthink, because dissenting members kept silent to preserve harmony
    C: deindividuation, because members lost self-awareness in the crowd
    D: conformity to a unanimous majority on an obvious judgment
  answer: A
  explain: 'When a like-minded group deliberates, the group''s initial leaning is amplified: group
    polarization.'
  distractors:
    B: silence for harmony is groupthink's signature, not the shift toward a stronger view
    C: no anonymity or loss of self-awareness is described
    D: the judgment is not obvious, and the group was unanimous from the start
  chapter: fc8-self-others-interactions
- id: nmat-d-p2s-013
  q: A tightly knit executive team approves a doomed project because nobody wants to sour the friendly
    consensus and the chair has signalled his preference early. This is
  choices:
    B: groupthink, in which the drive for consensus overrides realistic appraisal of alternatives
    A: group polarization, because the team's position became more extreme
    C: social loafing, because individual members let the others do the work
    D: obedience to authority, because members were ordered to approve it
  answer: B
  explain: 'Janis''s groupthink: cohesive groups that prize consensus and defer to a directive leader
    suppress dissent and skip realistic appraisal.'
  distractors:
    A: extremity is not the problem; the failure to test the decision is
    C: no diffusion of effort is described; effort went into preserving agreement
    D: no order was given; the pressure came from the group's own cohesion
  chapter: fc8-self-others-interactions
- id: nmat-d-p2s-014
  q: A homeowner who agreed to put a tiny sticker in her window is later far more likely to accept
    a large lawn sign for the same cause. This is
  choices:
    C: the foot-in-the-door technique, in which a small commitment paves the way to a larger one
    A: the door-in-the-face technique, which opens with an unreasonably large request
    B: low-balling, because the terms were changed after she agreed
    D: the that's-not-all technique, because an extra benefit was added before she replied
  answer: C
  explain: 'Securing a small commitment first makes people more likely to comply with a larger later
    request: the foot-in-the-door technique.'
  distractors:
    A: the sequence is reversed; the first request here was trivially small
    B: nothing was withdrawn or made costlier after her agreement
    D: no sweetener was offered; only the size of the request changed
  chapter: fc8-self-others-interactions
- id: nmat-d-p2s-015
  q: In a classic tug-of-war study, individuals pull less hard as the group grows larger, though
    each believes the others are trying. This is
  choices:
    D: social loafing, reduced individual effort when one's contribution is pooled and unidentifiable
    A: deindividuation, a loss of self-awareness that releases impulsive behavior
    B: the bystander effect, diffusion of responsibility during an emergency
    C: groupthink, in which consensus is valued over accuracy
  answer: D
  explain: 'Ringelmann''s social loafing: when individual output is pooled and unidentifiable, each
    person exerts less effort than when pulling alone.'
  distractors:
    A: the outcome is lowered effort, not disinhibited behavior
    B: nothing here is an emergency requiring intervention
    C: the effect is on effort, not on the quality of a decision
  chapter: fc8-self-others-interactions
- id: nmat-d-p2s-016
  q: Teachers are told that certain pupils, picked at random, are about to bloom. Months later those
    pupils score higher, having been given more attention and clearer feedback. This is
  choices:
    D: a self-fulfilling prophecy, in which an expectation changes the perceiver's behavior and so
      produces the expected outcome
    A: the fundamental attribution error, explaining the scores by the pupils' character
    B: the halo effect, one favorable trait coloring all other judgments
    C: regression toward the mean across repeated testings
  answer: D
  explain: 'Rosenthal and Jacobson''s expectancy effect: the teachers'' altered treatment, driven
    by a false belief, actually produced the predicted gains.'
  distractors:
    A: the gain came from changed treatment, not from a dispositional inference
    B: the halo effect is a rating bias and does not itself raise performance
    C: the randomly chosen group moved up rather than reverting, and treatment differed
  chapter: fc8-self-others-interactions
- id: nmat-d-p2s-017
  q: Strangers are divided into two groups by a coin toss and immediately rate their own group's
    members as more likable and allocate them more of a budget. This shows
  choices:
    A: in-group favoritism arising from mere categorization, the minimal group effect
    B: realistic conflict theory, competition over scarce resources
    C: obedience to authority, because the experimenter instructed them to discriminate
    D: the just-world hypothesis, the belief that people get what they deserve
  answer: A
  explain: 'Tajfel''s minimal group experiments: merely sorting people into arbitrary categories
    is enough to produce in-group favoritism.'
  distractors:
    B: there was no pre-existing conflict or resource scarcity before the coin toss
    C: no instruction to discriminate was given; the bias appeared on its own
    D: no judgment of deservingness drives the allocation
  chapter: fc8-self-others-interactions
- id: nmat-d-p2s-018
  q: An anthropologist interprets a community's funeral practices in terms of the meanings those
    practices carry for that community rather than by her own standards. Her stance is
  choices:
    B: cultural relativism, judging a practice within its own cultural context
    A: ethnocentrism, ranking the other culture against her own
    C: cultural diffusion, the spread of practices from one society to another
    D: xenocentrism, preferring other cultures' ways over one's own
  answer: B
  explain: Cultural relativism requires reading a practice in the terms of the culture that holds
    it, which is the opposite of judging it by one's own standards.
  distractors:
    A: that is the opposite stance, using her own culture as the measuring stick
    C: nothing is being transmitted between societies here
    D: no preference for foreign ways is expressed
  chapter: sociology-and-anthropology
- id: nmat-d-p2s-019
  q: 'A nurse who migrated a month ago feels persistently disoriented: the food, the queues, the
    jokes and the unspoken rules all feel wrong, and she doubts her own competence. She is experiencing'
  choices:
    C: culture shock, the disorientation that follows immersion in an unfamiliar culture
    A: assimilation, because she is adopting the host culture's ways
    B: cultural lag, because material culture changed faster than nonmaterial culture
    D: resocialization into her new hospital's total institution
  answer: C
  explain: Culture shock is the acute disorientation, self-doubt and stress of early immersion in
    an unfamiliar cultural environment.
  distractors:
    A: assimilation is the eventual adoption of the new ways, not the distress of first contact
    B: cultural lag describes a society's slow adjustment, not an individual's dislocation
    D: no total institution or deliberate retraining is described
  chapter: fc9-cultural-and-social-differences
- id: nmat-d-p2s-020
  q: A teenager who wears the wrong sneakers to school is mocked by classmates for a week. The mockery
    is
  choices:
    D: an informal negative sanction, an unplanned social reaction to a violated norm
    A: a formal negative sanction, because a written rule was applied by an authority
    B: a positive sanction, because it raises his standing in the group
    C: an internalized value, because he now believes the sneakers matter
  answer: D
  explain: Spontaneous, socially enforced disapproval of a norm violation is an informal negative
    sanction; formal sanctions come from official bodies applying written rules.
  distractors:
    A: no written rule, official or enforcement body, is involved
    B: the reaction is disapproving and costs him standing
    C: an internalized value is a personal belief, not an external social reaction
  chapter: sociology-and-anthropology
- id: nmat-d-p2s-021
  q: Besides teaching reading, public schools also occupy children through the workday, which employers
    and parents quietly depend on. In functionalist terms this second effect is
  choices:
    D: a latent function, an unrecognized and unintended consequence of the institution
    A: a manifest function, because it is deliberate and publicly acknowledged
    B: a dysfunction, because it disrupts the working of the school system
    C: a conflict-theory outcome, because schools reproduce class advantage
  answer: D
  explain: Merton distinguishes manifest (intended, recognized) from latent (unintended, often unrecognized)
    functions; supervised childcare is the classic latent function of schooling.
  distractors:
    A: childcare is not the school's declared purpose, which is instruction
    B: nothing here is harmful to the institution or society
    C: that is a different theoretical lens, and it points to inequality, not childcare
  chapter: sociology-and-anthropology
- id: nmat-d-p2s-022
  q: A household's income cannot provide the minimum calories, shelter and clothing needed to stay
    alive and healthy. This is
  choices:
    A: absolute poverty, a shortfall below a fixed subsistence threshold
    B: relative poverty, because the income falls below half the national median
    C: subjective poverty, because the household feels poor next to its neighbors
    D: the culture of poverty, a set of values transmitted across generations
  answer: A
  explain: Poverty below a fixed subsistence line, regardless of where others sit, is absolute poverty.
  distractors:
    B: relative poverty is defined by inequality against the society, not by survival needs
    C: subjective poverty rests on self-assessment rather than a subsistence line
    D: that refers to an alleged value system, not to a measure of resources
  chapter: fc10-stratification-and-resources
- id: nmat-d-p2s-023
  q: Across many countries, life expectancy climbs step by step with income, education and job grade,
    even among people who are not poor. This pattern is
  choices:
    B: the social gradient in health, where each step up the hierarchy buys better health
    A: the epidemiological transition, as chronic disease replaces infectious disease
    C: the demographic transition, as birth and death rates fall together
    D: medicalization, the redefinition of social problems as illnesses
  answer: B
  explain: The health gradient persists at every income level, showing that relative social standing,
    not only deprivation, shapes health outcomes.
  distractors:
    A: that describes changing causes of death over time, not a status-related gradient
    C: that describes population-level rate changes, not health by social position
    D: no relabeling of problems as disease is involved
  chapter: fc10-stratification-and-resources
- id: nmat-d-p2s-024
  q: In one firm, equally qualified women are concentrated in clerical roles and rarely reach management.
    The structural barrier at the top is called
  choices:
    C: the glass ceiling, an invisible institutional barrier to advancing into top positions
    A: the glass escalator, the fast track men ride in female-dominated occupations
    B: the second shift, the unpaid household labor done after a paid job
    D: tracking, the sorting of students into different school curricula
  answer: C
  explain: The glass ceiling is an invisible but real barrier that keeps women out of the top tiers
    of an occupational hierarchy.
  distractors:
    A: that term describes men's advancement in feminized fields, not women's blockage
    B: that concerns the domestic division of labor, not workplace promotion
    D: tracking happens in education, not in an occupational hierarchy
  chapter: fc10-stratification-and-resources
- id: nmat-d-p2s-025
  q: A census lumps together people of very different ancestries, rewords its categories every few
    decades, and yet people's self-reports stay remarkably stable. This shows that
  choices:
    B: race is a social construction, a category made and redefined by society rather than a fixed
      biological fact
    A: race is a straightforward genetic classification that the census measures
    C: ethnicity and race are identical, since both describe ancestry
    D: assimilation has erased all racial distinctions in the population
  answer: B
  explain: Categories that shift with legislation and politics while ancestries do not show that
    race is socially constructed rather than biologically fixed.
  distractors:
    A: the shifting categories and mixed ancestries contradict a pure genetic scheme
    C: ethnicity centers on culture and identity, while race is imposed by appearance and history
    D: the persistence of stable self-reports argues against such erasure
  chapter: fc9-cultural-and-social-differences
