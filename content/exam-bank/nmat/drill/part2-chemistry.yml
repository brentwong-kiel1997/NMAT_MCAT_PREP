items:
- id: nmat-d-p2c-001
  q: A compound is found by analysis to contain 40.0% C, 6.70% H and 53.3% O by mass.
    What is its empirical formula?
  choices:
    A: CH2O
    B: C2H4O2
    C: C3H6O3
    D: CH2O2
  answer: A
  explain: 'Dividing each mass by its atomic mass gives 3.33 mol C, 6.65 mol H and
    3.33 mol O; dividing all by 3.33 yields 1 : 2 : 1, so the empirical formula is
    CH2O.'
  distractors:
    B: doubled every ratio before reducing it to the simplest whole numbers
    C: kept the 1:2:1 ratio tripled instead of reducing it to the smallest whole numbers
    D: rounded the oxygen ratio up instead of dividing all three by the smallest
  chapter: general-chemistry
- id: nmat-d-p2c-002
  q: How many oxygen atoms are present in 0.250 mol of CO2?
  choices:
    B: 3.01 x 10^23
    A: 1.51 x 10^23
    C: 6.02 x 10^23
    D: 0.500 x 10^23
  answer: B
  explain: 0.250 mol x 2 O atoms per molecule = 0.500 mol of O atoms, and 0.500 x
    6.02 x 10^23 = 3.01 x 10^23 atoms.
  distractors:
    A: forgot that each CO2 molecule carries two oxygen atoms
    C: treated 0.250 mol as if it were 1.00 mol
    D: reported the moles of oxygen atoms as a count of atoms
  chapter: general-chemistry
- id: nmat-d-p2c-003
  q: How many liters of H2, measured at STP, are produced when 0.500 mol of zinc reacts
    completely with excess hydrochloric acid? (Zn + 2 HCl -> ZnCl2 + H2)
  choices:
    C: 11.2 L
    A: 22.4 L
    B: 5.60 L
    D: 0.500 L
  answer: C
  explain: The equation shows 1 mol Zn -> 1 mol H2, so 0.500 mol Zn gives 0.500 mol
    H2 = 0.500 x 22.4 L = 11.2 L at STP.
  distractors:
    A: read the coefficient 2 in front of HCl as applying to the hydrogen gas
    B: divided by 2 as if 2 mol of H2 came from 1 mol of Zn
    D: quoted the mole number as though it were a molar volume
  chapter: general-chemistry
- id: nmat-d-p2c-004
  q: Radon-222 (Z = 86) decays by alpha emission. What is the daughter nuclide?
  choices:
    D: polonium-218 (A = 218, Z = 84)
    A: radon-218 (A = 218, Z = 86)
    B: astatine-218 (A = 218, Z = 85)
    C: radon-226 (A = 226, Z = 86)
  answer: D
  explain: An alpha particle carries away 2 protons and 2 neutrons, so A drops from
    222 to 218 and Z from 86 to 84, which is polonium.
  distractors:
    A: subtracted 4 from the mass number but not from the atomic number
    B: treated alpha decay as the loss of a single proton
    C: added the alpha particle to the nucleus instead of ejecting it
  chapter: 4e-atoms-nuclear-decay-electronic-structure
- id: nmat-d-p2c-005
  q: O2-, F-, Na+ and Mg2+ all contain 10 electrons. Which is the largest?
  choices:
    D: O2-
    A: Mg2+
    B: Na+
    C: F-
  answer: D
  explain: All four species hold 10 electrons; with equal electron counts, the nucleus
    with the fewest protons (oxygen, 8) attracts them least, so O2- is largest.
  distractors:
    A: assumed that more protons means a larger ion, when they pull the same 10 electrons
      in tighter
    B: reasoned from the size of the neutral sodium atom rather than its ion
    C: judged by atomic size in the periodic table instead of by charge among isoelectronic
      species
  chapter: 4e-atoms-nuclear-decay-electronic-structure
- id: nmat-d-p2c-006
  q: How many unpaired electrons does a ground-state nitrogen atom (1s2 2s2 2p3) have?
  choices:
    A: 3, one in each of the three 2p orbitals
    B: '1'
    C: '0'
    D: '5'
  answer: A
  explain: Hund's rule puts the three 2p electrons into separate orbitals with parallel
    spins, so all three are unpaired and the 2s pair is not.
  distractors:
    B: paired two of the 2p electrons before each 2p orbital held one, violating Hund's
      rule
    C: assumed the 2p subshell is fully occupied; it holds only three of six possible
      electrons
    D: counted the 2s pair as unpaired along with the three 2p electrons
  chapter: 4e-atoms-nuclear-decay-electronic-structure
- id: nmat-d-p2c-007
  q: Which 1.0-m aqueous solution has the LOWEST freezing point?
  choices:
    B: 1.0 m NaCl
    A: 1.0 m glucose
    C: 0.50 m CaCl2
    D: 1.0 m sucrose
  answer: B
  explain: 'Freezing point depression tracks total dissolved particles: glucose and
    sucrose give 1.0 m, CaCl2 gives 1.5 m, and NaCl gives 2.0 m, so NaCl freezes lowest.'
  distractors:
    A: treated a nonelectrolyte as if it supplied as many particles as an electrolyte
    C: compared molalities instead of total particles (0.50 x 3 = 1.5 m)
    D: assumed sucrose, a nonelectrolyte, splits into several particles
  chapter: 5a-unique-nature-of-water-and-its-solutions
- id: nmat-d-p2c-008
  q: What is the boiling point of a solution made by dissolving 0.50 mol of NaCl in
    500 g of water? (Kb = 0.512 C/m)
  choices:
    C: 101.0 C
    A: 100.3 C
    B: 100.5 C
    D: 102.0 C
  answer: C
  explain: The molality is 0.50 mol/0.500 kg = 1.0 m, so the effective particle molality
    is 2.0 m and dTb = 0.512 x 2.0 = 1.0 C, giving 101.0 C.
  distractors:
    A: used 0.50 as the molality and never divided by the 0.500 kg of water
    B: forgot to double for dissociation, using i = 1
    D: took i = 4, as if NaCl dissociated into four particles
  chapter: 5a-unique-nature-of-water-and-its-solutions
- id: nmat-d-p2c-009
  q: A 0.10 M solution of a weak acid HA has Ka = 1.0 x 10^-5. What is its pH?
  choices:
    C: '3.00'
    A: '1.00'
    B: '5.00'
    D: '2.00'
  answer: C
  explain: For a weak acid [H+] = sqrt(Ka C) = sqrt(1.0 x 10^-5 x 0.10) = sqrt(1.0
    x 10^-6) = 1.0 x 10^-3 M, so pH = 3.00.
  distractors:
    A: assumed complete dissociation, as for a strong acid
    B: quoted pKa as though it were the solution's pH
    D: guessed 10% dissociation, giving 0.010 M H+ instead of 0.0010 M
  chapter: 5a-unique-nature-of-water-and-its-solutions
- id: nmat-d-p2c-010
  q: When 25.0 mL of 0.100 M acetic acid is titrated with 0.100 M NaOH, the pH at
    the equivalence point is
  choices:
    D: greater than 7, because the acetate ion hydrolyzes to produce OH-
    A: exactly 7, because the acid and base neutralize one another
    B: less than 7, because some acetic acid remains unreacted
    C: equal to pKa = 4.76, because the acid and base are present in equal amounts
  answer: D
  explain: At the equivalence point only sodium acetate remains; acetate hydrolyzes
    to give OH-, so the solution is basic (about pH 8.7).
  distractors:
    A: that holds for strong acid plus strong base; here the conjugate base is weakly
      basic
    B: at the equivalence point the acid is fully converted to acetate
    C: that is the half-equivalence point; at equivalence only the conjugate base
      remains
  chapter: analytical-chemistry
- id: nmat-d-p2c-011
  q: The Ksp of AgCl is 1.8 x 10^-10. What is its molar solubility in pure water?
  choices:
    A: 1.3 x 10^-5 M
    B: 1.8 x 10^-10 M
    C: 9.0 x 10^-11 M
    D: 2.7 x 10^-5 M
  answer: A
  explain: Ksp = s^2 for a 1:1 salt, so s = sqrt(1.8 x 10^-10) = 1.3 x 10^-5 M.
  distractors:
    B: quoted Ksp itself as the molar solubility
    C: halved Ksp instead of taking its square root
    D: doubled the square root, writing Ksp = 2s^2 rather than s^2
  chapter: analytical-chemistry
- id: nmat-d-p2c-012
  q: In acidic solution, how many moles of Fe2+ can 1.0 mol of dichromate ion (Cr2O7^2-
    -> 2 Cr3+) oxidize?
  choices:
    A: 6.0 mol
    B: 2.0 mol
    C: 3.0 mol
    D: 1.0 mol
  answer: A
  explain: Each chromium drops from +6 to +3, taking 3 electrons, and there are two
    chromium atoms, so 6 Fe2+ are oxidized per dichromate.
  distractors:
    B: matched the two chromium atoms instead of the electrons they absorb
    C: used the 3-electron change per chromium but forgot there are two chromium atoms
    D: matched the ions one to one without balancing the electron transfer
  chapter: analytical-chemistry
- id: nmat-d-p2c-013
  q: Burning 0.50 g of a fuel raises the temperature of 100 g of water by 8.0 C. What
    is the heat of combustion per gram of fuel? (c_water = 4.18 J/(g C))
  choices:
    B: 6.7 kJ/g
    A: 3.3 kJ/g
    C: 13.4 kJ/g
    D: 67 kJ/g
  answer: B
  explain: q = (100 g)(4.18 J/g C)(8.0 C) = 3.34 kJ for 0.50 g, which is 3.34/0.50
    = 6.7 kJ per gram.
  distractors:
    A: reported the total heat released as if it were the per-gram value
    C: divided the heat by 0.25 g instead of by the 0.50 g burned
    D: used 1.0 kg of water instead of 100 g
  chapter: 5e-chemical-thermodynamics-and-kinetics
- id: nmat-d-p2c-014
  q: A reaction takes 24 h at 20 C, and its rate doubles for every 10 C rise. How
    long should it take at 40 C?
  choices:
    C: about 6.0 h
    A: about 12 h
    B: about 48 h
    D: about 1.5 h
  answer: C
  explain: Two 10-degree steps quadruple the rate, and 24 h / 4 = 6.0 h.
  distractors:
    A: applied the doubling for only one 10-C step instead of two
    B: reversed the effect of temperature and slowed the reaction down
    D: halved the time for each step, multiplying the rate by 16
  chapter: 5e-chemical-thermodynamics-and-kinetics
- id: nmat-d-p2c-015
  q: A catalyst is added to a gaseous reaction mixture. Which statement is correct?
  choices:
    D: It lowers the activation energy in both directions, so equilibrium is reached
      faster while K is unchanged
    A: It shifts the equilibrium toward products and raises the yield
    B: It lowers the activation energy of the forward reaction only, so K increases
    C: It raises the temperature of the mixture, which speeds the reaction
  answer: D
  explain: A catalyst lowers Ea for both forward and reverse steps by the same amount,
    so equilibrium arrives sooner but K and the yield are untouched.
  distractors:
    A: a catalyst cannot change the position of equilibrium, only the time to reach
      it
    B: a catalyst must accelerate the reverse step equally, or it would violate thermodynamics
    C: the rate gain comes from a lower Ea, not from added heat
  chapter: 5e-chemical-thermodynamics-and-kinetics
- id: nmat-d-p2c-016
  q: For the equilibrium CaCO3(s) <=> CaO(s) + CO2(g), the correct expression for
    Kc is
  choices:
    D: Kc = [CO2]
    A: Kc = [CaO][CO2]/[CaCO3]
    B: Kc = 1/([CaO][CO2])
    C: Kc = [CaCO3]/([CaO][CO2])
  answer: D
  explain: 'Pure solids and pure liquids have constant concentrations and are excluded,
    leaving only the gas: Kc = [CO2].'
  distractors:
    A: included the pure solids, whose concentrations are constant and omitted from
      Kc
    B: inverted the expression and still kept the solid CaO
    C: wrote the reverse reaction's form and kept the solid in it
  chapter: 5e-chemical-thermodynamics-and-kinetics
- id: nmat-d-p2c-017
  q: Molten NaCl is electrolyzed using inert electrodes. What forms at each electrode?
  choices:
    A: sodium at the cathode and chlorine gas at the anode
    B: chlorine at the cathode and sodium at the anode
    C: hydrogen at the cathode and oxygen at the anode
    D: nothing, because a molten salt does not conduct electricity
  answer: A
  explain: In molten NaCl the mobile ions carry current; Na+ is reduced at the cathode
    and Cl- is oxidized at the anode.
  distractors:
    B: reversed the electrode polarities' roles; reduction, not oxidation, happens
      at the cathode
    C: there is no water in a molten salt, so no H+ or OH- exists to discharge
    D: molten salts conduct well, since the ions are mobile without a crystal lattice
  chapter: general-chemistry
- id: nmat-d-p2c-018
  q: Glycerol, with three -OH groups per molecule, is far more viscous than ethanol,
    with one. The best explanation is that
  choices:
    B: the extra -OH groups let glycerol form far more hydrogen bonds to neighboring
      molecules
    A: glycerol molecules are partly ionized, so ionic attractions hold the liquid
      together
    C: viscosity rises with molar mass alone, and glycerol is simply heavier
    D: ethanol's single -OH forms stronger hydrogen bonds than glycerol's three
  answer: B
  explain: More -OH groups mean more hydrogen-bonding sites per molecule, so the liquid's
    internal friction (viscosity) rises sharply.
  distractors:
    A: alcohol -OH groups hydrogen-bond but do not ionize appreciably in the pure
      liquid
    C: molar mass matters only insofar as it brings more interaction sites, which
      is the real cause
    D: one -OH cannot outweigh three; ethanol simply offers fewer bonding opportunities
  chapter: 5b-molecules-and-intermolecular-interactions
- id: nmat-d-p2c-019
  q: 2-bromo-2-methylpropane, a tertiary halide, reacts with water as the only nucleophile
    in a polar protic solvent. The mechanism and outcome are
  choices:
    A: SN2, with back-side attack and inversion at the carbon
    B: SN1, with complete inversion because the leaving group shields one face
    C: SN1, via a planar carbocation that water attacks from either side
    D: E2, because water is a strong enough base to eliminate
  answer: C
  explain: A tertiary halide in a polar protic solvent ionizes to a planar tertiary
    carbocation; water captures it to give tert-butanol. The carbinol carbon carries
    three identical methyl groups, so there is no stereocenter and the product is
    achiral — racemization never comes into play here.
  distractors:
    A: a tertiary carbon blocks back-side attack, and the polar protic solvent favors
      ionization
    B: the free carbocation is planar, so attack comes from both faces equally
    D: SN2 attack is from the side opposite the leaving group, giving inversion
  chapter: organic-chemistry
- id: nmat-d-p2c-020
  q: How many constitutional isomers does C5H12 have?
  choices:
    D: '3'
    A: '2'
    B: '5'
    C: '12'
  answer: D
  explain: 'C5H12 has three skeletons: n-pentane, 2-methylbutane and 2,2-dimethylpropane.'
  distractors:
    A: missed the most-branched isomer, 2,2-dimethylpropane
    B: took the number of carbons in the formula as the number of skeletons
    C: counted every hydrogen position as though it were a distinct skeleton
  chapter: organic-chemistry
- id: nmat-d-p2c-021
  q: 2-bromobutane is heated with ethanolic KOH, which promotes elimination. Which
    alkene is the major product?
  choices:
    D: 2-butene, the more substituted alkene
    A: 1-butene, because elimination removes the nearest beta hydrogen
    B: butane, because KOH replaces the bromine with hydrogen
    C: 2-methylpropene, because a rearranged skeleton is more substituted
  answer: D
  explain: In an E2 elimination the more substituted alkene is favored (Zaitsev),
    so 2-butene (trans-major) exceeds 1-butene.
  distractors:
    A: Zaitsev's rule favors the alkene with more alkyl substituents, not the nearer
      beta carbon
    B: ethanolic KOH promotes elimination rather than reduction
    C: the carbon skeleton is conserved in E2 elimination; no rearrangement occurs
  chapter: organic-chemistry
- id: nmat-d-p2c-022
  q: How many water molecules are required to hydrolyze a pentapeptide completely
    into five free amino acids?
  choices:
    A: 4, one per peptide bond
    B: 5, one per amino acid produced
    C: 3, one fewer than the number of residues
    D: 1, since a single water molecule can split the whole chain
  answer: A
  explain: A pentapeptide has four peptide bonds, and hydrolysis consumes one water
    per bond, so four water molecules are needed.
  distractors:
    B: the last residue is released without breaking a bond; only the links between
      residues need water
    C: a pentapeptide contains four peptide bonds, not three
    D: each peptide bond needs its own water molecule
  chapter: 5d-biologically-relevant-molecules
- id: nmat-d-p2c-023
  q: Analysis of a sample of double-stranded DNA shows that 30% of its bases are adenine.
    What are the percentages of cytosine and guanine?
  choices:
    B: cytosine 20% and guanine 20%
    A: cytosine 35% and guanine 35%
    C: cytosine 30% and guanine 30%
    D: cytosine 15% and guanine 15%
  answer: B
  explain: Chargaff's rules give T = A = 30%, so G plus C = 40% and, being equal,
    C = G = 20%.
  distractors:
    A: forgot that thymine must equal adenine, leaving only 40% for G plus C
    C: assumed all four bases occur equally, contradicting the 30% adenine given
    D: split the 30% adenine figure between C and G instead of working from the 100%
      total
  chapter: biochemistry
- id: nmat-d-p2c-024
  q: A competitive inhibitor is added to an enzyme reaction. How do the apparent Km
    and Vmax change?
  choices:
    C: Km increases and Vmax is unchanged
    A: Km is unchanged and Vmax decreases, which is what happens with a noncompetitive
      inhibitor
    B: both Km and Vmax decrease
    D: Km decreases and Vmax increases
  answer: C
  explain: A competitive inhibitor competes for the active site, so more substrate
    is needed to reach half-maximal velocity (higher Km) while the ceiling (Vmax)
    is still attainable.
  distractors:
    A: that describes noncompetitive inhibition, which lowers the active enzyme's
      effective amount
    B: a competitive inhibitor can be overcome at high substrate, so Vmax survives
    D: an inhibitor cannot raise the enzyme's apparent affinity or its maximum rate
  chapter: biochemistry
- id: nmat-d-p2c-025
  q: A solid sample consists of benzoic acid contaminated with sand and a little sodium
    chloride. The best purification is to
  choices:
    B: dissolve in hot water, filter off the sand, and cool the filtrate so the benzoic
      acid recrystallizes
    A: heat the mixture strongly and distill the benzoic acid over
    C: dissolve everything in water and evaporate to dryness, leaving pure acid
    D: separate the dry powder by filtration, since the salt crystals are larger than
      the acid crystals
  answer: B
  explain: 'Benzoic acid is much more soluble in hot water than cold, salt stays dissolved
    on cooling, and the sand is removed by hot filtration: recrystallization.'
  distractors:
    A: benzoic acid sublimes and decomposes near its boiling point, and the salt is
      nonvolatile
    C: evaporation keeps the salt with the acid; it cannot separate them
    D: dry filtration cannot part two solids; a separation needs a difference in solubility
      or volatility
  chapter: 5c-separation-and-purification-methods
