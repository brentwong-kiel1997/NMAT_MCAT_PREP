# Learning projects over the unified chapter library.
# A unit IS a discipline: it shows ALL that discipline's chapters at once,
# FILTERED by the project's exam — an NMAT unit lists the discipline's chapters
# annotated NMAT (shared chapters appear in both projects' views; that is by design).
# Chapter lists are DERIVED from each chapter's exams field — never listed here.

projects:
  nmat:
    name: NMAT
    units:
    - key: nmat-verbal
      source: verbal
      label: Verbal
      cross: []
    - key: nmat-inductive-reasoning
      source: inductive-reasoning
      label: Inductive Reasoning
      cross: []
    - key: nmat-quantitative
      source: quantitative
      label: Quantitative
      cross: []
    - key: nmat-perceptual-acuity
      source: perceptual-acuity
      label: Perceptual Acuity
      cross: []
    - key: nmat-biology
      source: biology
      label: Biology
      cross:
      - mcat-biology
    - key: nmat-biochemistry
      source: biochemistry
      label: Biochemistry
      cross:
      - mcat-biochemistry
    - key: nmat-chemistry
      source: chemistry
      label: Chemistry
      cross:
      - mcat-chemistry
    - key: nmat-physics
      source: physics
      label: Physics
      cross:
      - mcat-physics
    - key: nmat-behavioral-social
      source: behavioral-social
      label: Behavioral & Social
      cross:
      - mcat-behavioral-social
  mcat:
    name: MCAT
    units:
    - key: mcat-biology
      source: biology
      label: Biology
      cross:
      - nmat-biology
    - key: mcat-biochemistry
      source: biochemistry
      label: Biochemistry
      cross:
      - nmat-biochemistry
    - key: mcat-chemistry
      source: chemistry
      label: Chemistry
      cross:
      - nmat-chemistry
    - key: mcat-physics
      source: physics
      label: Physics
      cross:
      - nmat-physics
    - key: mcat-behavioral-social
      source: behavioral-social
      label: Behavioral & Social
      cross:
      - nmat-behavioral-social
    - key: mcat-psych-soc
      source: psych-soc
      label: Psychology & Sociology
      cross: []
    - key: mcat-cars
      source: cars
      label: CARS
      cross: []
