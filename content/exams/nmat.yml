slug: nmat
name: NMAT
full_name: National Medical Admission Test
admin: CEM (Center for Educational Measurement)
format: Two parts, 240 MCQs, 30 per subtest. Part 1 mental ability 2h15m; Part 2 academic 1h30m; ~10-minute
  break.
parts:
- id: part1
  name: Part 1 · Mental Ability
  time: 2 hours 15 minutes
  items: 120
  subject_refs:
  - inductive-reasoning
  - perceptual-acuity
  - quantitative
  - verbal
- id: part2
  name: Part 2 · Academic Proficiency
  time: 1 hour 30 minutes
  items: 120
  subjects:
  - slug: biology
    name: Biology
    shared: biology
    items: 30
    item_types: []
    focus: Intro college biology. See shared subject page for chapters.
  - slug: physics
    name: Physics
    shared: physics
    items: 30
    item_types: []
    focus: Intro college physics. See shared subject page for chapters.
  - slug: social-science
    name: Social Science
    shared: behavioral-social
    items: 30
    item_types:
    - Psychology
    - Sociology and Anthropology
    focus: Intro psych / sociology & anthropology. See shared subject page.
  - slug: chemistry
    name: Chemistry
    shared: chemistry
    items: 30
    item_types: []
    focus: Intro gen/analytical/organic/biochem. See shared subject page.
blueprint:
  blocks:
  - id: part1
    label: Part 1 · Mental Ability
    seconds: 8100
    items: 120
    bank: [part1-verbal, part1-inductive, part1-quantitative, part1-perceptual]
  - id: part2
    label: Part 2 · Academic Proficiency
    seconds: 5400
    items: 120
    bank: [part2-biology, part2-physics, part2-social-science, part2-chemistry]
    break_before:
      seconds: 600
      label: 10-minute break (Part 1 → Part 2)
