slug: nmat
name: NMAT
full_name: National Medical Admission Test
admin: CEM (Center for Educational Measurement)
format: Two parts, 240 MCQs, 30 per subtest. Part 1 mental ability 2h15m; Part 2 academic 1h30m; ~10-minute
  break.
parts:
- id: part1
  name: Part 1 · Mental Ability
  time: 2 hours 15 minutes
  items: 120
  subject_refs:
