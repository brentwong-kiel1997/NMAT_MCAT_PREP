slug: physics
chapters:
- title: Mechanics
  bullets:
  - Newton’s laws and free-body diagrams
  - Work–energy theorem; when mechanical energy is conserved
  - 'Momentum conservation: collisions and impulse'
  - 'Newton’s second law: ΣF = ma (vector form)'
  - Kinetic energy Ek = ½mv²; gravitational Ep = mgh
  - Impulse J = FΔt = Δp
  - 'Rotation: τ = Iα; angular momentum L = Iω'
- title: Thermodynamics
  bullets:
  - Distinguish temperature, internal energy, heat
  - 'First law: ΔU = Q − W (watch sign convention)'
  - Entropy intuition and irreversible processes
  - Heat-engine efficiency bounded by Carnot limit
  - 'Isothermal vs adiabatic: different Q and ΔU relations'
  - 'Entropy increase: spontaneous processes in isolated systems raise ΔS'
- title: Vibrations, Waves, and Optics
  bullets:
  - 'SHM: period and energy exchange'
  - Wave speed v = fλ; interference/diffraction conditions
  - Reflection/refraction; keep lens-sign conventions consistent
  - SHM period T = 2π√(m/k)
  - 'Standing waves: fixed node and antinode positions'
  - 'Thin lens: 1/f = 1/do + 1/di'
- title: Electricity and Magnetism
  bullets:
  - Coulomb force/fields; potential difference and work
  - Ohm’s law, series/parallel, power in circuits
  - Magnetic force on moving charges (Lorentz intuition)
  - Coulomb force F = kq₁q₂/r²
  - Parallel 1/R = Σ1/Ri; series R = ΣRi
  - 'Lenz’s law: induced current opposes flux change'
- title: Modern Physics
  bullets:
  - Photon energy E = hf; photoelectric highlights
  - Energy levels and spectral lines
  - 'Nuclear decay: half-life and conserved quantities'
  - E = hf; photon momentum p = h/λ
  - de Broglie λ = h/p
  - Half-life decay N = N₀(½)^(t/t½)
- title: 4A · Motion, forces, work, energy, equilibrium
  bullets:
  - Translate physio scenarios into force/energy problems
  - 'Static equilibrium: net force and torque zero'
  - Work and power show up in muscle/circulation items
  - 'Incline decomposition: parallel/perpendicular gravity components'
  - Power P = Fv when force aligns with velocity
  - 'Lever equilibrium: F₁d₁ = F₂d₂'
- title: 4B · Fluids, circulation, gas exchange
  bullets:
  - 'Continuity: A₁v₁ = A₂v₂'
  - 'Bernoulli: speed up → pressure down (ideal intuition)'
  - 'Poiseuille: flow extremely sensitive to radius'
  - Buoyancy Fb = ρfluid Vdisplaced g
  - Blood pressure ≈ flow × resistance (Ohm-like analogy)
  - Surface tension and capillary rise in narrow tubes
- title: 4C · Electrochemistry and circuits
  bullets:
  - 'Cells: redox and electron flow'
  - Series/parallel resistance and equivalents
  - Capacitor charge/discharge and time-constant idea
  - E°cell = E°red − E°ox (watch sign convention)
  - Capacitance C = Q/V; parallel capacitors add
  - RC time constant τ = RC
- title: 4D · Light and sound with matter
  bullets:
  - 'Sound: intensity, attenuation, Doppler'
  - 'Light: index, TIR, lens imaging'
  - Physical limits of ultrasound/optics in diagnosis (intro)
  - Index n = c/v; Snell’s law n₁sinθ₁ = n₂sinθ₂
  - 'Doppler: source/observer motion shifts frequency'
  - Resonance when driving frequency matches natural frequency
- title: 4E · Atoms and electronic structure
  bullets:
  - Level transitions and absorption/emission spectra
  - 'Photoelectric: frequency threshold and KE'
  - 'Absorption spectra: electrons jump to higher levels'
  - Photoelectric threshold frequency is material-specific
- title: 4E · Atoms, nuclear decay, electronic structure
  bullets:
  - Photon energy E=hf=hc/λ; photoelectric KE_max=hf−φ
  - 'Bohr model: quantized levels; absorption/emission from transitions'
  - 'Binding energy: mass defect converts to nuclear energy'
- title: 4D · Light and sound interacting with matter
  bullets:
  - 'Reflection: i=r; refraction follows Snell’s law'
  - 'Interference: path difference of integer λ → constructive'
  - Sound intensity level in dB compresses dynamic range logarithmically
  - 'Doppler: approach raises frequency; recession lowers it'
