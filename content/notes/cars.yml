slug: cars
chapters:
- title: Foundations of Comprehension
  bullets:
  - Topic ≠ Thesis
  - 'Label functions: example, concession, contrast'
  - Separate author voice from quoted viewpoints
  - First sentence may not be thesis; find synthesizing lines
  - 'Mark attitude cues: emphasis, skepticism, concession'
  - 'Paragraph jobs: exemplify, contrast, define, advance claim'
- title: Reasoning Within the Text
  bullets:
  - Ask what supports the author’s claim
  - 'Strong distractor: true in world, absent in passage'
  - 'Strengthen items: premises or evidence backing the conclusion'
  - 'Weaken items: attack assumptions or supply counterexamples'
  - Inferences must be text-supported; outside knowledge isn’t evidence
  - 'Find support lines: correct answers often paraphrase the text'
- title: Reasoning Beyond the Text
  bullets:
  - New scenarios must keep the principle intact
  - Failed analogies usually mismatch the relation
  - Application items map core principles, not surface similarity
  - Integrated outside info must not contradict the passage
  - 'Application: transfer a passage principle to a new scenario'
  - 'Weaken/strengthen: target the argument’s key assumption'
