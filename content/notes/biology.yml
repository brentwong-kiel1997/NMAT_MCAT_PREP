slug: biology
chapters:
- title: Unity and Diversity of Life
  bullets:
  - 'Shared traits: cells, metabolism, homeostasis, reproduction, adaptation'
  - Domain/kingdom hierarchy organizes diversity — not rote species lists
  - 'Homology vs analogy: shared ancestry vs similar function'
  - 'Three-domain system: Bacteria, Archaea, Eukarya'
  - 'Natural selection: variation + selection + time → adaptation'
  - 'Species concept: reproductive isolation is a core criterion'
- title: Cells and Cellular Processes
  bullets:
  - Prokaryotes lack membrane-bound nucleus; eukaryotes have compartmentalization
  - 'Transport: simple/facilitated diffusion, active transport, endo/exocytosis'
  - Enzymes lower activation energy; affected by T, pH, inhibitors
  - 'Respiration spine: glycolysis → pyruvate oxidation → TCA → ETC/oxphos'
  - Mitochondria and chloroplasts support endosymbiosis theory
  - Na⁺/K⁺ pump maintains membrane potential and cell volume
  - 'Competitive vs noncompetitive inhibition: different Km/Vmax shifts'
  - Aerobic ETC uses O₂ as terminal acceptor; anaerobic uses alternatives
- title: Genetics
  bullets:
  - 'Central dogma: DNA → RNA → protein (plus common caveats)'
  - 'Mendel: segregation & independent assortment; phenotype/genotype ratios'
  - 'Mutations: point, frameshift, chromosomal structure/number'
  - Meiosis yields haploid gametes and reassorts diversity
  - Dominant/recessive/codominant/incomplete dominance alter ratios
  - Linked genes deviate from 9:3:3:1; recombination rate reflects distance
  - 'X-linked: males more often express recessive traits'
  - 'Epigenetics: heritable expression changes without DNA sequence change'
- title: The World of Plants and Animals
  bullets:
  - 'Plants: light/dark reactions; stomata and transpiration'
  - 'Animals: surface-area tradeoffs for exchange, circulation, gas exchange'
  - Comparative anatomy emphasizes functional constraints, not jargon piles
  - 'C₃/C₄/CAM plants: carbon-fixation paths and climate adaptation'
  - 'Open vs closed circulation: insects vs vertebrates'
  - 'Adaptive radiation: common ancestor → diverse niche forms'
- title: Development
  bullets:
  - Fertilization → cleavage → blastula → gastrula → organogenesis (intro)
  - 'Differentiation: selective gene expression, not genome loss (usually)'
  - Induction and signaling set cell fates
  - Morphogen gradients set body axes and organ positions
  - Hox genes conservatively pattern development
  - Stem-cell potency decreases with developmental stage
- title: 'Life Processes: Regulation and Homeostasis'
  bullets:
  - Negative feedback stabilizes; positive feedback amplifies brief events
  - Endocrine and nervous systems are the two major coordinators
  - Temperature, glucose, and osmolarity are classic homeostasis examples
  - Insulin lowers glucose; glucagon raises glucose
  - 'Nephron: filtration → reabsorption → secretion regulates fluids'
  - 'Thermoregulation: sweating/vasomotion plus behavioral adjustments'
- title: Organisms and Their Environment
  bullets:
  - Population, community, ecosystem levels
  - Energy flows one way; matter cycles
  - 'Species interactions: predation, competition, symbiosis'
  - '~10% energy transfer rule: heavy loss between trophic levels'
  - 'Succession: pioneer species alter environment → community turnover'
  - 'Niche: functional role across resource and time dimensions'
- title: 1C · Heritable information & genetic diversity
  bullets:
  - Semiconservative replication; mutation feeds variation
  - Meiotic recombination + assortment → gamete diversity
  - 'HWE ideal: no mutation/selection/drift/migration + random mating'
  - Polymerase proofreading + mismatch repair boost fidelity
  - Crossing over occurs in prophase I of meiosis
  - 'Hardy–Weinberg: p² + 2pq + q² = 1'
- title: 2A · Assemblies of molecules, cells, and cell groups
  bullets:
  - 'Hierarchy: macromolecules → organelles → tissues'
  - Junctions and ECM support tissue function
  - Amphipathic phospholipids define the bilayer core
  - Tight junctions block leak; desmosomes resist pull
  - 'Tissues: epithelial, connective, muscle, nervous'
- title: 2B · Prokaryotes and viruses
  bullets:
  - 'Bacteria: cell wall, plasmids, binary fission'
  - Viruses need hosts; lysogeny/lysis idea
  - Antibiotics often hit prokaryote-specific targets (e.g., cell wall)
  - Gram-positive thick peptidoglycan; negative outer membrane
  - 'Operon: prokaryotic co-regulated gene cluster'
  - Retroviruses use reverse transcriptase to integrate into host genome
- title: 2C · Cell division, differentiation, specialization
  bullets:
  - Mitosis keeps chromosome number; meiosis halves it
  - Checkpoints vs uncontrolled growth (intro)
  - 'Stem cells: self-renewal + differentiation potential'
  - G₁/S/G₂/M checkpoints monitor DNA damage and spindle attachment
  - Cyclin–CDK complexes drive the cell cycle
  - Loss of contact inhibition marks cultured cancer cells
- title: 3A · Nervous & endocrine coordination
  bullets:
  - 'Neural: fast/local; endocrine: slower/broad'
  - 'AP: depol→repol; chemical synaptic transmission'
  - Peptide vs steroid hormone signaling differs
  - Resting potential ≈ K⁺ outflow; AP peak from Na⁺ influx
  - Myelin enables saltatory conduction over long distances
  - 'Negative-feedback axes: thyroid and adrenal cortex examples'
- title: 3B · Main organ systems
  bullets:
  - 'Exchange surfaces: alveoli, villi, nephrons'
  - 'Circulation: cardiac output, pressure, resistance intuition'
  - 'Per system ask: input, processing, output, feedback loop'
  - 'Hb-O₂ curve: cooperative binding and Bohr effect'
  - Cardiac output = heart rate × stroke volume
  - 'Immunity: innate (fast) vs adaptive (specific memory)'
