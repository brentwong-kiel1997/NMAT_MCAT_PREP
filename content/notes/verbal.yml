slug: verbal
chapters:
- title: Analogies
  bullets:
  - State the pair relation in one sentence, then test options
  - Watch same-topic distractors with different relations
  - Degree, cause-effect, and part-whole are high-frequency
  - Eliminate options whose relation type mismatches first
  - For verb pairs watch transitivity and causal direction
  - State the A:B relation first, then map C:?
  - 'Common relations: synonym, antonym, part–whole, cause, degree'
- title: Reading Comprehension
  bullets:
  - Hunt thesis sentences and contrast markers first
  - 'Detail items: relocate in text; don’t rely on memory'
  - Inferences must be text-supported
  - 'Paragraph-function items: define, exemplify, refute, transition'
  - Reject absolute wording unless the passage supports it
  - 'Main-idea items: prioritize openings, closings, and contrast markers'
  - 'Detail items: return to the text; don’t rely on memory alone'
- title: Word Analogies / Vocabulary
  bullets:
  - State the A:B relation first, then map C:?
  - 'Common relations: synonym, antonym, part–whole, cause, degree'
- title: Reading Comprehension / Verbal Ability
  bullets:
  - 'Main-idea items: prioritize openings, closings, and contrast markers'
  - 'Detail items: return to the text; don’t rely on memory alone'
