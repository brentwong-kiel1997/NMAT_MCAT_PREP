slug: chem-phys
chapters:
- title: 4A · Motion, forces, work, energy, equilibrium
  bullets:
  - Translate physio scenarios into force/energy problems
  - 'Static equilibrium: net force and torque zero'
  - Chem/Phys often casts musculoskeletal items as torque balance
  - Energy conservation requires noting nonconservative work
- title: 4B · Fluids for circulation and gas exchange
  bullets:
  - Continuity equation and Bernoulli intuition
  - Resistance, radius, flow (Poiseuille idea)
  - Under laminar flow, Poiseuille Q ∝ r⁴
  - Alveolar gas exchange depends on diffusion–perfusion matching
- title: 4C · Electrochemistry and electrical circuits
  bullets:
  - Half-reactions and electron flow
  - Ohm’s law with series/parallel
  - Standard hydrogen electrode E° = 0 V as reference
  - Electrolyte concentration shifts cell voltage (nonstandard conditions)
- title: 4D · Light and sound interacting with matter
  bullets:
  - Refraction/TIR/lenses; sound intensity and Doppler
  - Higher ultrasound frequency → better resolution, less penetration
  - TIR critical angle sinθc = n₂/n₁ when n₁ > n₂
  - Ultrasound imaging uses reflection from acoustic-impedance mismatches
  - 'Lens: 1/f=1/o+1/i; magnification m=−i/o'
- title: 4E · Atoms, nuclear decay, electronic structure
  bullets:
  - Levels, spectra, exponential half-life
  - 'Medical isotopes: moderate half-life with gamma emission'
  - MCAT often pairs nuclear decay with half-life graphs
  - Electronic energy gaps map to absorption/emission lines
  - Mass number A = protons + neutrons; isotopes share Z, differ in A
- title: 5A · Unique nature of water and its solutions
  bullets:
  - H-bonding, heat capacity, hydrophobic effect
  - Acid–base balance and buffers
  - Proton hopping enables fast acid equilibration in water
  - Amphiphiles self-assemble into micelles/bilayers in water
- title: 5B · Molecules and intermolecular interactions
  bullets:
  - IMFs shape melting point and solubility
  - H-bond donor/acceptor pairing drives specificity
  - 'Rough IMF strength: ionic > H-bond > dipole > dispersion'
  - 'Raoult’s law: vapor pressure tracks mole fraction in ideal solutions'
- title: 5C · Separation and purification methods
  bullets:
  - Chromatography/electrophoresis separate by property
  - 'HPLC: high pressure boosts resolution and speed'
  - Electrophoretic mobility depends on charge and size
  - TLC Rf = spot distance / solvent-front distance
  - Electrophoresis separates by charge/mass; pI used for proteins
- title: 5D · Biologically relevant molecules
  bullets:
  - Acid-base/H-bonding behavior of groups in water
  - Peptide bond formation/hydrolysis
  - Active sites often harbor catalytic acid/base residues
  - Phosphodiester bonds link nucleic-acid backbones
  - Peptide-bond resonance planarizes and restricts rotation
- title: 5E · Chemical thermodynamics and kinetics
  bullets:
  - ΔG vs rate; catalysts don’t change equilibrium position
  - Michaelis–Menten v = Vmax[S]/(Km + [S])
  - 'Transition-state theory: k linked to exp(−Ea/RT)'
  - 'Passage energy diagrams: read ΔH, Ea, and intermediates'
  - 'Zero/first/second order: distinct concentration–time plots'
