slug: biochemistry
chapters:
- title: Chemistry · Biochemistry（CEM）
  bullets:
  - 'NMAT Chemistry biochem block: amino acids, enzymes, metabolic hubs'
  - Overlaps MCAT Bio/Biochem FC1 — shared review works
  - NMAT biochem block often ties enzymes, amino acids, and pathways
  - 'Hub metabolites: glucose, pyruvate, acetyl-CoA'
- title: 1A · Proteins and amino acids
  bullets:
  - '20 common amino acids: nonpolar/polar/acidic/basic sides'
  - Primary→quaternary structure; denaturation hits higher order
  - 'Enzymes: active site, cofactors, allosteric regulation'
  - 'Isoelectric point pI: pH where net charge is zero'
  - Cooperative binding yields sigmoid oxygenation curves
  - 'Irreversible inhibition: covalent modification of active site'
- title: 1B · Gene to protein
  bullets:
  - Transcription and eukaryotic RNA processing
  - Degenerate code; start/stop codons
  - 'Translation: ribosome, tRNA, peptide elongation'
  - 5' cap and poly-A tail stabilize eukaryotic mRNA
  - Intron splicing catalyzed by snRNPs
  - Wobble hypothesis explains third-base codon degeneracy
- title: 1C · Heritable information & diversity
  bullets:
  - Semiconservative replication; proofreading/repair
  - Meiotic recombination and independent assortment
  - Mutation plus selection/drift change allele frequencies (intro)
  - Telomerase compensates end shortening in germline/stem cells
  - Frameshift mutations often impact more than missense
- title: 1D · Bioenergetics and fuel metabolism
  bullets:
  - ATP as energy currency; coupled reactions
  - Glycolysis vs gluconeogenesis; glycogen regulation
  - Fatty-acid oxidation and ketone bodies (intro)
  - 'OxPhos: proton gradient drives ATP synthesis'
  - Glycolysis nets 2 ATP + 2 NADH (cytoplasm)
  - 'TCA per acetyl-CoA: 3 NADH, 1 FADH₂, 1 GTP'
  - Fatty-acid β-oxidation in mitochondria yields acetyl-CoA
- title: Amino acids, peptides, and proteins
  bullets:
  - Essential amino acids must come from the diet
  - Primary structure is peptide sequence; higher orders use noncovalent forces
  - Denaturation disrupts higher structure without necessarily breaking peptide bonds
- title: Enzymes and regulation
  bullets:
  - 'Allostery: effector at a distant site changes activity'
  - 'Feedback inhibition: end product inhibits an upstream enzyme'
  - 'Cooperative enzymes: substrate binding alters affinity of other subunits'
- title: Metabolism and bioenergetics
  bullets:
  - Gluconeogenesis is mainly hepatic; bypasses irreversible glycolytic steps
  - Ketone bodies partially fuel the brain in prolonged fasting
  - NADH and FADH₂ enter the ETC at different points → different ATP yields
- title: Nucleic acids and gene expression
  bullets:
  - 'Codon degeneracy: most amino acids have multiple codons'
  - Splicing removes introns; alternative splicing increases protein diversity
- title: Lab techniques and analysis
  bullets:
  - 'PCR: denature–anneal–extend cycles amplify DNA'
  - Western detects specific proteins; Southern detects DNA
