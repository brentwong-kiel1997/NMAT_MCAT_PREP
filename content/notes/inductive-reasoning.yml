slug: inductive-reasoning
chapters:
- title: Figure Series
  bullets:
  - Track position, count, fill, and rotation as separate threads
  - Multiple rules may stack — find the steadiest change first
  - Odd/even terms may follow different sub-rules
  - Rotation often uses fixed steps (90°, 45°)
- title: Figure Grouping
  bullets:
  - Find the shared trait or the odd one out
  - Ignore decoration; grab topology/count structure
  - Symmetry (line/point) is a common grouping key
  - 'Seek shared features: sides, symmetry, fill, rotation'
  - Eliminate near-miss distractors that almost match
  - Group by rule consistency, not subjective preference
- title: Number and Letter Series
  bullets:
  - Check arithmetic, multiplicative, alternating, place-value rules
  - Letters often map to alphabet indices
  - 'Second-order difference: deltas form an arithmetic series'
  - Prime/composite or square/cube subsequences
