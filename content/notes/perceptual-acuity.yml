slug: perceptual-acuity
chapters:
- title: Hidden Figure
  bullets:
  - Track outline, not fill
  - Match in segments faster than whole-figure search
  - Rotating the page can reduce visual clutter
  - Lock onto target contours; ignore background texture
  - Recognize the same shape after rotation or mirroring
- title: Mirror Image
  bullets:
  - Left-right mirror ≠ rotation
  - Spot-check asymmetric features quickly
  - 'Mirrored digits/letters: b/d and p/q confuse easily'
  - Decide mirror axis (vertical/horizontal), then compare features
  - Rotation ≠ reflection; common trap distractors
- title: Identical Information
  bullets:
  - 'Scan systematically: top→bottom or left→right'
  - Hunt decisive differences first
  - Punctuation and spacing gaps are common traps
  - Compare digit/letter strings item-by-item; don’t skip a place
  - Watch case and symbol differences
