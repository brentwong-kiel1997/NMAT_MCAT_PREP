slug: chemistry
chapters:
- title: General Chemistry
  bullets:
  - Mole, limiting reagent, yield
  - 'Acids/bases: pH, buffers, titration-curve intuition'
  - 'Equilibrium: Le Chatelier; K vs Q'
  - 'Redox: oxidation numbers, half-reactions'
  - Ideal gas PV = nRT; match R units to pressure/volume
  - ΔG = ΔH − TΔS; spontaneity requires ΔG < 0
  - 'Buffer: weak acid + conjugate base resists pH change'
  - 'Redox: electrons flow from reductant to oxidant'
- title: Analytical Chemistry
  bullets:
  - Accuracy vs precision
  - 'Titration/spectroscopy/chromatography: what is measured vs separated'
  - Calibration curves and blank controls
  - 'Beer’s law: A = εlc (linear region for dilute solutions)'
  - Systematic error is correctable; random error shrinks with replication
  - Internal standards correct injection and instrument drift
- title: Organic Chemistry
  bullets:
  - Functional groups drive reactivity (alcohol, carbonyl, acid, amine)
  - Nucleophile/electrophile and acid-base character shape pathways
  - 'Isomerism: structural and stereo (intro)'
  - 'SN1: tertiary substrate, weak nucleophile, solvent stabilizes carbocation'
  - 'SN2: primary substrate, strong nucleophile, backside attack inversion'
  - 'Carbonyl addition: aldehyde/ketone vs carboxyl derivative reactivity'
- title: Biochemistry
  bullets:
  - Side-chain polarity/charge shape folding and function
  - 'Enzyme kinetics: intuitive Vmax and Km'
  - 'Metabolic hubs: glucose, acetyl-CoA, ATP/NADH'
  - Peptide bond planarity restricts backbone rotation
  - 'Allosteric enzymes: substrate binding alters other-site affinity'
  - Coenzymes NAD⁺/FAD serve as redox carriers
- title: 5A · Water and its solutions
  bullets:
  - H-bonding explains heat capacity and solvent power
  - Hydrophilic/hydrophobic drive folding and micelles
  - pH, pKa, and ionization fractions
  - 'Henderson–Hasselbalch: pH = pKa + log([A⁻]/[HA])'
  - 'Hydrophobic effect: hydration-shell disruption drives folding/aggregation'
  - 'Colligative properties: vapor-pressure lowering, boiling-point elevation, freezing-point depression'
- title: 5B · Molecules and intermolecular interactions
  bullets:
  - Ion, H-bond, van der Waals, hydrophobic hierarchy
  - Polarity shapes solubility and boiling trends
  - Hydrogen bonds are directional and weaker than covalent bonds
  - 'London dispersion: instantaneous dipoles affect all molecules'
  - Polar molecules dissolve in polar solvents (like dissolves like)
  - 'H-bonds: strong dipole interactions with H on N/O/F'
  - London dispersion grows with polarizability and surface area
  - Dipole–dipole interactions raise boiling points of polar molecules
- title: 5C · Separation and purification methods
  bullets:
  - 'Extraction: partition-coefficient idea'
  - 'Chromatography: polarity/size/charge separation'
  - When distillation vs recrystallization fit
  - Size-exclusion chromatography separates by molecular size
  - Ion exchange separates proteins by net charge at given pH
  - SDS-PAGE separates denatured proteins by molecular weight
  - Distillation separates liquids by boiling-point differences
  - Extraction moves solute between phases by partition coefficient
  - 'Chromatography: affinity for stationary phase → different retention'
- title: 5D · Biologically relevant molecules
  bullets:
  - Acid-base/H-bonding of groups in water
  - Peptide bond formation/hydrolysis; glycosidic bonds
  - 'Lipids: amphiphilicity and bilayers'
  - α-helix/β-sheet stabilized by backbone hydrogen bonds
  - 'Sugar isomers: glucose/fructose/galactose structural differences'
  - Fatty-acid saturation affects melting point and membrane fluidity
  - Amino acids are zwitterionic; carboxyl and amino groups ionize
  - 'Sugars: aldose/ketose; cyclic hemiacetals dominate in solution'
  - 'Lipids: hydrophobic tails drive bilayer self-assembly'
- title: 5E · Chemical thermodynamics and kinetics
  bullets:
  - ΔG = spontaneity; kinetics = rate
  - Catalysts change path, not ΔG
  - How to read rate laws and reaction order
  - Activation energy links transition state to reaction rate
  - Catalysts lower pathway energy without changing ΔG
  - Equilibrium constant K depends on temperature only (ideal conditions)
  - ΔG° = −RT ln K; K>1 favors products
  - Catalysts lower Ea; they do not change ΔG or equilibrium composition
  - Rate law follows mechanism, not necessarily overall stoichiometry
- title: 4E · Atoms, nuclear decay, electronic structure
  bullets:
  - Configs and periodic trends (radius, electronegativity)
  - Decay modes and half-life exponential intuition
  - Aufbau + Pauli + Hund rules fill orbitals
  - Electronegativity rises right across period; metallic character rises down group
  - α/β/γ decay differ in mass-number and charge changes
  - 'α decay: −2 Z, −4 A; β⁻ decay: +1 proton'
  - Half-life independent of amount; N=N₀e^(−λt)
  - Electron configuration drives group chemical similarity
  - Ionization energy rises across a period; atomic radius shrinks
