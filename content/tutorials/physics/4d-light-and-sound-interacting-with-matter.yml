review_questions:
- q: The cornea does most refraction because…
  options:
    A: It is the strongest curved glass
    B: The cornea-air index step is the largest change
    C: It is thickest
    D: The pupil controls it
  answer: B
  explain: n = 1.0 air to n = 1.38 cornea — the biggest index jump in the optical path.
  distractors:
    A: Lens glass is denser.
    B: Correct.
    C: Thickness is secondary.
    D: Pupil regulates light, not power.
- q: Prism dispersion separates colors because…
  options:
    A: Different wavelengths refract differently
    B: Red moves fastest in glass
    C: The prism heats the light
    D: Interference fringes form
  answer: A
  explain: n(lambda) varies — violet bends most.
  distractors:
    B: Violet is slowest in glass.
    C: No heating separates colors.
    D: Interference is a different effect.
- q: A +5 D lens has focal length…
  options:
    A: 0.2 m
    B: 5 m
    C: 2 m
    D: 0.5 m
  answer: A
  explain: Diopters = 1/f — f = 0.2 m = 20 cm.
  distractors:
    A: Correct.
    B: Confusing f with power.
    C: Half power.
    D: Inverse sign.
- q: Clicking your tongue creates an echo from a cliff 68 m away. The round-trip time is about…
  options:
    A: 0.2 s
    B: 0.4 s
    C: 2 s
    D: 68 s
  answer: B
  explain: Round trip 136 m / 343 m/s = 0.40 s.
  distractors:
    A: One-way.
    B: Correct.
    C: Wrong speed use.
    D: Massive slip.
