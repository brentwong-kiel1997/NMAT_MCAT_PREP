review_questions:
- q: Entropy of an isolated system…
  options:
    A: Stays constant
    B: Always decreases
    C: Never decreases
    D: Is undefined
  answer: C
  explain: Cannot decrease — second law of thermodynamics.
  distractors:
    A: Only for reversible processes.
    B: Violation.
    D: Defined.
- q: Sweating works because…
  options:
    A: Sweat is cold
    B: Evaporation absorbs latent heat
    C: Skin is thin
    D: Air is always dry
  answer: B
  explain: Each gram of vaporized sweat carries away ~2400 J.
  distractors:
    A: Sweat starts at body temp.
    C: Thickness is not the mechanism.
    D: Humidity limits it.
- q: An isothermal expansion of an ideal gas…
  options:
    A: Cools the gas
    B: Keeps T constant, absorbs Q = W
    C: Heats the gas
    D: Traps heat
  answer: B
  explain: T fixed by contact with a reservoir; the work pulled out is replaced by inflowing heat.
  distractors:
    A: T does not change.
    C: T constant.
    D: Not trapped.
- q: Kelvin is used in gas laws because…
  options:
    A: It has no negative values
    B: Ratios of T are physically meaningful
    C: Fahrenheit is complicated
    D: It is international
  answer: B
  explain: PV = nRT and Carnot ratios need absolute temperature.
  distractors:
    A: Zero temperature = zero KE.
    C: Also true but secondary.
    D: True but not the reason.
