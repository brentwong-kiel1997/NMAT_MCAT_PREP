review_questions:
- q: A car rounds a curve at constant speed. Its acceleration is…
  options:
    A: Zero
    B: Directed outward
    C: Along the tangent
    D: Directed toward the center
  answer: D
  explain: Constant speed does not mean constant velocity — centripetal acceleration points to the center.
  distractors:
    A: Velocity direction changes.
    B: That is the centrifugal fiction.
    C: Velocity direction changes continuously.
- q: Doubling an object's speed quadruples its…
  options:
    A: Momentum
    B: Kinetic energy
    C: Weight
    D: Acceleration at rest
  answer: B
  explain: KE = (1/2)mv2 — quadratic in speed.
  distractors:
    A: Momentum doubles.
    C: Weight unchanged.
    D: No.
- q: A ball rolling friction-free up a ramp at 4 m/s reaches a height proportional to…
  options:
    A: Speed
    B: Speed squared
    C: Speed cubed
    D: Mass
  answer: B
  explain: PE = mgh = KE = (1/2)mv2, so h scales with v2.
  distractors:
    A: The energy law is quadratic.
    C: Cube has no basis.
    D: Mass cancels.
- q: Torque is greatest when the applied force is…
  options:
    A: Parallel to the lever arm
    B: Perpendicular to the lever arm
    C: Antiparallel
    D: At the pivot
  answer: B
  explain: sin(theta) = 1 at 90 degrees.
  distractors:
    A: sin(0) = 0.
    C: sin(180) = 0.
    D: Zero lever arm.
