review_questions:
- q: An object inside the focal length of a convex lens forms…
  options:
    A: Real inverted
    B: Virtual upright enlarged
    C: No image
    D: Virtual inverted
  answer: B
  explain: Rays never meet; the eye extrapolates them back to a virtual image.
  distractors:
    A: That is beyond f.
    C: Always forms.
    D: Virtual images are upright for this case.
- q: The Doppler effect shifts detected frequency because…
  options:
    A: The source and observer move relative to each other
    B: The wave speed changes
    C: Sound becomes louder
    D: Wavelength shortens permanently
  answer: A
  explain: Relative motion compresses or stretches the arriving wavefronts.
  distractors:
    B: Medium speed stays.
    C: Loudness is separate.
    D: Approach is the signature.
- q: Sound intensity 100x a reference is how many dB?
  options:
    A: '10'
    B: '20'
    C: '30'
    D: '100'
  answer: B
  explain: 10 log(100) = 20 dB.
  distractors:
    A: 10 dB is 10x.
    B: Correct — log scale.
    C: 100 dB is 10^10x.
    D: Linear confusion.
- q: A convex mirror produces images that are…
  options:
    A: Real and inverted
    B: Virtual, upright, reduced
    C: Virtual and enlarged
    D: Real and upright
  answer: B
  explain: Widely bent rays diverge — virtual upright reduced — the car side-mirror.
  distractors:
    A: Only concave can do real.
    C: Concave inside f only.
    D: Concave inside f.
