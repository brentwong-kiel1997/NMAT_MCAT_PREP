subject: physics
chapter: Vibrations, Waves, and Optics
title: Vibrations, Waves, and Optics
overview: SHM, wave properties, sound, light, lenses and mirrors. Optics pairs with 4D on light-sound
  interaction; sound and hearing link to physiology. Expect graph-reading (waves) and lens-ray questions.
sections:
- heading: Simple harmonic motion
  objectives:
  - Calculate the period of a mass-spring or a pendulum oscillator.
  - Describe where velocity and acceleration peak within a cycle of SHM.
  - Explain why amplitude and mass do not affect a pendulum's period.
  body:
  - '==SHM: restoring force proportional to displacement — F = -kx==. The period T = 2 pi sqrt(m/k) for
    a mass-spring; T = 2 pi sqrt(L/g) for a pendulum (mass-independent!). Frequency f = 1/T; amplitude
    does not change the period.'
  - Energy sloshes between KE and elastic PE — total stays constant (no damping). ==At the extremes velocity
    is zero, acceleration maximal; through equilibrium velocity is maximal, acceleration zero==. This
    phase logic is the most-tested SHM idea.
  misconception: '"Swing the pendulum through a wider arc and it will take longer to come back, and a
    heavier bob must swing slower too." Neither the amplitude nor the mass touches the period. Doubling
    the amplitude makes the bob travel farther, but it also moves faster on the way — the two effects
    cancel exactly. Only length (and the local g) changes a pendulum''s period, which is why a clock pendulum
    keeps time whether you nudge it gently or hard.'
  connection: 'A chemical bond is a spring with a stiffness k of its own, and the atoms at its ends are
    the masses — so every bond has a natural vibration frequency set by T = 2 pi sqrt(m/k). Infrared spectroscopy
    reads those frequencies to identify functional groups, which is exactly how chapter Analytical Chemistry
    uses IR: stiff bonds and light atoms vibrate fast, loose bonds and heavy atoms vibrate slowly.'
  connection_label: How sciences interconnect
  check:
  - q: A pendulum's period doubles if…
    options:
      A: The mass doubles
      B: The amplitude doubles
      C: Gravity doubles
      D: The length quadruples
    answer: D
    explain: T ~ sqrt(L) — quadrupling L doubles T.
    distractors:
      A: Mass cancels.
      B: Amplitude does not enter.
      C: T ~ 1/sqrt(g) — would halve.
  - q: A mass on a spring has period T. What mass would make the period T/2?
    options:
      A: One-quarter of the original mass
      B: Half the original mass
      C: Twice the original mass
      D: No change of mass can do it
    answer: A
    explain: T ~ sqrt(m), so halving T requires quartering m.
    distractors:
      B: Scaling the mass linearly with the period instead of with its square.
      C: Reversing the direction — a larger mass gives a LONGER period.
      D: That is true of a pendulum, not of a mass on a spring.
- heading: Wave properties
  objectives:
  - Relate wave speed, frequency, and wavelength with v = f lambda.
  - Distinguish transverse from longitudinal waves with examples of each.
  - Predict the result of superposing two waves at a point.
  body:
  - Waves carry energy, not matter. ==v = f lambda== — speed is a medium property; changing frequency
    changes wavelength, not speed. Transverse (light, rope) versus longitudinal (sound, compression).
  - '==Superposition — waves add when they meet; interference (constructive/destructive) results. Standing
    waves — fixed ends create nodes; only certain wavelengths fit== (harmonics). Doppler: moving source/pitch
    shifts — approaching raises frequency.'
  misconception: '"A high-pitched sound travels faster than a low-pitched one, because it is carrying
    more energy." Speed belongs to the medium, not to the wave: sound in air moves at about 343 m/s whether
    it is a squeak or a bass note. Raise the frequency and the wavelength shrinks to keep v = f lambda
    satisfied — the wave''s shape changes, its speed does not.'
  connection: 'Standing waves are why a guitar string plays a note at all: only the wavelengths that fit
    between the fixed ends survive, and the fundamental plus its harmonics are the allowed set. Press
    a fret, shorten the string, and the whole allowed set shifts up — the same nodal arithmetic the resonance
    tube in the passage measures with a sliding piston.'
  connection_label: Real-world connection
  check:
  - q: Sound travels at 343 m/s in air. Doubling the frequency…
    options:
      A: Raises the speed
      B: Doubles the wavelength
      C: Halves the wavelength
      D: Slows the wave
    answer: C
    explain: v fixed, f up means lambda down — v = f lambda.
    distractors:
      A: Not so.
      B: Inverse relation.
      D: Medium sets speed.
  - q: A wave of wavelength 2.0 m travels at 340 m/s. Its frequency is…
    options:
      D: 170 Hz
      A: 680 Hz
      B: 0.0059 Hz
      C: 342 Hz
    answer: D
    explain: f = v/lambda = 340/2.0 = 170 Hz.
    distractors:
      A: Multiplying speed by wavelength instead of dividing.
      B: Inverting the relation and computing lambda/v.
      C: Adding the wavelength to the speed.
- heading: Sound, hearing, and beats
  objectives:
  - Convert an intensity ratio into a change in decibels.
  - Calculate a beat frequency from two nearly equal tones.
  - Explain resonance as the basis of hearing and of blood-pressure measurement.
  body:
  - Sound intensity level dB = 10 log(I/I0) — ==+10 dB = 10x intensity; doubling intensity adds ~3 dB==.
    Loudness is logarithmic perception. Intensity falls as 1/r2 from a point source.
  - '==Beats: two close frequencies f1 and f2 create a beat of |f1 - f2|==. Resonance amplifies matching
    frequencies — the physics of the cochlea and the blood-pressure cuff (Korotkoff).'
  misconception: '"Play 256 Hz and 253 Hz together and you get one louder 509 Hz tone." You hear neither
    the sum nor a louder note: the two waves superpose, and the loudness swells and fades |256 - 253|
    = 3 times per second. The pitch sits near the average of the two, while the difference shows up as
    beats — a tuning trick musicians use to bring an instrument into tune, since the beats slow and vanish
    as the frequencies converge.'
  connection: 'Resonance does the hearing and the measuring: the cochlea''s basilar membrane is laid out
    so each frequency finds the place that resonates with it, which is how the ear sorts a chord into
    its notes. The same logic puts a stethoscope to work — blood squeezing through a partly closed brachial
    artery under a cuff sets up turbulence you hear as Korotkoff sounds, and chapter 3B · Main organ systems
    uses those sounds to define systolic and diastolic pressure.'
  connection_label: How sciences interconnect
  check:
  - q: A sound at 440 Hz and another at 444 Hz produce…
    options:
      A: A 442 Hz tone
      B: A 884 Hz overtone
      C: Beats of 4 Hz
      D: Silence
    answer: C
    explain: Beat frequency is the difference.
    distractors:
      A: That is wrong math.
      B: Sum is not heard as a single tone.
      D: Interference does not cancel steady tones.
  - q: A 256 Hz and a 253 Hz tuning fork sound together. What is heard?
    options:
      C: 3 beats per second
      A: A 509 Hz tone
      B: A 254.5 Hz tone
      D: 1.5 beats per second
    answer: C
    explain: Beat frequency = |f1 - f2| = 3 Hz.
    distractors:
      A: Adding the frequencies; the sum is not what the ear resolves as beats.
      B: Averaging the two pitches — the mean is the tone, the difference is the beat.
      D: Halving the frequency difference.
  figures:
  - src: vibrations-waves-and-optics/fig-4f7a2c07.webp
    caption: A sound wave's compressions and rarefactions pressing on the eardrum — F = PA at work in
      hearing.
    credit: Ch 14 · OpenStax Physics (High School) — CC BY-NC-SA 4.0
  - src: vibrations-waves-and-optics/fig-625432c8.webp
    caption: Echolocation — a bat emitting sound waves and reading their reflection to locate prey.
    credit: Ch 14 · OpenStax Physics (High School) — CC BY-NC-SA 4.0
- heading: Geometric optics — lenses and mirrors
  objectives:
  - Locate an image with the thin-lens equation.
  - Compute magnification from the object and image distances.
  - Predict whether a lens forms a real or virtual, upright or inverted image.
  body:
  - ==1/f = 1/do + 1/di (thin-lens equation); magnification m = -di/do==. Converging (convex) lenses can
    form real or virtual images; diverging form virtual, upright, reduced — clear for nearsighted correction.
  - 'Sign conventions haunt everyone — ==object distance positive, image distance positive when the image
    is on the REFLECTED/TRANSMITTED side ==. Lens-maker: concave mirror converges (f positive); convex
    lens converges.'
  misconception: '"Lenses always flip the image upside down — the brain simply learns to turn it the right
    way up." Inversion is not automatic. Only a converging lens or mirror with the object beyond the focal
    length produces a real, inverted image; a diverging lens, or any object inside the focal length, gives
    a virtual, upright one. The sign convention in m = -di/do is doing the bookkeeping — a negative di
    means virtual and upright, and no brain gymnastics are involved.'
  connection: 'The passenger-side mirror is a convex one, which is why it always gives a virtual, upright,
    reduced image: the shrinking is the price of a wider field of view, and it is the reason the caption
    warns that objects are closer than they appear. A concave shaving mirror is the same hardware the
    other way round — inside the focal length it magnifies your face, upright and virtual.'
  connection_label: Real-world connection
  check:
  - q: A diverging lens always produces an image that is…
    options:
      A: Magnified
      B: Real and upright
      C: Real and inverted
      D: Virtual and upright
    answer: D
    explain: A diverging lens bends rays apart — never a real image.
    distractors:
      A: Never magnified.
      B: Reference to magnification.
      C: Only converging lenses focus to real images.
  - q: An object sits 0.30 m from a converging lens of focal length 0.10 m. The image is…
    options:
      D: 0.15 m away, real and half-size
      A: 0.075 m away, real and half-size
      B: 0.20 m away, virtual and upright
      C: 0.30 m away, the same size as the object
    answer: D
    explain: 1/di = 1/f - 1/do = 10 - 3.33 = 6.67, so di = 0.15 m and m = -di/do = -0.5 — real, inverted,
      half-size.
    distractors:
      A: Quoting the magnification magnitude as an image distance.
      B: Subtracting f from do and treating the result as an image distance.
      C: Equating the image distance with the object distance.
- heading: Mirror and prism applications
  objectives:
  - Describe the image formed by flat, concave, and convex mirrors.
  - Explain dispersion as the wavelength dependence of refractive index.
  - Relate total internal reflection to light guiding in fibres.
  body:
  - '==Flat mirrors: virtual image, same size, distance behind mirror equals object distance in front==.
    Concave mirrors (shaving, dental) magnify when the object sits inside the focal length — virtual,
    upright.'
  - Prisms and raindrops disperse white light — ==red bends least, violet most== (dispersion = refractive
    index varies with wavelength). Total internal reflection needs light moving INTO a denser-to-rarer
    interface at an angle above the critical angle — fibre optics.
  misconception: '"A prism manufactures colours — white light goes in and the glass dyes the beam into
    a rainbow." The glass adds nothing. White light already contains every visible wavelength, and the
    prism simply bends each one by a different amount because its refractive index varies with wavelength
    — violet most, red least. Separation, not creation: shine a single colour in and it comes out as that
    colour, unbent in spectrum.'
  connection: 'Total internal reflection is the quiet workhorse of modern medicine: light piped down an
    optical fibre stays inside because every bounce strikes the wall from the dense side beyond the critical
    angle. Bundle thousands of fibres and you get the endoscope a surgeon can steer into a joint or a
    gut, delivering light in and carrying the image back without a single photon escaping along the way.'
  connection_label: Real-world connection
  check:
  - q: Dispersion through a prism spreads colors because…
    options:
      A: Refraction index depends on wavelength
      B: Violet travels faster
      C: The prism absorbs red
      D: Each color interferes
    answer: A
    explain: n varies with wavelength — violet bends most.
    distractors:
      B: Violet is slower in glass.
      C: No absorption.
      D: No interference at work.
  - q: You stand 1.0 m from a flat mirror. Your image is…
    options:
      D: 1.0 m behind the mirror, the same size, virtual
      A: 0.5 m behind the mirror, half-size, virtual
      B: 1.0 m in front of the mirror, real and inverted
      C: 2.0 m behind the mirror, enlarged
    answer: D
    explain: A flat mirror puts the image as far behind the glass as the object is in front — same size,
      upright, virtual.
    distractors:
      A: Halving the distance, as though the mirror were convex.
      B: Putting the image on the wrong side of the glass and calling it real.
      C: Doubling the distance instead of matching it.
examples:
- prompt: A 50 g mass on a spring (k = 200 N/m) is pulled 3 cm from equilibrium and released. Find the
    period and max speed.
  strategy: 'Two independent formulas cover it: the period from T = 2 pi sqrt(m/k), which needs the mass
    in kilograms; and the maximum speed from v_max = omega A with omega = 2 pi/T and A the amplitude.
    Energy gives the same speed through (1/2)kA2 = (1/2)mv2 and is worth running as a cross-check rather
    than as a second derivation.'
  solution:
  - T = 2 pi sqrt(m/k) = 2 pi sqrt(0.050/200) ≈ 0.099 s.
  - 'Max speed at equilibrium: v_max = omega A = (2 pi/T)(0.03).'
  - omega = 63.2 rad/s, so v_max = 63.2 x 0.03 = 1.9 m/s.
  - 'Alternatively energy: (1/2)kA2 = (1/2)mv_max2.'
  answer: T ≈ 0.10 s, v_max ≈ 1.9 m/s.
  discussion: 'T = 0.10 s and v_max = 1.9 m/s — note that the speed depends on amplitude while the period
    does not, which is the signature of SHM: a harder pull sends the mass faster but costs no extra time
    per cycle. Check the limits and the units: doubling k shortens T by sqrt(2) and raises v_max by sqrt(2);
    doubling m does the reverse. A period near 3 s here would mean grams were never converted — the single
    most common way this exact item is missed.'
  distractors:
    A: Forgetting to convert 50 g to kg — gives 3.1 s.
    B: Using amplitude as displacement in energy equation.
    C: Multiplying instead of sqrt in the period.
  practice:
    q: A 0.20 kg mass on a spring (k = 320 N/m) oscillates with amplitude 5.0 cm. Find the period and
      maximum speed.
    options:
      C: T = 0.16 s, v_max = 2.0 m/s
      A: T = 0.16 s, v_max = 8.0 m/s
      B: T = 0.025 s, v_max = 2.0 m/s
      D: T = 0.16 s, v_max = 200 m/s
    answer: C
    explain: omega = sqrt(k/m) = sqrt(320/0.20) = 40 rad/s, so T = 2 pi/40 = 0.16 s and v_max = omega
      A = 40 x 0.050 = 2.0 m/s.
    distractors:
      A: Multiplying omega by the mass instead of by the amplitude.
      B: Quoting sqrt(m/k) and dropping the 2 pi.
      D: Using the amplitude in centimetres instead of metres.
key_equations:
- latex: $T = 2\pi\sqrt{\frac{m}{k}}$
  symbols: T period (s), m mass (kg), k spring constant (N/m)
  when: mass-spring SHM — amplitude does not appear; quarter the mass to halve T
- latex: $T = 2\pi\sqrt{\frac{L}{g}}$
  symbols: T period (s), L pendulum length (m), g = 9.8 m/s²
  when: simple pendulum — mass-independent, T grows with sqrt(L)
- latex: $v = f\lambda$
  symbols: v wave speed (m/s, set by the medium), f frequency (Hz), lambda wavelength (m)
  when: every wave problem — higher f means shorter lambda at fixed speed
- latex: $f_{beat} = |f_1 - f_2|$
  symbols: f_beat beat frequency (Hz), f₁ f₂ the two source frequencies
  when: two close tones — the loudness swells at the difference
- latex: $\beta = 10\log_{10}\frac{I}{I_0}$
  symbols: beta sound level (dB), I intensity, I₀ reference intensity
  when: decibel scale — +10 dB means ten times the intensity
- latex: $\frac{1}{f} = \frac{1}{d_o} + \frac{1}{d_i}$
  symbols: f focal length (m), d_o object distance, d_i image distance (negative if virtual)
  when: thin lens and mirror equation — locate the image
- latex: $m = -\frac{d_i}{d_o}$
  symbols: m magnification, d_i image distance, d_o object distance
  when: image size and orientation — negative m means inverted
- latex: $v_{max} = \omega A$
  symbols: v_max maximum speed (m/s), ω angular frequency = 2π/T, A amplitude (m)
  when: SHM speed peaks at equilibrium; ω = sqrt(k/m) for a spring
key_points:
- 'SHM: T = 2pi sqrt(m/k); pendulum period mass-independent.'
- v = f lambda; medium sets speed; frequency does not.
- 'dB: +10 = 10x intensity; beats are frequency difference.'
- 'Thin lens: 1/f = 1/do + 1/di; diverging = virtual upright.'
- 'Dispersion: violet bends most; red least.'
- Total internal reflection above the critical angle.
mnemonics:
- phrase: Fast frequency, short wavelength
  means: v = f lambda — inverse relation at fixed speed.
- phrase: +10 dB is 10 times the loudness
  means: Logarithmic dB scale; small numbers hide big intensity changes.
maps:
- title: Imaging by mirror/lens type
  steps:
  - converging lens + object beyond f — real inverted
  - converging + inside f — virtual upright enlarged
  - diverging lens — always virtual upright reduced
  - flat mirror — virtual, same size
- title: Wave problem path
  steps:
  - find v from medium (343 m/s air)
  - use f lambda = v
  - apply Doppler/beats/superposition
  - check direction signs
passage:
  text: A tuning fork (512 Hz) is struck and placed near a tube open at both ends. A student varies the
    effective tube length by sliding a piston and records strong resonance at lengths 0.335 m, 0.670 m,
    and 1.005 m.
  questions:
  - q: The wavelength of the standing wave is…
    options:
      A: 1.005 m
      B: 0.335 m
      C: 0.670 m
      D: 1.340 m
    answer: C
    explain: Successive resonances differ by half a wavelength — 0.670 - 0.335 = 0.335 = lambda/2 → lambda
      = 0.670 m.
    distractors:
      A: That is 3/2 wavelength.
      B: That is half the wavelength.
      C: Correct — 0.670 m.
      D: Overshoot.
  - q: The speed of sound predicted by this experiment is…
    options:
      A: 343 m/s
      B: 172 m/s
      C: 512 m/s
      D: 1024 m/s
    answer: A
    explain: v = f lambda = 512 x 0.670 ≈ 343 m/s.
    distractors:
      A: Correct — matches standard air speed.
      B: Half — using lambda/2.
      C: lambda x f confusion.
      D: Double counting.
  - q: If the fork were 1024 Hz instead, adjacent resonance lengths would…
    options:
      A: Double
      B: Quadruple
      C: Stay the same
      D: Halve
    answer: D
    explain: Doubling f halves lambda, so the half-wavelength spacing halves.
    distractors:
      A: Inverse relation.
      B: Inverse square.
      C: T unchanged.
      D: Correct.
pitfalls:
- Period dependence on amplitude (it does not).
- Conflating source speed with wave speed.
- Sign errors in the lens equation.
- Calling everything in the mirror smaller.
- Ignoring beats direction.
exam_map:
  NMAT: SHM periods, wave math, sound levels, lens equations.
  MCAT: Optic diagnosis (retina image formation), hearing mechanics, Doppler in medicine (ultrasound).
