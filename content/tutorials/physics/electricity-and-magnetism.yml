subject: physics
chapter: Electricity and Magnetism
title: Electricity and Magnetism
overview: Charges, fields, circuits, and magnetism. The circuit half (resistors, capacitors, Ohm's law)
  props up the bio labs; magnetism binds to biological imaging (MRI). NMAT expects direct calculations;
  MCAT leans conceptual with simple math.
sections:
- heading: Coulomb's law and electric fields
  objectives:
  - Calculate the force between two point charges with Coulomb's law.
  - Relate electric field to force per unit charge and potential to energy per charge.
  - Predict the work done moving charge along and across field lines.
  body:
  - ==F = k q1 q2 / r2 — same sign repels, opposite attracts; direction along the joining line==. Charge
    is quantized in e = 1.6e-19 C and conserved. The field E = F/q = k Q/r2 points away from positive,
    toward negative (field lines show direction).
  - ==Potential energy U = k q1 q2 / r and electric potential V = k Q / r== — V is energy per charge;
    the unit volt = J/C. Work moving charge along an equipotential is zero; field does work when charge
    moves along the field.
  misconception: '"A bigger test charge feels a bigger force at a point, so the electric field there must
    be bigger too." The force does scale with the test charge — halve it and the force halves — but the
    FIELD is the force per unit charge, and that ratio is unchanged. E is a property of the source charges
    and the location, full stop; the probe you bring tells you about it without changing it.'
  connection: 'Both of nature''s long-range forces obey an inverse square, which is why tripling the separation
    divides the electric force by 9 exactly as it would divide the gravitational pull between two masses.
    The difference is sign: mass only attracts, while charge comes in two varieties, so electric forces
    can cancel — which is why chemistry is electric and gravity is not. Chapter 4A · Motion, forces, work,
    energy, equilibrium uses the same inverse-square reasoning for the gravitational case.'
  connection_label: How sciences interconnect
  check:
  - q: Two charges, +2q and -2q, separated by distance d. Halving the distance…
    options:
      A: Flips the force
      B: Doubles the force
      C: Halves the force
      D: Quadruples the force
    answer: D
    explain: F ~ 1/r2 — d/2 gives 4x the force (still attractive).
    distractors:
      A: No.
      B: Inverse square.
      C: Inverse-square gives 4, not 2.
  - q: Two point charges are moved apart from a separation r to 3r. The force between them becomes…
    options:
      A: One-ninth of the original
      B: One-third of the original
      C: Nine times larger
      D: Unchanged, since the charges are the same
    answer: A
    explain: F ~ 1/r2, so tripling r divides the force by 3^2 = 9.
    distractors:
      B: Using a 1/r dependence instead of inverse-square.
      C: Inverting the relation — spreading charges apart weakens the force.
      D: The charge magnitudes are irrelevant once the separation changes.
  figures:
  - src: electricity-and-magnetism/fig-74e73828.webp
    caption: Electric force — attraction between opposite charges, repulsion between like charges.
    credit: Ch 18 · OpenStax Physics (High School) — CC BY-NC-SA 4.0
  - src: electricity-and-magnetism/fig-bde94422.webp
    caption: A torsion balance — the instrument Coulomb used to measure the force between charges.
    credit: Ch 18 · OpenStax Physics (High School) — CC BY-NC-SA 4.0
- heading: Circuits — current, resistance, and power
  objectives:
  - Reduce a series-parallel network to a single equivalent resistance.
  - Apply Kirchhoff's junction and loop rules to a multi-branch circuit.
  - Predict which element dissipates the most power in each configuration.
  body:
  - ==I = V/R (Ohm's law); series resistors add (R = R1 + R2); parallel obeys 1/R = 1/R1 + 1/R2 — total
    LESS than either==. Current splits at junctions (Kirchhoff's node) and voltages sum around a loop
    (Kirchhoff's loop).
  - Power = IV = I2R = V2/R. ==In series, same current — the big resistor gets the most power==; in parallel,
    equal voltage — the small resistor draws more current and more power. Emf minus internal resistance
    drop sets the terminal voltage.
  misconception: '"Adding another resistor to a circuit always increases the total resistance." Only in
    series. In parallel the new branch is a second path for current, so the total resistance drops BELOW
    the smallest individual resistor — two 12 ohm branches give 6 ohm, and the battery supplies more current
    than before. More paths, less opposition.'
  connection: 'Old-style Christmas lights were wired in series, which is why one dead bulb darkened the
    whole string: break the only path and the current stops everywhere. Modern strings are parallel, so
    each lamp sees the full voltage and the failure stays local — the same reason a burnt-out kitchen
    light does not take the refrigerator with it.'
  connection_label: Real-world connection
  check:
  - q: Two resistors, 2 ohm and 8 ohm, in series with a 12 V battery. The current is…
    options:
      A: 0.12 A
      B: 6 A
      C: 1.2 A
      D: 1.5 A
    answer: C
    explain: R-total = 10 ohm; I = 12/10 = 1.2 A.
    distractors:
      A: Decimal slip.
      B: Parallel math.
      D: 10 ohm, not 2.
  - q: Two 12 ohm resistors are wired in parallel across a 12 V battery. The total current the battery
      supplies is…
    options:
      C: 2 A
      A: 0.5 A
      B: 1 A
      D: 4 A
    answer: C
    explain: R-eq = 12/2 = 6 ohm, so I = 12/6 = 2 A (each branch draws 1 A).
    distractors:
      A: Adding the resistances as though they were in series (24 ohm).
      B: Dividing by a single branch's resistance and ignoring the second path.
      D: Halving the parallel equivalent twice (6 ohm to 3 ohm).
- heading: Capacitors and RC circuits
  objectives:
  - Compute capacitance from plate geometry or from stored charge and voltage.
  - Combine capacitors in series and parallel, opposite to the resistor rules.
  - Predict a capacitor's charge or voltage after a given number of time constants.
  body:
  - ==Capacitance C = Q/V; parallel plates C = epsilon A/d==. Energy stored = (1/2)CV2. In series, 1/C
    = sum of reciprocals (LESS); in parallel, C adds (MORE) — opposite of resistors.
  - '==RC time constant tau = RC — after one tau the capacitor charges to 63% (1 - e^-1)==. Charging curve:
    V(t) = V0(1 - e^-t/tau); discharging V(t) = V0 e^-t/tau. Defibrillators and pacemakers are RC physics.'
  misconception: '"Capacitors in parallel give a smaller total capacitance, just like resistors do." It
    is the mirror image. Parallel capacitors add directly — 2.0 uF beside 6.0 uF gives 8.0 uF — because
    the effective plate area grows; series capacitors add reciprocals and end up smaller than either.
    Whatever the resistor rule says, assume capacitors do the opposite.'
  connection: 'The worked example is a cell membrane: a lipid bilayer about 10 nanometres thick — a superb
    insulator — separating two conducting salt solutions. The enormous area-to-thickness ratio is what
    makes the capacitance impressive, and that in turn is why only a few thousand ions per square micrometre
    move the membrane voltage by a millivolt. Chapter 3A · Nervous and endocrine systems spends a whole
    section on what the body does with that lever.'
  connection_label: How sciences interconnect
  check:
  - q: In an RC circuit after one time constant the charging capacitor reaches…
    options:
      A: 37%
      B: 50%
      C: 63%
      D: 90%
    answer: C
    explain: 1 - e^-1 ≈ 0.632 of the final voltage.
    distractors:
      A: 37% is the discharge remaining.
      B: e^-1 vs 1-e^-1 mix-up.
      D: Wrong exponent.
  - q: A 2.0 uF and a 6.0 uF capacitor are connected in parallel and charged to 12 V. The total charge
      stored is…
    options:
      C: 96 uC
      A: 24 uC
      B: 18 uC
      D: 72 uC
    answer: C
    explain: 'Parallel capacitances add: C = 8.0 uF, so Q = CV = 8.0 x 10-6 x 12 = 96 uC.'
    distractors:
      A: Counting only the 2.0 uF capacitor.
      B: Combining them in series (1.5 uF) instead of in parallel.
      D: Counting only the 6.0 uF capacitor.
- heading: Magnetism — fields, forces, and induction
  objectives:
  - Determine the direction of the magnetic force on a moving charge.
  - Calculate the force on a current-carrying wire in a magnetic field.
  - Apply Faraday's law and Lenz's law to a changing magnetic flux.
  body:
  - ==Moving charges feel magnetic force F = q v B sin(theta) — perpendicular to BOTH velocity and field.
    ==Charged particles in a uniform B spiral in circles (centripetal). Current-carrying wires feel F
    = I L B sin(theta).
  - '==Induction: a CHANGING flux produces EMF — Faraday: EMF = -d(flux)/dt; Lenz says the induced current
    opposes the change==. MRI uses hydrogen spins; transformers step voltage via turns ratio V1/V2 = N1/N2.'
  misconception: '"A magnetic field speeds up a charge moving along with it, so a moving charge gains
    energy in a magnetic field." The magnetic force is always perpendicular to the velocity, and a perpendicular
    force does zero work — so it bends the path but never changes the speed. A charge in a uniform field
    simply circles; the field steers, it does not push.'
  connection: 'Faraday''s law is the working principle behind the power grid: spin a coil in a magnetic
    field and you generate an EMF, then use a transformer — where a CHANGING flux in the core drives the
    secondary — to step the voltage up for transmission and back down for the wall socket. Moving energy
    as high voltage and low current keeps the I^2R loss in the wires small.'
  connection_label: Real-world connection
  check:
  - q: A charge moving PARALLEL to a magnetic field experiences…
    options:
      A: Maximum force
      B: Force perpendicular only
      C: It speeds up
      D: Zero magnetic force
    answer: D
    explain: sin(0) = 0 — force is zero when v is parallel to B.
    distractors:
      A: That needs v perpendicular.
      B: That IS the case when perpendicular.
      C: No force means no acceleration.
  - q: A proton moves at 2.0 x 10^6 m/s PERPENDICULAR to a 0.50 T field. The magnetic force on it is…
    options:
      D: 1.6 x 10^-13 N
      A: 0 N
      B: 3.2 x 10^-13 N
      C: 8.0 x 10^-20 N
    answer: D
    explain: F = qvB sin(90) = (1.6 x 10-19)(2.0 x 10^6)(0.50) = 1.6 x 10^-13 N.
    distractors:
      A: Zero force needs v parallel to B; here they are perpendicular, so sin = 1.
      B: Doubling the field strength.
      C: Multiplying qB and omitting the velocity factor.
- heading: Electrochemistry and biological fields
  objectives:
  - Distinguish galvanic from electrolytic cells by their driving source.
  - Identify which half-reaction occurs at the anode and at the cathode.
  - Relate the Nernst equation to a measured membrane potential.
  body:
  - Nernst equation V = (RT/zF) ln([out]/[in]) ties concentration gradients to membrane potentials; ==resting
    potential ~ -70 mV arises from selective ion permeability==. Electrocardiograms and electroencephalograms
    measure body-generated fields.
  - Electrochemistry — ==oxidation (LEO) at the anode; reduction (GER) at the cathode==; galvanic cells
    convert chemical to electrical spontaneously; electrolytic cells need external voltage. Standard cell
    potential E = E-cathode - E-anode.
  misconception: '"A cell at rest is electrically neutral, so there is no voltage across its membrane."
    The resting cell carries a genuine potential difference of about -70 mV, inside relative to outside
    — roughly a tenth of a volt across a film nanometres thick, which is an enormous field. Rest means
    no net change over time, not no charge separation; the gradients behind that voltage are exactly what
    the cell spends ATP to maintain.'
  connection: 'Every voltage your clinician records is this section made visible: an ECG reads the summed
    potential of synchronised heart muscle depolarising, an EEG reads the averaged activity of cortical
    neurons, and both are volume-conducted ionic currents, not electricity injected from outside. Chapter
    3B · Main organ systems follows the cardiac version beat by beat.'
  connection_label: How sciences interconnect
  check:
  - q: In an electrolytic cell, electrons flow…
    options:
      A: Spontaneously to the cathode
      B: Pushed by an external power source
      C: Toward the anode internally
      D: Only in solutions
    answer: B
    explain: An electrolytic cell is driven against the spontaneous direction.
    distractors:
      A: Galvanic do that.
      C: Anode is oxidation (electrons leave), but the driving source matters.
      D: Wires conduct too.
  - q: A galvanic cell has E-cathode = +0.34 V and E-anode = -0.76 V. Its cell potential is…
    options:
      B: 1.10 V
      A: -0.42 V
      C: 0.42 V
      D: -1.10 V
    answer: B
    explain: E-cell = E-cathode - E-anode = 0.34 - (-0.76) = 1.10 V — positive, so spontaneous.
    distractors:
      A: Adding the two potentials instead of subtracting them.
      C: Dropping the negative sign on the anode potential and then reporting the magnitude.
      D: Reversing which electrode is the cathode, which flips both the sign and the spontaneity.
examples:
- prompt: A cell membrane (0.10 um thick, area 1e-5 m2) has dielectric constant 5 and a potential difference
    of 70 mV. Estimate its capacitance and stored charge.
  strategy: 'Two formulas in sequence: the parallel-plate capacitance with a dielectric, C = k epsilon0
    A/d, then Q = CV. Convert the thickness to SI (0.10 um = 1.0 x 10^-7 m) BEFORE substituting — the
    whole answer''s order of magnitude is decided by the A/d ratio, so the unit handling is the actual
    problem, not the algebra.'
  solution:
  - C = k epsilon0 A/d = (5)(8.85e-12)(1e-5)/(0.10e-6).
  - C = 4.4e-9 / 1e-7 = 4.4e-9 F ≈ 4.4 nF.
  - Q = CV = (4.4e-9)(0.070) = 3.1e-10 C.
  - That is ~2e9 elementary charges — a plausible membrane charge.
  answer: About 4.4 nF carrying ~3e-10 C.
  discussion: '4.4 nF is tiny by circuit standards yet huge for a nanometre-scale sheet — the enormous
    area-to-thickness ratio is why membranes are such good capacitors, and therefore why shifting a millivolt
    takes only a few thousand ions per square micrometre. Check the scaling rather than the arithmetic:
    halve the thickness and C doubles; double the voltage and Q doubles but the stored energy QUADRUPLES,
    because U = (1/2)CV2. The ~2 x 10^9 elementary charges is the reality check that the number describes
    a real membrane.'
  distractors:
    A: Forgetting epsilon0 — gives 8.8e-10 F.
    B: Using d in meters wrong (0.10 um → 1e-7 m, not 1e-6).
    C: Neglecting the thickness conversion — 44 nF.
  practice:
    q: A membrane has dielectric constant 2, thickness 0.050 um, and area 1.0 x 10^-5 m2. Its capacitance
      is nearest…
    options:
      C: 3.5 nF
      A: 1.8 nF
      B: 0.35 nF
      D: 35 nF
    answer: C
    explain: C = k epsilon0 A/d = (2)(8.85 x 10-12)(1.0 x 10-5)/(5.0 x 10-8) = 3.5 x 10-9 F = 3.5 nF.
    distractors:
      A: Omitting the dielectric constant k.
      B: Slipping one power of ten in the area (1.0 x 10^-6 m2).
      D: Slipping a factor of ten in the thickness (5.0 x 10^-9 m).
key_equations:
- latex: $F = k\frac{q_1 q_2}{r^{2}}$
  symbols: F force (N), k = 9 x 10⁹ N·m²/C², q₁ q₂ charges (C), r separation (m)
  when: point charges — inverse square, so halving r quadruples F
- latex: $V = IR$
  symbols: V potential difference (V), I current (A), R resistance (ohm)
  when: Ohm's law — the first line of every circuit reduction
- latex: $R_{eq} = R_1 + R_2$
  symbols: R_eq equivalent resistance, R₁ R₂ individual resistors
  when: series — one path, same current through each
- latex: $\frac{1}{R_{eq}} = \frac{1}{R_1} + \frac{1}{R_2}$
  symbols: R_eq equivalent resistance, R₁ R₂ branch resistances
  when: parallel — extra path; the total is below the smallest resistor
- latex: $P = I^{2}R = \frac{V^{2}}{R}$
  symbols: P power (W), I current (A), R resistance, V voltage
  when: dissipation — series favors the big R, parallel the small R
- latex: $C = \frac{Q}{V} = k\varepsilon_0\frac{A}{d}$
  symbols: C capacitance (F), Q charge (C), V voltage, k dielectric constant, ε₀ = 8.85 x 10⁻¹² F/m, A
    plate area, d separation
  when: parallel-plate capacitance — the membrane example is exactly this
- latex: $F = qvB\sin\theta$
  symbols: F force (N), q charge (C), v speed (m/s), B field (T), θ angle between v and B
  when: magnetic force — zero when v is parallel to B, maximal when perpendicular
- latex: $E_{cell} = E_{cathode} - E_{anode}$
  symbols: E_cell cell potential (V), E_cathode reduction potential, E_anode oxidation potential
  when: positive E_cell means the galvanic cell runs spontaneously
key_points:
- 'Coulomb: F ~ q1q2/r2, signs attract/repel.'
- Series resistance adds; parallel drops below smallest.
- 'Power: series — biggest R gets most; parallel — smallest R.'
- 'RC: tau = RC; 63% at one time constant.'
- Magnetic force needs v perpendicular to B.
- 'Lenz: induced current opposes the change.'
mnemonics:
- phrase: LEO says GER
  means: Loss of Electrons is Oxidation; Gain of Electrons is Reduction.
- phrase: Series resistors sum up; parallel resistors sink
  means: Total resistance in each configuration.
maps:
- title: Circuit solving
  steps:
  - reduce parallel blocks to one R
  - add series R
  - I = V/R total → back-substitute voltages
  - compute power per element
- title: Cell charge flow
  steps:
  - oxidation at anode — electrons out
  - external wire delivers to cathode
  - reduction at cathode — electron gain
  - salt bridge completes the loop
passage:
  text: A pacemaker circuit drives a 5.0 k-ohm load. The battery provides 9.0 V with 100 ohm internal
    resistance. The lead wires have negligible resistance.
  questions:
  - q: The current through the load is…
    options:
      A: 90 mA
      B: 0.9 mA
      C: 18 mA
      D: 1.8 mA
    answer: D
    explain: I = 9 / (100 + 5000) = 1.76e-3 A ≈ 1.8 mA.
    distractors:
      A: Wrong division.
      B: Omits internal resistance.
      C: Wrong division.
      D: Correct — includes internal R.
  - q: The power dissipated in the load is…
    options:
      A: 16 mW
      B: 8 mW
      C: 32 mW
      D: 160 mW
    answer: A
    explain: P = I2R = (1.76e-3)2(5000) = 15.5e-3 W ≈ 16 mW.
    distractors:
      A: Correct.
      B: Half.
      C: Double.
      D: Tenfold error.
  - q: If the battery voltage doubled, the load current would…
    options:
      A: Double
      B: Quadruple
      C: Halve
      D: Stay
    answer: A
    explain: Ohm's law — I = V/R scales linearly when R constant.
    distractors:
      A: Correct.
      B: Needs resistive power.
      C: Wrong direction.
      D: R constant.
pitfalls:
- Series/parallel rules flipped for capacitors vs resistors.
- Magnetic force zero when v parallel to B.
- Kirchhoff junction confusing current with charge.
- Nernst sign — [out]/[in] with cation convention.
- Lenz direction — oppose the CHANGE, not the field.
