review_questions:
- q: Two equal resistors in parallel give a total resistance of 4 ohm. Each is…
  options:
    A: 2 ohm
    B: 4 ohm
    C: 8 ohm
    D: 16 ohm
  answer: C
  explain: R-total = R/2 = 4 → R = 8 ohm.
  distractors:
    A: That is half each.
    B: Series would be 8.
    C: Parallel math.
- q: Which statement about magnetic force is TRUE?
  options:
    A: It does work on a moving charge
    B: It is perpendicular to velocity
    C: It is parallel to the field
    D: It accelerates charges along the field
  answer: B
  explain: F = q v B sin(theta) is always perpendicular to v — it changes direction, never speed.
  distractors:
    A: Perpendicular force does zero work.
    B: Correct.
    C: Perpendicular, not parallel.
    D: Changes direction only.
- q: Increasing the area of a capacitor's plates…
  options:
    A: Raises capacitance
    B: Lowers capacitance
    C: No effect
    D: Depends on charge
  answer: A
  explain: C = epsilon A/d — area in the numerator.
  distractors:
    A: Correct.
    B: Opposite.
    C: Plate area matters.
    D: C is geometric.
- q: A step-up transformer with N2 = 10 N1 gives…
  options:
    A: Lower voltage
    B: 10x voltage, 1/10 current
    C: 10x current
    D: Same power — voltage squared
  answer: B
  explain: V2/V1 = N2/N1 = 10; power conserved so current drops 10x.
  distractors:
    A: That is step-down.
    B: Correct.
    C: Opposite.
    D: Power is conserved, not squared.
