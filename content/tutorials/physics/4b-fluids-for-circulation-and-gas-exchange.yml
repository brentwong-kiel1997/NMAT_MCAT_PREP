subject: physics
chapter: 4B · Fluids for circulation and gas exchange
title: 4B · Fluids for Circulation and Gas Exchange
overview: Fluid statics and dynamics applied to the circulation and respiration — pressure, buoyancy,
  continuity, Bernoulli, and gas laws of exchange. The most physiology-anchored physics category on the
  MCAT.
sections:
- heading: Fluid statics — pressure and buoyancy
  objectives:
  - Calculate the pressure at a depth from P = P0 + rho g h.
  - Compute a buoyant force as the weight of the displaced fluid.
  - Predict the output force of a hydraulic lift from the ratio of piston areas.
  body:
  - '==Pressure = F/A; gauge pressure = P - P-atm; hydrostatic: P = P0 + rho g h==. Pressure in a fluid
    is isotropic — the same in all directions at a depth. ==Pascal''s principle: pressure applied to an
    enclosed fluid transmits undiminished (hydraulic lifts)==.'
  - '==Buoyancy: F_b = rho-fluid V-displaced g — the weight of the displaced fluid==. Objects with density
    below the fluid float; above sink. ==Fully submerged objects: apparent weight = object weight minus
    buoyancy==.'
  misconception: '"A 40 kg object weighs about 392 N, so the water pushes up on it with about 392 N of
    buoyancy." The buoyant force has nothing to do with what the object weighs — it equals the weight
    of the FLUID the object displaces: 1000 x 0.05 x 9.8 = 490 N here, more than the object''s weight.
    Two objects of the same volume get the same buoyancy even if one weighs ten times the other; the density
    comparison is what decides sinking versus floating.'
  connection: Pascal's principle is the only reason a 60 kg driver can stop a 1200 kg car. The pedal pushes
    a small piston; the pressure, not the force, is what transmits undiminished through the brake fluid;
    and the large pistons at the wheels multiply that pressure back into a force far larger than your
    foot could ever supply. A hydraulic dentist's chair and a garage lift are the same check item with
    different numbers.
  connection_label: Real-world connection
  check:
  - q: A 40 kg object (volume 0.05 m3) fully submerged in water (rho = 1000 kg/m3) has buoyancy about…
    options:
      A: 400 N
      B: 392 N
      C: 490 N
      D: 800 N
    answer: C
    explain: F_b = 1000 x 0.05 x 9.8 = 490 N — the weight of the displaced fluid.
    distractors:
      A: That is roughly the object weight.
      B: That is exactly the object weight — object floats.
      C: Correct — 490 N.
      D: Double the weight.
  - q: A 200 N push on a small hydraulic piston of area 0.005 m2 is transmitted to a large piston of area
      0.25 m2. The load it can lift is…
    options:
      B: 10000 N
      A: 4 N
      C: 200 N
      D: 1000 N
    answer: B
    explain: 'Pressure is what transmits undiminished: F2 = F1 x (A2/A1) = 200 x (0.25/0.005) = 200 x
      50 = 10000 N.'
    distractors:
      A: Inverting the area ratio and multiplying by A1/A2.
      C: Assuming force rather than pressure is transmitted undiminished — the gain is the whole point
        of a hydraulic lift.
      D: Misreading the small piston area as 0.05 m2, which costs a factor of ten.
  figures:
  - src: 4b-fluids-for-circulation-and-gas-exchange/fig-1a74f230.webp
    caption: Pressure in a fluid column — volume V = Ah and weight mg set the pressure at the base.
    credit: Ch 11 · OpenStax College Physics 2e — CC BY-NC-SA 4.0
  - src: 4b-fluids-for-circulation-and-gas-exchange/fig-59efe58d.webp
    caption: Atmospheric pressure — the weight of a 1 m2 column of air is about 1.01 x 10^5 N.
    credit: Ch 11 · OpenStax College Physics 2e — CC BY-NC-SA 4.0
- heading: Fluid dynamics — continuity and Bernoulli
  objectives:
  - Apply A1v1 = A2v2 to predict velocity where a vessel narrows or widens.
  - Relate a local speed increase to a drop in lateral pressure in a horizontal tube.
  - Explain the venturi effect as the operating principle of flowmeters.
  body:
  - '==Continuity: A1 v1 = A2 v2 — narrower channel, faster flow.== Volume flow rate Q = A v is conserved
    along a pipe (incompressible flow). Bernoulli: P + (1/2)rho v2 + rho g h = constant.'
  - '==In a horizontal tube with faster flow, pressure is LOWER (venturi) — the mechanism of flowmeters
    and aircraft lift==. Applied to circulation: narrowed stenosis → higher velocity → lower lateral pressure.'
  misconception: '"When a pipe narrows, the flow slows down because it is being squeezed through a tight
    spot." The opposite happens. Continuity — A1 v1 = A2 v2 — forces the speed to RISE where the area
    falls, since the same volume per second must get through. What falls is the lateral pressure, which
    Bernoulli trades away to pay for the extra speed. Squeezed faster, not squeezed slower.'
  connection: This section is why a stethoscope can hear a narrowed heart valve. Blood accelerates through
    the stenotic orifice and its lateral pressure drops; downstream, the fast jet becomes turbulent, and
    that turbulence is the murmur. Chapter 3B · Main organ systems covers the clinical read-out of exactly
    this flow physics.
  connection_label: How sciences interconnect
  check:
  - q: Blood moves from the aorta (A = 3 cm2) into arterioles (total A = 20 cm2). The velocity…
    options:
      A: Triples
      B: Rises 7x
      C: Stays constant
      D: Drops about 7x
    answer: D
    explain: 'Continuity: v scales inversely with total area — 3/20 ≈ 0.15 — about 7-fold slower.'
    distractors:
      A: Wrong relation.
      B: Wrong direction.
      C: A v is constant, so v cannot stay.
      D: Correct.
  - q: Water flows through a horizontal pipe that narrows to half its cross-sectional area. In the narrow
      section…
    options:
      A: Speed doubles and pressure falls
      B: Speed halves and pressure rises
      C: Speed doubles and pressure rises
      D: Speed and pressure both double
    answer: A
    explain: Continuity halves the area so v doubles; Bernoulli then requires the pressure to drop where
      the speed rose.
    distractors:
      B: Continuity forces a higher speed in the narrow section — flow rate is conserved.
      C: Fast flow costs pressure energy; it cannot also raise the static pressure.
      D: Speed doubles, but Bernoulli trades that speed for a LOWER pressure, not a higher one.
- heading: Viscosity and resistance to flow
  objectives:
  - Predict the change in flow rate produced by a change in vessel radius (r^4).
  - Calculate the resistance ratio that results from a fractional change in radius.
  - Use a Reynolds number to decide whether a flow is laminar or turbulent.
  body:
  - '==Poiseuille: Q = (pi delta-P r4)/(8 eta L) — the radius to the FOURTH power decides flow==. Doubling
    radius increases flow 16x — why vasodilation is so potent. ==Resistance R ~ 1/r4; series adds, parallel
    fractions==.'
  - Turbulence — ==Reynolds number Re = rho v d / eta; above ~2000 the flow turns turbulent== (heart murmurs,
    bruits). Viscosity of blood rises with hematocrit and falls with temperature.
  misconception: '"Doubling a vessel''s radius doubles the flow through it." Doubling the radius multiplies
    the flow sixteenfold, because Poiseuille''s law carries r^4 — the extra radius widens the low-friction
    channel at the wall AND raises the average speed. This is also why halving the radius is catastrophic:
    flow drops to one-sixteenth, not one-half.'
  connection: 'The fourth power is the reason arterioles, not the aorta, are the body''s flow taps: they
    are small enough that a small muscle contraction buys a large change in resistance. Chapter 3B · Main
    organ systems uses that lever continuously — vasodilation to feed exercising muscle, vasoconstriction
    to defend blood pressure in haemorrhage — and the same viscosity note explains why a raised hematocrit
    makes the heart''s job harder.'
  connection_label: How sciences interconnect
  check:
  - q: A vessel doubles its radius while pressure drop is constant. The flow rate…
    options:
      A: Doubles
      B: Quadruples
      C: Increases 16x
      D: Increases 8x
    answer: C
    explain: 'Poiseuille — r^4: (2r)^4 = 16.'
    distractors:
      A: Linear — wrong.
      B: r^2 — Bernoulli slip.
      C: Correct — 16x.
      D: r^3 — misuse.
  - q: Vasospasm cuts an arteriole's radius to 70% of normal. Its resistance becomes roughly…
    options:
      A: 4x normal
      B: 1.4x normal
      C: 2x normal
      D: 0.24x normal
    answer: A
    explain: R ~ 1/r4, so R-ratio = (1/0.7)^4 = (1.43)^4 = 4.2 — about a fourfold rise.
    distractors:
      B: Scaling resistance linearly with 1/r instead of 1/r4.
      C: Using an r^2 dependence (that is the continuity/velocity law, not Poiseuille).
      D: Inverting the relation — 0.7^4 gives the fall in FLOW, not the rise in resistance.
- heading: Gas exchange — partial pressures and diffusion
  objectives:
  - Calculate a gas's partial pressure from its mole fraction and the total pressure.
  - Predict how membrane thickness and area alter diffusive flux (Fick's law).
  - Explain why alveolar PO2 sits below ambient PO2.
  body:
  - '==Dalton: total pressure = sum of partial pressures; partial pressure = mole fraction x total. Henry:
    dissolved gas concentration = k P-gas==. Alveolar gas O2 at ~100 mmHg drives diffusion into blood;
    CO2 the reverse.'
  - ==Diffusion flux J = D A (delta-P)/d — the Fick law — thickness (pulmonary edema), area (emphysema),
    and gradient drive exchange==. ==Air is ~78% N2 and 21% O2; at 1 atm (760 mmHg) that gives PO2 = 160
    mmHg ambient, 100 in alveoli==.
  misconception: '"At altitude the air contains a lower percentage of oxygen, and that is what leaves
    the climber short of breath." The composition does not change: air is 21% O2 on a mountain and 21%
    at sea level. What falls is the TOTAL barometric pressure, and since PO2 = mole fraction x total pressure,
    the partial pressure falls with it. The molecules are the same fraction of fewer molecules per litre.'
  connection: 'Henry''s law — dissolved gas proportional to gas pressure — is why a diver''s blood carries
    far more nitrogen at depth than at the surface, and why surfacing too fast lets that gas bubble out
    in joints and tissue: decompression sickness. The same law in reverse is the reason a sealed soda
    fizzles when you crack the cap, and why climbers pre-acclimatize before an ascent.'
  connection_label: Real-world connection
  check:
  - q: A mountain climber at high altitude has lower driving pressure for O2 diffusion because…
    options:
      A: The partial pressure gradient falls with total pressure
      B: Blood is thicker
      C: Hemoglobin is bigger
      D: The alveoli shrink
    answer: A
    explain: Dalton — PO2 scales with total barometric pressure; altitude lowers it.
    distractors:
      A: Correct — gradient falls.
      B: Viscosity is secondary.
      C: Hemoglobin is unchanged.
      D: Alveoli adapt, not shrink.
  - q: On a day when barometric pressure is 700 mmHg, the PO2 of dry ambient air is nearest…
    options:
      D: 147 mmHg
      A: 137 mmHg
      B: 160 mmHg
      C: 700 mmHg
    answer: D
    explain: 'Dalton: PO2 = 0.21 x 700 = 147 mmHg.'
    distractors:
      A: Subtracting water vapour as well — that computes alveolar PO2, not that of dry ambient air.
      B: Quoting the sea-level value instead of using the day's barometric pressure.
      C: Reading the total atmospheric pressure as the oxygen partial pressure.
- heading: Fluids in the body — circulation mechanics
  objectives:
  - Relate mean arterial pressure to cardiac output and total peripheral resistance.
  - Predict the direction of net fluid movement across a capillary from Starling forces.
  - Explain how intrapleural pressure holds the lung open and what a pneumothorax changes.
  body:
  - '==Mean arterial pressure = cardiac output x total peripheral resistance (P = Q R)==. Starling forces
    — hydrostatic vs oncotic across capillaries — decide filtration: arterial end filters, venous end
    reabsorbs.'
  - '==Hydrostatics added to respiration: intrapleural pressure ~ -4 mmHg maintains lung inflation==;
    pneumothorax equalizes it and the lung collapses. Breathing work and airway resistance set the energy
    cost of ventilation.'
  misconception: '"Fluid escaping from a capillary means the capillary must be damaged or leaking abnormally."
    Filtration at the arterial end is the normal design, not a fault: hydrostatic pressure pushes plasma
    out there, and oncotic pressure from plasma proteins pulls it back at the venous end. The two nearly
    balance; oedema is what appears when the balance tips — raised venous pressure, low protein, or a
    blocked lymph drain.'
  connection: 'The intrapleural pressure of about -4 mmHg is hydrostatics doing structural work: the chest
    wall pulls out, the lung recoils in, and the slightly negative pressure between them holds the lung
    inflated against the pleura. Chapter 3B · Main organ systems takes the clinical case — let air in
    through a pneumothorax, the pressure equalizes, and the recoil wins, collapsing the lung.'
  connection_label: How sciences interconnect
  check:
  - q: Capillary filtration at the arterial end exceeds reabsorption at the venous end because…
    options:
      A: Hydrostatic driving force exceeds oncotic pull at the arterial end
      B: Arterial blood is thicker
      C: The capillaries leak
      D: Oncotic pressure is higher
    answer: A
    explain: Net filtration pressure is positive at the arterial end — hydrostatic minus oncotic.
    distractors:
      A: Correct.
      B: Blood viscosity is not the driver.
      C: Normal physiology lets small proteins across.
      D: Oncotic pulls IN.
  - q: Haemorrhage drops a patient's cardiac output from 5.0 to 4.0 L/min while total peripheral resistance
      is unchanged. Mean arterial pressure…
    options:
      D: Falls by 20%
      A: Falls by 25%
      B: Is unchanged
      C: Rises by 20%
    answer: D
    explain: 'MAP = Q x R, so with R fixed the pressure tracks flow: 4.0/5.0 = 0.8 — a 20% fall.'
    distractors:
      A: Inverting the ratio (5/4 = 1.25); the 25% figure is the rise needed to get back, not the fall.
      B: MAP is the product of both terms — halving one halves the product.
      C: Losing volume lowers output, so the pressure must fall, not rise.
examples:
- prompt: A vessel with radius 1.0 mm carries 5 mL/s. A branch with radius 2.0 mm and the same pressure
    drop carries how much?
  strategy: 'Same fluid, same pressure drop, so in Poiseuille''s law every factor cancels except r^4.
    The plan is purely a ratio: take the radius ratio (2.0/1.0 = 2), raise it to the fourth power, and
    multiply the known flow by that factor. No viscosity or length values are needed, so any time spent
    hunting for them is wasted.'
  solution:
  - Poiseuille — Q ~ r4.
  - r ratio = 2.0/1.0 = 2.
  - Q-ratio = 2^4 = 16.
  - New flow = 5 x 16 = 80 mL/s.
  answer: 80 mL/s — the fourth power amplifies radius changes dramatically.
  discussion: '16x is far more than intuition suggests, and that gap is exactly why arterioles — where
    small radius changes are cheap — are the body''s flow control points. The flip side is clinical: halving
    a radius through stenosis cuts flow to 1/16. Sanity check the direction and the limits: a wider tube
    with the same pressure gradient must carry more flow, and as r goes to zero the flow must vanish,
    which the fourth power delivers aggressively.'
  distractors:
    A: 10 mL/s — linear scaling.
    B: 20 mL/s — squared scaling.
    C: 40 mL/s — cubed scaling.
  practice:
    q: Stenosis halves a vessel's radius. At the same pressure drop, a segment that normally carries 8.0
      mL/s now carries…
    options:
      A: 0.5 mL/s
      B: 4.0 mL/s
      C: 2.0 mL/s
      D: 1.0 mL/s
    answer: A
    explain: 'Q ~ r4, so halving the radius divides the flow by 2^4 = 16: 8.0/16 = 0.5 mL/s.'
    distractors:
      B: Applying the radius ratio linearly instead of to the fourth power.
      C: Using an r^2 law (that is the velocity/continuity scaling).
      D: Using an r^3 law — one power short.
key_equations:
- latex: $P = P_0 + \rho g h$
  symbols: P pressure at depth (Pa), P₀ surface pressure, ρ fluid density (kg/m³), g = 9.8 m/s², h depth
    (m)
  when: hydrostatic pressure — the IV drip hangs high to build pressure head
- latex: $F_b = \rho_{fluid} V g$
  symbols: F_b buoyant force (N), ρ_fluid density of the DISPLACED fluid, V displaced volume (m³)
  when: buoyancy — weight of displaced fluid, independent of the object's own weight
- latex: $F_2 = F_1\frac{A_2}{A_1}$
  symbols: F₁ input force, A₁ input piston area, F₂ output force, A₂ output piston area
  when: Pascal's principle — hydraulic lifts and brakes; pressure transmits, force multiplies
- latex: $A_1 v_1 = A_2 v_2$
  symbols: A cross-sectional area (m²), v mean speed (m/s)
  when: continuity — narrower vessel, faster flow; v scales as 1/r² in a tube
- latex: $P + \frac{1}{2}\rho v^{2} + \rho g h = \text{constant}$
  symbols: P static pressure, ρ density, v speed, h height
  when: Bernoulli — in a horizontal tube, pressure falls where flow speeds up (venturi)
- latex: $Q = \frac{\pi \Delta P r^{4}}{8 \eta L}$
  symbols: Q flow rate (m³/s), ΔP pressure drop, r vessel radius, η viscosity, L vessel length
  when: Poiseuille — radius to the fourth power; doubling r gives 16x the flow
- latex: $P_{O_2} = X_{O_2} P_{tot}$
  symbols: P_O₂ partial pressure of oxygen, X_O₂ mole fraction (0.21 in air), P_tot total pressure
  when: Dalton's law — altitude cuts total pressure, so PO2 falls with it
- latex: $MAP = Q \times R$
  symbols: MAP mean arterial pressure, Q cardiac output, R total peripheral resistance
  when: cardiovascular control — with R fixed, pressure tracks flow
key_points:
- P = P0 + rho g h; buoyancy = displaced fluid weight.
- Continuity A v constant; Bernoulli pressure falls where flow speeds.
- 'Poiseuille: r^4 governs; doubling radius → 16x flow.'
- Dalton and Henry set gas driving gradients.
- 'Starling: hydrostatic out vs oncotic in across capillaries.'
- Intrapleural negative pressure holds lungs open.
mnemonics:
- phrase: Fourth power rules the tube
  means: Poiseuille — radius to the 4th, the key flow fact.
- phrase: Faster flow, lower pressure
  means: Bernoulli in a horizontal tube.
maps:
- title: Circulation flow logic
  steps:
  - heart sets Q (CO)
  - arteriolar radius sets R (r^4)
  - MAP = CO x R
  - capillary Starling forces exchange fluid
- title: O2 from air to blood
  steps:
  - ambient 160 mmHg
  - humidified tracheal air ~150
  - alveolar ~100
  - venous ~40 — gradient 60 drives diffusion
passage:
  text: A stenosis narrows a 5 mm renal artery to 2 mm across a 1 cm segment. Flow upstream is 400 mL/min.
    With constant pressure drop, the segment resistance rises by r^4 scaling.
  questions:
  - q: The resistance of the narrowed segment rises by…
    options:
      A: 6.25x
      B: 2.5x
      C: 16x
      D: 39x
    answer: D
    explain: (5/2)^4 = 2.5^4 ≈ 39.
    distractors:
      A: Squared mistake.
      B: Linear ratio.
      C: Cubed mistake.
      D: Correct — about 39x.
  - q: To restore flow to 400 mL/min, the driving pressure would need…
    options:
      A: Unchanged
      B: 16x
      C: Roughly 39x
      D: Doubling
    answer: C
    explain: Q = delta-P/R — compensate for a 39x R with a 39x pressure increase.
    distractors:
      A: Resistance changed.
      B: r^4 ratio is not the pressure ratio.
      C: Correct.
      D: Not enough.
  - q: The velocity of blood inside the 2 mm segment relative to the 5 mm segment is…
    options:
      A: 2.5x faster
      B: 6.25x faster
      C: Same
      D: Slower
    answer: B
    explain: Continuity — v ~ 1/A ~ 1/r2 — (5/2)2 = 6.25.
    distractors:
      A: Linear ratio — continuity scales with 1/r2.
      B: Correct — (5/2)2 = 6.25.
      C: A v must be conserved.
      D: Wrong direction.
pitfalls:
- Buoyancy = displaced FLUID weight, not object weight.
- Bernoulli sign — high speed is LOW pressure, not high.
- Poiseuille exponents — r4, sometimes confused with r2.
- Dalton's partial vs Henry's dissolved — two different laws.
- Starling compartment mix-ups.
