review_questions:
- q: A 60 kg person's lungs have a density below water. In a pool…
  options:
    A: They sink
    B: They float
    C: They hover
    D: Depends on breath
  answer: D
  explain: Lung density changes with air — the body floats when fully expired? Actually the full body
    floats when air-filled, sinks on full exhalation.
  distractors:
    A: Air-filled floats.
    B: Air-filled floats.
    C: Only at neutral buoyancy.
    D: Correct — depth of breath decides.
- q: An IV drip hangs higher than the vein to…
  options:
    A: Increase g
    B: Increase the hydrostatic pressure head
    C: Lower viscosity
    D: Reduce flow
  answer: B
  explain: P = rho g h — height adds pressure.
  distractors:
    A: g is fixed.
    B: Correct.
    C: Viscosity is a fluid property.
    D: The opposite.
- q: Total peripheral resistance rises most when arterioles…
  options:
    A: Constrict
    B: Dilate
    C: Stay constant
    D: Thicken walls
  answer: A
  explain: Constriction — r falls, R ~ 1/r4.
  distractors:
    A: Correct.
    B: Dilation lowers R.
    C: Fixed.
    D: Thickening is chronic but not the acute control.
- q: A person breathing pure oxygen at 1 atm has alveolar PO2 nearest…
  options:
    A: 160 mmHg
    B: 670 mmHg
    C: 760 mmHg
    D: 100 mmHg
  answer: B
  explain: Inspired PO2 = 760 mmHg; subtract water vapor (47) and alveolar CO2 (~40) leaves ~670 mmHg
    in the alveolar gas.
  distractors:
    A: Room-air ambient value.
    C: Total atmospheric ml — includes water vapor and CO2.
    D: Normal alveolar PO2 on room air.
