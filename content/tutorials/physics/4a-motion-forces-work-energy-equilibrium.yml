subject: physics
chapter: 4A · Motion, forces, work, energy, equilibrium
title: 4A · Motion, Forces, Work, Energy, Equilibrium
overview: The MCAT's mechanics core — kinematics, Newton's laws, work-energy, momentum, and equilibrium,
  all at the level of clinical application (joint forces, projectile motion, stress-strain). NMAT overlaps
  heavily with this content.
sections:
- heading: Kinematics — motion in one and two dimensions
  objectives:
  - Select the constant-acceleration equation that matches a given set of knowns.
  - Decompose projectile motion into independent horizontal and vertical components.
  - Predict the time of flight of a horizontal launch from the drop height alone.
  body:
  - 'Uniformly accelerated motion — ==x = v0t + (1/2)at2, v = v0 + at, v2 = v02 + 2ax==. Vertical motion:
    a = g down. In 2D, decompose vectors — the horizontal and vertical motions evolve independently (projectile:
    constant horizontal speed, free-fall vertical).'
  - Projectile patterns — ==time of flight depends only on vertical motion (and g); range = vx times flight
    time==. A launch at 45 degrees maximizes range (level ground, no air resistance).
  misconception: '"The marble fired off the roof at 15 m/s takes longer to land than one just dropped,
    because it is moving faster." The launch speed does not touch the timing at all. Gravity accelerates
    only the vertical motion, so the fall time comes from h = (1/2)gt^2 alone — 2.0 s from 20 m whether
    the marble leaves at 15 m/s, 150 m/s, or not at all. The horizontal velocity simply rides along unchanged.'
  connection: Range = horizontal speed x flight time is the whole of throwing sports. Because flight time
    is set by the vertical launch component and range by the horizontal one, the two are traded off exactly
    at 45 degrees — which is why a shot-putter's optimum release is a little below 45 degrees once the
    height of the shoulder above the landing field is included.
  connection_label: Real-world connection
  check:
  - q: 'A ball thrown horizontally off a cliff: which changes as it falls?'
    options:
      A: Total speed stays constant
      B: Horizontal acceleration
      C: Horizontal velocity
      D: Vertical velocity
    answer: D
    explain: Only vertical motion accelerates — horizontal velocity stays vx.
    distractors:
      A: KE grows — speed rises.
      B: No horizontal force → no acceleration.
      C: No horizontal force.
  - q: A marble rolls off a 20 m high rooftop travelling horizontally at 15 m/s. How long is it in the
      air? (g = 9.8 m/s2)
    options:
      A: 2.0 s
      B: 1.3 s
      C: 1.4 s
      D: 4.0 s
    answer: A
    explain: 'Only the vertical motion sets the fall time: h = (1/2)gt2, so t = sqrt(2h/g) = sqrt(40/9.8)
      = 2.0 s. The 15 m/s is irrelevant to the timing.'
    distractors:
      B: Dividing the height by the horizontal speed — treating the fall as uniform horizontal motion.
      C: Dropping the factor 1/2 and using t = sqrt(h/g).
      D: Doubling the fall time, as if h had been squared under the root.
  figures:
  - src: 4a-motion-forces-work-energy-equilibrium/fig-072de49c.webp
    caption: Projectile trajectories — initial speed and launch angle shape the range.
    credit: Ch 3 · OpenStax College Physics 2e — CC BY-NC-SA 4.0
  - src: 4a-motion-forces-work-energy-equilibrium/fig-1d994a14.webp
    caption: Projectile motion from a tower — the launch speed that becomes an orbital path.
    credit: Ch 3 · OpenStax College Physics 2e — CC BY-NC-SA 4.0
- heading: Newtonian mechanics — forces and F = ma
  objectives:
  - Resolve a weight into components parallel and perpendicular to an inclined plane.
  - Decide whether a given force pair is a true action-reaction pair.
  - Calculate the acceleration of a mass hoisted by a rope from the net force.
  body:
  - '==F_net = ma — the sum of all forces==; weight mg; normal perpendicular to surface; friction opposes
    relative motion. Action-reaction pairs act on different bodies — a book on a table: its weight and
    the table''s push are NOT an action-reaction pair (both act on the book).'
  - 'Inclined planes — ==decompose weight into components mg sin(theta) (parallel) and mg cos(theta) (perpendicular)
    — the normal balances the perpendicular one==. Atwood machines and elevators: T - mg = ma when accelerating
    upward, T = m(g + a).'
  misconception: '"The table pushing up on a book is the reaction to the book''s weight, so the two can
    cancel." Those two forces both act on the same book, and an action-reaction pair never does. The true
    partner of the book''s weight is the gravitational pull the book exerts on the Earth; the true partner
    of the table''s push is the book pressing down on the table. Pairs always live on different bodies
    — that is why they can never cancel each other for one object.'
  connection: 'The bucket check is the template for every ''what drives it'' question in the body: a 150
    N tension beats a 100 N weight by 50 N, and the leftover sets the acceleration. Chapter 4B · Fluids
    for circulation and gas exchange runs the identical argument on blood — a segment of fluid accelerates
    only while upstream pressure exceeds downstream pressure, so a pressure difference plays the role
    the rope tension plays here.'
  connection_label: How sciences interconnect
  check:
  - q: A skier accelerates down a 30-degree frictionless slope at…
    options:
      A: g sin(30) = 4.9 m/s2
      B: g
      C: Zero
      D: 2g
    answer: A
    explain: Only the slope component mg sin(theta) drives motion; normal balances the rest.
    distractors:
      A: Correct.
      B: Full g would need a straight drop.
      C: Gravity acts.
      D: g > g sin(theta).
  - q: A 10 kg bucket is hoisted straight up by a rope with 150 N of tension. Its acceleration is nearest…
      (g = 10 m/s2)
    options:
      A: 9.8 m/s2
      B: 15 m/s2
      C: 5.0 m/s2
      D: 0.5 m/s2
    answer: C
    explain: Net force = T - mg = 150 - 100 = 50 N upward, so a = 50/10 = 5.0 m/s2.
    distractors:
      A: Treating the bucket as being in free fall, as though the rope were slack.
      B: Dividing the tension alone by the mass and ignoring the bucket's weight.
      D: Dividing the net force by the weight instead of by the mass (50/100).
- heading: Work, energy, and power
  objectives:
  - Classify a force's work as positive, negative, or zero from its angle to the displacement.
  - Convert between gravitational potential energy and speed using energy conservation.
  - Compute power output from work and time, or from force times speed.
  body:
  - '==W = F d cos(theta); KE = (1/2)mv2; PE-g = mgh; PE-s = (1/2)kx2; mechanical energy conserved with
    conservative forces only==. Work-energy theorem: W-net = delta-KE.'
  - ==Power = W/t = F v==. Efficiency = useful output / input. In MCAT passages watch for which forces
    do work — the normal force and centripetal force NEVER do work (perpendicular to motion).
  misconception: '"A force acting on a moving object always does work on it, so the centripetal force
    on a rolling ball must be adding energy and speeding it up." Work needs a component of force along
    the displacement. A centripetal force points at the centre, perpendicular to the motion at every instant,
    so W = Fd cos(theta) = 0 and the speed never changes — direction changes, energy does not. The normal
    force on a level floor fails the same test.'
  connection: 'The efficiency line cuts both ways: an engine that turns fuel into motion at 25 percent
    is doing what your muscles do. The missing energy is not destroyed — it leaves as heat, which is why
    a hard climb in chapter 3B · Main organ systems demands both fuel delivery and sweating. Chapter 1D
    · Bioenergetics and fuel metabolism prices that fuel in ATP.'
  connection_label: How sciences interconnect
  check:
  - q: Centripetal force on a rolling ball does…
    options:
      A: Depends on speed
      B: Positive work
      C: Zero work
      D: Negative work — it brakes
    answer: C
    explain: Always perpendicular to velocity — the work dot product is zero.
    distractors:
      A: Direction, not magnitude, changes.
      B: Perpendicular forces do no work.
      C: Correct.
      D: Speed stays constant — no braking.
  - q: A 0.50 kg ball is dropped from rest at 5.0 m and lands with what speed, ignoring air resistance?
    options:
      A: 7.0 m/s
      B: 9.9 m/s
      C: 24.5 m/s
      D: 49 m/s
    answer: B
    explain: mgh = (1/2)mv2, so v = sqrt(2gh) = sqrt(2 x 9.8 x 5.0) = sqrt(98) = 9.9 m/s. Mass cancels.
    distractors:
      A: Omitting the factor 2 and using v = sqrt(gh).
      C: Reporting the potential energy (24.5 J) as if it were a speed.
      D: Using 2gh as the speed instead of square-rooting it.
- heading: Linear and angular momentum
  objectives:
  - Predict the post-collision motion from the collision type (elastic, inelastic, perfectly inelastic).
  - Relate impulse to the momentum change it produces over the contact time.
  - Explain how a change in moment of inertia alters angular velocity.
  body:
  - ==Momentum p = mv conserved with no external impulse; impulse = F delta-t = delta-p==. Elastic collision
    (KE conserved, relative speed reverses); inelastic (KE lost); perfectly inelastic (stick together).
  - 'Rotational — ==torque tau = r F sin(theta), moment of inertia I = sum mr2, angular momentum L = I
    omega conserved without external torque==. Static equilibrium: sum F = 0 AND sum tau = 0 — the two
    conditions tested in lever problems.'
  misconception: '"The 1200 kg car is heavier, so after the crash the wreck keeps moving at the striking
    car''s original 20 m/s." Momentum is mass-weighted, not won by the bigger vehicle. Conservation gives
    1200 x 20 = 2000 x v, so the locked pair share 12 m/s — the wrecked mass is larger, so its speed must
    be smaller. The stationary car''s zero momentum counts too.'
  connection: 'The ''explosive'' row of the collision map is how every rocket works: throw mass one way,
    and conservation of momentum takes the craft the other. Nothing pushes against the ground or the air
    — a spacecraft in empty space steers purely by hurling propellant backward, exactly as the two crash
    bodies here share out momentum with no outside help.'
  connection_label: Real-world connection
  check:
  - q: A diver tucks her body mid-air — she…
    options:
      A: Loses angular momentum
      B: Spins slower because I rises
      C: Cannot change spin rate
      D: Spins faster, L conserved
    answer: D
    explain: Tucking lowers I → omega rises to keep L = I omega constant.
    distractors:
      A: Conserved means no loss.
      B: Tucking LOWERS I.
      C: She clearly can.
      D: Correct — no external torque.
  - q: A 1200 kg car travelling east at 20 m/s strikes a stationary 800 kg car and the two lock together.
      Their shared speed just after impact is…
    options:
      A: 12 m/s
      B: 20 m/s
      C: 10 m/s
      D: 30 m/s
    answer: A
    explain: 'Momentum is conserved: 1200 x 20 = 2000 x v, so v = 24000/2000 = 12 m/s.'
    distractors:
      B: Assuming the striking car keeps its speed — that would require momentum to be created.
      C: Averaging the two speeds instead of mass-weighting them; the heavy car dominates.
      D: Dividing the total momentum by the struck car's mass alone (24000/800).
- heading: Equilibrium and elasticity in biology
  objectives:
  - Compute stress and strain from an applied force, cross-sectional area, and length change.
  - Set up the lever (torque) balance that gives the muscle force needed to hold a load.
  - Explain why a short muscle lever arm multiplies the force across a joint.
  body:
  - ==Bones and tendons experience stress (F/A) and strain (delta-L/L); the elastic modulus E = stress/strain
    — the slope of the stress-strain curve==. Beyond the elastic limit, materials yield; bones are viscoelastic
    — rate-dependent.
  - ==Static equilibrium of the forearm — the elbow joint force can exceed the load several-fold (lever
    short arm)==. This lever logic — how much muscle force is required to hold a weight — is a standing
    MCAT favorite.
  misconception: '"To hold a 4 kg weight steady, the muscle must pull with about 40 N — the weight of
    the load." The muscle pulls with 235 N, nearly six times the load, because it inserts only 5 cm from
    the elbow while the weight acts at 30 cm. Torque balance forces the short lever arm to be paid for
    with a large force, which is also why the joint itself ends up compressed well beyond the load it
    is holding.'
  connection: Stress = F/A is not just a number to compute — it is a signal the tissue responds to. Bone
    laid down under repeated compressive stress thickens, and bone unloaded thins, which is why astronauts
    lose bone mass in orbit. Chapter 2A · Assemblies of molecules, cells, and cell groups describes the
    collagen scaffold that actually carries the load you are computing here.
  connection_label: How sciences interconnect
  check:
  - q: The flexor muscle of the forearm acts 5 cm from the elbow while the load is at 30 cm. Holding a
      4 kg weight requires muscle force…
    options:
      A: 39 N
      B: 6.5 N
      C: 400 N
      D: 235 N
    answer: D
    explain: 'Torque balance: F x 0.05 = mg x 0.30, so F = (39.2)(0.30)/(0.05) = 235 N.'
    distractors:
      A: 39 N — the weight, before lever amplification.
      B: 6.5 N — inverted lever ratio (0.05/0.30).
      C: 400 N — the load mass, not the force.
  - q: A 500 N compressive load acts on a bone whose cross-sectional area is 2.0 cm2. The stress in the
      bone is…
    options:
      C: 2.5 x 10^6 Pa
      A: 250 Pa
      B: 2.5 x 10^4 Pa
      D: 2.5 x 10^5 Pa
    answer: C
    explain: Stress = F/A = 500 / (2.0 x 10-4 m2) = 2.5 x 10^6 Pa (2.5 MPa).
    distractors:
      A: Dividing by the bare number 2 and skipping the cm2 to m2 conversion.
      B: Dividing by a 2.0 cm length instead of by an area.
      D: Slipping one power of ten in the cm2 to m2 conversion (using 2.0 x 10-3 m2).
examples:
- prompt: A 70 kg person stands on a scale in an elevator accelerating upward at 2.0 m/s2. What does the
    scale read?
  strategy: 'Recognise that the scale reads the NORMAL force, not the weight, so the whole problem is
    one vertical Newton''s-second-law balance: N - mg = ma with a = +2.0 m/s2. Solve for N, then divide
    by g only at the end to convert the reading into the kilograms the dial displays.'
  solution:
  - The scale reads the NORMAL force, not weight.
  - 'Forces: N up, mg down; net = N - mg = ma (a = +2.0).'
  - N = m(g + a) = 70(9.8 + 2.0) = 826 N.
  - The scale displays N/g ≈ 84 kg — 'apparent weight'.
  answer: ≈ 830 N, equivalent to ~84 kg — up to 20% heavier than true weight.
  discussion: '826 N against a true weight of 686 N is a 20% gain, and that percentage is exactly a/g
    — a useful ratio to memorise, since every apparent-weight item is this same equation with a different
    sign. Accelerating downward flips the sign and the passenger reads light; set a = g and N = 0, which
    is why weightlessness in orbit is free fall rather than the absence of gravity. Sanity check the direction:
    the answer must exceed mg when the floor pushes harder to speed the person up.'
  distractors:
    A: 686 N — forgetting acceleration changes the reading.
    B: 546 N — subtracting instead of adding.
    C: 70 N — mixing mass with force units.
  practice:
    q: A 50 kg passenger rides an elevator accelerating downward at 3.0 m/s2. What does the scale read?
    options:
      D: 340 N
      A: 490 N
      B: 640 N
      C: 150 N
    answer: D
    explain: 'N - mg = ma with a = -3.0: N = m(g - a) = 50(9.8 - 3.0) = 340 N, about 35 kg — the passenger
      reads light.'
    distractors:
      A: The true weight — ignoring the acceleration entirely.
      B: Adding the acceleration term instead of subtracting it, which is the upward case.
      C: Reporting the net force ma instead of the normal force the scale actually measures.
key_equations:
- latex: $x = v_0 t + \frac{1}{2}at^{2}$
  symbols: x displacement, t time, v₀ initial velocity, a acceleration
  when: constant acceleration; free fall from rest is the special case h = (1/2)gt²
- latex: $\sum F = ma$
  symbols: ΣF net force (N), m mass (kg), a acceleration (m/s²)
  when: every force balance — the bucket gives T - mg = ma, the elevator N - mg = ma
- latex: $a = g\sin\theta$
  symbols: a acceleration down the slope, g = 9.8 m/s², θ slope angle
  when: frictionless incline — only mg sin(theta) drives the motion
- latex: $W = Fd\cos\theta$
  symbols: W work (J), F force (N), d displacement (m), θ angle between force and displacement
  when: sign of work; perpendicular forces such as normal and centripetal give zero
- latex: $mgh = \frac{1}{2}mv^{2}$
  symbols: m mass, g = 9.8 m/s², h drop height, v impact speed
  when: energy conservation for a fall — the mass cancels, v = √(2gh)
- latex: $m_1 v_1 + m_2 v_2 = (m_1 + m_2)v$
  symbols: m₁, m₂ masses; v₁, v₂ speeds before; v shared speed after
  when: perfectly inelastic collision — the bodies lock together
- latex: $L = I\omega$
  symbols: L angular momentum, I moment of inertia, ω angular velocity
  when: no external torque — tucking lowers I, so ω rises
- latex: $\sigma = \frac{F}{A}$
  symbols: σ stress (Pa), F force (N), A cross-sectional area (m²)
  when: bone and tendon loading; strain ΔL/L and modulus E = stress/strain complete the set
key_points:
- 'Kinematics: three constant-a equations; vertical and horizontal independent.'
- F = ma sums forces; action-reaction on different bodies.
- Work = F d cos(theta); normal and centripetal do no work.
- Momentum conserved without external impulse; L = I omega.
- Static equilibrium — both force and torque sums zero.
- 'Bone mechanics: stress/strain; forearm lever amplifies force.'
mnemonics:
- phrase: Weight w = mg, apparent weight m(g + a)
  means: Scale reading depends on acceleration.
- phrase: Normal and centripetal never work
  means: Perpendicular forces — zero work in every situation.
maps:
- title: Elevator scale reading
  steps:
  - accelerating up — N = m(g + a)
  - constant speed — N = mg
  - accelerating down — N = m(g - a)
  - free fall — N = 0
- title: Collision outcomes
  steps:
  - elastic — KE conserved
  - inelastic — KE lost
  - perfectly inelastic — stick, max loss
  - explosive — one body splits, p conserved
passage:
  text: A 60 kg patient holds a 5 kg weight with the forearm horizontal, elbow as pivot. The biceps inserts
    4 cm from the elbow joint; the hand (load) is 32 cm away. The forearm itself weighs 2 kg with its
    center 15 cm from the elbow.
  questions:
  - q: The torque contributed by the forearm's own weight is…
    options:
      A: 2 x 9.8 x 0.15 N-m about the elbow
      B: 5 x 9.8 x 0.32
      C: 4 x 9.8 x 0.04
      D: Zero
    answer: A
    explain: Torque = force x lever arm about the pivot — m g x distance.
    distractors:
      A: Correct — forearm weight at 15 cm.
      B: That is the hand load torque.
      C: That is the biceps torque.
      D: Every weight contributes.
  - q: Ignoring the forearm itself, the biceps force needed is…
    options:
      A: 39 N
      B: 392 N
      C: 49 N
      D: 156 N
    answer: B
    explain: F x 0.04 = 5 x 9.8 x 0.32 → F = 15.7/0.04 = 392 N.
    distractors:
      A: That is the load torque.
      B: Correct.
      C: The load weight.
      D: Missing lever-arm ratio.
  - q: The elbow joint experiences a compression roughly…
    options:
      A: Less than the biceps force
      B: Equal to the load weight
      C: Zero
      D: Equal to the biceps force
    answer: A
    explain: Joint force plus load balances biceps — joint ≈ biceps minus load components — compressive,
      below the biceps value.
    distractors:
      A: Correct — biceps > joint > load.
      B: Joint carries more than the load.
      C: Equilibrium demands a reaction.
      D: That is the tendon tension.
pitfalls:
- Scale reading = normal force, not weight.
- Action-reaction pairs mislabeled on the same object.
- Centripetal force written as a separate force.
- Forgetting the moment arm for inclined forces.
- Torque sum only, without the force sum.
