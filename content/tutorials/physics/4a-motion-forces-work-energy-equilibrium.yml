review_questions:
- q: A car moving at constant speed around a circular track has…
  options:
    A: Zero acceleration
    B: Centripetal acceleration
    C: Constant velocity
    D: No net force
  answer: B
  explain: Direction changes — acceleration points inward.
  distractors:
    A: There IS acceleration.
    B: Correct.
    C: Velocity direction changes.
    D: Net force creates the acceleration.
- q: Work done by a conservative force is…
  options:
    A: Path-dependent
    B: Path-independent
    C: Always positive
    D: Always zero
  answer: B
  explain: Only the endpoints matter — PE is defined by position.
  distractors:
    A: Friction is the nonconservative.
    B: Correct.
    C: Sign depends on direction.
    D: Depends.
- q: A 1000 kg car moving 20 m/s has momentum…
  options:
    A: 20 kg-m/s
    B: 2000 kg-m/s
    C: 20000 kg-m/s
    D: 40000 kg-m/s
  answer: C
  explain: p = mv = 1000 x 20.
  distractors:
    A: Mass/velocity slip.
    B: Missing a zero.
    C: Correct.
    D: Energy formula.
- q: For static equilibrium of a lever…
  options:
    A: Sum F = 0 only
    B: Sum tau = 0 only
    C: Both sums are zero
    D: Angular momentum maximal
  answer: C
  explain: Both translational and rotational balance required.
  distractors:
    A: Need torque too.
    B: Need force too.
    C: Correct.
    D: Wrong concept.
