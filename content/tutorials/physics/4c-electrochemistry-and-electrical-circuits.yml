subject: physics
chapter: 4C · Electrochemistry and electrical circuits
title: 4C · Electrochemistry and Electrical Circuits
overview: Circuit elements, Ohm's law, capacitance, and electrochemistry — redox reactions, cells, and
  the Nernst equation. The category fuses circuit physics with the redox chemistry underlying biological
  energy and nerve signaling.
sections:
- heading: Redox chemistry and electrochemical cells
  objectives:
  - Assign oxidation numbers and identify the species oxidised and reduced.
  - Distinguish a galvanic from an electrolytic cell by the sign of the cell potential.
  - Locate the anode and cathode and trace electron flow through the external wire.
  body:
  - ==Oxidation loses electrons (LEO); reduction gains (GER)==. Oxidation numbers track electron movement
    — assign and balance by half-reactions. ==Galvanic (voltaic) cells run spontaneously (positive E-cell);
    electrolytic cells need an external voltage==.
  - Anode = oxidation, cathode = reduction; ==electrons flow anode to cathode through the external wire;
    anions migrate to anode in solution==. Standard cell potential E-cell = E-cathode - E-anode. In biological
    reactions the same rules apply to cellular respiration chains.
  misconception: '"The anode is always the negative electrode, so in an electrolytic cell the anode must
    be the reduction site." Electrode SIGN flips with the cell type; electrode JOB does not. In a galvanic
    cell the anode is negative, in an electrolytic cell it is positive — but in both it is the site of
    oxidation, because ''anode'' means where oxidation happens, not where the minus sign is. Red Cat and
    An Ox hold in every cell you will meet.'
  connection: 'Cellular respiration is this section stretched across a membrane: carbohydrate carbon ends
    up oxidised to CO2 while oxygen ends up reduced to water, and the electron traffic is what the transport
    chain banks as ATP. Chapter 1D · Bioenergetics and fuel metabolism follows the electrons; the bookkeeping
    rules you just used on zinc and copper are the same ones.'
  connection_label: How sciences interconnect
  check:
  - q: In any electrochemical cell, reduction occurs at the…
    options:
      A: Anode
      B: Salt bridge
      C: Cathode
      D: Electrolyte
    answer: C
    explain: Cathode is always the reduction site — 'Red Cat.'
    distractors:
      A: Oxidation site.
      B: Ionic conductor.
      C: Correct.
      D: Medium, not a site.
  - q: In the spontaneous reaction Zn + Cu2+ -> Zn2+ + Cu, which statement is correct?
    options:
      B: Zn is oxidised and serves as the anode
      A: Cu2+ is oxidised and serves as the anode
      C: Zn is reduced and serves as the cathode
      D: Cu2+ is reduced and serves as the anode
    answer: B
    explain: Zn loses two electrons (oxidation, anode); Cu2+ gains them (reduction, cathode).
    distractors:
      A: Copper ion GAINS electrons — that is reduction, so it is the cathode site.
      C: Zinc loses electrons; gaining them is reduction.
      D: A reduction site is by definition the cathode, never the anode.
- heading: Circuit elements — EMF, current, resistance
  objectives:
  - Distinguish EMF from terminal voltage and account for internal resistance.
  - Compute the equivalent resistance of series and parallel combinations.
  - Apply Ohm's law to solve for current, voltage, or resistance.
  body:
  - '==EMF is the ideal cell voltage; terminal voltage = EMF - I r (internal resistance drop)==. Ohm''s
    law I = V/R. Series: same current, voltages add; parallel: same voltage, currents add.'
  - ==Series resistors R = R1 + R2; parallel 1/R = 1/R1 + 1/R2 (total less than each)==. Short circuits
    bypass resistance — huge current — the fuse/circuit breaker job.
  misconception: '"Current gets used up as it flows through a bulb, so the wire leaving the bulb carries
    less current than the wire entering it." Charge is not consumed — nothing in the bulb destroys it.
    A bulb offers resistance, which costs voltage and delivers energy as light and heat, but the same
    current that enters must leave: in a series loop there is only one value of I. What gets ''used up''
    is electrical potential energy, not current.'
  connection: 'Parallel wiring is why one blown lamp does not darken the house — every appliance gets
    the full supply voltage and draws its own current. The cost shows up on one circuit: a space heater
    plus a kettle plus a hair dryer each add their own current, the total climbs past what the wiring
    can shed as I^2R heat, and the breaker does its job.'
  connection_label: Real-world connection
  check:
  - q: A battery with EMF 9 V and internal resistance 1 ohm drives a 5 ohm load. The terminal voltage
      is…
    options:
      A: 1.5 V
      B: 10.8 V
      C: 9 V
      D: 7.5 V
    answer: D
    explain: I = 9/(1 + 5) = 1.5 A; terminal = 9 - (1.5)(1) = 7.5 V.
    distractors:
      A: That is the internal drop.
      B: Terminal can't exceed EMF.
      C: Ignoring internal drop.
      D: Correct — 7.5 V.
  - q: Two 6 ohm resistors in parallel are connected in series with a third 6 ohm resistor. The total
      resistance is…
    options:
      B: 9 ohm
      A: 18 ohm
      C: 2 ohm
      D: 4 ohm
    answer: B
    explain: The parallel pair gives 6/2 = 3 ohm; in series with 6 ohm that is 9 ohm.
    distractors:
      A: Adding all three as one series chain.
      C: Combining all three in parallel (6/3).
      D: Putting the series pair together first (12 ohm) and then that in parallel with the third.
  figures:
  - src: 4c-electrochemistry-and-electrical-circuits/fig-494753ca.webp
    caption: A simple circuit — conventional current from positive to negative; electrons flow the reverse
      way.
    credit: Ch 19 · OpenStax Physics (High School) — CC BY-NC-SA 4.0
  - src: 4c-electrochemistry-and-electrical-circuits/fig-12ee6e38.webp
    caption: Alternating current — the sinusoidal current and the back-and-forth motion of charge carriers.
    credit: Ch 19 · OpenStax Physics (High School) — CC BY-NC-SA 4.0
- heading: Capacitance and RC behavior
  objectives:
  - Calculate capacitance from charge and voltage, or from plate area and separation.
  - Combine capacitors in series and parallel, recognising the opposite of resistors.
  - Predict the stored energy or the fractional charge after one time constant.
  body:
  - ==C = Q/V; parallel plate C = epsilon A/d; series capacitors 1/C totals, parallel add — opposite of
    resistors==. Energy U = (1/2)CV2.
  - '==RC transient: tau = RC; charging to 63% in one tau, discharging to 37%.== Formula V(t) = V0(1 -
    e^-t/tau) and V0 e^-t/tau. In defibrillation and neuroscience time-constant logic, tau sets how fast
    a membrane charges.'
  misconception: '"Capacitors combine the same way resistors do, so two 3 uF capacitors in series give
    6 uF." They combine in reverse: series capacitors add reciprocals, giving 1.5 uF here — less than
    either one — while parallel capacitors add directly. Recognising the flip is worth a free mark, because
    the exam always offers the un-flipped answer as a distractor.'
  connection: 'A cell membrane is a capacitor in biology clothing: a thin insulating bilayer separating
    two conducting fluids, roughly a microfarad per square centimetre. Because V = Q/C, that small capacitance
    is why moving a pittance of charge shifts the membrane voltage by millivolts — the arithmetic that
    chapter 3A · Nervous and endocrine systems uses for the resting potential and the action potential
    spike.'
  connection_label: How sciences interconnect
  check:
  - q: Two 3 uF capacitors in series give…
    options:
      A: 3 uF
      B: 0.5 uF
      C: 6 uF
      D: 1.5 uF
    answer: D
    explain: 1/C = 1/3 + 1/3 → C = 1.5 uF — series capacitors ADD reciprocals.
    distractors:
      A: One only.
      B: Half again of wrong.
      C: That's parallel.
      D: Correct.
  - q: A 100 uF defibrillator capacitor is charged to 200 V. The energy stored is…
    options:
      C: 2.0 J
      A: 0.01 J
      B: 4.0 J
      D: 20 J
    answer: C
    explain: U = (1/2)CV2 = (1/2)(1.0 x 10-4)(200)2 = (1/2)(1.0 x 10-4)(4.0 x 10^4) = 2.0 J.
    distractors:
      A: Using V instead of V2 — the voltage must be squared.
      B: Omitting the factor of 1/2 in (1/2)CV2.
      D: Treating 100 uF as 1.0 x 10-3 F, one power of ten too large.
- heading: Power, heating, and circuit safety
  objectives:
  - Choose the power expression that matches the quantities actually known.
  - Predict which element dissipates the most power in series and in parallel.
  - Explain why protective devices respond to current rather than to voltage.
  body:
  - ==P = IV = I2R = V2/R==. In series, the biggest resistor burns the most power (same current). In parallel,
    the SMALLEST resistor draws the most current and most power (same voltage).
  - '==Fuses and breakers trip on excess CURRENT — I2R heating melts the element==. Practical ratchets:
    wire gauge limits current; extension cords overloading = fire hazard; the exam likes P vs R behavior
    under fixed V.'
  misconception: '"The 100 W bulb is always the brighter one, whatever the circuit." Only at its rated
    voltage. In series the two bulbs share the same current, so the higher-resistance bulb dissipates
    more power — and the 60 W bulb is the higher-resistance one, since R = V^2/P at the rating. Swap the
    circuit for parallel and the ranking flips. Brightness follows P = I^2R or V^2/R for the circuit you
    actually built, not the label on the box.'
  connection: 'I^2R heating is the physics behind a whole safety code: an undersized extension cord feeding
    a heater warms along its whole length, a loose connection concentrates that heating at one point,
    and that is where insulation fails and fires start. The fuse simply asks the same question the wire
    asks — how much current — and sacrifices itself first.'
  connection_label: Real-world connection
  check:
  - q: Two bulbs, 60 W and 100 W (designed for 120 V), placed in SERIES across 240 V. The brighter is…
    options:
      A: The 60 W bulb
      B: The 100 W bulb
      C: Equally bright
      D: Both burn out instantly
    answer: A
    explain: 'Series: same current; the 60 W has the higher resistance (R = V2/P), so uses more power.'
    distractors:
      A: Correct — higher R wins in series.
      B: Lower R.
      C: R differs.
      D: They glow, not instantly pop.
  - q: Two 10 ohm resistors are wired in parallel across a 20 V supply. The total power drawn is…
    options:
      B: 80 W
      A: 20 W
      C: 40 W
      D: 160 W
    answer: B
    explain: 'Each branch: P = V2/R = 400/10 = 40 W; the parallel pair doubles it to 80 W (equivalently
      R-eq = 5 ohm, P = 400/5).'
    distractors:
      A: Adding the resistances as though they were in series (R = 20 ohm).
      C: Finding one branch's dissipation and forgetting its twin.
      D: Squaring the total current but multiplying by a single branch's resistance.
- heading: Nernst equation and membrane potentials
  objectives:
  - Calculate an ion's equilibrium potential with the Nernst equation at 37C.
  - Explain why the resting potential sits close to the K+ value.
  - Predict how a change in external ion concentration shifts the membrane potential.
  body:
  - '==Nernst: E-ion = (RT/zF) ln([out]/[in]) — at 37C, E = (61 mV/z) log10([out]/[in])==. The resting
    potential (-70 mV) is dominated by K+ since the membrane at rest is ~50x more permeable to K+ than
    Na+.'
  - ==The Goldman equation weights the Nernst terms by permeability==. Action potential — voltage-gated
    Na+ opens first (depolarize), K+ later (repolarize). ==The membrane capacitance sets how many ions
    shift per mV — RC thinking again==.
  misconception: '"Raising external K+ pushes more potassium in from outside, so the resting potential
    should get more negative." The resting potential is not set by how much K+ there is outside — it is
    set by the GRADIENT. Tripling external K+ shrinks [out]/[in], the log term falls toward zero, and
    the K+ equilibrium potential moves toward 0 mV: the cell depolarizes, exactly as the check item says.'
  connection: 'The Nernst equation is the single most physics-loaded line in neuroscience: each ion carries
    its own equilibrium voltage, and the membrane potential is just the permeability-weighted average
    of them. Chapter 3A · Nervous and endocrine systems builds the action potential on exactly that base
    — Na+ rushing toward +60 mV, K+ pulling back toward -94 mV.'
  connection_label: How sciences interconnect
  check:
  - q: Raising the EXTERNAL K+ concentration (keeping internal fixed) makes the resting potential…
    options:
      A: Unchanged
      B: More negative
      C: Less negative (depolarized)
      D: Infinite
    answer: C
    explain: The K+ gradient shrinks — the Nernst term approaches zero — E moves toward zero.
    distractors:
      A: Cl- held constant.
      B: Opposite direction.
      C: Correct — gradient weakening depolarizes.
      D: The pump still runs.
  - q: For Na+, [out] = 145 mM and [in] = 15 mM (z = +1). The Nernst potential at 37C is nearest…
    options:
      D: +60 mV
      A: -60 mV
      B: +30 mV
      C: +138 mV
    answer: D
    explain: E = (61/z) log10(out/in) = 61 log10(9.7) = 61 x 0.99 = +60 mV.
    distractors:
      A: Inverting the ratio to [in]/[out] flips the sign; a cation's potential is positive when the ion
        is concentrated outside.
      B: Dividing by z = 2, as though sodium were divalent.
      C: Multiplying 61 by the natural log of the ratio; the 61 mV constant already assumes base-10.
examples:
- prompt: Compute the resting potential contribution of K+ with [K+]out = 4 mM, [K+]in = 140 mM at 37C.
  strategy: 'One permeant ion means the plain Nernst equation answers it — no Goldman weighting, no pump
    terms. The plan: confirm z = +1 for K+, form the ratio [out]/[in] = 4/140 (outside over inside, the
    direction students most often flip), take its base-10 log, and multiply by the 61 mV constant for
    37C.'
  solution:
  - E-K = (61 mV) log10([out]/[in]) = 61 log10(4/140).
  - 4/140 = 0.0286, log10 = -1.54.
  - E-K = 61 x (-1.54) = -94 mV.
  - K+ equilibrium alone is about -94 mV — the cell sits above that due to Na+ leak and Na-K pump.
  answer: About -94 mV — close to the resting potential, which is why K+ dominates at rest.
  discussion: 'The sign carries the physiology: K+ is ~35x concentrated inside, so the log is negative
    and the inside is driven negative — exactly the resting polarity. Note that -94 mV is MORE negative
    than the measured -70 mV; that gap is the evidence that K+ dominates but does not monopolise, since
    the Na+ leak drags the value back toward Na+''s +60 mV. Sanity check the log by magnitude: a ratio
    between 10 and 100 must give between 1 and 2, so an answer outside -61 to -122 mV would signal a slipped
    ratio.'
  distractors:
    A: +94 mV — inverting the gradient.
    B: -61 mV — confusing z with the constant.
    C: 0 mV — using [in]/[out].
  practice:
    q: For chloride, [Cl-]out = 110 mM and [Cl-]in = 10 mM (z = -1). The Nernst potential at 37C is nearest…
    options:
      C: -64 mV
      A: +64 mV
      B: -128 mV
      D: -6.4 mV
    answer: C
    explain: E = (61/-1) log10(110/10) = -61 x 1.04 = -64 mV; the negative charge flips the sign a cation
      would give.
    distractors:
      A: Dropping the sign of z, which treats chloride as a cation and flips the polarity.
      B: Using z = -2, as though chloride were divalent.
      D: Reading the ratio as 1.1 instead of 11 — one power of ten lost.
key_equations:
- latex: $V = IR$
  symbols: V potential difference (V), I current (A), R resistance (ohm)
  when: any ohmic element — the first line of every circuit problem
- latex: $V_{term} = \mathcal{E} - Ir$
  symbols: V_term terminal voltage, Ε emf of the cell, I current, r internal resistance
  when: a real battery under load — the terminal voltage is below the emf
- latex: $R_{eq} = R_1 + R_2$
  symbols: R_eq equivalent resistance, R₁ R₂ individual resistances
  when: series — same current through both, voltages add
- latex: $\frac{1}{R_{eq}} = \frac{1}{R_1} + \frac{1}{R_2}$
  symbols: R_eq equivalent resistance, R₁ R₂ branch resistances
  when: parallel — same voltage across both; two equal resistors halve R
- latex: $U = \frac{1}{2}CV^{2}$
  symbols: U stored energy (J), C capacitance (F), V voltage (V)
  when: energy in a charged capacitor — defibrillator and flash-lamp sizing
- latex: $P = IV = I^{2}R = \frac{V^{2}}{R}$
  symbols: P power (W), I current (A), V voltage, R resistance
  when: pick the form that matches the knowns; series favors high R, parallel low R
- latex: $\tau = RC$
  symbols: τ time constant (s), R resistance (ohm), C capacitance (F)
  when: RC charging and discharging — 63% in one tau, 37% left after one tau
- latex: $E = \frac{61\text{ mV}}{z}\log_{10}\frac{[\text{out}]}{[\text{in}]}$
  symbols: E equilibrium potential (mV), z ion valence, [out]/[in] concentration ratio
  when: Nernst at 37 °C — one ion at a time; sign follows z and the direction of the gradient
key_points:
- Red Cat; An Ox. Electrons flow anode → cathode outside.
- Terminal voltage = EMF - I r.
- Series R adds; parallel R halves; capacitors opposite.
- P = IV = I2R = V2/R; series favors high R, parallel favors low R.
- 'RC tau: 63% charge, 37% remaining.'
- 'Nernst at 37C: 61/z log10(out/in); K+ rules rest.'
mnemonics:
- phrase: Red Cat, An Ox
  means: Reduction at cathode; oxidation at anode.
- phrase: OIL RIG
  means: Oxidation Is Loss, Reduction Is Gain (of electrons).
maps:
- title: Cell traffic
  steps:
  - anode — oxidation, anions flow toward solution
  - external wire — electrons anode→cathode
  - cathode — reduction
  - salt bridge — ions complete the circuit
- title: Action potential phases
  steps:
  - rest — K+ dominance, -70 mV
  - depolarize — Na+ channels open fast
  - repolarize — K+ efflux, Na+ inactivated
  - hyperpolarize-late — K+ overshoot
passage:
  text: A researcher measures a cell's membrane potential in normal Ringer's, then triples external K+
    from 4 to 12 mM while keeping Na+ and Cl- constant. The recorded potential moves from -70 mV to about
    -50 mV.
  questions:
  - q: The depolarization is best explained by…
    options:
      A: Na-K pump halt
      B: Na+ channel opening
      C: K+ gradient shrinking per Nernst
      D: Cl- influx
    answer: C
    explain: Tripling external K+ shrinks the K+ equilibrium gradient — the Goldman sum moves toward zero.
    distractors:
      A: The pump still runs.
      B: Na+ was held constant.
      C: Correct.
      D: Cl- held constant.
  - q: If instead external Na+ were tripled, the effect would be…
    options:
      A: Much smaller
      B: Identical
      C: Much larger
      D: Zero
    answer: A
    explain: Resting permeability to Na+ is ~1/50 of K+ — its Nernst influence is weighted tiny.
    distractors:
      A: Correct.
      B: Permeabilities differ.
      C: Opposite — Na+ is damped at rest.
      D: Na+ contributes slightly.
  - q: The membrane time constant tau determines…
    options:
      A: The speed of channel opening
      B: The threshold voltage
      C: The action potential amplitude
      D: How fast voltage settles to a new value
    answer: D
    explain: tau = RC — the membrane charges and decays with this time constant.
    distractors:
      A: Gating is molecular, not RC.
      B: Threshold is set by channels.
      C: Amplitude is set by Nernst gains.
      D: Correct.
pitfalls:
- Redox direction — lose electrons is oxidation even for negative ions.
- Terminal voltage vs EMF confusion.
- Capacitor-resistor series/parallel flip.
- Nernst denominator — [out]/[in] for cations.
- Goldman permeability weighting ignored.
