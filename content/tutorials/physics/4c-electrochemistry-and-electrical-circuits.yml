review_questions:
- q: A galvanic cell's E-cell is +1.1 V. The reaction…
  options:
    A: Is spontaneous
    B: Releases only heat
    C: Requires external voltage
    D: Is at equilibrium
  answer: A
  explain: Positive E-cell → negative delta-G → spontaneous.
  distractors:
    A: Correct.
    B: It does electric work.
    C: That is electrolytic.
    D: E = 0 at equilibrium.
- q: Doubling the voltage across a resistor doubles the…
  options:
    A: Resistance
    B: Current (power quadruples)
    C: Only current
    D: Nothing
  answer: B
  explain: I = V/R doubles; P = V2/R quadruples.
  distractors:
    A: R fixed.
    B: Correct.
    C: Power also jumps.
    D: Ohm applies.
- q: A 5 ohm and 20 ohm resistor in parallel give…
  options:
    A: 25 ohm
    B: 4 ohm
    C: 15 ohm
    D: 100 ohm
  answer: B
  explain: 1/R = 1/5 + 1/20 = 0.25 → R = 4 ohm.
  distractors:
    A: Series math.
    B: Correct.
    C: Average wrong.
    D: Product over sum is 100/25 = 4 — same.
- q: Which cell has the highest resistance millivolt shift per ion?
  options:
    A: A giant capacitance cell
    B: A tiny capacitance cell
    C: They are equal
    D: Depends on ion size
  answer: B
  explain: V = Q/C — small C means large mV change per charge moved.
  distractors:
    A: Large C damps voltage.
    B: Correct.
    C: C enters directly.
    D: Size is not the mechanism.
