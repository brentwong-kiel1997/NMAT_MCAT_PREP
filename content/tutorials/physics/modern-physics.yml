review_questions:
- q: The photoelectric work function is…
  options:
    A: The minimum photon energy to eject
    B: A measure of nuclear binding
    C: Always zero for metals
    D: The electron mass energy
  answer: A
  explain: Threshold energy required to free an electron from the surface.
  distractors:
    B: Binding energy is nuclear.
    C: Real metals have nonzero values.
    D: mc2 is rest energy.
- q: Which tracer would be most suitable for a 90-minute PET protocol?
  options:
    A: 6 hours
    B: 110 minutes
    C: 3 days
    D: 20 minutes
  answer: B
  explain: Half-life roughly matches the protocol length — signal strength vs dose.
  distractors:
    A: Too long — lingering dose.
    B: Correct — F-18.
    C: Too long.
    D: Too short — activity collapses.
- q: Alpha emission reduces both A and Z by…
  options:
    A: 4 and 2
    B: 2 and 2
    C: 4 and 4
    D: 1 and 1
  answer: A
  explain: Alpha = He-4 — mass decreases by 4, charge by 2.
  distractors:
    A: Correct.
    B: Only two helium-4s would be 8.
    C: Gamma does that.
    D: Beta does that.
- q: Two photons — red (700 nm) and violet (400 nm). The violet photon…
  options:
    A: Has lower energy
    B: Has higher energy
    C: Has equal energy
    D: Moves faster in vacuum
  answer: B
  explain: E = hc/lambda — shorter wavelength means higher energy.
  distractors:
    A: Correct — higher energy.
    C: Equal only if same intensity.
    D: c is constant — both are c.
