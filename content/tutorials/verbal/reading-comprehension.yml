review_questions:
- q: '''The author''s tone is best described as…'' — the evidence comes from…'
  options:
    A: Your opinion
    B: The answer choices' look
    C: The passage's language
    D: The topic's fame
  answer: C
  explain: Register is in the words.
  distractors:
    A: Opinion is excluded.
    B: Choices are data, not evidence.
    C: Correct.
    D: Topic is not tone.
- q: A paragraph starting 'For instance…' functions as…
  options:
    A: Evidence for the preceding claim
    B: A new thesis
    C: A conclusion
    D: A counterargument
  answer: A
  explain: '''For instance'' signals exemplification.'
  distractors:
    A: Correct.
    B: No new claim.
    C: Concluding markers differ.
    D: It supports, not resists.
- q: '''The passage states that…'' items are…'
  options:
    A: Detail questions
    B: Tone questions
    C: Main-idea questions
    D: Application questions
  answer: A
  explain: Explicit claims are details.
  distractors:
    A: Correct.
    B: Tone is attitude.
    C: Main idea is the claim set.
    D: Application is new cases.
- q: Reading once with annotation beats re-reading because…
  options:
    A: Annotation builds a map the questions query
    B: Re-reading doubles speed
    C: Annotation is always faster
    D: The exam rewards notes
  answer: A
  explain: The map is the interface to every question.
  distractors:
    A: Correct.
    B: Re-reading doubles TIME.
    C: Not inherently.
    D: Notes are personal tools.
