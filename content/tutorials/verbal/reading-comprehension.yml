subject: verbal
chapter: Reading Comprehension
title: Reading Comprehension
overview: The NMAT prose-reading items — main idea, detail, inference, function, and tone over short passages.
  The CARS skills from the MCAT side transfer directly; the differences are passage length and question
  density.
sections:
- heading: Passage reading strategy
  body:
  - ==Read actively — mark the thesis, one-line paragraph summaries, and transition words (however, therefore,
    for example)==. ==The reading pass should take 2-3 minutes for a 500-word passage — no more; the questions
    will revisit specifics==
  - ==Reading to the questions — you read ONCE, thoroughly, then answer from structure memory plus targeted
    re-reading==
  check:
  - q: During the initial read, the strongest habit is…
    options:
      A: Reading slowly twice
      B: Skipping to the questions first
      C: Reading only the first paragraph
      D: Marking the thesis and paragraph functions
    answer: D
    explain: A structural annotation serves every question family.
    distractors:
      A: One pass with marking beats two passive ones.
      B: Questions assume the whole passage.
      C: Thesis alone is not enough.
      D: Correct.
- heading: Main idea and title items
  body:
  - ==Main idea items reward the claim, not the topic — 'about X' answers fail; 'argues that X' answers
    win==. ==Title items paraphrase the same claim compactly==
  - ==Wrong shapes — too narrow, too broad, off-topic, or reversed==. ==The thesis usually sits at the
    opening's end or after a 'but' — and returns at the close==
  check:
  - q: '''This passage is primarily concerned with…'' wants…'
    options:
      A: The title of the source
      B: The author's central claim, not a subject label
      C: A list of examples
      D: The first paragraph's noun
    answer: B
    explain: Concern = claim; topic words alone are traps.
    distractors:
      A: Titles come from claims.
      B: Correct.
      C: Examples support, not constitute, the claim.
      D: A noun is a topic, not the claim.
- heading: Detail and evidence items
  body:
  - ==Detail items point at a specific claim — relocate the sentence and paraphrase precisely, keeping
    scope (most vs all, some vs only)==. ==Evidence items ask which fact the passage cites for a claim
    — look at the claim's support, not its restatement==
  - ==The one-word-changed trap — choices that swap a qualifier or polarity of the original==
  check:
  - q: The passage says 'many patients benefit'. An option says 'all patients benefit'. That option…
    options:
      A: Is a fair paraphrase
      B: Overstates the scope — wrong
      C: Stronger than the passage claims
      D: Is unrelated
    answer: B
    explain: '''Many'' limits; ''all'' exceeds the passage''s claim.'
    distractors:
      A: Scope changed.
      B: Correct.
      C: Stronger is not accurate.
      D: Same topic, but the claim differs.
- heading: Inference and application items
  body:
  - ==Inference stays inside the passage's logic — one measured step, never outside facts==. ==Application
    transfers the passage's principle to a new case==. ==Both reject any answer needing unprovided information==
  - ==The negation check cuts wrong inferences — if the passage does not rule out the opposite, the assertion
    is unsupported==
  check:
  - q: A safe inference from 'The study's sample was small and urban' is that…
    options:
      A: The study is fraudulent
      B: The sample was perfect
      C: The urban setting is irrelevant
      D: Generalizing to rural populations is not licensed
    answer: D
    explain: The limitation limits generalization — one careful step.
    distractors:
      A: Small is not invalid.
      B: Limits were stated.
      C: Urbanity mattered to the design.
      D: Correct.
- heading: Tone, function, and speed hygiene
  body:
  - ==Tone items — the emotional register from language, evidenced in the passage==. ==Function items
    — what a sentence or paragraph does (define, exemplify, concede, conclude)==
  - ==Pacing — about 1 minute per question; mark and return to hard items, never break flow==. ==Order
    of attack — main idea and function first, then details (relocate), then inferences (reason carefully)==
  check:
  - q: A passage full of 'as we have seen', 'it is clear that' suggests a tone of…
    options:
      A: Indifference
      B: Panic
      C: Measured confidence
      D: Sarcasm
    answer: C
    explain: The register asserts steadily without excess.
    distractors:
      A: Assertions show engagement.
      B: No alarm.
      C: Correct.
      D: No irony markers.
examples:
- prompt: 'Passage: ''The jeepney''s persistence is usually explained by economics alone. But its cultural
    load — the decorated body, the community of drivers, the route folklore — is what preserves it as
    the fares shift.'' — Ask: the main idea.'
  solution:
  - Pivot marker 'But' redirects from the economic explanation.
  - Second sentence carries the claim — cultural load explains persistence.
  - The first sentence is the presented view, not the author's.
  - 'Main idea: cultural significance, not economics, best explains the jeepney''s endurance.'
  answer: The jeepney endures mainly because of its cultural meaning, not just fares.
  distractors:
    A: The jeepney will disappear with rising fares — unsupported.
    B: Jeepneys are purely economic — the first sentence, not the author's view.
    C: All public transport carries cultural load — a generalization beyond scope.
key_points:
- Read once, mark structures, then answer.
- Main idea = claim, not topic.
- Detail accuracy — scope words are load-bearing.
- Inference — one step, inside the logic.
- Application — principle to new case.
- Tone evidenced in language; functions named.
mnemonics:
- phrase: Claim, not topic
  means: What main-idea items actually want.
- phrase: Mark, map, re-read
  means: The three-part reading routine.
maps:
- title: Passage annotation
  steps:
  - bracket the thesis
  - one-line label per paragraph
  - circle transitions
  - underline numeric or detail anchors
  - star the close
- title: Question order
  steps:
  - main idea first
  - function questions second
  - details — relocate third
  - inference and application last
passage:
  text: Rice terraces in northern Luzon have been farmed for centuries without industrial fertilizer.
    The terraces' stone walls trap silt; the flooded paddies recycle nutrients continuously. External
    observers have called the system sustainable — and it has endured. Yet younger farmers increasingly
    migrate to cities, and terraces on upper slopes are being abandoned for less labor-intensive crops.
  questions:
  - q: The main idea is…
    options:
      A: Industrial farming is superior
      B: Nutrients are wasted
      C: A sustainable traditional system is now threatened by labor migration
      D: Rice terraces are antique curiosities
    answer: C
    explain: The 'yet' pivot closes with the abandonment threat.
    distractors:
      A: No industrial comparison.
      B: The opposite of nutrient waste.
      C: Correct.
      D: No museum framing — the system works.
  - q: Which claim is a DETAIL the passage supports?
    options:
      A: The terraces produce all Philippine rice
      B: Fertilizers caused migration
      C: Rivers feed every terrace
      D: Stone walls trap silt, recycling nutrients
    answer: D
    explain: The sentence is stated directly.
    distractors:
      A: Scope blasts beyond the text.
      B: No causal claim.
      C: No hydrology data.
      D: Correct.
  - q: A safe inference is…
    options:
      A: The system will collapse by next year
      B: Abandoning upper terraces may erode part of the system
      C: The farmers reject tradition
      D: Cities are better places to farm
    answer: B
    explain: Abandonment plausibly degrades a silt-retention network — one careful step.
    distractors:
      A: Timing is unknown.
      B: Correct.
      C: Migration is economic, not ideological.
      D: The passage makes no urban comparison.
pitfalls:
- Answering from personal knowledge about the topic.
- Trading 'most' for 'all' scope.
- Tone read from the topic instead of the words.
- Main-idea picks that name the subject only.
- Unsupported absolutes in inference items.
