review_questions:
- q: 'Famous : notorious :: cheap : ?'
  options:
    A: Economical
    B: Inexpensive
    C: Thrifty
    D: Valuable
  answer: B
  explain: Degree-and-connotation neighbors — famous/notorious and cheap/inexpensive pair by register.
  distractors:
    A: Overly positive.
    B: Correct — neutral synonym.
    C: Fiscal habit.
    D: Opposite.
- q: 'Author : book :: ? : ?'
  options:
    A: 'Sculptor : statue'
    B: 'Book : shelf'
    C: 'Writer : pen'
    D: 'Reader : library'
  answer: A
  explain: Creator to creation — same direction.
  distractors:
    A: Correct.
    B: Container relation.
    C: Worker to tool.
    D: Consumer to venue.
- q: Which pair is the antonym pair?
  options:
    A: 'Bright : dull'
    B: 'Bright : radiant'
    C: 'Light : lamp'
    D: 'Night : star'
  answer: A
  explain: Opposition of qualities.
  distractors:
    A: Correct.
    B: Degree pair.
    C: Source-effect.
    D: Scene pair.
- q: 'Colony : ants :: ? : ?'
  options:
    A: 'Flock : birds'
    B: 'Bird : nest'
    C: 'Queen : hive'
    D: 'Wing : flight'
  answer: A
  explain: 'Group of organisms — flock : birds mirrors it.'
  distractors:
    A: Correct.
    B: Dwelling relation.
    C: Role in group.
    D: Equipment relation.
