subject: verbal
chapter: Analogies
title: Analogies
overview: 'The NMAT lexical-reasoning item — A : B :: C : ? — requiring precise identification of the
  relationship between the first pair, then applying it to the second. The relationship is the answer;
  vocabulary is the gate.'
sections:
- heading: The analogy convention
  body:
  - '==Read ''A is to B as C is to ?'' — the relationship between A and B must fit exactly onto C and
    the unknown==. ==Name the relation in one clause: ''synonyms'', ''whole to part'', ''tool to function'',
    ''opposites'', ''worker to workplace'' etc=='
  - '==Order matters — A:B must be matched in the SAME direction: ''tree is to leaf'' is not the same
    relation as ''leaf is to tree''=='
  check:
  - q: 'Doctor : hospital :: teacher : ?'
    options:
      A: Desk
      B: Books
      C: Students
      D: School
    answer: D
    explain: Worker to workplace — the direction matches.
    distractors:
      A: Worker to furniture.
      B: Worker to tool.
      C: Worker to client — relational mismatch.
      D: Correct.
- heading: The relation families
  body:
  - ==Core families — synonyms, antonyms, part-whole, class-member, cause-effect, worker-tool/workplace,
    degree, agent-action, container-content, product-material==. ==Each family maps cleanly; a mislabeled
    family fails the item==
  - '==Degree relations — ''warm : hot'' (less to more); ''whisper : shout'' — both intensity but the
    two pairs must move the same direction=='
  check:
  - q: 'Which pair has the same relation as ''humid : arid''?'
    options:
      A: 'Rain : flood'
      B: 'Hot : warm'
      C: 'Water : plant'
      D: 'Wealthy : poor'
    answer: D
    explain: Antonyms — humid is the opposite of arid.
    distractors:
      A: Cause-effect.
      B: Degree, not opposition.
      C: Necessary-for.
      D: Correct.
- heading: Applying the relation to the second pair
  body:
  - ==Test each option — the relation named must hold with the unknown in the same slot-position==. ==When
    two options both relate — apply the FULL relation, including nuance (level of intensity, direction,
    part vs whole)==.
  - '==The elimination ladder — discard words you do not need to know by relation-signature: the unknown
    must be a noun/verb/adjective of the same class as B. ==The part-of-speech check kills options fast=='
  check:
  - q: 'Glove : hand :: sock : ?'
    options:
      A: Wool
      B: Foot
      C: Footwear
      D: Shoe
    answer: B
    explain: Covering to covered part — the same relation as glove to hand.
    distractors:
      A: Material.
      B: Correct.
      C: Class renaming.
      D: Outer layer, not the covered part.
- heading: Vocabulary dependence and recovery
  body:
  - ==The relation is only as good as the word set — the highest-yield study is word families, not isolated
    definitions==. ==When a word is unknown — use part-of-speech, connotation, and common roots (-phil,
    -logy, -photo, -graph) to place its family==
  - ==Context recovery fails on analogy items more than anywhere else — the ONLY rescue is pattern-matching
    the relations of known words==. ==The exam favors everyday-relationship words; heavy technical vocabulary
    is rare==
  check:
  - q: With an unknown word 'elucidate', the best recovery is…
    options:
      A: Skip the item
      B: Its formal feel and '-ate' suffix suggest 'to make clear' — a clarify-type verb
      C: Guess randomly
      D: Rewrite the stem
    answer: B
    explain: Pattern and register clues place the word's role.
    distractors:
      A: Every item is winnable.
      B: Correct.
      C: There are recoverable cues.
      D: The stem is fixed.
- heading: Speed and hygiene
  body:
  - '==Timebox — 20-30 seconds per item; the relation is discoverable in the first pass==. ==When stuck
    — test the options backward: put each unknown in the slot and check if the relation still reads naturally=='
  - ==Common wrong-patterns — synonym pairs where a degree relation was needed; whole-part reversed; agent-action
    mirrored. ==Order check — always read the stem in the printed direction==
  check:
  - q: The most reliable check before choosing is…
    options:
      A: Matching the first letter
      B: Choosing the rarest word
      C: Re-reading the relation in the stem's direction with the option in place
      D: Picking the longest option
    answer: C
    explain: The full directional read catches reversals.
    distractors:
      A: Alphabet is irrelevant.
      B: Rarity does not add relation.
      C: Correct.
      D: Length is noise.
examples:
- prompt: 'Opaque : transparent :: rigid : ?'
  solution:
  - Name the relation — antonyms (describing properties of materials).
  - Apply to rigid — the antonym is flexible.
  - Check the degree — complete opposition, not partial.
  - 'Answer: flexible.'
  answer: Flexible.
  distractors:
    A: Solid — a near-match but not the opposite (firm vs rigid).
    B: Hard — a synonym.
    C: Brittle — the failure mode under stress, not the opposite.
key_points:
- Name the relation in one clause first.
- Direction matters — match A:B onto C:? in the same order.
- Families — synonym, antonym, part-whole, tool-function, degree.
- Part-of-speech placement kills options fast.
- Unknown words — register, suffix, and root cues.
- Backward test — slot each option and read the stem.
mnemonics:
- phrase: Name it, then fit it
  means: Articulate the relation before matching.
- phrase: Same order, same slot
  means: The directional rule.
maps:
- title: Relation families
  steps:
  - synonym / antonym
  - part-whole (member-class)
  - cause-effect (agent-action)
  - tool-workplace (container-content)
  - degree intensity
- title: Item pipeline
  steps:
  - read stem direction
  - name the relation
  - apply to C
  - fit each option in slot ?
  - part-of-speech check
  - choose
passage:
  text: 'Sample stem set: (1) Sand : shore :: water : lake. (2) Blossom : bloom :: river : stream. (3)
    Calm : storm :: plain : mountain.'
  questions:
  - q: 'Stem 1 ''Sand : shore :: water : ?'' — the best unknown is…'
    options:
      A: Wave
      B: Beach
      C: Ocean
      D: Lake
    answer: D
    explain: Part of the whole — sand is on a shore; water is in a lake (container-content).
    distractors:
      A: Wave is an action.
      B: Beach is a near-duplicate of shore.
      C: Ocean is broader, not the fit slot.
      D: Correct.
  - q: 'Stem 2 ''Blossom : bloom :: river : ?'' — the relation is…'
    options:
      A: Opposites
      B: Tool-function
      C: Interchangeable synonyms
      D: Whole-part
    answer: C
    explain: Blossom and bloom are synonyms; river and stream likewise.
    distractors:
      A: No opposition.
      B: Neither is a tool.
      C: Correct.
      D: Neither is a part of the other.
  - q: 'Stem 3 ''Calm : storm :: plain : ?'' — the unknown word class is…'
    options:
      A: Verb
      B: Adjective
      C: Noun (a terrain feature contrasting with plain)
      D: Adverb
    answer: C
    explain: The mirrored word is a counterpart noun — mountain.
    distractors:
      A: Stem slots are nouns.
      B: No adjective required.
      C: Correct.
      D: No adverb.
pitfalls:
- Choosing a synonym when the relation demanded an antonym.
- Reverse direction — A:B applied as B:A.
- Mixing part-whole and member-class.
- Ignoring degree ('warm:hot' ≠ 'cold:hot').
- Unknown-word panic — recover by register and suffix.
