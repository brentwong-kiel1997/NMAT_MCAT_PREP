review_questions:
- q: Which event contributes DIRECTLY to genetic variation among gametes?
  options:
    A: Cytokinesis after meiosis II
    B: Crossing over during prophase I
    C: DNA replication before meiosis
    D: Telophase chromosome decondensation
  answer: B
  explain: Crossing over mosaics each chromatid — the direct variation source alongside independent assortment.
  distractors:
    A: Cytokinesis only partitions what already exists.
    C: Replication copies faithfully; it adds no new combinations.
    D: Decondensation is packaging, not recombination.
- q: A cross yields a 1:1:1:1 phenotypic ratio in the offspring. The most likely cross is…
  options:
    A: Aa × Aa at one locus
    B: AaBb × aabb with unlinked genes (testcross)
    C: AaBb × AaBb with unlinked genes
    D: AaBb × aabb with tightly linked genes
  answer: B
  explain: An unlinked dihybrid testcross makes four gamete types at equal frequency, each revealed by
    the recessive parent.
  distractors:
    A: Single-locus Aa × Aa gives 3:1, not four classes.
    C: The dihybrid self-cross gives 9:3:3:1.
    D: Tight linkage collapses classes toward parentals only.
- q: Andalusian chickens — black (BB) × white (WW) give slate-blue (BW). Two slate-blue birds are crossed.
    Phenotype ratio?
  options:
    A: '3 black : 1 white'
    B: '1 black : 2 blue : 1 white'
    C: '2 black : 2 white'
    D: All blue
  answer: B
  explain: Incomplete dominance — heterozygotes are visibly distinct, so the 1:2:1 genotype ratio surfaces
    as phenotypes.
  distractors:
    A: Complete-dominance arithmetic; the heterozygote is not black here.
    C: Heterozygotes do not vanish in incomplete dominance.
    D: Only true when both parents are the SAME genotype pairing.
- q: Genes A and B are 12 map units apart. In an AaBb × aabb testcross, the EXPECTED recombinant fraction
    is…
  options:
    A: 12% total
    B: 6% total
    C: 24% total
    D: 88% total
  answer: A
  explain: Map distance equals total recombinant percentage — 12 cM means 12% recombinants across both
    classes.
  distractors:
    B: 6% would be ONE recombinant class; the distance counts both.
    C: Doubling mistakes the per-class value for the total.
    D: 88% is the PARENTAL fraction — inverted reading.
