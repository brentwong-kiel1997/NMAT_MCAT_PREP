review_questions:
- q: Which pair correctly matches tissue to function?
  options:
    A: Sclerenchyma — photosynthesis
    B: Parenchyma — rigid dead support
    C: Xylem — water conduction
    D: Phloem — mineral uptake only
  answer: C
  explain: Xylem conducts water and dissolved minerals from root to leaf.
  distractors:
    A: Sclerenchyma is the dead support tissue.
    B: Parenchyma is the living, metabolic generalist.
    D: Mineral uptake is root hair work; phloem moves sugars.
- q: Triploblastic animals with a false coelom are…
  options:
    A: Annelids
    B: Nematodes
    C: Flatworms
    D: Cnidarians
  answer: B
  explain: Nematodes carry a pseudocoel — a cavity not fully lined by mesoderm.
  distractors:
    A: Annelids have true coeloms.
    C: Flatworms are acoelomate.
    D: Cnidarians are diploblastic.
- q: In double fertilization the two sperm nuclei produce…
  options:
    A: Two embryos
    B: Diploid embryo and triploid endosperm
    C: Two haploid gametes
    D: Zygote and spore
  answer: B
  explain: One fertilizes the egg, the other the polar nuclei — embryo plus food supply.
  distractors:
    A: Only one sperm meets the egg.
    C: Gametes come from gametophytes by mitosis, not from fertilization.
    D: Spores are meiotic products of the sporophyte.
- q: Deuterostomes are defined by…
  options:
    A: Blastopore becoming the mouth
    B: Blastopore becoming the anus
    C: Lacking mesoderm
    D: Having chitin exoskeletons
  answer: B
  explain: Deuteros = second mouth; the anus forms first, the mouth second.
  distractors:
    A: That is the protostome trait.
    C: Deuterostomes are triploblastic coelomates.
    D: That is arthropods — protostomes.
