subject: biology
chapter: The World of Plants and Animals
title: The World of Plants and Animals
overview: This chapter surveys the two multicellular kingdoms exam writers expect you to navigate — how
  plants build a body that feeds itself, and how animals are organized into the major body plans. NMAT
  asks the vocabulary; the MCAT uses plant transport and animal diversity as passage furniture. Prerequisites
  — Cells (organelles, walls) and Unity and Diversity (domains, kingdoms).
sections:
- heading: The plant body — three tissue systems
  objectives:
  - Assign a plant tissue to the dermal, ground, or vascular system.
  - State what each vascular tissue carries and in which direction.
  - Distinguish primary from secondary growth and their meristems.
  body:
  - A plant is built from three tissue systems that repeat in every organ. The **dermal** system is the
    skin (epidermis, cuticle, and in roots the water-absorbing root hairs). The **ground** system fills
    the interior — **parenchyma** (thin, metabolic, healing), the thick-walled **sclerenchyma** (support),
    and **collenchyma** (flexible support in growing parts). The **vascular** system is the plumbing —
    ==xylem carries water and minerals UP, phloem carries sugars BOTH WAYS==, and remembering the direction
    kills half the transport questions.
  - Growth happens in zones, not everywhere. **Apical meristems** at tips lengthen the plant (primary
    growth); **lateral meristems** — the vascular cambium and cork cambium — thicken it (secondary growth,
    which makes wood). A tree ring is a year of cambium activity, dense late-season wood against looser
    spring wood.
  check:
  - q: Sugars from a source leaf travel to a growing root through…
    options:
      A: Sclerenchyma fibers
      B: Cambium
      C: Phloem, bidirectional
      D: Xylem, upward only
    answer: C
    explain: Phloem translocates sugars from sources to sinks in either direction along the plant.
    distractors:
      A: Sclerenchyma is dead support tissue.
      B: Cambium is the growth layer, not a transport tissue.
      D: Xylem is the water-and-mineral one-way elevator.
  - q: Leaves need water and roots need sugar. Which tissue carries which, and where?
    options:
      A: Xylem carries water upward; phloem carries sugars from source to sink
      B: Phloem carries water upward and xylem carries sugars down
      C: Both tissues carry sugars; only xylem carries water
      D: Xylem carries sugars and water upward only
    answer: A
    explain: One-way water up, source-to-sink sugar in whichever direction the sinks demand.
    distractors:
      B: The two tissues' cargoes are swapped here.
      C: Phloem's cargo is sugar, not water.
      D: Xylem never carries sugar.
- heading: Plant reproduction and the alternation of generations
  objectives:
  - Trace the alternation of generations between sporophyte and gametophyte.
  - Describe double fertilisation and its two products.
  - Explain the evolutionary trend in gametophyte size.
  body:
  - Plants live ==two alternating lives== — a diploid **sporophyte** that makes spores by meiosis, and
    a haploid **gametophyte** that makes gametes by mitosis. Fertilization restores the diploid and the
    cycle turns. The trend across plant evolution is the shrinking of the gametophyte — dominant and free-living
    in mosses, a tiny few-celled passenger inside the flower in angiosperms.
  - The flower is an angiosperm sporophyte organ. Pollen (male gametophyte) lands on the stigma, grows
    a tube to the ovule, and double fertilization follows — one sperm fuses the egg (→ embryo), a second
    fuses polar nuclei (→ ==triploid endosperm==, the food supply). Seed plus ovary wall becomes fruit
    — a dispersal vehicle the animals of this chapter's second half help spread.
  check:
  - q: In flowering plants, endosperm is…
    options:
      A: Triploid food from a second fertilization
      B: Haploid food from the egg
      C: A spore
      D: The diploid embryo itself
    answer: A
    explain: Double fertilization — one sperm + egg (diploid embryo), one sperm + two polar nuclei (triploid
      endosperm).
    distractors:
      B: Wrong ploidy and wrong parentage.
      C: Spores are made by meiosis in the anther/ovule, not by fusion.
      D: The embryo is the other product of double fertilization.
  - q: Which generation makes spores, and by what process?
    options:
      D: The diploid sporophyte, by meiosis
      A: The haploid gametophyte, by meiosis
      B: The sporophyte, by mitosis
      C: The gametophyte, by fertilisation
    answer: D
    explain: Meiosis in the sporophyte halves the chromosome number and yields spores.
    distractors:
      A: The gametophyte makes gametes by mitosis, not spores by meiosis.
      B: Mitosis preserves ploidy; spores are haploid.
      C: Fertilisation restores diploidy; it does not make spores.
  figures:
  - src: the-world-of-plants-and-animals/hydra-budding.webp
    caption: Budding in hydra — asexual reproduction where the offspring detaches as a clone.
    credit: Fig 43.3 · OpenStax Biology 2e — CC BY-NC-SA 4.0
- heading: Animal body plans — the organizing decisions
  objectives:
  - Order the body-plan decisions — symmetry, germ layers, coelom.
  - Distinguish a true coelom from a pseudocoel by its lining.
  - Classify a phylum as protostome or deuterostome from its development.
  body:
  - Animal diversity is easier to learn as a chain of developmental decisions. **Symmetry** — radial (jellyfish,
    hydra) versus bilateral (everything that crawls or swims with a front end). **Germ layers** — diploblastic
    (two layers) versus ==triploblastic (ectoderm, mesoderm, endoderm)==. **Coelom** — the triploblasts
    split into acoelomates, pseudocoelomates, and true **coelomates** with a fluid-filled cavity lined
    entirely by mesoderm, the cushion that lets organs move and muscles work independently of the gut.
  - Two more forks finish the map — protostome versus deuterostome (the blastopore becomes mouth or anus
    respectively, with spiral versus radial cleavage), and segmentation (repeated body blocks, powerful
    because each segment can specialize).
  check:
  - q: A true coelom is best described as…
    options:
      A: The gut lumen
      B: Any body cavity
      C: The space inside a blastocoel
      D: A fluid cavity lined entirely by mesoderm
    answer: D
    explain: Complete mesoderm lining defines a TRUE coelom and distinguishes it from a pseudocoel.
    distractors:
      A: The gut is endoderm-derived and open to the outside.
      B: Pseudocoels and acoels are cavities too — the lining decides.
      C: The blastocoel is an early embryo space, not an adult cavity.
  - q: An animal is triploblastic with a body cavity only partly lined by mesoderm. It is…
    options:
      D: A pseudocoelomate
      A: An acoelomate
      B: A true coelomate
      C: A diploblast
    answer: D
    explain: A cavity present but not fully mesoderm-lined is the pseudocoel definition.
    distractors:
      A: Acoelomates have no cavity at all.
      B: True coeloms are lined entirely by mesoderm.
      C: Triploblastic means three germ layers by definition.
  figures:
  - src: the-world-of-plants-and-animals/fig-1116bfbf.webp
    caption: Features of the animal kingdom — a black bear beside preserved zoological specimens, the
      opening contrast of animal diversity.
    credit: Ch 27 · OpenStax Biology 2e — CC BY-NC-SA 4.0
- heading: The invertebrate hallmarks
  objectives:
  - Match each anchor phylum to its defining trait.
  - Explain why arthropods must molt in order to grow.
  - Relate flatworm body shape to its exchange strategy.
  body:
  - Do not memorize thirty phyla — anchor six. **Porifera** (sponges — no true tissues, filter feeding).
    **Cnidaria** (radial, cnidocyte stinging cells). **Platyhelminthes** (flatworms — flat because diffusion
    feeds them; no coelom). **Nematoda** (roundworms — pseudocoel, complete gut). **Annelida** (segmented
    worms — coelom as hydrostatic skeleton). **Arthropoda** — ==jointed appendages and an exoskeleton
    of chitin==, the most successful phylum by numbers, with molting as the price of armor. Mollusca (mantle,
    radula, muscular foot) completes the ecdysozoan/lophotrochozoan picture the MCAT occasionally probes.
  check:
  - q: An animal sheds its outer covering to grow. Which phylum?
    options:
      A: Chordata
      B: Porifera
      C: Arthropoda
      D: Annelida
    answer: C
    explain: A rigid chitin exoskeleton forces molting (ecdysis) at every growth step.
    distractors:
      A: Chordates grow continuously; no molting.
      B: Sponges have no exoskeleton to shed.
      D: Annelids grow within soft segments.
  - q: Why are flatworms flat?
    options:
      A: Flattening keeps every cell near the surface, since they lack a circulatory system
      B: Flatness creates the pseudocoel they need
      C: It is a leftover of their radial ancestry
      D: They flatten to escape predators
    answer: A
    explain: No circulatory system means exchange by diffusion, and diffusion demands a short distance.
    distractors:
      B: Flatworms are acoelomate — no cavity, flat or otherwise.
      C: Flatworms are bilaterally symmetric triploblasts.
      D: Nothing in their anatomy suggests a defensive origin.
- heading: Chordates and the amniotic revolution
  objectives:
  - List the four chordate trademarks and the stage at which each appears.
  - Explain how the amniotic egg freed reproduction from water.
  - Distinguish the three mammal groups by reproductive strategy.
  body:
  - Chordate trademarks at some life stage — **notochord**, dorsal hollow nerve cord, pharyngeal slits,
    post-anal tail. Vertebrates add the backbone; the vertebrate story runs jawless → cartilaginous →
    bony fish → amphibians (water-bound eggs) → reptiles and birds → mammals. The great divide — ==the
    amniotic egg==, with its extraembryonic membranes (amnion, chorion, yolk sac, allantois), freed reproduction
    from water and colonized dry land.
  - Mammals split three ways — monotremes (egg-laying), marsupials (pouched, brief placenta), and eutherians
    (long placenta, birth to relatively independent young). The placenta itself is a MCAT-friendly organ
    — maternal and fetal blood exchange materials WITHOUT mixing.
  check:
  - q: Which innovation most directly freed vertebrates from needing water to reproduce?
    options:
      A: The amniotic egg with extraembryonic membranes
      B: Gills
      C: The lateral line system
      D: The notochord
    answer: A
    explain: Amnion (bath), chorion (gas exchange), yolk sac (food), allantois (waste) package an aquatic
      nursery inside a shell or womb.
    distractors:
      B: Gills are the opposite — they bind you to water.
      C: That is a fish sensory system.
      D: The notochord is a support rod, present even in aquatic chordates.
  - q: Which extraembryonic membrane handles the embryo's nitrogenous waste?
    options:
      C: The allantois
      A: The amnion
      B: The chorion
      D: The yolk sac
    answer: C
    explain: The allantois stores waste; each of the four membranes has its own single job.
    distractors:
      A: The amnion is the fluid bath.
      B: The chorion handles gas exchange.
      D: The yolk sac carries the food supply.
examples:
- prompt: A student sectioned a stem and a root and must tell them apart in one field of view. Give the
    fastest discriminating features.
  strategy: 'Pick features that cannot appear in both organs: vascular bundle arrangement and the presence
    of root hairs versus a cuticle separate root from stem unambiguously. Anything both organs can show
    — chloroplasts, cellulose walls, the mere presence of phloem — is not a test.'
  solution:
  - Step 1 — xylem and phloem arrangement — roots keep vascular tissue in a central cylinder with xylem
    star; stems scatter bundles in a ring.
  - Step 2 — outer layer — roots carry root hairs and no cuticle; stems have cuticle and may carry trichomes.
  - Step 3 — ground tissue proportions — roots store (large cortex), stems support (more sclerenchyma
    near bundles).
  answer: Bundle arrangement plus root hairs versus cuticle separates root from stem in seconds.
  discussion: 'The principle is to choose a diagnostic that is exclusive rather than merely common, since
    a test both subjects can pass proves nothing. Note why the anatomy differs functionally: a root''s
    central cylinder with star-shaped xylem suits anchoring and uptake, while a stem''s ring of bundles
    resists bending. The same habit — one decisive trait over a list of shared ones — transfers directly
    to phylum identification.'
  distractors:
    A: Counting chloroplasts — both can lack or carry them depending on light; not decisive.
    B: Looking for phloem only — both organs have it; direction does not differ by organ.
    C: Checking cell walls — cellulose is everywhere in plants.
  practice:
    q: You must tell a monocot leaf from a dicot leaf in cross-section. Which single feature is decisive?
    options:
      A: Vein pattern — parallel veins indicate a monocot
      B: Presence of chloroplasts, which both possess
      C: Presence of a waxy cuticle, which both possess
      D: Presence of vascular tissue, which both possess
    answer: A
    explain: Venation is the one feature that differs reliably between the two groups.
    distractors:
      B: Both groups photosynthesise with chloroplasts.
      C: Both groups have a cuticle.
      D: Both groups have veins; only their arrangement differs.
key_points:
- Three plant tissue systems — dermal (boundary), ground (metabolism, support), vascular (xylem up, phloem
  both ways).
- Apical meristems lengthen; lateral meristems (cambia) thicken.
- Alternation of generations — sporophyte (2n, meiosis → spores) and gametophyte (n, mitosis → gametes);
  angiosperms shrink the gametophyte and double-fertilize.
- Animal body plan decisions — symmetry, germ layers, coelom type, protostome/deuterostome, segmentation.
- Arthropod success — jointed appendages + chitin exoskeleton; molting is the cost.
- Amniotic extraembryonic membranes (amnion, chorion, yolk, allantois) broke the water dependence.
mnemonics:
- phrase: Xylem Up, Phloem Flow
  means: Xylem carries water up from roots; phloem flows sugars to wherever sinks demand.
- phrase: Amnion = bath, Chorion = breath, Yolk = lunch, Allantois = trash
  means: The four extraembryonic membranes by function.
maps:
- title: Plant alternation of generations (angiosperm)
  steps:
  - sporophyte (2n, the plant you see) → meiosis → spores (n)
  - spores → mitosis → tiny gametophytes (pollen / embryo sac)
  - ==double fertilization== → diploid embryo + triploid endosperm
  - seed → new sporophyte (cycle turns)
- title: Animal body-plan decision tree
  steps:
  - tissues? no → sponges · yes → symmetry
  - radial → cnidarians · bilateral → germ layers
  - triploblast → coelom? none / pseudo / true
  - true coelom → blastopore fate — mouth (protostome) or ==anus (deuterostome)==
passage:
  text: A botanist grafts a ring of bark (phloem included) off a tree trunk in a complete circle, leaving
    xylem intact. Over weeks the bark above the ring swells, and roots below the ring show depleted sugar
    stores while leaves remain healthy and photosynthesizing.
  questions:
  - q: The swelling above the ring happens because…
    options:
      A: Water flow reverses direction
      B: The cambium dies immediately
      C: Xylem transport is blocked
      D: Phloem sugars from leaves cannot pass the girdle and accumulate above it
    answer: D
    explain: Removing the phloem ring blocks sugar translocation; the intact xylem keeps leaves supplied
      with water.
    distractors:
      A: Water direction is fixed by transpiration pull.
      B: Cambium damage matters for regrowth, not for sugar pile-up.
      C: Xylem is intact — leaves stay healthy for exactly that reason.
  - q: Predict the tree's fate over months.
    options:
      A: No effect at all
      B: Immediate death of the canopy
      C: Faster growth above the ring
      D: Gradual root starvation, since roots receive no new sugars
    answer: D
    explain: Roots are the sugar sinks below the block; starved roots fail to absorb, and the whole tree
      eventually declines.
    distractors:
      A: Complete girdling is a classic killing technique.
      B: Leaves have water and light; they persist for a long while.
      C: Swelling is accumulation, not growth.
  - q: Which process directly delivers the accumulating sugars to tissue above the ring?
    options:
      A: Pressure-flow loading into sieve tubes
      B: Active transport through xylem vessels
      C: Transpiration stream
      D: Root pressure
    answer: A
    explain: Phloem loading at sources builds pressure that pushes sap toward sinks through sieve tubes.
    distractors:
      B: Xylem vessels carry no sugar in normal plants.
      C: Transpiration moves water, not sugars.
      D: Root pressure pushes xylem water up at night, not sap.
pitfalls:
- Assigning phloem one direction — it runs source-to-sink, which flips seasonally.
- Treating the blastocoel or gut as a coelom — the mesoderm lining is the deciding trait.
- Forgetting ferns and mosses also alternate generations — it is a plant-wide cycle, not a flower-only
  one.
- Calling every shed an exoskeleton molt — only arthropods (and nematode relatives) ecdyse.
- Confusing notochord with backbone — one is a support rod, the other a vertebral column that mostly replaces
  it.
exam_map:
  NMAT: CEM items hit tissue names, xylem/phloem function, life-cycle terms, and phylum-characteristic
    matching — recall level with one-step application.
  MCAT: Plant transport and double fertilization appear inside 1B/2A-style passages; animal body plans
    usually serve 3B organ-system framing rather than standing alone.
