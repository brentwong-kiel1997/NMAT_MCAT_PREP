review_questions:
- q: Which vessel is the primary exchange site?
  options:
    A: Arteries
    B: Capillaries
    C: Veins
    D: Lymphatics
  answer: B
  explain: One-cell walls and maximal total area — everything crosses there.
  distractors:
    A: Thick-walled conduits.
    C: Low-pressure reservoirs.
    D: Return drainage, not the main exchange.
- q: Secretin is released when acidic chyme reaches the duodenum and stimulates…
  options:
    A: Gastric acid secretion
    B: Pancreatic bicarbonate release
    C: Bile salt synthesis only
    D: Colon water absorption
  answer: B
  explain: Acid in the duodenum → secretin → bicarbonate to neutralize — station-matched feedback.
  distractors:
    A: That is gastrin's role at the stomach.
    C: CCK handles bile release.
    D: Not a colon hormone.
- q: ADH acts mainly by…
  options:
    A: Increasing Na⁺ reabsorption
    B: Inserting water channels in the collecting duct
    C: Raising glomerular pressure
    D: Secreting K⁺
  answer: B
  explain: Aquaporin insertion makes the final tubule water-permeable — concentrated urine.
  distractors:
    A: Aldosterone's role.
    C: Not ADH's mechanism.
    D: Aldosterone again.
- q: A secondary immune response is stronger and faster because…
  options:
    A: Innate barriers thickened
    B: Memory B and T cells persist from the first encounter
    C: Complement doubled
    D: Antibodies never decay
  answer: B
  explain: Clones selected last time stand ready — vaccination's principle.
  distractors:
    A: Innate components do not learn.
    C: Complement is not amplified by memory.
    D: Titers do fall; memory cells do not.
