review_questions:
- q: Which event directly triggers neurotransmitter vesicle fusion?
  options:
    A: Myelin compression
    B: K⁺ efflux during repolarization
    C: Na⁺ influx at the axon hillock
    D: Ca²⁺ influx at the terminal
  answer: D
  explain: Voltage-gated calcium is the fusion signal.
  distractors:
    A: Not a mechanism.
    B: That ends the spike.
    C: That starts the spike upstream.
- q: Insulin differs from cortisol in that insulin…
  options:
    A: Enters cells and binds DNA
    B: Binds a surface receptor and acts via second messengers
    C: Is a steroid
    D: Acts only on the liver
  answer: B
  explain: Peptide hormone — membrane receptor, fast signaling.
  distractors:
    A: That is the steroid route.
    C: Insulin is a protein.
    D: Insulin acts on muscle, fat, and liver broadly.
- q: Saltatory conduction refers to…
  options:
    A: Continuous slow depolarization
    B: Action potentials jumping between nodes of Ranvier in myelinated axons
    C: Neurotransmitter diffusion
    D: Hormone pulsatility
  answer: B
  explain: Myelin forces regeneration at nodes — speed with energy economy.
  distractors:
    A: Contradicts 'saltatory'.
    C: Synaptic, not axonal.
    D: Endocrine concept.
- q: Oxytocin and ADH reach blood through the…
  options:
    A: Anterior pituitary
    B: Posterior pituitary (axons of hypothalamic neurons)
    C: Adrenal medulla
    D: Thyroid follicles
  answer: B
  explain: Made in hypothalamic nuclei, shipped down axons, released posteriorly.
  distractors:
    A: The anterior gland makes its own hormones under releasing- hormone control.
    C: Catecholamines live there.
    D: Thyroid hormones' home.
