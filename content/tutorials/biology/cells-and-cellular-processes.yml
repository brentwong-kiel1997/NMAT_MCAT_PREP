review_questions:
- q: Which pair correctly matches organelle to function?
  options:
    A: Golgi — lipid synthesis only
    B: Smooth ER — protein export folding
    C: Nucleolus — ATP production
    D: Lysosome — intracellular digestion in an acidic interior
  answer: D
  explain: Lysosomes are acid-filled digestion and recycling compartments.
  distractors:
    A: Lipid synthesis is smooth ER; the Golgi sorts and ships.
    B: Folding secretory proteins is ROUGH ER's job.
    C: The nucleolus assembles ribosomal subunits; ATP is mitochondrial.
- q: A cell in an isotonic solution is moved to a hypertonic one. Net water movement will be…
  options:
    A: Into the cell
    B: Out of the cell
    C: Zero in both solutions
    D: Into the cell only if transport is active
  answer: B
  explain: Hypertonic means higher outside solute, so water exits and the cell shrinks.
  distractors:
    A: That is the hypotonic outcome.
    C: Zero net flow defines isotonic — the new solution is not.
    D: Osmosis is passive; no ATP argument changes the direction.
- q: Cyanide blocks the final electron acceptor step of the mitochondrial chain. The FIRST process to
    slow is…
  options:
    A: Glycolysis in the cytosol
    B: The proton gradient's ability to drive ATP synthase
    C: Nuclear transcription
    D: Vesicle budding from the Golgi
  answer: B
  explain: With electrons unable to pass to oxygen, pumping stops, the gradient collapses, and ATP synthase
    stalls — glycolysis slows only secondarily as NAD⁺ runs out.
  distractors:
    A: Glycolysis keeps running (fermentation may follow) before feeling the NAD⁺ shortage.
    C: Transcription is downstream of energy failure, not the first casualty.
    D: Vesicle traffic needs ATP but is further removed than the gradient itself.
- q: A bacterium and a liver cell are compared. Which statement is true?
  options:
    A: Only the liver cell has ribosomes
    B: Only the liver cell keeps DNA in a membrane-bound nucleus
    C: Only the bacterium has a plasma membrane
    D: Both lack compartmentalization
  answer: B
  explain: The nuclear envelope is the eukaryotic signature; ribosomes and plasma membranes are universal.
  distractors:
    A: Ribosomes are in every cell — prokaryotes too.
    C: Every cell has a plasma membrane.
    D: The liver cell is compartmentalized; that IS its architecture.
