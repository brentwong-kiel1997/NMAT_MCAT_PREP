review_questions:
- q: The nervous system derives from…
  options:
    A: Mesoderm
    B: Ectoderm
    C: Endoderm
    D: Blastopore
  answer: B
  explain: Neural plate folds from dorsal ectoderm.
  distractors:
    A: Mesoderm makes muscle, bone, kidney, heart.
    C: Endoderm lines the gut and its glands.
    D: The blastopore is an opening, not a layer.
- q: Cells that can give rise to ANY cell including placenta are…
  options:
    A: Totipotent
    B: Pluripotent
    C: Multipotent
    D: Determined
  answer: A
  explain: Totipotency includes extraembryonic lineages; the zygote and early blastomeres have it.
  distractors:
    B: Pluripotent cells make all embryo tissues but not placenta.
    C: Multipotent cells cover one family, like blood lineages.
    D: Determined cells are locked, by definition.
- q: Webbed fingers result most directly from…
  options:
    A: Excess mitosis
    B: Failure of apoptosis between digits
    C: Extra Hox genes
    D: Failed cleavage
  answer: B
  explain: Interdigital cells must die on schedule; when they persist, webbing remains.
  distractors:
    A: Growth is not the issue — sculpting is.
    C: Hox patterning is upstream region identity, not webbing.
    D: Cleavage failure is early and lethal.
- q: A plant's lifelong production of new leaves depends on…
  options:
    A: Apoptosis of the root
    B: Continuous meristem activity
    C: Gastrulation each spring
    D: Germline mutations
  answer: B
  explain: Shoot apical meristem keeps generating organs — plants never fully commit their tips.
  distractors:
    A: Roots must live.
    C: Gastrulation is an animal stage.
    D: Mutations are not a growth program.
