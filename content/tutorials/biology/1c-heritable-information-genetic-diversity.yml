review_questions:
- q: Which repair system fixes a thymine dimer caused by UV light?
  options:
    A: Mismatch repair
    B: Nucleotide excision repair
    C: Ligase alone
    D: Okazaki processing
  answer: B
  explain: Bulky lesions are cut out as a patch and re-synthesized by the excision system.
  distractors:
    A: Mismatch repair fixes replication mispairing.
    C: Ligase seals nicks — it cannot remove damage.
    D: That is lagging-strand maturation.
- q: A mutation changes one codon from AAA to AAG, both coding lysine. This is…
  options:
    A: A missense mutation
    B: A silent mutation
    C: A nonsense mutation
    D: A frameshift
  answer: B
  explain: Degenerate code — same amino acid, no protein change.
  distractors:
    A: Missense CHANGES the amino acid.
    C: Nonsense creates a stop.
    D: No insertion/deletion occurred.
- q: In the lac operon, high lactose AND low glucose produce…
  options:
    A: Maximal transcription
    B: Repression
    C: Termination of translation
    D: CRP detachment from DNA
  answer: A
  explain: Lactose frees the repressor; low glucose raises cAMP, CAP binds, transcription runs high.
  distractors:
    B: Repression needs lactose ABSENT.
    C: Transcriptional control, not translational termination.
    D: Low glucose ATTACHES CAP (via cAMP).
- q: Klinefelter syndrome (XXY) most often arises by…
  options:
    A: A reciprocal translocation
    B: Nondisjunction of sex chromosomes
    C: A 3-bp deletion
    D: CRISPR off-target cutting
  answer: B
  explain: Extra sex chromosome from meiotic mis-segregation.
  distractors:
    A: Structural rearrangement, wrong scale.
    C: Sequence-level, wrong scale.
    D: Not a natural meiotic event.
