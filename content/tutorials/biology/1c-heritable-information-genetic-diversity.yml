subject: biology
chapter: 1C · Heritable information & genetic diversity
title: 1C · Heritable information & genetic diversity
overview: 'The transmission half of heredity: how information crosses generations and how processes
  generate, shuffle, and fix variation. Covers replication as inheritance, expression control, Mendelian
  patterns and pedigrees, aneuploidy, H-W population logic, and the read/write toolkit (PCR, CRISPR).
  The molecular machinery itself — polymerases, repair pathways, mutation signatures — lives in the
  biochemistry 1C chapter. Prerequisites — Genetics (meiosis, mutation), Cells (nucleus, ribosome).'
sections:
- heading: Replication — how information crosses generations
  body:
  - '==Semi-conservative replication — each old strand templates a new partner== — is how heritable
    information physically passes from cell to cell, and the Meselson–Stahl density experiment is the
    evidence. ==Fidelity matters here for a transmission reason: an error that survives replication
    becomes a heritable allele — the raw material the variation toolkit below works with==.'
  - ==The transmission sequence — replication copies the message in S phase, meiosis I segregates
    homologs, meiosis II separates sisters, fertilization restores diploidy==. Failures of that
    packaging, not of chemistry, produce the aneuploidies later in this chapter. (Polymerase mechanics
    and the repair stack are the biochemistry 1C chapter's territory.)
  check:
  - q: The Meselson–Stahl experiment showed that DNA replication is…
    options:
      A: Dispersive — parental and new DNA mix in pieces along each strand
      B: Random — some cells copy one way, some the other
      C: Conservative — the parental duplex stays whole and a new duplex is built
      D: Semi-conservative — every duplex carries one parental and one new strand
    answer: D
    explain: After one round the density label sat in hybrid duplexes — one heavy parental strand plus
      one light new strand.
    distractors:
      A: Dispersive copying gives a single intermediate density in every generation.
      B: One mechanism fit all the density data.
      C: That would leave the original duplex at full density.
      D: Correct.
  figures:
  - src: 1c-heritable-information-genetic-diversity/dna-double-helix.webp
    caption: Antiparallel strands, A-T (2 H-bonds) and G-C (3 H-bonds) pairing — the template logic of
      replication.
    credit: Fig 14.7 · OpenStax Biology 2e — CC BY-NC-SA 4.0
- heading: Expression — from gene to working protein
  body:
  - The central dogma runs ==DNA → (transcription) → RNA → (translation) → protein==, and the control
    points are where exams live. In prokaryotes, the **operon** clusters regulated genes — the lac operon's
    logic (repressor blocks unless lactose removes it; CAP boosts only when glucose is low) is a signal-integration
    circuit worth practicing on. Eukaryotes regulate at every step — chromatin openness, transcription
    factors, RNA processing (splicing, capping, poly-A), and translation itself.
  - The genetic code's properties are question bank staples — a **triplet** code, ==degenerate== (multiple
    codons per amino acid, which buffers silent mutations), nearly universal, with fixed start (AUG) and
    three stops. Transcription makes any gene's RNA; translation reads it in the ribosome with charged
    tRNAs delivering amino acids.
  check:
  - q: The degeneracy of the genetic code means…
    options:
      A: Codons overlap
      B: The code differs among organelles of one cell
      C: Every codon specifies a different amino acid
      D: Several codons can specify the same amino acid
    answer: D
    explain: Synonymous codons — the buffer that turns many point mutations silent.
    distractors:
      A: The code is non-overlapping.
      B: Mitochondrial code differences exist but are not the definition.
      C: That would be the opposite of degenerate.
- heading: The variation toolkit — sources and shufflers
  body:
  - Variation enters by three doors — **mutation** (new alleles, ultimate source, mostly neutral or harmful),
    ==recombination== (crossing over shuffles existing alleles into new combinations), and **assortment
    + fertilization** (randomized packaging and union). ==Recombination frequency is measurable — in a
    testcross, recombinant offspring over total gives map units, the distance between genes==. Add
    migration (gene flow) bringing alleles in, and drift sampling them at random, and you hold the full
    microevolution kit.
  - The Hardy-Weinberg equilibrium formalizes "no evolution" — allele frequencies p and q stay put when
    five conditions hold (no mutation, no selection, no drift [large population], no migration, random
    mating), giving ==p² + 2pq + q²==. Its exam use is as a NULL MODEL — real populations deviate, and
    the deviation tells you which force acts.
  check:
  - q: In a population at H-W equilibrium with q = 0.2, the frequency of heterozygotes is…
    options:
      A: '0.16'
      B: '0.64'
      C: '0.32'
      D: '0.04'
    answer: C
    explain: p = 0.8; 2pq = 2(0.8)(0.2) = 0.32.
    distractors:
      A: That is q(1−q), a common slip.
      B: That is p² — homozygous dominant.
      D: That is q² — homozygous recessive.
- heading: Inheritance patterns and pedigrees
  body:
  - '==Mendelian patterns — autosomal dominant (every generation, both sexes, father-to-son possible),
    autosomal recessive (skips generations, unaffected carriers), X-linked recessive (more males, no
    male-to-male), X-linked dominant (affected father passes to every daughter)==. Mitochondrial traits
    run mother-to-all-children; Y-linked run father-to-all-sons.'
  - '==Pedigree reading — squares are male, circles female, shading marks affected, a horizontal bar is
    a mating, a vertical line descent==. ==Exam items usually turn on exclusions: an affected child of
    unaffected parents rules out dominant, an affected daughter rules out X-linked recessive, father-to-son
    transmission rules out everything on the X==.'
  check:
  - q: A trait appears in every generation, each affected person has an affected parent, and affected
      fathers pass it equally to sons and daughters. The pattern is…
    options:
      A: Autosomal dominant
      B: Autosomal recessive
      C: X-linked recessive
      D: X-linked dominant
    answer: A
    explain: Vertical transmission plus male-to-male transfer requires an autosome — no X-linked mode can
      give father-to-son.
    distractors:
      A: Correct.
      B: Recessive traits skip generations.
      C: X-linked recessive skews male and never passes father to son.
      D: X-linked dominant gives an affected father affected daughters only.
- heading: Chromosomal variation — when the packages mis-segregate
  body:
  - Nondisjunction in meiosis I or II yields gametes with extra or missing chromosomes — after fertilization,
    ==aneuploidy==. Autosomal survivors are few — trisomy 21 (Down syndrome) the classic; sex-chromosome
    aneuploids tolerate better (Turner XO, Klinefelter XXY). Structural rearrangements complete the set
    — deletion, duplication, inversion, and reciprocal translocation, where balanced carriers are healthy
    but unbalanced gametes are not.
  - Detection technology closes the loop — karyotypes see chromosome-scale changes; amniocentesis/chorionic
    villus sampling sample fetal material; and modern screens read fetal DNA in maternal blood. A passage
    pairing "what test sees what scale of change" is standard MCAT furniture.
  check:
  - q: A phenotypically normal parent carries a balanced reciprocal translocation. The main reproductive
      risk is…
    options:
      A: Gametes may receive unbalanced chromosome sets
      B: Infertility is certain
      C: The parent will develop cancer
      D: All children will have Down syndrome
    answer: A
    explain: Segregation of translocated chromosomes can produce gametes with duplications and deletions
      — miscarriage or abnormal offspring.
    distractors:
      B: Fertility may be reduced but is not certainly absent.
      C: Not a somatic-disease mechanism.
      D: Trisomy 21 requires specific chromosome 21 mis-segregation.
- heading: Reading and writing DNA — the technology toolkit
  body:
  - PCR amplifies a chosen segment exponentially — denature, anneal primers, extend, repeat; ==each cycle
    roughly doubles the target==, so copy number is 2ⁿ. Gel electrophoresis separates fragments by size
    (small run fast); restriction enzymes cut at specific palindromes; and sequencing reads the order
    itself. Know what each tool OBSERVES — PCR sees presence/quantity, gels see length, sequencing sees
    identity.
  - CRISPR-Cas9 writes rather than reads — a guide RNA pairs with the target locus and Cas9 cuts; the
    cell's repair (often error-prone) disrupts the gene, or a supplied template edits it. Ethics passages
    aside, the exam logic is mechanical — ==guide RNA defines the address; repair defines the outcome==.
  check:
  - q: After 5 PCR cycles starting from one template molecule, the maximum number of target copies is
      closest to…
    options:
      A: '5'
      B: '10'
      C: '32'
      D: '25'
    answer: C
    explain: Doubling per cycle — 2⁵ = 32.
    distractors:
      A: Linear, not exponential, thinking.
      B: That is 2×5.
      D: That is 5² — the wrong exponent base.
  figures:
  - src: 1c-heritable-information-genetic-diversity/gel-electrophoresis.webp
    caption: Gel electrophoresis — fragments separate by size; the smallest run farthest.
    credit: Fig 14.9 · OpenStax Biology 2e — CC BY-NC-SA 4.0
  - src: 1c-heritable-information-genetic-diversity/xray-diffraction.webp
    caption: Photo 51 — Franklin's X-ray diffraction pattern that revealed the double helix.
    credit: Fig 14.6 · OpenStax Biology 2e — CC BY-NC-SA 4.0
examples:
- prompt: In family one, unaffected parents have an affected daughter and an unaffected son. In family
    two, an affected father passes the trait to his son. Classify the likeliest mode in each family and
    justify it with pedigree logic.
  solution:
  - Family one — an affected child of unaffected parents means both parents carry the allele silently.
  - An affected daughter rules out X-linked recessive — she would need a mutant X from an affected father.
  - Dominant modes need an affected parent in every case — so family one is autosomal recessive.
  - Family two — father-to-son transmission needs an autosome, so the likeliest mode is autosomal dominant.
  answer: Family one autosomal recessive (unaffected carrier parents); family two autosomal dominant
    (vertical transmission with male-to-male transfer).
  distractors:
    A: X-linked recessive — an affected daughter would require an affected father.
    B: X-linked dominant — fathers pass the X to daughters only, never to sons.
    C: Mitochondrial — mothers transmit to all children; paternal transmission does not occur.
key_points:
- Semi-conservative replication copies the genome before meiosis — the physical basis of heritable
  transmission.
- Prokaryotic operons integrate signals (lac — lactose on, glucose off); eukaryotes regulate at chromatin,
  transcription, processing, translation.
- Triplet, degenerate, near-universal code — AUG starts, three stops.
- Variation kit — mutation creates, recombination shuffles, assortment randomizes; H-W (p²+2pq+q²) is
  the no-evolution null.
- Recombination frequency (map units) — recombinant offspring over total in a testcross.
- Nondisjunction → aneuploidy; structural rearrangements balanced in carriers, unbalanced in gametes.
- Pedigree logic — vertical transmission = dominant, skipped generations = recessive, father-to-son =
  autosomal.
- Toolkit observables — PCR counts, gels size, sequencing reads, CRISPR edits.
mnemonics:
- phrase: Squares are sperm, circles are eggs
  means: Pedigree symbols — square male, circle female, shaded affected.
- phrase: p² + 2pq + q² — the population's ledger
  means: Homozygous dominant, heterozygote, homozygous recessive frequencies at one locus.
maps:
- title: Information flow and its controls
  steps:
  - DNA →(transcription)→ RNA →(translation)→ protein
  - controls — chromatin · transcription factors · splicing · translation
  - ==each arrow is a regulation point the exams probe==
- title: Variation sources
  steps:
  - mutation → NEW alleles (ultimate source)
  - recombination → new allele COMBINATIONS on one chromosome
  - assortment + fertilization → new genome-level mixes
  - selection / drift / migration → change allele FREQUENCIES
- title: Reading a pedigree
  steps:
  - vertical transmission, every generation — dominant
  - skips generations, unaffected carriers — recessive
  - more males, never father-to-son — X-linked recessive
  - affected father → every daughter — X-linked dominant
  - mother → all children — mitochondrial
passage:
  text: Cystic fibrosis is autosomal recessive and affects 1 in 2,500 newborns in a population. A student
    screens 1,000 unrelated adults with a sequencing panel and finds 20 carriers. The student then compares
    a nearby STR marker and notices carriers share marker haplotypes far more often than expected by chance.
  questions:
  - q: From the disease incidence alone, the EXPECTED carrier rate is closest to…
    options:
      A: 1/2500
      B: 1/100
      C: 1/25
      D: 1/50
    answer: C
    explain: q2 = 1/2500, so q = 0.02; 2pq = 2(0.98)(0.02) = 0.0392 — about 1 in 25 carriers.
    distractors:
      A: Twenty-fold too low.
      B: Two-fold too high.
      D: That is q, the allele frequency — carriers are 2pq.
  - q: The observed 20/1000 differs from the expectation. The most likely statistical explanation is…
    options:
      A: The trait is dominant
      B: Mutation hotspots raised the rate
      C: The H-W model never applies
      D: Sampling variation around a small expected count
    answer: D
    explain: Expected carriers ≈ 40 (2pq ≈ 1/25 of 1,000); observing 20 sits within sampling variation
      for a count this size — check confidence intervals before any biological claim.
    distractors:
      A: Dominance contradicts the given inheritance.
      B: Possible but not first-line.
      C: H-W is a null model — it applies as a baseline.
  - q: The shared marker haplotypes among carriers suggest…
    options:
      A: Independent origins of every carrier allele
      B: A founder effect — many carriers descend from one ancestral mutation
      C: High mutation rate at the STR
      D: Random mating is violated
    answer: B
    explain: Haplotype sharing around an allele is the signature of common descent from one origin (founder
      mutation).
    distractors:
      A: Independent origins would scramble haplotypes.
      C: STR mutation would break, not build, sharing.
      D: Mating pattern is not what haplotypes show.
pitfalls:
- Confusing mutation (creates alleles) with recombination (shuffles them) — the toolkit's most common
  mix-up.
- Reading H-W as a law of nature — it is the null; deviations are the data.
- Naming a mode before excluding others — check whether every affected person has an affected parent.
- Expecting karyotypes to show point mutations — scale must match tool.
- Forgetting PCR's exponential arithmetic — n cycles, 2ⁿ copies.
exam_map:
  NMAT: Intro-depth transmission vocabulary — pedigree symbols, aneuploidy examples, and one-step H-W
    algebra.
  MCAT: Content Category 1C builds passages on pedigree-plus-H-W calculation, inheritance patterns,
    aneuploidy mechanisms, and PCR/CRISPR experiment interpretation. Mutation typing and repair pathways
    sit in the biochemistry 1C chapter.
