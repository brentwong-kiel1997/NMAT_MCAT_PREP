review_questions:
- q: In the lac operon, high lactose AND low glucose produce…
  options:
    A: Maximal transcription
    B: Repression
    C: Termination of translation
    D: CRP detachment from DNA
  answer: A
  explain: Lactose frees the repressor; low glucose raises cAMP, CAP binds, transcription runs high.
  distractors:
    B: Repression needs lactose ABSENT.
    C: Transcriptional control, not translational termination.
    D: Low glucose ATTACHES CAP (via cAMP).
- q: Klinefelter syndrome (XXY) most often arises by…
  options:
    A: A reciprocal translocation
    B: Nondisjunction of sex chromosomes
    C: A 3-bp deletion
    D: CRISPR off-target cutting
  answer: B
  explain: Extra sex chromosome from meiotic mis-segregation.
  distractors:
    A: Structural rearrangement, wrong scale.
    C: Sequence-level, wrong scale.
    D: Not a natural meiotic event.
- q: An F1 dihybrid is testcrossed and yields 18 recombinant offspring out of 100 progeny. The map distance
    between the two genes is…
  options:
    A: 36 map units
    B: 18 map units
    C: 82 map units
    D: 9 map units
  answer: B
  explain: Recombination frequency = recombinants / total = 18/100 = 18% = 18 map units.
  distractors:
    A: That doubles the recombinant count.
    C: That is the parental share, not the recombinant classes.
    D: That halves the recombinant count.
- q: Which single pedigree observation rules out X-linked recessive inheritance?
  options:
    A: An affected daughter whose father is unaffected
    B: More affected males than females
    C: Unaffected mothers who are carriers
    D: An affected mother transmitting to a son
  answer: A
  explain: An X-linked recessive daughter needs a mutant X from each parent, so her father would have
    to be affected.
  distractors:
    A: Correct.
    B: That supports X-linked recessive.
    C: Carrier mothers are expected in X-linked recessive traits.
    D: Affected mothers pass the mutant X to sons and daughters alike.
