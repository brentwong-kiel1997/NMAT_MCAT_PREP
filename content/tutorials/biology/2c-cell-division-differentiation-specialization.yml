review_questions:
- q: MPF (maturation promoting factor) is composed of…
  options:
    A: Cyclin B + CDK1
    B: p53 + Rb
    C: E2F + cyclin D
    D: Caspase + Fas
  answer: A
  explain: The classic G2/M driver — cyclin B with CDK1.
  distractors:
    B: Both are brake proteins.
    C: E2F pairs with Rb, not cyclin D.
    D: Apoptosis machinery.
- q: A mutation causing continuous E2F activity without growth signal most directly disables…
  options:
    A: p53
    B: The Rb brake on S-phase entry
    C: The spindle checkpoint
    D: Apoptosis
  answer: B
  explain: Rb normally sequesters E2F; losing it frees S phase constitutively.
  distractors:
    A: p53 governs damage response.
    C: Spindle checkpoint monitors attachment.
    D: Not the E2F axis.
- q: DNA laddering and membrane blebbing indicate…
  options:
    A: Necrosis
    B: Apoptosis
    C: Mitosis
    D: Transformation
  answer: B
  explain: Oligonucleosomal laddering is caspase-activated nuclease work — apoptotic.
  distractors:
    A: Necrosis smears DNA randomly.
    C: Division, not death.
    D: Oncogenic change, not death morphology.
- q: A pluripotent cell differs from a multipotent one by…
  options:
    A: Being less versatile
    B: Able to form all embryonic lineages, not just one family
    C: Lacking a nucleus
    D: Being cancer by definition
  answer: B
  explain: Potency ladder breadth — embryonic-wide versus lineage-restricted.
  distractors:
    A: Reverse.
    C: All these cells are nucleated.
    D: Pluripotency is not malignancy.
