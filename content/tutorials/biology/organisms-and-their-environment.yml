subject: biology
chapter: Organisms and Their Environment
title: Organisms and Their Environment
overview: Ecology scales biology from the organism outward — population, community, ecosystem, biosphere
  — and supplies the energy-flow and cycle logic the MCAT loves to wrap in data. NMAT keeps to vocabulary
  and simple pyramids; the MCAT runs growth curves, interaction tables, and nutrient-cycle isotope tricks.
  Prerequisites — Unity and Diversity (niches, adaptation), Life Processes (regulation).
sections:
- heading: Populations — growth models that explain the curves
  objectives:
  - Distinguish exponential from logistic growth by their graphical landmarks.
  - Predict where growth peaks on a logistic curve.
  - Match a life-history strategy to its survivorship pattern.
  body:
  - A population grows exponentially whenever per-capita growth stays positive — the ==J-curve==. Real
    environments impose limits — food, space, waste — producing the ==logistic S-curve== that decelerates
    toward a **carrying capacity (K)**. Read any growth graph by three landmarks — the exponential knee,
    the inflection where braking begins, and the plateau at K.
  - Life-history strategy follows the regime — **r-selected** species (many small offspring, little care,
    boom-bust — insects, weeds) fit uncrowded, chance openings; **K-selected** species (few offspring,
    heavy investment, strong competition — large mammals) fit saturated habitats. Survivorship curves
    complete the picture — Type I (die old, humans), Type II (constant risk, some birds), Type III (mass
    juvenile death, most fish and plants).
  misconception: '"Maximum sustainable yield means keeping the fish population at carrying capacity —
    the most fish means the most harvest." At K, net growth is zero, so any harvest pushes the population
    below its replacement rate. Growth peaks at the logistic inflection, K/2, where resources are still
    ample and numbers already compound — that is where the largest sustainable yield lives.'
  connection: 'The logistic curve is exponential growth meeting a limit, and both are the mathematics
    of chapter 1B''s replication arithmetic applied to populations: compounding whenever the per-capita
    rate stays positive, braking as density-dependent factors bite. The same curve shapes PCR amplification,
    bacterial growth, and epidemic spread.'
  connection_label: How sciences interconnect
  check:
  - q: A population at logistic inflection is…
    options:
      A: Growing fastest
      B: At carrying capacity
      C: Shrinking
      D: Extinct locally
    answer: A
    explain: At half of K, growth peaks — resources still ample, numbers already compounding.
    distractors:
      B: At K, growth is zero.
      C: Decline requires negative net growth.
      D: No — it is thriving.
  - q: A fishery is managed for maximum sustainable yield. At what population density should it be held?
    options:
      D: About half the carrying capacity, where growth is fastest
      A: At the carrying capacity, where the population is largest
      B: As low as possible, to maximise per-capita growth
      C: Above the carrying capacity, so the surplus can be harvested
    answer: D
    explain: Growth peaks at the logistic inflection, K/2 — the largest sustainable harvest comes from
      there.
    distractors:
      A: At K net growth is zero, so any harvest shrinks the population.
      B: Very small populations grow slowly and risk collapse.
      C: Above K the population is already declining.
- heading: Interactions — who does what to whom
  objectives:
  - Classify an interaction from its effect on each participant.
  - Explain the competitive exclusion principle and its possible outcomes.
  - Identify a keystone species by its disproportionate structural role.
  body:
  - Community interactions reduce to a payoff matrix. **Competition** (−/−) — two species share a limiting
    resource; the ==competitive exclusion principle== says full overlap is unstable — one wins, or **natural
    selection forces niche partitioning** (character displacement — Galápagos finch beaks). **Predation**
    (+/−) drives adaptation cycles in both parties. **Parasitism** is predation in slow motion. **Mutualism**
    (+/+) and **commensalism** (+/0) complete the sign table — identify the signs and the interaction
    names itself.
  - The ==keystone species== holds community structure out of proportion to their number — remove the
    sea star Pisaster and mussels overrun the tide pool. **Invasive species** are the pathology case —
    released from their co-evolved enemies, they competitively exclude natives.
  misconception: '"Competition always ends with one species driving the other extinct — that is what competitive
    exclusion means." Exclusion is one possible outcome, and only when niches fully overlap. The equally
    common resolution is niche partitioning — natural selection shifts one species onto a different resource
    or zone, as with the barnacles that split a rock face into wet and dry bands. Coexistence through
    division, not necessarily a loser.'
  connection: 'Keystone species are why counting heads misjudges importance: removing the sea star Pisaster
    from a tide pool lets mussels overrun it and collapse the diversity, though the star was numerically
    rare. Conservation targets keystones precisely because community structure hangs on them out of proportion
    to abundance.'
  connection_label: Real-world connection
  check:
  - q: Two barnacle species overlap; one shifts to a drier zone. This is…
    options:
      A: Mutualism
      B: Predation
      C: Competitive exclusion
      D: Niche partitioning after competition
    answer: D
    explain: The shift allows coexistence — classic partitioning (the real Balanus/Chthamalus result).
    distractors:
      A: No benefit flows both ways.
      B: Nobody is eaten.
      C: Exclusion is the OUTCOME when partitioning fails.
  - q: Barnacles and mussels crowd the same rock face; when researchers remove the barnacles, mussels
      expand. The interaction is…
    options:
      C: Competition — each species depresses the other's numbers
      A: Mutualism, since both benefit from the removal
      B: Commensalism, since only mussels gained
      D: Predation, since one consumes the other
    answer: C
    explain: A shared limiting resource with reciprocal harm is the definition of competition.
    distractors:
      A: The interaction being studied is between the two species, and it harms both.
      B: Commensalism requires a +/0 pairing, not a −/− one.
      D: Neither species eats the other; they crowd it.
- heading: Communities — succession and structure
  objectives:
  - Distinguish primary from secondary succession by starting conditions.
  - Order the stages of a successional sequence.
  - Describe richness and evenness as the two axes of diversity.
  body:
  - After a disturbance, structure reassembles. **Primary succession** starts on bare rock (pioneer lichens
    → soil → grasses → shrubs → forest); **secondary succession** starts where soil survives (after fire
    or flood) and moves faster. The classical endpoint — a stable **climax community** — is now treated
    more honestly as a shifting mosaic, since disturbance never stops for long.
  - Diversity has two axes — richness (how many species) and evenness (how evenly numbers spread). A community
    of ten equally common species is more diverse than ten individuals of one plus stragglers; both axes
    appear in MCAT index questions (Shannon-style setups).
  misconception: '"After a fire, the area starts over from bare rock — primary succession, from scratch."
    A fire leaves the soil intact, along with seed banks and surviving roots, which is exactly what defines
    SECONDARY succession and makes it fast. Primary succession — bare rock, no soil, lichens first — is
    reserved for lava flows, glacial scrapings, and newly exposed surfaces where soil must be built from
    nothing.'
  connection: 'Richness and evenness as the two axes of diversity mirror the distinction between counting
    and weighing: two communities with the same species list can differ enormously if one is dominated
    by a single abundant species. The same paired-axis logic appears in any index calculation the MCAT
    builds around Shannon-style setups.'
  connection_label: How sciences interconnect
  check:
  - q: Lava creates new land; the first colonizers are most likely…
    options:
      A: Climax forest species
      B: Tall trees
      C: Large grazing mammals
      D: Pioneer lichens and microbes that make soil
    answer: D
    explain: Primary succession begins with soil-makers that tolerate bareness.
    distractors:
      A: Climax arrives last.
      B: Trees need the soil the pioneers build.
      C: Grazers need forage first.
  - q: After a forest fire, grasses and shrubs regrow from surviving soil and seed banks. This is…
    options:
      C: Secondary succession — soil and propagules survived
      A: Primary succession, which begins on bare rock
      B: No succession, since the forest was destroyed
      D: Immediate arrival at a climax community
    answer: C
    explain: The soil head start is exactly what defines secondary succession and makes it fast.
    distractors:
      A: Primary succession has to build soil from nothing.
      B: Disturbance is what starts succession, not what prevents it.
      D: A climax community takes many stages to assemble.
- heading: Ecosystems — energy flows, one-way
  objectives:
  - Explain why energy flows one way while matter cycles.
  - Apply the 10% rule to estimate the producer mass behind a consumer.
  - Predict which pyramids can invert and why others cannot.
  body:
  - The master sentence of ecology — ==energy flows; matter cycles==. Producers fix sunlight (or chemicals);
    each transfer up the trophic ladder loses roughly 90% to heat and respiration, so ==about 10% makes
    the jump== from one level to the next. That arithmetic explains pyramids of energy (always upright),
    biomass (usually), and numbers (sometimes inverted — one tree, many insects).
  - Follow the food chain upward and the numbers shrink — 10,000 kg phytoplankton → 1,000 kg zooplankton
    → 100 kg fish → 10 kg secondary-fish → 1 kg of top-predator growth. Any passage asking "how much base
    supports X kg of top predator" is testing powers of ten, nothing more.
  misconception: '"Energy cycles through the ecosystem like water and carbon do." Energy flows one way
    and leaks at every step — roughly 90 percent is lost to heat and respiration at each transfer, which
    is why food chains are short and pyramids of energy are always upright. Matter is what cycles: carbon,
    nitrogen, and water are reused indefinitely. Two different behaviours, one sentence each.'
  connection: 'The 10 percent rule is thermodynamics made ecological: the second law of chapter Thermodynamics
    guarantees that no transfer is complete, so each trophic step wastes most of what it takes in. The
    10,000 kg of phytoplankton behind 1 kg of top predator is the same energy bookkeeping as an engine''s
    efficiency ceiling.'
  connection_label: How sciences interconnect
  check:
  - q: How much producer biomass is needed to add 5 kg of a third-level carnivore's mass (three transfers
      above producers)?
    options:
      A: 50 kg
      B: 500 kg
      C: 5,000 kg
      D: 50,000 kg
    answer: C
    explain: Three transfers at 10% each — 5 × 10³ = 5,000 kg of producers.
    distractors:
      A: That assumes ONE 10% transfer.
      B: Two transfers.
      D: Four transfers, one too many.
  - q: 2,000 kg of producers support how much tertiary-consumer biomass across three transfers?
    options:
      D: 2 kg
      A: 20 kg
      B: 200 kg
      C: 20,000 kg
    answer: D
    explain: 'Three 10% transfers: 2000 to 200 to 20 to 2 kg.'
    distractors:
      A: That is two transfers, not three.
      B: That is one transfer, not three.
      C: That reverses the direction of the flow.
  figures:
  - src: organisms-and-their-environment/food-chain.webp
    caption: Trophic levels in a Lake Ontario food chain — from green algae to Chinook salmon.
    credit: Fig 46.4 · OpenStax Biology 2e — CC BY-NC-SA 4.0
  - src: organisms-and-their-environment/energy-pyramid.webp
