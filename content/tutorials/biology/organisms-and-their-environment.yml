- heading: Biogeochemical cycles — carbon and nitrogen
  objectives:
  - Trace carbon through the fast biological loop and the slow geological one.
  - Identify which organisms carry out each step of the nitrogen cycle.
  - Predict how fossil-fuel combustion alters the carbon cycle.
  body:
  - The ==Carbon== moves fast through the living loop (photosynthesis    fixes CO₂; respiration and decomposition
    return it) and slowly through the rock pool; the modern imbalance — fossil-carbon burned into the
    fast loop — is the engine of climate change. Any cycle diagram question — follow the arrows, note
    where photosynthesis draws down and combustion adds.
  - The ==Nitrogen== is the bacteria chapter in disguise — ==nitrogen    fixation (N₂ → usable), nitrification,
    denitrification== run by prokaryotes at every step; plants absorb nitrate/ammonium, animals eat plants,
    decomposers return ammonium. Legumes' root-nodule mutualists are the classic fixation example. Water
    cycles by evaporation-transpiration-condensation-precipitation, with the ocean as reservoir and land
    as throughput.
  misconception: '"Plants fix nitrogen from the air — that is what fertiliser-free farming relies on."
    Plants cannot split N2 at all; only certain prokaryotes carry nitrogenase. Legumes get their nitrogen
    from symbiotic bacteria in root nodules, and every other organism inherits already-fixed nitrogen
    downstream. Crop rotation with legumes borrows that mutualism, not a plant ability.'
  connection: 'The nitrogen cycle is the prokaryote chapter run as chemistry: fixation, nitrification,
    and denitrification are each performed by specific bacteria with specific enzymes, which is why the
    cycle stops without them. Carbon''s fast biological loop — photosynthesis drawing down, respiration
    returning — is the same metabolism covered in the energy chapters.'
  connection_label: How sciences interconnect
  check:
  - q: The conversion of atmospheric N₂ into biologically usable forms is performed by…
    options:
      A: Animals
      B: Plants directly
      C: Fungi alone
      D: Nitrogen-fixing bacteria (free-living or in legume nodules)
    answer: D
    explain: Only certain prokaryotes carry nitrogenase — every other organism inherits fixed nitrogen
      downstream.
    distractors:
      A: Animals neither fix nor absorb N₂ directly.
      B: Plants absorb but cannot split N₂.
      C: Fungi decompose, they do not fix N₂.
  - q: A farmer rotates a legume crop into a field. What does the legume add, and how?
    options:
      B: Usable nitrogen, fixed by bacteria in its root nodules
      A: Nitrate absorbed directly from the atmosphere by the plant
      C: Denitrified nitrogen returned to the air
      D: Phosphorus supplied by mycorrhizal fungi
    answer: B
    explain: Symbiotic nitrogen fixers convert N2 into ammonium the soil can use.
    distractors:
      A: Plants cannot split N2; they need it already fixed.
      C: Denitrification removes nitrogen from the soil — the opposite of the goal.
      D: Mycorrhizae trade phosphorus, not nitrogen.
examples:
- prompt: A wildlife reserve's wolf population is removed. Over a decade, elk numbers triple, young willows
    and aspens vanish, beavers decline, and songbird diversity drops. Name the mechanism and predict the
    outcome of wolf reintroduction.
  strategy: 'Read the chain in trophic order before naming the mechanism: predator lost, herbivore released,
    producers suppressed, then the species depending on that vegetation decline. Trace each effect one
    level at a time so the cascade is explicit rather than asserted.'
  solution:
  - Step 1 — wolves are a predator limiting elk — removal is a top-down cascade (trophic cascade).
  - Step 2 — elk over-browse riparian vegetation — producers are suppressed, habitat engineers (beavers)
    lose material.
  - Step 3 — bird diversity depends on the vegetation structure the beavers create — the cascade reaches
    the songbirds.
  - Step 4 — reintroduction reverses the chain — elk behavior and numbers fall, willows recover, beavers
    and birds return (the Yellowstone pattern).
  answer: Keystone-predator removal triggered a trophic cascade; reintroduction rebuilds it bottom-up
    from the plants.
  discussion: 'The diagnostic feature is direction — removing a top predator pushes effects DOWNWARD through
    the levels, which distinguishes a trophic cascade from bottom-up failure, where a producer loss pushes
    upward. Note also that the mechanism is partly behavioural: elk browse less daringly where wolves
    hunt, so reintroduction helps even before numbers fall. This is the Yellowstone pattern, and it is
    the cleanest demonstration of a keystone predator holding structure disproportionate to its abundance.'
  distractors:
    A: Blaming climate alone — the timing and trophic specificity point at predator loss.
    B: Calling elk invasive — they are native; the predator, not the prey, was removed.
    C: Mutualism collapse — the interactions lost were predation and habitat engineering.
  practice:
    q: Sea otters decline along a kelp coast; sea urchin numbers explode and the kelp forest is grazed
      to bare rock. What is the mechanism?
    options:
      A: A trophic cascade — losing the urchin predator released the grazer and collapsed the kelp
      B: Bottom-up failure, since the kelp vanished first
      C: Mutualism between urchins and kelp
      D: Competitive exclusion of urchins by kelp
    answer: A
    explain: A top predator's loss releases its prey, which then strips the producer — effects running
      downward.
    distractors:
      B: The kelp did not vanish first; it collapsed after the urchins rose.
      C: The urchin eats the kelp — that is predation, not mutual benefit.
      D: Kelp cannot exclude an animal that eats it.
key_points:
- Exponential J-curve versus logistic S-curve; growth peaks at K/2, stops at K.
- r-strategist versus K-strategist; survivorship Types I/II/III.
- Interaction sign table — competition −/−, predation +/−, mutualism +/+, commensalism +/0.
- Competitive exclusion forces niche partitioning; keystones hold structure disproportionate to numbers.
- Energy flows one-way with ~10% per transfer; matter cycles.
- Carbon's fast (living) versus slow (rock) loop; nitrogen's bacterial steps — fixation, nitrification,
  denitrification.
mnemonics:
- phrase: 10-10-10 up the chain
  means: Roughly a tenth of energy survives each trophic transfer — pyramids are arithmetic.
- phrase: Fix, Nitrify, Denitrify — all bacteria
  means: The nitrogen cycle's engine room is prokaryotic.
maps:
- title: Trophic energy flow
  steps:
  - producers fix sunlight → 10,000 kg
  - primary consumers → ==1,000 kg== (10%)
  - secondary → 100 kg · tertiary → ==10 kg==
  - heat exits at every arrow (energy does NOT cycle)
- title: Nitrogen cycle
  steps:
  - N₂ in air → ==fixing bacteria== → NH₃/NH₄⁺
  - nitrifying bacteria → NO₃⁻ (plants absorb)
  - consumers → decomposition → NH₄⁺ returns
  - denitrifying bacteria → N₂ back to air
passage:
  text: An island's rabbit population is introduced without predators. For six years the population follows
    a steepening curve; in year seven it crashes, recovering to a lower plateau that then oscillates mildly.
    Vegetation cover, measured by satellite, declines with a lag behind rabbit peaks and recovers after
    each crash. A competitor hare species introduced earlier remains at low, steady numbers throughout.
  questions:
  - q: The year-seven crash is most consistent with…
    options:
      A: Overshoot of carrying capacity followed by resource collapse
      B: A trophic cascade
      C: Competitive exclusion of the hares
      D: Improved food supply
    answer: A
    explain: The lagging vegetation decline shows resource depletion after overshoot — the classic boom-bust
      of an unrestrained herbivore.
    distractors:
      B: No predator exists to trigger a cascade.
      C: The hare data show stable coexistence, not exclusion.
      D: Contradicts a crash.
  - q: The lag between rabbit peaks and vegetation decline shows that…
    options:
      A: Rabbits do not eat plants
      B: The satellite data are wrong
      C: Resource response integrates over time — depletion and recovery trail the consumer
      D: Vegetation drives rabbit numbers instantly
    answer: C
    explain: Plant biomass responds cumulatively to grazing pressure — effect trails cause.
    distractors:
      A: They obviously do.
      B: Trust the data given.
      D: Instant response contradicts the lag.
  - q: The hare's low steady numbers despite rabbit boom-bust suggest…
    options:
      A: The hare is the better competitor
      B: Niche partitioning — the hare persists on resources the rabbit boom does not deplete
      C: Hares are carnivores
      D: Hares migrate seasonally
    answer: B
    explain: Stable coexistence at low density indicates the species divide the resource base.
    distractors:
      A: Better competitors would rise, not hold low.
      C: Hares are herbivores.
      D: No migration is described.
pitfalls:
- Reading energy pyramids as matter pyramids — energy never cycles; nutrients do.
- Placing maximum growth at K — it is at K/2 (inflection).
- Assigning nitrogen fixation to plants — only prokaryotes fix N₂.
- Treating keystone species as the most numerous — they are the most structurally load-bearing.
- Forgetting succession needs a disturbance-free window — climax is a mosaic, not a statue.
exam_map:
  NMAT: Vocabulary and pyramid logic dominate — interaction definitions, r/K matching, succession stages,
    and 10% arithmetic at one-step level.
  MCAT: Foundational Concept 4 passages run growth-curve interpretation, interaction tables, diversity
    indices, isotope-labeled cycle tracing, and cascade scenarios from data.
