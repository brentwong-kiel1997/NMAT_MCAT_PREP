review_questions:
- q: A pyramid of ENERGY is always upright because…
  options:
    A: Producers are always numerous
    B: Each transfer dissipates ~90% as heat
    C: Consumers are larger
    D: Matter cycles
  answer: B
  explain: The Second Law taxes every arrow — less energy remains available at each level.
  distractors:
    A: Numbers pyramids can invert (one tree, many insects).
    C: Size does not set energy availability.
    D: Matter cycling says nothing about one-way energy.
- q: Two species cannot stably occupy the exact same niche — this is the…
  options:
    A: Competitive exclusion principle
    B: Carrying capacity law
    C: 10% rule
    D: Allee effect
  answer: A
  explain: Gause's principle — complete overlap ends in exclusion or evolutionary divergence.
  distractors:
    B: K is a population-growth concept.
    C: Energy-transfer arithmetic.
    D: A low-density growth effect.
- q: Which process returns nitrogen to the atmosphere?
  options:
    A: Nitrification
    B: Nitrogen fixation
    C: Denitrification
    D: Assimilation
  answer: C
  explain: Denitrifiers reduce nitrate back to N₂ gas.
  distractors:
    A: Nitrification makes nitrate from ammonium.
    B: Fixation brings N₂ IN.
    D: Assimilation builds biomass.
- q: Secondary succession differs from primary by starting…
  options:
    A: On bare rock with no soil
    B: Where soil and often seeds survive a disturbance
    C: In the ocean
    D: With a climax forest
  answer: B
  explain: The soil head-start is why fields-to-forest runs decades, not centuries.
  distractors:
    A: That is primary.
    C: Habitat irrelevant.
    D: Climax is the END.
