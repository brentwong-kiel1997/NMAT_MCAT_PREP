review_questions:
- q: Which is a NORMAL positive-feedback process?
  options:
    A: Oxytocin cascade during labor
    B: Insulin release after glucose load
    C: Blood glucose recovery while fasting
    D: Thermoregulation in cold water
  answer: A
  explain: Contractions stretch the cervix, more oxytocin, stronger contractions — amplification to a
    self-ending climax.
  distractors:
    B: Insulin removes its own stimulus — negative feedback.
    C: Glucagon corrects a fall — negative feedback.
    D: Shivering and vasoconstriction correct — negative feedback.
- q: Uric acid as nitrogen waste indicates an animal that most likely…
  options:
    A: Lives in fresh water
    B: Must conserve water (birds, reptiles, insects)
    C: Has constant access to seawater
    D: Is a deep-sea fish
  answer: B
  explain: Uric acid's near-solid paste excretion costs almost no water.
  distractors:
    A: Freshwater dwellers excrete dilute ammonia.
    C: Marine bony fish excrete ammonia/urea with salt pumping.
    D: Aquatic ammonia again.
- q: In type 2 diabetes the primary defect is…
  options:
    A: Beta cells are destroyed
    B: Target tissues respond poorly to insulin
    C: Glucagon is absent
    D: Alpha cells make insulin
  answer: B
  explain: Insulin resistance — hormone present, response blunted.
  distractors:
    A: That is type 1.
    C: Glucagon is typically normal or high.
    D: Cell identities do not swap.
- q: Skin blood flow rising during rewarming functions to…
  options:
    A: Conserve core heat
    B: Dump heat at the surface as the variable nears set point
    C: Raise blood pressure
    D: Reduce sensor sensitivity
  answer: B
  explain: Vasodilation delivers heat to the surface for loss — the anti-disturbance arm switching on.
  distractors:
    A: Conservation is vasoconstriction's job.
    C: Widespread dilation if anything lowers resistance.
    D: Unrelated mechanism.
