subject: biology
chapter: 2B · Prokaryotes and viruses
title: 2B · Prokaryotes and viruses
overview: Prokaryotes and viruses run the planet's small end and supply the MCAT's favorite experimental
  systems — gene transfer, operon logic, and lytic life cycles. NMAT meets the same content as intro microbiology
  vocabulary. Prerequisites — Cells (architectures), Genetics (expression basics), 1C (operon detail).
sections:
- heading: The prokaryotic body — small, fast, layered in armor
  objectives:
  - Diagram the prokaryotic envelope and name each layer.
  - Predict the Gram stain outcome from wall architecture.
  - Relate lipopolysaccharide to Gram-negative sepsis.
  body:
  - The prokaryotic plan — nucleoid (no envelope), ribosomes, plasmids, and a cell envelope built as ==inner
    membrane + peptidoglycan wall (+ outer membrane in Gram-negatives)==. The Gram stain rides on that
    architecture — thick peptidoglycan holds crystal violet (**Gram-positive**, purple); the thin wall
    plus outer membrane loses it and takes the counterstain (**Gram-negative**, pink). The outer membrane's
    lipopolysaccharide is an endotoxin — Gram-negative sepsis is a wall-chemistry disease.
  - Beyond the wall — capsule (immune evasion), pili (adhesion and conjugation), flagella (rotation-driven
    motility), and endospores (survival capsules that laugh at boiling). ==Fast division (~20 minutes
    in rich media)== is a feature, not a bug — it is why resistance evolves in weeks and why cultures
    saturate overnight.
  misconception: '"The Gram stain tells you what colour a bacterium is — pink or purple is just how they
    look." The colour reports wall architecture. A thick peptidoglycan layer traps crystal violet (Gram-positive,
    purple); a thin wall under an outer membrane lets it wash out and take the pink counterstain (Gram-negative).
    That architecture is also why the classes differ in antibiotic susceptibility and why LPS endotoxin
    is a Gram-negative problem.'
  connection: 'The roughly 20-minute doubling time is why hospital resistance stories unfold in weeks,
    not decades: every division is a lottery draw for a beneficial mutation, and a patient on a partial-course
    antibiotic is selecting the winners in real time. Finish-the-course advice is this arithmetic stated
    as policy.'
  connection_label: Real-world connection
  check:
  - q: Lipopolysaccharide (endotoxin) is found in the envelope of…
    options:
      A: Gram-positive bacteria only
      B: All cells
      C: Viruses
      D: Gram-negative bacteria's outer membrane
    answer: D
    explain: LPS anchors the Gram-negative outer membrane and drives endotoxic shock.
    distractors:
      A: Gram-positives lack an outer membrane entirely.
      B: Eukaryotic plasma membranes carry no LPS.
      C: Viruses have no envelope chemistry of this kind.
  - q: An antibiotic that blocks peptidoglycan cross-linking works best against which organisms?
    options:
      C: Gram-positive bacteria, whose thick peptidoglycan is the target
      A: Gram-negative bacteria, with their thin wall
      B: Viruses, which lack a wall entirely
      D: Both Gram classes equally, since their walls are identical
    answer: C
    explain: The thicker the peptidoglycan, the more target there is — Gram-positives are the classic
      susceptible group.
    distractors:
      A: Gram-negatives still have a wall, but the outer membrane shields it and the layer is thin.
      B: Viruses have no cell wall and no such target.
      D: The two classes differ precisely in wall architecture.
- heading: Horizontal gene transfer — sex without reproduction
  objectives:
  - Match each transfer mechanism to its vector.
  - Predict how DNase or a contact filter changes a transfer experiment.
  - Explain how R plasmids spread resistance across species.
  body:
  - Prokaryotes shuffle genes three ways without dividing. **Transformation** — uptake of free environmental
    DNA (the Griffith mouse experiment's mechanism). **Transduction** — bacteriophages accidentally package
    host DNA and deliver it to the next cell. ==**Conjugation** — the F plasmid's pilus connects cells
    and copies itself across==, sometimes dragging chromosomal genes with it. All three are exam-grade
    mechanisms; match the vector to the story.
  - This is the engine of real-world microbiology — resistance genes hopping between species on plasmids
    (R plasmids), and virulence genes moving by phage (diphtheria toxin is phage-encoded). Any "how did
    the non-resistant strain become resistant" passage is one of these three doors.
  misconception: '"Bacteria only get new genes from their parents, like everything else." Prokaryotes
    have three sideways channels that need no reproduction at all: transformation takes up naked DNA from
    the environment, transduction lets a phage mis-package and deliver host DNA, and conjugation passes
    a plasmid through a pilus between living cells. The DNase test in the check is the tell — only transformation
    exposes bare DNA to the medium.'
  connection: 'R plasmids are this section''s clinical headline: a resistance gene that hops onto a plasmid
    can cross species boundaries by conjugation, which is how a hospital''s bacterial population can share
    resistance without any single lineage evolving it. Phage-encoded diphtheria toxin shows the same story
    run by transduction.'
  connection_label: Real-world connection
  check:
  - q: A phage carries a segment of its previous host's chromosome into a new bacterium. This is…
    options:
      A: Binary fission
      B: Conjugation
      C: Transduction
      D: Transformation
    answer: C
    explain: Virus-mediated horizontal transfer is transduction.
    distractors:
      A: Fission is reproduction, not transfer.
      B: Conjugation requires cell-to-cell contact.
      D: Transformation is naked-DNA uptake.
  - q: Adding DNase to a broth abolishes gene transfer between two strains. The mechanism was…
    options:
      D: Transformation, since free DNA was the vehicle
      A: Transduction, which protects DNA inside a capsid
      B: Conjugation, which passes DNA through a pilus
      C: Binary fission, which copies DNA internally
    answer: D
    explain: Only transformation exposes naked DNA to the medium, so only it is DNase-sensitive.
    distractors:
      A: A capsid shields phage-carried DNA from nuclease.
      B: Pilus-delivered DNA never enters the medium.
      C: Fission transfers DNA to daughter cells, not between adults.
- heading: Viruses — genomes in boxes
  objectives:
  - Describe a virion's parts and what each contributes.
  - Explain why antibiotics have no effect on viruses.
  - Deduce which enzyme a given viral genome must carry.
  body:
  - A virus is genome (DNA or RNA, single- or double-stranded) in a **capsid** of repeating units, sometimes
    wrapped in a stolen host **envelope** studded with spike glycoproteins. They have no metabolism, no
    ribosomes, ==no independent reproduction== — which is why antibiotics (which hit wall synthesis, ribosomes,
    folate pathways) do nothing to them, and why antivirals must target virus-specific enzymes.
  - Classification keys worth memorizing — genome chemistry, +/− strandedness for RNA viruses, and envelope
    presence (enveloped viruses are environmentally fragile but fuse into cells; naked capsids are tough
    and often fecal-oral). Baltimore-style grouping appears in passages as "what must this genome encode
    to be infectious?" — a +ssRNA virus is read as mRNA; a −ssRNA virus must carry an RNA-dependent RNA
    polymerase; a retrovirus must carry reverse transcriptase.
  misconception: '"Antibiotics don''t work on viruses because viruses are hidden inside cells." Location
    is not the reason. Antibiotics hit targets viruses simply do not have — peptidoglycan walls, prokaryotic
    ribosomes, folate-synthesis pathways. A virus is a genome in a capsid with no metabolism of its own,
    so there is nothing in that list to hit, which is why antivirals must aim at virus-specific enzymes
    instead.'
  connection: '"What must this genome encode to be infectious?" is a logic puzzle built on chapter 1B''s
    central dogma: a plus-strand RNA virus arrives as ready mRNA, a minus-strand virus must carry its
    own RNA-dependent RNA polymerase, and a retrovirus must carry reverse transcriptase. The Baltimore
    grouping is just the dogma run backwards.'
  connection_label: How sciences interconnect
  check:
  - q: Why are antibiotics ineffective against viruses?
    options:
      A: Viruses lack the targets — walls, ribosomes, folate pathways
      B: Viruses are too small
      C: Viruses live inside red blood cells
      D: Viruses metabolize too fast
    answer: A
    explain: Antibiotics hit prokaryote-specific machinery viruses simply do not have.
    distractors:
      B: Size is not the mechanism.
      C: Most viruses do not; location is irrelevant.
      D: They have no metabolism at all.
  - q: A minus-strand single-stranded RNA virus must carry which enzyme to be infectious?
    options:
      C: An RNA-dependent RNA polymerase
      A: Reverse transcriptase
      B: A DNA-dependent RNA polymerase
      D: None — the host ribosomes read it directly
    answer: C
    explain: A negative strand is the template, not the message, so the virion must bring its own copier.
    distractors:
      A: Reverse transcriptase is the retrovirus's enzyme, not a -ssRNA virus's.
      B: Host polymerases transcribe DNA, and this genome is RNA.
      D: Only a plus-strand RNA genome can be translated as delivered.
  figures:
  - src: 2b-prokaryotes-and-viruses/virus-shapes.webp
    caption: Capsid architectures — helical (TMV), icosahedral (rhinovirus), and complex.
    credit: Fig 21.3 · OpenStax Biology 2e — CC BY-NC-SA 4.0
  - src: 2b-prokaryotes-and-viruses/complex-viruses.webp
    caption: Three complex virions — T4 bacteriophage, adenovirus, and enveloped influenza with glycoprotein
      spikes.
    credit: Fig 21.5 · OpenStax Biology 2e — CC BY-NC-SA 4.0
- heading: The viral life cycle — lytic, lysogenic, and the economy of bursts
  objectives:
  - Order the steps of the lytic cycle.
  - Distinguish the lytic from the lysogenic choice in bacteriophages.
  - Interpret a one-step growth curve's eclipse and burst.
  body:
  - The cycle is a fixed script — **attach** to a specific receptor, **enter**, **uncoat**, **replicate**
    genome and proteins, **assemble**, **release** (lysis or budding). In bacteriophages the choice is
    binary — ==lytic== (immediate replication, host bursts) versus ==lysogenic== (genome integrates as
    prophage, replicates with the host, exits under stress). Lambda's switch is the canonical regulatory
    circuit.
  - Two quantitative habits pay off — burst size arithmetic (one infection → N progeny → N new cells infected
    next round) and the one-step growth curve's eclipse period (no infectious particles detectable intracellularly
    — the exam loves asking why plaque counts drop then jump).
  misconception: '"The eclipse period means the infection has been cleared — no virus can be detected
    inside the cell." Nothing was cleared. Parts are being made: genomes replicated, capsid proteins synthesised,
    but not yet assembled into infectious wholes — so a plaque assay of the lysate finds nothing. When
    assembly completes, the count jumps. The dip is a measurement artefact of looking for finished viruses
    during construction.'
  connection: 'Lysogeny is a persistence strategy, not a truce: the prophage replicates quietly with its
    host and gets a free ride through every division — until UV or other stress flips lambda''s regulatory
    switch, and it excises and kills its ride. It is the same cost-benefit logic temperate viruses apply
    in nature, trading immediate reproduction for guaranteed transmission.'
  connection_label: Real-world connection
  check:
  - q: During the eclipse period of a lytic infection, infectious particles inside the cell are undetectable
      because…
    options:
      A: Genomes and capsids are being made but not yet assembled
      B: The host degraded all viral DNA
      C: Release has already occurred
      D: The virus is dormant
    answer: A
    explain: Eclipse = replication and synthesis before assembly — parts exist, infective wholes do not.
    distractors:
      B: Degradation would end the infection.
      C: Release defines the end of the cycle.
      D: Dormancy is lysogeny, not eclipse.
  - q: UV stress induces a prophage in a lysogenised bacterium. What follows?
    options:
      A: The prophage excises and enters the lytic cycle
      B: The prophage integrates more deeply into the chromosome
      C: The phage converts to a retrovirus
      D: The host becomes permanently immune to superinfection
    answer: A
    explain: Induction is the switch from lysogeny to lysis — excision, replication, and host lysis follow.
    distractors:
      B: Integration is the entry into lysogeny, not the exit from it.
      C: Retroviruses are a separate class of virus.
      D: Superinfection immunity lasts only while the prophage represses the lytic genes.
  figures:
  - src: 2b-prokaryotes-and-viruses/virus-em-grid.webp
    caption: Transmission electron micrographs — naked icosahedral, enveloped, helical, and complex capsids
      side by side.
    credit: Fig 21.7 · OpenStax Biology 2e — CC BY-NC-SA 4.0
- heading: Defense and counterattack — vaccines, antivirals, resistance
  objectives:
  - Compare vaccine platforms by what each delivers.
  - Match an antiviral drug to the viral step it targets.
  - Distinguish antigenic drift from antigenic shift.
  body:
  - Vaccines train ahead of time — attenuated, inactivated, subunit, and mRNA platforms all deliver antigen
    without disease. Antiviral drugs target virus-specific steps — entry inhibitors, polymerase inhibitors
    (acyclovir needs a viral kinase to activate — selectivity by parasitizing viral enzymes), integrase
    and protease inhibitors for HIV.
  - The resistance story runs both directions — bacteria acquire resistance (efflux pumps, degrading enzymes,
    target modification — often on transmissible plasmids), and viruses escape through antigenic **drift**
    (point-mutation accumulation) and **shift** (segment reassortment — the pandemic-flu mechanism). ==Drift
    is slow accumulation; shift is sudden recombination== — the pair is a guaranteed exam distinction.
  misconception: '"Antigenic drift and shift are the same thing at different speeds." Different mechanisms.
    Drift is point mutations accumulating in the surface genes — gradual, the reason flu vaccines need
    annual updating. Shift is reassortment of genome segments when two strains infect one host — sudden,
    producing a subtype with a novel surface that almost nobody has immunity to, which is the pandemic
    recipe.'
  connection: 'Acyclovir''s selectivity is elegant parasitism: the drug is activated by a viral kinase
    the host cell does not have, so it only turns poisonous where the virus is replicating. That design
    principle — aim at virus-specific enzymes — is the same targeting logic chapter 3B · Main organ systems
    covers for the rest of antimicrobial therapy.'
  connection_label: How sciences interconnect
  check:
  - q: A new influenza subtype appears suddenly with genes from two strains infecting one host. The mechanism
      is…
    options:
      A: Lysogenic conversion
      B: Conjugation
      C: Antigenic drift
      D: Antigenic shift via segment reassortment
    answer: D
    explain: Segmented genomes reassort wholesale — shift, not gradual drift.
    distractors:
      A: Phage-to-bacterium gene gift — wrong player.
      B: Bacterial DNA transfer.
      C: Drift is year-to-year point-mutation accumulation.
  - q: Acyclovir is activated almost only in infected cells because…
    options:
      D: The viral kinase performs the first phosphorylation
      A: It blocks the bacterial ribosome
      B: It is delivered as a vaccine into infected cells
      C: It inhibits host DNA polymerase indiscriminately
    answer: D
    explain: Parasitising a virus-specific enzyme is what gives the drug its selectivity.
    distractors:
      A: That is an antibacterial target, not an antiviral one.
      B: Vaccines deliver antigen; they do not deliver antiviral prodrugs.
      C: Indiscriminate host inhibition would be toxicity, not selectivity.
examples:
- prompt: In the Hershey-Chase style logic — one culture's phage particles are labeled in protein (³⁵S),
    another's in DNA (³²P). After infection and blending, which label enters the cells and enters the
    progeny, and what does that prove?
  strategy: 'Separate the labels from the conclusion before reasoning: ³⁵S tags protein only, ³²P tags
    DNA only, and the blender exists to strip the empty capsids off the outside. The plan is to ask where
    each label ends up — inside the cells and progeny versus sheared away — and let that location decide
    which molecule is the hereditary material.'
  solution:
  - Step 1 — the phage attaches and injects its genome; blender shears off empty capsids.
  - Step 2 — ³²P (DNA) is found inside cells and in progeny phage; ³⁵S (protein) stays with the capsids
    outside.
  - Step 3 — therefore the heritable instruction is DNA, not protein.
  answer: DNA enters and is inherited by progeny — the injecting genome is the hereditary material.
  discussion: 'The inference is airtight only because the two labels partition so cleanly — protein stays
    with the ghost capsids while DNA appears both inside the infected cells and in the next phage generation.
    Note what the experiment does NOT address: nothing about RNA as genetic material in other systems,
    and nothing about the mechanics of injection. The design lesson generalises — pick a label unique
    to the component whose role you are testing, then find a physical step that separates them.'
  distractors:
    A: Claiming both enter — the shear step separates them cleanly.
    B: Claiming protein enters — radioactivity says otherwise.
    C: Claiming it proves RNA is the genetic material — that is tobacco mosaic virus work, not phage.
  practice:
    q: Mice injected with heat-killed S cells plus live R cells die, and live S cells are recovered from
      them. What does this show?
    options:
      D: A transforming substance from the dead S cells converted live R cells
      A: The heat-killed cells revived
      B: The R cells mutated into S cells spontaneously at a high rate
      C: The mouse's immune system manufactured S cells
    answer: D
    explain: Heritable change in the living cells, caused by material from the dead ones, is the definition
      of transformation.
    distractors:
      A: Heat-killed cells cannot divide.
      B: Spontaneous mutation at that frequency would appear in the controls.
      C: The immune system destroys bacteria; it does not rewrite them.
key_points:
- Envelope architecture sets Gram reaction; LPS is the Gram-negative endotoxin.
- Division speed (~20 min) explains culture behavior and resistance tempo.
- Horizontal transfer trio — transformation (naked DNA), transduction (phage), conjugation (pilus + plasmid).
- Viruses are genome + capsid ± envelope; no metabolism; antibiotic targets absent by definition.
- Genome chemistry dictates what a virus must carry — +ssRNA is mRNA; −ssRNA carries its polymerase; retroviruses
  carry reverse transcriptase.
- Life-cycle script — attach, enter, uncoat, replicate, assemble, release; lytic versus lysogenic; eclipse
  = unassembled parts.
- Drift accumulates; shift reassorts.
mnemonics:
- phrase: T-T-C — Take up DNA, Transduce by phage, Conjugate by pilus
  means: The three horizontal gene-transfer doors.
- phrase: Positive RNA reads like mail; Negative needs a copier
  means: +ssRNA is directly translatable; −ssRNA must carry an RNA-dependent RNA polymerase.
maps:
- title: Viral life cycle
  steps:
  - attach (receptor lock-and-key) → enter → uncoat
  - replicate genome + make proteins → assemble
  - ==lyse or bud== — release and reinfect
  - lysogenic branch — integrate as prophage, wait for stress
- title: Where resistance comes from
  steps:
  - mutation (chromosomal) — slow, vertical
  - ==R plasmids by conjugation — fast, horizontal==
  - transposons shuttle resistance cassettes between plasmid and chromosome
passage:
  text: A lab isolates two E. coli strains — strain A is streptomycin- sensitive, strain B is resistant
    via a chromosomal ribosomal mutation. Mixing the two strains in broth without phage and without free
    DNA still yields a small number of streptomycin- resistant descendants of strain A. Adding DNase (which
    degrades extracellular DNA) does not change the result; removing cell contact with a filter does.
  questions:
  - q: The resistance moved by…
    options:
      A: Transformation by free DNA
      B: Transduction
      C: Conjugation
      D: New mutation in strain A
    answer: C
    explain: Cell contact was required and free DNA irrelevant — the pilus-mediated route.
    distractors:
      A: DNase would have abolished transformation.
      B: No phage is present in the setup.
      D: The result tracks strain A DESCENDANTS acquiring B's marker — transfer, not fresh mutation at
        this rate.
  - q: Which gene location most plausibly moved?
    options:
      A: The gene was in a phage head
      B: Any chromosomal gene by itself
      C: The gene jumped by transposon directly
      D: Resistance is most efficiently spread when carried on mobile elements; here the chromosomal marker
        moved via an Hfr-like conjugation event
    answer: D
    explain: Chromosomal markers transfer when conjugation drags the chromosome across (Hfr logic) — slower
      and rarer than plasmid transfer, matching the small number observed.
    distractors:
      A: No phage present.
      B: Chromosomal genes do not transfer alone — they need the conjugation bridge.
      C: Transposons move within/between replicons in the SAME cell lineage, not between cells.
  - q: If the experiment were repeated with a Gram-positive streptomycin-resistant donor instead, conjugation
      rates would likely be lower because…
    options:
      A: Conjugation machinery differs and is generally less efficient in Gram-positives
      B: Gram-positives cannot be resistant
      C: Gram-positives have no genome
      D: Peptidoglycan blocks all DNA
    answer: A
    explain: The pilus-driven conjugation classic is Gram-negative; Gram-positive transfer exists but
      by other, generally less efficient systems.
    distractors:
      B: Resistance exists across both groups.
      C: Absurd on its face.
      D: Their walls pass DNA-transferring systems fine.
pitfalls:
- Treating Gram stain as membrane thickness alone — it is the peptidoglycan/outer-membrane architecture
  that holds or loses the dye.
- Calling conjugation reproduction — it is gene transfer, usually without cell division.
- Expecting antibiotics to treat flu — no wall, no ribosomes, no target.
- Confusing eclipse with lysogeny — eclipse is intracellular unassembled lytic phase.
- Mixing drift with shift — accumulation versus reassortment.
exam_map:
  NMAT: Structure-label and mechanism-matching items — Gram walls, transfer definitions, lytic/lysogenic
    vocabulary, drug-class recall.
  MCAT: Content Category 2B runs experiments — labeled phage, transfer conditions with DNase and filters,
    growth curves with eclipse and burst, and resistance-epidemiology logic.
