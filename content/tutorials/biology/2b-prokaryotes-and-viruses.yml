review_questions:
- q: Which structure mediates bacterial conjugation?
  options:
    A: Flagellum
    B: Sex pilus (F plasmid encoded)
    C: Capsule
    D: Endospore
  answer: B
  explain: The F pilus builds the bridge; the plasmid copies across it.
  distractors:
    A: Motility organelle.
    C: Adherence and immune evasion.
    D: Survival capsule.
- q: A retrovirus such as HIV must carry…
  options:
    A: DNA polymerase only
    B: Reverse transcriptase
    C: Ribosomes
    D: Peptidoglycan
  answer: B
  explain: RNA → DNA conversion is the defining retroviral step and the drug target.
  distractors:
    A: Wrong direction of synthesis.
    C: Viruses never carry ribosomes.
    D: Bacterial polymer, no place in a virus.
- q: In the lysogenic cycle, the phage genome…
  options:
    A: Immediately lyses the host
    B: Integrates as a prophage and replicates with the host
    C: Is destroyed by host restriction enzymes
    D: Becomes an endospore
  answer: B
  explain: Integration plus co-replication is lysogeny; stress can later induce the lytic exit.
  distractors:
    A: That is the lytic path.
    C: Successful phage avoid this.
    D: Endospores are bacterial.
- q: Bacterial resistance spreading between species in a hospital is most often mediated by…
  options:
    A: Vertical mutation alone
    B: Horizontal transfer of R plasmids
    C: Mitosis
    D: Viral envelopes
  answer: B
  explain: Plasmid-borne resistance genes conjugate across species boundaries — the hospital epidemiology
    engine.
  distractors:
    A: Vertical descent is too slow for the pattern.
    C: Bacteria do not do mitosis.
    D: Category error.
