  - src: 2a-assemblies-of-molecules-cells-and-cell-groups/body-symmetry.webp
    caption: Body symmetry — asymmetrical sponge, radial sea anemone, bilateral goat with its directional
      axes.
    credit: Fig 33.2 · OpenStax Biology 2e — CC BY-NC-SA 4.0
- heading: Polarity — the epithelium as a one-way valve
  objectives:
  - Assign transporters to the apical and basal domains of an epithelial cell.
  - Explain how the tight junction maintains vectorial transport.
  - Predict the effect of blocking the Na+/K+-ATPase on glucose absorption.
  body:
  - An absorptive epithelial cell is two different machines bolted together — apical (lumen-facing) transporters
    for uptake, basal (blood-facing) transporters for export, kept apart by the tight junction fence.
    ==Glucose absorption in the gut is the classic loop== — apical Na⁺-glucose cotransport pulls glucose
    IN against its gradient (riding the sodium gradient), then basal GLUT transporters let it OUT down
    its gradient into blood.
  - This vectorial transport answers a classic MCAT puzzle — why inhibiting the Na⁺/K⁺-ATPase (ouabain,
    for example) kills glucose absorption — the apical cotransporter depends on the sodium gradient that
    the pump maintains on the basolateral side. No gradient, no cotransport, no absorption.
  check:
  - q: Apical Na⁺-glucose cotransport across the gut epithelium is classified as…
    options:
      A: Primary active transport
      B: Simple diffusion
      C: Secondary active transport
      D: Facilitated diffusion of glucose
    answer: C
    explain: It stores no ATP itself but spends the Na⁺ gradient that primary pumping built — secondary
      active.
    distractors:
      A: The ATP is burned elsewhere (basolateral pump).
      B: Charged ion + uphill glucose = not simple.
      D: GLUT on the basal side is the facilitated step — wrong side.
  - q: A Na+/K+-ATPase inhibitor halts glucose absorption across the gut. The reason is that…
    options:
      A: The apical cotransporter loses the sodium gradient it rides
      B: The basal GLUT transporter is inhibited directly
      C: The tight junction dissolves and glucose leaks back
      D: The apical cotransporter runs out of ATP
    answer: A
    explain: Secondary active transport borrows a gradient; abolish the pump that builds it and the borrowing
      stops.
    distractors:
      B: GLUT is passive and untouched by the pump inhibitor.
      C: Tight junctions are unaffected by the pump.
      D: The ATP is spent on the basal side, not by the apical cotransporter.
  figures:
  - src: 2a-assemblies-of-molecules-cells-and-cell-groups/body-cavities.webp
    caption: Vertebrate body cavities — dorsal (cranial, spinal) and ventral (thoracic, abdominopelvic)
      compartments.
    credit: Fig 33.6 · OpenStax Biology 2e — CC BY-NC-SA 4.0
examples:
- prompt: A drug blocks the basolateral Na⁺/K⁺-ATPase of gut epithelial cells. Predict glucose absorption
    and explain the chain of causation.
  strategy: 'Trace the dependency chain backwards from the failure: apical glucose uptake is secondary
    active, so it rides the sodium gradient; that gradient is built and maintained by the basolateral
    Na+/K+-ATPase. Therefore the pump — not either glucose transporter — is the step whose loss explains
    the collapse.'
  solution:
  - Step 1 — the pump normally keeps intracellular Na⁺ LOW, storing energy as the sodium gradient.
  - Step 2 — with the pump blocked, intracellular Na⁺ rises; the apical Na⁺-glucose cotransporter loses
    its driving force.
  - Step 3 — apical glucose uptake collapses even though the apical transporter and the basal GLUT are
    both intact.
  - Step 4 — result — glucose absorption falls despite normal luminal glucose.
  answer: Pump blockade collapses the sodium gradient that powers secondary active uptake at the apical
    membrane.
  discussion: 'The chain shows why epithelial transport is an engineering problem rather than a list of
    channels: every transporter depends on a gradient that something else must build, and in a polarised
    cell that builder sits on the opposite side of the membrane. Note the diagnostic value of the setup
    — the apical cotransporter and the basal GLUT are both intact, so a blocker acting purely at the pump
    still shuts the whole line down. This is exactly the logic behind oral rehydration therapy, which
    keeps the sodium-glucose cotransporter supplied so it keeps working.'
  distractors:
    A: Blaming the apical cotransporter directly — the drug never touched it.
    B: Blaming GLUT — basal exit is passive and intact; entry is the failed step.
    C: Claiming cell death — acute pharmacology before pathology.
  practice:
    q: In a separate experiment, luminal sodium is replaced by an impermeant cation. What happens to apical
      glucose uptake?
    options:
      C: It collapses, because the cotransporter has no luminal sodium to ride
      A: It accelerates, because sodium no longer competes with glucose
      B: It is unchanged, because the cotransporter hydrolyses ATP directly
      D: It reverses, pumping glucose back into the lumen
    answer: C
    explain: The apical transporter is a symport — no sodium gradient, no uphill glucose entry.
    distractors:
      A: The two substrates are cotransported, not competitors.
      B: That would make it primary active transport, which it is not.
      D: Nothing here reverses the transporter's direction.
key_points:
- Amphipathic lipids self-assemble into bilayers; unsaturation loosens packing, cholesterol buffers fluidity.
- ECM — collagen for tensile strength, proteoglycans for hydration, integrins as two-way links to the
  cytoskeleton.
- Junction matching — tight seals, desmosome rivets, gap junction wires, plasmodesmata in plants.
- Four tissues — epithelial, connective, muscle, nervous; organs are fabric layerings.
- Epithelial polarity — apical in, basal out; tight junctions are the fence.
- Vectorial transport — apical secondary-active uptake powered by the basolateral pump's sodium gradient.
mnemonics:
- phrase: Seal, Rivet, Wire
  means: Tight junctions seal; desmosomes rivet; gap junctions wire.
- phrase: In by sodium, out by GLUT
  means: The two-step glucose trip across an absorbing epithelium.
maps:
- title: Epithelial glucose absorption
  steps:
  - lumen — apical Na⁺/glucose ==cotransporter== (secondary active, rides Na⁺ gradient)
  - cell — glucose accumulates
  - blood — basal ==GLUT== (facilitated diffusion OUT)
  - the Na⁺/K⁺-ATPase on the basal side rebuilds the gradient — the power plant
- title: Junction jobs
  steps:
  - tight — barrier + polarity fence
  - adherens/desmosomes — mechanical strength (cadherins)
  - gap — direct cytoplasm channels (connexons)
passage:
  text: A tissue model uses epithelial cells grown as a monolayer on a porous support. Adding calcium-chelating
    EDTA disrupts cadherin-based junctions within minutes; transepithelial electrical resistance (a leak
    measure) drops after a longer delay. In a second condition, a gap-junction blocker is added instead
    — electrical coupling between neighbors vanishes, but the resistance reading is unchanged.
  questions:
  - q: The delayed resistance drop after EDTA implies…
    options:
      A: Gap junctions carry current
      B: The cells died instantly
      C: Cadherins directly form the seal
      D: The sealing junctions depend on or disassemble together with cadherin-anchored structure
    answer: D
    explain: Adherens disruption destabilizes the junctional complex — the seal fails as the architecture
      collapses, not instantly as a direct effect.
    distractors:
      A: That is the OTHER experiment's result.
      B: Instant death contradicts graded, condition-specific results.
      C: If cadherins sealed directly, resistance would fall in minutes, not after a delay.
  - q: The gap-junction blocker result shows gap junctions…
    options:
      A: Provide the paracellular barrier
      B: Couple cells electrically without contributing to the seal
      C: Anchor the cytoskeleton
      D: Transport glucose
    answer: B
    explain: Coupling vanished while resistance (sealing) held — two independent functions.
    distractors:
      A: Resistance was unchanged — sealing is tight-junction work.
      C: Anchoring is desmosome work.
      D: Wrong molecule and wrong junction.
  - q: Which junction type most likely maintains the monolayer's barrier in the blocker experiment?
    options:
      A: Gap junctions
      B: Tight junctions
      C: Desmosomes
      D: Plasmodesmata
    answer: B
    explain: Tight junctions are the paracellular seal — unaffected by the gap blocker.
    distractors:
      B: Correct — tight junctions seal the paracellular route.
      C: Desmosomes add strength, not sealing.
      D: Hemidesmosomes anchor to the basal lamina.
pitfalls:
- Assigning fluidity backwards — unsaturated = fluid; saturated = rigid.
- Confusing junction jobs under time pressure — seal/rivet/wire, one each.
- Calling apical cotransport primary active — the ATPase is on the OTHER side of the cell.
- Treating blood as epithelial — cell-sparse in abundant matrix is connective by definition.
- Expecting tight junctions to pass anything — they are the fence, not a channel.
exam_map:
  NMAT: Junction names and tissue categories at recall level; membrane fluidity determinants; one-step
    transport classification.
  MCAT: Content Category 2A passages test fluidity manipulation, integrin/ECM signaling logic, junction
    pharmacology, and epithelial vectorial transport with pump inhibitors.
