subject: biology
chapter: 2A · Assemblies of molecules, cells, and cell groups
title: 2A · Assemblies of molecules, cells, and cell groups
overview: AAMC's 2A treats the cell as an engineered assembly — how molecules self-organize into membranes,
  how membranes and junctions turn cells into tissues, and how polarity makes epithelia work as selective
  barriers. The MCAT frames it in transport data and tissue function; the NMAT meets the same vocabulary
  in intro-cell items. Prerequisites — Cells and Cellular Processes (full chapter).
sections:
- heading: Self-assembly — why membranes build themselves
  objectives:
  - Explain why amphipathic phospholipids self-assemble with no energy input.
  - Predict how tail saturation and cholesterol shift membrane fluidity.
  - Describe the evidence that membrane proteins drift laterally.
  body:
  - Phospholipids are **amphipathic** — charged head, fatty tail — and in water they hide their tails
    by forming bilayers, micelles, or liposomes ==with no energy input==. Every biological membrane is
    this self-assembly plus proteins doing the work. Membrane **fluidity** is tuned by composition — unsaturated
    (kinked) tails keep membranes loose; cholesterol buffers extremes, stiffening at high temperature
    and preventing crystal packing at low.
  - The fluid mosaic consequence matters for exams — proteins drift laterally (Frye-Edidin fusion experiments),
    rafts cluster signaling molecules, and anisotropy measurements report fluidity. When a passage changes
    temperature or tail saturation, ask what happens to fluidity first — everything else follows.
  check:
  - q: A membrane is enriched with unsaturated fatty-acyl tails. At a given temperature it will be…
    options:
      A: More fluid, because kinked tails pack poorly
      B: More rigid, because tails interlock
      C: Unchanged in fluidity
      D: Unable to hold proteins
    answer: A
    explain: Double bonds kink tails — loose packing, more fluid.
    distractors:
      B: That is saturated-tail behavior.
      C: Composition shifts always move fluidity.
      D: Proteins stay anchored regardless.
  - q: Bacteria shifted to a cold environment increase the unsaturated fatty-acyl tails in their membranes.
      Why?
    options:
      D: Kinked tails pack poorly, keeping the membrane fluid in the cold
      A: Unsaturated tails stiffen the membrane against the cold
      B: To reduce water permeability at low temperature
      C: To anchor membrane proteins more firmly
    answer: D
    explain: Cold makes tails pack tightly; the cis double-bond kink is how the cell counters it.
    distractors:
      A: Unsaturated tails do the opposite of stiffening.
      B: Fluidity, not permeability, is what cold threatens.
      C: Protein anchoring is a protein-lipid interaction, not a tail-composition response.
- heading: The extracellular matrix — the cell's load-bearing exterior
  objectives:
  - Assign each ECM component to its mechanical role.
  - Explain how integrins link the ECM to the cytoskeleton and signal both ways.
  - Relate collagen chemistry to a named deficiency disease.
  body:
  - Animal cells sit in the **ECM** — a mesh of **collagen** (tensile rods), **proteoglycans** (water-trapping
    ground substance), and **fibronectin** and friends linking it all to cells through **integrins** —
    receptors that physically connect the outside scaffold to the inside cytoskeleton and, crucially,
    ==signal both ways== (outside-in mechanical information, inside-out cell state).
  - The exam hooks — connective tissue's ECM IS its function (tendon, cartilage, bone's organic scaffold);
    plants run the parallel system with the **cell wall** (cellulose fibers in a polysaccharide glue),
    rigid yet porous, joined between cells by plasmodesmata. Collagen pathology (scurvy — vitamin C needed
    for hydroxylation) shows the chemistry-clinical bridge.
  check:
  - q: Which molecule physically links the ECM to a cell's cytoskeleton?
    options:
      A: Integrins spanning the membrane
      B: Cholesterol
      C: Collagen directly
      D: Glycine
    answer: A
    explain: Integrins are the transmembrane handshakes — ECM outside, cytoskeleton inside, signals both
      directions.
    distractors:
      B: Cholesterol tunes fluidity.
      C: Collagen is the scaffold itself, not the link.
      D: An amino acid, not a connector.
  - q: A patient's wounds heal poorly and his gums bleed. Which ECM component and which reason?
    options:
      C: Collagen, whose hydroxylation requires vitamin C
      A: Proteoglycans, which trap water
      B: Integrins, which are signalling receptors
      D: Cholesterol, a membrane lipid
    answer: C
    explain: Without hydroxyproline and hydroxylysine the triple helix is unstable — that is scurvy.
    distractors:
      A: Proteoglycans hydrate the ground substance; they are not the tensile failure here.
      B: Integrins span the membrane; they are not the vitamin-C-dependent scaffold.
      D: Cholesterol has no role in the ECM.
- heading: Junctions — how cells weld, rivet, and wire together
  objectives:
  - Match each junction to its job — seal, rivet, or wire.
  - Explain how tight junctions create epithelial polarity.
  - Compare the plasmodesma with the gap junction.
  body:
  - Four junctions, four jobs. **Tight junctions** seal neighboring epithelial cells into a leak-proof
    belt — nothing slips BETWEEN the cells. **Adherens and desmosomes** rivet cells together (cadherins
    into intermediate filaments) — mechanical strength in skin and heart. ==**Gap junctions** are the
    wires== — connexon channels passing small molecules and ions directly between cytoplasms, synchronizing
    heart muscle and coupling development.
  - The plant counterpart is the plasmodesma — a membrane-lined tunnel through the wall. Expect a matching
    question — desmosome for strength, tight for barrier, gap for communication — and remember ==tight
    junctions also create epithelial polarity== by fencing the membrane into apical and basal domains.
  check:
  - q: Cardiac muscle cells contract nearly in unison largely via…
    options:
      A: Desmosomes only
      B: ECM collagen
      C: Tight junctions
      D: Gap junctions passing ions between cells
    answer: D
    explain: Electrical coupling through connexons coordinates the heartbeat.
    distractors:
      A: Desmosomes add strength, not signaling.
      B: Scaffold, not conduction.
      C: Sealing junctions — no channel.
  - q: A toxin selectively blocks connexons. Which function is lost?
    options:
      D: Direct exchange of ions and small molecules between neighbouring cytoplasms
      A: The paracellular seal between epithelial cells
      B: Mechanical strength of the epidermis
      C: Anchorage of cells to the basal lamina
    answer: D
    explain: Connexons are the gap-junction channels; blocking them cuts electrical and metabolic coupling
      only.
    distractors:
      A: Sealing is tight-junction work.
      B: Riveting is desmosome work.
      C: Anchoring to the basal lamina is hemidesmosome work.
- heading: Tissues — the four fabrics
  objectives:
  - Assign a tissue to one of the four types from its structure.
  - Layer the four fabrics to explain an organ's architecture.
  - Predict which fabric dominates in an organ with a named function.
  body:
  - Assemblies of cells plus ECM make four tissue types — **epithelial** (sheets — barriers, absorption,
    secretion; tightly joined, polarized, avascular), **connective** (cells sparse in a rich ECM — bone,
    tendon, blood, fat), **muscle** (contractile bundles), **nervous** (irritable, signaling). Organ architecture
    is these fabrics layered — the gut's epithelial lining on connective lamina with muscle driving peristalsis
    is the canonical cross-section.
  - Function follows fabric — a barrier organ leads with epithelium; a load-bearing organ leads with connective
    tissue; a pump leads with muscle wrapped in its own wiring. When a passage names an organ, sketch
    its fabric order before answering structure questions.
  check:
  - q: Blood is classified as which tissue type?
    options:
      A: Muscle
      B: Epithelial
      C: Connective — cells dispersed in plasma matrix
      D: Nervous
    answer: C
    explain: Cells sparse in an abundant extracellular fluid — the connective-tissue design rule.
    distractors:
      A: No fibers contracting.
      B: Blood is not a sheet.
      D: No neurons.
  - q: A tissue is a packed sheet of avascular cells joined by tight junctions, resting on a basement
      membrane. Which type is it?
    options:
      D: Epithelial
      A: Connective
      B: Muscle
      C: Nervous
    answer: D
    explain: Packed, polarised, avascular, and tightly joined is the epithelial signature.
    distractors:
      A: Connective tissue is cell-sparse in an abundant matrix.
      B: Muscle is bundled contractile fibres.
      C: Nervous tissue is a signalling network of neurons and glia.
