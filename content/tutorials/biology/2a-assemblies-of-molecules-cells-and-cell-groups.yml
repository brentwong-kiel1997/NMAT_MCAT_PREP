review_questions:
- q: Cholesterol in a membrane at LOW temperature acts to…
  options:
    A: Further stiffen it
    B: Prevent tight packing and keep it fluid
    C: Dissolve the bilayer
    D: Form junctions
  answer: B
  explain: Cholesterol is the buffer — it disrupts packing in the cold and restrains motion in the heat.
  distractors:
    A: Stiffening is its HIGH-temperature role.
    C: It is a membrane component, not a solvent.
    D: Protein function, not lipid.
- q: Which junction allows direct cytoplasmic exchange of small molecules?
  options:
    A: Desmosome
    B: Tight junction
    C: Gap junction
    D: Adherens junction
  answer: C
  explain: Connexon channels bridge cytoplasms.
  distractors:
    A: Mechanical rivet.
    B: Seal — nothing passes between cells.
    D: Belt of adhesion.
- q: Vitamin C deficiency weakens tendons because it is required for…
  options:
    A: Collagen hydroxylation
    B: DNA repair
    C: Sodium pumping
    D: Phospholipid synthesis
  answer: A
  explain: Proline/lysine hydroxylation stabilizes collagen's triple helix — scurvy is the failure state.
  distractors:
    B: Unrelated axis.
    C: Transport, not structure.
    D: Membranes self-assemble without it.
- q: A tissue with cells widely separated in an abundant matrix is…
  options:
    A: Epithelial
    B: Muscle
    C: Nervous
    D: Connective
  answer: D
  explain: Sparse cells + dominant ECM defines connective tissue.
  distractors:
    A: Epithelium is a packed sheet.
    B: Muscle is bundled fibers.
    C: Nervous is a signaling network.
