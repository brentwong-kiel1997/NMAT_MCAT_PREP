subject: chemistry
chapter: Biochemistry
title: Biochemistry
overview: Chemistry inside living systems — protein structure, enzymes, metabolism, and regulation. The
  MCAT's biochem passages live here. Prerequisites — 5D biomolecules and 5E thermodynamics/kinetics.
sections:
- heading: Protein structure — four levels
  objectives:
  - Define each of the four levels of protein structure and its stabilising forces.
  - Predict how a given denaturant changes a protein's structure.
  - Summarise what the Anfinsen refolding experiment established.
  body:
  - ==Primary is sequence; secondary is local folding (alpha-helix, beta-sheet, held by backbone H-bonds);
    tertiary is the full 3D fold (hydrophobic effect, H-bonds, ion pairs, disulfides); quaternary is multi-subunit
    assembly==.
  - Denaturation unfolds structure without breaking peptide bonds — heat, pH extremes, detergents, reducing
    agents for disulfides. ==The Anfinsen experiment (ribonuclease refolding) established that primary
    sequence encodes the native fold== — the central dogma of protein folding.
  misconception: '"A denatured protein is destroyed — its peptide bonds are broken, so the damage is permanent
    and total." Denaturation disturbs the fold, not the backbone. Heat or extreme pH strips the secondary
    and tertiary structure while the sequence of amino acids survives intact — which is precisely why
    Anfinsen''s ribonuclease could refold spontaneously once the denaturant was removed. Only a reductant
    aimed at disulfide bridges, like beta-mercaptoethanol, touches a covalent link.'
  connection: 'Each structure level is one chapter of intermolecular forces applied: backbone hydrogen
    bonds hold the helix, the hydrophobic effect drives the core, ion pairs form salt bridges, and disulfides
    are the covalent staple. Chapter 5B · Molecules and intermolecular interactions supplies the force
    ladder; here it is deployed at four escalating scales.'
  connection_label: How sciences interconnect
  check:
  - q: Alpha-helices are stabilized primarily by…
    options:
      A: Disulfide bridges
      B: Hydrophobic interactions
      C: Backbone hydrogen bonds
      D: Peptide bond hydrolysis
    answer: C
    explain: C=O of one residue H-bonds to N-H four residues along the helix.
    distractors:
      A: Tertiary stabilizer.
      B: That drives tertiary fold.
      D: Destroys structure.
  - q: Beta-mercaptoethanol, a reducing agent, disrupts which feature of a protein?
    options:
      B: Disulfide bridges, reducing them to free thiols
      A: Backbone hydrogen bonds, melting the helices
      C: Peptide bonds, fragmenting the chain
      D: Hydrophobic core packing
    answer: B
    explain: Reducing agents cleave the S-S bond that locks tertiary structure together.
    distractors:
      A: Backbone H-bonds need heat or pH, not a reductant.
      C: Denaturation never hydrolyses the peptide backbone.
      D: Hydrophobic packing is disrupted by detergents or organic solvents.
- heading: Enzymes — catalysis and kinetics
  objectives:
  - Explain how catalysis changes rate without changing delta-G or K.
  - Characterise an enzyme using Km and Vmax.
  - Identify an inhibitor type from Km, Vmax, or a Lineweaver-Burk plot.
  body:
  - Enzymes lower activation energy by stabilizing the transition state — ==they raise kcat, never shift
    delta-G or K==. Michaelis-Menten — v = Vmax[S]/(Km + [S]). ==Km is the substrate concentration at
    half-Vmax== — low Km means high affinity.
  - Inhibition — competitive raises apparent Km (Vmax unchanged, overcome by more substrate); noncompetitive
    lowers Vmax (Km unchanged); uncompetitive lowers both. ==Lineweaver-Burk plots expose the pattern
    — competitive lines cross on the y-axis==.
  misconception: '"An enzyme makes the reaction more favourable, so it shifts the equilibrium toward more
    product." An enzyme changes only the speed. It lowers the activation energy by the same amount in
    both directions, so delta-G, K, and the final product-to-reactant ratio all stay exactly as they were
    — the system just arrives there faster. Equilibrium position is thermodynamic territory; a catalyst
    has no vote.'
  connection: 'Km and Vmax are the vocabulary every pharmacology chapter borrows: a drug that competes
    at an active site raises the apparent Km, which is why overdose can sometimes be out-competed by substrate
    or blocked by a different ligand. Chapter 5E · Chemical thermodynamics and kinetics supplies the Arrhenius
    reasoning underneath — the enzyme lowers Ea, nothing else.'
  connection_label: How sciences interconnect
  check:
  - q: A competitive inhibitor…
    options:
      A: Lowers Vmax
      B: Lowers Km
      C: Raises apparent Km
      D: Cannot be overcome
    answer: C
    explain: Substrate competes for the active site — more substrate restores Vmax but the Km shift persists.
    distractors:
      A: Vmax is unchanged.
      B: Wrong direction.
      D: It can be overcome by substrate.
  - q: An enzyme has Km = 4 mM and Vmax = 60 umol/min. At [S] = 4 mM the rate is…
    options:
      B: 30 umol/min
      A: 60 umol/min
      C: 15 umol/min
      D: 4 umol/min
    answer: B
    explain: '[S] = Km means half-saturation, so v = Vmax/2 = 30 umol/min.'
    distractors:
      A: Full saturation needs [S] far above Km.
      C: Dividing Vmax by Km instead of computing the fractional saturation.
      D: Quoting the Km value as though it were a rate.
- heading: Regulation — allostery and covalent modification
  objectives:
  - Explain cooperative binding and the sigmoid curve it produces.
  - Predict how an allosteric activator or inhibitor shifts the rate curve.
  - Distinguish reversible covalent modification from zymogen activation.
  body:
  - Allosteric enzymes show sigmoid kinetics — cooperativity (binding at one site shifts others). ==Allosteric
    effectors shift the curve — activators left, inhibitors right== without being overcome by substrate.
    Feedback inhibition — the pathway end product inhibits an early committed step.
  - Covalent modification — phosphorylation by kinases, dephosphorylation by phosphatases — flips activity
    in seconds. ==Zymogens are inactive enzyme precursors activated by proteolysis (trypsinogen to trypsin)==
    — irreversible but amplifying.
  misconception: '"Every inhibitor competes with the substrate at the active site, so more substrate should
    always overcome it." Only competitive inhibition works that way. An allosteric inhibitor binds elsewhere
    and changes the enzyme''s shape; piling on substrate cannot displace it because nothing is competing
    for the same site. That is the diagnostic difference — competitive is out-run by substrate, allosteric
    is not.'
  connection: 'Zymogen activation is the gut''s safety design: the pancreas manufactures trypsinogen and
    amylase precursors in an inactive form precisely so that premature activation inside the pancreas
    cannot digest the organ itself. Acute pancreatitis is what happens when that safeguard fails — the
    zymogens activate in the wrong place, and the amplifying one-way cascade the check describes turns
    on its own tissue.'
  connection_label: Real-world connection
  check:
  - q: Sigmoid (rather than hyperbolic) kinetics indicates…
    options:
      A: Denaturation
      B: Competitive inhibition
      C: Zero-order
      D: Cooperative binding
    answer: D
    explain: Multiple sites communicate — binding at one raises affinity at the rest.
    distractors:
      A: Denaturation kills activity.
      B: Competitive keeps hyperbolic shape.
      C: Order is unrelated.
  - q: Trypsinogen is cleaved to trypsin in the gut. This is an example of…
    options:
      A: Irreversible proteolytic activation of a zymogen
      B: Reversible allosteric activation by a small molecule
      C: Competitive inhibition overcome by more substrate
      D: Feedback inhibition by the pathway's end product
    answer: A
    explain: Proteolysis cuts the inactive precursor into the active enzyme — one-way and amplifying.
    distractors:
      B: Allostery is noncovalent and reversible.
      C: Nothing here is competing at an active site.
      D: Feedback inhibition slows a pathway; this switches one on.
- heading: Metabolism overview — the energy map
  objectives:
  - Trace glucose through glycolysis, the TCA cycle, and oxidative phosphorylation.
  - Tally the ATP and reduced cofactors each stage yields.
  - Explain why fermentation regenerates NAD+.
  body:
  - Glycolysis — glucose to 2 pyruvate, cytosol, ==net 2 ATP + 2 NADH==; investment phase spends 2 ATP,
    payoff makes 4. Pyruvate enters mitochondria — acetyl-CoA, then the TCA cycle (2 ATP/GTP, 6 NADH,
    2 FADH2 per glucose's two turns), then oxidative phosphorylation.
  - ==Total aerobic yield about 30-32 ATP per glucose==. NADH feeds about 2.5 ATP, FADH2 about 1.5 through
    the electron transport chain. Fermentation regenerates NAD+ when oxygen is absent — lactate (muscle)
    or ethanol plus CO2 (yeast).
  misconception: '"Glycolysis makes 4 ATP, so that is its yield — the investment phase is a detail." The
    gross figure is 4, but the cell spent 2 ATP priming the glucose before the payoff phase began, and
    the net that matters is 2. The same accounting discipline gives the aerobic total of 30-32: add substrate-level
    phosphorylation and the NADH/FADH2 harvests, and subtract what was already paid.'
  connection: 'The 30-32 ATP per glucose figure is this chapter''s link to the electron-transport physics
    in chapter 1D · Bioenergetics and fuel metabolism: each NADH pumps enough protons across the inner
    membrane to drive roughly 2.5 ATP synthase turnovers, each FADH2 about 1.5. The chemiosmotic gradient
    is the intermediate currency that converts redox energy into ATP.'
  connection_label: How sciences interconnect
  check:
  - q: The net ATP from glycolysis alone per glucose is…
    options:
      A: 30-32
      B: '4'
      C: 36-38
      D: '2'
    answer: D
    explain: 4 made minus 2 invested in the priming phase.
    distractors:
      A: Full aerobic total.
      B: Gross, not net.
      C: Older textbook total.
  - q: A cell can only ferment. Its net ATP per glucose is…
    options:
      B: 2 — glycolysis alone
      A: 30-32 — the full aerobic yield
      C: 4 — the gross glycolytic yield
      D: 0 — no ATP forms without oxygen
    answer: B
    explain: Without oxygen there is no oxidative phosphorylation, so only glycolysis' net 2 ATP remain.
    distractors:
      A: That total needs the electron transport chain and oxygen.
      C: The investment phase has to be paid back out of the four.
      D: Substrate-level phosphorylation in glycolysis needs no oxygen at all.
  figures:
  - src: biochemistry/fig-30c947dd.webp
    caption: Mitochondrion architecture — electron transport chain and ATP synthase embedded in the inner
      membrane.
    credit: Ch 7 · OpenStax Biology 2e — CC BY-NC-SA 4.0
  - src: biochemistry/fig-372c7a31.webp
    caption: Substrate-level phosphorylation — an enzyme transfers a phosphate group to ADP, making ATP.
    credit: Ch 7 · OpenStax Biology 2e — CC BY-NC-SA 4.0
- heading: Metabolic regulation and integration
  objectives:
  - Identify the committed step that controls each metabolic pathway.
  - Predict the hormonal shift between fed and fasting metabolism.
  - Explain how the Cori cycle recycles muscle lactate.
  body:
  - Key control points match committed steps — ==phosphofructokinase (glycolysis, inhibited by ATP and
    citrate, activated by AMP), pyruvate dehydrogenase (acetyl-CoA entry), isocitrate dehydrogenase (TCA)==.
    Hormones overlay the local control — insulin (fed, promote storage) versus glucagon and epinephrine
    (fasting, mobilize).
  - Fed versus fasting states re-route traffic — liver buffers blood glucose, adipose stores or releases
    fatty acids, muscle takes glucose or burns fat. ==The Cori cycle and the glucose-alanine cycle move
    muscle intermediates back to the liver for gluconeogenesis==.
  misconception: '"Insulin and glucagon act at every step of every pathway, so metabolism is one big hormonal
    switch." Hormones set the direction; the local metabolites do the moment-to-moment throttling. PFK-1
    responds to ATP, citrate, and AMP within seconds regardless of what insulin is doing — the hormone
    shifts the enzyme''s sensitivity through fructose-2,6-bisphosphate rather than commanding it directly.
    Two control layers, operating on different clocks.'
  connection: 'The control-point logic here is biochemistry''s answer to feedback control in chapter Life
    Processes: Regulation and Homeostasis — a committed, irreversible step is the valve, and the pathway''s
    end product is the signal that closes it. Insulin and glucagon are the hormonal overlay the same chapter
    describes as endocrine regulation.'
  connection_label: How sciences interconnect
  check:
  - q: PFK-1 is inhibited by…
    options:
      A: AMP
      B: Fructose-2,6-bisphosphate
      C: Insulin
      D: ATP and citrate
    answer: D
    explain: High energy charge and abundant citrate signal that glycolysis should slow.
    distractors:
      A: AMP activates — low energy.
      B: F2,6BP activates PFK-1 strongly.
      C: Insulin works upstream.
  - q: During a fast, the liver's main contribution to blood glucose is…
    options:
      B: Generating and exporting glucose via glycogenolysis and gluconeogenesis
      A: Storing glucose as glycogen under insulin drive
      C: Converting glucose into fat for adipose storage
      D: Taking up fatty acids from the blood for storage
    answer: B
    explain: Glucagon signalling makes the liver a glucose producer, protecting the brain's supply.
    distractors:
      A: Glycogen storage is the fed-state response.
      C: Lipogenesis is a fed-state activity.
      D: In the fast, adipose releases fatty acids rather than taking them up.
examples:
- prompt: An enzyme has Km = 2 mM and Vmax = 100 umol/min. At [S] = 6 mM, what fraction of Vmax is observed?
  strategy: Michaelis-Menten is a ratio, so compute the fractional velocity first — [S]/(Km + [S]) — and
    only then multiply by Vmax. Recognising that [S] = 3Km pins the fraction at 0.75 turns the item into
    a one-line recognition rather than arithmetic; the same recognition at [S] = Km gives 0.50.
  solution:
  - Michaelis-Menten — v = Vmax[S]/(Km + [S]).
  - v/Vmax = 6 / (2 + 6) = 6/8 = 0.75.
  - When [S] = 3Km, the rate is always 75% of Vmax.
  answer: 75 umol/min — 0.75 Vmax.
  discussion: '75% at three times Km shows how slowly the curve approaches its ceiling — even at ten times
    Km the enzyme is only about 91% saturated, which is why Vmax is an extrapolation rather than a measurement.
    Run the same formula backwards to read Km off a curve: it is the substrate concentration giving exactly
    half of Vmax. Check the limits as a habit — the fraction must be 0.5 at [S] = Km and must approach
    1 as [S] grows without bound.'
  distractors:
    A: Assuming saturation — that needs [S] >> Km.
    B: 50% only holds at [S] = Km.
    C: Computing 6/(6-2) or similar ratio errors.
  practice:
    q: An enzyme has Km = 5 mM and Vmax = 80 umol/min. At [S] = 5 mM the rate is…
    options:
      C: 40 umol/min
      A: 80 umol/min
      B: 20 umol/min
      D: 5 umol/min
    answer: C
    explain: '[S] = Km gives half-saturation: v = 0.50 x 80 = 40 umol/min.'
    distractors:
      A: Saturation requires substrate far in excess of Km.
      B: Quartering rather than halving the maximum rate.
      D: Quoting the Km as though it were a rate.
key_equations:
- latex: $v = \frac{V_{max}[S]}{K_m + [S]}$
  symbols: v reaction rate, V_max maximum rate, [S] substrate concentration, K_m Michaelis constant
  when: Michaelis-Menten — at [S] = Km the rate is exactly half of Vmax
- latex: $\text{rate} = \frac{k_{cat}[E]_{tot}[S]}{K_m + [S]}$
  symbols: k_cat turnover number, [E]_tot total enzyme concentration
  when: when the enzyme concentration is known — kcat/Km compares enzyme efficiency
- latex: $\text{ATP}_{aerobic} \approx 30\text{-}32\ \text{per glucose}$
  symbols: net ATP from glycolysis (2), TCA (2 GTP), and oxidative phosphorylation (26-28)
  when: full aerobic tally — fermentation alone leaves only the glycolytic net of 2
- latex: $\text{NADH} \approx 2.5\ \text{ATP};\ \ \text{FADH}_{2} \approx 1.5\ \text{ATP}$
  symbols: reduced cofactor entering the electron transport chain
  when: oxidative phosphorylation yields — NADH enters at complex I, FADH2 at complex II
- latex: $\Delta G_{coupled} = \Delta G_{1} + \Delta G_{2}$
  symbols: free energies of the coupled steps
  when: how ATP hydrolysis (~ -30 kJ/mol) drives an unfavourable biosynthetic step
key_points:
- Four structure levels; denaturation spares peptide bonds.
- Enzymes lower Ea — Vmax and Km diagnostics of inhibition type.
- Allosteric enzymes are sigmoid; covalent modification flips activity fast.
- Glycolysis nets 2 ATP + 2 NADH; full aerobic yield 30-32 ATP.
- PFK-1 is the glycolytic control point — ATP/citrate inhibit, AMP activates.
- Fed state stores (insulin); fasting mobilizes (glucagon).
mnemonics:
- phrase: Competitive crosses the y-axis, noncompetitive shares the x-axis
  means: Lineweaver-Burk signature of each inhibition type.
- phrase: Km low, affinity high
  means: Less substrate needed to reach half-Vmax.
maps:
- title: Glucose fate with oxygen
  steps:
  - glycolysis (cytosol) — 2 ATP, 2 NADH
  - pyruvate dehydrogenase — acetyl-CoA
  - TCA cycle (2 turns) — 2 GTP, 6 NADH, 2 FADH2
  - oxidative phosphorylation — ~26-28 ATP
- title: Inhibition fingerprints
  steps:
  - competitive — Km up, Vmax same
  - noncompetitive — Vmax down, Km same
  - uncompetitive — both down, parallel Lineweaver-Burk
passage:
  text: A researcher measures an enzyme's rate versus substrate concentration with and without inhibitor
    X. Without inhibitor, Km = 1 mM, Vmax = 40. With X, the apparent Km = 3 mM and Vmax = 40. Double-reciprocal
    plots with and without X intersect on the y-axis.
  questions:
  - q: X is a…
    options:
      A: Competitive inhibitor
      B: Noncompetitive inhibitor
      C: Uncompetitive inhibitor
      D: Allosteric activator
    answer: A
    explain: Km rises, Vmax unchanged, y-axis intersection — the competitive signature.
    distractors:
      B: Noncompetitive cuts Vmax.
      C: Uncompetitive lowers both.
      D: An activator would do the opposite.
  - q: The inhibitor most likely binds…
    options:
      A: The active site
      B: An allosteric site only
      C: The substrate
      D: The product
    answer: A
    explain: Competitive inhibitors are active-site look-alikes competing with substrate.
    distractors:
      B: Allosteric binding gives noncompetitive patterns.
      C: Substrate does not inhibit itself here.
      D: Product inhibition can be competitive but the data says active site.
  - q: Raising [S] to 100 mM in the presence of X would…
    options:
      A: Restore Vmax
      B: Lower Vmax further
      C: Not change rate
      D: Denature the enzyme
    answer: A
    explain: Excess substrate outcompetes the inhibitor — Vmax is reachable.
    distractors:
      B: Vmax was never reduced.
      C: Rate keeps climbing with [S].
      D: Concentration is not denaturing.
pitfalls:
- Saying enzymes change delta-G or equilibrium — they do not.
- Gross (4) instead of net (2) glycolysis ATP.
- Confusing noncompetitive with uncompetitive.
- Forgetting that Km reflects affinity only when kcat is similar.
- Attributing sigmoid kinetics to Michaelis-Menten enzymes.
exam_map:
  NMAT: Enzyme basics, metabolic pathway order, ATP yields.
  MCAT: Passage core — kinetics interpretation, regulation logic, pathway integration under fed/fasted
    states.
