review_questions:
- q: Enzymes accelerate reactions by…
  options:
    A: Lowering delta-G
    B: Lowering Ea
    C: Raising K
    D: Heating the cell
  answer: B
  explain: Transition-state stabilization — thermodynamic quantities untouched.
  distractors:
    A: Delta-G is a state function.
    C: K is temperature-only.
    D: Not thermal.
- q: NADH yields about how many ATP via oxidative phosphorylation?
  options:
    A: '1'
    B: '1.5'
    C: '2.5'
    D: '5'
  answer: C
  explain: Complex I entry — enough proton pumping for ~2.5 ATP.
  distractors:
    A: That is FADH2.
    B: FADH2 again.
    D: Overcount.
- q: Which is a zymogen?
  options:
    A: Trypsin
    B: Trypsinogen
    C: Amylase
    D: Pepsin
  answer: B
  explain: Inactive precursor — cleaved to active trypsin in the gut.
  distractors:
    A: Already active.
    C: Secreted active.
    D: Activated counterpart.
- q: During fasting, the liver primarily…
  options:
    A: Stores glucose as glycogen
    B: Performs gluconeogenesis
    C: Synthesizes fat from glucose
    D: Uptakes fatty acids
  answer: B
  explain: Glucagon drives glucose output to protect blood glucose for the brain.
  distractors:
    A: That is the fed state.
    C: Fed state.
    D: Adipose releases fat to the liver.
