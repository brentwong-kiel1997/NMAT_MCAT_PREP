review_questions:
- q: Which pair is isoelectronic (same electron count)?
  options:
    A: Na+ and K+
    B: Na+ and Ne
    C: Na+ and Mg
    D: Cl- and Na
  answer: B
  explain: Na+ lost one electron from 11 to 10 electrons; Ne has 10.
  distractors:
    A: Na+ has 10 electrons, K+ has 18.
    C: Mg has 12 electrons.
    D: Cl- has 18 electrons.
- q: What is the molecular geometry of CO2?
  options:
    A: Linear
    B: Bent
    C: Trigonal planar
    D: Tetrahedral
  answer: A
  explain: Two electron domains, no lone pairs — 180 degrees linear.
  distractors:
    B: Bent requires lone pairs — that is H2O.
    C: Trigonal planar requires three domains.
    D: Tetrahedral requires four domains.
- q: How many grams of NaCl for 250 mL of 0.5 M solution?
  options:
    A: 7.3 g
    B: 14.6 g
    C: 29.2 g
    D: 58.5 g
  answer: A
  explain: 0.5 mol/L times 0.250 L = 0.125 mol times 58.5 g/mol = 7.3 g.
  distractors:
    B: That is 250 mL of 1.0 M.
    C: That is 500 mL of 1.0 M.
    D: That is one full mole.
- q: Which is a strong acid?
  options:
    A: CH3COOH
    B: HF
    C: HNO3
    D: NH3
  answer: C
  explain: HNO3 dissociates completely.
  distractors:
    A: Acetic acid — weak.
    B: Hydrofluoric acid — weak.
    D: Ammonia is a weak base.
