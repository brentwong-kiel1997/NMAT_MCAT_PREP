review_questions:
- q: Which quantum number determines the shape of an orbital?
  options:
    A: l
    B: ml
    C: ms
    D: n
  answer: A
  explain: l = 0 gives s (spherical), l = 1 gives p (dumbbell), l = 2 gives d (lobed).
  distractors:
    B: ml determines orientation.
    C: ms is spin.
    D: n determines size/energy.
- q: What particle is emitted in alpha decay?
  options:
    A: An electron
    B: A helium-4 nucleus
    C: A photon
    D: A positron
  answer: B
  explain: Two protons + two neutrons = helium-4 nucleus.
  distractors:
    A: That is beta-minus.
    C: That is gamma.
    D: That is beta-plus.
- q: The Balmer series lines correspond to electronic transitions ending at…
  options:
    A: n = 1
    B: n = 2
    C: n = 3
    D: n = 4
  answer: B
  explain: Transitions ending at n = 2 produce the visible spectrum.
  distractors:
    A: That is Lyman (UV).
    C: That is Paschen (IR).
    D: That is Brackett.
- q: A sample of 160 mg decays to 20 mg. How many half-lives elapsed?
  options:
    A: '2'
    B: '3'
    C: '4'
    D: '5'
  answer: B
  explain: 160 -> 80 -> 40 -> 20 = 3 half-lives.
  distractors:
    A: 160/4 = 40, not 20.
    C: 160/16 = 10, not 20.
    D: 160/32 = 5, not 20.
