subject: chemistry
chapter: 4E · Atoms, nuclear decay, electronic structure
title: 4E · Atoms, Nuclear Decay, Electronic Structure
overview: This chapter covers what makes atoms tick at the deepest MCAT level — quantum numbers and orbital
  shapes, nuclear decay with half-life math, and the electronic transitions that produce atomic spectra.
  NMAT tests notation and simple decay balancing; the MCAT runs passage experiments on spectra and half-life
  curves.
sections:
- heading: Quantum numbers and orbital shapes
  objectives:
  - Assign the four quantum numbers to any electron in an atom.
  - Predict an orbital's capacity from l and the Pauli principle.
  - Order subshell filling with the Aufbau sequence, including the 4s/3d order.
  body:
  - Four quantum numbers define every electron — n (shell, 1 to infinity), l (subshell, 0 to n-1, labeled
    s/p/d/f), ml (orientation, -l to +l), and ms (spin, plus or minus one-half). The ==Pauli principle
    follows — no two electrons in an atom share all four numbers==, which is why each orbital holds exactly
    two.
  - Orbital shapes — s is spherical, p is dumbbell along x/y/z axes, d has four lobes (except dz2). Within
    a shell, energy follows s < p < d < f. Across periods, d and f orbitals fill after the next s — the
    4s fills before 3d, and 3d fills before 4p. This explains chromium's half-filled stability and copper's
    filled 3d10 exception.
  misconception: '"Shells fill in size order, so the bigger 3d orbitals must fill before the smaller 4s."
    Electrons fill by ENERGY, not by size. The 4s sits just below 3d in energy, so it fills first — and
    that crossover is exactly what produces chromium''s half-filled d subshell and copper''s filled 3d10
    exception. A full shell number tells you the capacity, not the filling order.'
  connection: 'This filling order is the periodic table''s architecture: each block of the table is a
    subshell taking on electrons, which is why the table''s shape is what it is and why trends run the
    way they do. Chapter General Chemistry turns that structure into the trend map — radius, ionization
    energy, electronegativity — that every later chemistry chapter leans on.'
  connection_label: How sciences interconnect
  check:
  - q: What is the maximum number of electrons in a 3d subshell?
    options:
      A: '2'
      B: '6'
      C: '14'
      D: '10'
    answer: D
    explain: d has 5 orbitals times 2 electrons each = 10.
    distractors:
      A: That is one orbital.
      B: That is p (3 orbitals).
      C: That is f (7 orbitals).
  - q: How many orbitals are in the n = 4 shell?
    options:
      A: '16'
      B: '4'
      C: '32'
      D: '9'
    answer: A
    explain: n = 4 allows l = 0, 1, 2, 3 — that is 1 + 3 + 5 + 7 = 16 orbitals (32 electrons).
    distractors:
      B: Counting subshells (s, p, d, f) rather than the orbitals inside them.
      C: Quoting the electron capacity rather than the orbital count.
      D: Counting only s, p, and d — the n = 3 shell.
- heading: Nuclear notation and isotopes
  objectives:
  - Write and interpret nuclear notation for isotopes and for ions.
  - Determine proton, neutron, and electron counts from A, Z, and charge.
  - Relate mass defect to binding energy through E = mc2.
  body:
  - Write isotopes as upper-left mass number, lower-left atomic number, symbol. Carbon-14 is 14/6 C. The
    ==number of neutrons = A minus Z==. For ions, the electron count changes but the nucleus does not
    — O2- still has 8 protons and 8 neutrons; it just has 10 electrons.
  - Mass defect and binding energy explain why nuclear masses are less than the sum of their parts — E
    = mc2 converts the missing mass to binding energy. Iron-56 has the highest binding energy per nucleon;
    lighter nuclei fuse, heavier nuclei fission, both releasing energy toward iron.
  misconception: '"An oxide ion has extra neutrons, because gaining a 2- charge means the nucleus gained
    two particles." Charge lives entirely in the electron count. O2- still has 8 protons and 8 neutrons
    — the nucleus never moves in ordinary chemistry; it simply carries 10 electrons instead of 8. Isotopes
    change the neutron number, ions change the electron number, and the two are independent.'
  connection: 'That division of labour is the whole basis of bonding in chapter General Chemistry: nuclei
    stay fixed while valence electrons are transferred or shared, and every ionic charge, oxidation number,
    and covalent bond you will draw is bookkeeping on the electron side alone. When a later chapter says
    an atom ''gains'' something, check whether it means mass or charge before you count nucleons.'
  connection_label: How sciences interconnect
  check:
  - q: An isotope has A = 39, Z = 19. How many neutrons?
    options:
      A: '20'
      B: '58'
      C: '39'
      D: '19'
    answer: A
    explain: A - Z = 39 - 19 = 20 neutrons (potassium-39).
    distractors:
      B: That is A + Z.
      C: That is the mass number.
      D: That is the proton count.
  - q: The oxide ion 16/8 O2- contains…
    options:
      C: 8 protons, 8 neutrons, 10 electrons
      A: 8 protons, 8 neutrons, 8 electrons
      B: 8 protons, 16 neutrons, 10 electrons
      D: 10 protons, 6 neutrons, 8 electrons
    answer: C
    explain: Z = 8 protons never change; N = A - Z = 8; the 2- charge adds two electrons for 10.
    distractors:
      A: Ignoring the charge, which is what makes it an ion.
      B: Taking A as the neutron count instead of subtracting Z.
      D: Treating the charge as a nuclear change — electrons, not protons, move.
- heading: Nuclear decay — alpha, beta, gamma
  objectives:
  - Balance a nuclear equation for alpha, beta, or gamma decay.
  - Predict how A and Z change in each decay mode.
  - Calculate the activity remaining after a given number of half-lives.
  body:
  - ==Alpha decay emits a helium-4 nucleus== (A decreases by 4, Z decreases by 2). Beta-minus decay emits
    an electron from neutron conversion (Z increases by 1, A unchanged). Gamma emission releases a photon
    with no particle change. Positron emission (beta-plus) converts a proton to a neutron (Z decreases
    by 1).
  - Half-life is the time for half the sample to decay — it is exponential and independent of the starting
    amount. After n half-lives, the remaining fraction is (1/2)n. ==Carbon-14 dating uses this — the ratio
    of C-14 to C-12 reveals when an organism died==, with a half-life of 5,730 years.
  misconception: '"A bigger sample decays faster, so a large stockpile will be completely gone much sooner."
    Size changes the activity, not the half-life. Every nucleus has the same fixed probability of decaying
    per unit time, so half of ANY amount disappears in one half-life — 400 mg and 4 mg both fall to half
    in 6 hours in the passage. Bigger samples lose more mass per minute but finish on exactly the same
    schedule.'
  connection: The scheduling question in the passage is daily hospital routine. A radiopharmacy calibrates
    a dose for the injection time, and the exponential keeps running whether or not the patient is ready
    — which is why a delayed scan means either a re-ordered dose or a recalculation of the activity still
    on hand. Radiocarbon dating runs the identical curve on a 5,730-year clock instead of a 6-hour one.
  connection_label: Real-world connection
  check:
  - q: A radioactive isotope has a half-life of 8 days. What fraction remains after 24 days?
    options:
      A: 1/8
      B: 1/16
      C: 1/2
      D: 1/4
    answer: A
    explain: 24 / 8 = 3 half-lives. (1/2)3 = 1/8.
    distractors:
      B: That is four half-lives.
      C: That is one half-life.
      D: That is two half-lives.
  - q: 226/88 Ra undergoes alpha decay. The daughter nuclide is…
    options:
      C: 222/86 Rn
      A: 226/86 Rn
      B: 222/87 Fr
      D: 230/90 Th
    answer: C
    explain: 'Alpha decay takes A down by 4 and Z down by 2: 226/88 -> 222/86.'
    distractors:
      A: Lowering Z without lowering A.
      B: Raising Z, which is beta-minus, not alpha.
      D: Adding to A and Z — that would be capture, not decay.
  figures:
  - src: 4e-atoms-nuclear-decay-electronic-structure/4e-1a783933.webp
    caption: Nuclear stability and decay modes — the valley of stability.
    credit: Fig 21.1 · OpenStax Chemistry 2e — CC BY-NC-SA 4.0
  - src: 4e-atoms-nuclear-decay-electronic-structure/4e-539d41aa.webp
    caption: Nuclear equations — balancing alpha and beta decay.
    credit: Fig 21.2 · OpenStax Chemistry 2e — CC BY-NC-SA 4.0
- heading: Electronic transitions and atomic spectra
  objectives:
  - Relate a transition's energy gap to the photon's frequency and wavelength.
  - Identify which spectral series falls in which region of the spectrum.
  - Predict from the photoelectric effect whether electrons are ejected.
  body:
  - Electrons absorb energy and jump to higher levels; they emit photons when they fall back. The photon
    energy equals the gap — ==E = hf = hc/wavelength==. The Lyman series (to n=1) is ultraviolet; the
    Balmer series (to n=2) includes visible lines; the Paschen series (to n=3) is infrared.
  - The photoelectric effect confirms the particle nature of light — below the threshold frequency, no
    electrons are emitted regardless of intensity. Above threshold, the kinetic energy of emitted electrons
    increases linearly with frequency; intensity controls only the rate. This is why the MCAT pairs spectra
    with photon-energy calculations.
  misconception: '"Higher levels are farther apart, so a jump from n = 3 to n = 4 releases more energy
    than a jump from n = 1 to n = 2." The spacing works the other way round: the levels converge as n
    grows, so the widest gaps sit at the bottom. That is why the Lyman series (down to n = 1) lands in
    the ultraviolet while the Paschen series (down to n = 3) slips into the infrared.'
  connection: The photon arithmetic here is the same one that orders the whole electromagnetic spectrum
    in chapter 4D · Light and sound interacting with matter — E = hf = hc/lambda ties a transition's energy
    to the region of the spectrum its line lands in. That single equation is why atomic spectra can be
    read with an ultraviolet lamp, a visible spectroscope, or an infrared detector, depending on which
    gaps the element happens to offer.
  connection_label: How sciences interconnect
  check:
  - q: An electron falls from n = 3 to n = 2 in hydrogen. This emits a photon in the…
    options:
      A: Ultraviolet
      B: X-ray
      C: Infrared
      D: Visible
    answer: D
    explain: The Balmer series ends at n = 2 and includes the visible H-alpha (red) line.
    distractors:
      A: Lyman series (to n = 1) is UV.
      B: X-rays are inner-shell transitions in heavy atoms.
      C: Paschen series (to n = 3) is IR.
  - q: An electron climbs from n = 1 to n = 4 in hydrogen. Compared with a climb from n = 1 to n = 2,
      the absorbed photon has…
    options:
      A: Higher energy and shorter wavelength
      B: Lower energy and longer wavelength
      C: The same energy, since both start at n = 1
      D: Higher energy but longer wavelength
    answer: A
    explain: 'The n = 4 level sits higher, so the gap is larger: E = hf, and higher frequency means shorter
      wavelength.'
    distractors:
      B: Assuming the higher final level means a smaller jump — the levels converge upward, not downward.
      C: The starting level alone does not fix the energy; the gap does.
      D: Energy and wavelength move inversely — E = hc/lambda.
- heading: Absorption and emission spectroscopy
  objectives:
  - Distinguish absorption from emission spectra and what each displays.
  - Explain why every element's line spectrum is unique.
  - Apply the Beer-Lambert law to find an unknown concentration.
  body:
  - Absorption spectra show dark lines where atoms absorb specific wavelengths; emission spectra show
    bright lines where atoms emit at the same wavelengths. ==Every element has a unique line spectrum==
    — the fingerprint used in atomic absorption and emission spectroscopy.
  - The Beer-Lambert law connects absorbance to concentration — A = epsilon times b times c, where epsilon
    is molar absorptivity, b is path length, and c is molarity. This linear relationship is the basis
    for quantitative spectroscopy and is the MCAT's most common spectrophotometry setup.
  misconception: '"Beer-Lambert works at any concentration — just keep the line going and read off whatever
    absorbance you measure." The law is linear only over a limited range. At high concentration the absorbing
    species interact and scatter, the plot bends, and a straight-line read-out silently returns the wrong
    concentration. Dilute into range first; the pitfalls list calls this out because it is the standard
    way to lose marks on a spectroscopy passage.'
  connection: 'That slope is a clinical workhorse: a chemistry analyzer measures how much light a coloured
    product absorbs, then divides by the slope (epsilon times b) determined once from standards to report
    a concentration in mmol/L. The same division you performed on 0.40/(2000 x 1.0) is what turns an absorbance
    reading into a patient''s glucose or cholesterol value.'
  connection_label: Real-world connection
  check:
  - q: In a Beer-Lambert plot of absorbance versus concentration, the slope equals…
    options:
      A: Path length b
      B: Wavelength
      C: Concentration c
      D: Molar absorptivity epsilon times path length b
    answer: D
    explain: A = epsilon times b times c — the slope of A versus c is the product epsilon times b.
    distractors:
      A: Only b — epsilon is missing.
      B: Wavelength is fixed.
      C: That is the x-axis variable.
  - q: A sample has absorbance 0.40 in a 1.0 cm cuvette with molar absorptivity 2000 M-1 cm-1. Its concentration
      is…
    options:
      A: 2.0 x 10^-4 M
      B: 800 M
      C: 5.0 x 10^3 M
      D: 2.0 x 10^-2 M
    answer: A
    explain: A = epsilon b c, so c = A/(epsilon b) = 0.40/(2000 x 1.0) = 2.0 x 10^-4 M.
    distractors:
      B: Multiplying by epsilon b instead of dividing by it.
      C: Inverting the relation and computing epsilon/A.
      D: Using an absorptivity of 20 instead of 2000.
examples:
- prompt: Uranium-238 undergoes alpha decay followed by beta-minus decay. What is the daughter nuclide?
  strategy: 'Track the two numbers that define a nuclide through each step separately: alpha decay takes
    4 from A and 2 from Z, beta-minus leaves A untouched and adds 1 to Z. Write the intermediate nuclide
    after the first step before attempting the second, then confirm that both A and Z balance at the end
    — the answer is whichever daughter satisfies both.'
  solution:
  - 'Start: 238/92 U'
  - 'Alpha decay: A decreases by 4, Z decreases by 2 -> 234/90 Th'
  - 'Beta-minus: Z increases by 1, A unchanged -> 234/91 Pa'
  answer: Protactinium-234 (234/91 Pa).
  discussion: '234/91 Pa confirms both balances: A runs 238 to 234 and then stays put, while Z runs 92
    to 90 to 91. The physics behind the second step is worth stating — beta-minus converts a NEUTRON into
    a proton, which is how the daughter climbs back toward the valley of stability after the alpha step
    pushed it neutron-rich. Sanity check by mass and charge conservation every time; a daughter whose
    nucleons do not add up is not a possible product, whatever its symbol.'
  distractors:
    A: Stopping after alpha — 234/90 Th is the intermediate.
    B: Beta before alpha — wrong sequence.
    C: Beta-minus decreases Z instead of increasing — that is positron emission.
  practice:
    q: 222/86 Rn undergoes alpha decay followed by beta-minus decay. The final nuclide is…
    options:
      D: 218/85 At
      A: 218/84 Po
      B: 214/84 Po
      C: 222/85 At
    answer: D
    explain: 'Alpha: 222/86 -> 218/84 (Po). Beta-minus: Z +1 with A unchanged -> 218/85 (At).'
    distractors:
      A: Stopping after the alpha step.
      B: Subtracting 4 twice, as though two alpha decays occurred.
      C: Applying the beta-minus without the preceding alpha decay.
key_equations:
- latex: $N = A - Z$
  symbols: N neutron count, A mass number, Z proton number
  when: isotopes and ions — charge changes electrons, never the nucleus
- latex: $E = mc^{2}$
  symbols: E energy (J), m mass defect (kg), c = 3 x 10⁸ m/s
  when: mass defect to binding energy — iron-56 tops the binding-energy-per-nucleon curve
- latex: $^{A}_{Z}X \rightarrow \ ^{A-4}_{Z-2}Y + \alpha$
  symbols: A mass number, Z atomic number, X parent, Y daughter
  when: alpha decay — beta-minus instead takes Z up by 1 and leaves A unchanged
- latex: $N_{remains} = N_0\left(\frac{1}{2}\right)^{n}$
  symbols: N₀ starting amount, n number of half-lives elapsed
  when: half-life is independent of the starting amount — count halvings
- latex: $E = hf = \frac{hc}{\lambda}$
  symbols: E photon energy, h Planck's constant, f frequency, lambda wavelength
  when: electronic transitions — the photon energy equals the gap between levels
- latex: $KE_{max} = hf - \phi$
  symbols: KE_max maximum photoelectron energy, phi work function
  when: photoelectric effect — below the threshold frequency no electrons eject at any intensity
- latex: $A = \varepsilon b c$
  symbols: A absorbance, epsilon molar absorptivity (M⁻¹cm⁻¹), b path length (cm), c concentration (M)
  when: Beer-Lambert — linear in concentration; the A-vs-c plot's slope is epsilon b
- latex: $\text{subshell capacity} = 2(2l+1)$
  symbols: l subshell quantum number (s=0, p=1, d=2, f=3)
  when: d holds 10, p holds 6, f holds 14; a full shell holds 2n² electrons
key_points:
- Four quantum numbers (n, l, ml, ms) — Pauli forbids duplicates.
- s spherical, p dumbbell, d four-lobed; energy s < p < d < f within a shell.
- Neutrons = A - Z; mass defect converts to binding energy via E = mc2.
- 'Alpha: A -4, Z -2. Beta-minus: Z +1. Gamma: no change. Positron: Z -1.'
- Half-life is exponential — (1/2)n after n half-lives, independent of starting amount.
- E = hf; Lyman UV, Balmer visible, Paschen IR.
- 'Beer-Lambert: A = epsilon times b times c — linear in concentration.'
mnemonics:
- phrase: Alpha takes 4 and 2, Beta adds 1 to Z, Gamma changes nothing
  means: 'Alpha: A-4 Z-2; Beta-minus: Z+1; Gamma: no nuclear change.'
- phrase: After n half-lives, divide by 2 to the n
  means: (1/2)n remaining — 3 half-lives leaves 1/8.
maps:
- title: Nuclear decay chain
  steps:
  - 238/92 U
  - alpha decay -> 234/90 Th
  - beta-minus -> 234/91 Pa
  - continue through the series to lead-206
- title: Spectroscopy pipeline
  steps:
  - light source -> sample
  - atoms absorb or emit at characteristic wavelengths
  - detector measures intensity
  - Beer-Lambert converts absorbance to concentration
passage:
  text: A medical isotope has a half-life of 6 hours. A hospital receives a shipment labeled 400 mg at
    8 AM. Due to scheduling, the dose is not administered until 8 PM the same day. The radiologist wants
    to know the remaining activity and whether the sample is still above the minimum therapeutic threshold
    of 25 mg.
  questions:
  - q: How much of the isotope remains at 8 PM?
    options:
      A: 25 mg
      B: 50 mg
      C: 100 mg
      D: 200 mg
    answer: C
    explain: '8 AM to 8 PM is 12 h = 2 half-lives: 400 -> 200 -> 100 mg.'
    distractors:
      A: No decay applied.
      B: That skips the 100 mg step — 2 halvings, not 3.
      D: Overshoot.
  - q: Is the sample above the 25 mg threshold?
    options:
      A: No, it is exactly at 25
      B: No, it is below 25
      C: Yes, it is above 25
      D: Cannot be determined
    answer: C
    explain: 100 mg at 8 PM is well above the 25 mg threshold — yes.
    distractors:
      A: Indefinite — the decay law is exact here.
      B: Below 25 is false at either reading.
      D: The threshold comparison is direct.
  - q: After how many total hours would the sample drop to 25 mg?
    options:
      A: '12'
      B: '18'
      C: '24'
      D: '36'
    answer: C
    explain: '400 -> 25 mg is 4 halvings: 4 x 6 h = 24 h.'
    distractors:
      A: One halving only.
      B: That is 3 halvings = 50 mg remaining.
      D: Five halvings.
pitfalls:
- Confusing beta-minus (Z increases) with positron emission (Z decreases).
- Forgetting that half-life is independent of the amount present.
- Mixing up the Balmer (visible) and Lyman (UV) series.
- Counting neutrons as A + Z instead of A - Z.
- Applying Beer-Lambert outside its linear concentration range.
exam_map:
  NMAT: CEM items test notation, decay balancing, and half-life arithmetic directly.
  MCAT: Content Category 4E — passage experiments on photoelectric effect, line spectra identification,
    and half-life curves from data.
