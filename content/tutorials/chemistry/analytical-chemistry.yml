review_questions:
- q: Molality is defined as…
  options:
    A: Moles per liter of solution
    B: Grams per liter
    C: Moles per kilogram of solvent
    D: Moles per mole
  answer: C
  explain: Mass-based — independent of temperature.
  distractors:
    A: That is molarity.
    B: Not a standard unit.
    D: That is a mole fraction flavor.
- q: A good indicator for a weak acid-strong base titration has…
  options:
    A: pKa near 7
    B: pKa near the equivalence pH (basic)
    C: pKa near the acid's pKa
    D: Any pKa
  answer: B
  explain: The color change must bracket the equivalence point pH.
  distractors:
    A: That fits strong-strong.
    C: Half-equivalence is not where the jump is.
    D: Choice matters.
- q: Beer-Lambert absorbance is linear in…
  options:
    A: Path length only
    B: Concentration and path length
    C: Wavelength
    D: Transmittance
  answer: B
  explain: A = epsilon l c — both scale it directly.
  distractors:
    A: Concentration also.
    C: Wavelength sets epsilon.
    D: A = -log T — logarithmic, not linear.
- q: A systematic error is best reduced by…
  options:
    A: More trials
    B: Recalibration or correction
    C: Larger samples
    D: Better randomization
  answer: B
  explain: Bias does not average out — fix the instrument or method.
  distractors:
    A: Random error averages; bias persists.
    C: Helps sampling, not bias.
    D: Helps sampling.
