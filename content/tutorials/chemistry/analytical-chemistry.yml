subject: chemistry
chapter: Analytical Chemistry
title: Analytical Chemistry
overview: Measurement science — titrations, buffers, spectroscopy, and error analysis. NMAT loves acid-base
  calculations; the MCAT folds these tools into experimental passages. Prerequisites — general chemistry
  and 5A solution chemistry.
sections:
- heading: Solution concentration and stoichiometry
  objectives:
  - Calculate molarity and molality and choose the right one for the job.
  - Apply M1V1 = M2V2 to a dilution.
  - Identify the limiting reagent from solution stoichiometry.
  body:
  - Molarity M = moles solute per liter solution; molality m = moles per kilogram solvent (temperature-independent,
    used for colligative properties). ==Dilution follows M1V1 = M2V2== — moles are conserved, concentration
    falls with volume.
  - Solution stoichiometry converts between reagents through mole ratios exactly as mass stoichiometry
    does — ==the limiting reagent is whichever produces less product==. Titration math is just stoichiometry
    at the equivalence point.
  misconception: '"Diluting a solution removes solute, so there are fewer moles of NaCl in the flask afterwards."
    Dilution adds solvent, nothing else. The moles are conserved exactly — M1V1 = M2V2 is just that statement
    rearranged — so 45 mL of 0.20 M (0.0090 mol) is still 0.0090 mol at 150 mL, only spread through more
    liquid. What falls is the concentration, never the amount.'
  connection: 'The distinction matters clinically: an IV dose is prescribed in moles (milligrams of drug)
    but prepared as a concentration, so dilution arithmetic decides how many millilitres to inject. Get
    molarity and molality mixed up — the one per litre of solution, the other per kilogram of solvent
    — and the same slip appears in the colligative-property work of chapter 5A · Unique nature of water
    and its solutions.'
  connection_label: How sciences interconnect
  check:
  - q: 45 mL of 0.20 M NaCl is diluted to 150 mL. The new molarity is…
    options:
      A: 0.15 M
      B: 0.67 M
      C: 0.20 M
      D: 0.060 M
    answer: D
    explain: M2 = M1V1/V2 = 0.20 x 45 / 150 = 0.060 M.
    distractors:
      A: That is closer to undiluted.
      B: That is concentration going up.
      C: Unchanged only if volume unchanged.
      D: Correct arithmetic.
  - q: How many moles of solute are in 250 mL of 0.40 M KBr?
    options:
      D: 0.10 mol
      A: 0.0010 mol
      B: 0.625 mol
      C: 1.0 mol
    answer: D
    explain: n = M V = 0.40 x 0.250 L = 0.10 mol.
    distractors:
      A: Reading the millilitres as litres.
      B: Dividing the molarity by the volume.
      C: Slipping a power of ten in the molarity (4.0 instead of 0.40).
- heading: Acid-base titrations
  objectives:
  - Locate the equivalence point from a mole balance of acid and base.
  - Predict the equivalence pH for each acid-base pairing.
  - Read a titration curve to extract pKa at half-equivalence.
  body:
  - At the equivalence point, moles of acid equal moles of base. ==Strong acid + strong base gives pH
    7 at equivalence==; weak acid + strong base ends basic (conjugate base dominates); weak base + strong
    acid ends acidic.
  - The half-equivalence point is special — ==pH there equals pKa==, because [HA] = [A-]. Indicators are
    weak acids whose color change spans about pKa +/- 1 — pick one whose range brackets the expected equivalence
    pH.
  misconception: '"The equivalence point always lands on pH 7, because neutralization means neutral."
    Only when a strong acid meets a strong base. Titrating a weak acid with a strong base leaves the CONJUGATE
    BASE of that acid in solution at equivalence, and it hydrolyses to make the pH basic — about 8.7 for
    acetic acid. Neutral is a special case, not the definition of equivalence, which is purely a mole
    balance.'
  connection: 'That mole balance at equivalence is the assay behind most water-quality and food-acidity
    numbers you see quoted. A titration is simply a controlled reaction run to exact completion: measure
    the titrant volume, multiply by its molarity, and the unknown concentration falls out — which is why
    the arithmetic here, not the glassware, is the exam point.'
  connection_label: Real-world connection
  check:
  - q: Titrating acetic acid (pKa 4.76) with NaOH, the pH at half-equivalence is…
    options:
      A: '9.24'
      B: '2.38'
      C: '7.00'
      D: '4.76'
    answer: D
    explain: At half-equivalence [HA] = [A-] and pH = pKa.
    distractors:
      A: That is beyond equivalence.
      B: Half of pKa is not the rule.
      C: Equivalence for weak acid is basic (~8.7); half-equivalence is pKa.
      D: Correct — equal HA and A- gives pH = pKa.
  - q: 35.0 mL of 0.100 M HCl is titrated with 0.200 M NaOH. The volume of base at equivalence is…
    options:
      A: 17.5 mL
      B: 35.0 mL
      C: 70.0 mL
      D: 8.75 mL
    answer: A
    explain: Moles acid = 0.100 x 0.0350 = 3.50 x 10^-3 mol; V = n/M = 3.50 x 10^-3 / 0.200 = 0.0175 L.
    distractors:
      B: Assuming equal volumes, which holds only at equal concentrations.
      C: Doubling when the base is twice as concentrated — it should be halved.
      D: Inverting the concentration ratio and dividing by four.
  figures:
  - src: analytical-chemistry/fig-457d4944.webp
    caption: Titration curves for weak versus strong acid with 0.100 M NaOH — equivalence pH 8.72 vs 7.00,
      with indicator ranges overlaid.
    credit: Ch 14 · OpenStax Chemistry 2e — CC BY-NC-SA 4.0
- heading: Buffers
  objectives:
  - Compose a buffer from a weak acid and its conjugate base.
  - Predict the pH shift when strong acid or base is added.
  - Explain what sets a buffer's working range and its capacity.
  body:
  - 'A buffer resists pH change — a weak acid plus its conjugate base. ==Henderson-Hasselbalch: pH = pKa
    + log([A-]/[HA])==. Buffers are most effective when pH is within pKa +/- 1, where both species are
    substantial.'
  - Capacity comes from absolute amounts — more moles absorb more added acid or base. ==Adding a small
    amount of strong acid converts A- to HA==; the ratio shifts one notch rather than the pH jumping,
    which is the whole point.
  misconception: '"A buffer keeps pH perfectly constant — that is what ''resists change'' means." Resist
    is not prevent. Added strong acid consumes A- and makes HA, so the ratio inside the Henderson-Hasselbalch
    log moves and the pH shifts — 0.010 mol of HCl into a 0.10/0.10 mol buffer moves it about 0.09 units.
    Small is not zero, and once either component runs out the protection stops entirely.'
  connection: 'Blood is a buffer running the same equation with a pKa of 6.1, and its capacity is what
    keeps enzyme function possible: most enzymes lose activity a couple of pH units from their optimum.
    Chapter 5A · Unique nature of water and its solutions covers the bicarbonate pair, and chapter 3B
    · Main organ systems shows the lungs and kidneys defending it.'
  connection_label: How sciences interconnect
  check:
  - q: A buffer has equal moles of HA and A-. Adding a small amount of HCl will…
    options:
      A: Neutralize all the acid only
      B: Drop pH by several units
      C: Have no effect at all
      D: Convert some A- to HA with small pH change
    answer: D
    explain: Added H+ consumes A-; ratio shifts modestly — that is buffering.
    distractors:
      A: The buffer does resist but not infinitely.
      B: Unbuffered behavior.
      C: pH does change slightly.
  - q: A buffer holds 0.10 mol HA and 0.10 mol A-. Adding 0.010 mol of HCl shifts the ratio to…
    options:
      B: About 0.82, dropping the pH roughly 0.09 units
      A: A fall of several pH units, since strong acid was added
      C: No change at all, because the buffer cancels the addition
      D: Above 1, because HA is being consumed
    answer: B
    explain: 'H+ converts A- to HA: 0.090 mol A- and 0.110 mol HA, ratio 0.818 — pH drops by log(0.818)
      = 0.09.'
    distractors:
      A: That is the unbuffered response.
      C: Buffers resist, they do not cancel — the ratio has moved.
      D: The acid is being formed, not consumed; the ratio falls.
  figures:
  - src: analytical-chemistry/fig-620c6acf.webp
    caption: pH color-change ranges of common indicators — choose one that brackets the equivalence point.
    credit: Ch 14 · OpenStax Chemistry 2e — CC BY-NC-SA 4.0
- heading: Spectroscopy and Beer-Lambert law
  objectives:
  - Use the Beer-Lambert law with a calibration curve to find a concentration.
  - Match each spectroscopic method to what it measures.
  - Predict how path length and molar absorptivity change absorbance.
  body:
  - ==A = epsilon x l x c== — absorbance scales with molar absorptivity, path length, concentration. Calibration
    curves (A versus c) turn absorbance into concentration. Color intensity tracks concentration — the
    basis of colorimetric assays.
  - Structural spectroscopy — IR identifies bonds (stretching frequencies), NMR identifies hydrogen environments
    (chemical shift, splitting), mass spectrometry gives molecular mass and fragmentation. ==The MCAT
    mostly tests what each method measures, not detailed spectra reading==.
  misconception: '"Twice as concentrated means the solution looks twice as dark, so transmittance halves."
    Absorbance doubles; transmittance does not halve, because absorbance is the NEGATIVE logarithm of
    transmittance. The linear quantity is A = -log T, and the eye''s sense of ''darker'' tracks that log
    scale roughly, not the raw fraction of light getting through. Doubling c doubles A and squares T.'
  connection: 'Every colored product assay in a clinical analyzer runs on this law: an enzyme-linked reaction
    makes something colored in proportion to the analyte, the instrument reads absorbance, and a calibration
    curve turns it into a concentration. The IR/NMR/MS triad in the body does the same job for structure,
    and chapter 5D · Biologically relevant molecules supplies the functional groups those instruments
    look for.'
  connection_label: How sciences interconnect
  check:
  - q: Doubling the concentration of an absorbing species…
    options:
      A: Doubles absorbance
      B: Halves absorbance
      C: Doubles transmittance
      D: Leaves A unchanged
    answer: A
    explain: Beer-Lambert is linear in concentration at fixed path length.
    distractors:
      B: Wrong direction.
      C: Transmittance falls.
      D: A depends on c.
  - q: A 2.0 x 10^-4 M standard gives A = 0.30 in a 1.0 cm cell. The molar absorptivity is…
    options:
      B: 1500 M-1 cm-1
      A: 6.7 x 10^-4 M-1 cm-1
      C: 0.60 M-1 cm-1
      D: 3000 M-1 cm-1
    answer: B
    explain: epsilon = A/(l c) = 0.30/(1.0 x 2.0 x 10^-4) = 1500 M-1 cm-1.
    distractors:
      A: Inverting the relation and computing c/A.
      C: Multiplying absorbance by concentration instead of dividing.
      D: Treating the cell as 0.5 cm.
- heading: Error, precision, and accuracy
  objectives:
  - Distinguish accuracy from precision in a set of measurements.
  - Classify an error as systematic or random and name its remedy.
  - Report a calculated result with honest significant figures.
  body:
  - Accuracy is closeness to truth; precision is reproducibility. ==Systematic errors bias all measurements
    the same way (calibration); random errors scatter (averaging helps)==. Significant figures carry uncertainty
    honestly — calculated results never gain precision.
  - Percent error = |experimental - true| / true x 100. When a passage reports replicate measurements,
    read the scatter as precision and the mean's distance from a reference as accuracy — the MCAT loves
    distinguishing the two in data interpretation.
  misconception: '"If I repeat the measurement enough times, the average will converge on the true value."
    Averaging only cures RANDOM error. A balance reading 0.5 g high does so on every single weighing,
    and averaging fifty biased readings returns the same bias with more confidence. Tight clusters sitting
    above the true value — the check''s five measurements — are the signature: precision without accuracy,
    cured only by recalibration or correction.'
  connection: 'This distinction is why a laboratory runs controls alongside samples: the control with
    a known value exposes systematic bias, while the spread across replicates reports random noise. A
    diagnostic lab that reports a tight but shifted glucose would be precise, reproducible — and wrong
    on every patient, which is exactly the failure mode quality control exists to catch.'
  connection_label: Real-world connection
  check:
  - q: Five measurements cluster tightly but all sit above the true value. This is…
    options:
      A: Precise but inaccurate
      B: Accurate but imprecise
      C: Both
      D: Neither
    answer: A
    explain: Low scatter (precise) with a consistent bias (inaccurate) — systematic error.
    distractors:
      B: Scatter is low.
      C: Scatter would be high.
      D: Close to true value would make it both.
  - q: A laboratory balance reads 0.5 g too high on every sample. The best remedy is to…
    options:
      C: Recalibrate the balance — a systematic offset never averages away
      A: Take more replicates and average them
      B: Report the mean with extra decimal places
      D: Randomise the order in which samples are weighed
    answer: C
    explain: A constant bias affects every reading the same way, so only calibration or a correction removes
      it.
    distractors:
      A: Averaging reduces random scatter, not bias.
      B: Extra digits add false precision without touching the offset.
      D: Order has no effect on a constant offset.
examples:
- prompt: 25.0 mL of 0.100 M HCl is titrated with 0.050 M NaOH. What volume of base reaches equivalence?
  strategy: 'Equivalence is a mole balance, so the plan is three moves: convert acid volume and molarity
    to moles, set the base moles equal to that, then divide by the base molarity for its volume. Predict
    the ratio before computing — the base is half as concentrated, so it should take twice the volume.'
  solution:
  - Moles acid = 0.100 x 0.0250 L = 2.50e-3 mol.
  - Equivalence — moles base = moles acid = 2.50e-3 mol.
  - Volume base = 2.50e-3 mol / 0.050 M = 0.050 L = 50.0 mL.
  answer: 50.0 mL of NaOH.
  discussion: '50.0 mL is exactly double the acid volume because the base is half as concentrated — that
    ratio check catches most slips instantly. Note what this titration cannot show: with a strong acid
    and a strong base the equivalence pH is 7.00 and there is no half-equivalence plateau, unlike a weak-acid
    curve. The mole balance would be unchanged for a weaker titrant; only the endpoint pH would move.'
  distractors:
    A: 25.0 mL — forgetting the base is half as concentrated.
    B: 12.5 mL — inverting the ratio.
    C: 100 mL — doubling the wrong way.
  practice:
    q: 40.0 mL of 0.250 M HCl is titrated with 0.500 M NaOH. What volume of base reaches equivalence?
    options:
      A: 20.0 mL
      B: 40.0 mL
      C: 80.0 mL
      D: 5.0 mL
    answer: A
    explain: Moles acid = 0.250 x 0.0400 = 0.0100 mol; V = 0.0100/0.500 = 0.0200 L = 20.0 mL — half the
      acid volume, as the 2:1 concentration ratio demands.
    distractors:
      B: Assuming equal volumes at equal moles — the concentrations differ by two.
      C: Doubling instead of halving.
      D: Inverting the concentration ratio.
key_equations:
- latex: $M = \frac{n}{V}$
  symbols: M molarity (mol/L), n moles of solute, V litres of solution
  when: concentration — the base of every dilution and titration calculation
- latex: $M_1V_1 = M_2V_2$
  symbols: M₁ V₁ before dilution, M₂ V₂ after
  when: dilution — moles are conserved, so concentration falls as volume rises
- latex: $n_{acid} = n_{base}$
  symbols: n moles at the equivalence point
  when: titration equivalence — a mole balance; the endpoint pH depends on the acid/base strengths
- latex: $pH = pK_a + \log\frac{[A^{-}]}{[HA]}$
  symbols: pKa of the buffer acid, [A⁻] conjugate base, [HA] weak acid
  when: Henderson-Hasselbalch — buffer pH, and pH = pKa at half-equivalence where the ratio is 1
- latex: $A = \varepsilon l c$
  symbols: A absorbance, epsilon molar absorptivity (M⁻¹cm⁻¹), l path length (cm), c concentration (M)
  when: Beer-Lambert — linear in both path length and concentration; the calibration curve's slope is
    epsilon l
- latex: $\%\text{ error} = \frac{|x_{exp} - x_{true}|}{x_{true}}\times100$
  symbols: x_exp experimental value, x_true accepted value
  when: reporting accuracy — distinct from precision, which is the scatter among replicates
key_points:
- M1V1 = M2V2 for dilutions.
- Half-equivalence pH = pKa.
- Buffers work within pKa +/- 1; capacity scales with total moles.
- A = epsilon l c — linear calibration.
- Precision = reproducibility; accuracy = truth; systematic vs random error.
- Strong-strong equivalence pH 7; weak acid equivalence is basic.
mnemonics:
- phrase: Halfway there, pH equals pKa
  means: The half-equivalence point of any weak titration.
- phrase: 'HH: pKa plus the log of base over acid'
  means: Henderson-Hasselbalch ratio direction — never invert it.
maps:
- title: Titration curve landmarks (weak acid by strong base)
  steps:
  - initial pH set by weak acid alone
  - half-equivalence — pH = pKa
  - equivalence — pH > 7 (conjugate base)
  - beyond — pH set by excess strong base
- title: Choosing the measurement tool
  steps:
  - concentration of a colored solute — Beer-Lambert
  - identity of functional groups — IR
  - hydrogen environments — NMR
  - molecular mass — mass spectrometry
passage:
  text: A student prepares a buffer by mixing 100 mL of 0.50 M acetic acid (pKa 4.76) with 100 mL of 0.50
    M sodium acetate, then adds 10 mL of 0.10 M HCl. Assume volumes are additive.
  questions:
  - q: The initial pH of the buffer is…
    options:
      A: '4.76'
      B: '2.38'
      C: '7.00'
      D: '9.24'
    answer: A
    explain: Equal moles of acid and conjugate base — log(1) = 0, pH = pKa.
    distractors:
      B: Not half of pKa.
      C: Neutral only for strong-strong.
      D: Basic side is wrong for equal acid/base.
  - q: The added HCl converts…
    options:
      A: Both unchanged
      B: HCl to acetate directly
      C: A- to HA
      D: HA to A-
    answer: C
    explain: Added strong acid protonates the conjugate base.
    distractors:
      A: The ratio must shift.
      B: Net effect is the same as protonating A-.
      D: That is what added base would do.
  - q: After the addition, the pH…
    options:
      A: Rises sharply
      B: Is unchanged
      C: Falls slightly
      D: Falls to 2
    answer: C
    explain: 'HCl converts A- to HA: 0.050 -> 0.049 A-, 0.050 -> 0.051 HA; the ratio falls 1 -> 0.96,
      so pH drops log(0.96) about 0.02 units — small, as buffering promises.'
    distractors:
      A: Acid was added, not base.
      B: Small change, not zero — the ratio moved.
      D: Unbuffered behavior.
pitfalls:
- Confusing molarity and molality.
- Reading pH = 7 at equivalence of a weak acid titration.
- Inverting the Henderson-Hasselbalch ratio.
- Treating precision as accuracy.
- Forgetting solids drop out of K but not of concentrations.
exam_map:
  NMAT: Core quantitative — dilution, titration, pH calculations, buffers.
  MCAT: Folded into experimental passages — buffer design, calibration curves, error analysis.
