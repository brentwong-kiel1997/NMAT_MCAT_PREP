review_questions:
- q: Water's high boiling point is primarily due to…
  options:
    A: Ionic bonding
    B: Hydrogen bonding
    C: London dispersion
    D: Covalent bonding
  answer: B
  explain: Extensive hydrogen-bond networks require extra energy to break.
  distractors:
    A: No ions in pure water.
    C: Too weak for the magnitude.
    D: Covalent bonds are within each molecule.
- q: What is the pH of a 1 x 10^-4 M NaOH solution?
  options:
    A: '4'
    B: '7'
    C: '10'
    D: '14'
  answer: C
  explain: pOH = -log(10^-4) = 4; pH = 14 - 4 = 10.
  distractors:
    A: That is the pH of 10^-4 M HCl.
    B: NaOH is a base, not neutral.
    D: That requires 1 M NaOH.
- q: A buffer is most effective when…
  options:
    A: pH is far from pKa
    B: pH equals pKa
    C: Only acid is present
    D: Only base is present
  answer: B
  explain: Equal amounts of HA and A- maximize resistance to both added acid and base.
  distractors:
    A: Far from pKa means one form dominates.
    C: Need both components.
    D: Need both components.
- q: Which is NOT a colligative property?
  options:
    A: Boiling point elevation
    B: Freezing point depression
    C: Color intensity
    D: Osmotic pressure
  answer: C
  explain: Colligative properties depend on particle count, not identity or color.
  distractors:
    A: Depends on particle count.
    B: Depends on particle count.
    D: Depends on particle count.
