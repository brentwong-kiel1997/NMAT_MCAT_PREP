subject: chemistry
chapter: 5A · Unique nature of water and its solutions
title: 5A · Unique Nature of Water and Its Solutions
overview: Water is the MCAT's favorite molecule — its polarity and hydrogen bonding drive everything from
  protein folding to acid-base chemistry. This chapter covers water's anomalous properties, solutions
  and molarity, and the pH scale with buffer chemistry.
sections:
- heading: Water's polarity and hydrogen bonding
  objectives:
  - Explain water's polarity from its bent geometry and the oxygen-hydrogen electronegativity gap.
  - Count the hydrogen bonds a single water molecule can form.
  - Predict whether a given solute will dissolve in water.
  body:
  - Water is bent (104.5 degrees) with a strong dipole — oxygen pulls electrons from the two hydrogens.
    This makes water a ==polar solvent that dissolves ionic and polar molecules== while excluding nonpolar
    ones (hydrophobic effect).
  - Hydrogen bonding between water molecules gives water its anomalously high boiling point, surface tension,
    and specific heat. ==Each water molecule can form up to four hydrogen bonds== — this network is why
    ice floats (hydrogen bonds hold molecules farther apart than in liquid).
  check:
  - q: Why does ice float on liquid water?
    options:
      A: Ice is less dense — hydrogen bonds hold molecules in an open lattice
      B: Ice is warmer
      C: Air bubbles in ice
      D: Liquid water contracts when heated
    answer: A
    explain: The crystalline structure of ice spaces molecules farther apart, lowering density.
    distractors:
      B: Temperature is irrelevant to density here.
      C: Air bubbles are incidental.
      D: Water is densest at 4C, not when heated.
  - q: Which of these is most soluble in water?
    options:
      B: Sodium chloride, an ionic solid
      A: Hexane, a six-carbon alkane
      C: Octane, an eight-carbon alkane
      D: Mineral oil, a mix of long hydrocarbons
    answer: B
    explain: Water's dipole solvates ions; the hydrocarbons are nonpolar and are excluded by the hydrophobic
      effect.
    distractors:
      A: A nonpolar hydrocarbon offers water nothing to hydrogen-bond or ion-dipole with.
      C: Longer still, and therefore even less soluble.
      D: Also nonpolar hydrocarbons — the same exclusion, only more so.
- heading: Solutions, electrolytes, and solubility
  objectives:
  - Classify a solute as a strong, weak, or non-electrolyte.
  - Use the solubility rules to predict whether a precipitate forms.
  - Explain why colligative properties depend only on particle count.
  body:
  - 'A solution is a homogeneous mixture — solute dissolved in solvent. ==Electrolytes dissociate into
    ions in water== (strong: NaCl, HCl; weak: acetic acid; nonelectrolyte: glucose). Colligative properties
    — vapor pressure lowering, boiling point elevation, freezing point depression — depend on the NUMBER
    of dissolved particles, not their identity.'
  - Solubility rules — all Na+, K+, NH4+, and NO3- salts dissolve; most CO3 2-, PO4 3-, and S2- salts
    precipitate. Molar solubility (mol/L) quantifies how much dissolves at equilibrium; Ksp is the solubility
    product constant.
  check:
  - q: Which is a strong electrolyte?
    options:
      A: C6H12O6
      B: NH3
      C: CH3COOH
      D: NaCl
    answer: D
    explain: NaCl dissociates completely in water.
    distractors:
      A: Glucose is a nonelectrolyte.
      B: Ammonia is a weak base.
      C: Acetic acid is a weak electrolyte.
  - q: Which salt is INSOLUBLE in water?
    options:
      C: CaCO3
      A: Na2CO3
      B: K3PO4
      D: NH4Cl
    answer: C
    explain: Carbonates are insoluble except with the alkali metals and ammonium — calcium carbonate precipitates.
    distractors:
      A: All sodium salts dissolve.
      B: All potassium salts dissolve.
      D: All ammonium salts dissolve.
  figures:
  - src: 5a-unique-nature-of-water-and-its-solutions/fig-9f65aae0.webp
    caption: Dissolution — a solute dispersing into solvent to form a homogeneous solution.
    credit: Ch 11 · OpenStax Chemistry 2e — CC BY-NC-SA 4.0
  - src: 5a-unique-nature-of-water-and-its-solutions/fig-a7bd86a8.webp
    caption: Diffusion of helium and argon after a valve opens — spontaneous mixing driven by entropy.
    credit: Ch 11 · OpenStax Chemistry 2e — CC BY-NC-SA 4.0
- heading: Acids, bases, and the pH scale
  objectives:
  - Compare the Arrhenius, Bronsted-Lowry, and Lewis definitions of acid and base.
  - Convert between [H+], pH, pOH, and [OH-].
  - Recognise the strong acids and bases that dissociate completely.
  body:
  - 'Arrhenius: acids produce H+, bases produce OH-. Bronsted-Lowry: acids donate protons, bases accept
    them. Lewis: acids accept electron pairs, bases donate them. ==Strong acids (HCl, HNO3, H2SO4, HClO4)
    dissociate completely==; weak acids reach equilibrium described by Ka.'
  - pH = -log[H+]; pOH = -log[OH-]; pH + pOH = 14.00 at 25C. Each pH unit is a tenfold change in hydrogen
    ion concentration. A solution of pH 3 has [H+] = 10^-3 M.
  check:
  - q: What is the [OH-] in a solution with pH = 5?
    options:
      A: 5 M
      B: 10^-14 M
      C: 10^-5 M
      D: 10^-9 M
    answer: D
    explain: pOH = 14 - 5 = 9, so [OH-] = 10^-9 M.
    distractors:
      A: That is just the pH value as molarity.
      B: That is the product [H+][OH-].
      C: That is [H+].
  - q: What is the pH of 0.0010 M HCl?
    options:
      D: '3.0'
      A: '11.0'
      B: '0.0010'
      C: '1.3'
    answer: D
    explain: HCl is a strong acid, so [H+] = 1.0 x 10^-3 M and pH = -log(10^-3) = 3.0.
    distractors:
      A: Computing pOH as though hydrochloric acid were a base.
      B: Reporting the molarity instead of its negative logarithm.
      C: Using the natural logarithm instead of log base 10.
- heading: Buffers and the Henderson-Hasselbalch equation
  objectives:
  - Identify the conjugate pair required for a solution to act as a buffer.
  - Calculate a buffer's pH with the Henderson-Hasselbalch equation.
  - Explain why buffering capacity peaks when pH equals pKa.
  body:
  - A buffer is a weak acid plus its conjugate base (or weak base plus conjugate acid) that resists pH
    change. ==The Henderson-Hasselbalch equation — pH = pKa + log([A-]/[HA])== — predicts the buffer pH
    from the ratio of conjugate base to acid. Maximum buffering occurs when pH = pKa (equal amounts of
    acid and base).
  - Physiological buffers — the bicarbonate system (H2CO3/HCO3-, pKa 6.1) in blood, phosphate intracellularly,
    proteins as flexible buffers. The bicarbonate system works because CO2 is exhaled by lungs, pulling
    the equilibrium.
  check:
  - q: A buffer has equal concentrations of HA and A-. The pH equals…
    options:
      A: pKa
      B: '7.0'
      C: pKa + 1
      D: 14 - pKa
    answer: A
    explain: log(1) = 0, so pH = pKa + 0 = pKa.
    distractors:
      B: That is neutral pH, unrelated to the buffer.
      C: That is when [A-] = 10 times [HA].
      D: That is pOH.
  - q: A buffer contains 0.40 M A- and 0.040 M HA, with pKa = 5.0. Its pH is…
    options:
      A: '6.0'
      B: '4.0'
      C: '5.0'
      D: '7.0'
    answer: A
    explain: pH = 5.0 + log(0.40/0.040) = 5.0 + log(10) = 6.0.
    distractors:
      B: Inverting the ratio and putting the acid on top.
      C: Quoting the pKa and ignoring the actual ratio.
      D: Assuming neutrality, which has nothing to do with a buffer's pH.
- heading: Titrations and equivalence points
  objectives:
  - Locate the equivalence point and half-equivalence point on a titration curve.
  - Predict whether an equivalence point is acidic, basic, or neutral.
  - Choose an indicator whose colour change brackets the equivalence point.
  body:
  - Titration curves plot pH versus volume of titrant added. The ==equivalence point is where moles of
    titrant equal moles of analyte==. Strong acid plus strong base gives an equivalence point at pH 7;
    weak acid plus strong base gives equivalence above 7; weak base plus strong acid gives equivalence
    below 7.
  - The half-equivalence point (where half the acid has been neutralized) is where pH = pKa — the MCAT
    uses this to extract Ka from a titration curve. Indicators are chosen so their color-change range
    brackets the equivalence point.
  check:
  - q: At the half-equivalence point of a weak acid titration…
    options:
      A: pH = 7
      B: All acid is consumed
      C: pH = pKb
      D: pH = pKa
    answer: D
    explain: Half the acid is neutralized; [HA] = [A-]; pH = pKa + log(1) = pKa.
    distractors:
      A: That is strong-strong only.
      B: That is the equivalence point.
      C: That relates to the base, not the acid.
  - q: A weak base is titrated with a strong acid. The pH at the equivalence point is…
    options:
      D: Below 7
      A: Exactly 7
      B: Above 7
      C: Undefined until the indicator changes
    answer: D
    explain: The conjugate acid of the weak base hydrolyses to release H+, so the equivalence solution
      is acidic.
    distractors:
      A: Neutral equivalence belongs to strong acid plus strong base only.
      B: That is the weak acid plus strong base case — the reverse pairing.
      C: The indicator follows the equivalence point; it does not define it.
examples:
- prompt: Calculate the pH of a buffer containing 0.10 M acetic acid (pKa = 4.76) and 0.15 M sodium acetate.
  strategy: 'A conjugate pair in water means Henderson-Hasselbalch applies directly: pH = pKa + log([A-]/[HA])
    = 4.76 + log(0.15/0.10). Two decisions carry the whole item — which species sits on top of the ratio
    (the base) and whether the log''s sign is consistent with which one is in excess.'
  solution:
  - pH = pKa + log([A-]/[HA])
  - pH = 4.76 + log(0.15/0.10)
  - pH = 4.76 + log(1.5)
  - pH = 4.76 + 0.18 = 4.94
  answer: pH = 4.94.
  discussion: '4.94 is 0.18 above the pKa, which confirms the base is in excess; a 1.5-fold ratio buys
    about a fifth of a pH unit, while a tenfold ratio buys a whole unit. Read the context too: a pKa of
    4.76 makes this a lab buffer, not a blood buffer — the bicarbonate pair at pKa 6.1 is the physiological
    one. Sanity check the limits: with [A-] = [HA] the log vanishes and pH = pKa, so any answer below
    4.76 means the ratio was inverted.'
  distractors:
    A: Forgetting the log — pH = 4.76 + 1.5 = 6.26.
    B: Inverting the ratio — pH = 4.76 + log(0.67) = 4.58.
    C: Using pKa of water (7) instead of the acid.
  practice:
    q: A buffer contains 0.050 M HA (pKa = 3.00) and 0.50 M NaA. What is its pH?
    options:
      B: '4.00'
      A: '2.00'
      C: '3.00'
      D: '5.30'
    answer: B
    explain: pH = 3.00 + log(0.50/0.050) = 3.00 + log(10) = 4.00.
    distractors:
      A: Inverting the ratio — the conjugate base goes on top.
      C: Quoting the pKa and ignoring the tenfold excess of base.
      D: Using the natural logarithm of the ratio instead of log base 10.
key_points:
- Water is bent, polar, and hydrogen-bonded — this drives its solvent power and anomalies.
- Electrolytes dissociate; colligative properties depend on particle count.
- pH = -log[H+]; pH + pOH = 14 at 25C; each unit is tenfold.
- 'Henderson-Hasselbalch: pH = pKa + log([A-]/[HA]).'
- Maximum buffering at pH = pKa; half-equivalence point extracts pKa.
- Bicarbonate buffer in blood (pKa 6.1) is the physiological example.
mnemonics:
- phrase: pH = pKa + log (base over acid)
  means: Henderson-Hasselbalch — conjugate base divided by conjugate acid.
- phrase: Strong at seven, weak wanders
  means: Strong-strong equivalence is pH 7; weak acid equivalence is above 7, weak base below 7.
maps:
- title: Titration of weak acid with strong base
  steps:
  - 'initial: pH determined by weak acid alone'
  - 'buffer region: pH = pKa + log ratio'
  - 'half-equivalence: pH = pKa exactly'
  - 'equivalence: pH above 7 (conjugate base dominates)'
  - 'excess base: pH rises steeply'
- title: Dissolution decision path
  steps:
  - ionic or polar solute + water — dissolves (ion-dipole)
  - nonpolar solute + water — insoluble (hydrophobic)
  - nonpolar solute + nonpolar solvent — dissolves (like dissolves like)
  - slightly soluble — partial, equilibrium established
passage:
  text: A researcher prepares a phosphate buffer by mixing 100 mL of 0.1 M KH2PO4 (monobasic) with 100
    mL of 0.2 M K2HPO4 (dibasic). The pKa of the H2PO4-/HPO4 2- pair is 7.20.
  questions:
  - q: What is the pH of this buffer?
    options:
      A: '7.00'
      B: '7.20'
      C: '7.50'
      D: '6.90'
    answer: C
    explain: pH = 7.20 + log(0.1/0.05) = 7.20 + log(2) = 7.20 + 0.30 = 7.50.
    distractors:
      A: That is neutral.
      B: That is pKa — requires equal concentrations.
      D: Below pKa requires more acid than base.
  - q: If 10 mL of 0.1 M NaOH is added, the pH will…
    options:
      A: Stay exactly the same
      B: Increase slightly
      C: Increase dramatically
      D: Decrease
    answer: B
    explain: The buffer absorbs the added OH- by converting HA to A-. The ratio shifts, so pH rises slightly,
      not dramatically.
    distractors:
      A: Buffers resist but do not perfectly cancel pH change.
      C: Without buffering capacity, this would be dramatic.
      D: Adding base increases pH.
  - q: What makes this an effective physiological buffer?
    options:
      A: It is at pH 7.4 near the pKa of 7.20
      B: It cannot be overwhelmed
      C: It works only outside cells
      D: It is a strong acid
    answer: A
    explain: The buffer works best near its pKa, and physiological pH 7.4 is close to 7.20.
    distractors:
      B: All buffers can be overwhelmed.
      C: It works intracellularly too.
      D: It is a weak acid system.
pitfalls:
- Confusing pH with [H+] directly — pH is logarithmic.
- Using the wrong ratio in Henderson-Hasselbalch — base over acid, not acid over base.
- Assuming buffers prevent all pH change — they only resist it.
- Forgetting that water is densest at 4C, not 0C.
- Mixing up equivalence point (stoichiometric) with endpoint (indicator color change).
