subject: chemistry
chapter: 5B · Molecules and intermolecular interactions
title: 5B · Molecules and Intermolecular Interactions
overview: Intermolecular forces determine physical properties from boiling point to protein folding. The
  MCAT tests IMF ranking, polarity, and the hydrophobic effect.
sections:
- heading: The intermolecular force hierarchy
  objectives:
  - Rank the intermolecular forces from strongest to weakest.
  - State the structural requirement for a hydrogen bond to form.
  - Recognise that London dispersion operates in every molecule.
  body:
  - From strongest to weakest — ion-ion > ion-dipole > hydrogen bonding > dipole-dipole > London dispersion.
    London dispersion exists in ALL molecules (temporary dipoles from electron fluctuation) and is the
    only IMF in nonpolar substances.
  - Hydrogen bonding requires H bonded to N, O, or F, attracting a lone pair on another electronegative
    atom.
  misconception: '"A hydrogen bond is just a weak covalent bond, another kind of electron sharing." No
    electrons are shared or transferred in a hydrogen bond — it is an attraction between an already-polar
    N-H, O-H, or F-H bond and a lone pair on a neighbour. That is why it is an interMOLECULAR force: it
    can be broken by warming, and it is roughly an order of magnitude weaker than the covalent bonds inside
    the molecule.'
  connection: 'The same weak attraction, used a few billion times in a row, is what holds biology''s big
    structures together: hydrogen bonds zip DNA''s base pairs together and pin an alpha-helix''s backbone
    every few residues. Chapter 1A · Proteins and amino acids shows secondary structure surviving on exactly
    this force — strong enough to hold a shape, weak enough to let it unfold and refold.'
  connection_label: How sciences interconnect
  check:
  - q: Which has the strongest intermolecular forces?
    options:
      A: CH4
      B: HCl
      C: H2O
      D: NaCl
    answer: D
    explain: Ion-ion forces far exceed any dipole or dispersion force.
    distractors:
      A: Dispersion only.
      B: Dipole-dipole.
      C: Hydrogen bonding but less than ionic.
  - q: Which molecule can act as BOTH a hydrogen-bond donor and an acceptor?
    options:
      D: CH3NH2
      A: CH3OCH3
      B: CH4
      C: CCl4
    answer: D
    explain: An N-H bond donates, and the nitrogen lone pair accepts — methylamine does both.
    distractors:
      A: The ether has lone pairs to accept but no O-H or N-H to donate.
      B: No electronegative atom means neither role is available.
      C: Chlorine is not electronegative enough to hydrogen-bond.
  figures:
  - src: 5b-molecules-and-intermolecular-interactions/fig-031c6194.webp
    caption: Intramolecular forces (covalent bonds within a molecule) versus intermolecular forces (attractions
      between molecules).
    credit: Ch 10 · OpenStax Chemistry 2e — CC BY-NC-SA 4.0
  - src: 5b-molecules-and-intermolecular-interactions/fig-16c35aaa.webp
    caption: Dipole-dipole attractions between polar molecules via partial charges.
    credit: Ch 10 · OpenStax Chemistry 2e — CC BY-NC-SA 4.0
- heading: Polarity and dipole moments
  objectives:
  - Predict molecular polarity from bond dipoles combined with geometry.
  - Identify molecules that are nonpolar despite containing polar bonds.
  - Relate amphipathic structure to micelle and membrane formation.
  body:
  - Molecular polarity depends on bond polarity AND geometry. CO2 is linear and nonpolar (dipoles cancel).
    H2O is bent and polar. CCl4 is tetrahedral nonpolar; CHCl3 is tetrahedral polar. Like dissolves like
    — polar solvents dissolve polar and ionic solutes.
  - Amphipathic molecules with both polar and nonpolar regions form micelles and membranes — the basis
    of biological structure.
  misconception: '"If a molecule contains polar bonds, the molecule itself must be polar." Geometry decides.
    CO2 has two strongly polar C=O bonds pointing in exactly opposite directions, so the dipoles cancel
    and the molecule is nonpolar; H2O has the same kind of bonds but a bent shape, so they reinforce.
    Ask not ''are the bonds polar'' but ''do the bond dipoles add up or cancel''.'
  connection: 'Amphipathic is the biologically important answer to this section: one molecule carrying
    both a polar head and a nonpolar tail self-assembles into bilayers, with the tails hiding from water
    in the middle. Chapter 2A · Assemblies of molecules, cells, and cell groups starts from exactly this
    property — the membrane exists because of the molecular asymmetry described here.'
  connection_label: How sciences interconnect
  check:
  - q: Which molecule is nonpolar despite having polar bonds?
    options:
      A: H2O
      B: NH3
      C: CO2
      D: HF
    answer: C
    explain: CO2 is linear — the two bond dipoles cancel.
    distractors:
      A: Bent and polar.
      B: Trigonal pyramidal and polar.
      D: Diatomic with large EN difference.
  - q: Which molecule is POLAR?
    options:
      A: CH2Cl2
      B: CO2
      C: CCl4
      D: BF3
    answer: A
    explain: Dichloromethane is tetrahedral but its substituents differ, so the bond dipoles cannot cancel.
    distractors:
      B: Linear, with two equal dipoles pointing opposite — net zero.
      C: Tetrahedral and symmetric — the four dipoles cancel.
      D: Trigonal planar and symmetric — the three dipoles cancel.
- heading: Physical properties from IMFs
  objectives:
  - Predict boiling point, melting point, and viscosity from IMF strength.
  - Rank vapor pressures using intermolecular forces.
  - Explain why longer hydrocarbon chains boil at higher temperatures.
  body:
  - Stronger IMFs mean higher boiling point, higher melting point, higher viscosity, and higher surface
    tension. Water boils at 100C (vs methane at -162C) due to hydrogen bonding. Longer hydrocarbon chains
    mean stronger dispersion and higher BP.
  - Vapor pressure is inverse — stronger IMFs mean lower vapor pressure.
  misconception: '"CH3Cl is heavier than CH3OH, so it should boil higher." Mass only decides among molecules
    that offer the same force. Compare the strongest IMF each can deploy first: methanol has an O-H to
    donate hydrogen bonds, chloromethane has only a dipole, and the hydrogen bond wins by about 90 degrees
    despite the extra mass in CH3Cl. Chain length matters within a family — the pentane-butane-propane
    check — not across one.'
  connection: 'Boiling point differences are an industrial sorting tool: crude oil is a mixture of hydrocarbons
    whose dispersion forces grow with chain length, so heating it lets each fraction condense at its own
    level in a column. Chapter 5C · Separation and purification methods covers distillation as a method
    — this section supplies the reason it works.'
  connection_label: How sciences interconnect
  check:
  - q: Which liquid has the highest surface tension?
    options:
      A: Hexane
      B: Ethanol
      C: Water
      D: Mercury
    answer: D
    explain: Metallic bonding in mercury exceeds hydrogen bonding in water.
    distractors:
      A: Dispersion only.
      B: Some H-bonding.
      C: Strong H-bonding but not metallic.
  - q: Rank propane (C3H8), butane (C4H10), and pentane (C5H12) by boiling point.
    options:
      C: pentane > butane > propane
      A: propane > butane > pentane
      B: All three boil at about the same temperature
      D: butane > pentane > propane
    answer: C
    explain: Same functional group, so dispersion decides — and dispersion grows with electron count and
      chain length.
    distractors:
      A: Reversing the trend; more surface area means more dispersion, not less.
      B: Sharing a functional group does not make the IMFs equal — mass still matters.
      D: No non-monotonic effect is at work here.
- heading: The hydrophobic effect and biology
  objectives:
  - Describe the hydrophobic effect as an entropy-driven process.
  - Explain how it drives protein folding and membrane assembly.
  - Identify which noncovalent interactions stabilise secondary structure.
  body:
  - The hydrophobic effect is entropy-driven exclusion of nonpolar molecules from water. Water forms ordered
    cages around nonpolar surfaces; burying those surfaces releases water, increasing entropy. This is
    why proteins fold, membranes form, and oil separates from water.
  - In biology, hydrogen bonds stabilize protein secondary structure, ionic interactions form salt bridges,
    hydrophobic packing buries nonpolar side chains in cores.
  misconception: '"Nonpolar molecules clump together because they attract each other strongly." The attraction
    between two hydrocarbons is London dispersion, the weakest force on the ladder. What drives the clumping
    is water: each nonpolar surface forces nearby water into ordered cages that cost entropy, so burying
    those surfaces — away from each other as much as from water — releases the caged water and gains entropy.
    The hydrophobic effect is water pushing, not oil pulling.'
  connection: 'This is the engine of protein architecture: a chain that folds buries its nonpolar side
    chains in a core and leaves the polar ones facing water, and that single drive does most of the work
    before any hydrogen bond or salt bridge is counted. Chapter 1A · Proteins and amino acids walks the
    same logic up the four levels of structure, and chapter 2A repeats it for whole membranes.'
  connection_label: How sciences interconnect
  check:
  - q: The hydrophobic effect is primarily driven by…
    options:
      A: Strong attraction between nonpolar molecules
      B: Ionic interactions
      C: Covalent bonding
      D: Entropy gain when water is released
    answer: D
    explain: Releasing ordered water increases entropy — the driving force.
    distractors:
      A: Nonpolar molecules attract weakly.
      B: No ions involved.
      C: No new bonds.
  - q: When a protein buries its nonpolar side chains, what happens to the surrounding water?
    options:
      A: Ordered cage water is released, raising the water's entropy
      B: Water is consumed, releasing enthalpy
      C: Water forms stronger hydrogen bonds to the buried groups
      D: Water is unaffected — burial is a covalent event
    answer: A
    explain: Releasing structured cage water is the entropic payoff that drives folding.
    distractors:
      B: The effect is entropic, not enthalpic — no bonds are made or broken.
      C: Nonpolar surfaces cannot hydrogen-bond; that is the whole problem.
      D: Folding rearranges noncovalent contacts only, but the water is very much affected.
- heading: Partition and gas solubility
  objectives:
  - Define the partition coefficient and what a high value predicts.
  - Predict membrane permeability from a compound's lipophilicity.
  - Apply Henry's law to the solubility of a gas above a liquid.
  body:
  - 'Partition coefficient P equals concentration in organic phase divided by concentration in aqueous
    phase. High P means lipophilic — crosses membranes readily. Henrys law: gas solubility is proportional
    to partial pressure above the liquid.'
  misconception: '"The air a diver breathes is still 78 percent nitrogen, so the nitrogen dissolved in
    her blood stays the same at depth." What drives gas into solution is its PARTIAL pressure, not its
    fraction. Doubling the total pressure doubles nitrogen''s partial pressure, and Henry''s law — being
    linear — doubles the dissolved amount. The composition did not change; the pushing pressure did.'
  connection: 'Henry''s law runs gas exchange in both directions: oxygen dissolves in the alveolar capillaries
    in proportion to its partial pressure there, which is exactly why altitude — a lower PO2 — limits
    uptake. Chapter 4B · Fluids for circulation and gas exchange works the same law on the physiology
    side, from Dalton''s partial pressures to the driving gradient across the respiratory membrane.'
  connection_label: How sciences interconnect
  check:
  - q: A drug has log P = 3. This means it…
    options:
      A: Is highly water-soluble
      B: Is moderately lipophilic
      C: Cannot cross membranes
      D: Is ionic
    answer: B
    explain: P = 1000-fold organic preference — crosses membranes well.
    distractors:
      A: log P < 0 is water-soluble.
      C: Lipophilic drugs cross membranes well.
      D: log P does not indicate charge.
  - q: A diver breathes air at twice the normal nitrogen partial pressure. The nitrogen dissolved in her
      blood…
    options:
      C: Doubles
      A: Quadruples
      B: Is unchanged
      D: Falls by half
    answer: C
    explain: Henry's law is linear — dissolved gas is proportional to the partial pressure above the liquid.
    distractors:
      A: Squaring the factor has no basis; the law is linear.
      B: The composition of the gas has not changed, but its pressure has.
      D: Inverting the relation — higher pressure drives MORE gas into solution.
examples:
- prompt: 'Rank by boiling point: CH4, CH3Cl, CH3OH, LiF.'
  strategy: 'Sort by the strongest intermolecular force each species can deploy, not by mass: ionic LiF
    first, then the hydrogen-bonding methanol, then the polar but non-donating CH3Cl, then dispersion-only
    methane. The plan is one pass down the IMF ladder, testing each molecule for an N-H or O-H donor before
    falling back to dipole or dispersion.'
  solution:
  - LiF (ionic, ~1700C) > CH3OH (H-bonding, 65C) > CH3Cl (dipole-dipole, -24C) > CH4 (dispersion, -162C).
  answer: LiF > CH3OH > CH3Cl > CH4.
  discussion: 'The spread from roughly 1700C down to -162C is the lesson: each rung down the IMF ladder
    costs hundreds of degrees, dwarfing any mass effect among small molecules. The ranking also guards
    against the classic trap — CH3Cl is heavier than CH3OH yet boils some 90 degrees lower, because a
    hydrogen bond beats a dipole regardless of molecular weight. Note that LiF is an ionic solid at room
    temperature, so ''boiling'' it means dismantling a lattice first.'
  distractors:
    A: Putting CH4 above CH3Cl — dispersion is weaker.
    B: Putting CH3Cl above CH3OH — H-bonding wins.
    C: Putting molecular above ionic LiF.
  practice:
    q: 'Rank by boiling point: ethane (CH3CH3), chloroethane (CH3CH2Cl), ethanol (CH3CH2OH).'
    options:
      A: ethanol > chloroethane > ethane
      B: chloroethane > ethanol > ethane
      C: ethane > chloroethane > ethanol
      D: ethanol > ethane > chloroethane
    answer: A
    explain: Ethanol hydrogen-bonds; chloroethane is only dipole-dipole; ethane has dispersion alone.
    distractors:
      B: Putting dipole-dipole above hydrogen bonding.
      C: Reversing the ladder entirely.
      D: Placing dispersion above dipole-dipole for these similar-sized molecules.
key_equations:
- latex: $\vec{\mu}_{net} = \sum \vec{\mu}_{bond}$
  symbols: mu_net molecular dipole moment, mu_bond individual bond dipoles (vectors)
  when: polarity — equal dipoles pointing opposite cancel (CO2), asymmetric ones reinforce (H2O)
- latex: $\Delta G = \Delta H - T\Delta S$
  symbols: ΔG free energy change, ΔH enthalpy change, T absolute temperature, ΔS entropy change
  when: the hydrophobic effect — releasing ordered cage water makes the -TΔS term dominate
- latex: $P = \frac{[org]}{[aq]}$
  symbols: P partition coefficient, [org] concentration in the organic phase, [aq] in the aqueous phase
  when: lipophilicity — log P of 3 means a 1000-fold preference for the organic phase
- latex: $C_{gas} = k P_{gas}$
  symbols: C_gas dissolved gas concentration, k Henry's law constant, P_gas partial pressure above the
    liquid
  when: gas solubility — linear in partial pressure, so doubled pressure doubles dissolved gas
key_points:
- IMF hierarchy — ionic > H-bond > dipole-dipole > dispersion.
- Dispersion exists everywhere; scales with electron count.
- Geometry determines polarity — linear/symmetric cancel, bent/asymmetric reinforce.
- Stronger IMFs = higher BP/MP/viscosity, lower vapor pressure.
- Hydrophobic effect is entropy-driven water release.
- Partition coefficient P predicts membrane crossing.
mnemonics:
- phrase: Ion before H-bond, H-bond before dipole, dipole before dispersion
  means: IMF ranking.
- phrase: Like dissolves like
  means: Polar dissolves polar; nonpolar dissolves nonpolar.
maps:
- title: IMF to physical property
  steps:
  - stronger IMFs
  - higher BP and MP
  - lower vapor pressure
  - higher viscosity and surface tension
- title: Hydrophobic effect
  steps:
  - nonpolar surface in water
  - water forms ordered cage — entropy cost
  - surface is buried
  - water is released — entropy gain
passage:
  text: Four liquids are tested. A boils at 100C, is viscous, dissolves NaCl. B boils at 80C, dissolves
    NaCl poorly. C boils at -162C, does not dissolve NaCl. D boils at 1465C, solid at room temperature.
  questions:
  - q: Liquid A is most likely…
    options:
      A: Water
      B: Methane
      C: Argon
      D: NaCl
    answer: A
    explain: 100C BP, viscous, dissolves ionic NaCl.
    distractors:
      B: Gas at room temperature.
      C: Noble gas.
      D: NaCl is liquid D.
  - q: Liquid C is nonpolar because…
    options:
      A: Very low BP and no NaCl dissolution
      B: It is a solid
      C: It is viscous
      D: Conducts electricity
    answer: A
    explain: Extremely low BP implies dispersion-only IMFs.
    distractors:
      B: It is a gas.
      C: Not mentioned.
      D: Not tested.
  - q: Liquid D being solid suggests…
    options:
      A: Ionic or metallic bonding
      B: Dispersion only
      C: No IMFs
      D: It is a gas
    answer: A
    explain: Very high BP and solid state imply ionic lattice.
    distractors:
      B: Dispersion alone would not do this.
      C: All have IMFs.
      D: It is solid.
pitfalls:
- Calling H-bonds covalent — they are attractions.
- Assuming more polar always means higher BP — mass matters for dispersion.
- Treating hydrophobic effect as enthalpic — it is entropic.
