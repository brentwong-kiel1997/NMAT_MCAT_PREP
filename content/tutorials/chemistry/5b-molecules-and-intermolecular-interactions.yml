review_questions:
- q: Which IMF exists in ALL molecules?
  options:
    A: Ionic
    B: Hydrogen bonding
    C: London dispersion
    D: Dipole-dipole
  answer: C
  explain: Temporary dipoles arise in any molecule.
  distractors:
    A: Ionic compounds only.
    B: Requires H on N/O/F.
    C: Polar molecules only.
- q: CO2 is nonpolar because…
  options:
    A: Bonds are nonpolar
    B: Linear geometry cancels dipoles
    C: It is a gas
    D: Carbon has no EN
  answer: B
  explain: Two equal dipoles point opposite — net zero.
  distractors:
    A: C=O is quite polar.
    B: Phase irrelevant.
    C: Carbon is moderately EN.
- q: Highest vapor pressure at 25C?
  options:
    A: Water
    B: Methanol
    C: Diethyl ether
    D: Mercury
  answer: C
  explain: Weakest IMFs — no H-bond donors.
  distractors:
    A: Strong H-bonding.
    B: Some H-bonding.
    C: Metallic — lowest VP.
- q: The hydrophobic effect increases…
  options:
    A: Enthalpy
    B: Entropy of water
    C: Bond energy
    D: pH
  answer: B
  explain: Releasing ordered water increases entropy.
  distractors:
    A: Not primarily enthalpic.
    B: No new bonds.
    C: Unrelated.
