subject: chemistry
chapter: 5E · Chemical thermodynamics and kinetics
title: 5E · Principles of Chemical Thermodynamics and Kinetics
overview: Why reactions happen (thermodynamics) and how fast (kinetics) — the single most tested conceptual
  pairing on the exam. Gibbs free energy, equilibrium, rate laws, and catalysis anchor bioenergetics.
sections:
- heading: Enthalpy, entropy, and Gibbs free energy
  objectives:
  - Calculate delta-G from delta-H, delta-S, and temperature.
  - Predict the temperature range over which a reaction is spontaneous.
  - Interpret the sign of delta-G in terms of product favourability.
  body:
  - Spontaneity is decided by delta-G = delta-H - T delta-S. ==Negative delta-G means spontaneous (product-favored)==,
    but says nothing about rate. Enthalpy (H) is heat at constant pressure; entropy (S) is dispersal of
    energy and matter.
  - Temperature couples the terms — when delta-H and delta-S share a sign, ==temperature decides spontaneity==.
    Exothermic with positive entropy is spontaneous at all temperatures; endothermic with negative entropy
    at none. Memorize the four-sign table.
  misconception: '"If a reaction releases heat it must run on its own — exothermic always means spontaneous."
    Enthalpy is only one term. The entropy term -T delta-S can veto it: an exothermic reaction with negative
    entropy (fewer, more ordered products) becomes nonspontaneous above the crossover temperature, exactly
    as the check''s -100 kJ/mol, -200 J/mol·K case shows. Both signs must be in the ledger before you
    call a reaction spontaneous.'
  connection: 'The cell lives on this equation''s products side: nearly every biosynthetic step has a
    positive delta-G on its own and only runs because it is coupled to something strongly negative. Chapter
    1D · Bioenergetics and fuel metabolism is the physiology of that coupling — ATP hydrolysis paying
    for work the reactants alone would never do.'
  connection_label: How sciences interconnect
  check:
  - q: A reaction with delta-H < 0 and delta-S < 0 is…
    options:
      A: Never spontaneous
      B: Spontaneous only at high temperature
      C: Spontaneous only at low temperature
      D: Spontaneous at all temperatures
    answer: C
    explain: At low T the favorable enthalpy term dominates — T delta-S is small.
    distractors:
      A: Not never.
      B: That is delta-H>0, delta-S>0.
      D: Not all temperatures — high T makes -T delta-S positive.
  - q: A reaction has delta-H = -100 kJ/mol and delta-S = -200 J/mol·K. Its spontaneity is…
    options:
      C: Spontaneous below 500 K, nonspontaneous above
      A: Spontaneous at all temperatures
      B: Never spontaneous
      D: Spontaneous above 500 K, nonspontaneous below
    answer: C
    explain: The crossover sits at T = delta-H/delta-S = (-100,000)/(-200) = 500 K; below it the favourable
      enthalpy wins.
    distractors:
      A: The two terms disagree in sign, so a crossover temperature must exist.
      B: The enthalpy term is favourable — the reaction runs cold even if it dies hot.
      D: Inverting the direction of the crossover.
- heading: Equilibrium — the balance point
  objectives:
  - Write an equilibrium expression, omitting pure solids and liquids.
  - Predict the direction of a shift from a Le Chatelier stress.
  - Distinguish a change in K from a change in equilibrium position.
  body:
  - Every reversible reaction reaches equilibrium where forward and reverse rates equal. ==K = products
    over reactants, each raised to its stoichiometric coefficient== — only gases and aqueous species appear;
    pure solids and liquids drop out.
  - Le Chatelier — stress shifts equilibrium to relieve it. ==Adding reactant, removing product, increasing
    pressure (fewer moles gas side), and heating an endothermic reaction all shift right==. K changes
    ONLY with temperature — concentration and pressure changes shift position, not K.
  misconception: '"Add a catalyst and the equilibrium shifts so you end up with more product." A catalyst
    speeds the forward and reverse reactions by exactly the same factor, so the balance point does not
    move — the same K, the same final mixture, reached sooner. The passage makes the point in numbers:
    a 10^8-fold rate increase and an unchanged product-to-reactant ratio.'
  connection: 'The ammonia synthesis in the check is the Haber process, run at industrial scale worldwide.
    Its engineers face the identical Le Chatelier arithmetic: high pressure pushes the four-moles-left,
    two-moles-right reaction to the right, but high temperature — which speeds the catalyst — drags an
    exothermic equilibrium backward. The operating compromise between fast and favourable is this section
    written in steel.'
  connection_label: Real-world connection
  check:
  - q: For N2 + 3H2 <-> 2NH3 (delta-H < 0), increasing temperature will…
    options:
      A: Shift right and decrease K
      B: No change
      C: Shift left and decrease K
      D: Shift right and increase K
    answer: C
    explain: Exothermic — heat is a product, so added heat shifts left AND lowers K.
    distractors:
      A: Direction inconsistent with exothermic.
      B: Temperature always matters.
      D: Direction wrong.
  - q: For N2 + 3H2 <-> 2NH3, the container volume is decreased. What happens?
    options:
      C: The position shifts right, toward the side with fewer gas moles
      A: The position shifts left, toward the side with more gas moles
      B: Nothing shifts — pressure only changes K
      D: The position shifts right and K increases
    answer: C
    explain: Four moles of gas on the left against two on the right — compression favours the right.
    distractors:
      A: Relieving the stress means fewer particles, not more.
      B: Pressure shifts the position; only temperature changes K.
      D: The position moves, but K is untouched by pressure.
- heading: Kinetics — rates and rate laws
  objectives:
  - Determine a reaction's order from experimental rate data.
  - Use the Arrhenius equation to predict a temperature effect on rate.
  - Explain why a catalyst changes rate but not the equilibrium position.
  body:
  - Rate measures concentration change per time — ==rate = k[A]^m[B]^n== where m and n come ONLY from
    experiment, never from stoichiometry (except elementary steps). Zero order is constant rate; first
    order depends on one reactant with exponential decay; second order accelerates with concentration
    squared.
  - Temperature dependence — the Arrhenius equation k = A exp(-Ea/RT). ==Higher temperature or lower activation
    energy means faster rate==. Catalysts lower Ea for BOTH directions equally — they speed equilibrium
    attainment without shifting its position.
  misconception: '"The reaction is A + 2B, so the rate law must be rate = k[A][B]^2." Coefficients belong
    to stoichiometry, not kinetics. The exponents m and n are read off experimental data — doubling [A]
    that quadruples the rate means second order, whatever the equation says. Only an elementary step has
    a rate law that matches its own stoichiometry, which is why the slow step of a mechanism is the one
    you can trust.'
  connection: 'Enzymes are this section''s biological case: an active site holds the substrate in a geometry
    that lowers the activation barrier, so k rises enormously while delta-G and K stay put. Chapter 1A
    · Proteins and amino acids covers the binding and catalysis side, and the passage''s 10^8-fold acceleration
    is a typical enzyme''s signature.'
  connection_label: How sciences interconnect
  check:
  - q: A catalyst changes…
    options:
      A: The final concentrations at equilibrium
      B: Delta-G of the reaction
      C: The equilibrium constant
      D: The activation energy
    answer: D
    explain: Catalysts lower Ea — equilibrium is reached faster, same position.
    distractors:
      A: Same final concentrations.
      B: Delta-G is a state function — unchanged.
      C: K is temperature-only.
  - q: Doubling [A] quadruples the rate; doubling [B] leaves the rate unchanged. The rate law is…
    options:
      A: rate = k[A]2
      B: rate = k[A][B]
      C: rate = k[A]2[B]2
      D: rate = k[A]
    answer: A
    explain: A fourfold change on doubling [A] is second order; no change on doubling [B] is zero order,
      so B does not appear.
    distractors:
      B: The data say B has no effect, so it cannot be in the law.
      C: B drops out entirely — zero order means exponent zero.
      D: Doubling A gives four times the rate, not twice.
  figures:
  - src: 5e-principles-of-chemical-thermodynamics-and-kinetics/fig-29762773.webp
    caption: Reaction rate from a concentration-time curve — initial and instantaneous rates as slopes.
    credit: Ch 12 · OpenStax Chemistry 2e — CC BY-NC-SA 4.0
  - src: 5e-principles-of-chemical-thermodynamics-and-kinetics/fig-671ebc3a.webp
    caption: Approach to equilibrium — reactant and product concentrations leveling as forward and reverse
      rates equalize.
    credit: Ch 13 · OpenStax Chemistry 2e — CC BY-NC-SA 4.0
- heading: Coupled reactions and bioenergetics
  objectives:
  - Sum the free energies of coupled reactions to predict feasibility.
  - Compute the actual delta-G from delta-G standard and the reaction quotient.
  - Explain how ATP hydrolysis drives otherwise unfavourable steps.
  body:
  - Thermodynamically unfavorable reactions proceed when coupled to favorable ones. ==ATP hydrolysis (delta-G
    about -30 kJ/mol) drives biosynthesis== by coupling through shared intermediates. The cell spends
    ATP like currency — unfavorable uptake coupled to favorable hydrolysis.
  - The delta-G of a reaction under actual conditions is delta-G = delta-G standard + RT ln Q — when Q
    < K, delta-G is negative and the reaction runs forward. ==Only the actual delta-G, not the standard
    one, decides direction in the cell==, where concentrations keep Q far from standard.
  misconception: '"A reaction with a positive standard delta-G cannot proceed, so the cell must avoid
    those steps." The standard value assumes 1 M of everything — no cell runs there. Direction follows
    the ACTUAL delta-G, delta-G standard plus RT ln Q, and a small product concentration can push Q far
    below K and make the real value negative. Unfavourable steps run all the time; they just need coupling
    and the right concentrations.'
  connection: ATP hydrolysis at roughly -30 kJ/mol is the currency that makes those unfavourable steps
    affordable, and chapter 1D · Bioenergetics and fuel metabolism is where the accounting happens — glycolysis,
    the TCA cycle, and oxidative phosphorylation are all chains of coupled reactions adding their delta-G
    values to a negative total.
  connection_label: How sciences interconnect
  check:
  - q: A reaction with delta-G standard > 0 can proceed forward when…
    options:
      A: Temperature is zero
      B: A catalyst is added
      C: Q > K
      D: Q < K
    answer: D
    explain: With Q < K, the RT ln Q term makes actual delta-G negative.
    distractors:
      A: Unphysical.
      B: Catalyst changes rate, not direction.
      C: Q > K makes it reverse.
  - q: A reaction has delta-G standard = +20 kJ/mol. At 298 K, Q = 1.0 x 10^-5. The actual delta-G is
      about…
    options:
      C: -8.5 kJ/mol, so it runs forward
      A: +20 kJ/mol, so it cannot run
      B: +48.5 kJ/mol, so it runs backward
      D: Zero, since Q and K are both small
    answer: C
    explain: delta-G = delta-G standard + RT ln Q = 20 + (8.314 x 298 x ln 10^-5)/1000 = 20 - 28.5 = -8.5
      kJ/mol.
    distractors:
      A: That is the standard value; the cell does not run at standard concentrations.
      B: Adding the RT ln Q term with the wrong sign.
      D: Q is not K, so delta-G is not zero.
- heading: Reaction mechanisms
  objectives:
  - Sum elementary steps to recover the overall reaction.
  - Identify the rate-determining step and write its rate law.
  - Test a proposed mechanism against an observed rate law.
  body:
  - Mechanisms are stepwise elementary reactions that sum to the overall equation. ==The slowest step
    is the rate-determining step== — it fixes the rate law. Intermediates are produced then consumed;
    they never appear in the overall equation.
  - Read mechanism data the way the MCAT presents it — a proposed mechanism must reproduce the observed
    rate law, sum to the overall reaction, and account for every intermediate. ==A mechanism consistent
    with the rate law is supported, never proven==.
  misconception: '"The first step of a mechanism is always the rate-determining step, since everything
    has to start there." The slow step bottlenecks the sequence wherever it sits — first, middle, or last.
    A fast first step that reaches a low-concentration intermediate can leave a later slow step controlling
    the rate, which is why the observed rate law, not the order on paper, is the evidence.'
  connection: 'It is an assembly-line truth as much as a chemical one: the rate of the whole line is set
    by its slowest station, so hiring more workers anywhere else changes nothing. Doubling the throughput
    of a fast step buys exactly as much extra product as the check item''s zero-order distractor — none
    at all.'
  connection_label: Real-world connection
  check:
  - q: The rate-determining step is…
    options:
      A: The fastest step
      B: The step with the catalyst
      C: The first step always
      D: The slowest elementary step
    answer: D
    explain: The slow step bottlenecks the whole sequence.
    distractors:
      A: The fast step is not limiting.
      B: Catalyst location is separate.
      C: Not necessarily first.
  - q: A mechanism's slow step is A + B -> C. The observed rate law must be…
    options:
      A: rate = k[A][B]
      B: rate = k[C]
      C: rate = k[A]2
      D: rate = k, a zero-order law
    answer: A
    explain: The slow step fixes the rate law, and it consumes one A and one B.
    distractors:
      B: Products do not set the rate; reactants in the slow step do.
      C: The overall stoichiometry is irrelevant — only the slow step counts.
      D: Two steps do not make a reaction zero order.
examples:
- prompt: For a reaction, delta-H = +75 kJ/mol and delta-S = +150 J/mol-K. Above what temperature does
    it become spontaneous?
  strategy: Two terms of opposite sign mean a crossover temperature exists, so the plan is to set delta-G
    = 0 and solve T = delta-H/delta-S — converting delta-S from J to kJ FIRST, because that unit slip
    is the entire trap in this item. Above the crossover the entropy term wins; below it the enthalpy
    penalty does.
  solution:
  - 'Set delta-G = 0 — the crossover: 0 = delta-H - T delta-S.'
  - T = delta-H / delta-S = 75,000 J/mol / 150 J/mol-K.
  - T = 500 K — above this, the -T delta-S term outweighs the unfavorable enthalpy.
  answer: Spontaneous above 500 K.
  discussion: '500 K is the answer, and the sign check matters more than the arithmetic: with delta-H
    and delta-S both positive, high temperature must help, so this is a reaction that only runs when hot.
    Sanity check the units — 75,000 J divided by 150 J/K leaves kelvin, while forgetting the kJ-to-J conversion
    yields a nonsense 0.5 K. The mirror-image case (delta-H and delta-S both negative) is why steam condenses
    as it cools.'
  distractors:
    A: Forgetting to convert kJ to J — gives 0.5 K.
    B: Dividing delta-S by delta-H inverts the answer.
    C: Sign error — below 500 K the reaction is nonspontaneous.
  practice:
    q: A reaction has delta-H = +40 kJ/mol and delta-S = +100 J/mol·K. Above what temperature is it spontaneous?
    options:
      A: 400 K
      B: 0.4 K
      C: 2500 K
      D: It is spontaneous at all temperatures
    answer: A
    explain: T = delta-H/delta-S = 40,000/100 = 400 K; above that, T delta-S exceeds the enthalpy cost.
    distractors:
      B: Forgetting to convert kJ to J before dividing.
      C: Inverting the ratio and dividing delta-S by delta-H.
      D: The enthalpy term is unfavourable, so cold runs are not spontaneous.
key_equations:
- latex: $\Delta G = \Delta H - T\Delta S$
  symbols: ΔG free energy change (kJ/mol), ΔH enthalpy change, ΔS entropy change (J/mol·K), T temperature
    (K)
  when: spontaneity — negative ΔG means product-favoured, and says nothing about rate
- latex: $T_{crossover} = \frac{\Delta H}{\Delta S}$
  symbols: T_crossover temperature where ΔG = 0, ΔH in J/mol, ΔS in J/mol·K
  when: when ΔH and ΔS share a sign — convert kJ to J before dividing
- latex: $K = \frac{[C]^{c}[D]^{d}}{[A]^{a}[B]^{b}}$
  symbols: K equilibrium constant, [ ] equilibrium concentrations, a b c d stoichiometric coefficients
  when: pure solids and liquids drop out; K changes only with temperature
- latex: $\text{rate} = k[A]^{m}[B]^{n}$
  symbols: k rate constant, m n orders found only from experiment
  when: rate laws — exponents never come from the overall equation's coefficients
- latex: $k = Ae^{-E_a/RT}$
  symbols: k rate constant, A pre-exponential factor, E_a activation energy (J/mol), R = 8.314 J/mol·K
  when: Arrhenius — higher T or lower Ea gives a faster rate; catalysts lower Ea
- latex: $\Delta G = \Delta G^{\circ} + RT\ln Q$
  symbols: ΔG actual free energy, ΔG° standard free energy, Q reaction quotient
  when: direction in the cell — Q < K makes the actual ΔG negative
- latex: $\Delta G^{\circ} = -RT\ln K$
  symbols: ΔG° standard free energy, R = 8.314 J/mol·K, T temperature (K), K equilibrium constant
  when: convert a standard free energy into an equilibrium constant and back
- latex: $\Delta G_{coupled} = \Delta G_{1} + \Delta G_{2}$
  symbols: ΔG of the coupled process = sum of the steps
  when: ATP hydrolysis (~ -30 kJ/mol) drives an unfavourable step to a negative total
key_points:
- delta-G = delta-H - T delta-S; negative means spontaneous.
- K changes only with temperature; stresses shift position.
- Rate law exponents come from experiment, not stoichiometry.
- Catalysts lower Ea — same equilibrium, faster attainment.
- Coupled reactions let ATP hydrolysis drive unfavorable steps.
- Slowest step is rate-determining; intermediates cancel.
mnemonics:
- phrase: Products over reactants, coefficients become powers
  means: How to write any K expression.
- phrase: Catalysts get you there faster, not somewhere else
  means: Ea drops, equilibrium position unchanged.
maps:
- title: Thermodynamic decision tree
  steps:
  - delta-H < 0, delta-S > 0 — spontaneous at all T
  - delta-H > 0, delta-S > 0 — spontaneous at high T
  - delta-H < 0, delta-S < 0 — spontaneous at low T
  - delta-H > 0, delta-S < 0 — never spontaneous
- title: Order of a reaction from data
  steps:
  - double [A], rate unchanged — zero order in A
  - double [A], rate doubles — first order
  - double [A], rate quadruples — second order
passage:
  text: An enzyme-catalyzed hydrolysis was studied at 25C. Without enzyme, k = 1e-6/s; with enzyme, k
    = 1e2/s. The reaction's delta-G standard is -14 kJ/mol. Adding enzyme did not change the final ratio
    of product to reactant.
  questions:
  - q: The enzyme accelerates the reaction by…
    options:
      A: Lowering activation energy
      B: Making delta-G more negative
      C: Shifting K
      D: Increasing temperature
    answer: A
    explain: Only Ea changes — the thermodynamics are untouched.
    distractors:
      B: Delta-G standard is a state function.
      C: K is unchanged as stated.
      D: Enzymes are not heat sources.
  - q: The unchanged product-to-reactant ratio confirms…
    options:
      A: Equilibrium position depends on delta-G, not catalysis
      B: The enzyme is denatured
      C: Zero-order kinetics
      D: Irreversibility
    answer: A
    explain: Same K, same final concentrations — catalysts affect rate only.
    distractors:
      B: It is active — rate rose 10^8 fold.
      C: Kinetics order is unrelated.
      D: Hydrolysis is reversible.
  - q: If delta-G standard is -14 kJ/mol, the ratio K at 25C is approximately…
    options:
      A: e^-5.6 (about 0.004)
      B: '14'
      C: e^+5.6 (about 270)
      D: '1'
    answer: C
    explain: K = exp(-delta-G standard / RT) = exp(14,000 / (8.314 x 298)) about e^5.6.
    distractors:
      A: Sign flipped — that is the reciprocal.
      B: Units mismatch.
      D: Only at delta-G = 0.
pitfalls:
- Confusing spontaneity with speed — delta-G says nothing about rate.
- Getting rate-law exponents from coefficients of the overall equation.
- Thinking catalysts shift equilibrium.
- Forgetting K is temperature-only.
- Mixing up delta-G standard with actual delta-G.
exam_map:
  NMAT: Le Chatelier, sign tables, rate-order definitions.
  MCAT: Content Category 5E — passage data on rates, coupled bioenergetics, Arrhenius reasoning.
