review_questions:
- q: A system at equilibrium…
  options:
    A: Has stopped reacting
    B: Has equal forward and reverse rates
    C: Has equal product and reactant concentrations
    D: Has K = 1
  answer: B
  explain: Dynamic balance — reactions continue at matched rates.
  distractors:
    A: Still reacting.
    C: Concentrations need not be equal.
    D: K can be any value.
- q: For a first-order reaction, doubling [A]…
  options:
    A: Doubles the rate
    B: Quadruples the rate
    C: Leaves rate unchanged
    D: Halves the rate
  answer: A
  explain: Rate = k[A]^1 — linear dependence.
  distractors:
    B: That is second order.
    C: That is zero order.
    D: Inverse is not first order.
- q: An intermediate in a mechanism…
  options:
    A: Appears in the overall equation
    B: Is consumed in later steps
    C: Is a catalyst
    D: Is always the transition state
  answer: B
  explain: Formed in one step, used in a later one — cancels from the net equation.
  distractors:
    A: It cancels out.
    C: Catalysts are consumed then regenerated.
    D: Transition states are not intermediates.
- q: ATP hydrolysis drives unfavorable biosynthesis because…
  options:
    A: It lowers Ea
    B: The coupled overall delta-G is negative
    C: It raises K
    D: It is irreversible
  answer: B
  explain: Coupling sums the free energies — favorable hydrolysis outweighs unfavorable biosynthesis.
  distractors:
    A: That is catalysis.
    C: K of the coupled reaction emerges from delta-G.
    D: It is reversible in principle.
