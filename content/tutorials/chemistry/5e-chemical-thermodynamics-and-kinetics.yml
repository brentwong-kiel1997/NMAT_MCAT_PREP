subject: chemistry
chapter: 5E · Chemical thermodynamics and kinetics
title: 5E · Principles of Chemical Thermodynamics and Kinetics
overview: Why reactions happen (thermodynamics) and how fast (kinetics) — the single most tested conceptual
  pairing on the exam. Gibbs free energy, equilibrium, rate laws, and catalysis anchor bioenergetics.
sections:
- heading: Enthalpy, entropy, and Gibbs free energy
  body:
  - Spontaneity is decided by delta-G = delta-H - T delta-S. ==Negative delta-G means spontaneous (product-favored)==,
    but says nothing about rate. Enthalpy (H) is heat at constant pressure; entropy (S) is dispersal of
    energy and matter.
  - Temperature couples the terms — when delta-H and delta-S share a sign, ==temperature decides spontaneity==.
    Exothermic with positive entropy is spontaneous at all temperatures; endothermic with negative entropy
    at none. Memorize the four-sign table.
  check:
  - q: A reaction with delta-H < 0 and delta-S < 0 is…
    options:
      A: Never spontaneous
      B: Spontaneous only at high temperature
      C: Spontaneous only at low temperature
      D: Spontaneous at all temperatures
    answer: C
    explain: At low T the favorable enthalpy term dominates — T delta-S is small.
    distractors:
      A: Not never.
      B: That is delta-H>0, delta-S>0.
      D: Not all temperatures — high T makes -T delta-S positive.
- heading: Equilibrium — the balance point
  body:
  - Every reversible reaction reaches equilibrium where forward and reverse rates equal. ==K = products
    over reactants, each raised to its stoichiometric coefficient== — only gases and aqueous species appear;
    pure solids and liquids drop out.
  - Le Chatelier — stress shifts equilibrium to relieve it. ==Adding reactant, removing product, increasing
    pressure (fewer moles gas side), and heating an endothermic reaction all shift right==. K changes
    ONLY with temperature — concentration and pressure changes shift position, not K.
  check:
  - q: For N2 + 3H2 <-> 2NH3 (delta-H < 0), increasing temperature will…
    options:
      A: Shift right and decrease K
      B: No change
      C: Shift left and decrease K
      D: Shift right and increase K
    answer: C
    explain: Exothermic — heat is a product, so added heat shifts left AND lowers K.
    distractors:
      A: Direction inconsistent with exothermic.
      B: Temperature always matters.
      D: Direction wrong.
- heading: Kinetics — rates and rate laws
  body:
  - Rate measures concentration change per time — ==rate = k[A]^m[B]^n== where m and n come ONLY from
    experiment, never from stoichiometry (except elementary steps). Zero order is constant rate; first
    order depends on one reactant with exponential decay; second order accelerates with concentration
    squared.
  - Temperature dependence — the Arrhenius equation k = A exp(-Ea/RT). ==Higher temperature or lower activation
    energy means faster rate==. Catalysts lower Ea for BOTH directions equally — they speed equilibrium
    attainment without shifting its position.
  check:
  - q: A catalyst changes…
    options:
      A: The final concentrations at equilibrium
      B: Delta-G of the reaction
      C: The equilibrium constant
      D: The activation energy
    answer: D
    explain: Catalysts lower Ea — equilibrium is reached faster, same position.
    distractors:
      A: Same final concentrations.
      B: Delta-G is a state function — unchanged.
      C: K is temperature-only.
  figures:
  - src: 5e-principles-of-chemical-thermodynamics-and-kinetics/fig-29762773.webp
    caption: Reaction rate from a concentration-time curve — initial and instantaneous rates as slopes.
    credit: Ch 12 · OpenStax Chemistry 2e — CC BY-NC-SA 4.0
  - src: 5e-principles-of-chemical-thermodynamics-and-kinetics/fig-671ebc3a.webp
    caption: Approach to equilibrium — reactant and product concentrations leveling as forward and reverse
      rates equalize.
    credit: Ch 13 · OpenStax Chemistry 2e — CC BY-NC-SA 4.0
- heading: Coupled reactions and bioenergetics
  body:
  - Thermodynamically unfavorable reactions proceed when coupled to favorable ones. ==ATP hydrolysis (delta-G
    about -30 kJ/mol) drives biosynthesis== by coupling through shared intermediates. The cell spends
    ATP like currency — unfavorable uptake coupled to favorable hydrolysis.
  - The delta-G of a reaction under actual conditions is delta-G = delta-G standard + RT ln Q — when Q
    < K, delta-G is negative and the reaction runs forward. ==Only the actual delta-G, not the standard
    one, decides direction in the cell==, where concentrations keep Q far from standard.
  check:
  - q: A reaction with delta-G standard > 0 can proceed forward when…
    options:
      A: Temperature is zero
      B: A catalyst is added
      C: Q > K
      D: Q < K
    answer: D
    explain: With Q < K, the RT ln Q term makes actual delta-G negative.
    distractors:
      A: Unphysical.
      B: Catalyst changes rate, not direction.
      C: Q > K makes it reverse.
- heading: Reaction mechanisms
  body:
  - Mechanisms are stepwise elementary reactions that sum to the overall equation. ==The slowest step
    is the rate-determining step== — it fixes the rate law. Intermediates are produced then consumed;
    they never appear in the overall equation.
  - Read mechanism data the way the MCAT presents it — a proposed mechanism must reproduce the observed
    rate law, sum to the overall reaction, and account for every intermediate. ==A mechanism consistent
    with the rate law is supported, never proven==.
  check:
  - q: The rate-determining step is…
    options:
      A: The fastest step
      B: The step with the catalyst
      C: The first step always
      D: The slowest elementary step
    answer: D
    explain: The slow step bottlenecks the whole sequence.
    distractors:
      A: The fast step is not limiting.
      B: Catalyst location is separate.
      C: Not necessarily first.
examples:
- prompt: For a reaction, delta-H = +75 kJ/mol and delta-S = +150 J/mol-K. Above what temperature does
    it become spontaneous?
  solution:
  - 'Set delta-G = 0 — the crossover: 0 = delta-H - T delta-S.'
  - T = delta-H / delta-S = 75,000 J/mol / 150 J/mol-K.
  - T = 500 K — above this, the -T delta-S term outweighs the unfavorable enthalpy.
  answer: Spontaneous above 500 K.
  distractors:
    A: Forgetting to convert kJ to J — gives 0.5 K.
    B: Dividing delta-S by delta-H inverts the answer.
    C: Sign error — below 500 K the reaction is nonspontaneous.
key_points:
- delta-G = delta-H - T delta-S; negative means spontaneous.
- K changes only with temperature; stresses shift position.
- Rate law exponents come from experiment, not stoichiometry.
- Catalysts lower Ea — same equilibrium, faster attainment.
- Coupled reactions let ATP hydrolysis drive unfavorable steps.
- Slowest step is rate-determining; intermediates cancel.
mnemonics:
- phrase: Products over reactants, coefficients become powers
  means: How to write any K expression.
- phrase: Catalysts get you there faster, not somewhere else
  means: Ea drops, equilibrium position unchanged.
maps:
- title: Thermodynamic decision tree
  steps:
  - delta-H < 0, delta-S > 0 — spontaneous at all T
  - delta-H > 0, delta-S > 0 — spontaneous at high T
  - delta-H < 0, delta-S < 0 — spontaneous at low T
  - delta-H > 0, delta-S < 0 — never spontaneous
- title: Order of a reaction from data
  steps:
  - double [A], rate unchanged — zero order in A
  - double [A], rate doubles — first order
  - double [A], rate quadruples — second order
passage:
  text: An enzyme-catalyzed hydrolysis was studied at 25C. Without enzyme, k = 1e-6/s; with enzyme, k
    = 1e2/s. The reaction's delta-G standard is -14 kJ/mol. Adding enzyme did not change the final ratio
    of product to reactant.
  questions:
  - q: The enzyme accelerates the reaction by…
    options:
      A: Lowering activation energy
      B: Making delta-G more negative
      C: Shifting K
      D: Increasing temperature
    answer: A
    explain: Only Ea changes — the thermodynamics are untouched.
    distractors:
      B: Delta-G standard is a state function.
      C: K is unchanged as stated.
      D: Enzymes are not heat sources.
  - q: The unchanged product-to-reactant ratio confirms…
    options:
      A: Equilibrium position depends on delta-G, not catalysis
      B: The enzyme is denatured
      C: Zero-order kinetics
      D: Irreversibility
    answer: A
    explain: Same K, same final concentrations — catalysts affect rate only.
    distractors:
      B: It is active — rate rose 10^8 fold.
      C: Kinetics order is unrelated.
      D: Hydrolysis is reversible.
  - q: If delta-G standard is -14 kJ/mol, the ratio K at 25C is approximately…
    options:
      A: e^-5.6 (about 0.004)
      B: '14'
      C: e^+5.6 (about 270)
      D: '1'
    answer: C
    explain: K = exp(-delta-G standard / RT) = exp(14,000 / (8.314 x 298)) about e^5.6.
    distractors:
      A: Sign flipped — that is the reciprocal.
      B: Units mismatch.
      D: Only at delta-G = 0.
pitfalls:
- Confusing spontaneity with speed — delta-G says nothing about rate.
- Getting rate-law exponents from coefficients of the overall equation.
- Thinking catalysts shift equilibrium.
- Forgetting K is temperature-only.
- Mixing up delta-G standard with actual delta-G.
exam_map:
  NMAT: Le Chatelier, sign tables, rate-order definitions.
  MCAT: Content Category 5E — passage data on rates, coupled bioenergetics, Arrhenius reasoning.
