review_questions:
- q: Which is the LEAST reactive carboxylic acid derivative?
  options:
    A: Anhydride
    B: Ester
    C: Amide
    D: Acyl chloride
  answer: C
  explain: Amide has the worst leaving group (NH2-) — most stable.
  distractors:
    A: More reactive than amide.
    B: More reactive.
    D: Most reactive.
- q: The peptide bond is a type of…
  options:
    A: Ester
    B: Amide
    C: Ether
    D: Anhydride
  answer: B
  explain: Carboxyl + amine condensation forms an amide linkage.
  distractors:
    A: Carboxyl + alcohol gives ester.
    C: Not relevant.
    D: Two carboxyls give anhydride.
- q: Which base pair has three hydrogen bonds?
  options:
    A: A-T
    B: A-U
    C: G-C
    D: T-C
  answer: C
  explain: Guanine-cytosine share three H-bonds.
  distractors:
    A: Two bonds.
    B: Two bonds.
    D: Not a valid pair.
- q: Phospholipids form bilayers because they are…
  options:
    A: Fully hydrophobic
    B: Fully hydrophilic
    C: Amphipathic
    D: Charged only
  answer: C
  explain: Polar head + nonpolar tails = amphipathic — spontaneously form bilayers.
  distractors:
    A: Would aggregate into oil droplets.
    B: Would dissolve.
    D: Charge alone is insufficient.
