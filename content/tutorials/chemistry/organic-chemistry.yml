review_questions:
- q: A molecule with an internal mirror plane but two stereocenters is…
  options:
    A: Chiral
    B: A meso compound
    C: A racemate
    D: A diastereomer pair
  answer: B
  explain: Internal symmetry cancels optical activity despite the centers.
  distractors:
    A: Chiral requires no symmetry plane.
    C: Racemate is a mixture.
    D: That is a relationship, not a single compound.
- q: E2 requires the leaving group and beta-H to be…
  options:
    A: Syn-periplanar
    B: Anti-periplanar
    C: Gauche
    D: Orthogonal
  answer: B
  explain: Anti alignment lets the base abstract as the bond breaks in one concerted step.
  distractors:
    A: Syn works poorly.
    C: Gauche is off-axis.
    D: Orthogonal has no overlap.
- q: Which carbocation is most stable?
  options:
    A: Methyl
    B: Primary
    C: Secondary
    D: Tertiary
  answer: D
  explain: Alkyl groups donate electron density and stabilize the positive charge.
  distractors:
    A: No donors.
    B: Fewest donors.
    C: Intermediate donors.
- q: A Grignard reagent adds to formaldehyde to give…
  options:
    A: A primary alcohol
    B: A secondary alcohol
    C: A tertiary alcohol
    D: A carboxylic acid
  answer: A
  explain: One carbon added to formaldehyde — after workup, a primary alcohol.
  distractors:
    B: Needs an aldehyde other than formaldehyde.
    C: Needs a ketone.
    D: CO2 gives the acid.
