review_questions:
- q: In chromatography, the stationary phase is…
  options:
    A: The moving phase
    B: The fixed phase
    C: The detector
    D: The sample
  answer: B
  explain: Stationary stays fixed; mobile phase moves through.
  distractors:
    A: That is the mobile phase.
    C: Detector measures output.
    D: Sample is what is separated.
- q: Which DNA fragment runs furthest in agarose gel?
  options:
    A: 1 kb
    B: 5 kb
    C: 10 kb
    D: 23 kb
  answer: A
  explain: Smallest fragment meets least gel resistance.
  distractors:
    B: Larger fragments are slower.
    C: Larger still.
    D: Largest and slowest.
- q: An azeotrope is…
  options:
    A: A compound with two chiral centers
    B: A constant-boiling mixture
    C: A type of chromatography
    D: A buffer system
  answer: B
  explain: Boils at constant temperature — cannot be separated by distillation.
  distractors:
    A: Stereochemistry unrelated.
    C: Not a separation method.
    D: Not a buffer.
- q: During differential centrifugation at LOW speed, the pellet contains…
  options:
    A: Ribosomes
    B: Nuclei
    C: Soluble proteins
    D: DNA
  answer: B
  explain: Nuclei are the largest organelles — pellet at lowest speed.
  distractors:
    A: Ribosomes need high speed.
    C: Proteins stay in supernatant.
    D: DNA stays soluble.
