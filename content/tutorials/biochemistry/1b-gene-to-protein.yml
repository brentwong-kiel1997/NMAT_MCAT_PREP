review_questions:
- q: Okazaki fragments appear on…
  options:
    A: The leading strand
    B: The lagging strand
    C: Both
    D: RNA only
  answer: B
  explain: Discontinuous synthesis away from the fork — primed repeatedly.
  distractors:
    A: It is continuous.
    B: Correct.
    C: Neither is fully continuous.
    D: DNA, not RNA.
- q: The genetic wobble means…
  options:
    A: One tRNA can pair with several codons
    B: Codons are ambiguous forever
    C: Stop codons read as Met
    D: Frameshifts are tolerated
  answer: A
  explain: Third-base flexibility — fewer tRNAs than codons.
  distractors:
    A: Correct.
    B: Codons are unambiguous.
    C: Stops stay stops.
    D: Frameshifts destroy meaning.
- q: Western blot detects…
  options:
    A: DNA
    B: RNA
    C: Proteins
    D: Lipids
  answer: C
  explain: Antibody binding to transferred proteins.
  distractors:
    A: Southern does.
    B: Northern does.
    C: Correct.
- q: Histone acetylation…
  options:
    A: Opens chromatin for transcription
    B: Compacts and silences
    C: Damages DNA
    D: Stops splicing
  answer: A
  explain: Neutralizing lysines loosens the nucleosome — expression ON.
  distractors:
    A: Correct.
    B: Deacetylation does that.
    C: No DNA damage.
    D: Splicing is separate.
