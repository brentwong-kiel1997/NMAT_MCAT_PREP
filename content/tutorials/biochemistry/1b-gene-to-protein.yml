subject: biochemistry
chapter: 1B · Gene to protein
title: 1B · Gene to Protein
overview: DNA structure and replication, transcription, translation, and the regulation of gene expression.
  The central dogma category — followed by a heavy experimental-methods layer on the MCAT (blotting, sequencing,
  editing).
sections:
- heading: DNA structure and the central dogma
  objectives:
  - Describe the antiparallel, complementary architecture of the double helix.
  - Distinguish DNA from RNA by sugar and by base set.
  - State the central dogma and what each arrow represents.
  body:
  - '==DNA — antiparallel double helix: sugar-phosphate backbone outside, A-T (2 H-bonds) and G-C (3 H-bonds)
    inside; 3'' to 5'' on one strand, 5'' to 3'' on the other==. DNA uses deoxyribose (no 2''-OH), A/G/C/T;
    RNA replaces T with U and uses ribose.'
  - '==Central dogma: DNA -> RNA -> protein. ==Chromatin — DNA wrapped around histones (nucleosomes);
    heterochromatin (condensed, silenced) vs euchromatin (open, active)==. Genes — promoters upstream,
    exons/introns, terminators.'
  misconception: '"Complement of 5''-ATGC-3'' is 5''-TACG-3'' — I just swapped each base." The bases are
    right but the direction was never flipped. The partner strand physically runs the other way, so pairing
    ATGC gives 3''-TACG-5'', and rewriting it in the 5''-to-3'' convention reverses it to 5''-GCAT-3''.
    Antiparallel means both the pairing AND the polarity flip, and only one of the two is visible in the
    answer choices.'
  connection: 'Antiparallelity is a structural fact with a mechanical consequence: because DNA polymerase
    can only extend a free 3''-OH, the fork needs a continuous strand and a discontinuous one — the entire
    leading-versus-lagging machinery of the next section exists because the two strands run opposite ways.'
  connection_label: How sciences interconnect
  check:
  - q: A DNA double helix is antiparallel because…
    options:
      A: One strand is left-handed
      B: Chargaff broke a rule
      C: The two strands run 5' to 3' in opposite directions
      D: One strand is RNA
    answer: C
    explain: Backbone polarity opposes — that is what enables base pairing in the groove.
    distractors:
      A: Both are right-handed.
      B: Base composition is complementary.
      C: Correct.
      D: Both DNA.
  - q: One strand reads 5'-ATGC-3'. Its complement, written 5' to 3', is…
    options:
      D: 5'-GCAT-3'
      A: 5'-TACG-3'
      B: 5'-ATGC-3'
      C: 5'-UACG-3'
    answer: D
    explain: 'Complement 3''-TACG-5'', then reverse it for the 5''-to-3'' convention: 5''-GCAT-3''.'
    distractors:
      A: Correct bases, wrong direction — the strand was not reversed.
      B: That is the original strand, not its partner.
      C: Uracil belongs to RNA, not DNA.
  figures:
  - src: 1b-gene-to-protein/fig-5eb113a0.webp
    caption: DNA-protein interaction, alpha-helices, and the folded protein — the hierarchy from information
      molecule to function.
    credit: Ch 15 · OpenStax Biology 2e — CC BY-NC-SA 4.0
- heading: DNA replication — semiconservative machinery
  objectives:
  - Explain what semiconservative replication means and how it was demonstrated.
  - Name each enzyme at the replication fork and its job.
  - Distinguish leading-strand from lagging-strand synthesis.
  body:
  - ==Semiconservative (Meselson-Stahl) — each daughter has one old and one new strand==. Replication
    fork — helicase unwinds; SSB stabilizes; primase lays RNA primers; ==DNA polymerase III extends 5'
    to 3', needing a primer; the lagging strand makes Okazaki fragments==; ligase seals.
  - ==Leading vs lagging — leading is continuous toward the fork; lagging is discontinuous (Okazaki fragments)
    away from the fork==. ==Proofreading — 3' to 5' exonuclease fixes errors, error rate ~1 in 10^9 with
    mismatch repair==. Telomerase extends chromosome ends in germline/STEM cells.
  misconception: '"DNA polymerase starts the chain — it reads the template and begins adding nucleotides
    at the origin." It cannot start anything. The enzyme only extends an existing chain from a free 3''-OH,
    which is why primase must first lay a short RNA primer. That single limitation explains the lagging
    strand''s Okazaki fragments and ligase''s sealing job — remove the primer requirement and half the
    fork machinery becomes unnecessary.'
  connection: 'The proofreading exonuclease here is the first line of the repair hierarchy chapter 1C
    · Heritable information and diversity builds out: 3''-to-5'' checking during replication, then mismatch
    repair after it, and the excision lanes for damage that survives both. The ~1 in 10^9 fidelity is
    the combined result, not one enzyme''s.'
  connection_label: How sciences interconnect
  check:
  - q: DNA polymerase cannot…
    options:
      A: Add nucleotides 5' to 3'
      B: Pair A with T
      C: Read the template
      D: Initiate synthesis without a primer
    answer: D
    explain: It extends pre-existing 3'-OH ends — primase provides the starter.
    distractors:
      A: It always adds to the 3' end.
      B: It pairs faithful bases.
      C: It reads the template.
      D: Correct.
  - q: Why does the lagging strand require DNA ligase?
    options:
      A: To seal the nicks left between Okazaki fragments
      B: To unwind the helix ahead of the fork
      C: To lay down the RNA primers
      D: To proofread the newly synthesised strand
    answer: A
    explain: Discontinuous synthesis leaves breaks between fragments; ligase closes the phosphodiester
      backbone.
    distractors:
      B: That is helicase's job.
      C: Primase makes the primers.
      D: Proofreading belongs to the polymerase's exonuclease activity.
- heading: Transcription — DNA to RNA
  objectives:
  - Relate the template and coding strands to the mRNA sequence.
  - Identify the processing steps a eukaryotic pre-mRNA undergoes.
  - Explain how chromatin state controls transcription.
  body:
  - ==RNA polymerase reads the template strand 3' to 5', synthesizing RNA 5' to 3'; the coding strand
    matches the RNA sequence (T->U)==. Prokaryotes — single polymerase, polycistronic messages, no splicing.
    ==Eukaryotes — RNA Pol II for mRNA; 5' cap, poly-A tail, splicing removed introns==.
  - ==Regulation — promoters and enhancers; transcription factors (activators, repressors); histone acetylation
    opens chromatin (genes ON), deacetylation silences. ==Alternative splicing — one gene, many proteins==.
  misconception: '"The mRNA matches the template strand, since that is the strand being read." It matches
    the OTHER one. RNA polymerase reads the template 3'' to 5'' and builds a complement of it — which
    is, base for base, the coding strand with U replacing T. Template is read; coding is echoed. The check''s
    3''-TAC-5'' giving 5''-AUG-3'' shows the double step.'
  connection: 'Histone acetylation is where chemistry meets gene control: neutralising lysine''s positive
    charge releases the DNA it was gripping, the nucleosome loosens, and transcription machinery gains
    access. Chapter 1C · Heritable information and diversity treats the same mechanism as epigenetics
    — heritable change in expression with no change in sequence.'
  connection_label: How sciences interconnect
  check:
  - q: The mRNA sequence resembles…
    options:
      A: The template strand exactly
      B: The coding strand (U for T)
      C: Neither strand
      D: Both strands
    answer: B
    explain: RNA is synthesized complementary to template — identical (with U) to coding.
    distractors:
      A: It is complementary.
      B: Correct.
      C: It always matches one.
      D: Only the complementary one.
  - q: The template strand reads 3'-TAC-5'. The mRNA codon is…
    options:
      A: 5'-AUG-3'
      B: 5'-ATG-3'
      C: 3'-ATG-5'
      D: 5'-UAC-3'
    answer: A
    explain: Complement the template (AUG) and write it 5' to 3' — and note this equals the coding strand
      with U for T.
    distractors:
      B: DNA letters in an RNA transcript.
      C: Right bases, wrong direction.
      D: Copying the template instead of complementing it.
- heading: Translation — RNA to protein
  objectives:
  - Decode a codon sequence into an amino acid chain.
  - Describe the ribosome's A, P, and E sites and their order.
  - Identify what post-translational processing does to a nascent protein.
  body:
  - ==mRNA triplets (codons) decode via the genetic code; wobble lets one tRNA read multiple codons; start
    AUG, stop UAA/UAG/UGA==. Ribosome — small 40S + large 60S (eukaryotes); ==A (aminoacyl), P (peptidyl),
    E (exit) sites; aminoacyl-tRNA synthetases charge tRNAs (ATP).==
  - ==Peptide chain grows N to C; energy from GTP (EF-Tu in bacteria, eEF1 in eukaryotes)==. Antibiotics
    exploit the machinery — tetracycline blocks A-site binding, puromycin premature termination. ==Post-translational
    — folding, glycosylation, cleavage, targeting signal sequences==.
  misconception: '"AUG-CCC-UAA is three codons, so the peptide has three amino acids." Stop codons specify
    nothing. AUG (methionine) and CCC (proline) are translated; UAA recruits a release factor and the
    chain ends with two residues. Counting codons only counts when every codon is a sense codon.'
  connection: 'The energy bookkeeping of translation is a GTP story, not ATP: charging tRNAs costs ATP,
    but the elongation and translocation steps spend GTP — a different nucleotide running a different
    pool. That distinction is the same ATP-versus-GTP currency split chapter 1D · Bioenergetics and fuel
    metabolism keeps track of across the cell.'
  connection_label: How sciences interconnect
  check:
  - q: Aminoacyl-tRNA synthetase…
    options:
      A: Cleaves mRNA
      B: Ribosome assembly
      C: Folds proteins
      D: Matches each amino acid to its tRNA using ATP
    answer: D
    explain: The charging step — ATP-dependent, the code's executioner.
    distractors:
      A: Nucleases do.
      B: That is the ribosome.
      C: Chaperones do.
      D: Correct.
  - q: An mRNA reads AUG-CCC-UAA. How many amino acids does the peptide carry?
    options:
      D: Two — the third codon is a stop
      A: Three — every codon contributes
      B: One — translation halts at the second codon
      C: Zero — the start codon is never translated
    answer: D
    explain: AUG codes methionine, CCC proline, and UAA is a stop codon that releases the chain.
    distractors:
      A: Stop codons specify no amino acid.
      B: Nothing halts translation at CCC; it is a proline codon.
      C: AUG is translated — it is methionine.
- heading: 'Methods: blots, sequencing, and editing'
  objectives:
  - Match each blot type to the molecule it detects.
  - Predict PCR yield after a given number of cycles.
  - Describe how CRISPR-Cas9 produces an edit at a chosen locus.
  body:
  - ==Southern blot = DNA, Northern = RNA, Western = protein — probe on membrane (labeled nucleic acid
    or antibody)==. PCR — denature 95, anneal 50-65, extend 72; ==amplification is 2^n==— requires primers
    and a heat-stable polymerase (Taq)==.
  - ==Sanger sequencing — dideoxynucleotides terminate chains; read bands by length==. NGS — massively
    parallel short reads. ==CRISPR-Cas9 — guide RNA targets Cas9 to cut; homology-directed repair or NHEJ
    edits the locus==. Restriction enzymes cut at palindromic sites; vectors (plasmids) carry inserts.
  misconception: '"Twenty PCR cycles from one template gives forty copies — two per cycle, twenty cycles."
    Two per cycle is not added, it is multiplied: every product becomes a template in the next cycle,
    so the count is 2^20, about a million. PCR is exponential precisely because the copies replicate —
    2n would be the arithmetic if they did not.'
  connection: 'That exponential curve is why PCR turned diagnostics inside out: a handful of viral genomes
    in a swab become a detectable signal within hours. The same GC-melting arithmetic in the passage sets
    primer design — a GC-rich target demands a higher annealing temperature, and getting it wrong gives
    primer dimers or no product at all.'
  connection_label: Real-world connection
  check:
  - q: PCR amplifies DNA exponentially because…
    options:
      A: Primers mutate
      B: dNTPs replicate
      C: The polymerase never stops
      D: Each cycle doubles every template
    answer: D
    explain: Products become templates next cycle — 2^n amplification.
    distractors:
      A: Primers are constants.
      B: dNTPs are monomers.
      C: It stops at product completion.
      D: Correct.
  - q: Starting from one template molecule, how many copies does 20 PCR cycles yield?
    options:
      A: About 1 x 10^6 copies (2^20)
      B: 40 copies
      C: 400 copies
      D: 10^20 copies
    answer: A
    explain: Every cycle doubles every template, so the count is 2^n, not 2n or n^2.
    distractors:
      B: Multiplying the cycle number by two.
      C: Squaring the cycle number instead of exponentiating.
      D: Confusing the exponent base with the cycle count.
  figures:
  - src: 1b-gene-to-protein/gel-electrophoresis.webp
    caption: Gel electrophoresis — fragments separate by size; the smallest run farthest.
    credit: Fig 14.9 · OpenStax Biology 2e — CC BY-NC-SA 4.0
examples:
- prompt: A gene with 3 exons (40, 60, 50 nt coding) and 2 introns (95 nt each) is transcribed, capped,
    spliced, and polyadenylated. Estimate the mature mRNA length.
  strategy: 'Split the accounting into two independent parts: the exons sum to the coding length, and
    the introns are deleted by splicing before the mRNA ever leaves the nucleus, so they contribute nothing.
    Add the cap and poly-A tail last, since neither is transcribed off the template.'
  solution:
  - 'Before splicing: primary transcript = 40 + 60 + 50 + 95 + 95 = 340 nt.'
  - Splicing removes the introns — 190 nt gone.
  - Mature mRNA = 40 + 60 + 50 = 150 nt coding region.
  - Plus 5' cap and ~200 nt poly-A tail — total around 350 nt.
  answer: ~150 nt of coding sequence plus cap and poly-A — introns never reach the ribosome.
  discussion: '150 nt is what the ribosome sees; the 190 nt of intron is transcribed and thrown away,
    which is why the primary transcript is more than twice the mature message. Note the general bookkeeping
    rule — the poly-A tail is added post-transcriptionally, so it never appears in the gene''s exon count.
    Follow the arithmetic one step further: 150 nt of coding sequence means 50 codons, i.e. 49 amino acids
    once the stop is discounted, which is exactly the translation question the MCAT recycles.'
  distractors:
    A: 340 nt — that is pre-mRNA, before splicing.
    B: 150 nt without cap/tail — incomplete.
    C: Counting introns as translated — never happens.
  practice:
    q: A gene has four exons of 30, 45, 60, and 15 nt and three introns of 80 nt each. What is the coding
      length of the mature mRNA?
    options:
      B: 150 nt
      A: 390 nt
      C: 240 nt
      D: 90 nt
    answer: B
    explain: Exons sum to 30 + 45 + 60 + 15 = 150 nt; the 240 nt of intron is spliced out.
    distractors:
      A: That is the primary transcript before splicing.
      C: Reporting the intron total instead of the exon total.
      D: Adding only two of the four exons.
key_equations:
- latex: '$\text{A-T: } 2\ \text{H-bonds};\ \ \text{G-C: } 3\ \text{H-bonds}$'
  symbols: hydrogen bonds per base pair
  when: GC-rich duplexes melt higher — the basis of primer and probe design
- latex: $\text{copies} = N_{0}\times2^{n}$
  symbols: N₀ starting template molecules, n cycle number
  when: PCR amplification — exponential, never 2n; 20 cycles from one template gives about a million copies
- latex: $\text{codons} = \frac{\text{coding nt}}{3}$
  symbols: coding nucleotides in the mature mRNA
  when: translation arithmetic — subtract the stop codon before counting amino acids
- latex: $\text{mature mRNA} = \sum \text{exons} + \text{cap} + \text{poly-A}$
  symbols: exon lengths in nucleotides; introns are spliced out and never counted
  when: splicing bookkeeping — the primary transcript is exon plus intron, the message is exon only
- latex: $\text{error rate} \approx 10^{-9}\ \text{per base}$
  symbols: combined replication fidelity with proofreading and mismatch repair
  when: polymerase alone is far sloppier — the repair layers of chapter 1C close the gap
key_points:
- Antiparallel; A-T 2 bonds, G-C 3 — Tm scales with GC.
- Semiconservative; lagging strand made in Okazaki fragments.
- Pol III needs a primer; proofreading via 3' exonuclease.
- mRNA matches coding strand with U; AUG starts, stops end.
- Ribosome A-P-E sites; N-to-C synthesis consumes GTP.
- Southern DNA, Northern RNA, Western protein; PCR 2^n.
mnemonics:
- phrase: Southern DNA, Northern RNA, Western protein
  means: The blot types by molecule.
- phrase: 'A-P-E sequence: aminoacyl, peptidyl, exit'
  means: Ribosome site order along the mRNA.
maps:
- title: Replication fork
  steps:
  - helicase unwinds
  - SSB proteins stabilize
  - primase lays RNA primer
  - pol III extends 5'->3' (leading continuous, lagging fragmented)
  - ligase seals nicks
- title: Central dogma map
  steps:
  - DNA — replication (semi-conservative)
  - -> transcription -> pre-mRNA (cap, splice, tail)
  - -> mRNA -> translation (ribosome, tRNA)
  - -> protein (fold, modify, target)
passage:
  text: A researcher designs a PCR to amplify a 1.0 kb exon. She sets annealing at 60C. The region is
    GC-rich (72%) — melting analysis shows the amplicon melts at 88C. After 35 cycles she loads the product
    on a gel.
  questions:
  - q: The GC-richness raises the melting temperature because…
    options:
      A: GC pairs form 2 H-bonds
      B: Salt lowers Tm
      C: GC pairs form 3 H-bonds
      D: Primers are GC-poor
    answer: C
    explain: Three H-bonds per pair outnumber AT's two.
    distractors:
      A: Opposite.
      B: Salt raises Tm.
      C: Correct.
      D: Primers are designed to match the target.
  - q: After 35 cycles, the number of amplicon copies per starting template is approximately…
    options:
      A: 35x
      B: 2^35 (about 3.4e10)
      C: 70x
      D: 35^2
    answer: B
    explain: Each cycle doubles — 2^n growth.
    distractors:
      A: Linear count.
      B: Correct — exponential.
      C: Doubling each direction.
      D: Squared arithmetic.
  - q: If the polymerase lacked proofreading, the main risk is…
    options:
      A: Mutations accumulating in copies
      B: Primers melting
      C: Excess product
      D: Gel overloading
    answer: A
    explain: Taq with low fidelity — errors per amplified copy.
    distractors:
      A: Correct.
      B: That is annealing temperature.
      C: Excess is expected.
      D: Handling issue.
pitfalls:
- Leading vs lagging strand continuity.
- Template vs coding strand — the RNA matches coding.
- PCR cycles vs copies — 2^n not 2n.
- Southern/Northern/Western swap.
- Polymerase needing a primer — primase's role.
exam_map:
  NMAT: Central dogma vocabulary, replication basics.
  MCAT: Content Category 1B — regulation logic and experimental method passages.
