subject: biochemistry
chapter: Chemistry of Biochemistry (CEM)
title: Chemistry of Biochemistry (CEM)
overview: 'The NMAT''s own biochemistry pass under the Chemistry subtest — biomolecule chemistry from
  a CEM syllabus lens: macromolecule classification, enzyme basics, and bioenergetics at introductory
  depth. Connect everything to the 5D and 1D charts.'
sections:
- heading: Macromolecules — the big four
  objectives:
  - Classify a biomolecule into one of the four macromolecule families.
  - Name the bond that joins each family's monomers.
  - Explain why humans cannot digest cellulose.
  body:
  - ==Carbohydrates — monosaccharides (glucose), disaccharides (sucrose, lactose, maltose), polysaccharides
    (starch, glycogen, cellulose); glycosidic bonds link them==. ==Lipids — fatty acids, triacylglycerols,
    phospholipids (membranes), steroids (cholesterol) — hydrophobic==.
  - ==Proteins — amino acids -> peptide bonds -> structure levels; enzymes are proteins that lower activation
    energy==. ==Nucleic acids — nucleotides, DNA double helix (A-T, G-C), RNA; store and transmit information==.
  misconception: '"Cellulose and starch are both made of glucose, so humans should be able to digest both
    equally." Same monomer, different LINKAGE. Starch uses alpha-1,4 bonds our amylase hydrolyses; cellulose
    uses beta-1,4 bonds, and no human enzyme cuts those. Cows digest grass only because their gut microbes
    supply the cellulase — the animal itself still cannot make it.'
  connection: 'Each family has its own joining chemistry, and that chemistry is the door to the deeper
    chapters: glycosidic bonds to 5D''s carbohydrate section, ester bonds to its lipid section, peptide
    bonds to 1A''s protein folding. Learn the four linkages here and you hold the indexing system for
    the whole biomolecule map.'
  connection_label: How sciences interconnect
  check:
  - q: Cellulose differs from starch because…
    options:
      A: It is made of fructose
      B: It is a protein
      C: It is digested by humans
      D: Its glucose units link by beta-1,4 bonds
    answer: D
    explain: Beta linkage — humans lack cellulase to break it.
    distractors:
      A: Glucose only.
      B: Not a biomolecule type.
      C: Humans cannot digest it.
      D: Correct.
  - q: Which bond joins the fatty acids to glycerol in a triglyceride?
    options:
      B: Ester bonds
      A: Glycosidic bonds
      C: Peptide bonds
      D: Phosphodiester bonds
    answer: B
    explain: Carboxyl plus alcohol condenses to an ester — three of them for a triacylglycerol.
    distractors:
      A: Glycosidic bonds join sugars.
      C: Peptide bonds join amino acids.
      D: Phosphodiester bonds join nucleotides.
  figures:
  - src: chemistry-of-biochemistry-cem/fig-35fa1423.webp
    caption: Amylose (linear) versus amylopectin (branched) — glucose polymers differing in glycosidic
      linkage.
    credit: Fig 3.4 · OpenStax Biology 2e — CC BY-NC-SA 4.0
  - src: chemistry-of-biochemistry-cem/fig-04941f60.webp
    caption: Sucrose formation — a glycosidic bond condenses glucose and fructose, eliminating water.
    credit: Fig 3.6 · OpenStax Biology 2e — CC BY-NC-SA 4.0
- heading: Enzymes — the NMAT essentials
  objectives:
  - Explain how an enzyme lowers activation energy without being consumed.
  - Predict how temperature, pH, and concentration changes alter the rate.
  - Distinguish competitive from noncompetitive inhibition.
  body:
  - ==Enzymes are catalytic proteins — lower Ea, unaltered at the end, highly specific (active sites,
    induced fit)==. ==Factors — temperature (optimum, then denature), pH (optimum), substrate concentration
    (saturates), enzyme concentration (linear)==.
  - ==Inhibitors — competitive (same site, overcome by substrate) vs noncompetitive (elsewhere, lowers
    Vmax) — the NMAT favorite comparison. ==Enzyme denaturation vs inhibition — inhibition reversible,
    denaturation destroys shape==; coenzymes (vitamins) assist catalysis.
  misconception: '"Both inhibitor types slow the enzyme, so more substrate should fix either one." Only
    competitive inhibition can be out-competed, because there the inhibitor sits in the active site the
    substrate wants. A noncompetitive inhibitor binds elsewhere and removes working enzyme — fewer catalysts,
    each with unchanged affinity — so Vmax falls and no amount of substrate restores it. That Vmax-versus-Km
    split is the whole diagnostic.'
  connection: 'Denaturation and inhibition are different failures, and the difference matters clinically:
    an inhibitor is a molecule you can wash out or out-compete, while a denatured enzyme — heat or extreme
    pH — has lost its shape permanently. The same distinction appears in chapter 1A''s folding section,
    where the four structure levels show exactly what a denaturant untangles.'
  connection_label: How sciences interconnect
  check:
  - q: Increasing substrate concentration overcomes…
    options:
      A: pH effects
      B: Noncompetitive inhibition
      C: Competitive inhibition
      D: Denaturation
    answer: C
    explain: More substrate outcompetes the inhibitor at the same site.
    distractors:
      A: pH optimum stands.
      B: Saturates elsewhere.
      C: Correct.
      D: Shape destruction is irreversible.
  - q: An enzyme's Vmax falls but its Km is unchanged. What is happening?
    options:
      A: Noncompetitive inhibition — the inhibitor binds away from the active site
      B: Competitive inhibition — the inhibitor sits in the active site
      C: Denaturation, which is reversible
      D: Nothing — Vmax cannot change under inhibition
    answer: A
    explain: Binding elsewhere reduces the number of working enzymes (Vmax) without touching substrate
      affinity (Km).
    distractors:
      B: Competitive inhibition raises the apparent Km instead.
      C: Denaturation destroys the shape irreversibly.
      D: Lowering the number of active enzymes lowers Vmax by definition.
- heading: Bioenergetics — energy flow in cells
  objectives:
  - Explain why ATP serves as the universal energy currency.
  - Order the stages of cellular respiration and where each occurs.
  - Distinguish catabolic from anabolic reactions by energy flow.
  body:
  - ==ATP is the universal currency (hydrolysis releases ~30 kJ/mol); ADP + P -> ATP requires input (respiration/photosynthesis)==.
    ==Cellular respiration — glycolysis (cytosol, net 2 ATP), TCA (matrix), electron transport (membrane)
    — the aerobic yield drives most cells==.
  - ==Catabolic vs anabolic — breakdown releases (exergonic); synthesis requires input (endergonic); coupled
    reactions transfer energy==. ==Photosynthesis — light reactions make ATP/NADPH, Calvin cycle fixes
    CO2==.
  misconception: '"Glycolysis needs oxygen — that is why sprinting makes you breathe hard." Glycolysis
    is anaerobic by design: it runs in the cytosol, needs no oxygen, and nets 2 ATP per glucose on its
    own. The heavy breathing comes later — the oxygen is the terminal electron acceptor for the much larger
    aerobic yield, which is why a sprint accumulates lactate when that demand cannot be met fast enough.'
  connection: 'Chemiosmosis is the energy-coupling idea of chapter 5E made physical: the electron transport
    chain stores redox energy as a proton gradient across a membrane, and ATP synthase spends that gradient.
    The same arrangement in reverse — a proton gradient driving work — appears in chapter 2A as the membrane
    principle the cell exploits everywhere.'
  connection_label: How sciences interconnect
  check:
  - q: The main role of the electron transport chain is…
    options:
      A: Fixing CO2
      B: Storing glucose
      C: Building ATP from the proton gradient
      D: Digesting food
    answer: C
    explain: Protons pumped by the chain drive ATP synthase — chemiosmosis.
    distractors:
      A: That is the Calvin cycle.
      B: Glycogenesis.
      C: Correct.
      D: That is digestion.
  - q: Glycolysis alone yields what net ATP per glucose?
    options:
      C: '2'
      A: '4'
      B: 30-32
      D: '0'
    answer: C
    explain: Four are made and two are spent in the priming phase.
    distractors:
      A: That is the gross yield before the investment is repaid.
      B: That is the full aerobic total, which needs the TCA cycle and the ETC.
      D: Glycolysis needs no oxygen to make ATP.
- heading: Vitamins, minerals, and clinical chemistry
  objectives:
  - Sort the vitamins into water-soluble and fat-soluble groups.
  - Match each B vitamin to the coenzyme it generates.
  - Relate a mineral to its principal physiological role.
  body:
  - ==Water-soluble vitamins (B complex, C) — coenzymes or their precursors (NAD from niacin, FAD from
    riboflavin, PLP from B6, CoA from pantothenate); fat-soluble (A, D, E, K) — absorption needs fat;
    deficiency syndromes==. ==Minerals — calcium (bone, muscle), iron (hemoglobin), iodine (thyroid hormones),
    sodium/potassium (membrane potential)==.
  - ==Clinical chemistry — glucose, lipids (cholesterol profile), uric acid (gout), blood gases==. ==Reference
    ranges are context — fasting vs postprandial; liver enzymes (ALT, AST) mark damage==.
  misconception: '"Vitamins are just healthy — take them all and the more the better." Water-soluble excess
    is excreted, but the fat-soluble group (A, D, E, K) is stored in body fat and can accumulate to toxicity.
    Absorption also needs dietary fat, which is why a fat-free meal wastes a supplement. The classification
    is a functional one, not a trivia label.'
  connection: 'Most B vitamins are coenzyme precursors, which makes them the hinge between nutrition and
    the metabolism of chapter 1D: niacin builds NAD, riboflavin FAD, pantothenate CoA. A deficiency shows
    up as a metabolic bottleneck, not a vague tiredness — the pathway stalls where its cofactor runs out.'
  connection_label: How sciences interconnect
  check:
  - q: Which vitamin is a precursor of NAD+?
    options:
      A: Vitamin C
      B: Niacin (B3)
      C: Vitamin D
      D: Folate
    answer: B
    explain: Niacin builds the NAD coenzyme structure.
    distractors:
      A: A coenzyme for collagen? No.
      B: Correct.
      C: Calcium metabolism.
      D: One-carbon transfers.
  - q: Pantothenate (vitamin B5) is the precursor of which coenzyme?
    options:
      C: Coenzyme A
      A: NAD
      B: FAD
      D: PLP
    answer: C
    explain: Pantothenate sits at the heart of CoA, the acyl-group carrier.
    distractors:
      A: NAD comes from niacin (B3).
      B: FAD comes from riboflavin (B2).
      D: PLP comes from vitamin B6.
- heading: Practical biochemistry — food label and medical test literacy
  objectives:
  - Apply the 4-4-9 rule to a food label.
  - Match an enzyme test to the organ damage it reports.
  - Interpret a lab value in light of its reference range and trend.
  body:
  - ==Calorie math — 4-4-9 rule (carb/protein/fat kcal per gram); % daily values are per-2000-kcal references==.
    ==Enzyme tests — cardiac troponin (heart muscle damage), ALT/AST (liver), amylase/lipase (pancreas),
    HbA1c (3-month glucose average)==.
  - '==Normal lab literacy — the units and the trend matter: rising creatinine = renal function; rising
    BNP = heart failure; D-dimer as rule-out for thromboembolism==.'
  misconception: '"HbA1c measures today''s blood sugar — it is just another glucose test." It measures
    a three-month average, because glucose attaches to hemoglobin over the red cell''s lifetime and the
    fraction glycated reflects the running mean. A single fasting glucose is a snapshot; HbA1c is the
    long exposure. Confusing the two time windows is the standard error.'
  connection: 'The 4-4-9 rule is Atwater''s energy-density arithmetic, and it explains the pattern on
    any food label: fat carries more than twice the kilocalories per gram of carbohydrate or protein,
    which is why the same mass of oil out-energy sugar. The clinical tests in this section are the same
    idea read in reverse — a lab value interpreted against its reference range and its trend.'
  connection_label: Real-world connection
  check:
  - q: HbA1c reflects…
    options:
      A: Pancreatic inflammation
      B: Kidney filtration
      C: Today's glucose
      D: Blood glucose over about 3 months
    answer: D
    explain: Glycated hemoglobin accumulates with long-term average glucose.
    distractors:
      A: Amylase/lipase.
      B: Creatinine does.
      C: Fingertip glucose does that.
      D: Correct.
  - q: A snack provides 20 g carbohydrate, 10 g protein, and 8 g fat. Its energy content is…
    options:
      B: 192 kcal
      A: 152 kcal
      C: 304 kcal
      D: 38 kcal
    answer: B
    explain: (20 x 4) + (10 x 4) + (8 x 9) = 80 + 40 + 72 = 192 kcal.
    distractors:
      A: Counting the fat at 4 kcal/g instead of 9.
      C: Counting every gram at 9 kcal/g.
      D: Adding the gram amounts without converting.
examples:
- prompt: A patient presents with lactose intolerance after a gastric infection. Explain the enzyme and
    the biochemical basis.
  strategy: 'Anchor on the substrate, not the symptom: lactose is a disaccharide that needs a brush-border
    disaccharidase, so the plan is to name the enzyme, state what it hydrolyses into (glucose plus galactose),
    and then trace what happens to the sugar that never gets absorbed once it reaches the colon.'
  solution:
  - Lactase — brush-border enzyme hydrolyzing lactose -> glucose + galactose.
  - Reduced lactase -> undigested disaccharide reaches the colon.
  - Colonic bacteria ferment it — gas, osmotic water, cramps.
  - Management — lactase supplements or lactose-free diet.
  answer: Lactase deficiency — undigested lactose feeds colonic fermentation.
  discussion: 'One mechanism explains every symptom: unabsorbed lactose holds water into the lumen while
    colonic bacteria ferment it to gas, producing cramps and diarrhoea together. Note what this is not
    — an enzyme deficiency, not an allergy, so no immune mechanism is involved, and secondary lactase
    loss after a gastric infection is often reversible. The same logic generalises to sucrase-isomaltase
    deficiency, where the symptoms are identical but the offending disaccharide differs.'
  distractors:
    A: Sucrase deficiency — wrong disaccharide.
    B: Insulin — wrong axis entirely.
    C: Milk allergy — immune, not enzymatic.
  practice:
    q: A patient develops bloating and diarrhoea after drinking ordinary milk and eating ice cream, but
      tolerates aged hard cheese and lactose-free milk. Which enzyme is deficient?
    options:
      B: Lactase — fresh dairy carries lactose, and ageing removes most of it
      A: Sucrase — table sugar is the trigger
      C: Amylase — starch is the trigger
      D: Lipase — fat is the trigger
    answer: B
    explain: 'The pattern tracks lactose content exactly: hard cheese and lactose-free milk have little
      or none.'
    distractors:
      A: Sucrose is not present in fresh milk as the trigger.
      C: Starch digestion is unaffected by dairy.
      D: Fat intolerance would not spare lactose-free milk, which keeps its fat.
key_equations:
- latex: $\text{kcal} = 4c + 4p + 9f$
  symbols: c grams carbohydrate, p grams protein, f grams fat
  when: the 4-4-9 rule — food-label energy arithmetic per gram of each macronutrient
- latex: '$\text{glycolysis: } 4\ \text{made} - 2\ \text{spent} = 2\ \text{net ATP}$'
  symbols: gross payoff minus priming investment, per glucose
  when: the net figure is what any further tally expects; the aerobic total is 30-32 with the TCA cycle
    and ETC
- latex: $\text{ATP} + H_{2}O \rightarrow \text{ADP} + P_{i}$
  symbols: hydrolysis releasing about 30 kJ/mol
  when: the coupling currency — transfer the phosphate to drive an endergonic step
- latex: $v = \frac{V_{max}[S]}{K_m + [S]}$
  symbols: v rate, V_max, [S] substrate, K_m Michaelis constant
  when: competitive inhibition raises apparent Km; noncompetitive lowers Vmax with Km unchanged
- latex: $\text{glycosidic/ester/peptide/phosphodiester}$
  symbols: the joining bond of each macromolecule family
  when: linkage identity decides digestibility — beta-1,4 cellulose resists human amylase
key_points:
- Big four — carbs (glycosidic), lipids (ester), proteins (peptide), nucleic acids (phosphodiester).
- 'Enzymes lower Ea — factor effects: T, pH, [S], [E].'
- Competitive — same site, substrate overcomes; noncompetitive — Vmax drop.
- ATP currency; respiration stages and 2 net ATP in glycolysis.
- Vitamins — B-complex coenzymes; fat-soluble ADEK.
- 4-4-9 rule; troponin heart, ALT/AST liver.
mnemonics:
- phrase: ADEK go into fat
  means: The fat-soluble vitamins.
- phrase: 4-4-9 rule
  means: 'kcal per gram: carb, protein, fat.'
maps:
- title: Biomolecule to bond
  steps:
  - amino acids — peptide bond — proteins
  - sugars — glycosidic — polysaccharides
  - nucleotides — phosphodiester — nucleic acids
  - fatty acids + glycerol — ester — fats
- title: Enzyme test → organ
  steps:
  - troponin — cardiac muscle
  - ALT/AST — liver
  - amylase/lipase — pancreas
  - creatinine — kidney
passage:
  text: 'A man''s lipid panel: total cholesterol 260 mg/dL, LDL 170, HDL 35, triglycerides 300. Fasting
    glucose 110. He exercises twice a week and has a family history of early heart disease.'
  questions:
  - q: The most concerning ratios for cardiovascular risk are…
    options:
      A: Normal glucose
      B: High HDL only
      C: Low triglycerides
      D: High LDL + low HDL
    answer: D
    explain: LDL is the atherogenic cargo; HDL the protective reverse transport.
    distractors:
      A: Glucose at 110 is pre-diabetic but secondary.
      B: That would be protective.
      C: His TG is high, not low.
      D: Correct.
  - q: His triglycerides are best lowered by…
    options:
      A: Stopping exercise
      B: Vitamin C
      C: Reducing refined carbs and alcohol
      D: Increasing saturated fat
    answer: C
    explain: TG tracks carbohydrate/ethanol intake more than dietary fat.
    distractors:
      A: Exercise helps.
      B: Not the driver.
      C: Correct.
      D: Saturated fat raises LDL, not TG.
  - q: The family history raises the value of…
    options:
      A: Early lipid screening
      B: Avoiding all fat
      C: Supplementing omega-3
      D: IGF-1 therapy
    answer: A
    explain: Genetic load — earlier cholesterol surveillance and intervention.
    distractors:
      A: Correct.
      B: Fat-free is not evidence-based.
      C: Secondary adjunct.
      D: Not indicated.
pitfalls:
- Starch vs cellulose linkage direction.
- Competitive vs noncompetitive inhibition.
- Water vs fat-soluble vitamins.
- HbA1c vs fasting glucose — time window.
- kcal per gram 4-4-9.
