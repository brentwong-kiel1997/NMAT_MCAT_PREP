review_questions:
- q: Which bond holds two nucleotides together in DNA?
  options:
    A: Peptide
    B: Phosphodiester
    C: Glycosidic
    D: Ester
  answer: B
  explain: 3'-5' phosphodiester between nucleotides.
  distractors:
    A: Amino acid bond.
    B: Correct.
    C: Sugar bond.
    D: Lipid bond.
- q: The optimum pH for pepsin (stomach) is…
  options:
    A: pH 2
    B: pH 7
    C: pH 9
    D: pH 5
  answer: A
  explain: Stomach acidity — pepsin works best around pH 2.
  distractors:
    A: Correct.
    B: That is blood enzymes.
    C: Alkaline.
    D: Close, but gastric is lower.
- q: Riboflavin (B2) is a precursor of…
  options:
    A: NAD
    B: FAD
    C: CoA
    D: PLP
  answer: B
  explain: FAD built from riboflavin.
  distractors:
    A: From niacin.
    B: Correct.
    C: From pantothenate.
    D: From B6.
- q: Which lab best reflects kidney function?
  options:
    A: Creatinine
    B: Troponin
    C: Amylase
    D: Albumin only
  answer: A
  explain: Rising creatinine tracks declining GFR.
  distractors:
    A: Correct.
    B: Heart.
    C: Pancreas.
    D: Nutritional, not renal.
