review_questions:
- q: A point mutation changing an amino acid is…
  options:
    A: Silent
    B: Missense
    C: Nonsense
    D: Frameshift
  answer: B
  explain: Codon changed to a different amino acid.
  distractors:
    A: No change.
    B: Correct.
    C: Stop codon.
    D: Reading-frame shift.
- q: Founder effect describes…
  options:
    A: Allele frequencies set by a small colonizing group
    B: Random mutation
    C: Selection against a trait
    D: Gene flow balancing
  answer: A
  explain: Bottleneck of origin — drift amplifies random allele sampling.
  distractors:
    A: Correct.
    B: Mutation adds variation.
    C: Selection shapes fitness.
    D: Migration homogenizes.
- q: Imprinting silences…
  options:
    A: An allele based on its parental origin
    B: Both alleles
    C: X chromosomes randomly
    D: Mitochondrial DNA
  answer: A
  explain: Prader-Willi and Angelman flip with the parent of origin.
  distractors:
    A: Correct.
    B: Imprinting is mono-allelic.
    C: X-inactivation is random.
    D: Mitochondria are maternal.
- q: Heterozygote advantage explains…
  options:
    A: Sickle cell persistence despite recessive disease
    B: Genetic drift
    C: Imprinting
    D: Polyploidy
  answer: A
  explain: Carriers resist malaria — selection keeps the allele.
  distractors:
    A: Correct.
    B: Drift is random.
    C: Imprinting is parental.
    D: Ploidy is karyotype.
