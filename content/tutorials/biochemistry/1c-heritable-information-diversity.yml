subject: biochemistry
chapter: 1C · Heritable information & diversity
title: 1C · Heritable Information and Diversity
overview: 'The molecular half of heredity: how DNA copies itself faithfully, gets damaged, gets repaired,
  and gets reshuffled at the sequence level. Pairs with the biology 1C chapter, which carries the transmission
  side — Mendelian patterns, pedigrees, nondisjunction, and population allele frequencies.'
sections:
- heading: Mutation types — reading-frame consequences
  objectives:
  - Classify a mutation from its effect on the reading frame and the codon.
  - Predict whether a given insertion or deletion causes a frameshift.
  - Relate each lesion type to the mutagen that produces it.
  body:
  - ==Mutation types — point (silent, missense, nonsense), frameshift (insertion/deletion not a multiple
    of 3), and larger rearrangements==. Causes — replication errors, oxidative damage, UV dimers, chemical
    mutagens. ==Exposure pattern — frameshift = function severely compromised; nonsense = truncation;
    silent = no change==.
  - ==Spontaneous chemistry supplies most lesions — depurination, cytosine deamination, oxidative hits
    — while mutagens add signatures of their own (UV dimers, alkylation, intercalation)==. ==The codon
    table sets the cost of a point mutation — silent keeps the amino acid, missense swaps one, nonsense
    stops the chain early==.
  misconception: '"Deleting two bases is a tiny change — the protein should barely notice." The frame,
    not the size, decides. Codons are read in threes from the start, so a deletion that is not a multiple
    of three re-reads every codon downstream in the wrong register, usually hitting a premature stop.
    Deleting three bases is far more damaging to look at and far less damaging in effect — it removes
    exactly one amino acid and keeps the register.'
  connection: 'The delta-F508 CFTR example is this arithmetic meeting clinical medicine: three bases out,
    one phenylalanine gone, the frame intact — yet the protein still misfolds. Chapter Life Processes:
    Regulation and Homeostasis follows the physiological fallout in the lung and pancreas, and the recessive
    inheritance pattern is chapter 1C · Heritable information and genetic diversity territory.'
  connection_label: How sciences interconnect
  check:
  - q: A single-base insertion early in a coding sequence usually…
    options:
      A: Leaves the protein unchanged
      B: Deletes the whole gene
      C: Swaps one amino acid for another
      D: Shifts the reading frame and scrambles everything downstream
    answer: D
    explain: An indel not in multiples of three re-reads every downstream codon, usually to an early stop.
    distractors:
      A: Reading frames rarely survive an indel.
      B: The sequence stays — the meaning is what changes.
      C: That is a missense point mutation.
      D: Correct.
  - q: A coding exon loses 2 bases near its 5' end. The consequence is…
    options:
      C: A frameshift that re-reads every downstream codon
      A: The loss of one amino acid with the rest intact
      B: A nonsense mutation truncating the protein immediately
      D: No effect, because two bases is a very small change
    answer: C
    explain: Only multiples of three preserve the frame; two bases shift every codon downstream.
    distractors:
      A: Losing exactly one residue requires deleting exactly one codon (3 bases).
      B: A stop codon is not created by the deletion itself, though one often appears downstream.
      D: Size is irrelevant — the frame is what matters.
  figures:
  - src: 1c-heritable-information-diversity/dna-double-helix.webp
    caption: Antiparallel strands, A-T (2 H-bonds) and G-C (3 H-bonds) pairing — the template logic of
      replication.
    credit: Fig 14.7 · OpenStax Biology 2e — CC BY-NC-SA 4.0
- heading: Repair pathways — proofreading to excision lanes
  objectives:
  - Match each repair pathway to the lesion it corrects.
  - Choose between homologous recombination and NHEJ by cell-cycle stage.
  - Predict the syndrome produced by a named repair defect.
  body:
  - ==Mutation rates stay low because proofreading (3'-5' exonuclease), mismatch repair, and DNA damage
    checkpoints police every division==. ==Repair lanes are matched to lesion size — mismatch (G-T mispairs
    after replication), base excision (BER, one damaged base via a glycosylase), nucleotide excision (NER,
    a patch around bulky lesions like thymine dimers), double-strand break repair (homologous recombination
    in S/G2, non-homologous end joining any time)==.
  - ==Which lane runs decides the phenotype — NER defects give xeroderma pigmentosum, mismatch-repair
    defects give Lynch syndrome with microsatellite instability, BRCA1/2 defects leave double-strand breaks
    to error-prone end joining==.
  misconception: '"There is one DNA repair system that fixes everything — the cell just sends the damage
    there." There is a lane for each lesion class. Mismatch repair clears post-replication mispairs, base
    excision handles a single small damaged base, nucleotide excision cuts a patch around bulky helix-distorting
    lesions like thymine dimers, and double-strand breaks go to homologous recombination or NHEJ. Telling
    the lanes apart by lesion size is the entire exam question.'
  connection: 'The G1-versus-S/G2 choice for double-strand breaks is cell-cycle biology constraining biochemistry:
    homologous recombination needs the sister chromatid as a template, so before replication the cell
    has no accurate option and falls back on error-prone end joining. Chapter 2C · Cell division, differentiation,
    specialization supplies the cycle stages that make the decision.'
  connection_label: How sciences interconnect
  check:
  - q: UV-induced thymine dimers are repaired by…
    options:
      A: Mismatch repair
      B: Base excision repair
      C: Nucleotide excision repair
      D: Telomerase
    answer: C
    explain: Bulky helix-distorting lesions — the NER pathway cuts a patch.
    distractors:
      A: Post-replication errors, not lesions.
      B: Small damaged bases only.
      C: Correct.
      D: Ends replication.
  - q: A double-strand break occurs in G1, before replication. Which pathway repairs it?
    options:
      D: Non-homologous end joining
      A: Homologous recombination
      B: Base excision repair
      C: Nucleotide excision repair
    answer: D
    explain: With no sister chromatid yet available, the cell trims and ligates the ends directly — fast
      but error-prone.
    distractors:
      A: Homologous recombination needs the S/G2 sister template.
      B: Excision repair handles single damaged bases, not broken backbones.
      C: Excision repair handles bulky lesions, not broken backbones.
- heading: Recombination — homologous and site-specific
  objectives:
  - Describe homologous recombination and its role in meiosis.
  - Explain how V(D)J recombination assembles antibody diversity.
  - Distinguish recombination, which shuffles alleles, from mutation, which creates them.
  body:
  - ==Homologous recombination — exchanging DNA between similar sequences; in meiosis, crossing over in
    prophase I creates chiasmata and new allele combinations==. ==Site-specific — V(D)J recombination
    builds antibody diversity from gene segments==.
  - ==Recombination vs mutation — recombination shuffles existing variation; mutation creates new alleles.
    ==Gene conversion and unequal crossing over produce tandem duplications — the engines of gene family
    expansion==.
  misconception: '"Crossing over creates new alleles — that is where variation comes from." Crossing over
    shuffles alleles that already exist; mutation is what creates them. The recombinant chromatid in the
    check carries new COMBINATIONS of parental variants, not new sequence. Keep the division of labour
    straight and a whole family of exam distractors falls away.'
  connection: 'V(D)J recombination is the immune system''s private edition of this section: gene segments
    joined combinatorially, then somatic hypermutation layered on top, produce antibody diversity no genome
    could store as a ready-made list. Chapter 3B · Main organ systems covers the adaptive immunity that
    this mechanism makes possible.'
  connection_label: How sciences interconnect
  check:
  - q: V(D)J recombination generates antibody diversity by…
    options:
      A: Random point mutation
      B: Frameshifts
      C: Gene duplication
      D: Assembling gene segments combinatorially
    answer: D
    explain: Different V, D, J segments join in combinations — the combinatorial explosion.
    distractors:
      A: Somatic hypermutation adds later.
      B: No frameshifts involved.
      C: Duplication is a different process.
      D: Correct.
  - q: Crossing over during prophase I produces…
    options:
      A: Recombinant chromatids carrying new combinations of parental alleles
      B: New alleles that did not exist in either parent
      C: Whole-chromosome nondisjunction
      D: Epigenetic silencing of one homologue
    answer: A
    explain: Recombination reshuffles existing variation — it does not invent new sequence.
    distractors:
      B: Creating new alleles is mutation's job, not recombination's.
      C: Nondisjunction is a segregation failure, not an exchange.
      D: Silencing is epigenetic and unrelated to crossing over.
- heading: Epigenetics — heritable but not sequence-based
  objectives:
  - Define epigenetics and name its principal mechanisms.
  - Explain imprinting by parental origin using a named example.
  - Describe X-inactivation and the mosaicism it produces.
  body:
  - '==Epigenetics = heritable changes in expression with DNA sequence unchanged — DNA methylation (CpG
    islands, silences), histone modifications (acetylation opens, methylation can silence), chromatin
    remodeling==. ==Imprinted genes — one parental allele silenced (Prader-Willi vs Angelman: same region,
    different parent!)==.'
  - '==X-inactivation — females are mosaics: one X silenced per cell; traits like color-blindness show
    patchy expression in carriers==. ==Epigenetic marks are environmentally responsive — early-life stress
    shapes methylation profiles==.'
  misconception: '"The two siblings have the same chromosome 15 deletion, so they must have the same disease."
    Not when the region is imprinted. Prader-Willi and Angelman syndromes both map to the same 15q11-13
    segment, but only the paternal copy of some genes and the maternal copy of others is active — so the
    parent who transmitted the deletion decides which working copies are lost. Same lesion, different
    silence, different phenotype.'
  connection: 'X-inactivation is dosage compensation built on the same silencing chemistry: each female
    cell shuts down one X at random, freezes that choice, and passes it to daughter cells, producing the
    mosaic expression the check describes. Chapter genetics covers the pedigree consequences for X-linked
    traits in carrier females.'
  connection_label: How sciences interconnect
  check:
  - q: A woman heterozygous for a X-linked trait can show patchy expression because…
    options:
      A: Hormones erase traits
      B: Genes mutate quickly
      C: DNA is lost
      D: X-inactivation silences one X per cell
    answer: D
    explain: Random inactivation freezes a mosaic of active maternal/paternal X cells.
    distractors:
      A: Hormones modulate, don't erase.
      B: Mutations are rare.
      C: Chromosomes persist.
      D: Correct.
  - q: Two siblings carry the same chromosome 15 deletion but show different syndromes. The explanation
      is…
    options:
      D: Genomic imprinting — the effect depends on which parent transmitted the deletion
      A: Different point mutations within the same gene
      B: Random X-inactivation in one of the two children
      C: A nucleotide excision repair defect in one sibling
    answer: D
    explain: Only one parental allele is active in the imprinted region, so the same deletion hits a different
      working copy in each child (Prader-Willi versus Angelman).
    distractors:
      A: The deletion is stated to be the same in both.
      B: X-inactivation is irrelevant to an autosomal region.
      C: No repair defect is implicated by a shared deletion.
  figures:
  - src: 1c-heritable-information-diversity/chromosome-packing.webp
    caption: Chromosome packing — DNA wrapped around histones into nucleosomes, then coiled into chromosomes.
    credit: Fig 14.6 · OpenStax Biology 2e — CC BY-NC-SA 4.0
- heading: Genome instability — when a repair lane is missing
  objectives:
  - Map each repair-defect syndrome to its pathway and its cancer risk.
  - Explain why a tumour's mutation burden climbs when a lane is lost.
  - Relate telomerase reactivation to replicative immortality.
  body:
  - ==Repair defects map onto cancer syndromes — xeroderma pigmentosum (NER → UV-driven skin cancers),
    Lynch syndrome (mismatch repair → microsatellite instability in colorectal cancer), BRCA1/2 (homologous
    recombination → breast/ovarian)==. ==Tumor genomes accumulate damage faster because a lane is missing,
    not because mutagens got stronger==.
  - ==Telomeres cap chromosome ends — the end-replication problem shortens them each division==. ==Telomerase
    re-extends telomeres in germline and stem cells, and most cancers reactivate it to escape the replicative
    limit==.
  misconception: '"These patients get more cancers because UV or mutagens hit them harder." The exposure
    is the same; the response is what failed. With the NER lane out, thymine dimers sit unrepaired, replication
    stalls, and translesion polymerases bypass the lesion at the cost of errors — the mutation burden
    climbs because the cleanup crew is absent, not because the damage rate rose.'
  connection: 'Telomerase is the other half of the immortality story: normal somatic cells lose a little
    telomere each division and stop, but most cancers reactivate the enzyme that re-extends those ends,
    escaping the replicative limit. It is why telomerase is a persistent drug-discovery target — block
    it and the tumour''s divisions become countable again.'
  connection_label: Real-world connection
  check:
  - q: A colorectal tumor shows microsatellite instability. The likeliest defect is in…
    options:
      A: Base excision repair
      B: Nucleotide excision repair
      C: Mismatch repair
      D: Telomerase
    answer: C
    explain: Slipped repeats escape mismatch repair, so repeat tracts lengthen or shorten between generations.
    distractors:
      A: BER clears oxidized and deaminated bases.
      B: NER defects show UV sensitivity, not repeat instability.
      C: Correct.
      D: Telomerase sets replicative lifespan.
  - q: BRCA1/2 mutations raise breast and ovarian cancer risk because…
    options:
      D: Homologous recombination repair of double-strand breaks fails
      A: Nucleotide excision repair fails, so UV damage accumulates
      B: Mismatch repair fails, producing microsatellite instability
      C: Telomerase is lost and cells cannot divide
    answer: D
    explain: Without HR, breaks are left to error-prone end joining, so rearrangements accumulate.
    distractors:
      A: That combination gives xeroderma pigmentosum and skin cancer.
      B: That combination gives Lynch syndrome and colorectal cancer.
      C: Most cancers reactivate telomerase rather than losing it.
examples:
- prompt: CFTR has a deletion of 3 bases removing phenylalanine at position 508 (delta-F508). Classify
    the mutation and explain why most heterozygotes are healthy.
  strategy: 'Count the missing bases before naming the mutation: three bases is exactly one codon, so
    the reading frame survives and the deletion is in-frame. The plan is frame first, consequence second
    — the frame decides whether downstream sequence is scrambled, and only then does the phenotype follow.'
  solution:
  - Three bases = one codon removed — an in-frame deletion of Phe.
  - Not a frameshift — the reading frame survives downstream.
  - The altered protein misfolds and is degraded — loss of function.
  - Heterozygotes retain one working allele — haplo-sufficiency → carrier phenotype mild.
  answer: In-frame codon deletion — recessive loss-of-function, carriers unaffected.
  discussion: 'In-frame is not the same as harmless: the protein keeps its length and register yet the
    missing phenylalanine still breaks folding, which is a reminder that one residue can decide a domain''s
    stability. The recessive inheritance follows because a single good allele makes enough functional
    CFTR — haplo-sufficiency — whereas a dominant-negative mechanism would sicken the carriers. Contrast
    the arithmetic: deleting one base at the same spot would shift the frame and typically produce an
    earlier, more severe phenotype.'
  distractors:
    A: Frameshift — that would need non-multiple-of-3 bases.
    B: Nonsense — that stops translation early.
    C: Silent — the amino acid clearly changed.
  practice:
    q: A coding exon loses 2 bases at position 100 of a 1200-base open reading frame. What is the consequence?
    options:
      A: A frameshift that re-reads every downstream codon, usually adding an early stop
      B: The loss of a single amino acid, leaving the rest of the protein intact
      C: A silent change with no effect on the protein
      D: A duplication of everything downstream
    answer: A
    explain: Two is not a multiple of three, so the frame shifts at position 100 and the remaining 1100
      bases are read in the wrong register.
    distractors:
      B: That outcome needs exactly one codon (3 bases) removed.
      C: A deletion changes the sequence; silent mutations are single-base substitutions.
      D: Deletion removes sequence; it does not duplicate it.
key_equations:
- latex: $\text{indel}/3\ \text{remainder} \neq 0 \Rightarrow \text{frameshift}$
  symbols: indel size in bases; a nonzero remainder after dividing by three shifts the frame
  when: three bases removed is in-frame — one amino acid lost, register preserved
- latex: $\text{codons} = \frac{\text{coding nt}}{3}$
  symbols: coding nucleotides of the open reading frame
  when: a 1200-base ORF is 400 codons — 399 amino acids once the stop is discounted
- latex: '$\text{BER: 1 base;}\ \ \text{NER: patch;}\ \ \text{MMR: mispair}$'
  symbols: lesion size each excision lane handles
  when: matching the lane to the lesion — bulky dimers to NER, oxidized bases to BER, post-replication
    mispairs to MMR
- latex: '$\text{HR: S/G2;}\ \ \text{NHEJ: any phase}$'
  symbols: HR needs the sister chromatid as template
  when: a double-strand break in G1 has no accurate option — NHEJ trims and ligates, error-prone
- latex: $\text{V(D)J diversity} \propto V\times D\times J$
  symbols: number of V, D, and J gene segments available
  when: combinatorial joining — recombination shuffles existing segments; it does not create new sequence
key_points:
- Point vs frameshift — reading frame is the hinge; nonsense truncates, silent changes nothing.
- NER for bulky dimers; BER for single damaged bases; mismatch for post-replication mispairs.
- Double-strand breaks — homologous recombination in S/G2, NHEJ elsewhere in the cycle.
- V(D)J recombination — combinatorial antibody diversity from gene segments.
- Repair-defect syndromes — XP (NER), Lynch (MMR/MSI), BRCA (HR) — mapped by lesion type.
- Epigenetics — methylation, histone marks, imprinting, X-inactivation silence without sequence change.
- Telomerase re-extends telomeres in germline/stem cells and most cancers.
mnemonics:
- phrase: Excision repairs the bad base, mismatch fixes the wrong pair
  means: BER/NER vs mismatch-repair lanes.
- phrase: HR copies the sister, NHEJ jams the ends
  means: Double-strand break choice — a template in S/G2, or fast-and-dirty ligation.
maps:
- title: Mutation repair lanes
  steps:
  - mismatch (G-T after replication) — mismatch repair
  - small damaged base — BER
  - bulky lesion (thymine dimer) — NER
  - double-strand break — HR or NHEJ
- title: Mutation types and their costs
  steps:
  - silent — codon still codes the same amino acid
  - missense — one amino acid swapped
  - nonsense — premature stop codon
  - frameshift — indel not a multiple of 3, downstream codons re-read
  - rearrangement — deletion, duplication, inversion, translocation
passage:
  text: A 6-year-old burns after minutes of sun, freckles on sun-exposed skin, and has already had two
    skin cancers. Cultured fibroblasts fail to resume DNA synthesis after UV irradiation, and cell-fusion
    studies assign the defect to complementation group C. No internal malignancies are found.
  questions:
  - q: The UV-hypersensitivity points to a defect in…
    options:
      A: Nucleotide excision repair
      B: Mismatch repair
      C: Base excision repair
      D: Telomerase
    answer: A
    explain: Thymine dimers are bulky lesions — NER cuts a patch around them; its loss is xeroderma pigmentosum.
    distractors:
      A: Correct.
      B: Mispairs after replication, not UV lesions.
      C: Single damaged bases only.
      D: End-replication, not lesion repair.
  - q: Complementation group C tells you…
    options:
      A: Several different genes can produce the same phenotype — one pathway, many proteins
      B: Three separate repair pathways are defective
      C: The patient carries three copies of the gene
      D: The phenotype is not genetic
    answer: A
    explain: Fusing XP cells from different groups restores repair when the mutations complement — the
      pathway has many components.
    distractors:
      A: Correct.
      B: Fusion tests one defect at a time.
      C: Copy number is unrelated to complementation.
      D: Complementation is a classic genetic result.
  - q: Why does the mutation burden climb in these patients?
    options:
      A: Telomeres shorten faster
      B: Polymerase copies UV lesions accurately
      C: Unrepaired dimers stall replication, and bypass past them is error-prone
      D: Mitochondrial DNA takes the damage
    answer: C
    explain: Replication across an unrepaired dimer needs translesion polymerases — the errors fix in
      as mutations.
    distractors:
      A: Telomere loss limits divisions, not fidelity.
      B: Lesion-bypass polymerases are the inaccurate ones.
      C: Correct.
      D: The phenotype is nuclear-repair based.
pitfalls:
- Nonsense vs missense vs silent — read the codon outcome.
- BER vs NER — lesion size decides.
- HR vs NHEJ — the cell cycle decides whether a sister template exists.
- Imprinting vs X-inactivation — mechanism differs.
- Microsatellite instability implicates mismatch repair, not excision repair.
exam_map:
  NMAT: Mutation types, repair lanes, and epigenetic vocabulary at intro depth.
  MCAT: Content Category 1C — mutation and repair passages, cancer-syndrome mapping, epigenetic logic.
