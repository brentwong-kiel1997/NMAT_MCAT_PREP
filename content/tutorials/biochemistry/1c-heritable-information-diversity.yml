subject: biochemistry
chapter: 1C · Heritable information & diversity
title: 1C · Heritable Information and Diversity
overview: 'The molecular half of heredity: how DNA copies itself faithfully, gets damaged, gets repaired,
  and gets reshuffled at the sequence level. Pairs with the biology 1C chapter, which carries the
  transmission side — Mendelian patterns, pedigrees, nondisjunction, and population allele frequencies.'
sections:
- heading: Mutation types — reading-frame consequences
  body:
  - ==Mutation types — point (silent, missense, nonsense), frameshift (insertion/deletion not a
    multiple of 3), and larger rearrangements==. Causes — replication errors, oxidative damage, UV
    dimers, chemical mutagens. ==Exposure pattern — frameshift = function severely compromised;
    nonsense = truncation; silent = no change==.
  - '==Spontaneous chemistry supplies most lesions — depurination, cytosine deamination, oxidative
    hits — while mutagens add signatures of their own (UV dimers, alkylation, intercalation)==.
    ==The codon table sets the cost of a point mutation — silent keeps the amino acid, missense swaps
    one, nonsense stops the chain early==.'
  check:
  - q: A single-base insertion early in a coding sequence usually…
    options:
      A: Leaves the protein unchanged
      B: Deletes the whole gene
      C: Swaps one amino acid for another
      D: Shifts the reading frame and scrambles everything downstream
    answer: D
    explain: An indel not in multiples of three re-reads every downstream codon, usually to an early
      stop.
    distractors:
      A: Reading frames rarely survive an indel.
      B: The sequence stays — the meaning is what changes.
      C: That is a missense point mutation.
      D: Correct.
  figures:
  - src: 1c-heritable-information-diversity/dna-double-helix.webp
    caption: Antiparallel strands, A-T (2 H-bonds) and G-C (3 H-bonds) pairing — the template logic of
      replication.
    credit: Fig 14.7 · OpenStax Biology 2e — CC BY-NC-SA 4.0
- heading: Repair pathways — proofreading to excision lanes
  body:
  - ==Mutation rates stay low because proofreading (3'-5' exonuclease), mismatch repair, and DNA damage
    checkpoints police every division==. ==Repair lanes are matched to lesion size — mismatch (G-T
    mispairs after replication), base excision (BER, one damaged base via a glycosylase), nucleotide
    excision (NER, a patch around bulky lesions like thymine dimers), double-strand break repair
    (homologous recombination in S/G2, non-homologous end joining any time)==.
  - '==Which lane runs decides the phenotype — NER defects give xeroderma pigmentosum, mismatch-repair
    defects give Lynch syndrome with microsatellite instability, BRCA1/2 defects leave double-strand
    breaks to error-prone end joining==.'
  check:
  - q: UV-induced thymine dimers are repaired by…
    options:
      A: Mismatch repair
      B: Base excision repair
      C: Nucleotide excision repair
      D: Telomerase
    answer: C
    explain: Bulky helix-distorting lesions — the NER pathway cuts a patch.
    distractors:
      A: Post-replication errors, not lesions.
      B: Small damaged bases only.
      C: Correct.
      D: Ends replication.
- heading: Recombination — homologous and site-specific
  body:
  - ==Homologous recombination — exchanging DNA between similar sequences; in meiosis, crossing over in
    prophase I creates chiasmata and new allele combinations==. ==Site-specific — V(D)J recombination
    builds antibody diversity from gene segments==.
  - ==Recombination vs mutation — recombination shuffles existing variation; mutation creates new alleles.
    ==Gene conversion and unequal crossing over produce tandem duplications — the engines of gene family
    expansion==.
  check:
  - q: V(D)J recombination generates antibody diversity by…
    options:
      A: Random point mutation
      B: Frameshifts
      C: Gene duplication
      D: Assembling gene segments combinatorially
    answer: D
    explain: Different V, D, J segments join in combinations — the combinatorial explosion.
    distractors:
      A: Somatic hypermutation adds later.
      B: No frameshifts involved.
      C: Duplication is a different process.
      D: Correct.
- heading: Epigenetics — heritable but not sequence-based
  body:
  - '==Epigenetics = heritable changes in expression with DNA sequence unchanged — DNA methylation (CpG
    islands, silences), histone modifications (acetylation opens, methylation can silence), chromatin
    remodeling==. ==Imprinted genes — one parental allele silenced (Prader-Willi vs Angelman: same region,
    different parent!)==.'
  - '==X-inactivation — females are mosaics: one X silenced per cell; traits like color-blindness show
    patchy expression in carriers==. ==Epigenetic marks are environmentally responsive — early-life stress
    shapes methylation profiles==.'
  check:
  - q: A woman heterozygous for a X-linked trait can show patchy expression because…
    options:
      A: Hormones erase traits
      B: Genes mutate quickly
      C: DNA is lost
      D: X-inactivation silences one X per cell
    answer: D
    explain: Random inactivation freezes a mosaic of active maternal/paternal X cells.
    distractors:
      A: Hormones modulate, don't erase.
      B: Mutations are rare.
      C: Chromosomes persist.
      D: Correct.
  figures:
  - src: 1c-heritable-information-diversity/chromosome-packing.webp
    caption: Chromosome packing — DNA wrapped around histones into nucleosomes, then coiled into chromosomes.
    credit: Fig 14.6 · OpenStax Biology 2e — CC BY-NC-SA 4.0
- heading: Genome instability — when a repair lane is missing
  body:
  - '==Repair defects map onto cancer syndromes — xeroderma pigmentosum (NER → UV-driven skin cancers),
    Lynch syndrome (mismatch repair → microsatellite instability in colorectal cancer), BRCA1/2
    (homologous recombination → breast/ovarian)==. ==Tumor genomes accumulate damage faster because a
    lane is missing, not because mutagens got stronger==.'
  - '==Telomeres cap chromosome ends — the end-replication problem shortens them each division==.
    ==Telomerase re-extends telomeres in germline and stem cells, and most cancers reactivate it to
    escape the replicative limit==.'
  check:
  - q: A colorectal tumor shows microsatellite instability. The likeliest defect is in…
    options:
      A: Base excision repair
      B: Nucleotide excision repair
      C: Mismatch repair
      D: Telomerase
    answer: C
    explain: Slipped repeats escape mismatch repair, so repeat tracts lengthen or shorten between
      generations.
    distractors:
      A: BER clears oxidized and deaminated bases.
      B: NER defects show UV sensitivity, not repeat instability.
      C: Correct.
      D: Telomerase sets replicative lifespan.
examples:
- prompt: CFTR has a deletion of 3 bases removing phenylalanine at position 508 (delta-F508). Classify
    the mutation and explain why most heterozygotes are healthy.
  solution:
  - Three bases = one codon removed — an in-frame deletion of Phe.
  - Not a frameshift — the reading frame survives downstream.
  - The altered protein misfolds and is degraded — loss of function.
  - Heterozygotes retain one working allele — haplo-sufficiency → carrier phenotype mild.
  answer: In-frame codon deletion — recessive loss-of-function, carriers unaffected.
  distractors:
    A: Frameshift — that would need non-multiple-of-3 bases.
    B: Nonsense — that stops translation early.
    C: Silent — the amino acid clearly changed.
key_points:
- Point vs frameshift — reading frame is the hinge; nonsense truncates, silent changes nothing.
- NER for bulky dimers; BER for single damaged bases; mismatch for post-replication mispairs.
- Double-strand breaks — homologous recombination in S/G2, NHEJ elsewhere in the cycle.
- V(D)J recombination — combinatorial antibody diversity from gene segments.
- Repair-defect syndromes — XP (NER), Lynch (MMR/MSI), BRCA (HR) — mapped by lesion type.
- Epigenetics — methylation, histone marks, imprinting, X-inactivation silence without sequence change.
- Telomerase re-extends telomeres in germline/stem cells and most cancers.
mnemonics:
- phrase: Excision repairs the bad base, mismatch fixes the wrong pair
  means: BER/NER vs mismatch-repair lanes.
- phrase: HR copies the sister, NHEJ jams the ends
  means: Double-strand break choice — a template in S/G2, or fast-and-dirty ligation.
maps:
- title: Mutation repair lanes
  steps:
  - mismatch (G-T after replication) — mismatch repair
  - small damaged base — BER
  - bulky lesion (thymine dimer) — NER
  - double-strand break — HR or NHEJ
- title: Mutation types and their costs
  steps:
  - silent — codon still codes the same amino acid
  - missense — one amino acid swapped
  - nonsense — premature stop codon
  - frameshift — indel not a multiple of 3, downstream codons re-read
  - rearrangement — deletion, duplication, inversion, translocation
passage:
  text: A 6-year-old burns after minutes of sun, freckles on sun-exposed skin, and has already had two
    skin cancers. Cultured fibroblasts fail to resume DNA synthesis after UV irradiation, and cell-fusion
    studies assign the defect to complementation group C. No internal malignancies are found.
  questions:
  - q: The UV-hypersensitivity points to a defect in…
    options:
      A: Nucleotide excision repair
      B: Mismatch repair
      C: Base excision repair
      D: Telomerase
    answer: A
    explain: Thymine dimers are bulky lesions — NER cuts a patch around them; its loss is xeroderma
      pigmentosum.
    distractors:
      A: Correct.
      B: Mispairs after replication, not UV lesions.
      C: Single damaged bases only.
      D: End-replication, not lesion repair.
  - q: Complementation group C tells you…
    options:
      A: Several different genes can produce the same phenotype — one pathway, many proteins
      B: Three separate repair pathways are defective
      C: The patient carries three copies of the gene
      D: The phenotype is not genetic
    answer: A
    explain: Fusing XP cells from different groups restores repair when the mutations complement — the
      pathway has many components.
    distractors:
      A: Correct.
      B: Fusion tests one defect at a time.
      C: Copy number is unrelated to complementation.
      D: Complementation is a classic genetic result.
  - q: Why does the mutation burden climb in these patients?
    options:
      A: Telomeres shorten faster
      B: Polymerase copies UV lesions accurately
      C: Unrepaired dimers stall replication, and bypass past them is error-prone
      D: Mitochondrial DNA takes the damage
    answer: C
    explain: Replication across an unrepaired dimer needs translesion polymerases — the errors fix in as
      mutations.
    distractors:
      A: Telomere loss limits divisions, not fidelity.
      B: Lesion-bypass polymerases are the inaccurate ones.
      C: Correct.
      D: The phenotype is nuclear-repair based.
pitfalls:
- Nonsense vs missense vs silent — read the codon outcome.
- BER vs NER — lesion size decides.
- HR vs NHEJ — the cell cycle decides whether a sister template exists.
- Imprinting vs X-inactivation — mechanism differs.
- Microsatellite instability implicates mismatch repair, not excision repair.
