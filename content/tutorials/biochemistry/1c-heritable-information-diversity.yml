review_questions:
- q: A point mutation changing an amino acid is…
  options:
    A: Silent
    B: Missense
    C: Nonsense
    D: Frameshift
  answer: B
  explain: Codon changed to a different amino acid.
  distractors:
    A: No change.
    B: Correct.
    C: Stop codon.
    D: Reading-frame shift.
- q: A glycosylase flips an oxidized base out of the helix and clips it out. Which pathway finishes the
    repair?
  options:
    A: Nucleotide excision repair
    B: Base excision repair
    C: Non-homologous end joining
    D: Mismatch repair
  answer: B
  explain: AP endonuclease, repair polymerase, and ligase fill the single-nucleotide gap.
  distractors:
    A: Patch excision is for bulky lesions.
    B: Correct.
    C: That rejoins double-strand breaks.
    D: Its cue is a mispair after replication.
- q: Imprinting silences…
  options:
    A: An allele based on its parental origin
    B: Both alleles
    C: X chromosomes randomly
    D: Mitochondrial DNA
  answer: A
  explain: Prader-Willi and Angelman flip with the parent of origin.
  distractors:
    A: Correct.
    B: Imprinting is mono-allelic.
    C: X-inactivation is random.
    D: Mitochondria are maternal.
- q: A double-strand break in G1 is repaired mainly by…
  options:
    A: Homologous recombination
    B: Non-homologous end joining
    C: Nucleotide excision repair
    D: Mismatch repair
  answer: B
  explain: No sister chromatid is available yet, so ends are trimmed and ligated directly — error-prone.
  distractors:
    A: It needs the S/G2 sister template.
    B: Correct.
    C: Excision handles lesions, not breaks.
    D: Mismatch repair follows replication.
