review_questions:
- q: Which enzyme is an allosteric activator of PFK-1?
  options:
    A: ATP
    B: Citrate
    C: Fructose-2,6-bisphosphate
    D: Glucose-6-phosphate
  answer: C
  explain: F-2,6-BP is the potent feedforward activator of glycolysis.
  distractors:
    A: Inhibitor.
    B: Inhibitor.
    C: Correct.
    D: Product trap, not activator.
- q: The Cori cycle…
  options:
    A: Moves lactate from muscle to liver for gluconeogenesis
    B: Synthesizes ketones
    C: Stores glycogen
    D: Recycles NADPH
  answer: A
  explain: Muscle anaerobic lactate -> liver makes glucose again.
  distractors:
    A: Correct.
    B: That's ketogenesis.
    C: Glycogenesis.
    D: Not the shuttle.
- q: Beta-oxidation of palmitate (16C) produces how many acetyl-CoA?
  options:
    A: '4'
    B: '8'
    C: '16'
    D: '7'
  answer: B
  explain: Each cycle removes 2 carbons — 8 acetyl-CoA from C16.
  distractors:
    A: Sub cycles.
    B: Correct.
    C: One per carbon.
    D: One less than cycles.
- q: Thermogenesis in brown fat uses a proton uncoupler that…
  options:
    A: Dissipates the proton gradient as heat
    B: Blocks the ETC
    C: Stops ATP synthesis permanently
    D: Inhibits beta-oxidation
  answer: A
  explain: UCP1 lets protons re-enter bypassing ATP synthase — heat, not ATP.
  distractors:
    B: The ETC keeps pumping.
    C: ATP synthesis is bypassed, not destroyed.
    D: Fat still oxidizes.
