subject: biochemistry
chapter: 1A · Proteins and amino acids
title: 1A · Proteins and Amino Acids
overview: Amino acid chemistry, peptide bonds, protein structure, and folding — the single highest-yield
  biochemistry topic on the MCAT. Enzyme structure and function connect directly (pKa, charge, chirality).
sections:
- heading: Amino acid structure and chemistry
  objectives:
  - Identify the four substituents every alpha carbon carries.
  - Classify an amino acid into its side-chain family.
  - Predict a side chain's charge at a given pH from its pKa.
  body:
  - '==Amino acids share an amino group, carboxyl group, H, and variable R group on the alpha carbon —
    only glycine''s R is H, so glycine is not chiral==. At physiological pH, amino acids exist as zwitterions
    (NH3+, COO-). ==pKa determines charge: below pKa protonated, above deprotonated==; the isoelectric
    point pI = (pKa1 + pKa2)/2 for neutral residues.'
  - '==Side chains sort: nonpolar (Gly, Ala, Val, Leu, Ile, Phe, Met, Pro), polar uncharged (Ser, Thr,
    Cys, Tyr, Asn, Gln), acidic (Asp, Glu — negative at pH 7), basic (Lys, Arg, His)==. ==Cysteine forms
    disulfide bonds; Proline kinks helices due to its rigid ring==.'
  misconception: '"Every amino acid is chiral, since they all have that alpha carbon with four different
    groups." Not glycine — its fourth substituent is a second hydrogen, and four DIFFERENT groups is the
    requirement. It is also the only achiral standard amino acid, which is exactly why it is the residue
    collagen can tolerate at every third position.'
  connection: 'The pKa rule here is acid-base chemistry doing biology: below the pKa a group is protonated,
    above it deprotonated, so lysine (pKa 10.5) stays positive at pH 7 while glutamate (pKa 4.2) is negative.
    Chapter 5A · Unique nature of water and its solutions supplies that rule, and the passage runs it
    in reverse — dropping to pH 5 protonates an aspartate and makes it buryable again.'
  connection_label: How sciences interconnect
  check:
  - q: Which amino acid is NOT chiral?
    options:
      A: Serine
      B: Alanine
      C: Glycine
      D: Valine
    answer: C
    explain: Glycine's R group is H — the alpha carbon carries two hydrogens.
    distractors:
      A: Ser has CH2OH R.
      B: Ala has CH3 R.
      C: Correct.
      D: Val has branched R.
  - q: A peptide segment holds Lys (side-chain pKa ~10.5) and Glu (side-chain pKa ~4.2). The net side-chain
      charge at pH 7 is…
    options:
      B: Zero — Lys is +1 and Glu is -1
      A: +2 — both side chains are protonated at pH 7
      C: -1 — lysine is neutral at pH 7
      D: +1 — glutamate is still protonated at pH 7
    answer: B
    explain: pH 7 lies below Lys's pKa (protonated, +1) and above Glu's (deprotonated, -1); they cancel.
    distractors:
      A: pH 7 is far below lysine's pKa but far above glutamate's — they cannot both be protonated.
      C: Lysine only loses its proton above about pH 10.5.
      D: Glutamate's pKa is around 4.2, so it is long since deprotonated by pH 7.
  figures:
  - src: 1a-proteins-and-amino-acids/fig-2865acde.webp
    caption: The amino acid template — amino group, carboxyl group, H, and the variable R group on the
      alpha carbon.
    credit: Fig 3.27 · OpenStax Biology 2e — CC BY-NC-SA 4.0
- heading: Peptide bonds and protein primary structure
  objectives:
  - Describe the condensation reaction that forms a peptide bond.
  - Explain why the peptide bond is planar and cannot rotate.
  - Count peptide bonds and disulfide links in a chain of given length.
  body:
  - ==Peptide bonds are amide linkages formed by condensation (water lost) between the carboxyl of one
    residue and the amino of the next — written N-terminus to C-terminus==. The bond is planar because
    the C-N bond has partial double-bond character — no rotation around it.
  - '==Primary structure = the sequence; it fully determines the fold (Anfinsen — ribonuclease refolds
    if only primary structure is intact). ==Common exam id: count peptide bonds = residues - 1 in a linear
    peptide; disulfides join cysteines (oxidation)==.'
  misconception: '"Ten residues in the chain means ten peptide bonds — one per residue." Only the joints
    count: a linear chain of n residues has n - 1 peptide bonds, so a decapeptide has nine. Count links,
    not members — and remember disulfides are extra covalent links on top, as the pentapeptide check shows
    with four bonds plus two bridges.'
  connection: 'The planarity of the peptide bond is pure chemistry with structural consequences: the C-N
    bond has partial double-bond character, so it cannot rotate, and the backbone''s freedom lives entirely
    in the other two torsion angles on either side. That constraint is what limits the conformations Ramachandran
    space allows — the reason a chain folds into repeating helices rather than a random tangle.'
  connection_label: How sciences interconnect
  check:
  - q: A decapeptide has how many peptide bonds?
    options:
      A: '11'
      B: '8'
      C: '9'
      D: '10'
    answer: C
    explain: Peptide bonds = n-1 for a linear chain of n residues.
    distractors:
      A: N to C confusion.
      B: Circular counting.
      C: Correct — 9.
      D: That is residues.
  - q: A pentapeptide contains two cysteine pairs joined by disulfide bonds. How many covalent links between
      residues are there in total?
    options:
      B: 6 — four peptide bonds plus two disulfides
      A: 5 — the peptide bonds only
      C: 7 — one extra for the C-terminus
      D: 10 — one for every pair of residues
    answer: B
    explain: Five residues in a linear chain give n - 1 = 4 peptide bonds, and the two disulfides add
      two more.
    distractors:
      A: Forgetting the covalent disulfide cross-links.
      C: Termini do not form bonds with anything.
      D: Every pair is not bonded — only neighbours are.
- heading: Secondary structure — local folds
  objectives:
  - Describe the i to i+4 hydrogen-bonding pattern of the alpha-helix.
  - Contrast parallel with antiparallel beta-sheets.
  - Explain why proline and glycine disrupt helices.
  body:
  - ==Alpha-helix — backbone C=O H-bonds to the N-H four residues ahead (i, i+4); 3.6 residues/turn; proline
    and glycine disrupt it==. ==Beta-sheet — extended strands H-bonded side by side; parallel (same direction,
    weaker) or antiparallel (opposite, stronger)==.
  - ==Secondary structure is stabilized by backbone H-bonds, NOT side chains — that is the tertiary level's
    job==. Beta-turns connect strands; many proteins mix helix and sheet (e.g., the fibrous keratin helix,
    silk beta-sheet).
  misconception: '"Hydrophobic side chains hold the helix together, since hydrophobic forces are the strongest."
    Secondary structure runs on backbone hydrogen bonds — C=O to N-H four residues along — not on side
    chains at all. Hydrophobic packing is a tertiary-level force, and side chains in a helix point outward
    into the solvent or the core without touching the hydrogen-bonding pattern.'
  connection: 'Proline and glycine are the two helix breakers for opposite reasons, and the check rewards
    knowing which is which: proline''s rigid ring locks the backbone and lacks an amide hydrogen to donate,
    while glycine is too flexible to hold the geometry. In collagen that same rigidity is recruited rather
    than punished — proline sets the left-handed strand winding that glycine''s small size then lets pack.'
  connection_label: How sciences interconnect
  check:
  - q: Alpha-helices are stabilized mainly by…
    options:
      A: Disulfide bonds
      B: Salt bridges
      C: Hydrophobic interactions
      D: Backbone hydrogen bonds
    answer: D
    explain: i to i+4 backbone C=O to N-H bonds.
    distractors:
      A: Cysteine oxidation.
      B: Ionic side chain pairs.
      C: Side-chain effect is tertiary.
      D: Correct.
  - q: Which residue most disrupts an alpha-helix, and why?
    options:
      D: Proline — its rigid ring cannot adopt helix angles or donate a backbone N-H
      A: Alanine — its methyl group is too small
      B: Leucine — hydrophobic side chains repel the backbone
      C: Lysine — its positive charge repels the helix
    answer: D
    explain: Proline's cyclic backbone locks its torsion angles and leaves no amide hydrogen to donate.
    distractors:
      A: Alanine is actually the strongest helix former.
      B: Hydrophobic side chains face outward and do not disturb the backbone.
      C: Charged side chains point away from the backbone hydrogen-bonding pattern.
- heading: Tertiary and quaternary structure
  objectives:
  - List the forces that stabilise a protein's tertiary fold.
  - Distinguish tertiary from quaternary structure.
  - Predict what each denaturant disrupts.
  body:
  - ==Tertiary structure = the full 3D fold from side-chain interactions — hydrophobic effect (dominant),
    H-bonds, ion pairs, disulfide covalent links==. ==Quaternary structure = assembly of multiple polypeptide
    chains (hemoglobin = alpha2 beta2)==.
  - ==Denaturation — heat, pH, detergents, urea, reducing agents unfold structure WITHOUT breaking peptide
    bonds; some proteins refold spontaneously, others need chaperones==. SDS denatures with uniform charge;
    beta-mercaptoethanol cuts disulfides.
  misconception: '"SDS breaks disulfide bonds — that is why it denatures proteins so thoroughly." SDS
    disrupts noncovalent forces and coats the chain in uniform negative charge; the disulfides survive
    it untouched. It takes a reducing agent like beta-mercaptoethanol to open an S-S bridge, which is
    why the two reagents are used together when you want a protein fully taken apart.'
  connection: 'The dominant tertiary force is the hydrophobic effect — entropy-driven water release, not
    any attraction between the side chains themselves. Chapter 5B · Molecules and intermolecular interactions
    derives that mechanism, and the Leu-to-Asp passage here is its most common clinical expression: a
    charged group in a hydrophobic core refuses to stay buried.'
  connection_label: How sciences interconnect
  check:
  - q: Hemoglobin's alpha2 beta2 arrangement is…
    options:
      A: Just a peptide
      B: Primary structure
      C: Quaternary structure
      D: Secondary structure
    answer: C
    explain: Multiple folded chains assembling — the fourth level.
    distractors:
      A: One chain.
      B: Sequence.
      C: Correct.
      D: Local folding.
  - q: A functional protein is a dimer of two identical 30 kDa chains. The dimerisation itself is which
      level of structure?
    options:
      A: Quaternary — assembly of multiple polypeptide chains
      B: Tertiary — the fold of each chain
      C: Secondary — local helices and sheets
      D: Primary — the amino acid sequence
    answer: A
    explain: More than one polypeptide chain assembling means quaternary structure, whatever each chain's
      own fold.
    distractors:
      B: Tertiary describes a single chain's 3D fold.
      C: Local backbone folding does not join two chains.
      D: Sequence alone never assembles subunits.
  figures:
  - src: 1a-proteins-and-amino-acids/fig-0971e65c.webp
    caption: Tertiary structure stabilizers — ionic bonds, hydrogen bonds, disulfide linkages, and hydrophobic
      interactions.
    credit: Fig 3.26 · OpenStax Biology 2e — CC BY-NC-SA 4.0
- heading: Protein function — binding and enzymes
  objectives:
  - Relate an active site's structure to its substrate specificity.
  - Describe how antibody variable regions generate binding diversity.
  - Explain a classic structure-function pair such as collagen or haemoglobin.
  body:
  - ==Enzymes bind substrates at active sites (induced fit); the structure determines specificity — with
    a few side-chain contacts deciding affinity==. ==Antibodies (immunoglobulins) — Y-shaped, variable
    regions bind antigens, constant regions recruit effectors==.
  - '==Structure-function classics the MCAT reuses: collagen''s Gly-X-Y triple helix (fibrous strength),
    hemoglobin''s cooperative O2 binding (sigmoid curve), intrinsically disordered regions in signaling==.'
  misconception: '"Collagen needs glycine because glycine is special chemically — its hydrogen forms a
    unique bond in the core." No bond is formed. Glycine is simply the only residue small enough: the
    three strands pack so tightly that anything bulkier than hydrogen wedges the core open. That size
    requirement is why a single Gly-to-larger mutation in collagen causes osteogenesis imperfecta.'
  connection: 'Hemoglobin''s sigmoid oxygen-binding curve is quaternary structure made measurable: binding
    at one subunit shifts the others to a higher-affinity shape, which is cooperative allostery — the
    same mechanism the enzyme-regulation section of chapter Biochemistry describes. Chapter 3B · Main
    organ systems follows the physiological payoff, from tissue oxygen delivery to the Bohr effect.'
  connection_label: How sciences interconnect
  check:
  - q: Antibody specificity comes from…
    options:
      A: The Fc sugar
      B: The constant region
      C: The hinge
      D: The variable regions of light and heavy chains
    answer: D
    explain: Variable domains make the antigen-binding pocket.
    distractors:
      A: Fc is effector-side.
      B: Constant mediates effector function.
      C: Hinge allows flexibility.
      D: Correct.
  - q: Collagen's triple helix demands glycine at every third position because…
    options:
      C: Glycine's tiny side chain is the only one that fits the crowded core
      A: Glycine's charge stabilises the three strands
      B: Glycine forms the interchain disulfide bonds
      D: Glycine makes the superhelix right-handed
    answer: C
    explain: Three strands pack so tightly that anything bulkier than a hydrogen wedges the core open.
    distractors:
      A: Glycine carries no ionisable side chain at all.
      B: Collagen's cross-links involve lysine-derived aldehydes, not glycine.
      D: The individual strands are left-handed; glycine's size, not its identity, allows it.
examples:
- prompt: 'A protein segment is analyzed: sequence Gly-Pro-Leu forms a left-handed structure with a period
    of about 3.0 A per residue. Identify the structure and name the residue that makes it unique.'
  strategy: 'Identify by structural signature before naming anything: a repeating triplet with about 3.0
    A rise per residue and a left-handed twist matches collagen''s building block, not an alpha-helix
    (3.6 residues per turn) or a beta-sheet (extended). Once the pattern is named, ask which residue''s
    size makes that geometry physically possible.'
  solution:
  - Triplet Gly-X-Y repeating period — that is collagen's left-handed helix.
  - Glycine is the only residue with room in the tight center.
  - Proline's ring locks phi/psi and forces the helix geometry.
  - Three strands then wrap into the right-handed superhelix of collagen fibers.
  answer: Collagen triple-helix building block — Gly at every third position makes it possible.
  discussion: 'Glycine is the answer because the three strands pack so tightly that anything larger than
    a hydrogen wedges the core apart — which is precisely why Gly-to-X mutations cause osteogenesis imperfecta.
    Watch the handedness subtlety: each strand is left-handed while the three-strand superhelix winds
    right-handed, and proline''s rigid ring sets the strand geometry rather than disrupting it. The 3.0
    A per-residue rise is the fingerprint that rules out every other fold.'
  distractors:
    A: Alpha-helix — 3.6 residues/turn, not a Gly-X-Y pattern.
    B: Beta-sheet — extended, no 3.0 A rule.
    C: Random coil — repetition is structural, not random.
  practice:
    q: A fibrous protein forms a structure of 3.6 residues per turn with backbone H-bonds from residue
      i to i+4. Which residue most disrupts it, and why?
    options:
      C: Proline, which cannot adopt the helix torsion angles or donate a backbone N-H
      A: Glycine, which is too small to reach the H-bond
      B: Alanine, which is too hydrophobic
      D: Cysteine, which always forms a disulfide
    answer: C
    explain: The description is an alpha-helix; proline breaks it by locking the backbone and lacking
      an amide hydrogen.
    distractors:
      A: Glycine is helix-tolerant precisely because it is small.
      B: Side-chain hydrophobicity does not touch backbone hydrogen bonding.
      D: Disulfides are optional and depend on oxidation, not on cysteine's mere presence.
key_equations:
- latex: $pI = \frac{pK_{a1} + pK_{a2}}{2}$
  symbols: pI isoelectric point, pKa1 and pKa2 the flanking ionizations
  when: neutral side chains only; charged residues must include the side-chain pKa
- latex: $\text{peptide bonds} = n - 1$
  symbols: n residues in a linear chain
  when: add disulfide bridges separately — they are extra covalent links, not peptide bonds
- latex: $\text{charge} = f(pH - pK_a)$
  symbols: below the pKa a group is protonated; above it, deprotonated
  when: side-chain charge at any pH — Lys (10.5) positive and Glu (4.2) negative at pH 7
- latex: '$\text{helix: } i \rightarrow i+4\ \text{backbone H-bonds}$'
  symbols: the C=O of residue i bonds the N-H of residue i+4
  when: 3.6 residues per turn; proline cannot donate the N-H, glycine is too flexible
- latex: '$\alpha\beta: \ \text{Hb} = \alpha_{2}\beta_{2}$'
  symbols: two alpha and two beta chains assembling
  when: quaternary structure — multiple polypeptides, cooperative O2 binding
key_points:
- Zwitterion at pH 7; pI = (pKa1 + pKa2)/2 for neutral residues.
- Glycine achiral; cysteine disulfides; proline kinks.
- Peptide bonds — planar, condensation, n-1 in a chain.
- 'Helix: backbone H-bonds i+4; sheet: extended strands.'
- Tertiary — hydrophobic core; quaternary — subunit assembly.
- Denaturation spares primary structure — SDS, heat, pH.
mnemonics:
- phrase: 'Amino acids of the nonpolar lot: GAVLIMP'
  means: Gly, Ala, Val, Leu, Ile, Met, Pro — the hydrophobic set.
- phrase: N to C, water out
  means: Peptide bond direction and the condensation chemistry.
maps:
- title: Structure ladder
  steps:
  - 'primary — sequence (Anfinsen: encodes the fold)'
  - secondary — helix/sheet via backbone H-bonds
  - tertiary — side-chain packing, hydrophobic core
  - quaternary — subunit assembly (hemoglobin)
- title: Denaturation toolkit
  steps:
  - heat/pH — breaks H-bonds and ionic
  - urea/detergent — hydrophobic disruption
  - SDS — uniform charge, kills all shape
  - reducing agent — opens disulfides
passage:
  text: A researcher mutates residue 90 of a helix-forming protein from Leu to Asp. The protein now fails
    to fold under physiological pH but refolds when pH drops to 5. CD spectroscopy shows no helix in the
    misfolded state.
  questions:
  - q: The Leu-to-Asp mutation disrupts folding by…
    options:
      A: Removing a disulfide
      B: Breaking a peptide bond
      C: Truncating the chain
      D: Introducing a charged group into a hydrophobic core
    answer: D
    explain: Asp is negative at pH 7 and drawn to the aqueous surface — the hydrophobic core cannot bury
      it.
    distractors:
      A: No Cys involved.
      B: No hydrolysis.
      C: Same length.
      D: Correct.
  - q: Lowering the pH to 5 restores folding because…
    options:
      A: Asp becomes protonated and neutral
      B: The helix stretches
      C: Proline is removed
      D: Disulfides form
    answer: A
    explain: Below Asp's side-chain pKa (~4), the group picks up H+ and turns neutral — buryable again.
    distractors:
      A: Correct — pKa logic.
      B: No geometry change.
      C: Proline untouched.
      D: No cysteine oxidation.
  - q: The secondary-structure failure at pH 7 indicates…
    options:
      A: The mutation destabilizes helix via charge repulsion and burial penalty
      B: The primary sequence changed
      C: Chaperones were absent
      D: The protein is denatured
    answer: A
    explain: A helix-stabilizing hydrophobic residue became a repulsive charged one.
    distractors:
      B: Sequence change is true but is the cause, not mechanism.
      C: Controls used proper folding conditions.
      D: Denaturation is a description, not the mechanism.
pitfalls:
- Counting peptide bonds as residues.
- Calling alpha-helix stabilization hydrophobic.
- Forgetting glycine is achiral and collagen-specific.
- SDS breaks disulfides — no, reducing agents do.
- pI arithmetic on charged residues uses pKa of side chains too.
