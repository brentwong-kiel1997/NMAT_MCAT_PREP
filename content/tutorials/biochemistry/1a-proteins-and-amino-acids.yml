review_questions:
- q: At pH 7, lysine's side chain is…
  options:
    A: Uncharged
    B: Positively charged
    C: Negatively charged
    D: Covalent
  answer: B
  explain: pKa ~10.5 — protonated at pH 7.
  distractors:
    A: Deprotonated only above 10.5.
    B: Correct.
    C: Asp/Glu are negative.
    D: Charge state is ionic.
- q: Disulfide bonds form between…
  options:
    A: Two methionines
    B: Two cysteines (oxidation)
    C: Serine and threonine
    D: Any two sulfurs
  answer: B
  explain: Cys thiols oxidize to -S-S-.
  distractors:
    A: Met has thioether — no bond.
    B: Correct.
    C: No SH on those.
    D: Only Cys has the SH that oxidizes.
- q: An antiparallel beta-sheet is…
  options:
    A: Stronger than parallel
    B: Weaker than parallel
    C: Identical
    D: Circular
  answer: A
  explain: Backbone H-bonds align more linearly in antiparallel.
  distractors:
    A: Correct.
    B: Opposite.
    C: Geometry differs.
    D: Sheets are straight, not circular.
- q: A chaperone's job is…
  options:
    A: Breaking peptide bonds
    B: Assisting proper folding
    C: Cutting DNA
    D: Synthesizing amino acids
  answer: B
  explain: Helping chains reach the native fold without aggregation.
  distractors:
    A: Proteases do that.
    B: Correct.
    C: Nucleases do.
    D: Metabolism does.
