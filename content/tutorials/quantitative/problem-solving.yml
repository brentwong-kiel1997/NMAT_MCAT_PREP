review_questions:
- q: The sum of three consecutive even integers is 48. The largest is…
  options:
    A: '18'
    B: '16'
    C: '20'
    D: '14'
  answer: A
  explain: n + (n+2) + (n+4) = 48 → 3n = 42 → n = 14; largest 18.
  distractors:
    A: Correct.
    B: Middle value.
    C: n + 6.
    D: Smallest.
- q: A discount of 25% followed by 10% off the new price is…
  options:
    A: 32.5% off original
    B: 35% off
    C: 27.5% off
    D: 30% off
  answer: A
  explain: 0.75 x 0.9 = 0.675 → 32.5% total discount.
  distractors:
    A: Correct.
    B: Adding discounts.
    C: Rounding.
    D: Near-miss.
- q: Car A at 60 km/h and Car B at 40 km/h head toward each other 300 km apart. They meet after…
  options:
    A: 2 h
    B: 3 h
    C: 5 h
    D: 4 h
  answer: B
  explain: Relative speed 100 km/h; 300/100 = 3 h.
  distractors:
    A: Half.
    B: Correct.
    C: 300/60.
    D: Wrong relative direction.
- q: The area of a triangle with base 8 and height 6 is…
  options:
    A: '48'
    B: '24'
    C: '14'
    D: '96'
  answer: B
  explain: A = (1/2)(8)(6) = 24.
  distractors:
    A: Without half.
    B: Correct.
    C: Perimeter.
    D: Doubled.
