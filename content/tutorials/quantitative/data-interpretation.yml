review_questions:
- q: A table lists 'Revenue (in millions)'. Reading 45 means…
  options:
    A: '45'
    B: 45,000
    C: 45,000,000
    D: 450 million
  answer: C
  explain: 45 x 1,000,000 = 45 million.
  distractors:
    A: Raw.
    B: Thousands.
    C: Correct.
    D: Scale slip.
- q: From 80 to 100, the percent increase is…
  options:
    A: 20%
    B: 25%
    C: 10%
    D: 22%
  answer: B
  explain: (100-80)/80 = 25%.
  distractors:
    A: Absolute.
    B: Correct.
    C: Half.
    D: Rounding.
- q: A bar chart with 3 categories summing to 100% is effectively…
  options:
    A: A pie chart in bars
    B: A scatter plot
    C: A line graph
    D: A histogram of rates
  answer: A
  explain: Part-to-whole structure — same reading as pie slices.
  distractors:
    A: Correct.
    B: XY pairs.
    C: Trend over time.
    D: Distribution widths.
- q: Steep line slope means…
  options:
    A: Fast rate of change
    B: High absolute value
    C: No change
    D: Negative only
  answer: A
  explain: Slope = rate — steep, fast.
  distractors:
    A: Correct.
    B: Value needs the level.
    C: Flat = none.
    D: Downward = negative.
