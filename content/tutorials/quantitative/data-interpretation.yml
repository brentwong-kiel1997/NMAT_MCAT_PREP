subject: quantitative
chapter: Data Interpretation
title: Data Interpretation
overview: Reading tables, graphs, and charts the way the NMAT asks — trend extraction, comparison, and
  quick percentage math on real data. The data layer is where most lost points happen, not the arithmetic.
sections:
- heading: Tables — read the structure first
  body:
  - ==Table anatomy — margins are labels, not numbers; the body is the data; check units in the header
    row and column==. ==Always note the TIME axis and the SCALE — 'in thousands' or 'per 100,000' changes
    every conclusion==.
  - ==Order of attack — determine what the question asks, locate the relevant row/column pair, then compute.
    ==Reading between rows — differences, ratios, rates of change — needs clean subtraction and division==.
  check:
  - q: A table columns are 'Year, Population (in thousands), GDP (in millions)'. A cell shows 120. That
      population means…
    options:
      A: 120 people
      B: 120,000 people
      C: 120,000,000 people
      D: 120 thousand pesos
    answer: B
    explain: The header says thousands — 120 x 1000 = 120,000.
    distractors:
      A: Reading the raw cell.
      B: Correct.
      C: Adding zeroes.
      D: Unit confusion.
- heading: Bar and line graphs — trends and magnitudes
  body:
  - ==Line graphs tell trends — direction, steepness (rate), and turning points==. ==Bar graphs compare
    magnitudes across categories — read the exact value where the bar ends, and compare heights for rough
    ratios==.
  - ==Reading pitfalls — axes that don't start at zero exaggerate differences; log scales change ratio
    reading; ==trend questions ask about SLOPE, not absolute value==.
  check:
  - q: A line rises steeply from 2019 to 2020 then flatlines. The best summary is…
    options:
      A: No change
      B: Constant decline
      C: Slow steady rise
      D: Fast growth then stagnation
    answer: D
    explain: Steep upslope = rapid increase; flat = no further change.
    distractors:
      A: Contradicts the slope.
      B: Opposite direction.
      C: Rate is wrong.
- heading: Pie charts and parts-of-a-whole
  body:
  - ==Pie slices — each percent is a fraction of the total; the WHOLE must sum to 100%==. ==Computing
    a missing slice — 100 minus the given slices; computing a count — percent x total / 100==.
  - ==Comparison traps — equal-looking slices differ slightly; angle vs percent (the full circle is 360
    degrees; a 90-degree slice is 25%)==.
  check:
  - q: A pie chart shows 40% transport, 25% food, 20% housing, 15% other. A 30-degree slice corresponds
      to…
    options:
      A: 10%
      B: 12%
      C: 8.3%
      D: 15%
    answer: C
    explain: 30/360 = 8.33% of the whole.
    distractors:
      A: 30/300.
      B: 30/250.
      C: Correct.
      D: The 'other' slice.
- heading: Ratios, rates, and percent change from data
  body:
  - ==Percent change = (new - old)/old x 100% — the BASE is always the earlier value==. ==Rates — per
    capita = total / population; density = count/area; per-100,000 rates matter in health tables==.
  - ==Index numbers — a base year set to 100; ratios multiply; index change reflects percent change since
    the base. ==Weighted averages from grouped data — weight by group size, not by group count==.
  check:
  - q: GDP rose from 40,000 to 44,000. The percent change is…
    options:
      A: 11%
      B: 4%
      C: 9.1%
      D: 10%
    answer: D
    explain: (44000 - 40000)/40000 = 10%.
    distractors:
      A: Rounding.
      B: Four percent.
      C: New base % change.
      D: Correct.
- heading: Reading experimental graphs in other sections
  body:
  - ==Scatter plots — direction, strength, clusters; correlation is not causation==. ==Grouped bar/multiple
    series — the legend is the key; comparison questions need matching series across categories==.
  - ==Trend extrapolation — the exam asks 'if the trend continued' — extend the last segment, don't invent
    new shape. ==Outliers — identify and exclude from 'overall trend' answers==.
  check:
  - q: A scatter of height vs weight shows a tight upward cluster. The strongest claim supported is…
    options:
      A: Weight causes height
      B: There is a positive association
      C: They are independent
      D: The plot is invalid
    answer: B
    explain: Direction and strength — never causation from correlation alone.
    distractors:
      A: Causality overreach.
      B: Correct.
      C: Contradicts the cluster.
      D: No basis.
examples:
- prompt: 'Year 2017: Science 12,000; Math 8,000. Year 2019: Science 15,000; Math 9,000. Which subject
    grew faster in percent terms, and by how much?'
  solution:
  - 'Science: (15000-12000)/12000 = 25%.'
  - 'Math: (9000-8000)/8000 = 12.5%.'
  - Science grew twice as fast in percent terms.
  - Absolute growth is larger for science too (3000 vs 1000) — but the item asked percent.
  answer: Science — 25% vs 12.5%.
  distractors:
    A: Math — comparing absolute growth only.
    B: Science by 15% — mixing bases.
    C: Equal — using absolute differences.
key_points:
- Scale headers — thousands/millions change meaning.
- Percent change bases on the EARLIER value.
- Line slope = trend; bars = magnitudes.
- Pie slices — fraction of a circle or percent of a whole.
- Rates — per-capita and per-100,000 denominators.
- Correlation ≠ causation — scatter claims stay descriptive.
mnemonics:
- phrase: New minus old over old
  means: Percent change formula with the right base.
- phrase: Slope for trends, height for amounts
  means: What to read in line vs bar graphs.
maps:
- title: Graph reading sequence
  steps:
  - title and axes/legend
  - units and scale
  - trend/shape in one sentence
  - answer specific question with located values
  - percent math — right base
- title: Rate conversion
  steps:
  - per capita — divide by population
  - per 100,000 — multiply the rate
  - index — base = 100
  - density — count over area
passage:
  text: 'Region A: Population 500,000; 8,000 positive cases; Region B: 1,500,000 population; 18,000 positive
    cases. Column headers: ''Region, Population, Cases, Cases per 100,000''.'
  questions:
  - q: The cases per 100,000 in Region A is…
    options:
      A: '160'
      B: '16'
      C: '1.6'
      D: 1,600
    answer: D
    explain: 8000/500000 x 100000 = 1600.
    distractors:
      A: Wrong decimal.
      B: Raw ratio.
      C: Percent.
      D: Correct.
  - q: Which region has the higher per-capita case rate?
    options:
      A: Equal
      B: Region B
      C: Region A
      D: Cannot tell from the table
    answer: C
    explain: 'A: 1600/100k vs B: 1200/100k — A higher.'
    distractors:
      A: Rates differ.
      B: Larger absolute counts mislead.
      C: Correct.
      D: The data is complete.
  - q: A 60% increase in A's cases would add…
    options:
      A: 4,800
      B: '480'
      C: 12,800
      D: '800'
    answer: A
    explain: 0.6 x 8000 = 4,800 new cases added.
    distractors:
      B: Wrong decimal.
      C: That is the NEW TOTAL, not the increase.
      D: Percent alone.
pitfalls:
- Base of percent change — the OLD value.
- Per-100,000 vs percent confusion.
- Axes not at zero — visual exaggeration.
- Correlation claims.
- Reading 'nearest' vs 'exact' — the question wording decides.
