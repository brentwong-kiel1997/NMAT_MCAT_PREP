review_questions:
- q: 12% of 250 equals…
  options:
    A: '30'
    B: '25'
    C: '12'
    D: '35'
  answer: A
  explain: 0.12 x 250 = 30.
  distractors:
    A: Correct.
    B: 10% base.
    C: 12 itself.
    D: Overshoot.
- q: (x^3)^2 = …
  options:
    A: x^5
    B: x^6
    C: x^9
    D: x
  answer: B
  explain: 'Power of a power multiplies: x^6.'
  distractors:
    A: Adds — base times exponent.
    B: Correct.
    C: Cubes the exponent.
    D: Drops the power.
- q: Two workers take 3 h and 6 h alone. Together they take…
  options:
    A: 4.5 h
    B: 2 h
    C: 9 h
    D: 1.5 h
  answer: B
  explain: 1/t = 1/3 + 1/6 = 1/2 → t = 2 h.
  distractors:
    A: Average.
    B: Correct.
    C: Sum.
    D: Half of the mean.
- q: A 15% tip on a 480-peso meal is…
  options:
    A: '62'
    B: '72'
    C: '48'
    D: '96'
  answer: B
  explain: 0.15 x 480 = 72.
  distractors:
    A: Near miss.
    B: Correct.
    C: 10% tip.
    D: 20% tip.
