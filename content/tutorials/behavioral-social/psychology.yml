review_questions:
- q: The myelin sheath…
  options:
    A: Speeds conduction by insulating the axon
    B: Releases dopamine
    C: Detects pain
    D: Stores memories
  answer: A
  explain: Saltatory conduction — signal jumps between nodes of Ranvier.
  distractors:
    A: Correct.
    B: Axon terminals do.
    C: Nociceptors do.
    D: Hippocampus does.
- q: Extinction in classical conditioning is…
  options:
    A: Forgetting the CR entirely
    B: Presenting the CS without the US
    C: Presenting the US alone
    D: Reinforcement of the CR
  answer: B
  explain: The learned response fades when the CS stops predicting the US.
  distractors:
    A: Spontaneous recovery shows residue.
    B: Correct.
    C: That is sensitization.
    D: That is operant maintenance.
- q: Which is a working-memory task?
  options:
    A: Reciting a 20-year-old poem
    B: Holding digits while reversing them
    C: Recognizing a face
    D: Riding a bike
  answer: B
  explain: Active manipulation of current information — the dual task signature.
  distractors:
    A: Long-term retrieval.
    B: Correct.
    C: Recognition memory.
    D: Procedural skill.
- q: Broca's aphasia spares…
  options:
    A: Fluent production
    B: Comprehension mostly intact
    C: Reading aloud
    D: Writing
  answer: B
  explain: Nonfluent, effortful speech with relatively preserved understanding.
  distractors:
    A: Speech is nonfluent.
    B: Correct.
    C: Reading aloud fails with production.
    D: Writing is typically affected too.
