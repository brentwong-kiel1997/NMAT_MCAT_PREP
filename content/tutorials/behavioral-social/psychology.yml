subject: behavioral-social
chapter: Psychology
title: Psychology
overview: The full NMAT psychology pass — brain-behavior, learning, memory, cognition, motivation, emotion,
  development, personality, abnormal and social psychology at introductory depth. Overlaps with every
  MCAT psych/soc category.
sections:
- heading: Biological bases of behavior
  objectives:
  - Walk through an action potential — resting potential, threshold, repolarization by the sodium-potassium
    pump — and place a drug or lesion at its step.
  - Map a described deficit to the lobe or structure responsible (frontal, temporal, parietal, occipital,
    amygdala, hippocampus, cerebellum).
  - Predict a transmitter-level change (dopamine, serotonin, acetylcholine, GABA) from a described syndrome.
  body:
  - '==Neurons fire via action potentials — resting -70 mV, threshold -55 mV, restored by the sodium-potassium
    pump (3 Na+ out, 2 K+ in)==. Synaptic transmission: neurotransmitter released into the cleft binds
    receptors; drugs and toxins exploit reuptake and degradation. ==Neurotransmitters map to behavior
    — dopamine (reward/movement), serotonin (mood), acetylcholine (muscle/memory), GABA (inhibition)==.'
  - 'Brain geography — ==frontal (executive function, personality), temporal (auditory, memory), parietal
    (somatosensory, spatial), occipital (vision)==; limbic system (amygdala fear, hippocampus memory);
    cerebellum (coordination); brainstem (vital reflexes). Hemispheres — left language in most, right
    spatial. ==Plasticity: brain rewires after damage; young brains recover best==.'
  check:
  - q: Damage to the amygdala most directly impairs…
    options:
      A: Object recognition
      B: Language production
      C: Fear conditioning and emotional responses
      D: Coordination
    answer: C
    explain: Amygdala is the fear/emotion hub — encoding emotional significance.
    distractors:
      A: Temporal/occipital junction.
      B: Broca area does that.
      D: Cerebellum.
  - q: A patient after a stroke can see and move normally but cannot repeat a spoken sentence although
      she understands it. Which area, and which function?
    options:
      A: Occipital cortex — visual decoding
      B: Broca area in the frontal lobe — speech production
      C: Cerebellum — motor coordination
      D: Hippocampus — consolidating the sentence into memory
    answer: B
    explain: Comprehension intact with nonfluent, effortful production localizes to Broca's area in the
      frontal lobe.
    distractors:
      A: Vision is explicitly normal.
      C: Coordination is intact; language production is the deficit.
      D: Repetition is immediate — no consolidation is required.
- heading: Learning and conditioning
  objectives:
  - Assign a described contingency to classical or operant conditioning by what controls the behavior.
  - Classify a reinforcement schedule from its response pattern and predict resistance to extinction.
  - Distinguish positive/negative reinforcement from punishment in a described consequence.
  body:
  - '==Classical conditioning (Pavlov) — neutral stimulus paired with an unconditioned one acquires the
    response; extinction and spontaneous recovery shape it; generalization and discrimination set the
    boundaries==. Operant (Skinner) — behavior shaped by consequences: ==reinforcement increases behavior
    (positive: add reward; negative: remove aversive); punishment decreases it==.'
  - ==Schedules — fixed ratio (high rate, pause), variable ratio (slot machines — highest rate), fixed
    interval (scalloped), variable interval (slow steady)==. Observational learning (Bandura's Bobo) —
    learn by watching models; vicarious reinforcement updates expectations.
  check:
  - q: A slot machine pays on a…
    options:
      A: Fixed ratio schedule
      B: Variable interval schedule
      C: Fixed interval schedule
      D: Variable ratio schedule
    answer: D
    explain: Unpredictable reinforcement after variable trials — maximal resistance to extinction.
    distractors:
      A: Predictable payouts.
      B: Time-based.
      C: Time-based.
  - q: A child tantrums in shops; the parent buys a toy to end each tantrum. Months later tantrums occur
      in every shop. What was reinforced, whose behavior, and with which operation?
    options:
      A: The child's tantrum behavior, negatively reinforced — an aversive (the tantrum) was removed
      B: The parent's buying behavior, negatively reinforced — the aversive tantrum stops when they comply
      C: The child's tantrum, positively punished — the toy suppresses it
      D: The parent's buying, positively punished — the cost suppresses shopping
    answer: B
    explain: The parent's compliance rises because it removes the aversive tantrum — negative reinforcement
      of the parent, and the trap the vignette is built on.
    distractors:
      A: Negative reinforcement always INCREASES the behavior that produced relief — here that is the
        parent's buying, not the child's tantrum.
      C: The tantrums increased, so nothing was punished.
      D: The parent's shopping did not decrease.
  figures:
  - src: behavioral-social/psychology/fig-0a68ead5.webp
    caption: Classical conditioning — the dog salivating to the bell after repeated bell-food pairings.
    credit: Ch 6 · OpenStax Psychology 2e — CC BY-NC-SA 4.0
  - src: behavioral-social/psychology/fig-2909f5e9.webp
    caption: A founding figure of learning research — the conditioning chapter's portrait.
    credit: Ch 6 · OpenStax Psychology 2e — CC BY-NC-SA 4.0
- heading: Memory systems
  objectives:
  - Trace a described item through sensory, working, and long-term stores with each store's capacity and
    duration.
  - Sort a described memory into explicit episodic, explicit semantic, or implicit procedural/priming.
  - Distinguish proactive from retroactive interference in a described forgetting episode.
  body:
  - '==Three-store model: sensory (<1 s) → short-term/working (about 7 +/- 2 items, ~20 s) → long-term
    (potentially permanent)==. Encoding, storage, retrieval; forgetting via decay, interference (proactive
    old blocks new; retroactive new blocks old).'
  - ==Long-term types — explicit (episodic events, semantic facts) vs implicit (procedural skills, priming,
    classical conditioning)==. Memory errors — the misinformation effect, source confusion, flashbulb
    inaccuracies. Retrieval cues and context dependence (state-dependent learning).
  check:
  - q: Riding a bicycle uses…
    options:
      A: Procedural memory
      B: Episodic memory
      C: Working memory only
      D: Semantic memory
    answer: A
    explain: Skills are procedural — implicit, learned by practice.
    distractors:
      B: Event recall.
      C: Not storing the skill.
      D: Fact recall.
  - q: A student learned Spanish in high school and French last year. In a Spanish test she keeps producing
      French words. Which interference, and which direction?
    options:
      A: Proactive — the older Spanish list disrupts the new French learning
      B: Retroactive — the newer French list disrupts recall of the older Spanish
      C: Decay — the Spanish trace faded with time
      D: Source confusion — she cannot remember where she learned the words
    answer: B
    explain: New learning acting backwards on old memory is retroactive interference.
    distractors:
      A: Proactive is old-blocking-new; here the old material is the casualty.
      C: Decay predicts uniform fading, not intrusion of specific competing words.
      D: She knows the language of origin — she retrieves the wrong items.
- heading: Cognition, language, and intelligence
  objectives:
  - Name the heuristic or bias in a described judgment and say what evidence would correct it.
  - Locate a described aphasia to Broca or Wernicke by fluency and comprehension.
  - Distinguish reliability from validity when evaluating a described test.
  body:
  - '==Heuristics — availability (judge by ease of recall), representativeness (match prototypes), anchoring;
    biases — confirmation, hindsight, overconfidence==. Problem solving: algorithms (guaranteed), heuristics
    (fast), insight; functional fixedness and mental sets block solutions.'
  - '==Language: phonemes -> morphemes -> syntax; Broca (production) vs Wernicke (comprehension); critical
    period hypothesis (Lenneberg)==. Intelligence — Spearman g, Gardner''s multiple, Sternberg triarchic;
    ==IQ tests must show reliability (consistency) and validity (measuring what they claim)==.'
  check:
  - q: Judging the likelihood of events by how easily examples come to mind is…
    options:
      A: The availability heuristic
      B: Anchoring
      C: The representativeness heuristic
      D: Framing
    answer: A
    explain: Easily recalled = judged probable — the availability shortcut.
    distractors:
      B: Initial value bias.
      C: Prototype matching.
      D: How options are worded.
  - q: A patient speaks fluently and at length but with invented words, and follows no instructions. Which
      area and which deficit?
    options:
      A: Broca area — nonfluent production with preserved comprehension
      B: Wernicke area — fluent but meaningless output with poor comprehension
      C: Occipital cortex — visual word-form loss
      D: Arcuate fasciculus — intact comprehension and production but broken repetition
    answer: B
    explain: Fluent neologistic speech plus failed comprehension is the Wernicke signature.
    distractors:
      A: The speech is fluent, so this is not Broca.
      C: Nothing visual is reported.
      D: Conduction aphasia spares comprehension — here it fails.
- heading: Motivation, emotion, and stress
  objectives:
  - Match an emotion episode to James-Lange, Cannon-Bard, or Schachter's two-factor theory by the order
    of arousal and label.
  - Locate a task on the Yerkes-Dodson curve and predict the effect of raising arousal.
  - Sequence Selye's GAS stages and name the appraisal variable that sets the severity.
  body:
  - ==Motivation theories — drive-reduction (hunger, thirst), incentive, arousal (Yerkes-Dodson — moderate
    arousal = peak performance), Maslow's hierarchy==. Emotion — James-Lange (body first, then label),
    Cannon-Bard (simultaneous), Schachter two-factor (arousal + attribution); facial feedback hypothesis.
  - '==Stress — Selye''s GAS: alarm, resistance, exhaustion; appraisal of coping resources decides severity
    (Lazarus)==. Type A personality and stress-related illness. Coping — problem-focused vs emotion-focused.'
  check:
  - q: The theory that we label our emotion from bodily arousal plus situational cues is…
    options:
      A: James-Lange
      B: Cannon-Bard
      C: Schachter's two-factor
      D: Facial feedback
    answer: C
    explain: Arousal is generic; the situation supplies the label.
    distractors:
      A: Body alone.
      B: Simultaneous.
      D: Expressions shape feeling.
  - q: Given caffeine, participants on an easy sorting task speed up while those on a difficult reasoning
      task make more errors. Which theory, and which claim does it make?
    options:
      A: Cannon-Bard — arousal and emotion run in parallel, so both tasks improve
      B: Yerkes-Dodson — arousal's effect depends on task difficulty, an inverted U
      C: James-Lange — the body's arousal produces the emotion afterwards
      D: Schachter two-factor — arousal is labeled by the situation
    answer: B
    explain: 'Identical arousal, opposite outcomes: the inverted U says optimal arousal is lower for complex
      tasks.'
    distractors:
      A: Cannon-Bard makes no task-difficulty prediction.
      C: James-Lange orders body before feeling; it does not predict accuracy.
      D: Attribution is not manipulated here — only arousal level is.
examples:
- prompt: A rat is trained to press a lever for food — then the food stops. The pressing rate falls but
    periodically clusters right before what used to be feeding times. What schedule was used?
  strategy: 'Read the response record, not the description. Pauses and their position relative to reinforcement
    identify the schedule: time-based schedules produce anticipatory scallops or steady rates, count-based
    schedules produce post-reinforcement pauses or high steady output.'
  solution:
  - Pressing continued after reinforcement stopped — extinction resistance.
  - The time-clustered bursts, not count-clustered, point to time-based reinforcement.
  - Scheduled food at fixed times = fixed interval — scalloped responding before each.
  - Variable schedules would give steady rates, not pauses before expected times.
  answer: Fixed interval schedule — the scallop pattern gives it away.
  discussion: 'The diagnostic generalises: fixed interval gives the pre-reinforcement scallop, variable
    interval a slow steady line, fixed ratio a post-reward pause, variable ratio the highest and most
    extinction-resistant rate. Whenever a vignette gives you a pattern of behavior over time, reconstruct
    the schedule before naming it — the pattern, not the reward, is the evidence.'
  distractors:
    A: Variable ratio — would keep a high steady rate without pauses.
    B: Fixed ratio — pauses come after reinforcement, not before it.
    C: Continuous reinforcement — extinguishes fastest.
  practice:
    q: A security guard patrols a fixed route; supervisors appear at unpredictable times. He keeps a steady,
      moderate patrol pace throughout the shift. Which schedule maintains this?
    options:
      A: Fixed interval
      B: Variable interval
      C: Fixed ratio
      D: Variable ratio
    answer: B
    explain: Reinforcement after unpredictable TIME intervals produces the slow, steady rate described
      — the variable interval signature.
    distractors:
      A: Fixed intervals create a scallop of anticipation before each expected check.
      C: Ratio schedules tie reinforcement to a count of patrols completed.
      D: Variable ratio drives a high rate, not a steady moderate one.
key_points:
- Action potential — all-or-none; reset by Na-K pump.
- Classical = stimulus pairing; operant = consequence-shaped.
- Reinforcement adds or removes; schedules shape rates.
- Sensory -> working (7+/-2) -> long-term; explicit vs implicit.
- Availability and representativeness heuristics.
- 'GAS: alarm, resistance, exhaustion; appraisal moderates.'
mnemonics:
- phrase: FRAP FIVR
  means: Fixed ratio — pause AFTER, variable ratio — no pause; fixed interval — scallop, variable interval
    — steady.
- phrase: Amygdala FEAR, hippocaMPUS memory
  means: Two limbic landmarks in one line.
maps:
- title: Memory pipeline
  steps:
  - sensory register < 1 s
  - short-term/working ~20 s, 7 ± 2 items
  - encoding to long-term
  - retrieval — interference and cues
- title: Stress response
  steps:
  - stressor appraised
  - alarm — fight or flight mobilizes
  - resistance — adaptation taxed
  - exhaustion — resources depleted
passage:
  text: A patient with bilateral hippocampal damage can learn a mirror-drawing task — accuracy improves
    across sessions — yet cannot recall doing it. On word-pair tests, performance matches chance.
  questions:
  - q: The mirror-drawing learning is…
    options:
      A: Working memory
      B: Semantic — explicit
      C: Episodic — explicit
      D: Procedural — implicit
    answer: D
    explain: Skill acquisition survives — procedural memory is hippocampus-independent.
    distractors:
      A: It is stored, not held transient.
      B: Facts would also fail.
      C: Events are lost.
      D: Correct.
  - q: The word-pair failure reflects…
    options:
      A: Attention deficit
      B: Motivation
      C: Explicit memory loss via the hippocampus
      D: Sensory gating
    answer: C
    explain: Hippocampus consolidates explicit episodes and associations.
    distractors:
      A: Attention is preserved.
      B: He tries normally.
      C: Correct.
      D: Senses work.
  - q: Which study design best separates explicit from implicit memory?
    options:
      A: Free recall of a word list
      B: Retroactive interference lists
      C: Serial position curve measurement
      D: Priming — word-stem completion after brief exposure
    answer: D
    explain: Priming alters performance without conscious recollection — implicit.
    distractors:
      A: Explicit recall.
      B: Tests interference, not implicit.
      C: Curve reflects stores, not the dichotomy cleanly.
      D: Correct.
pitfalls:
- Classical vs operant — respond to what (stimulus vs consequence) controls behavior.
- Negative reinforcement is NOT punishment — sign of the operation differs.
- Episodic vs semantic confusion.
- Availability vs representativeness.
- Maslow's hierarchy treated as rigid order in every case.
