review_questions:
- q: A rat receives food every 5th lever press. This is…
  options:
    A: Fixed interval
    B: Fixed ratio
    C: Variable interval
    D: Continuous
  answer: B
  explain: Reinforcement after a fixed COUNT of responses.
  distractors:
    A: That is time-based.
    B: Correct.
    C: Time-based and irregular.
    D: Every response.
- q: The misinformation effect means…
  options:
    A: Later suggestions distort memory
    B: Sensory memory corrupts perception
    C: Information is never stored
    D: Only traumatic memories persist
  answer: A
  explain: Post-event information fuses into the original memory — Loftus.
  distractors:
    A: Correct.
    B: Perception is separate.
    C: Memories are stored.
    D: Not a persistence claim.
- q: Effort justification after initiation ceremonies maintains commitment via…
  options:
    A: Dissonance reduction
    B: Classical conditioning
    C: Operant shaping
    D: Observational modeling
  answer: A
  explain: Suffering with no external payoff needs internal justification — value inflates.
  distractors:
    A: CS-US pairing absent.
    B: No contingency.
    C: No model observed.
- q: Schizophrenia's negative symptoms include…
  options:
    A: Hallucinations
    B: Flat affect and social withdrawal
    C: Delusions
    D: Racing speech
  answer: B
  explain: Loss of normal function — the negative pole.
  distractors:
    A: Positive symptom.
    B: Correct.
    C: Positive.
    D: Manic sign.
