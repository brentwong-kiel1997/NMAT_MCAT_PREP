review_questions:
- q: The Sapir-Whorf hypothesis claims…
  options:
    A: Language shapes perception and thought
    B: Culture is universal
    C: Language is genetically fixed
    D: All languages have one grammar
  answer: A
  explain: Words carve the perceptual world — linguistic relativity.
  distractors:
    A: Correct.
    B: That is cultural universals.
    C: Language is learned.
    D: Grammars differ structurally.
- q: A passport's birth-country classification is an…
  options:
    A: Achieved status
    B: Ascribed status
    C: Role
    D: Reference group
  answer: B
  explain: Assigned at birth without effort.
  distractors:
    A: No achievement involved.
    B: Correct.
    C: A set of expectations.
    D: A comparison standard.
- q: Which is a primary group?
  options:
    A: Department coworkers
    B: Family
    C: Political party
    D: Online forum
  answer: B
  explain: Intimate, enduring, identity-shaping.
  distractors:
    A: Secondary — instrumental.
    B: Correct.
    C: Secondary.
    D: Secondary.
- q: Durkheim called deviance functional because it…
  options:
    A: Clarifies moral boundaries and unites the group
    B: Reduces inequality
    C: Raises productivity
    D: Eliminates anomie
  answer: A
  explain: Punishing deviance strengthens shared norms — society's boundary work.
  distractors:
    A: Correct.
    B: Not his claim.
    C: Not his claim.
    D: Anomie is the condition, not the cure.
