review_questions:
- q: Milgram's obedience dropped most when…
  options:
    A: The learner was in another room
    B: The experimenter left the room
    C: The teacher heard the learner
    D: The shocks were visible
  answer: B
  explain: Authority's physical presence sustains compliance — closeness matters.
  distractors:
    A: Distance from the learner actually kept obedience high.
    C: Hearing the learner kept obedience high.
    D: Seeing the shocks also kept obedience high.
- q: Aronson's jigsaw classroom reduces prejudice by…
  options:
    A: Forcing students to depend on each other's unique knowledge
    B: Separating groups
    C: Rewarding competition
    D: Lecturing on bias
  answer: A
  explain: Interdependence + equal status undermines stereotypes.
  distractors:
    A: Correct.
    B: Segregation entrenches.
    C: Competition inflames.
    D: Knowledge alone rarely suffices.
- q: The actor-observer asymmetry means…
  options:
    A: We see our own actions situationally and others' dispositionally
    B: Observers see both internally
    C: Actors over-credit disposition
    D: No asymmetry exists
  answer: A
  explain: Perspective drives the attribution split.
  distractors:
    B: That is the FAE, not the split.
    C: Opposite.
    D: The asymmetry is robust.
- q: Sternberg's consummate love includes…
  options:
    A: Intimacy only
    B: Intimacy, passion, commitment
    C: Passion only
    D: Commitment only
  answer: B
  explain: All three corners of the triangle.
  distractors:
    A: That is liking.
    B: Correct.
    C: That is infatuation.
    D: That is empty love.
