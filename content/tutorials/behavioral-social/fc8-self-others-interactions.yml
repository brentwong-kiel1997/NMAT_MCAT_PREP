subject: behavioral-social
chapter: FC8 · Self, others, interactions
title: FC8 · Self, Others, Interactions
overview: The self-concept, social cognition, and the mechanics of interaction — attribution, attitudes,
  conformity, aggression, helping, and group processes. Overlaps heavily with psych-soc chapters 8A-8C.
sections:
- heading: The self and identity
  objectives:
  - Distinguish self-efficacy, self-esteem, and self-schema in a described self-belief.
  - Apply reciprocal determinism to show how person, behavior, and environment feed each other.
  - Name the self-presentation effect (spotlight effect, self-serving bias) illustrated by a scenario.
  body:
  - '==Self-concept — how we see ourselves; self-schema (stable, self-relevant beliefs); self-esteem evaluation;
    self-efficacy (Bandura — belief in capability)==. ==Identity — personal vs social; Erikson: identity
    vs role confusion in adolescence==.'
  - ==Social cognitive theory — reciprocal determinism between person, behavior, environment==. Self-presentation
    — impression management; spotlight effect overestimates how noticed we are; the self-serving bias
    inflates success credit.
  check:
  - q: A student believes she can master organic chemistry and persists through failures. This belief
      is…
    options:
      A: Self-schema
      B: Self-serving bias
      C: Self-efficacy
      D: Self-esteem
    answer: C
    explain: Domain-specific capability belief — Bandura's construct.
    distractors:
      A: Stable self-belief.
      B: Attribution of success.
      D: Global evaluation.
  - q: After flubbing a presentation, a student blames the faulty projector; after an earlier success
      he credited his own preparation. Which pattern, and what does it protect?
    options:
      A: Self-serving bias — internal credit for success, external blame for failure, protecting self-esteem
      B: Self-efficacy — his belief in his presentation capability
      C: The spotlight effect — he overestimates how much the audience noticed
      D: Reciprocal determinism — the room shaped his behavior
    answer: A
    explain: Asymmetric attribution by outcome is the self-serving bias; it buffers self-esteem.
    distractors:
      B: No capability belief is measured — only where credit lands.
      C: Nothing here concerns how noticed he felt.
      D: Reciprocal determinism describes person-behavior-environment loops, not credit assignment.
- heading: Social cognition — how we judge others
  objectives:
  - Label an attribution as internal or external and spot the fundamental attribution error in it.
  - Contrast the actor-observer asymmetry with the self-serving bias in a paired scenario.
  - Identify just-world reasoning in a described victim-blaming judgment.
  body:
  - ==Attribution — internal (dispositional) vs external (situational); fundamental attribution error
    — over-credit disposition; actor-observer asymmetry==. ==Self-serving bias — success internal, failure
    external==; just-world belief blames victims.
  - ==Attitudes — ABC (affect, behavior, cognition); cognitive dissonance (effort justification, insufficient
    justification effect); foot-in-the-door and door-in-the-face strategies==. Persuasion — central vs
    peripheral routes (Elaboration Likelihood).
  check:
  - q: Explaining someone else's rudeness as 'a rude person' rather than 'a bad day' is…
    options:
      A: The actor-observer asymmetry
      B: Cognitive dissonance
      C: The self-serving bias
      D: The fundamental attribution error
    answer: D
    explain: Dispositional over attribution for OTHERS' behavior.
    distractors:
      A: Related but centered on self-other difference.
      B: Post-decision discomfort.
      C: That is a self-serving success effect.
  - q: A patient arrives late and a nurse thinks 'irresponsible'. The nurse herself arrives late the next
      day and explains the traffic. What pair of effects is shown, and why do they differ?
    options:
      A: Groupthink and social loafing — the ward is a poorly functioning group
      B: Self-serving bias twice over — both accounts are self-flattering
      C: Fundamental attribution error for the patient, actor-observer asymmetry for herself — perspective
        supplies the information difference
      D: Cognitive dissonance — the nurse must reduce the inconsistency
    answer: C
    explain: For others we default to disposition; for ourselves we have rich access to situational pressure
      — the same lateness, two explanations.
    distractors:
      A: No group decision or effort loss is involved.
      B: Only her own account is self-serving; the patient's is dispositional.
      D: No attitude-behavior inconsistency needs resolving here.
- heading: Conformity, obedience, and group influence
  objectives:
  - Distinguish informational from normative influence in a described conformity episode.
  - Predict how Milgram's obedience rate moves when authority proximity or learner distance changes.
  - Name the group process (deindividuation, polarization, groupthink, social loafing, social facilitation)
    at work in a scenario.
  body:
  - ==Asch — conformity with unambiguous stimuli under group pressure; informational (accurate belief)
    vs normative (fit in) influence==. Milgram — obedience to authority escalates with proximity of the
    experimenter and distance from the learner.
  - ==Group effects — deindividuation (anonymity), group polarization (discussion intensifies), groupthink
    (premature consensus suppressing dissent), social loafing (effort drops in groups)==. Social facilitation
    — arousal boosts dominant responses — easy tasks improve, hard tasks worsen.
  check:
  - q: Social loafing is least likely when…
    options:
      A: The group is large and anonymous
      B: The task is dull
      C: Individual contributions are identifiable
      D: Members are strangers
    answer: C
    explain: Identifiability restores accountability — effort returns.
    distractors:
      A: Anonymity enables loafing.
      B: Dull tasks loaf more.
      C: Correct — monitoring kills it.
      D: Strangers loaf more.
  - q: A junior resident stays silent as the team agrees on a plan she thinks is wrong; nobody has dissented
      and the senior is confident. Afterwards the plan is clearly riskier than any member's private view.
      Name the two stacked effects.
    options:
      A: Social loafing plus deindividuation — no one was identifiable
      B: Pluralistic ignorance feeding groupthink — silence reads as agreement and dissent is suppressed
        before the decision
      C: Bystander effect plus pluralistic ignorance — help was withheld
      D: Social facilitation — the audience improved everyone's performance
    answer: B
    explain: Each member reads the others' silence as endorsement (pluralistic ignorance) and the group
      converges prematurely on a risky consensus (groupthink).
    distractors:
      A: Effort and anonymity are not the failure here; information flow is.
      C: There is no emergency or helping decision in play.
      D: Facilitation concerns individual performance in front of others, not group judgment.
- heading: Aggression, altruism, and attraction
  objectives:
  - Trace a helping decision through the Latané-Darley steps and name the step that failed.
  - Separate the bystander effect's diffusion of responsibility from pluralistic ignorance.
  - Identify proximity, similarity, mere exposure, or reciprocity as the attraction factor in a described
    pairing.
  body:
  - ==Aggression — biological (amygdala drive, prefrontal brake, testosterone/serotonin) × situational
    (frustration-aggression, heat, weapons effect)==. Bystander effect — more witnesses → less helping
    (diffusion of responsibility, pluralistic ignorance); ==Latané-Darley five steps==.
  - '==Altruism vs egoism — Batson: empathy-altruism; some helping is distress relief==. Attraction —
    proximity, mere exposure, similarity (strongest), reciprocity, physical attractiveness matching; Sternberg''s
    triangle (intimacy, passion, commitment).'
  check:
  - q: Five strangers see smoke in a waiting room and each waits for another to react. This is…
    options:
      A: Social loafing
      B: Deindividuation
      C: Groupthink
      D: Pluralistic ignorance
    answer: D
    explain: Everyone interprets others' inaction as evidence nothing is wrong.
    distractors:
      A: Effort loss, not interpretation.
      B: Loss of self-awareness.
      C: Consensus in decisions.
  - q: A shopper collapses in a busy market. Many witnesses see him; each assumes someone else has already
      called for help, so no one does. Which mechanism, and which single intervention restores helping?
    options:
      A: Pluralistic ignorance — make one person shout for help loudly
      B: Social loafing — reduce the crowd size only
      C: Diffusion of responsibility — single out one individual with a direct request
      D: Mere exposure — repeated exposure to emergencies dulls helping
    answer: C
    explain: With responsibility divided across witnesses, pointing at one person ('you in the green jacket,
      call now') re-concentrates it.
    distractors:
      A: Interpretation is not the failure — everyone saw the collapse clearly.
      B: Loafing concerns effort on shared tasks, not emergency intervention, and crowd size alone is
        not the lever.
      D: Exposure is an attraction principle, not the emergency mechanism.
  figures:
  - src: behavioral-social/fc8-self-others-interactions/fig-9fdf2315.webp
    caption: Non-human primate social behavior — displays and interaction in natural context.
    credit: Ch 12 · OpenStax Psychology 2e — CC BY-NC-SA 4.0
  - src: behavioral-social/fc8-self-others-interactions/fig-c5959bf5.webp
    caption: Prosocial behavior — helping, altruism, and the bystander calculus.
    credit: Ch 12 · OpenStax Psychology 2e — CC BY-NC-SA 4.0
- heading: Group identity, social identity, and discrimination
  objectives:
  - Sort a described case into stereotype (belief), prejudice (attitude), or discrimination (behavior).
  - Apply social identity theory to explain in-group favoritism arising from minimal group assignment.
  - Explain how stereotype threat depresses measured performance and design the removal of the threat
    cue.
  body:
  - ==Social identity theory (Tajfel) — we favor in-groups to elevate self-esteem; minimal groups already
    show bias. ==Stereotypes (beliefs), prejudice (attitudes), discrimination (behavior); implicit bias
    via IAT==. ==Stereotype threat — anxiety confirming negative expectation depresses performance==.
  - ==Reducing bias — contact hypothesis (equal-status contact), superordinate goals, jigsaw classrooms==.
    Blaming the victim and the just-world hypothesis sustain discrimination.
  check:
  - q: A Black student underperforms on a math test after being reminded that the test measures racial
      math gaps. This exemplifies…
    options:
      A: Social loafing
      B: Fundamental attribution error
      C: Stereotype threat
      D: Group polarization
    answer: C
    explain: Anxiety about confirming a negative stereotype consumes working memory.
    distractors:
      A: Effort in groups.
      B: That is attribution of others.
      D: Group discussion effect.
  - q: Before a diagnostic exam, one group of students is told the test is a valid measure of ability,
      another that it is a problem-solving exercise with no group differences ever found. The second group
      scores higher. Name the effect removed and the mechanism.
    options:
      A: Group polarization — discussion intensified the first group's answers
      B: Stereotype threat — removing the evaluative cue frees working memory the anxiety was consuming
      C: Self-fulfilling prophecy via teacher expectation — examiners graded differently
      D: In-group favoritism — the second group felt more identified with the test
    answer: B
    explain: Explicitly decoupling the test from a group comparison removes the threat, which otherwise
      taxes working memory and depresses scores.
    distractors:
      A: No group discussion occurred.
      C: Nothing indicates examiner bias — the same test produced both scores.
      D: Identification with the test is not the manipulated variable.
examples:
- prompt: Design a field experiment showing the bystander effect while controlling for pluralistic ignorance
    as the mechanism.
  strategy: Isolate one mechanism at a time. The bystander effect has two candidate engines — responsibility
    diffusion and misinterpretation — so hold group size constant where possible and vary only the cue
    being tested; a passive confederate supplies the interpretation cue, and its removal supplies the
    control.
  solution:
  - Manipulate perceived group size while holding real help-availability constant.
  - Actor collapses loudly; measure time to help alone versus with one confederate.
  - 'Variant: confederate gives visible ''non-alarm'' cues (looks away) — dissociation test.'
  - 'Predict: more passive models → slower, less help — informational influence confirmed.'
  answer: Passive-confederate design isolates informational social influence.
  discussion: 'The design generalises: whenever two mechanisms predict the same outcome, build a condition
    in which one is disabled. Here the blindfolded control keeps the crowd but strips the misleading signal,
    and the recovery of helping shows interpretation was the hinge. The same dissociation logic separates
    diffusion from interpretation in any emergency, and separates arousal from criterion in signal detection
    work.'
  distractors:
    A: Correlational CCTV — can't separate causes.
    B: Case study of one event — no control.
    C: Survey of intentions — stated helping ≠ real helping.
  practice:
    q: In a staged emergency, participants are tested alone, with two passive confederates, and with two
      confederates who are visibly on phone calls to the study team. Helping is fastest alone, slowest
      with passive confederates, and intermediate in the phone condition. What does the phone condition
      add?
    options:
      A: It removes the group entirely, confirming group size is the cause
      B: It holds group size constant while removing the misleading not-an-emergency signal, isolating
        interpretation
      C: It adds an authority figure, so obedience drives the helping
      D: It measures social loafing among the confederates
    answer: B
    explain: The confederates are still present, so crowding is unchanged, but they cannot model passivity
      about the emergency — any improvement points to the interpretation step.
    distractors:
      A: The group is still physically present in that condition.
      C: The calls are to the study team for coordination, not an authority commanding help.
      D: Loafing is effort loss on shared tasks, not emergency interpretation.
key_points:
- Self-efficacy is domain-specific; self-esteem is global.
- Fundamental attribution error — others' dispositions, our situations.
- Asch conformity; Milgram obedience — situation dominates person.
- 'Bystander tree: notice → interpret → assume responsibility → implement.'
- Social identity — in-group favoritism from minimal cues.
- Stereotype threat consumes working memory under evaluative conditions.
mnemonics:
- phrase: Notice, Interpret, Decide, Act
  means: Latané-Darley helping sequence — fails at any node.
- phrase: Similarity beats proximity
  means: The strongest single attraction predictor.
maps:
- title: Attribution route
  steps:
  - observe behavior
  - internal (disposition/ability) vs external (situation/luck)
  - FAE — default to internal for others
  - correction — effortful, rarely applied
- title: Reducing prejudice
  steps:
  - contact with equal status
  - cooperative superordinate goals
  - institutional support
  - sustained acquaintance
passage:
  text: 'A staged study: participants hear a crash and see smoke. Alone — 75% report within 2 minutes.
    With two passive confederates — 30%. When the confederates are replaced by two blindfolded students
    prepped to ignore — 60%.'
  questions:
  - q: The 75→30 drop demonstrates…
    options:
      A: Diffusion of responsibility
      B: Informational influence
      C: Obedience to authority
      D: Mere exposure
    answer: B
    explain: Passive models signal not-an-emergency — the interpretation step fails.
    distractors:
      A: Both operate, but the blindfolded control isolates interpretation.
      C: No authority present.
      D: No prior exposure tracked.
  - q: The 60% in the blindfolded condition shows…
    options:
      A: Helping is impossible in groups
      B: Blindfolded participants helped
      C: The effect is purely obedience
      D: People still help when cues do not contradict
    answer: D
    explain: Removing the misinformation restores most helping — interpretation was the hinge.
    distractors:
      A: Groups still act when the signal is clear.
      B: Confederates were passive by design.
      C: No authority.
      D: Correct.
  - q: The strongest test of the mechanism is…
    options:
      A: The blindfolded-control contrast
      B: The alone baseline
      C: Report timing
      D: Sample demographics
    answer: A
    explain: It varies the interpretation cue while holding group size rough.
    distractors:
      B: Baseline alone sets the standard.
      C: Secondary measure.
      D: Not manipulated.
pitfalls:
- FAE applied to one's own behavior — that is self-serving.
- Conformity vs obedience — peers vs authority.
- Bystander = diffusion vs interpretation — name the step.
- Groupthink needs a decision context, not any group.
- Altruism evidence — Batson's escape design.
