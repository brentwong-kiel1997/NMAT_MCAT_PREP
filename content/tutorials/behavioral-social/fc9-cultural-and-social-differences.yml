review_questions:
- q: Bourdieu's cultural capital refers to…
  options:
    A: Money that buys education
    B: Nonmaterial resources converted into advantage
    C: Genetic inheritance
    D: Physical assets
  answer: B
  explain: Tastes, credentials, and knowledge with exchange value.
  distractors:
    A: That is economic capital.
    B: Correct.
    C: Not hereditary in the genetic sense.
    D: Social networks overlap, but capital is cultural.
- q: Medicalization of deviance means…
  options:
    A: Crime is always genetic
    B: Behaviors are reclassified as medical conditions
    C: Doctors commit deviance
    D: Illness is a myth
  answer: B
  explain: Addiction, obesity, even shyness — reframed as treatable syndromes.
  distractors:
    A: Not genetic framing.
    B: Correct.
    C: Error.
    D: Not the claim.
- q: Chain migration refers to…
  options:
    A: Migrants following pioneer kin networks
    B: Forced relocation chains
    C: Trade routes
    D: Undocumented only
  answer: A
  explain: Social capital channels later movers through established communities.
  distractors:
    A: Correct.
    B: Not forced.
    C: Not trade.
    D: Applies to all statuses.
- q: The epidemiological transition is…
  options:
    A: Infectious → chronic disease dominance
    B: Rural → urban shift
    C: Fertility decline
    D: Migration growth
  answer: A
  explain: Mortality causes shift with development.
  distractors:
    A: Correct.
    B: That is the demographic move.
    C: That is stage 3.
    D: Separate process.
