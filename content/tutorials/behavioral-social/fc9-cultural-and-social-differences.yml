subject: behavioral-social
chapter: FC9 · Cultural and social differences
title: FC9 · Cultural and Social Differences
overview: Social structure, culture, institutions, and demographics — how society shapes individuals and
  groups differ. Overlaps psych-soc 9A-9B and the sociology survey. The MCAT tests structure-culture-outcome
  linkages in health passages.
sections:
- heading: Social structure and institutions
  objectives:
  - Name the institution at work in a described scenario and the resource it distributes.
  - Identify the hidden curriculum or self-fulfilling prophecy operating inside a school episode.
  - Trace how credentialing or tracking reproduces inequality across a generation.
  body:
  - ==Social structure = statuses, roles, groups, institutions organizing life==. Institutions — family,
    education, religion, economy, government, health care; each reproduces norms and distributes resources
    with characteristic patterns.
  - ==Education — hidden curriculum, credentialing, tracking and its reproduction of inequality; the self-fulfilling
    prophecy (Rosenthal) inside schools==. Health care as institution — access divides by class, insurance
    status, geography.
  check:
  - q: The hidden curriculum refers to…
    options:
      A: Parent-teacher meetings
      B: State standards
      C: The official syllabus
      D: Unofficial norms and values taught alongside academics
    answer: D
    explain: Schools transmit punctuality, obedience, hierarchy implicitly.
    distractors:
      A: Not an academic channel.
      B: Regulatory layer.
      C: That is the formal transcript.
  - q: Teachers told that randomly selected pupils are 'bloomers' give them more feedback; those pupils'
      scores rise by year's end. Which institution-level mechanism, and what does it show about schools?
    options:
      A: Culture lag — grading technology outpaced norms
      B: Tracking — pupils were sorted into ability rooms
      C: The hidden curriculum — pupils learned obedience to teachers
      D: Self-fulfilling prophecy — teacher expectation, not measured ability, moved outcomes
    answer: D
    explain: Rosenthal's design randomised the label, so the only changed input was expectation — the
      school amplified whatever it anticipated.
    distractors:
      A: No technology-norm gap is involved.
      B: No ability grouping occurred — the labels were random.
      C: Obedience norms are implicit teaching, not the mechanism that raised scores here.
- heading: Culture — shared meaning in groups
  objectives:
  - Distinguish ethnocentrism from cultural relativism in a described cross-cultural judgment.
  - Identify cultural capital and code-switching in a described social encounter.
  - Apply culture lag, assimilation, or pluralism to a described change in material life.
  body:
  - ==Culture = symbols, language, values, norms, artifacts; ethnocentrism vs cultural relativism==. Subculture
    vs counterculture; ==culture lag (materials outpace norms), cultural imperialism, assimilation vs
    pluralism==.
  - ==Cultural capital (Bourdieu) — knowledge and tastes that convert into advantage; code-switching —
    performing the right register per context; socialization transmits it across generations==.
  check:
  - q: A first-generation college student learns the unspoken etiquette of faculty meetings to navigate
      them. This is…
    options:
      A: Anomie
      B: Culture lag
      C: Cultural capital acquisition
      D: Assimilation pressure
    answer: C
    explain: Learning high-status knowledge and practice that pays off.
    distractors:
      A: Normative confusion.
      B: A norm-technology gap.
      D: Full identity replacement.
  - q: A firm's hiring panel rewards candidates who discuss sailing and classical music — knowledge unrelated
      to the job. Applicants from families without that exposure lose out. Which concept, and what does
      it convert into?
    options:
      A: Culture lag — interview norms trail technology
      B: Assimilation — applicants must abandon their home culture entirely
      C: Cultural capital — tastes and knowledge convert into hiring advantage
      D: Counterculture — the panel rejects mainstream values
    answer: C
    explain: 'Bourdieu: inherited familiarity with high-status culture functions as capital and reproduces
      advantage without any job relevance.'
    distractors:
      A: Nothing about material change outrunning norms.
      B: Assimilation describes a group adopting majority norms, not a hiring mechanism.
      D: The panel enforces dominant taste, not opposition to it.
  figures:
  - src: behavioral-social/fc9-cultural-and-social-differences/fig-4e6565f8.webp
    caption: The ribbon as a shared symbol — meaning carried by the health-awareness campaign.
    credit: Ch 19 · OpenStax Introduction to Sociology 3e — CC BY-NC-SA 4.0
  - src: behavioral-social/fc9-cultural-and-social-differences/fig-2cba6a31.webp
    caption: Judo as cultural practice — sport encodes values, rules, and ritual.
    credit: Ch 3 · OpenStax Introduction to Sociology 3e — CC BY-NC-SA 4.0
- heading: Deviance and social control
  objectives:
  - Classify a described act into Merton's five adaptations by what happened to goals and means.
  - Distinguish formal from informal social control in a described sanction.
  - Explain a described behavior through labeling theory or medicalization.
  body:
  - ==Strain theory (Merton) — gaps between goals and means push adaptation (conformity, innovation, ritualism,
    retreatism, rebellion)==. Labeling (Becker) — deviance is a label with career effects. ==Control theory
    — bonds constrain; social disorganization explains neighborhood-level crime==.
  - ==Social control — formal (laws, police) vs informal (gossip, shunning); medicalization of deviance
    — addiction, obesity reframed as illness==. Stigma (Goffman) — spoiled identity attached and its effects
    on access and health.
  check:
  - q: A poor student sells drugs to fund college since legitimate means fail. Merton would classify this
      as…
    options:
      A: Conformity
      B: Retreatism
      C: Innovation
      D: Ritualism
    answer: C
    explain: Accepting goals, substituting illegitimate means.
    distractors:
      A: Same goals and means.
      B: Rejecting both.
      C: Correct.
      D: Dropping goals, keeping routine.
  - q: An employee keeps filing reports exactly as required, long after admitting to herself that the
      promotion she was promised will never come. She has dropped the goal but kept the routine. Which
      Merton adaptation?
    options:
      A: Innovation — goals kept, means substituted
      B: Ritualism — means kept, goal abandoned
      C: Retreatism — both goal and means rejected
      D: Conformity — both goal and means accepted
    answer: B
    explain: 'Ritualism is the going-through-the-motions response: the rules are followed and the ambition
      is gone.'
    distractors:
      A: Innovation keeps the goal and swaps in illegitimate means.
      C: Retreatism drops the routine as well — the employee still files everything.
      D: Conformity retains both the goal and belief in reaching it.
- heading: Social stratification and mobility
  objectives:
  - Separate absolute from relative mobility, and intragenerational from intergenerational mobility, in
    a described case.
  - Apply Weber's class, status, and party dimensions to a described position.
  - Explain how credentialing and social closure reproduce inequality without differing test scores.
  body:
  - ==Stratification dimensions — class, status, power (Weber); Marx — ownership of production.== Closed
    (caste) vs open (class) systems; ==reproduction of inequality — credentialing, social closure, intergenerational
    transmission of wealth==.
  - ==Mobility — absolute vs relative; intragenerational vs intergenerational; meritocracy myth vs opportunity
    structure==. Health disparities track stratification directly — status syndrome (Marmot).
  check:
  - q: Two children with identical test scores but different family wealth end up in different income
      brackets. This illustrates…
    options:
      A: Absolute mobility
      B: Meritocracy working perfectly
      C: Reproduction of inequality via non-merit channels
      D: Genetic determinism
    answer: C
    explain: Outcomes track origin beyond ability — structural channels.
    distractors:
      A: That is growth across generations, not inequity.
      B: No.
      C: Correct.
      D: No genetic claim.
  - q: A nurse becomes a hospital director — a big rise within her working life. Her daughter then starts
      from that director's salary rather than from nursing school. Which two mobility types are these?
    options:
      A: Both are intergenerational mobility
      B: Intragenerational for the nurse, intergenerational for the daughter
      C: Both are absolute mobility
      D: Horizontal mobility for the nurse, vertical for the daughter
    answer: B
    explain: Within-one-career movement is intragenerational; movement measured across parent and child
      is intergenerational.
    distractors:
      A: The nurse's rise happened inside her own career.
      C: Absolute mobility concerns overall growth of the distribution, not these two linked cases.
      D: The nurse's move changed rank — that is vertical, not horizontal.
- heading: Demographic and health population patterns
  objectives:
  - Place a described country in a demographic transition stage from its birth and death rate pattern.
  - Compute the prevalence-incidence-duration relation for a described condition.
  - Distinguish lead-time and length-time bias in a described screening program.
  body:
  - ==Demographic transition — stage 1 (both high), 2 (deaths fall, boom), 3 (fertility falls), 4 (both
    low)==. Pyramids encode history. Migration — push/pull, chain, remittances.
  - ==Epidemiological transition — infectious dominance to chronic disease dominance; base rates, incidence
    vs prevalence; SES gradients in mortality; screening effects (lead-time, length time)==.
  check:
  - q: A disease's prevalence is high while incidence is low. This combination suggests…
    options:
      A: A rapidly spreading new outbreak
      B: A long-duration condition
      C: A short acute illness
      D: Data error
    answer: B
    explain: Prevalence = incidence x duration — long duration keeps numbers high despite few new cases.
    distractors:
      A: That raises incidence.
      B: Correct.
      C: Short duration lowers prevalence.
      D: Consistent with chronic disease.
  - q: A new therapy does not prevent a disease but keeps patients alive far longer. What happens to incidence
      and prevalence?
    options:
      A: Incidence rises, prevalence falls
      B: Incidence unchanged, prevalence rises
      C: Both fall
      D: Incidence falls, prevalence unchanged
    answer: B
    explain: New cases per year are untouched, but each case persists longer, so the number living with
      the disease at any time grows.
    distractors:
      A: Nothing changes who develops the disease.
      C: Neither the rate of new cases nor duration falls.
      D: Only duration changed, and prevalence follows duration upward.
examples:
- prompt: A hospital's discharge planning assumes single-family caregivers. Multicultural families send
    children abroad and rely on community elders. Explain the institutional mismatch and a culturally
    humble fix.
  strategy: Read the policy as culture made institutional. Ask what template of family the protocol silently
    encodes, name the mismatch as a structural conflict rather than family noncompliance, then design
    a fix that changes the institution instead of the household.
  solution:
  - The assumption encodes one cultural template of caregiving.
  - Mismatch — compliance metrics punish families who 'deviate'.
  - '=> conflict/structural reading: norms favor majority family forms.'
  - Fix — family-defined care plans, cultural navigators, flexible discharge criteria.
  answer: Institutional culture clashes with plural family realities — responsive design fixes it.
  discussion: 'The move generalises to any access problem: when outcomes differ by group, ask first what
    default the system assumed. The same reasoning covers clinic hours that assume daytime availability,
    forms printed in one language, and referral paths that assume car ownership. Structural competence
    — redesigning the system — outperforms cultural competence training aimed only at attitudes.'
  distractors:
    A: Blame-the-family — repeats the bias.
    B: Universal protocols without localization — enacts the problem.
    C: Cultural relativism doesn't excuse clinical standards — this is about access design.
  practice:
    q: A clinic's reminder system calls patients only on weekday mornings and labels repeated non-attendance
      as 'noncompliant'. Shift workers miss most appointments. Which reading and fix follow?
    options:
      A: Patient education — teach patients to keep morning appointments
      B: Ethnocentrism — require patients to adopt clinic norms
      C: Structural mismatch — the protocol encodes a nine-to-five template; add evening and message-based
        reminders
      D: Culture lag — patients' phones outpace clinic policy
    answer: C
    explain: The system's default assumes standard working hours; non-attendance is produced by the design,
      so the design should change.
    distractors:
      A: Education does not touch a scheduling barrier.
      B: Blaming the household repeats the mismatch this chapter warns about.
      D: Culture lag is about material change outpacing norms, not appointment windows.
key_points:
- Institutions reproduce norms AND distribute resources.
- Culture lag — materials outrun norms; cultural capital converts heritage into advantage.
- Merton's adaptations from goal-means gaps.
- Stratification reproduces inequality across generations.
- Demographic transition stages 1-4; pyramidal signature.
- Prevalence = incidence x duration.
mnemonics:
- phrase: Goals kept, means swapped — innovation
  means: Merton's adaptation map in one line.
- phrase: Chronic = long duration, prevalence high
  means: The prevalence-incidence link.
maps:
- title: Merton's adaptations
  steps:
  - conformity — goals + means
  - innovation — goals, new means
  - ritualism — means, dropped goals
  - retreatism — reject both; rebellion — replace both
- title: Demographic transition
  steps:
  - stage 1 — CBR, CDR high, flat
  - stage 2 — CDR falls, boom
  - stage 3 — CBR falls, cool
  - stage 4 — both low, stable
passage:
  text: In a cohort study, adults living in neighborhoods with high walkability and green space had lower
    all-cause mortality over 15 years, net of individual income, education, and baseline health. A second
    analysis shows neighborhoods retain obesity gradients even after controlling for household SES.
  questions:
  - q: The walkability finding suggests…
    options:
      A: Access has no effect
      B: Genes cause walkability
      C: Hospitals cause mortality
      D: Neighborhood structure shapes health independent of individual SES
    answer: D
    explain: Controlled individual factors — place effects remain.
    distractors:
      A: The analysis says otherwise.
      B: No genetic data.
      C: Hospitals not the exposure.
      D: Correct.
  - q: The persistence of obesity gradients after SES controls supports…
    options:
      A: Measurement failure
      B: Pure genetics
      C: Random chance
      D: Life-course and built-environment mechanisms
    answer: D
    explain: Repeated exposure to structure accumulates advantage or disadvantage.
    distractors:
      A: Consistent across analyses.
      B: No heritability estimate.
      C: Controlled designs argue against.
  - q: Which design test would most directly support a causal neighborhood effect?
    options:
      A: Moving-to-opportunity style assignment
      B: Cross-sectional survey
      C: Opinion poll
      D: Case report
    answer: A
    explain: Randomized relocation varies the exposure cleanly.
    distractors:
      B: Correlational only.
      C: No exposure variation.
      D: Single case, no control.
pitfalls:
- Ethnocentrism vs relativism — again.
- Merton's adaptation names swapped.
- Prevalence vs incidence arithmetic.
- Relative vs absolute mobility — same ladder, different steps.
- Culture lag vs diffusion.
