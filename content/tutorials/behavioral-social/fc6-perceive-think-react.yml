review_questions:
- q: Parkinson's disease primarily involves…
  options:
    A: Serotonin loss
    B: Dopamine loss in the basal ganglia
    C: GABA excess
    D: Acetylcholine excess
  answer: B
  explain: Substantia nigra dopamine neurons die — movement initiation fails.
  distractors:
    A: Serotonin loss links to mood, not movement.
    C: GABA excess would sedate, not cause tremor.
    D: Acetylcholine excess is not the Parkinson signature.
- q: The opponent-process theory explains…
  options:
    A: Why we see negative afterimages
    B: How rods work at night
    C: Depth cues
    D: Sound localization
  answer: A
  explain: Color pairs (red-green, blue-yellow) — adapting one member leaves the afterimage.
  distractors:
    A: Correct.
    B: Trichromatic covers cones.
    C: Not its domain.
    D: Auditory, not visual.
- q: Freud's dream theory is called…
  options:
    A: Activation-synthesis
    B: Wish fulfillment
    C: Cognitive processing
    D: REM rebound
  answer: B
  explain: Dreams satisfy disguised unconscious wishes.
  distractors:
    A: That is Hobson's.
    B: Correct.
    C: That is a cognitive account.
    D: A rebound phenomenon.
- q: Learned helplessness is best modeled by…
  options:
    A: Reinforced behaviors
    B: Uncontrollable shocks teaching passivity
    C: Punishment schedules
    D: Classical conditioning of taste
  answer: B
  explain: Seligman — control loss generalizes into hopelessness.
  distractors:
    A: Operant shaping.
    B: Correct.
    C: Punishment suppresses, does not silence initiative.
    D: Taste aversion is different.
