subject: behavioral-social
chapter: FC6 · Perceive, think, react
title: FC6 · Perceive, Think, React
overview: Biological bases of behavior — neurotransmitters, brain organization, sensation and perception,
  cognition-consciousness, and the physiology of response. The 'react' side covers the stress response
  and emotion. Deep overlap with psychology chapters 3A and 6A-6C.
sections:
- heading: Neurotransmitters and synaptic transmission
  objectives:
  - Trace the neurotransmitter lifecycle — synthesis, storage, release, binding, reuptake, degradation
    — and place a named drug at its step.
  - Match each major transmitter (acetylcholine, dopamine, serotonin, GABA, glutamate, norepinephrine)
    to its behavioral role and its signature loss or excess.
  body:
  - 'Transmission — action potential arrives at the terminal, vesicles fuse, neurotransmitter crosses
    the cleft, binds receptors on the postsynaptic cell. ==Lifecycle: synthesis, storage, release, binding,
    reuptake or enzymatic degradation== — every drug acts at one of these steps.'
  - '==Key transmitters: acetylcholine (muscle, memory — Alzheimer''s losses), dopamine (reward, movement
    — Parkinson''s losses; psychosis excess), serotonin (mood, sleep), GABA (main inhibition — benzodiazepines
    boost it), glutamate (main excitation), norepinephrine (alertness)==. Endorphins — pain modulation.'
  check:
  - q: Benzodiazepines reduce anxiety by…
    options:
      A: Blocking reuptake of serotonin
      B: Increasing glutamate
      C: Enhancing GABA-mediated inhibition
      D: Blocking dopamine receptors
    answer: C
    explain: They bind the GABA-A receptor and increase chloride influx — inhibition down.
    distractors:
      A: SSRIs do that.
      B: Opposite direction.
      D: That is antipsychotics.
  - q: A new compound blocks the transporter that clears serotonin from the cleft. Which lifecycle step
      does it hit, and what happens to signaling?
    options:
      A: Storage — less serotonin is packaged into vesicles
      B: Degradation — synaptic enzymes are inhibited
      C: Binding — postsynaptic receptors lose affinity
      D: Reuptake — serotonin lingers in the synapse and binding is prolonged
    answer: D
    explain: Blocking the transporter removes the normal clearance route, so serotonin stays active in
      the cleft — the SSRI logic.
    distractors:
      A: Storage blockers act inside the terminal on vesicle packaging, not at the membrane transporter.
      B: Enzymatic degradation inhibitors (MAOIs) work inside the terminal; this drug acts at the cleft
        surface.
      C: Receptor affinity is untouched — only the removal of transmitter is slowed.
- heading: Sensation and perception — getting the world in
  objectives:
  - Label a described case as a sensation (transduction) failure or a perception (interpretation) failure.
  - Classify a described grouping or completion as the correct Gestalt principle.
  - Distinguish rod-based from cone-based vision in a dim-light or color scenario.
  body:
  - ==Sensation = transduction — receptors convert stimuli into neural signals; perception = interpretation==.
    Vision — rods (dim light) vs cones (color, three types); dark adaptation; the trichromatic and opponent-process
    theories; blind spot; ==V1 in occipital cortex==.
  - ==Gestalt principles — proximity, similarity, closure, continuity, figure-ground==. Audition — basilar
    membrane tonotopy; place vs frequency theories; olfaction/gustation are chemical; ==somatosensation
    — gate control of pain==. Perceptual constancies and depth cues (monocular/binocular).
  check:
  - q: Seeing a circle where three dashed arcs nearly meet is…
    options:
      A: Similarity
      B: Figure-ground
      C: Closure
      D: Proximity
    answer: C
    explain: The mind completes the missing piece — Gestalt closure.
    distractors:
      A: Grouping by appearance.
      B: Separating object from background.
      D: Grouping by nearness.
  - q: A driver with healthy eyes can read road signs sharply but cannot judge whether a shape far ahead
      is a parked truck or a bush until very close. Where is the failure, and which cue family was lost?
    options:
      A: Transduction in the receptors; absolute threshold
      B: Perception; monocular depth cues such as relative size
      C: Sensation; cone saturation in bright light
      D: Perception; opponent-process color coding
    answer: B
    explain: Acuity is intact, so sensation works; the missing judgment is depth from a static monocular
      cue — relative size and texture gradient.
    distractors:
      A: The receptors transduce fine — signs read clearly.
      C: Cone saturation would blur color and detail, not distance.
      D: Opponent processing explains afterimages, not range judgment.
  figures:
  - src: behavioral-social/fc6-perceive-think-react/muller-lyer.webp
    caption: The Müller-Lyer illusion — the mind's depth cues override equal line lengths.
    credit: Ch 5 · OpenStax Psychology 2e — CC BY-NC-SA 4.0
- heading: Consciousness and its states
  objectives:
  - Sequence NREM 1-3 and REM across a ~90-minute cycle and give the EEG and muscle signature of each.
  - Match a consciousness-altering drug class to its receptor mechanism (GABA agonist, serotonergic, endorphin
    agonist).
  body:
  - ==Sleep stages — NREM 1, 2, 3 (slow wave) and REM (dreaming, atonia, rapid eye movement); the cycle
    repeats ~90 minutes==. Sleep deprivation impairs cognition and immune function; melatonin drives the
    circadian rhythm via the SCN.
  - ==Dream theories — activation-synthesis (random bursts, the cortex weaves a story), Freud's wish fulfillment,
    cognitive processing==. Consciousness-altering drugs — stimulants (agonists), depressants (GABA agonists,
    alcohol), hallucinogens (serotonergic), opiates (endorphin receptor agonists).
  check:
  - q: REM sleep is characterized by…
    options:
      A: Deep non-dreaming rest
      B: Slow-wave EEG
      C: Rapid eye movement and skeletal muscle atonia
      D: No brain activity
    answer: C
    explain: Dreaming accompanies REM; muscles are actively paralyzed.
    distractors:
      A: REM is not NREM 3.
      B: Stage 3 has slow waves.
      C: Correct.
      D: Brain is very active.
  - q: A child is found asleep, confused and hard to rouse, with no dream recall and slow synchronized
      EEG. Which state, and why the confusion?
    options:
      A: REM — dreaming always produces confusion on waking
      B: NREM 1 — theta activity blocks arousal
      C: NREM 3 slow-wave sleep — the deepest arousal threshold
      D: REM atonia — paralysis prevents waking
    answer: C
    explain: Night terrors arise out of stage 3 slow-wave sleep, where the waking threshold is highest
      and dream recall is absent.
    distractors:
      A: REM waking gives vivid dream recall, not amnesia and confusion.
      B: Stage 1 is light sleep — the person rouses easily.
      D: Atonia affects movement during REM, not the depth of arousal threshold.
- heading: Cognition and emotion — thinking makes feeling
  objectives:
  - Name the heuristic or bias operating in a described judgment (availability, representativeness, anchoring,
    confirmation, framing).
  - Predict how a change in appraisal changes the emotion and stress response in Lazarus's model.
  - Distinguish the leptin and ghrelin signals in a described hunger scenario.
  body:
  - '==Heuristics and biases again — availability, representativeness, anchoring, confirmation, framing==.
    Emotional appraisal — Lazarus: how we appraise an event determines the emotion and stress. ==Epigenesis
    — environmental experience alters gene expression through attachment and stress history==.'
  - ==Drive states — hunger (lateral/ventromedial hypothalamus, leptin, ghrelin), thirst, sleep; sex hormones
    organize vs activate behavior==. Emotion-physiology loops — amygdala central, prefrontal regulation,
    HPA axis stress response.
  check:
  - q: Leptin primarily…
    options:
      A: Triggers thirst
      B: Promotes sleep
      C: Stimulates hunger
      D: Signals fat stores to reduce hunger
    answer: D
    explain: Adipose-derived — high levels suppress appetite via the hypothalamus.
    distractors:
      A: Thirst is separate.
      B: Not its signal.
      C: Ghrelin does that.
      D: Correct.
  - q: Two students receive the same B grade. One concludes she is not cut out for medicine; the other
      concludes his study schedule needs restructuring. Same event, different fallout. Which construct
      explains the gap, and what follows for each?
    options:
      A: Reappraisal is impossible after the grade is given
      B: Appraisal — threat versus challenge reading drives stress and the coping path each chooses
      C: Cognitive distortion only for the second student; the first is accurate
      D: Drive reduction — both reduce the same hunger drive
    answer: B
    explain: 'Lazarus: the emotion and stress load come from the appraisal, not the event; the challenge
      reading pushes problem-focused coping, the threat reading pushes withdrawal.'
    distractors:
      A: Reappraisal is precisely the lever — the event is fixed, the reading is not.
      C: The first student's reading is the distorted one; the second is problem-focused.
      D: Drive reduction concerns physiological needs, not the interpretation of a grade.
- heading: Stress and the biology of reaction
  objectives:
  - Trace the HPA axis in order (CRH → ACTH → cortisol) and name each gland's contribution.
  - Assign a described reaction to the fast sympathetic-adrenal channel or the slow HPA channel by its
    timing.
  - Classify a described coping effort as problem-focused or emotion-focused.
  body:
  - ==HPA axis — hypothalamus releases CRH, pituitary ACTH, adrenal cortex cortisol; SNS gives the quick
    adrenaline response==. Chronic stress — cortisol drives immune suppression, hippocampal atrophy risk,
    cardiovascular strain.
  - ==Coping — problem-focused vs emotion-focused; social support buffers; appraisal again moderates every
    link==. Learned helplessness (Seligman) — uncontrollable events teach passivity — the clinical model
    for depression.
  check:
  - q: The FAST initial reaction to a threat is…
    options:
      A: ACTH from the pituitary
      B: Cortisol release
      C: Serotonin reuptake
      D: Epinephrine via the sympathetic system
    answer: D
    explain: Sympathetic-adrenal-medullary axis — seconds; cortisol takes minutes.
    distractors:
      A: HPA step.
      B: The slow HPA path.
      C: Not a stress channel.
  - q: Seconds after a near-collision a driver's heart pounds and her mouth goes dry; twenty minutes later
      she feels shaky and drained. Match each phase to its channel.
    options:
      A: Both phases are cortisol driven
      B: First phase sympathetic epinephrine; second phase HPA cortisol
      C: First phase HPA cortisol; second phase sympathetic epinephrine
      D: Both phases are ACTH driven
    answer: B
    explain: The immediate fight-or-flight surge is sympathetic-adrenal-medullary (seconds); the hormonal
      cortisol cascade trails by minutes.
    distractors:
      A: Cortisol cannot arrive in seconds — the cascade has three glands to traverse.
      C: The order is reversed — cortisol is the slow arm.
      D: ACTH is an intermediate HPA step, not the fast arm.
  figures:
  - src: behavioral-social/fc6-perceive-think-react/fig-b561c8c9.webp
    caption: The autonomic nervous system — sympathetic emergency mobilization versus parasympathetic
      rest-and-digest.
    credit: Ch 3 · OpenStax Psychology 2e — CC BY-NC-SA 4.0
examples:
- prompt: A patient with a tumor compressing his left optic nerve loses vision in the LEFT eye only. In
    which region does the crossover explain why right-eye vision is spared?
  strategy: Localize before naming. Lay the pathway out — retina, optic nerve, chiasm, tract, LGN, V1
    — and ask what each lesion candidate would take. The chiasm is the only place the two eyes' fibers
    mix, so a deficit confined to one eye must sit upstream of it.
  solution:
  - Optic nerves from both eyes join at the optic chiasm.
  - Some fibers cross — temporal fibers stay ipsilateral, nasal fibers cross.
  - A pre-chiasm left optic nerve lesion blocks all signals from the left eye — right eye unaffected.
  - Post-chiasm lesions cause hemifield loss in BOTH eyes — not seen here.
  answer: The lesion must be PRE-chiasm (left optic nerve) — fibers from the right eye still reach the
    brain.
  discussion: 'The same localization logic reads every visual-field vignette: a chiasm lesion pressed
    from below (pituitary) takes the crossing nasal fibers and gives bitemporal hemianopia; anything past
    the chiasm takes one field from both eyes; a purely retinal or receptor disease degrades the eye''s
    own function rather than a field. Contrast with the cortical case — V1 damage preserves the eyes and
    destroys a half-world.'
  distractors:
    A: Post-chiasm — would cut both eyes' visual fields.
    B: Optic tract — same bilateral loss pattern.
    C: Occipital cortex — bilateral half-fields, not one eye.
  practice:
    q: A pituitary adenoma grows upward and presses on the optic chiasm from below. Which visual loss
      follows?
    options:
      A: Total blindness of the left eye
      B: A central blind spot in the right eye only
      C: Loss of the temporal (outer) half of each visual field
      D: Loss of the nasal half of each visual field
    answer: C
    explain: Compression at the chiasm severs the crossing nasal retinal fibers, which carry the temporal
      fields of both eyes — bitemporal hemianopia.
    distractors:
      A: One-eye total loss requires a pre-chiasm optic nerve lesion.
      B: Scotomas come from retinal or cortical damage, not chiasm compression.
      D: The crossed fibers serve the temporal fields, not the nasal fields.
key_points:
- Neurotransmitter lifecycle — drugs act at synthesis, release, binding, reuptake, degradation.
- GABA-inhibits / glutamate-excites; dopamine reward-movement.
- Sensation transduces; perception interprets; Gestalt rules.
- 'REM: dreaming with muscle atonia; ~90 min cycles.'
- HPA (slow cortisol) vs SNS (fast epinephrine) stress channels.
- Appraisal mediates emotion and stress severity.
mnemonics:
- phrase: Slow cortisol, fast adrenaline
  means: HPA axis vs sympathetic emergency channels.
- phrase: Rods for night, cones for color
  means: Photoreceptor division of labor.
maps:
- title: Visual pathway
  steps:
  - retina — rods/cones transduce
  - optic nerve exits eye
  - chiasm — nasal fibers cross
  - LGN then V1 occipital
- title: HPA axis
  steps:
  - hypothalamus — CRH
  - pituitary — ACTH
  - adrenal cortex — cortisol
  - targets — metabolism, immune, brain
passage:
  text: A study divides participants into a stress group (public-speaking task) and a control group. Salivary
    cortisol peaks ~20 minutes after task onset in the stress group. A second group receives oxytocin
    nasal spray before the task; their cortisol peak is blunted and self-reported anxiety drops.
  questions:
  - q: Cortisol peaking 20 minutes after onset, not seconds, is consistent with…
    options:
      A: The HPA axis pathway
      B: The sympathetic-adrenal pathway
      C: Direct neural transmission
      D: Reflex arc activity
    answer: A
    explain: Cortisol is the slow hormonal cascade — CRH, ACTH, then adrenal cortex.
    distractors:
      B: That is epinephrine, seconds.
      C: Neurotransmission is millisecond.
      D: No spinal reflex here.
  - q: Oxytocin blunting the cortisol response suggests it modulates…
    options:
      A: The stress response via social affiliation mechanisms
      B: Basal metabolic rate
      C: Sensory thresholds
      D: Motor planning
    answer: A
    explain: Oxytocin is the social-bonding peptide and dampens HPA reactivity.
    distractors:
      A: Correct.
      B: Thyroid hormones do.
      C: Not its target.
      D: Not its role.
  - q: Which finding would most challenge the study's internal validity?
    options:
      A: A large sample size
      B: High statistical significance
      C: Replication with a longer task
      D: The stress group knowing whether they received oxytocin or placebo
    answer: D
    explain: Expectation effects contaminate the manipulation — demand characteristics.
    distractors:
      A: Power, not validity.
      B: Significance is downstream.
      C: That tests external validity.
      D: Correct.
pitfalls:
- HPA vs SNS timing — seconds vs minutes.
- Confusing rods and cones roles.
- Gestalt principles swapped.
- REM as 'light' sleep — it is an active state.
- Drug class by receptor (GABA-agonist vs blocker).
