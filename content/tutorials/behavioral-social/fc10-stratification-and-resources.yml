review_questions:
- q: Absolute poverty is…
  options:
    A: A threshold of minimal living standards
    B: Relative to national medians
    C: Always worse than relative
    D: About inequality alone
  answer: A
  explain: A fixed material floor — calories, shelter, basics.
  distractors:
    A: Correct.
    B: That is relative.
    C: Both are severe in different ways.
    D: Absolute is about floors, not spread.
- q: Occupational segregation by gender refers to…
  options:
    A: Different jobs available by sex systematically
    B: Random job patterns
    C: Physical strength differences
    D: Legal quotas only
  answer: A
  explain: Structured channeling into different labor markets.
  distractors:
    A: Correct.
    B: Systematic, not random.
    C: Strength explains little of the channeling.
    D: Norms and penalties, not quotas.
- q: A 60-year-old's hypertension could be aging OR cohort…
  options:
    A: Longitudinal data disambiguates
    B: Cross-sectional data answers it
    C: No design can
    D: Genetics decides
  answer: A
  explain: Following the same people over time separates age from birth-year.
  distractors:
    A: Cross-sections conflate them.
    B: Longitudinal does.
    C: Cohort confounds persist.
- q: Medicaid expansion reduced uninsured rates. This is an…
  options:
    A: Access improvement
    B: Quality improvement
    C: Genomic intervention
    D: Cultural intervention
  answer: A
  explain: Insurance coverage is an access mechanism.
  distractors:
    A: Quality is separate.
    B: No genetics.
    C: Not cultural.
