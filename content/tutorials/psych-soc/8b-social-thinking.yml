subject: psych-soc
chapter: 8B · Social thinking
title: 8B · Social thinking
overview: 8B is how we think ABOUT people — impression formation, stereotypes and automaticity, attribution
  depth, judgment shortcuts. Prerequisites — 7B, 8A.
sections:
- heading: Impression formation
  objectives:
  - Identify primacy effects and central traits in a described impression shift.
  - Name the halo effect when one trait fills in unrelated ones.
  - Explain how priming biases interpretation of an ambiguous behavior.
  body:
  - Asch's experiments found primacy effects — early traits (warm/cold) recolor everything after; central
    traits outweigh peripheral. Implicit personality theory fills gaps (attractive → good — the halo effect).
    Priming biases ambiguous-behavior interpretation automatically.
  check:
  - q: Hearing intelligent-cold-industrious versus intelligent-warm-industrious produces very different
      impressions. This demonstrates…
    options:
      A: Mere exposure
      B: Self-fulfilling prophecy
      C: Central-trait effects
      D: Recency effect
    answer: C
    explain: Warm-cold reconfigures all other information.
    distractors:
      A: Familiarity.
      B: Expectation changing BEHAVIOR.
      D: Late info dominating — reversed.
  - q: An interviewer finds a candidate attractive and then rates his unrelated technical answers as stronger
      than the tape shows. Which effect, and which trap does it create for hiring?
    options:
      A: Recency effect — the last answers dominated
      B: Halo effect — one salient trait (attractiveness) colors unrelated judgments
      C: Self-fulfilling prophecy — the candidate changed his behavior
      D: Illusory correlation — two rarities were paired
    answer: B
    explain: Implicit personality theory fills the gaps from a central trait, inflating judgments outside
      its scope.
    distractors:
      A: Nothing indicates late information dominated.
      C: The candidate's actual answers did not change — the ratings did.
      D: No distinctive-rarity pairing is described.
  figures:
  - src: 8b-social-thinking/fig-195a9b26.webp
    caption: Personality assessment — trait models and individual differences in social cognition.
    credit: Fig 11.2 · OpenStax Psychology 2e — CC BY-NC-SA 4.0
- heading: Stereotypes — automatic and controlled
  objectives:
  - Sort a described case into stereotype (cognition), prejudice (affect), or discrimination (behavior).
  - Describe the dual-process account — automatic activation with effortful override at cognitive cost.
  - State what an IAT latency index measures and one critique of its use.
  body:
  - Stereotype (cognitive schema), prejudice (affective), discrimination (behavioral) — keep the three
    levels separate. Dual-process — stereotypes activate automatically; controlled processing can override
    at cognitive cost. The IAT — latency pairings index automatic associations; know its critiques.
  check:
  - q: An employer holds no explicit bias yet micro-hesitates with certain names. The automatic layer
      is measured by…
    options:
      A: Reference checks
      B: Self-report survey
      C: IAT-style latency tasks
      D: Intelligence testing
    answer: C
    explain: Reaction-time pairings index automatic associations.
    distractors:
      A: History, not association.
      B: Explicit misses automatic.
      D: Unrelated.
  - q: A hiring manager feels uneasy about an applicant group, writes equal-scoring CVs, but schedules
      fewer interviews with them. Identify all three levels in order.
    options:
      A: Stereotype, prejudice, discrimination — schema, affect, and differential behavior
      B: Prejudice only — no behavior changed
      C: Discrimination only — the feeling is irrelevant
      D: Institutional discrimination without any individual component
    answer: A
    explain: The three-layer model requires cognition, affect, and behavior — here all three are present
      in sequence.
    distractors:
      B: Interview scheduling is a behavioral change.
      C: The unease is the affective layer and the schema behind it is cognitive.
      D: Individual-level mechanisms are all present; the institutional label adds nothing here.
  figures:
  - src: 8b-social-thinking/fig-a14732df.webp
    caption: Phrenology — the discredited practice of reading personality from skull shape; an early lesson
      in how easily trait inferences outpace evidence.
    credit: OpenStax Psychology 2e (history of personality assessment) — CC BY-NC-SA 4.0
- heading: Attribution in depth — covariation
  objectives:
  - Apply Kelley's consensus, distinctiveness, and consistency to reach a situational or dispositional
    verdict.
  - Read a described data table into the correct covariation conclusion.
  - Distinguish Kelley's model from the fundamental attribution error as accounts of the same judgment.
  body:
  - Kelley's model — consensus (do others do it?), distinctiveness (only here?), consistency (every time?)
    — high all three → situational; low consensus/distinctiveness with high consistency → dispositional.
    The data table maps onto the verdict.
  check:
  - q: Everyone laughs at this comedian (consensus high), only at comedians (distinctive), every show
      (consistent). The laughing is attributed…
    options:
      A: To coincidence
      B: Dispositionally, to the laughers
      C: To unstable causes
      D: Situationally — something about the stimulus
    answer: D
    explain: High-high-High → external/stimulus attribution.
    distractors:
      A: Not a model term.
      B: Low consensus would support that.
      C: Consistency rules out instability.
  - q: A patient is rude to one nurse only, other patients are polite to that nurse, and the patient is
      rude at every visit. Which verdict, and which cue drove it?
    options:
      A: Dispositional — the patient is rude; low distinctiveness and low consensus with high consistency
      B: Situational — the nurse is provoking it; high consensus and high distinctiveness
      C: Unstable coincidence; consistency was low
      D: Fundamental attribution error; the observer over-credited the patient
    answer: A
    explain: Only-this-person-here (low distinctiveness), others-do-not (low consensus), and always (high
      consistency) resolves to the person.
    distractors:
      B: That pattern would require high consensus and high distinctiveness — the opposite of the data.
      C: High consistency across visits rules out an unstable cause.
      D: The covariation data supports the dispositional call; the error term does not apply.
- heading: Judgment shortcuts
  objectives:
  - Name the heuristic behind a described frequency or category judgment.
  - Explain base-rate neglect and apply the base rate to override a vivid description.
  - Define illusory correlation and show how it manufactures a stereotype from paired rarities.
  body:
  - Availability drives stereotype-consistent frequency estimates; representativeness drives base-rate
    neglect (librarian/farmer); anchoring taints judgments. Illusory correlation — over-pairing two rarities
    — mints stereotypes from thin air.
  check:
  - q: An observer notices misbehavior clustering in a small group because both are distinctive. This
      is…
    options:
      A: Valid correlation
      B: Self-fulfilling prophecy
      C: Illusory correlation
      D: In-group favoritism
    answer: C
    explain: Two salient rarities pair in memory beyond their true rate.
    distractors:
      A: No real covariation established.
      B: Expectancy altering behavior.
      D: Allocation bias.
  - q: A hospital records a cluster of a rare rash in a small minority population and staff begin to over-associate
      the two, although the true co-occurrence rate is unchanged. Which mechanism, and why does the pairing
      stick in memory?
    options:
      A: Valid covariation — the data support the link
      B: Illusory correlation — two distinctive stimuli are encoded together and over-retrieved
      C: Self-fulfilling prophecy — expectations changed the patients' behavior
      D: Availability heuristic for a common event
    answer: B
    explain: Distinctive pairs (two rare things co-occurring) are disproportionately encoded and retrieved,
      producing correlation without covariation.
    distractors:
      A: The co-occurrence rate is explicitly unchanged.
      C: No expectation altered patient behavior — only staff memory did.
      D: The event is rare, which is exactly what drives the effect.
examples:
- prompt: The librarian/farmer problem — Tom is withdrawn, meticulous; the pool is 70% farmers. Most judge
    librarian. Diagnose and answer rationally.
  strategy: Separate the diagnostic evidence from the prior. Representativeness judges the description's
    fit to a category; the rational answer weighs that fit against the base rate — a weak likelihood ratio
    cannot overcome a 70% prior.
  solution:
  - Representativeness — the description matches the stereotype.
  - Base-rate neglect — the 70% prior is ignored.
  - The Bayesian answer usually still favors farmer — the prior dominates weak evidence.
  answer: Representativeness + base-rate neglect; the base-rate-dominated estimate favors farmer.
  discussion: 'The general lesson: vivid individuating information arrives with psychological weight out
    of proportion to its evidential value. The correction is mechanical, not intuitive — ask for the prior,
    then ask how much the description actually shifts it. The same structure underlies diagnostic-test
    reasoning, where a low-prevalence disease and a decent sensitivity still yield mostly false positives.'
  distractors:
    A: Endorsing librarian — the heuristic answer itself.
    B: Availability — no recall-frequency shortcut.
    C: Anchoring — no initial value.
  practice:
    q: A screening test detects 90% of cases of a disease with prevalence 1 in 1,000 and has a 5% false-positive
      rate. A random patient tests positive. Most clinicians say the disease is likely. What is the rational
      read?
    options:
      A: The disease is likely — sensitivity dominates
      B: False positives outnumber true positives roughly 50 to 1, so the disease remains unlikely — base
        rate dominates the diagnostic cue
      C: The test is useless and should be discarded
      D: Prevalence is irrelevant once the test result is known
    answer: B
    explain: 'Per 1,000 patients: 0.9 true positives versus about 50 false positives — the prior, not
      the vivid positive result, sets the probability.'
    distractors:
      A: Sensitivity alone cannot establish posterior probability without the base rate.
      C: A test with these properties is still useful as one input; the error is in the interpretation.
      D: Prevalence is precisely what determines the prior odds the test updates.
key_points:
- Primacy and central traits; halo effect fills gaps.
- Stereotype/prejudice/discrimination — cognition/affect/behavior.
- IAT — latency measure with known critiques.
- Kelley — CDC; high all three → situational.
- Illusory correlation mints stereotypes; base rates beat vivid descriptions.
- Automatic activation, controlled override — the IAT measures the gap.
mnemonics:
- phrase: CDC — Consensus, Distinctiveness, Consistency
  means: Kelley's three covariation cues.
- phrase: CDC before you judge
  means: Consensus, Distinctiveness, Consistency — Kelley's covariation.
maps:
- title: Kelley decision
  steps:
  - consensus + distinctiveness + consistency all high → SITUATIONAL
  - consensus low + distinctiveness low + consistency high → DISPOSITIONAL
- title: From schema to judgment
  steps:
  - category activates automatically
  - ambiguous input fits the schema
  - controlled override costs cognition
  - IAT latency reveals the residue
passage:
  text: Participants view an ambiguous shove after subliminal Black or White face primes (Exp 1), or the
    same act described as shoving versus bumping (Exp 2). Black-face primes raise hostility ratings; the
    shoving wording likewise raises them.
  questions:
  - q: Experiment 1 demonstrates…
    options:
      A: Priming's automatic influence on coding
      B: Explicit prejudice
      C: Discrimination in behavior
      D: Base-rate reasoning
    answer: A
    explain: Subliminal activation biased interpretation.
    distractors:
      B: No self-report involved.
      C: Ratings, not treatment.
      D: No frequencies used.
  - q: Experiment 2's wording effect shows…
    options:
      A: Framing changing perception of the same act
      B: Sensory adaptation
      C: Consistency failure
      D: Overjustification
    answer: A
    explain: Identical kinematics, different verb — different hostility.
    distractors:
      B: Receptor-level.
      C: Kelley term.
      D: Motivation theory.
  - q: Which finding would most directly challenge the study's internal validity?
    options:
      A: A large sample size
      B: A replication in a different country
      C: High statistical significance
      D: A confederate accidentally hinting at the expected answer
    answer: D
    explain: A leaked expectation contaminates the manipulation — the effect may reflect demand.
    distractors:
      A: Power, not validity.
      B: That tests external validity.
      C: Significance is downstream of validity.
pitfalls:
- Treating IAT scores as proof of discrimination — contested reliability.
- Fundamental attribution error where Kelley's verdict belongs.
- Illusory correlation confused with self-fulfilling prophecy.
- Forgetting base rates once a vivid description arrives.
