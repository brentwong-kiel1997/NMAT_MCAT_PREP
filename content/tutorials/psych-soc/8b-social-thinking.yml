review_questions:
- q: Prejudice is to discrimination as…
  options:
    A: Thought to feeling
    B: Attitude to behavior
    C: Behavior to attitude
    D: Cognition to affect
  answer: B
  explain: Evaluation held vs. action taken.
  distractors:
    A: Backwards.
    C: Reversed.
    D: Stereotype-to-prejudice, missing behavior.
- q: Ignoring the 70% base rate because a description sounds like a rare category is…
  options:
    A: Availability
    B: Representativeness with base-rate neglect
    C: Anchoring
    D: Confirmation bias
  answer: B
  explain: Similarity swamps the prior.
  distractors:
    A: Recall-ease.
    C: Initial-value adjustment.
    D: Selective search.
- q: Low consensus + low distinctiveness + high consistency yields a dispositional attribution because…
  options:
    A: Few others do it and the person does it everywhere
    B: Everyone does it here only
    C: The act is inconsistent
    D: The stimulus is novel
  answer: A
  explain: The person, not the situation, covaries with the behavior.
  distractors:
    B: That is situational.
    C: Consistency is high.
    D: Not a covariation verdict.
- q: The study's design best exemplifies which research approach?
  options:
    A: Correlational with random sampling
    B: Experimental with a manipulated independent variable
    C: Case study with thick description
    D: Meta-analysis of prior studies
  answer: B
  explain: Conditions are assigned; the IV is the manipulated framing or prime.
  distractors:
    A: No manipulation described.
    C: Single subject.
    D: No pooled analysis.
