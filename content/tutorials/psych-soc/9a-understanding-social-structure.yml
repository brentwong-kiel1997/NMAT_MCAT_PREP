review_questions:
- q: Tension between grading and mentoring duties within one job is…
  options:
    A: Role strain
    B: Role conflict
    C: Status set
    D: Bureaucratization
  answer: A
  explain: Single role, incompatible expectations.
  distractors:
    B: Two roles.
    C: Collection of statuses.
    D: Organizational form.
- q: Who benefits from this arrangement? is the question of…
  options:
    A: Functionalism
    B: Conflict theory
    C: Symbolic interactionism
    D: Exchange theory
  answer: B
  explain: Power and distribution.
  distractors:
    A: What it does.
    C: What it means.
    D: Interpersonal cost-benefit.
- q: Norms carrying strong moral weight are…
  options:
    A: Folkways
    B: Mores
    C: Laws
    D: Fashions
  answer: B
  explain: Mores — moral; laws are codified.
  distractors:
    A: Etiquette-level.
    C: Formally codified.
    D: Fleeting.
- q: The study's design best exemplifies which research approach?
  options:
    A: Correlational with random sampling
    B: Experimental with a manipulated independent variable
    C: Case study with thick description
    D: Meta-analysis of prior studies
  answer: C
  explain: One hospital's single-site observational audit — case study.
  distractors:
    A: No random sampling.
    B: Nothing assigned.
    D: No pooled studies.
