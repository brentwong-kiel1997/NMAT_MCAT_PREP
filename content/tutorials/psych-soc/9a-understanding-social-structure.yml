subject: psych-soc
chapter: 9A · Understanding social structure
title: 9A · Understanding social structure
overview: 9A moves from interaction to structure — institutions, groups, culture organizing life. Sociological
  theory families, components, bureaucracies, culture. Prerequisites — 8A-C.
sections:
- heading: Three lenses on society
  body:
  - Match theory to question — functionalism (what it DOES for society), conflict theory (WHO BENEFITS),
    symbolic interactionism (what it MEANS in interaction). A hospital's function is functionalist; who
    profits from its hierarchy is conflict; how a white coat changes conversation is interactionist.
  check:
  - q: A researcher asks how licensing boards protect quality but also raise barriers. This combines…
    options:
      A: Social exchange alone
      B: Evolutionary psychology alone
      C: Symbolic interactionism alone
      D: Functionalism and conflict theory
    answer: D
    explain: Functions served + distributional consequences — the two lenses.
    distractors:
      A: Interpersonal.
      B: Not sociological three.
      C: Micro-meaning.
  figures:
  - src: 9a-understanding-social-structure/fig-962529d0.webp
    caption: Religious community life moving onto video calls — institutions adapting their routines to
      new technology (a culture-lag moment in real time).
    credit: OpenStax Introduction to Sociology 3e (religion chapter) — CC BY-NC-SA 4.0
- heading: Status, role, groups
  body:
  - Status is a position; role is its expectations — ascribed vs. achieved. Role strain (tension within
    ONE role) versus role conflict (between roles — parent vs. resident on call). Primary groups (family)
    vs. secondary (department); reference groups set adopted standards.
  check:
  - q: A resident must choose between family emergency and on-call duty. This is…
    options:
      A: Groupthink
      B: Role strain
      C: Role conflict
      D: Status inconsistency
    answer: C
    explain: Two roles' demands collide.
    distractors:
      A: Group defect.
      B: Within a single role.
      D: Misaligned ranks.
- heading: Bureaucracy and organizations
  body:
  - Weber's ideal type — hierarchy, written rules, division of labor, impersonality. Predictability as
    function; red tape and goal displacement as pathology (metrics becoming ends). The hidden curriculum
    and institutional discrimination extend to disparities.
  check:
  - q: Dashboard targets drive staff to game wait-time statistics rather than improve care. This is…
    options:
      A: Role exit
      B: Diffusion of responsibility
      C: Ascribed status
      D: Goal displacement
    answer: D
    explain: Means become ends.
    distractors:
      A: Leaving a role.
      B: Bystander mechanism.
      C: Birth-assigned.
  figures:
  - src: 9a-understanding-social-structure/fig-af42b92c.webp
    caption: Formal organizations and bureaucracy — Weber's ideal type and its variations.
    credit: Fig 6.2 · OpenStax Introduction to Sociology 3e — CC BY-NC-SA 4.0
- heading: Culture and institutions
  body:
  - Norms ladder — folkways (etiquette), mores (morality), laws (codified). Culture lag — norms trailing
    technology (genetics outpacing consent). Ethnocentrism vs. cultural relativism; institutions reproduce
    structure across generations.
  check:
  - q: Genetic screening outpaces social norms on privacy. This mismatch is…
    options:
      A: Innovation diffusion
      B: Assimilation
      C: Culture lag
      D: Cultural diffusion
    answer: C
    explain: Material culture changes faster than guiding norms.
    distractors:
      A: Adoption curve.
      B: Minority absorption.
      D: Trait spread.
examples:
- prompt: Analyze a medical school's grading system through all three lenses.
  solution:
  - Functionalist — grading enforces competence standards society needs.
  - Conflict — grading sorts students; class resources navigate the sorting differently.
  - Interactionist — grades become identity markers negotiated in everyday talk.
  answer: Three lenses — standards served, sorting by power, meaning made.
  distractors:
    A: One lens only — the prompt asks for three.
    B: Moralizing instead of analyzing.
    C: Lenses as mutually exclusive.
key_points:
- Three lenses — function, conflict, interactionist.
- Role strain (within) vs. role conflict (between).
- Weber — bureaucracy's strengths and pathologies.
- Culture lag; institutional discrimination through routine.
- Norms ladder — folkways, mores, laws.
- Culture lag — material change outruns norm change.
mnemonics:
- phrase: Function, Fight, Meaning
  means: The three lenses in one word each.
- phrase: What it does, who wins, what it means
  means: Function, conflict, interaction — the three lenses.
maps:
- title: Choosing the lens
  steps:
  - what it DOES → functionalism
  - WHO BENEFITS → conflict theory
  - what it MEANS → interactionism
- title: Choosing the lens
  steps:
  - what it DOES → functionalism
  - WHO BENEFITS → conflict
  - what it MEANS → interactionism
passage:
  text: A hospital institutes a 15-minute triage target. Times fall 40%. Observation shows staff registering
    patients as triaged at the door before assessment on busy days. An audit shows no change in actual
    time-to-assessment.
  questions:
  - q: The timestamp practice is best described as…
    options:
      A: Goal displacement — metric satisfied, function unchanged
      B: Improved care
      C: Role conflict
      D: Cultural diffusion
    answer: A
    explain: The measure became the target and was gamed.
    distractors:
      B: Audit shows no change.
      C: No competing roles.
      D: Unrelated.
  - q: A conflict reading would ask…
    options:
      A: Which groups bear the compliance burden and which gain from reported numbers
      B: What function triage serves
      C: What the timestamp means to nurses
      D: Whether folkways changed
    answer: A
    explain: Distribution of costs and benefits.
    distractors:
      B: Functionalist.
      C: Interactionist.
      D: Cultural question.
  - q: Which finding would most directly challenge the study's internal validity?
    options:
      A: A large sample size
      B: A confederate accidentally hinting at the expected answer
      C: High statistical significance
      D: A replication in a different country
    answer: B
    explain: A leaked expectation contaminates the manipulation — the effect may reflect demand.
    distractors:
      A: Power, not validity.
      C: Significance is downstream of validity.
      D: That tests external validity.
pitfalls:
- One-lens answers to multi-lens prompts.
- Swapping role strain and conflict — count the roles.
- Requiring intent for institutional discrimination — routine suffices.
- Confusing diffusion with culture lag.
