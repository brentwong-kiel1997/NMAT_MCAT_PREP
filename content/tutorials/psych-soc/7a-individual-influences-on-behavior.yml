review_questions:
- q: The Big Five do NOT include…
  options:
    A: Openness
    B: Intelligence
    C: Agreeableness
    D: Neuroticism
  answer: B
  explain: OCEAN — intelligence is not a factor.
  distractors:
    A: Part of OCEAN.
    C: Part of OCEAN.
    D: Part of OCEAN.
- q: I tremble, therefore I am afraid — this states the…
  options:
    A: Cannon-Bard theory
    B: James-Lange theory
    C: Two-factor theory
    D: Yerkes-Dodson law
  answer: B
  explain: Bodily reaction precedes the felt emotion.
  distractors:
    A: Simultaneous.
    C: Requires a cognitive label.
    D: Arousal-performance curve.
- q: Attributing one's own unacceptable anger to a colleague is…
  options:
    A: Displacement
    B: Projection
    C: Sublimation
    D: Repression
  answer: B
  explain: One's own feeling ascribed to another.
  distractors:
    A: Redirecting the ACT.
    C: Channeling into output.
    D: Burying it.
- q: The study's design best exemplifies which research approach?
  options:
    A: Correlational with random sampling
    B: Experimental with a manipulated independent variable
    C: Case study with thick description
    D: Meta-analysis of prior studies
  answer: A
  explain: Caregivers and matched controls are followed without intervention — correlational.
  distractors:
    B: No variable is assigned.
    C: Many subjects, not one.
    D: No pooled analysis.
