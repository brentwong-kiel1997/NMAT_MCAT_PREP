review_questions:
- q: The Big Five do NOT include…
  options:
    A: Openness
    B: Intelligence
    C: Agreeableness
    D: Neuroticism
  answer: B
  explain: OCEAN — intelligence is not a factor.
  distractors:
    A: Part of OCEAN.
    B: Part of OCEAN.
    C: Part of OCEAN.
- q: I tremble, therefore I am afraid — this states the…
  options:
    A: Cannon-Bard theory
    B: James-Lange theory
    C: Two-factor theory
    D: Yerkes-Dodson law
  answer: B
  explain: Bodily reaction precedes the felt emotion.
  distractors:
    A: Simultaneous.
    B: Requires a cognitive label.
    C: Arousal-performance curve.
- q: Attributing one's own unacceptable anger to a colleague is…
  options:
    A: Displacement
    B: Projection
    C: Sublimation
    D: Repression
  answer: B
  explain: One's own feeling ascribed to another.
  distractors:
    A: Redirecting the ACT.
    B: Channeling into output.
    C: Burying it.
- q: The study's design best exemplifies which research approach?
  options:
    A: Correlational with random sampling
    B: Experimental with a manipulated independent variable
    C: Case study with thick description
    D: Meta-analysis of prior studies
  answer: B
  explain: Conditions are assigned; the IV is the manipulated framing or prime.
  distractors:
    A: No manipulation described.
    B: Single subject.
    C: No pooled analysis.
