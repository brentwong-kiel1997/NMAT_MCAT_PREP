review_questions:
- q: Overjustification occurs when…
  options:
    A: Thin justification maximizes dissonance
    B: Effort raises valuation
    C: Authority commands belief
    D: Tangible rewards undermine intrinsic enjoyment
  answer: D
  explain: Reward reframes play as work.
  distractors:
    A: Induced compliance.
    B: Effort justification.
    C: Obedience.
- q: The stages-of-change model's correct order begins…
  options:
    A: Action → precontemplation → maintenance
    B: Precontemplation → contemplation → preparation → action
    C: Maintenance → relapse → action
    D: Contemplation → action → precontemplation
  answer: B
  explain: The canonical forward sequence.
  distractors:
    A: Reordered.
    C: Relapse is a return.
    D: Reordered.
- q: Pairing alcohol with a nausea-inducing drug is…
  options:
    A: Systematic desensitization
    B: Aversive conditioning
    C: Token economy
    D: Modeling
  answer: B
  explain: Unwanted behavior paired with aversive consequence.
  distractors:
    A: Hierarchy + relaxation.
    C: Operant system.
    D: Observational.
- q: The study's design best exemplifies which research approach?
  options:
    A: Correlational with random sampling
    B: Experimental with a manipulated independent variable
    C: Case study with thick description
    D: Meta-analysis of prior studies
  answer: B
  explain: Conditions are assigned; the IV is the manipulated framing or prime.
  distractors:
    A: No manipulation described.
    C: Single subject.
    D: No pooled analysis.
