subject: psych-soc
chapter: 7B · Social processes that influence behavior
title: 7B · Social processes that influence behavior
overview: 7B is social psychology's core — conformity, obedience, group processes, attitude formation.
  The MCAT's most famous experiments and scenario-friendly questions. Prerequisite — 7A.
sections:
- heading: Conformity — yielding to the group
  objectives:
  - Name the influence type (informational or normative) behind a described conforming act.
  - Predict how unanimity, group size, and one dissenting ally move the Asch conformity rate.
  - Distinguish group polarization, groupthink, and deindividuation in a described group episode.
  body:
  - Conformity is changing behavior to match the group. Asch's line experiments — a unanimous majority
    pulls ~75% to err at least once — and moderators are currency — one dissenting ally slashes conformity,
    unanimity and group size (to ~5) drive it. Normative (fit in) versus informational (be right) names
    why.
  - Related — deindividuation (anonymity loosens restraint), group polarization (discussion shifts members
    FURTHER in their initial direction), groupthink (cohesive groups suppress dissent — preventable by
    devil's advocates).
  check:
  - q: A jury leaning mildly toward conviction deliberates and emerges strongly pro-conviction. This is…
    options:
      A: Conformity to a confederate
      B: Social loafing
      C: Group polarization
      D: Deindividuation
    answer: C
    explain: Discussion amplified the initial lean.
    distractors:
      A: No planted majority.
      B: Effort drop — not this.
      D: Anonymity effects, absent.
  - q: In a line-judgment task a participant privately insists the answer is B but publicly says A with
      the group. A second participant then says B, and the participant switches back. Name both phases
      and the influence at work.
    options:
      A: Both phases are informational influence — the participant lacked knowledge
      B: First phase normative influence (public compliance to fit in); the ally's dissent breaks unanimity
        and restores the private answer
      C: Both phases are obedience — the group commanded the answer
      D: Deindividuation — anonymity produced the wrong answer
    answer: B
    explain: Private knowledge with public compliance is normative influence, and it is unanimity — not
      group size — that one ally collapses.
    distractors:
      A: Informational influence requires genuine uncertainty about the answer; she was certain.
      C: No authority gave an order; peers supplied the pressure.
      D: Nothing here hinges on anonymity or loss of self-awareness.
  figures:
  - src: 7b-social-processes-that-influence-behavior/social-roles.webp
    caption: Social roles — the student role dictates studious behavior in the classroom.
    credit: Fig 12.8 · OpenStax Psychology 2e — CC BY-NC-SA 4.0
  - src: 7b-social-processes-that-influence-behavior/social-norms.webp
    caption: Social norms — young people dress alike to fit in with peer groups.
    credit: Fig 12.9 · OpenStax Psychology 2e — CC BY-NC-SA 4.0
- heading: Obedience — authority's pull
  objectives:
  - Predict the Milgram obedience rate's movement when authority proximity, victim proximity, institutional
    setting, or peer dissent changes.
  - Distinguish conformity, compliance, and obedience by the source of the influence.
  - Name the compliance tactic (foot-in-the-door, door-in-the-face) in a described request sequence.
  body:
  - Milgram — ~65% administered maximum shock when an experimenter insisted. Levers — proximity of authority
    (up), proximity of victim (down), institutional setting (up), dissenting peers (sharply down).
  - Distinguish the triad — conformity (peer, implicit), compliance (explicit request — foot-in-door,
    door-in-face), obedience (authority command). The source of influence names the term.
  check:
  - q: A nurse follows a physician's inappropriate verbal order, deferring to rank. This is…
    options:
      A: Social facilitation
      B: Groupthink
      C: Conformity
      D: Obedience to authority
    answer: D
    explain: A direct command from authority.
    distractors:
      A: Performance in mere presence.
      B: Group decision defect.
      C: No group norm — a hierarchy.
  - q: A charity calls asking for a 5,000-peso donation; the caller refuses, then is asked for a 500-peso
      donation and agrees. Which tactic, and why does it work?
    options:
      A: Foot-in-the-door — the small request came first
      B: Door-in-the-face — a large request refused makes the smaller one look like a concession
      C: Obedience — the charity is an authority
      D: Groupthink — the caller conformed to a group norm
    answer: B
    explain: The retreat from an extreme request is read as movement toward the caller, triggering reciprocity
      — the door-in-the-face sequence.
    distractors:
      A: Foot-in-the-door starts small and escalates; the order here is reversed.
      C: No command from a legitimate authority was issued.
      D: No cohesive group suppressed dissent here.
- heading: Attribution, attitudes, persuasion
  objectives:
  - Apply the fundamental attribution error and actor-observer bias to a paired self/other judgment.
  - Classify a persuasion attempt as central or peripheral by elaboration likelihood.
  - Explain a described attitude shift via cognitive dissonance and its justification level.
  body:
  - Attribution — dispositional versus situational — with the fundamental attribution error (overweighting
    disposition judging OTHERS) and actor-observer bias (we excuse ourselves situationally). Culture modulates
    it.
  - Attitudes via central route (arguments, durable) versus peripheral (cues, transient). Cognitive dissonance
    (Festinger — thin justification maximizes attitude change).
  check:
  - q: A driver cuts you off — reckless jerk! — yet when YOU cut someone off it was a blind spot. This
      illustrates…
    options:
      A: Self-serving bias only
      B: The actor-observer bias
      C: Groupthink
      D: Central-route persuasion
    answer: B
    explain: Situational excuses for self, dispositional blame for others.
    distractors:
      A: Related but the two-sided pattern is the signature.
      C: Group process.
      D: Persuasion model.
  - q: A manager explains a subordinate's missed deadline as 'lazy' and her own missed deadline as 'the
      system was down'. Which pair of effects, and which correction would help the first judgment?
    options:
      A: Self-serving bias twice; correction is more praise
      B: Fundamental attribution error for the subordinate, actor-observer bias for herself; correction
        is Kelley's covariation check — consensus, distinctiveness, consistency
      C: Groupthink and deindividuation; correction is an anonymous vote
      D: Peripheral-route persuasion; correction is a central-route argument
    answer: B
    explain: Dispositional blame for others plus situational excuse for self is the classic asymmetry,
      and covariation data is the standard antidote.
    distractors:
      A: The self-serving bias concerns her own outcomes; the subordinate's case is judged dispositionally.
      C: No group decision or anonymity is involved.
      D: No persuasive message is being evaluated.
- heading: Social facilitation and social loafing — audience effects
  objectives:
  - Classify a described performance change as social facilitation (arousal on individual tasks) or social
    loafing (accountability in groups).
  - Predict facilitation's direction from task complexity — simple improves, complex degrades.
  - Design the accountability fix for a described loafing case.
  body:
  - The mere presence of others changes performance — **social facilitation** (better on simple or well-learned
    tasks, worse on complex or novel ones — Zajonc's arousal account) and **social loafing** (LESS effort
    on group tasks when individual contribution is unidentifiable — pulling a rope in a group). The pair
    looks contradictory but is not — facilitation is about arousal on individual performance; loafing
    is about accountability in collective output.
  - The application matters for medical teams — a well-rehearsed surgical checklist benefits from an audience;
    a novel complex decision degrades. Loafing is why group notes are thinner than individual ones — identifiability
    is the fix.
  check:
  - q: A runner sprints faster with spectators; a brainstorming group produces fewer ideas per person
      than working alone. These are respectively…
    options:
      A: Both loafing
      B: Social loafing and facilitation
      C: Both facilitation
      D: Social facilitation and social loafing
    answer: D
    explain: Arousal on individual performance vs. effort-drop in unidentifiable groups.
    distractors:
      A: The sprint shows facilitation.
      B: Reversed.
      C: The group task shows loafing.
  - q: An experienced pianist plays a rehearsed piece better in front of an audience, but stumbles on
      sight-reading. Name both effects and the mechanism that explains the split.
    options:
      A: Both are social loafing — the audience reduced effort
      B: Social facilitation via Zajonc's arousal account — arousal strengthens the dominant response,
        helping the well-learned piece and hurting the novel one
      C: Deindividuation — anonymity changed the performance
      D: Social loafing for the sight-reading only
    answer: B
    explain: Arousal biases execution toward dominant responses, which is exactly why mastery benefits
      and novelty suffers under observation.
    distractors:
      A: Loafing concerns effort in collective tasks; the pianist performs alone.
      C: Nothing here depends on anonymity or lost self-awareness.
      D: The sight-reading decline is arousal on a complex task, not effort loss in a group.
examples:
- prompt: Festinger's design — participants paid $1 or $20 to tell a peer a boring task was fun. Predict
    the attitude change.
  strategy: Compute the justification balance before predicting the attitude. Attitude change is the leftover
    after external justification is subtracted from the counter-attitudinal act — so the smaller the payment,
    the larger the internal shift required.
  solution:
  - All said the task was fun; behavior contradicts the private belief.
  - $20 is sufficient justification — no dissonance to resolve.
  - $1 is insufficient — dissonance resolved by shifting the private attitude.
  answer: The $1 group shows GREATER attitude change — insufficient justification maximizes dissonance.
  discussion: 'The same arithmetic explains effort justification and the overjustification effect in reverse:
    when external reasons are too LARGE they crowd out intrinsic motivation, and when too small the attitude
    moves to close the gap. Whenever a vignette pairs a behavior with its justification, ask whether the
    justification is thin, sufficient, or excessive.'
  distractors:
    A: More pay → more change — reverses the logic.
    B: Both equal — ignores justification size.
    C: Obedience — no authority commanded belief.
  practice:
    q: A student who secretly found a workshop dull tells incoming students it was excellent. One group
      was given course credit worth little; another was paid generously. Which group later rates the workshop
      best, and why?
    options:
      A: The paid group — money buys persuasion
      B: The lightly compensated group — insufficient justification leaves dissonance to be resolved by
        changing the private attitude
      C: Both equally — the statement determines the attitude directly
      D: Neither — attitudes never follow behavior
    answer: B
    explain: Thin external justification maximizes dissonance, and the cheapest resolution is to believe
      the statement.
    distractors:
      A: Generous payment supplies ample justification, so no dissonance remains to resolve.
      C: Attitude change differs precisely because the justification differs.
      D: The induced-compliance paradigm is the standard demonstration that attitudes follow behavior
        under thin justification.
key_points:
- Asch — unanimity and size drive conformity; one ally breaks it.
- Milgram — ~65% full obedience; authority proximity raises, peer dissent drops it.
- Triad — conformity (peers), compliance (request), obedience (command).
- Group processes — polarization, groupthink, deindividuation.
- Attribution — fundamental error (others = disposition), actor-observer.
- Dissonance — thin justification drives attitude change.
mnemonics:
- phrase: One ally breaks Asch
  means: A single dissenter collapses conformity pressure.
- phrase: Peers pressure, authorities command
  means: Conformity from peers; obedience from authority — source names it.
maps:
- title: Naming the social influence
  steps:
  - implicit group norm → CONFORMITY
  - explicit request → COMPLIANCE
  - explicit authority command → OBEDIENCE
- title: Social influence triad
  steps:
  - peers + implicit norm → CONFORMITY
  - explicit request → COMPLIANCE
  - authority command → OBEDIENCE
passage:
  text: A company's product team, proud and cohesive, meets to evaluate a launch. Early doubts are met
    with silence and not raised again; the leader champions it. Post-launch reviews find the doubts well-founded.
    A later re-run adds a rotating devil's-advocate role and anonymous concerns; more flaws surface pre-launch.
  questions:
  - q: The original meeting's failure pattern is…
    options:
      A: Groupthink
      B: Social loafing
      C: Deindividuation
      D: Bystander effect
    answer: A
    explain: Cohesion + suppressed dissent + leader preference.
    distractors:
      B: Effort reduction.
      C: Anonymity disinhibition.
      D: Diffusion in emergencies.
  - q: The improved process works by…
    options:
      A: Inserting structured dissent — breaking unanimity pressure
      B: Increasing group size
      C: Raising incentives
      D: Adding authority command
    answer: A
    explain: Devil's advocacy reinstates the dissent groupthink suppresses.
    distractors:
      B: Larger groups can worsen it.
      C: Incentives don't restore dissent.
      D: More obedience is the opposite.
  - q: Which finding would most directly challenge the study's internal validity?
    options:
      A: A large sample size
      B: A confederate accidentally hinting at the expected answer
      C: High statistical significance
      D: A replication in a different country
    answer: B
    explain: A leaked expectation contaminates the manipulation — the effect may reflect demand.
    distractors:
      A: Power, not validity.
      C: Significance is downstream of validity.
      D: That tests external validity.
pitfalls:
- Conflating obedience (authority) with conformity (peers).
- Social loafing where groupthink belongs.
- Dissonance needing LARGE incentives — thin justification drives change.
- Forgetting one dissenter's power.
