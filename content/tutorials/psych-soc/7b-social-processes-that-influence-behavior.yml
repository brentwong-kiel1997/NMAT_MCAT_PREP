review_questions:
- q: Milgram's participants most often continued when…
  options:
    A: The learner was in the same room
    B: The authority was remote
    C: The authority was present and the setting institutional
    D: Peers refused
  answer: C
  explain: Proximate authority + institutional context maximize obedience.
  distractors:
    A: Victim proximity REDUCES it.
    B: Remote reduces it.
    D: Peer defiance collapses it.
- q: Telling a small lie for $1 shifts attitudes more than $20 because of…
  options:
    A: Insufficient justification → dissonance
    B: Overjustification
    C: Peripheral processing
    D: Self-serving bias
  answer: A
  explain: Thin justification leaves dissonance resolved from within.
  distractors:
    B: Reward crowd-out — different.
    C: A persuasion route.
    D: Credit-self bias.
- q: Judging a stranger's lateness as laziness while excusing your own as traffic demonstrates…
  options:
    A: Fundamental attribution error only
    B: Actor-observer bias
    C: Just-world hypothesis
    D: In-group bias
  answer: B
  explain: The self/other asymmetry.
  distractors:
    A: Half the pattern.
    C: Believing outcomes are deserved.
    D: Favoring one's own group.
- q: The study's design best exemplifies which research approach?
  options:
    A: Correlational with random sampling
    B: Experimental with a manipulated independent variable
    C: Case study with thick description
    D: Meta-analysis of prior studies
  answer: C
  explain: A single company's groupthink episode examined in depth — case study.
  distractors:
    A: No sampling frame or correlation matrix.
    B: Nothing manipulated.
    D: No prior studies pooled.
