subject: psych-soc
chapter: 7B · Social processes that influence behavior
title: 7B · Social processes that influence behavior
overview: 7B is social psychology's core — conformity, obedience, group processes, attitude formation.
  The MCAT's most famous experiments and scenario-friendly questions. Prerequisite — 7A.
sections:
- heading: Conformity — yielding to the group
  body:
  - Conformity is changing behavior to match the group. Asch's line experiments — a unanimous majority
    pulls ~75% to err at least once — and moderators are currency — one dissenting ally slashes conformity,
    unanimity and group size (to ~5) drive it. Normative (fit in) versus informational (be right) names
    why.
  - Related — deindividuation (anonymity loosens restraint), group polarization (discussion shifts members
    FURTHER in their initial direction), groupthink (cohesive groups suppress dissent — preventable by
    devil's advocates).
  check:
  - q: A jury leaning mildly toward conviction deliberates and emerges strongly pro-conviction. This is…
    options:
      A: Group polarization
      B: Social loafing
      C: Conformity to a confederate
      D: Deindividuation
    answer: A
    explain: Discussion amplified the initial lean.
    distractors:
      A: Effort drop — not this.
      B: No planted majority.
      C: Anonymity effects, absent.
  figures:
  - src: 7b-social-processes-that-influence-behavior/social-roles.webp
    caption: Social roles — the student role dictates studious behavior in the classroom.
    credit: Fig 12.8 · OpenStax Psychology 2e — CC BY-NC-SA 4.0
  - src: 7b-social-processes-that-influence-behavior/social-norms.webp
    caption: Social norms — young people dress alike to fit in with peer groups.
    credit: Fig 12.9 · OpenStax Psychology 2e — CC BY-NC-SA 4.0
- heading: Obedience — authority's pull
  body:
  - Milgram — ~65% administered maximum shock when an experimenter insisted. Levers — proximity of authority
    (up), proximity of victim (down), institutional setting (up), dissenting peers (sharply down).
  - Distinguish the triad — conformity (peer, implicit), compliance (explicit request — foot-in-door,
    door-in-face), obedience (authority command). The source of influence names the term.
  check:
  - q: A nurse follows a physician's inappropriate verbal order, deferring to rank. This is…
    options:
      A: Conformity
      B: Obedience to authority
      C: Social facilitation
      D: Groupthink
    answer: B
    explain: A direct command from authority.
    distractors:
      A: No group norm — a hierarchy.
      B: Performance in mere presence.
      C: Group decision defect.
- heading: Attribution, attitudes, persuasion
  body:
  - Attribution — dispositional versus situational — with the fundamental attribution error (overweighting
    disposition judging OTHERS) and actor-observer bias (we excuse ourselves situationally). Culture modulates
    it.
  - Attitudes via central route (arguments, durable) versus peripheral (cues, transient). Cognitive dissonance
    (Festinger — thin justification maximizes attitude change).
  check:
  - q: A driver cuts you off — reckless jerk! — yet when YOU cut someone off it was a blind spot. This
      illustrates…
    options:
      A: Self-serving bias only
      B: The actor-observer bias
      C: Groupthink
      D: Central-route persuasion
    answer: B
    explain: Situational excuses for self, dispositional blame for others.
    distractors:
      A: Related but the two-sided pattern is the signature.
      B: Group process.
      C: Persuasion model.
- heading: Social facilitation and social loafing — audience effects
  body:
  - The mere presence of others changes performance — **social facilitation** (better on simple or well-learned
    tasks, worse on complex or novel ones — Zajonc's arousal account) and **social loafing** (LESS effort
    on group tasks when individual contribution is unidentifiable — pulling a rope in a group). The pair
    looks contradictory but is not — facilitation is about arousal on individual performance; loafing
    is about accountability in collective output.
  - The application matters for medical teams — a well-rehearsed surgical checklist benefits from an audience;
    a novel complex decision degrades. Loafing is why group notes are thinner than individual ones — identifiability
    is the fix.
  check:
  - q: A runner sprints faster with spectators; a brainstorming group produces fewer ideas per person
      than working alone. These are respectively…
    options:
      A: Social facilitation and social loafing
      B: Social loafing and facilitation
      C: Both facilitation
      D: Both loafing
    answer: A
    explain: Arousal on individual performance vs. effort-drop in unidentifiable groups.
    distractors:
      A: Reversed.
      B: The group task shows loafing.
      C: The sprint shows facilitation.
examples:
- prompt: Festinger's design — participants paid $1 or $20 to tell a peer a boring task was fun. Predict
    the attitude change.
  solution:
  - All said the task was fun; behavior contradicts the private belief.
  - $20 is sufficient justification — no dissonance to resolve.
  - $1 is insufficient — dissonance resolved by shifting the private attitude.
  answer: The $1 group shows GREATER attitude change — insufficient justification maximizes dissonance.
  distractors:
    A: More pay → more change — reverses the logic.
    B: Both equal — ignores justification size.
    C: Obedience — no authority commanded belief.
key_points:
- Asch — unanimity and size drive conformity; one ally breaks it.
- Milgram — ~65% full obedience; authority proximity raises, peer dissent drops it.
- Triad — conformity (peers), compliance (request), obedience (command).
- Group processes — polarization, groupthink, deindividuation.
- Attribution — fundamental error (others = disposition), actor-observer.
- Dissonance — thin justification drives attitude change.
mnemonics:
- phrase: One ally breaks Asch
  means: A single dissenter collapses conformity pressure.
- phrase: Peers pressure, authorities command
  means: Conformity from peers; obedience from authority — source names it.
maps:
- title: Naming the social influence
  steps:
  - implicit group norm → CONFORMITY
  - explicit request → COMPLIANCE
  - explicit authority command → OBEDIENCE
- title: Social influence triad
  steps:
  - peers + implicit norm → CONFORMITY
  - explicit request → COMPLIANCE
  - authority command → OBEDIENCE
passage:
  text: A company's product team, proud and cohesive, meets to evaluate a launch. Early doubts are met
    with silence and not raised again; the leader champions it. Post-launch reviews find the doubts well-founded.
    A later re-run adds a rotating devil's-advocate role and anonymous concerns; more flaws surface pre-launch.
  questions:
  - q: The original meeting's failure pattern is…
    options:
      A: Groupthink
      B: Social loafing
      C: Deindividuation
      D: Bystander effect
    answer: A
    explain: Cohesion + suppressed dissent + leader preference.
    distractors:
      A: Effort reduction.
      B: Anonymity disinhibition.
      C: Diffusion in emergencies.
  - q: The improved process works by…
    options:
      A: Inserting structured dissent — breaking unanimity pressure
      B: Increasing group size
      C: Raising incentives
      D: Adding authority command
    answer: A
    explain: Devil's advocacy reinstates the dissent groupthink suppresses.
    distractors:
      A: Larger groups can worsen it.
      B: Incentives don't restore dissent.
      C: More obedience is the opposite.
  - q: Which finding would most directly challenge the study's internal validity?
    options:
      A: A large sample size
      B: A confederate accidentally hinting at the expected answer
      C: High statistical significance
      D: A replication in a different country
    answer: B
    explain: A leaked expectation contaminates the manipulation — the effect may reflect demand.
    distractors:
      A: Power, not validity.
      B: Significance is downstream of validity.
      C: That tests external validity.
pitfalls:
- Conflating obedience (authority) with conformity (peers).
- Social loafing where groupthink belongs.
- Dissonance needing LARGE incentives — thin justification drives change.
- Forgetting one dissenter's power.
