review_questions:
- q: Working memory's approximate capacity is…
  options:
    A: 3 ± 1 items
    B: 7 ± 2 items
    C: Unlimited
    D: One chunk only
  answer: B
  explain: Miller's classic span.
  distractors:
    A: Too small.
    C: That is long-term.
    D: Chunking expands effective span.
- q: The hippocampus is critical for…
  options:
    A: Storing all old memories permanently
    B: Consolidating NEW explicit memories
    C: Procedural skill learning
    D: Sensory registration
  answer: B
  explain: Formation of new declarative memories.
  distractors:
    A: Remote memories survive hippocampal loss.
    C: Striatum territory.
    D: Peripheral registers handle that.
- q: Nightmares and vivid dreams most likely occur in…
  options:
    A: N1
    B: N3
    C: REM
    D: Sleep onset only
  answer: C
  explain: REM dreams are narrative and vivid.
  distractors:
    A: Hypnagogic imagery.
    B: Night terrors live in N3.
    D: REM is the answer.
- q: The study's design best exemplifies which research approach?
  options:
    A: Correlational with random sampling
    B: Experimental with a manipulated independent variable
    C: Case study with thick description
    D: Meta-analysis of prior studies
  answer: B
  explain: Conditions are assigned; the IV is the manipulated framing or prime.
  distractors:
    A: No manipulation described.
    C: Single subject.
    D: No pooled analysis.
