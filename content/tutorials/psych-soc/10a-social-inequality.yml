review_questions:
- q: Davis-Moore's functionalist account explains stratification as…
  options:
    A: Rewarding functionally important, scarce positions
    B: Class warfare
    C: Mere tradition
    D: Genetic hierarchy
  answer: A
  explain: Unequal rewards induce effort into demanding roles.
  distractors:
    A: Conflict theory.
    B: No content.
    C: Biological determinism — rejected.
- q: The glass ceiling refers to…
  options:
    A: Invisible barriers blocking ascent to top positions
    B: Entry-level exclusion only
    C: Overtime demands
    D: Union rules
  answer: A
  explain: Present at the top, blocked above.
  distractors:
    A: A different barrier.
    B: Workload factor.
    C: Irrelevant.
- q: Upstream social determinants of health include…
  options:
    A: Housing, education, income, environment
    B: Prescription formularies
    C: OR scheduling
    D: Staffing ratios only
  answer: A
  explain: Structural conditions shaping exposure and risk.
  distractors:
    A: Downstream clinical.
    B: Logistics.
    C: Still downstream.
- q: The study's design best exemplifies which research approach?
  options:
    A: Correlational with random sampling
    B: Experimental with a manipulated independent variable
    C: Case study with thick description
    D: Meta-analysis of prior studies
  answer: B
  explain: Conditions are assigned; the IV is the manipulated framing or prime.
  distractors:
    A: No manipulation described.
    B: Single subject.
    C: No pooled analysis.
