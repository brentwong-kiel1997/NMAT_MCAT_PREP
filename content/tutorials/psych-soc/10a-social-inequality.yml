subject: psych-soc
chapter: 10A · Social inequality
title: 10A · Social inequality
overview: 10A closes — stratification's axes and theories, health disparities as the MCAT's favorite application,
  mobility. Expect gradient data reading. Prerequisite — 9A.
sections:
- heading: Stratification — class, status, gradient
  objectives:
  - Distinguish wealth (stock) from income (flow) in a described household measure.
  - Read a described gradient as functionalist or conflict-theory evidence.
  - Distinguish a class system from a caste system by openness of mobility.
  body:
  - Societies layer by wealth, power, prestige. Wealth is stock, income is flow — the exam's distinction.
    Class permits mobility; caste does not. Functionalist (rewards fill positions) versus conflict (reproduction)
    readings — match the question.
  check:
  - q: A physician's child becomes a physician via paid training and networks. A conflict theorist reads
      this as…
    options:
      A: Meritocratic reward
      B: Structural reproduction of advantage
      C: Status inconsistency
      D: Horizontal mobility
    answer: B
    explain: Institutions transmit position across generations.
    distractors:
      A: That is functionalist.
      C: Misaligned ranks.
      D: Lateral move.
  - q: A household earns 60,000 a year but holds 1.2 million in property and no debts; a second earns
      90,000 with negative net worth. Which SES measure separates them, and what is the distinction?
    options:
      A: Income; both are identical in SES
      B: Wealth — a stock of assets — separates them; income is a flow over a period
      C: Education; neither differs in credentials
      D: Occupational prestige; the higher earner has higher status by definition
    answer: B
    explain: Assets accumulate and transmit across generations, which is why wealth discriminates between
      households that incomes alone would rank the same way.
    distractors:
      A: The two households differ sharply despite the income ranking.
      C: No educational information is given.
      D: Prestige does not follow salary mechanically.
  figures:
  - src: 10a-social-inequality/fig-4e6565f8.webp
    caption: Stratification layers — class, status, and power differentials.
    credit: Fig 8.1 · OpenStax Introduction to Sociology 3e — CC BY-NC-SA 4.0
- heading: Axes — race, gender, intersectionality
  objectives:
  - Define minority as disadvantaged position rather than numerical share.
  - Apply intersectionality to a described non-additive disparity pattern.
  - Distinguish race as social construction with structural consequences from biological essence.
  body:
  - Race is socially constructed yet structurally consequential; minority group means disadvantaged position,
    not numerical minority. Intersectionality — overlapping identities produce non-additive patterns (race
    × gender × class).
  check:
  - q: Hiring penalties largest for women of a racialized minority, exceeding either main effect alone,
      illustrate…
    options:
      A: Matching hypothesis
      B: Intersectionality
      C: Institutional reform
      D: In-group favoritism
    answer: B
    explain: Intersecting identities compounding.
    distractors:
      A: Attraction pairing.
      C: Not a disparity mechanism.
      D: Could contribute — the interaction is the pattern.
  - q: Wage data show a 5% penalty for one axis alone and 4% for another, but 16% where both coincide.
      Which concept, and why does 'additive' fail?
    options:
      A: In-group favoritism; the effect is additive
      B: Intersectionality — the axes compound multiplicatively, so the combined penalty exceeds the sum
        of the separate ones
      C: Status inconsistency; the ranks are misaligned
      D: Structural mobility; the economy shifted
    answer: B
    explain: Non-additivity is the empirical signature of intersectional disadvantage.
    distractors:
      A: Favoritism toward one's own group does not predict a compounding penalty.
      C: Status inconsistency concerns misaligned class, status, and power, not compounding penalties.
      D: No occupational-structure change is described.
- heading: Health disparities
  objectives:
  - Describe the social gradient in health and read it from stepwise SES data.
  - Order the causal chain from upstream determinants to downstream outcomes.
  - Predict which intervention level — access, exposure, or clinical care — moves a described disparity.
  body:
  - The social gradient in health — each SES step up predicts longer life. Driven by access, exposure,
    behavior-context, healthcare quality. Upstream social determinants outrank downstream clinical care.
  check:
  - q: Life expectancy rises monotonically with each income quintile. This demonstrates…
    options:
      A: Random variation
      B: Reverse causation only
      C: Natural selection
      D: The social gradient in health
    answer: D
    explain: Stepwise SES-mortality across the distribution.
    distractors:
      A: Monotonicity is the opposite.
      B: Gradients persist prospectively.
      C: Not the frame.
  - q: A new clinic halves waiting times in a low-income district, yet the district's diabetes incidence
      keeps rising over five years. Which reading follows?
    options:
      A: The clinic failed and should be closed
      B: Downstream clinical care cannot reverse upstream drivers such as food access, housing, and chronic
        stress
      C: Diabetes is genetic and unaffected by any intervention
      D: The gradient is random noise
    answer: B
    explain: Access is one determinant; the incidence trend is driven by upstream exposure and stress,
      which care delivery does not touch.
    distractors:
      A: The clinic improved care access; the claim was never that it would reverse incidence.
      C: No genetic evidence is offered, and incidence trends track social structure.
      D: A five-year monotonic rise is not noise.
  figures:
  - src: 10a-social-inequality/fig-bd0d76eb.webp
    caption: The social construction of health — SES disparities in outcomes.
    credit: Fig 19.1 · OpenStax Introduction to Sociology 3e — CC BY-NC-SA 4.0
- heading: Mobility and policy
  objectives:
  - Distinguish structural mobility from exchange mobility in a described shift.
  - Separate intragenerational from intergenerational mobility in a described case.
  - Explain education's dual role as mobility escalator and reproduction engine.
  body:
  - Structural mobility (occupation mix shifts) vs. exchange (people swap positions). Education is the
    mobility escalator — and its unequal quality is the reproduction engine. Policy reads differently
    through each lens.
  check:
  - q: A millennial works a job type that barely existed in the parent generation. This illustrates…
    options:
      A: Status inconsistency
      B: Structural mobility
      C: Exchange mobility only
      D: Caste closure
    answer: B
    explain: The occupational structure itself changed.
    distractors:
      A: Misaligned ranks.
      C: People swapping fixed positions.
      D: Closed systems block movement.
  - q: Automation eliminates clerical roles and creates data roles in one decade; a specific clerk's daughter
      becomes a data engineer. Name both mobility types and which one changed for everyone.
    options:
      A: Both are exchange mobility — individuals swapped places
      B: Structural mobility changed the occupational mix for everyone; the daughter's individual rise
        is her intergenerational mobility
      C: Both are structural; no individual movement occurred
      D: Caste closure; no movement was possible
    answer: B
    explain: The economy moved first (structural); the family's position moved second (intergenerational).
    distractors:
      A: Exchange mobility is people swapping fixed positions — the occupation mix itself changed here.
      C: An individual career change is precisely an individual movement.
      D: Movement clearly occurred, so the system is not closed.
examples:
- prompt: Infant mortality by income quartile shows a two-fold gap stable across a decade despite a new
    regional hospital serving all quartiles. Interpret.
  strategy: Read the gradient before reading the intervention. A stable stepwise gap across quartiles
    is a structural signature, so ask which determinants the new hospital actually touches — access only
    — and predict that upstream drivers will keep the gap in place.
  solution:
  - The stable gradient is social, not an access threshold.
  - A hospital is downstream care — cannot erase upstream drivers.
  - Predict area-based interventions.
  answer: Social gradient persisting despite equalized downstream care — upstream determinants dominate.
  discussion: 'The upstream/downstream distinction is the exam''s most testable disparity principle: clinical
    care treats disease, while housing, food, income, and stress produce it. Any vignette pairing a care
    expansion with an unchanged gradient is making exactly this point, and the correct intervention follows
    the mapped deficiency, not the available service.'
  distractors:
    A: No disparity exists — the two-fold gap IS the disparity.
    B: Blaming genetics — quartiles divide socially.
    C: Hospital a failure — it treats; it does not rebuild neighborhoods.
  practice:
    q: A city equalizes insurance coverage across all districts, yet asthma hospitalizations remain three-fold
      higher in the poorest district, where housing is oldest and traffic heaviest. Which conclusion follows?
    options:
      A: Insurance was unnecessary; the coverage expansion failed
      B: Access was one determinant, but exposure from housing and traffic — upstream drivers — sustains
        the disparity
      C: Asthma is genetic in that district
      D: The disparity is a measurement artifact
    answer: B
    explain: Equalizing coverage removes the access barrier only; the mapped environmental exposures continue
      to produce the outcome.
    distractors:
      A: Coverage still matters for treatment; it simply cannot erase exposure-driven incidence.
      C: No genetic evidence is offered, and environmental gradients explain the pattern.
      D: Three-fold persistence after an access fix is a real structural pattern.
key_points:
- Wealth is stock, income is flow; class permits mobility.
- Functionalist vs. conflict readings of stratification.
- Minority = disadvantaged position; intersectionality names non-additive patterns.
- Social gradient — every step counts; upstream outranks clinical.
- Structural vs. exchange mobility.
- Structural mobility (economy shifts) vs. exchange (people swap).
mnemonics:
- phrase: Wealth is a stock, income is a flow
  means: The SES distinction anchoring gap questions.
- phrase: Wealth is stock, income is flow
  means: SES measurement distinction.
maps:
- title: Inequality to biology
  steps:
  - SES (income, wealth, education, occupation)
  - upstream — housing, food, stress, environment
  - behavior and exposure → risk
  - downstream — morbidity and mortality by SES band
- title: Inequality to biology
  steps:
  - SES — income, wealth, education
  - upstream — housing, food, stress
  - exposure → risk
  - downstream — morbidity by SES band
passage:
  text: A county tracks diabetes incidence by census-tract income over twenty years. Rates fall 15% in
    the top quintile, stay flat in the middle, rise 10% in the bottom. A clinic chain opened in bottom
    tracts at year ten; no inflection appears. Grocery mapping shows bottom tracts average one supermarket
    per 25,000 vs. one per 8,000.
  questions:
  - q: The diverging trends demonstrate…
    options:
      A: Clinic success
      B: Genetic drift
      C: Widening health disparities along the gradient
      D: Random fluctuation
    answer: C
    explain: Opposite-signed trends by income band.
    distractors:
      A: No inflection followed.
      B: Tracts divide socially.
      D: Two decades of divergence is not noise.
  - q: The clinic non-effect is best explained by…
    options:
      A: Patient noncompliance
      B: Clinics unnecessary
      C: Downstream care not addressing upstream determinants like food access
      D: Error
    answer: C
    explain: The supermarket gap marks an upstream driver.
    distractors:
      A: Blaming patients ignores mapped structure.
      B: Care matters — it is insufficient.
      D: No indicator.
  - q: Which intervention follows most directly from the mapping?
    options:
      A: Higher copays
      B: More clinics of the same type
      C: Attracting food retail into bottom tracts
      D: Billboards on symptoms
    answer: C
    explain: The mapped deficiency is food access.
    distractors:
      A: Would raise barriers.
      B: Supply proved insufficient.
      D: Information alone does not build access.
pitfalls:
- Income and wealth interchangeably — flows vs. stocks.
- Minority as numerical — it means disadvantaged position.
- Clinical expansion erasing gradients — upstream dominates.
- Single-axis answers to intersectional data.
