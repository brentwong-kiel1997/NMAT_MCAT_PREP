review_questions:
- q: The minimum stimulus detected 50% of the time is the…
  options:
    A: Difference threshold
    B: Absolute threshold
    C: JND
    D: Adaptation point
  answer: B
  explain: By definition.
  distractors:
    A: That is change detection.
    C: Same as difference threshold.
    D: Not a threshold construct.
- q: Which pairing is correct?
  options:
    A: Rods — color detail
    B: Cones — dim-light periphery
    C: Rods — dim light, high convergence
    D: Cones — no foveal presence
  answer: C
  explain: Rods sum signals for sensitivity at the cost of acuity.
  distractors:
    A: Cones carry color.
    B: Rods own dim periphery.
    D: Cones dominate the fovea.
- q: Not feeling your clothes after dressing is best explained by…
  options:
    A: Weber's law
    B: Sensory adaptation to a constant stimulus
    C: Signal detection criterion shift
    D: Rod saturation
  answer: B
  explain: Constant pressure, receptor firing declines.
  distractors:
    A: Weber is about increments.
    C: Criterion is decision-level, not receptor-level.
    D: Touch, not vision.
- q: The study's design best exemplifies which research approach?
  options:
    A: Correlational with random sampling
    B: Experimental with a manipulated independent variable
    C: Case study with thick description
    D: Meta-analysis of prior studies
  answer: A
  explain: Pre-existing rod-loss and normal groups are compared — no manipulation, so correlational.
  distractors:
    B: Nothing was assigned or manipulated.
    C: Not a single-subject account.
    D: No pooled analysis.
