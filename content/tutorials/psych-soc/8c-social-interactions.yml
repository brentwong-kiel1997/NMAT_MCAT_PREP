review_questions:
- q: Diffusion of responsibility operates at which node?
  options:
    A: Noticing
    B: Assuming responsibility
    C: Interpreting
    D: Implementing
  answer: B
  explain: Others' presence divides the should-act weight.
  distractors:
    A: Blocked by distraction.
    C: Blocked by pluralistic ignorance.
    D: Blocked by skill deficits.
- q: Repeated prisoner's dilemma sustains cooperation best through…
  options:
    A: One-shot defection
    B: Reciprocal strategies like tit-for-tat
    C: Larger defection payoffs
    D: Anonymity
  answer: B
  explain: The shadow of the future disciplines defection.
  distractors:
    A: Destroys trust.
    C: Worsens incentive.
    D: Removes reputation.
- q: Sternberg's consummate love contains…
  options:
    A: Intimacy only
    B: Passion and commitment only
    C: Intimacy, passion, and commitment
    D: Commitment only
  answer: C
  explain: All three corners.
  distractors:
    A: Liking.
    B: Fatuous love.
    D: Empty love.
- q: The study's design best exemplifies which research approach?
  options:
    A: Correlational with random sampling
    B: Experimental with a manipulated independent variable
    C: Case study with thick description
    D: Meta-analysis of prior studies
  answer: B
  explain: Conditions are assigned; the IV is the manipulated framing or prime.
  distractors:
    A: No manipulation described.
    C: Single subject.
    D: No pooled analysis.
