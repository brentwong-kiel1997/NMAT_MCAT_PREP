subject: psych-soc
chapter: 6C · Responding to the world
title: 6C · Responding to the world
overview: This chapter is behavior's motor side — classical and operant conditioning, observational learning,
  and cognitive limits on responding. The MCAT tests learning curves, reinforcement schedules, and heuristic
  identification. Prerequisite — 6A/B.
sections:
- heading: Classical conditioning — learning by association
  objectives:
  - Map a described episode onto the CS-US-CR vocabulary before and after learning.
  - Distinguish extinction, spontaneous recovery, generalization, and discrimination in a described curve.
  - Explain one-trial taste aversion as biological preparedness challenging general-process theory.
  body:
  - Pavlov's architecture — a neutral stimulus (bell) pairs with an unconditioned stimulus (food) until
    the bell alone elicits a conditioned response. US→UR before learning; CS→CR after. Extinction (CS
    alone fades), spontaneous recovery, generalization, and discrimination modify it.
  - Biological preparedness bounds the paradigm — taste aversion forms in one trial with hours-long delay
    (Garcia), showing evolution pre-wires which associations are learnable.
  check:
  - q: After conditioning, the bell is presented repeatedly without food and salivation fades. Later,
      one ring again produces salivation. The return is…
    options:
      A: Shaping
      B: Generalization
      C: Spontaneous recovery
      D: Second-order conditioning
    answer: C
    explain: Faded response reappearing after rest.
    distractors:
      A: Operant procedure.
      B: Similar-stimulus spread.
      D: New neutral stimulus paired with the CS.
  - q: A patient nauseated by chemotherapy begins feeling sick in the oncology waiting room, then later
      at the smell of the hospital cafeteria food. Name the phenomenon and its mechanism.
    options:
      A: Spontaneous recovery — the extinguished response returns after rest
      B: Stimulus generalization spreading the conditioned nausea to a similar cue
      C: Higher-order (second-order) conditioning — the cafeteria smell pairs with the established CS
      D: Shaping — successive approximations of nausea
    answer: C
    explain: A previously neutral cue paired with an established conditioned stimulus acquires the response
      — second-order conditioning.
    distractors:
      A: Nothing was extinguished and no rest interval is described.
      B: The cafeteria smell is not a graded variant of the waiting room; it is a new cue linked through
        association.
      D: Shaping is an operant procedure with reinforcement of approximations.
  figures:
  - src: 6c-responding-to-the-world/skinner-box.webp
    caption: B.F. Skinner and the operant chamber — lever press, food dispenser, consequence loop.
    credit: Fig 6.10 · OpenStax Psychology 2e — CC BY-NC-SA 4.0
- heading: Operant conditioning — learning by consequence
  objectives:
  - Classify a consequence as positive/negative reinforcement or punishment by what happened to the behavior.
  - Identify a reinforcement schedule from its response pattern and predict extinction resistance.
  - Explain shaping as reinforcement of successive approximations.
  body:
  - Consequences shape voluntary behavior — reinforcement increases (positive adds good; negative removes
    bad — negative reinforcement is NOT punishment), punishment decreases. Shaping builds complex behavior
    by reinforcing approximations.
  - Schedules rule the curve — fixed ratio (steady, post-reinforcement pause), variable ratio (highest,
    most extinction-resistant — gambling), fixed interval (scalloped), variable interval (slow-steady).
    Match the response pattern to the schedule name.
  check:
  - q: Slot machines pay out unpredictably after a varying number of plays. This schedule is…
    options:
      A: Variable ratio
      B: Fixed ratio
      C: Variable interval
      D: Fixed interval
    answer: A
    explain: Reinforcement after a varying NUMBER of responses — most resistant to extinction.
    distractors:
      B: Fixed counts are predictable.
      C: Interval schedules time the FIRST response.
      D: Same objection.
  - q: A teenager's nagging stops the moment a parent hands over the car keys; over weeks the parent hands
      over keys faster and faster. Name what increased, in whom, and by which operation.
    options:
      A: The teen's nagging increased — positive reinforcement by adding keys
      B: The parent's compliance increased — negative reinforcement by removing the aversive nagging
      C: The parent's compliance increased — positive punishment by adding nagging
      D: The teen's nagging decreased — extinction by withholding keys
    answer: B
    explain: The parent's key-giving rose because it terminated an aversive stimulus — textbook negative
      reinforcement, and the reason the loop persists.
    distractors:
      A: The keys were already the parent's to give; the reinforced act is the parent's, and removing
        an aversive is not 'positive'.
      C: Punishment DECREASES behavior; compliance rose.
      D: The nagging grew more effective, not less.
  figures:
  - src: 6c-responding-to-the-world/reinforcement-schedules.webp
    caption: The four reinforcement schedules yield distinct response patterns — variable ratio is steepest
      and most extinction-resistant.
    credit: Fig 6.13 · OpenStax Psychology 2e — CC BY-NC-SA 4.0
- heading: Observational learning and cognition in learning
  objectives:
  - Sequence Bandura's four steps — attention, retention, reproduction, motivation — for a described imitation.
  - Explain latent learning as learning without performance and identify it in a maze or workplace case.
  - Distinguish vicarious reinforcement from direct reinforcement.
  body:
  - Bandura's Bobo-doll studies — children who watched an adult rewarded for aggression imitated more
    — established observational learning with vicarious reinforcement. Four steps — attention, retention,
    reproduction, motivation.
  - Latent learning (Tolman's cognitive maps — rats learn mazes without reward) proves learning can occur
    without performance, separating knowledge from expression.
  check:
  - q: Rats explore a maze daily without reward, then after food is introduced perform nearly as well
      as always-rewarded rats. This demonstrates…
    options:
      A: Latent learning
      B: Shaping
      C: Classical conditioning
      D: Punishment effects
    answer: A
    explain: Learning without reinforcement or performance — revealed when motivation arrived.
    distractors:
      B: No approximations were reinforced.
      C: No stimulus-stimulus pairing.
      D: No consequence decreased behavior.
  - q: A new nurse performs a sterile technique perfectly on her first attempt, having watched a senior
      do it for weeks, though she was never permitted to practise. Which concept, and which step was she
      missing until now?
    options:
      A: Latent learning — she was missing motivation
      B: Observational learning — attention and retention were in place; reproduction was the step she
        had not yet performed
      C: Classical conditioning — the senior's presence paired with equipment
      D: Shaping — successive approximations were reinforced
    answer: B
    explain: Watching a model built the skill without practice; reproduction converts retained observation
      into action on the first attempt.
    distractors:
      A: Latent learning describes knowledge held without expression in a maze, and nothing was missing
        motivationally here.
      C: No stimulus-stimulus pairing produced the technique.
      D: No one reinforced approximations — she performed it correctly at once.
  figures:
  - src: 6c-responding-to-the-world/cognitive-map.webp
    caption: Tolman's cognitive map — latent learning in maze-running rats without reinforcement.
    credit: Fig 6.15 · OpenStax Psychology 2e — CC BY-NC-SA 4.0
- heading: Responding under uncertainty — heuristics
  objectives:
  - Name the heuristic (representativeness, availability, anchoring) operating in a described judgment.
  - State the correction for each heuristic — base rates for representativeness, reference-class data
    for availability, a wide range for anchoring.
  - Distinguish heuristic-driven bias from random error.
  body:
  - Cognition's shortcuts cut errors too — representativeness (judging by similarity to prototype), availability
    (judging frequency by ease of recall), anchoring (insufficient adjustment from an initial value).
    These produce systematic, predictable bias.
  - Executive control modulates responding — prefrontal cortex supports inhibition (delay of gratification,
    go/no-go) and goal-switching.
  check:
  - q: After news covers a rare shark attack, beachgoers overestimate its likelihood. The bias is…
    options:
      A: Anchoring
      B: Representativeness
      C: Availability
      D: Functional fixedness
    answer: C
    explain: Vivid, easily recalled instances inflate frequency estimates.
    distractors:
      A: Initial-value adjustment failure.
      B: Similarity-to-prototype.
      D: Problem-solving rigidity.
  - q: After a widely shared story about a vaccine side effect, a clinician estimates its rate at 1 in
      200 when the true figure is 1 in 100,000. Which heuristic, and what corrects it?
    options:
      A: Anchoring — re-anchor on a higher number
      B: Representativeness — compare the case to a prototype
      C: Availability — vivid, easily recalled instances inflate frequency; published base rates correct
        it
      D: Confirmation bias — seek disconfirming cases only
    answer: C
    explain: A vivid single case is far easier to retrieve than a statistics table, so judged frequency
      tracks recall ease.
    distractors:
      A: No initial numeric anchor was offered to adjust from.
      B: No prototype match is described — only recall of an instance.
      D: Confirmation bias is selective search; the error here is frequency estimation.
examples:
- prompt: A child receives a candy each time she puts toys away. Later, candy is given only after several
    cleanups, unpredictably. Describe the shift and predict extinction resistance.
  strategy: Identify the schedule by what the reinforcer counts. Candy after EVERY response is continuous;
    unpredictable candy after several responses ties reinforcement to a varying response count — the defining
    feature of a variable ratio.
  solution:
  - Candy per response = continuous reinforcement.
  - Unpredictable candy after several responses = variable ratio.
  - Variable ratio yields high, steady responding and greatest extinction resistance.
  answer: Continuous → variable ratio shift; resistance rises.
  discussion: 'The general law: resistance to extinction tracks unpredictability and partialness, which
    is why variable ratio sustains the highest rates. The applied corollary is that behavior reinforced
    on a thin variable schedule survives removal far longer than continuously reinforced behavior — the
    reason gambling is so persistent and why token programs thin their schedules deliberately.'
  distractors:
    A: Fixed interval — no time gate described.
    B: Predicting faster extinction — data run opposite.
    C: Negative reinforcement — nothing aversive is removed.
  practice:
    q: A clinic praises a patient after each of three exercises, then switches to praising after an unpredictable
      number of completed exercises. Attendance stays high and survives a two-week therapist absence.
      Which schedule produced the persistence?
    options:
      A: Fixed interval — praise on a time gate
      B: Variable ratio — praise after a varying number of responses
      C: Continuous reinforcement — praise after every exercise
      D: Classical conditioning — the clinic paired exercise with praise
    answer: B
    explain: Reinforcement tied to a varying response count is variable ratio, and its unpredictability
      is what carries the resistance to extinction observed during the absence.
    distractors:
      A: No time gate is described, and fixed intervals produce scalloped pausing.
      C: Continuous schedules extinguish fastest once praise stops.
      D: No stimulus-stimulus pairing is involved — the consequence follows a voluntary response.
key_points:
- Classical = stimulus-stimulus; operant = consequence-behavior.
- Negative reinforcement strengthens; punishment weakens — never conflate.
- Schedule signatures — FR pause, VR high and stubborn, FI scallop, VI slow-steady.
- Observational learning needs attention, retention, reproduction, motivation.
- Latent learning separates learning from performance.
- Heuristics — representativeness, availability, anchoring — predictable bias.
mnemonics:
- phrase: VR = Very Resistant; FI = Flat-then-Flurry (scallop)
  means: Variable-ratio resists extinction; fixed-interval scallops.
- phrase: Bell before food is classical; lever before pellet is operant
  means: CS-US pairing versus response-consequence.
maps:
- title: Operant consequence matrix
  steps:
  - ADD pleasant → positive reinforcement (behavior ↑)
  - REMOVE unpleasant → negative reinforcement (behavior ↑)
  - ADD unpleasant or REMOVE pleasant → punishment (behavior ↓)
- title: Choosing the paradigm
  steps:
  - stimulus-stimulus pairing → CLASSICAL
  - response-consequence → OPERANT
  - watching a model → OBSERVATIONAL
passage:
  text: A clinic tests bedmaking by psychiatric patients. Phase 1 — coffee vouchers for each bed (sharp
    rise). Phase 2 — vouchers withdrawn (fall). Phase 3 — vouchers on an unpredictable several-bed basis
    (rise again; later withdrawal probe declines far more slowly).
  questions:
  - q: The Phase 2 decline demonstrates…
    options:
      A: Discrimination failure
      B: Punishment
      C: Extinction of an operant response
      D: Spontaneous recovery
    answer: C
    explain: Removing reinforcement drops the behavior.
    distractors:
      A: Classical vocabulary.
      B: Nothing aversive was added.
      D: Recovery comes after rest.
  - q: The slower decline after Phase 3 follows from…
    options:
      A: The variable-ratio schedule's extinction resistance
      B: Tastier coffee
      C: Patients forgetting
      D: Punishment thinning
    answer: A
    explain: Partial reinforcement makes behavior persist when reinforcement stops.
    distractors:
      B: No change described.
      C: Forgetting predicts faster loss.
      D: No punishment exists.
  - q: Which finding would most directly challenge the study's internal validity?
    options:
      A: A large sample size
      B: A replication in a different country
      C: High statistical significance
      D: A confederate accidentally hinting at the expected answer
    answer: D
    explain: A leaked expectation contaminates the manipulation — the effect may reflect demand.
    distractors:
      A: Power, not validity.
      B: That tests external validity.
      C: Significance is downstream of validity.
pitfalls:
- Equating negative reinforcement with punishment.
- Fixed-interval data given the fixed-ratio label — look for the time gate.
- Treating heuristic biases as random — they are systematic.
- Calling every social learning imitation without checking vicarious consequence.
