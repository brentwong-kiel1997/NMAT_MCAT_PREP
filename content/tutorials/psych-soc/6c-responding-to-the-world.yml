review_questions:
- q: Removal of an unpleasant stimulus that INCREASES behavior is…
  options:
    A: Positive reinforcement
    B: Extinction
    C: Positive punishment
    D: Negative reinforcement
  answer: D
  explain: Removal + increase = negative reinforcement.
  distractors:
    A: Nothing pleasant was added.
    B: Extinction removes reinforcement.
    C: Punishment decreases.
- q: A pigeon pecks fastest and quits last on a…
  options:
    A: Fixed interval
    B: Variable ratio
    C: Fixed ratio
    D: Continuous schedule
  answer: B
  explain: Variable ratio — highest, most resistant.
  distractors:
    A: Scalloped, moderate.
    C: Steady with pauses.
    D: Fast to acquire, fast to extinguish.
- q: The Bobo-doll experiments demonstrated…
  options:
    A: Classical conditioning of fear
    B: Observational learning with vicarious consequences
    C: Latent learning in mazes
    D: Sensitization
  answer: B
  explain: Children imitated a rewarded model more.
  distractors:
    A: No stimulus pairing — a social model.
    C: Tolman, different paradigm.
    D: Different non-associative process.
- q: The study's design best exemplifies which research approach?
  options:
    A: Correlational with random sampling
    B: Experimental with a manipulated independent variable
    C: Case study with thick description
    D: Meta-analysis of prior studies
  answer: B
  explain: Conditions are assigned; the IV is the manipulated framing or prime.
  distractors:
    A: No manipulation described.
    C: Single subject.
    D: No pooled analysis.
