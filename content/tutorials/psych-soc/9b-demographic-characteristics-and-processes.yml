review_questions:
- q: Stage 2 is driven primarily by…
  options:
    A: Falling birth rate alone
    B: Rising death rate
    C: Out-migration
    D: Falling death rate with sustained high birth rate
  answer: D
  explain: Sanitation cut CDR first — the gap explodes.
  distractors:
    A: That is Stage 3.
    B: Contradicts the model.
    C: Not the stage driver.
- q: Remittances are…
  options:
    A: Earnings sent by migrants to origin households
    B: Taxes on migration
    C: Forced displacement payments
    D: Return migration
  answer: A
  explain: Money moving opposite the migrant.
  distractors:
    B: Not fiscal.
    C: Not the term.
    D: People, not money.
- q: A below-replacement country with large elderly cohorts faces…
  options:
    A: Elder-dependency pressure and labor shortage
    B: Explosive growth
    C: Stage 2 dynamics
    D: No challenges
  answer: A
  explain: Dependency ratios invert.
  distractors:
    B: Flat-to-negative.
    C: High-fertility.
    D: Clearly it does.
- q: The study's design best exemplifies which research approach?
  options:
    A: Correlational with random sampling
    B: Experimental with a manipulated independent variable
    C: Case study with thick description
    D: Meta-analysis of prior studies
  answer: A
  explain: Census and vital-statistics records analyzed without intervention.
  distractors:
    B: Nothing manipulated.
    C: Population data, not one subject.
    D: No pooled analysis.
