subject: psych-soc
chapter: 9B · Demographic characteristics and processes
title: 9B · Demographic characteristics and processes
overview: 9B is population structure — demographic transition, pyramids, migration, urbanization. Data-reading
  and graph questions. Prerequisite — 9A.
sections:
- heading: Demography's variables
  objectives:
  - Compute a population change from crude birth rate, crude death rate, and net migration.
  - Explain population momentum from an age-structure argument.
  - Distinguish a rate's numerator, denominator, and time base in a described measure.
  body:
  - Populations change through crude birth rate, crude death rate, and net migration. Population momentum
    — young age structures keep growing after fertility falls to replacement — explains why populations
    don't pivot on a dime.
  check:
  - q: A country drops to replacement fertility but keeps growing for decades because its population is
      young. This is…
    options:
      A: Zero population growth
      B: Transition reversal
      C: Malthusian collapse
      D: Population momentum
    answer: D
    explain: Age-structure inertia.
    distractors:
      A: Growth is positive — not ZPG.
      B: Not a stage reversal.
      C: Catastrophe prediction.
  - q: A country's CBR is 14 per thousand, CDR 9 per thousand, and net out-migration 3 per thousand. What
      is the growth rate, and would a young age structure change the outlook?
    options:
      A: 5 per thousand growth; no, the rate is fixed
      B: 2 per thousand growth; yes — a young age structure carries momentum and keeps growth positive
        after fertility falls
      C: 20 per thousand growth; migration must be excluded
      D: Negative growth; births are below deaths
    answer: B
    explain: 14 - 9 - 3 = 2 per thousand now, and a broad-based age pyramid promises continued growth
      even at replacement fertility.
    distractors:
      A: Momentum is precisely the reason the outlook is not fixed by the current rate.
      C: Net migration is one of the three movers and must be included.
      D: Births exceed deaths by 5 per thousand before migration.
- heading: The demographic transition — four stages
  objectives:
  - Place a described country in a transition stage from its CBR and CDR pattern.
  - Read a population pyramid's shape into a stage and growth trajectory.
  - Name the structural drivers of the stage-3 fertility fall.
  body:
  - Stage 1 — high birth and death, flat. Stage 2 — death falls, growth explodes. Stage 3 — birth falls
    with urbanization and women's education, growth slows. Stage 4 — both low, flat or negative. The pyramid
    shape IS the answer — wide base (Stage 2-3) vs. top-heavy (Stage 4).
  check:
  - q: A pyramid with narrow base and bulging middle-aged cohorts indicates…
    options:
      A: High fertility
      B: Explosive growth
      C: An aging, late-transition population
      D: Heavy out-migration only
    answer: C
    explain: Constricted base = below-replacement fertility.
    distractors:
      A: Wide base marks high fertility.
      B: That is a wide base.
      D: Cannot be read from shape alone.
  - q: A country has CBR 30 per thousand and CDR 7 per thousand, with a very wide pyramid base. Which
      stage, and what explains the gap?
    options:
      A: Stage 1 — both rates high
      B: Stage 2 — death rates have fallen (sanitation, medicine) while birth rates remain high
      C: Stage 3 — fertility has fallen with education
      D: Stage 4 — both rates low
    answer: B
    explain: 'A large CBR-CDR gap plus a broad base is the stage-2 signature: mortality control arrived
      first.'
    distractors:
      A: Stage 1 has high CDR as well; a rate of 7 is not high.
      C: Stage 3 requires a falling CBR, which is not shown.
      D: Both rates low contradicts a CBR of 30.
  figures:
  - src: 9b-demographic-characteristics-and-processes/fig-bf16bc2f.webp
    caption: Population pyramid — age-sex structure by country and demographic stage.
    credit: Fig 20.2 · OpenStax Introduction to Sociology 3e — CC BY-NC-SA 4.0
  - src: 9b-demographic-characteristics-and-processes/fig-390188ba.webp
    caption: Demographic transition — the shift from high to low birth and death rates.
    credit: Fig 20.3 · OpenStax Introduction to Sociology 3e — CC BY-NC-SA 4.0
- heading: Migration and urbanization
  objectives:
  - Classify a described mover's motivation as push or pull, and the movement as voluntary or forced.
  - Explain chain migration and remittance flows in a described community.
  - Distinguish urbanization, sprawl, and gentrification in a described city change.
  body:
  - Push (conflict, decline) vs. pull (jobs, safety); chain migration via settled kin; remittances flow
    back. Urbanization — sprawl and gentrification as applied edges.
  check:
  - q: New arrivals settle where relatives live, sending earnings home. These are…
    options:
      A: Push factors
      B: Counterurbanization
      C: Chain migration and remittances
      D: Brain drain and remittances
    answer: C
    explain: Kin networks channel flows; money flows back.
    distractors:
      A: Motivating conditions.
      B: Movement away from cities.
      D: Skilled-emigration loss — different.
  - q: A nurse emigrates for a higher salary, and two cousins follow her into the same hospital over the
      next five years. Name the concepts and the direction of the money flow.
    options:
      A: Push factors and forced displacement; money flows outward from the origin
      B: Pull factor (wages) plus chain migration via kin networks; remittances flow back to the origin
        households
      C: Brain drain and remittances are unrelated here
      D: Counterurbanization; no money moves
    answer: B
    explain: Attractive wages pull, established kin channel later movers, and earnings return home as
      remittances.
    distractors:
      A: Nothing forced the move, and the money runs back toward the origin, not away.
      C: Kin-chained skilled emigration IS the brain-drain pattern described, so the two are linked.
      D: Movement toward an employment center is urbanizing, not counterurbanizing.
- heading: Demographic data sources and measurement
  objectives:
  - Match a data need to its source — census, vital statistics, or survey — with its characteristic bias.
  - Compute and compare age-standardized rather than crude rates for two populations.
  - Explain why crude rates mislead when age structures differ.
  body:
  - Demographic measures come from specific instruments — a **census** counts everyone at a point in time
    (complete but expensive); **vital statistics** register births and deaths continuously; **surveys**
    sample populations for estimates. Each has characteristic biases — census undercounts marginalized
    groups; surveys depend on sampling frames and response rates.
  - Rates are always per a defined population and time — crude rates use the total population; age-specific
    rates stratify by age band, which matters because populations with different age structures cannot
    be compared on crude rates alone — the age-standardization principle the MCAT expects you to apply
    when reading mortality tables.
  check:
  - q: Country A has a higher crude death rate than Country B, but B's population is much older. Before
      concluding A is less healthy, you should…
    options:
      A: Accept the crude comparison
      B: Age-standardize the rates
      C: Use birth rates instead
      D: Compare land areas
    answer: B
    explain: Age structure confounds crude mortality — standardization removes the composition effect.
    distractors:
      A: Crude rates are confounded here.
      C: Birth rate is a different variable.
      D: Irrelevant.
  - q: Country A (young population) shows a lower crude death rate than Country B (old population). Which
      comparison is valid, and why?
    options:
      A: The crude comparison is valid — death is death
      B: Only an age-standardized comparison is valid — crude rates fold age structure into mortality
      C: Compare birth rates instead; they are age-neutral
      D: Compare population sizes; bigger means healthier
    answer: B
    explain: Age is the dominant mortality determinant, so unequal structures must be standardized away
      before rates are comparable.
    distractors:
      A: The crude difference largely reflects who is old, not how well they are treated.
      C: Birth rates answer a different question entirely.
      D: Population size carries no health information.
examples:
- prompt: Match three pyramids — wide-based triangle, constricting-base diamond, inverted top-heavy —
    to stages and trajectories.
  strategy: Read the base first. The base encodes recent fertility, the upper bars encode survival history,
    and together they place the country in a transition stage and give the growth trajectory.
  solution:
  - Wide base — Stage 2, explosive growth.
  - Constricting base — Stage 3, decelerating.
  - Top-heavy — Stage 4, flat-to-negative with elder-support pressure.
  answer: Stage 2/3/4 with explosive → decelerating → flat-to-negative.
  discussion: 'Pyramid reading generalises to any age-structured question: the same shape predicts future
    school demand, workforce size, and elder-care burden decades ahead. Momentum means today''s base is
    tomorrow''s bulge — which is why policy acts on births now and on aging later.'
  distractors:
    A: All Stage 1 — shapes differ.
    B: Swapping middle and late — the base distinguishes.
    C: Migration as driver — stages are birth/death-driven.
  practice:
    q: A pyramid shows a narrow base, a bulge at ages 45-60, and a wide top. Which reading follows?
    options:
      A: High fertility with explosive growth
      B: Below-replacement fertility now, with a large cohort entering old age and rising dependency pressure
      C: A Stage 2 population with momentum
      D: Data error — pyramids cannot be top-heavy
    answer: B
    explain: A constricted base means current births are below replacement, while the mid-life bulge ages
      into the elder tier within two decades.
    distractors:
      A: A wide base would be required for that reading.
      C: Stage 2 populations have broad bases.
      D: Top-heavy pyramids are common in late-transition nations.
key_points:
- Three movers — birth, death, migration; momentum delays.
- Transition stages 1-4 and the pyramid each implies.
- Stage-3 fertility fall is structural — education, cost, access.
- Push/pull, chain migration, remittances.
- Stage 2 explodes, Stage 3 cools, Stage 4 shrinks.
- Population momentum delays fertility-fall effects by decades.
mnemonics:
- phrase: Stage 2 explodes, Stage 3 cools, Stage 4 shrinks
  means: The transition arc in growth terms.
- phrase: Stage 2 explodes, 3 cools, 4 shrinks
  means: Demographic transition arc.
maps:
- title: Transition stages
  steps:
  - Stage 1 — CBR and CDR high → flat
  - Stage 2 — CDR falls → population explodes
  - Stage 3 — CBR falls → growth decelerates
  - Stage 4 — both low → flat or declining
- title: Transition stages
  steps:
  - Stage 1 — both high, flat
  - Stage 2 — CDR falls, explodes
  - Stage 3 — CBR falls, decelerates
  - Stage 4 — both low, flat/negative
passage:
  text: A nation's census shows CBR falling from 38 to 16 per thousand over forty years; CDR fell from
    20 to 8 in the first decade then plateaued. Median age rises from 18 to 29; urban share from 25% to
    58%.
  questions:
  - q: The country is best placed in…
    options:
      A: Stage 2
      B: Stage 3, moving toward Stage 4
      C: Stage 1
      D: Post-collapse
    answer: B
    explain: Mortality fell decades ago; fertility is now falling.
    distractors:
      A: CDR plateaued long since.
      C: Neither rate is high.
      D: No collapse indicators.
  - q: The rising median age argues for prioritizing…
    options:
      A: Migration restrictions
      B: Maternity wards only
      C: Elder-care infrastructure
      D: Nothing — static
    answer: C
    explain: Age structure sets service demand.
    distractors:
      A: Not responsive to age structure.
      B: Fertility declining — trend is elderward.
      D: Growth continued.
  - q: Which finding would most directly challenge the study's internal validity?
    options:
      A: A large sample size
      B: A confederate accidentally hinting at the expected answer
      C: High statistical significance
      D: A replication in a different country
    answer: B
    explain: A leaked expectation contaminates the manipulation — the effect may reflect demand.
    distractors:
      A: Power, not validity.
      C: Significance is downstream of validity.
      D: That tests external validity.
pitfalls:
- Treating transition as instantaneous — momentum lags decades.
- Reading pyramid shape as migration — it encodes births and deaths.
- Refugee (forced, protected) confused with immigrant (voluntary).
- Calling Stage 4 growth zero always — several are negative.
