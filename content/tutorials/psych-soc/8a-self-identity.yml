review_questions:
- q: Marcia's moratorium features…
  options:
    A: Exploration without commitment
    B: Commitment without exploration
    C: Neither
    D: Both completed
  answer: A
  explain: Active exploration, decision deferred.
  distractors:
    A: Foreclosure.
    B: Diffusion.
    C: Achievement.
- q: I aced it because I am good; I failed because the test was unfair illustrates…
  options:
    A: Actor-observer bias
    B: Self-serving bias
    C: Fundamental attribution error
    D: Just-world belief
  answer: B
  explain: Credit internal, blame external.
  distractors:
    A: Self/other asymmetry.
    B: Other-judging error.
    C: Deservingness.
- q: Out-group homogeneity means…
  options:
    A: Out-group seems more varied
    B: Out-group seems all alike
    C: In-groups are homogeneous
    D: Groups share genes
  answer: B
  explain: Limited contact yields coarse representations.
  distractors:
    A: Reversed.
    B: Own group looks differentiated.
    C: Irrelevant.
