subject: psych-soc
chapter: 8A · Self-identity
title: 8A · Self-identity
overview: 8A builds the self — identity development, self-concept machinery, and how group membership
  becomes identity. Expect Erikson, Marcia, self-serving biases, social identity. Prerequisite — 7A.
sections:
- heading: Identity development — Erikson's ladder
  body:
  - Erikson frames life as eight psychosocial stages, each a crisis — trust vs. mistrust (infancy) through
    identity vs. role confusion (adolescence) to integrity. The MCAT tests the stage-crisis match.
  - Marcia's statuses on two axes (explored? committed?) — achievement, moratorium, foreclosure (committed
    without exploring), diffusion. Read the two bits, pick the label.
  check:
  - q: A teen accepts the family's career without considering alternatives. Marcia calls this…
    options:
      A: Identity achievement
      B: Foreclosure
      C: Moratorium
      D: Diffusion
    answer: B
    explain: Commitment without exploration.
    distractors:
      A: Requires exploration first.
      B: Exploring, no commitment.
      C: Neither.
  figures:
  - src: 8a-self-identity/erikson-stages.svg
    caption: Erikson's eight psychosocial crises across the lifespan.
    credit: Original diagram for this pack — CC BY-NC-SA 4.0
- heading: Self-concept, esteem, efficacy
  body:
  - Self-esteem is the evaluation; self-efficacy (Bandura) is task-specific confidence — the confusion
    is a planted trap. The self defends — self-serving bias (success = me, failure = situation), better-than-average,
    self-handicapping.
  check:
  - q: A student believes she can master statistics through effort. This is…
    options:
      A: Self-esteem
      B: Self-efficacy
      C: Self-handicapping
      D: Ideal self
    answer: B
    explain: Domain-specific capability belief.
    distractors:
      A: Global self-worth.
      B: Pre-emptive excuse.
      C: Self-discrepancy term.
- heading: Social identity — the group in the self
  body:
  - Tajfel — categorize, identify, compare. Minimal-group experiments (random label assignment alone produces
    in-group favoritism). Out-group homogeneity; stereotype threat — performance decrements under negative
    group stereotypes.
  check:
  - q: Random assignment to Team Blue produces in-group favoritism. This supports…
    options:
      A: Social identity theory's minimal-group effect
      B: Social loafing
      C: Deindividuation
      D: Mere exposure
    answer: A
    explain: Categorization alone suffices for bias.
    distractors:
      A: Effort drop.
      B: Anonymity disinhibition.
      C: Familiarity, not allocation.
  figures:
  - src: 8a-self-identity/identity-statuses.svg
    caption: Marcia's 2×2 — exploration × commitment yielding the four statuses.
    credit: Original diagram for this pack — CC BY-NC-SA 4.0
- heading: Self-concept across cultures
  body:
  - Culture shapes the default self — **individualist** cultures build an independent self (traits, autonomy,
    consistency across situations); **collectivist** cultures build an interdependent self (roles, relationships,
    context-sensitivity). The exam asks you to predict how each frames self-description, self-enhancement,
    and attribution.
  - Markus and Kitayama's work supplies the evidence — self-descriptions in individualist settings lead
    with traits; in collectivist settings with relationships and contexts. The better-than-average effect
    is stronger in individualist samples; self-criticism can serve self-improvement in collectivist settings
    without indicating low global esteem.
  check:
  - q: A respondent describes themselves primarily through relationships and social roles. This pattern
      is more common in…
    options:
      A: Individualist cultures
      B: Collectivist cultures
      C: Both equally
      D: Neither — it reflects personality only
    answer: B
    explain: Interdependent selves foreground relationship and context over traits.
    distractors:
      A: Independent selves lead with traits.
      B: Culture shifts the default.
      C: Culture is a systematic shaper.
examples:
- prompt: A stereotype-threat experiment — math test framed as diagnostic of ability vs. problem-solving
    exercise, stereotyped vs. non-stereotyped group. Predict the 2×2.
  solution:
  - Threat activates under diagnostic framing for the stereotyped group only.
  - Working memory consumed by monitoring — performance drops.
  - The interaction (group × framing) is the signature.
  answer: Stereotyped group underperforms only in the diagnostic condition — an interaction effect.
  distractors:
    A: Main effects of group alone — the design lives in the interaction.
    B: Framing main effect — controls are flat.
    C: Preparation differences — random assignment holds ability constant.
key_points:
- Erikson — eight crises; adolescence = identity vs. role confusion.
- Marcia — achievement, moratorium, foreclosure, diffusion.
- Self-esteem (worth) vs. self-efficacy (task confidence) — never swap.
- Self-serving family — credit internal, blame external.
- Social identity — minimal groups suffice; stereotype threat consumes working memory.
- Self-esteem is global; self-efficacy is domain-specific.
mnemonics:
- phrase: Achieved after Exploring; Foreclosed before Exploring
  means: Marcia keyed to the exploration axis.
- phrase: Explore before you Commit
  means: Achievement requires both; foreclosure skips exploration.
maps:
- title: Social identity steps
  steps:
  - categorize the self into a group
  - identify — membership matters to self-worth
  - compare favorably → bias, out-group homogeneity
- title: Identity formation
  steps:
  - categorize — I am X
  - identify — X matters
  - compare — favorably for X
  - threat → stereotype activation
passage:
  text: Two matched samples of women take a difficult math test. Sample A is told it has shown gender
    differences; B, none. A underperforms by roughly a standard deviation; men unaffected. A follow-up
    shows Sample A lists fewer format features.
  questions:
  - q: Sample A's underperformance is best explained by…
    options:
      A: Stereotype threat consuming working memory
      B: Lower preparation
      C: Social loafing
      D: Learned helplessness
    answer: A
    explain: The framing activates the stereotype; monitoring taxes cognition.
    distractors:
      A: Samples matched.
      B: No group task.
      C: Not framing-specific.
  - q: The sparse format-recall functions as…
    options:
      A: Evidence for a cognitive-load mechanism
      B: A manipulation check failure
      C: Proof of lower motivation
      D: An artifact
    answer: A
    explain: Attention consumed by threat leaves less encoding of surface detail.
    distractors:
      A: The manipulation worked.
      B: Effort not measured as low.
      C: Dismissive.
  - q: Which finding would most directly challenge the study's internal validity?
    options:
      A: A large sample size
      B: A confederate accidentally hinting at the expected answer
      C: High statistical significance
      D: A replication in a different country
    answer: B
    explain: A leaked expectation contaminates the manipulation — the effect may reflect demand.
    distractors:
      A: Power, not validity.
      B: Significance is downstream of validity.
      C: That tests external validity.
pitfalls:
- Confusing self-esteem with self-efficacy.
- Foreclosure where achievement belongs — check exploration.
- Minimal-group bias as requiring conflict — random labels suffice.
- Reading stereotype threat as ability difference — matched designs rule it out.
exam_map:
  NMAT: Not a direct CEM syllabus item.
  MCAT: Content Category 8A — stage matching, bias identification, minimal-group and stereotype-threat
    designs.
