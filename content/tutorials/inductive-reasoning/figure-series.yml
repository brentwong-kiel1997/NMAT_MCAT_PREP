subject: inductive-reasoning
chapter: Figure Series
title: Figure Series
overview: Visual patterns — shape, rotation, shading, position, count, and size changes across a sequence
  of figures. Pattern literacy — describe the change in words before scanning options.
sections:
- heading: The pattern vocabulary
  body:
  - '==Every figure change reduces to one of: shape, rotation, reflection, position, count, shading, size,
    or combination==. ==Name the change FIRST — ''the square rotates 90 degrees clockwise each step''
    — then the option that continues it is obvious==.'
  - ==Single vs double changes — one element may move while another changes shading; read the whole display,
    not just the loudest part==
  check:
  - q: A figure shows a triangle rotating clockwise each frame. Frame 5 should show it…
    options:
      A: Shaded
      B: 90 degrees further clockwise
      C: Bigger
      D: Upside down
    answer: B
    explain: Rotation continues a fixed angular step.
    distractors:
      A: No shading rule shown.
      C: Size unchanged.
      D: That is one step of half-turn.
- heading: Rotation and reflection reads
  body:
  - ==Rotation direction — clockwise vs counterclockwise; fixed step (90, 45, 180) vs acceleration (30,
    60, 90...)==. ==Reflection — mirror reversal across a fixed axis; the option arm bends the other way==.
  - ==Mixed — a shape rotates while its inner mirror-image element stays — split the observation. ==Cyclic
    rotation of position — three objects cycling through three slots (hole, triangle, dot) is position
    logic, not shape logic==
  check:
  - q: An arrow is at 12 o'clock, then 3, then 6. Next should be…
    options:
      A: '12'
      B: '3:30'
      C: '6'
      D: 9 o'clock
    answer: D
    explain: Continuing +90 degrees clockwise from 6 o'clock lands at 9 o'clock.
    distractors:
      A: That is the starting position, not the next step.
      B: Half step.
      C: One step short.
- heading: Shading, hatching, and color coding
  body:
  - ==Shading patterns — solid → hatched → empty → repeat; or increasing fill proportion==. ==Two-channel
    sequences — fill changes on the outer shape while the inner shape rotates — track both channels separately==
  check:
  - q: 'Cycle: solid, dashed, empty, solid, dashed, ?'
    options:
      A: Dashed
      B: Empty
      C: Solid
      D: Half
    answer: B
    explain: Three-state cycle repeats — empty.
    distractors:
      A: Two cycles straight.
      B: Correct.
      C: Back to start early.
      D: Outside the cycle.
- heading: Counting and size rules
  body:
  - ==Count-track — number of elements increments (1, 2, 3, 4) or decrements==. ==Size-track — dimensions
    grow by a fixed multiplier or shrink to a limit !==
  - ==Scaffolding — new small elements appear AND existing ones grow; frame-by-frame addition beats holistic
    guesses. ==Convergence — elements approach a center or recede to edges — position-with-meaning rules==
  check:
  - q: 'Elements per frame: 2, 4, 6, 8, next…'
    options:
      A: '9'
      B: '6'
      C: '12'
      D: '10'
    answer: D
    explain: +2 each frame → 10.
    distractors:
      A: Prime stop.
      B: Down trend.
      C: '+4.'
      D: Correct.
- heading: 'Strategy: describe, then match'
  body:
  - ==Describe the rule in words — if you cannot say it, you cannot pick it==. ==Eliminate — options violating
    any single channel die; often only one option survives three channel checks==.
  - ==Timebox — 45-60 seconds max; re-read the FIRST two transitions when stuck (the generator shows up
    early). ==Unknown rules — when stuck, test rotation, then count, then shading — the diagnostic order==
  check:
  - q: The best first move when facing an unfamiliar figure series is…
    options:
      A: Guess the answer
      B: Describe the change between frames 1 and 2
      C: Look at options first
      D: Skip it
    answer: B
    explain: The first transition usually reveals the generator.
    distractors:
      A: Too early.
      B: Correct.
      C: Options come after the rule.
      D: It is only a minute.
examples:
- prompt: 'Frames: (1) open square; (2) closed square with a dot in the center; (3) open square with dot;
    (4) closed square no dot. Predict frame 5.'
  solution:
  - 'Separate the channels: open/closed cycles O,C,O,C → next O.'
  - 'Dot channel: no, yes, yes, no → this is ''where the dot is'' logic — dot appears opposite to openness?
    O no-dot, C dot, O dot, C no-dot — so dot toggles with a 2-frame offset.'
  - Frame 5 = open square with a dot (matches frame 3 pattern offset).
  - 'Rule: dot follows the ''closed'' state by one frame.'
  answer: Open square with a centered dot.
  distractors:
    A: Closed with dot — one frame off.
    B: Open without dot — follows only the O/C channel.
    C: Closed without dot — that is frame 4 itself.
key_points:
- Name the change in words before options.
- Rotations — step and direction; reflections mirror.
- Shading cycles — track each channel separately.
- Counts — increments/decrements; sizes — multipliers.
- Split odd/even positions for alternating rules.
- First transition reveals the generator.
mnemonics:
- phrase: Shape, rotate, shade, count, size
  means: The five-channel checklist.
- phrase: Describe first, options second
  means: The figure-series order of attack.
maps:
- title: Channel checklist
  steps:
  - shape — type and symmetry
  - rotation/reflection — steps and axis
  - position — slots and centers
  - shading — solid/hatch/empty
  - count and size — arithmetic on elements
- title: Stuck series rescue
  steps:
  - re-state frames 1→2 change
  - check rotation direction reversal
  - split into two channels
  - count elements per frame
  - if still stuck — options elimination by single-channel kills
passage:
  text: 'A 5-frame series with frames given as descriptions: F1 large empty circle; F2 medium empty circle;
    F3 small empty circle; F4 small hatched circle; F5 ?'
  questions:
  - q: The size rule is…
    options:
      A: Alternating big-small
      B: Growing to the ceiling
      C: Shrinking to a floor
      D: Constant
    answer: C
    explain: Large, medium, small — fixed decrement.
    distractors:
      A: No alternation.
      B: Opposite.
      C: Correct.
      D: Sizes changed.
  - q: The shading rule (empty → hatched at F4) most likely continues as…
    options:
      A: No shading change
      B: Split fill
      C: Densest fill next
      D: Return to empty
    answer: C
    explain: The sequence moved one level — the natural continuation is deeper fill.
    distractors:
      A: Change already happened.
      B: No basis.
      C: Correct per the implied gradient.
      D: Opposite direction.
  - q: 'If the series instead goes F1-F5: circle, square, circle, square, ? the rule is…'
    options:
      A: Random
      B: Growing square
      C: Rotation of the circle
      D: Alternating shape — circle
    answer: D
    explain: Two-state shape alternation, most parsimonious.
    distractors:
      A: There is a clear rule.
      B: No size data.
      C: Rotation contradicts alternation.
pitfalls:
- Reading shading as rotation — channels separate.
- Assuming acceleration when the step is constant.
- Mirror and rotation conflated.
- Position cycles mistaken for shape changes.
- Choosing an option that matches only one of two channels.
