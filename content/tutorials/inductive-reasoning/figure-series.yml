review_questions:
- q: A dot moves top, center, bottom, top, center, ?
  options:
    A: Top
    B: Nowhere
    C: Bottom
    D: Center
  answer: C
  explain: Three-position cycle — bottom.
  distractors:
    A: Restart.
    B: No position.
    C: Correct.
    D: Stall.
- q: Frames show triangles with 0, 1, 2, 3 lines. Next has…
  options:
    A: '4'
    B: '0'
    C: '1'
    D: '5'
  answer: A
  explain: +1 per frame.
  distractors:
    A: Correct.
    B: Restart.
    C: Slow start.
    D: '+2.'
- q: Arrow rotates 45 then 90 then 135. The angular step is…
  options:
    A: +45 each
    B: Doubling
    C: Halving
    D: Constant 45
  answer: A
  explain: 45, 90, 135 — adding 45 each time.
  distractors:
    A: Correct.
    B: 45x2=90 but 90x2!=135.
    C: No.
    D: Step grows.
- q: 'Circles: 1 big + 1 small, then 2 big + 2 small. Next…'
  options:
    A: 3 big + 3 small
    B: 3 big only
    C: 1 big + 2 small
    D: 2 big + 1 small
  answer: A
  explain: Counts both increment by one.
  distractors:
    A: Correct.
    B: Count channel cut.
    C: Small-only growth.
    D: Big-only growth.
