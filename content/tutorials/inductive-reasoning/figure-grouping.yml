subject: inductive-reasoning
chapter: Figure Grouping
title: Figure Grouping
overview: 'Classifying figures into categories — the odd-one-out and two-group sort. The rule hides in
  a shared feature: symmetry, number of sides, fill, orientation, or open/closed shape. Find the discriminator,
  then sort.'
sections:
- heading: Finding the discriminator
  body:
  - '==Grouping items ask: what feature do members of the set share that non-members lack? ==Discriminator
    candidates — symmetry, side count, angle type, fill state, open/closed, orientation, ornament presence=='
  - ==Test each candidate against the non-member — the discriminator must FAIL the outsider AND HOLD for
    every member. ==Single vs double discriminators — sometimes two features must both match (e.g., closed
    AND shaded)==.
  check:
  - q: 'A set: square, triangle, circle. The outsider from a list including the diamond is…'
    options:
      A: The diamond
      B: The square
      C: The triangle
      D: The circle
    answer: D
    explain: Square and triangle are straight-sided polygons; the circle has no sides or corners — it
      is the outsider.
    distractors:
      A: The diamond is not in the set at all — a distractor label, not a member.
      B: The square fits the straight-sided rule.
      C: The triangle fits the straight-sided rule.
- heading: Symmetry-first strategies
  body:
  - '==Line symmetry — fold test: does the figure match across an axis? Rotational symmetry — spin test:
    does it repeat before 360 degrees? ==Group by type — all symmetric vs all asymmetric; or by NUMBER
    of axes (1, 2, none)==.'
  - ==Combined — a group might be 'rotationally symmetric AND shaded'. ==Asymmetric decoys — the outsider
    often breaks symmetry subtly (one notch missing), so count notches==
  check:
  - q: 'A figure set of letters: H, I, O, X, and the candidate A. The shared feature is…'
    options:
      A: Curved lines
      B: Vertical and horizontal symmetry
      C: Only horizontal
      D: Only vertical
    answer: B
    explain: H, I, O, X all have both a vertical and a horizontal mirror axis; A has only vertical, so
      it is the outsider.
    distractors:
      A: Letter strokes here are straight lines.
      C: None of the set letters is horizontal-only.
      D: True of A alone — the shared feature must cover all four set letters.
- heading: Shape family grouping — sides and angles
  body:
  - ==Sides rule — group by number of sides (triangles/quadrilaterals) or by aspect (acute vs obtuse dominant)==.
    ==Regularity — regular (equal sides/angles) vs irregular==
  - ==Hierarchy — pentagon and hexagon may share '> 4 sides'; triangles may split further by right/equilateral.
    ==Interior structure — diagonals drawn vs absent; vertex counts vs shape labels==
  check:
  - q: 'Set: rhombus, rectangle, square. The common feature (beyond four sides) is…'
    options:
      A: All have right angles
      B: Four equal or parallel-paired sides with symmetry
      C: All are equilateral
      D: All are non-convex
    answer: B
    explain: All are parallelograms — the true family.
    distractors:
      A: Rectangle has 90s but rhombus may not.
      C: Square only.
      D: All are convex.
- heading: Fill, pattern, and texture sorting
  body:
  - ==Fill states — solid, hatched, empty, dot-filled; grouping can be by fill state or by fill gradient
    (emptiness order)==. ==Texture — hatch direction (/// vs \\) or spacing sorts groups==
  - ==Pattern tracking — a stripe's width or a dot's count can be the real discriminator over shape. ==Combination
    doubles — 'empty AND rotated' groups test both channels==
  check:
  - q: 'Group A: solid circle, solid square, solid triangle. Group B: empty versions of each. The discriminator
      is…'
    options:
      A: Shape
      B: Size
      C: Fill state
      D: Rotation
    answer: C
    explain: The only change between groups is filled vs empty.
    distractors:
      A: Shapes vary within groups.
      B: No size change.
      D: No rotation.
- heading: Odd-one-out strategy and answer hygiene
  body:
  - ==In paper versions, the odd-one-out is the outsider; in digital formats, group-sort questions partition
    into two named groups — apply BOTH criteria (membership and rejection)==. ==When multiple features
    differ, prefer the feature that partitions the FEWEST items into the given group — maximum specificity==
  - ==Check the reverse — ask 'does the outsider violate the rule?' — every grouping answer survives this
    question. ==Timebox — 40 seconds per item; the discriminator is mechanical once the checklist runs==
  check:
  - q: Five figures — four have exactly two lines of symmetry, one has one. The odd one…
    options:
      A: The shaded one
      B: The most symmetric
      C: Any symmetric figure
      D: The one-line figure
    answer: D
    explain: The count discriminates cleanly.
    distractors:
      A: Shading is absent.
      B: The highest is a gradient, not a group.
      C: All have symmetry.
examples:
- prompt: 'Sort into two groups: figure 1 (pentagon, empty), 2 (pentagon, hatched), 3 (square, empty),
    4 (hexagon, hatched), 5 (square, hatched).'
  solution:
  - Candidate features — shape (n sides) and fill.
  - Fill splits 1,3 (empty) vs 2,4,5 (hatched) — but that is uneven.
  - Sides split 3,5 (4 sides) vs 1,2,4 (5-6 sides) — every figure belongs to one side family.
  - 'Best discriminator: number of sides — 4-side vs 5+-side groups.'
  answer: 'Group by side count: squares vs pentagon/hexagon.'
  distractors:
    A: Fill — leaves three vs two unevenly but valid; side count is more specific.
    B: Symmetry — all are symmetric.
    C: Size — not varied.
key_points:
- The discriminator must fail every outsider.
- Symmetry — line and rotational; count the axes.
- Side and angle families first.
- Fill and texture as second-channel rules.
- Prefer the most specific feature.
- Reverse check — outsider must break the rule.
mnemonics:
- phrase: Symmetry, sides, fill, shape
  means: The grouping checklist.
- phrase: Members hold, outsiders break
  means: The discriminator test both ways.
maps:
- title: Discriminator hunt
  steps:
  - list features — symmetry, sides, angles, fill, orientation, count
  - test each against every member
  - test against the outsider — must fail
  - one feature left — the rule
  - two features left — combine
- title: Symmetry types
  steps:
  - line symmetry — fold test
  - rotational — spin test
  - one axis vs two vs none
  - combined with fill — double rule
passage:
  text: 'Six tiles: (1) right triangle empty; (2) isosceles triangle hatched; (3) isosceles empty; (4)
    square hatched; (5) rectangle empty; (6) right triangle hatched. Split into two groups of three.'
  questions:
  - q: The cleanest split uses…
    options:
      A: Triangle vs quadrilateral
      B: Fill state
      C: Angles
      D: Size
    answer: B
    explain: Fill splits 1,3,5 (empty) vs 2,4,6 (hatched) — three and three.
    distractors:
      A: Shape splits 4 triangles vs 2 quadrilaterals — uneven.
      C: Angles split right vs others — not three.
      D: No size data.
  - q: If forced to use shape, the counts are…
    options:
      A: 3 and 3
      B: 2 and 4
      C: 4 triangles, 2 quadrilaterals
      D: 5 and 1
    answer: C
    explain: 'Triangles: 1, 2, 3, 6 — four; quads: 4, 5 — two.'
    distractors:
      A: Only by fill.
      B: Glass-half-full
      C: Correct.
      D: No.
  - q: A tile with a hatched pentagon added would…
    options:
      A: Be irrelevant
      B: Join the empty group
      C: Join the hatched group
      D: Break both rules
    answer: C
    explain: It satisfies the fill criterion — the hatched group.
    distractors:
      A: It matches.
      B: It has fill.
      C: Correct.
      D: Rules still hold.
pitfalls:
- Choosing a feature that partially fits the outsider.
- Forgetting rotational symmetry when testing line symmetry.
- Grouping by shape when fill is the intended rule.
- Uneven groups — the item usually forces balanced counts.
- Feature lists that ignore orientation.
