review_questions:
- q: Which shape breaks a group of three closed figures (square, circle, triangle)?
  options:
    A: Another triangle
    B: An ellipse
    C: A rectangle
    D: An open arc
  answer: D
  explain: The group rule is 'closed' — the arc is open.
  distractors:
    A: Fits.
    B: Fits.
    C: Fits (closed).
    D: Correct.
- q: A set all with right angles is…
  options:
    A: Square, rectangle
    B: Square, triangle
    C: Circle, ellipse
    D: Diamond, parallelogram
  answer: A
  explain: Only those with 90-degree interior angles.
  distractors:
    A: Correct.
    B: Triangle is acute.
    C: No angles.
    D: Diamond may lack 90s.
- q: Rotational symmetry at 120 degrees matches…
  options:
    A: Equilateral triangle
    B: Square
    C: Rectangle
    D: Right triangle
  answer: A
  explain: 120 x 3 = 360 — the triangle repeats.
  distractors:
    B: 90 degrees — square.
    C: 180 only.
    D: 180 only.
- q: 'Expected grouping: four empty shapes vs four hatched shapes is a…'
  options:
    A: Fill-state sort
    B: Shape sort
    C: Size sort
    D: Symmetry sort
  answer: A
  explain: Fill divides the set.
  distractors:
    B: Shapes vary within each group.
    C: No sizes.
    D: No axes.
