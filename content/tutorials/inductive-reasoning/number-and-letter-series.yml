review_questions:
- q: 3, 6, 12, 24, ?
  options:
    A: '36'
    B: '48'
    C: '30'
    D: '60'
  answer: B
  explain: ×2 → 48.
  distractors:
    A: +12 slip.
    B: Correct.
    C: Alternate +6,+12.
    D: ×2.5.
- q: A, C, F, J, ?
  options:
    A: O
    B: L
    C: M
    D: N
  answer: A
  explain: Positions +2, +3, +4 → +5 → O (15).
  distractors:
    A: Correct.
    B: +3 constant.
    C: +4 first.
    D: +2 return.
- q: 1, 8, 27, 64, ?
  options:
    A: '81'
    B: '125'
    C: '100'
    D: '128'
  answer: B
  explain: n^3 — 5^3 = 125.
  distractors:
    A: n^4 slip.
    B: Correct.
    C: n^2 x 2.
    D: ×2 pattern.
- q: 2, 4, 7, 11, 16, ?
  options:
    A: '22'
    B: '21'
    C: '20'
    D: '23'
  answer: A
  explain: Differences +2,+3,+4,+5 → +6 → 22.
  distractors:
    A: Correct.
    B: Alternating +1,+5.
    C: +5 constant.
    D: +7 stall.
