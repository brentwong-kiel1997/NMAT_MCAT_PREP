review_questions:
- q: Kw-12 vs Kw-12 — same?
  options:
    A: 'No'
    B: 'Yes'
    C: Unknown
    D: Almost
  answer: B
  explain: All characters match.
  distractors:
    A: No variance.
    B: Correct.
    C: They are shown.
    D: Variance is decisive.
- q: MN-009 vs MN-090 — differs…
  options:
    A: In the trailing digits
    B: Nowhere
    C: In the letters
    D: In the dash
  answer: A
  explain: 009 vs 090 — transposition of the last two digits.
  distractors:
    A: Correct.
    B: They differ.
    C: MN matches.
    D: Dash matches.
- q: String pairs most likely to hide a difference are…
  options:
    A: Interior-similar long ones
    B: Short obvious ones
    C: Symbol-free ones
    D: Identical-looking ones
  answer: A
  explain: Long, similar strings reward systematic scanning.
  distractors:
    A: Correct.
    B: Short ones reveal fast.
    C: Symbols hurt legibility, not matching.
    D: All need verification.
- q: A good verification pass runs…
  options:
    A: Character by character
    B: By overall shape
    C: By length only
    D: By memory
  answer: A
  explain: The only reliable comparison unit is the character.
  distractors:
    A: Correct.
    B: Shape misses transpositions.
    C: Length rarely differs.
    D: Memory ruins precision.
