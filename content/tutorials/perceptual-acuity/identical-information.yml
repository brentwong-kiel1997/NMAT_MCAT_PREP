subject: perceptual-acuity
chapter: Identical Information
title: Identical Information
overview: Rapid same/different comparison of strings, codes, and records — the NMAT attention-to-detail
  item. Precision beats speed; systematic scanning beats holistic guessing.
sections:
- heading: The comparison mindset
  body:
  - '==Identical-information items give two (or four) strings and ask: same or different? Every character
    counts — letters, digits, spaces, punctuation, case==. ==Read the whole string; the difference hides
    anywhere, often in the middle=='
  - ==Positional discipline — compare LEFT to RIGHT, one character at a time; skipping a position creates
    phantom matches==. ==Fixation order — scan, then verify with a second pass in the opposite direction==
  check:
  - q: AB-1234 vs AB-1234 — are they the same?
    options:
      A: Depends on context
      B: Different
      C: Cannot tell
      D: Same
    answer: D
    explain: Every character matches, including the hyphen.
    distractors:
      A: No context needed.
      B: No variance.
      C: They are written out.
      D: Correct.
- heading: The classic traps
  body:
  - ==Case traps — 'aBc' vs 'Abc' differ at position 2==. ==Zero-letter traps — 0 vs O vs the letter O;
    1 vs l vs I — glyph confusions across fonts==. ==Space and punctuation — 'AB 12' vs 'AB12' differ;
    comma vs period vs apostrophe matters==
  - ==Transposition — '7123' vs '7132' — digits swapped in the middle==. ==Repetition — '1122' vs '1222'
    — the doubled digit differs==
  check:
  - q: Which pair is DIFFERENT? (All strings shown literally)
    options:
      A: A-101 vs A-101
      B: A-011 vs A-101
      C: CODE-A vs CODE-A
      D: X/Y 3 vs X/Y 3
    answer: B
    explain: A-011 vs A-101 — transposition of 0 and 1.
    distractors:
      A: Identical.
      B: Correct — middle swap.
      C: Identical.
      D: Identical.
- heading: Systematic scanning strategies
  body:
  - ==Chunk — break long strings into 3-4 character groups ('AB12-34CD' → AB12, 34CD) and compare chunk
    by chunk==. ==Anchor the extremes — different strings almost always differ in the interior; verify
    first, middle, last==
  - ==Subvocalize — reading aloud forces per-character attention. ==Cross-examine — compare A against
    B, then B against A; asymmetry usually finds the suspect==
  check:
  - q: The most reliable quick scan reads…
    options:
      A: Only the first character
      B: First, middle, last segments
      C: The overall length
      D: Only the last character
    answer: B
    explain: Interior differences are the norm — verify both ends and the middle.
    distractors:
      A: Misses the interior.
      B: Correct.
      C: Length rarely differs alone.
      D: Misses everything else.
- heading: Speed and accuracy balance
  body:
  - ==Accuracy first — the items are individually fast; one careless miss costs as much as several guesses==.
    ==Pacing — 15-25 seconds per pair; two passes at moderate pace beat one rushed pass==
  - ==When a difference is spotted, STOP — mark and move on; re-reviewing identical-looking tails wastes
    the clock==. ==Elimination — in multi-option formats, excluding identical pairs narrows the answer
    without full reads==
  check:
  - q: You find a difference at position 6 of a 15-character pair. Next…
    options:
      A: Ask for a second look
      B: Re-read the first 5
      C: Mark 'different' and move on
      D: Re-read all 15 slowly
    answer: C
    explain: One confirmed difference decides the item — tail checks are waste.
    distractors:
      A: No such option.
      B: The difference is at 6.
      C: Correct.
      D: Over-verification.
- heading: Applied formats — codes, IDs, records
  body:
  - ==Codes and IDs — alphanumeric with fixed structure (e.g., PHL-2026-0925); verify each segment independently==.
    ==Transcripts — names, numbers, and dates align column-wise==. ==Dates — 04/05 vs 05/04 swap months
    and days==
  - ==Long numbers — every digit is load-bearing; group by threes like a phone number==. ==Separators
    — dash vs space vs dot are testable==
  check:
  - q: 'Record A: REF 2026-Q3-PH. Record B: REF 2026-03-PH. They differ…'
    options:
      A: Not at all
      B: In the dash style
      C: Q3 vs 03
      D: At the first two letters
    answer: C
    explain: 'Positions 10-11: Q3 vs 03 — the middle segment varies.'
    distractors:
      A: They differ.
      B: Dashes match.
      C: Correct.
      D: REF matches.
examples:
- prompt: 'Compare: 09F4-88K2-L7P vs 09F4-88K2-L7P — same or different?'
  solution:
  - Line up positions — 0,9,F,4,-,8,8,K,2,-,L,7,P on both sides.
  - Every character including both hyphens matches — SAME.
  - Anchor the ends — 09F4 matches, L7P matches — then the interior 88K2 confirms.
  - 'Answer: same.'
  answer: Identical — all 13 characters match.
  distractors:
    A: Calling it different — the tail spells L7P, not L8P.
    B: Hyphen counted twice — separators match.
    C: Focusing only on digits — the letters also match.
key_points:
- Every character counts — letters, digits, case, punctuation, spaces.
- Differences hide in the interior — anchor ends, scan the middle.
- Case and glyph traps — 0/O, 1/l, 5/S.
- Chunk by 3-4 characters for long strings.
- One confirmed difference ends the item.
- Codes — verify each structure segment independently.
mnemonics:
- phrase: First, middle, last — then done
  means: The anchor-scan order.
- phrase: One difference is the answer
  means: Stop at the first confirmed mismatch.
maps:
- title: Pair comparison loop
  steps:
  - line up the starts
  - anchor ends — first and last chunk
  - scan interior chunk by chunk
  - note the first mismatch
  - decide same/different
- title: Trap glyphs
  steps:
  - 0 vs O
  - 1 vs l vs I
  - 5 vs S, 8 vs B
  - hyphen vs space vs dot
passage:
  text: 'The inventory sheet lists: Lot #84-7102-AX23; the record shows 84-7102-AX23. Another line: PO-99120
    vs PO-99120. A third line: 12:45 vs 12:54.'
  questions:
  - q: The Lot record differs by…
    options:
      A: The digits
      B: Nothing
      C: The letters
      D: The '#' symbol — presence vs absence
    answer: D
    explain: Sheet has '#', record lacks it — a punctuation difference.
    distractors:
      A: 84-7102-AX23 matches.
      B: They differ once.
      C: AX23 matches.
      D: Correct.
  - q: PO-99120 vs PO-99120 are…
    options:
      A: Impossible to compare
      B: Different in the interior
      C: Identical
      D: Different at the end
    answer: C
    explain: Character-for-character match.
    distractors:
      A: They are printed.
      B: Same digits.
      C: Correct.
      D: Same digits.
  - q: 12:45 vs 12:54 differ…
    options:
      A: At the first digit
      B: At the colon
      C: Nowhere
      D: At digits 4-5 (45 vs 54)
    answer: D
    explain: Middle transposition — 45 swapped to 54.
    distractors:
      A: 12 matches.
      B: Colon matches.
      C: They differ.
      D: Correct.
pitfalls:
- Holistic shape matching instead of character reading.
- Case blindness — aB vs Ab.
- Zero/O and 1/l glyph confusions.
- Stopping early — verifying only the ends.
- Second-guessing after the first confirmed difference.
