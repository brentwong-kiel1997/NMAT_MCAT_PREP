subject: perceptual-acuity
chapter: Mirror Image
title: Mirror Image
overview: 'Judging whether a figure is the mirror image of another — the classic left-right flip. The
  core skills: know your mirror axis, separate flip from rotation, and check asymmetric features fast.'
sections:
- heading: Flip vs rotation — the core distinction
  body:
  - ==A mirror image REVERSES left-right (vertical axis) or top-bottom (horizontal axis) — it is a reflection,
    never a rotation==. ==Rotation preserves left-right order and the winding of interior crosses; reflection
    reverses it==
  - ==Test — the letter 'b' mirrors to 'd' (left-right), while rotating 'b' 180 gives 'q' — rotation and
    reflection are DIFFERENT transformations==
  check:
  - q: The mirror image of 'b' in a vertical mirror is…
    options:
      A: p
      B: b
      C: q
      D: d
    answer: D
    explain: Left-right reflection — the bowl flips to the right side.
    distractors:
      A: That is a horizontal flip.
      B: Unchanged — impossible.
      C: That is 180-degree rotation.
- heading: Vertical vs horizontal mirror axes
  body:
  - '==Vertical mirror (left-right) — the most common NMAT axis: reverses left and right, keeps top and
    bottom=='
  - '==Horizontal mirror (top-bottom) — reverses up and down: ''b'' becomes ''p''==. ==The axis is stated
    in the stem or visible in the figure — never guess==. ==Symmetric figures stay the same in a mirror;
    items test where the asymmetry breaks=='
  check:
  - q: With a horizontal mirror, 'b' becomes…
    options:
      A: d
      B: b
      C: q
      D: p
    answer: D
    explain: Top-bottom flip — the stem flips down.
    distractors:
      A: Vertical mirror.
      B: No change.
      C: Rotation.
      D: Correct.
- heading: Asymmetric-feature checking
  body:
  - '==Scan the asymmetric details — the notch, the protruding line, the loop — then decide its mirrored
    position: left-right then up-down==. ==The b/d and p/q loop pairs are the favorite confusers=='
  - ==Direction arrows — an arrow mirrored in a vertical mirror points the opposite horizontal direction;
    vertical reverses under a horizontal axis. ==Compare silhouettes first; a good body with the wrong
    ornament fails==
  check:
  - q: An arrow pointing right, mirrored in a vertical mirror, points…
    options:
      A: Right
      B: Left
      C: Down
      D: Up
    answer: B
    explain: Left-right reflection reverses the heading.
    distractors:
      A: Only rotation keeps heading.
      B: Correct.
      C: Horizontal axis needed.
      D: No.
- heading: Mirror confusion with digits and letters
  body:
  - ==Digit mirror traps — 6 and 9 flip under a horizontal axis; 2 and 5 under vertical; symmetric digits
    — 0, 8 survive both==. ==Letter traps — b/d/p/q family; symmetric letters (A, H, I, M, O, T, U, V,
    W, X, Y) pass any vertical mirror==
  - '==Whole words — mirror reverses letter order: read the mirrored word from the mirror side. ==Case
    matters — capital vs lowercase flips differ, so check the stem''s exact form=='
  check:
  - q: Which stays the same in a vertical mirror?
    options:
      A: F
      B: R
      C: A
      D: b
    answer: C
    explain: Capitals A, H, I, M, O, T, U, V, W, X, Y are vertical-mirror symmetric.
    distractors:
      A: F reverses.
      B: R reverses.
      C: Correct.
      D: d is its image.
- heading: Speed tactics for mirror items
  body:
  - ==Fix the axis mentally — decide left/right and up/down mapping before scanning options==. ==Eliminate
    options that kept the wrong feature — half die on one asymmetric mark==
  - ==When the stem asks for X's mirror image, reflect X ONCE and match — do not generate all four options'
    images. ==Timebox — 30-45 seconds; prolonged symmetric confusion wastes minutes==
  check:
  - q: The fastest mirror-item attack is…
    options:
      A: Guess by symmetry
      B: Skip
      C: Reflect the stem once, then match
      D: Generate all four images
    answer: C
    explain: One reflection, one comparison — others multiply work.
    distractors:
      A: Symmetry only helps symmetric figures.
      B: Every item is winnable.
      C: Correct.
      D: Four-way waste.
examples:
- prompt: 'Given figure: an ''L'' rotated 90 degrees clockwise with a dot above the long end. Which option
    is its vertical mirror image?'
  solution:
  - Decide the axis — vertical mirror (left-right).
  - The L's long end currently points down; in a left-right mirror the corner structure flips — the long
    end stays down but the short foot switches sides.
  - The dot above the long end — 'above' stays above (vertical mirror keeps up/down).
  - 'Match: option showing the same L with the dot still above and the foot on the opposite side.'
  answer: The option with the foot switched and the dot still above.
  distractors:
    A: Rotated L with dot below — that is rotation + flip error.
    B: Same-L as stem — the mirror erased nothing.
    C: Foot same side, dot above — that is the stem itself.
key_points:
- Mirror = reflection; rotation is NOT reflection.
- b-d vertical, b-p horizontal.
- Axis first — read the stem or figure.
- Symmetric letters/digits survive vertical mirrors.
- Reflect the stem once, then match.
- Arrow headings reverse across, not along, the axis.
mnemonics:
- phrase: b-d vertical, b-p horizontal
  means: The two flip mappings in one line.
- phrase: Across reverses, along stays
  means: Directions perpendicular to the axis flip; parallel hold.
maps:
- title: Mirror decision tree
  steps:
  - axis — vertical or horizontal?
  - flip left-right (or up-down) coordinates
  - check asymmetric marks
  - compare with every option
  - reject rotated look-alikes
- title: Letter families
  steps:
  - vertical-symmetric — AHIMOTUVWXY
  - horizontal-symmetric — BCDEHIKOX (approximate)
  - both — H, I, O, X
  - neither — F, G, J, L, N, P, Q, R, S, Z
passage:
  text: 'Five transformations of the letter ''F'' are shown in the item art: F itself, a reversed-F silhouette,
    a rotated-F, a stroke-shifted F variant, and a doubled-F.'
  questions:
  - q: Which transformation could be the vertical mirror image of F?
    options:
      A: The doubled-F
      B: The reversed-F silhouette
      C: The rotated-F silhouette
      D: The F itself
    answer: B
    explain: Left-right reversal — the mirror of F.
    distractors:
      A: No doubling.
      B: Correct.
      C: Rotation — not a reflection.
      D: F is not symmetric.
  - q: The image of 'F' under a horizontal mirror would…
    options:
      A: Stay identical
      B: Become an S-shape
      C: Flip the two bars vertically
      D: Rotate 90
    answer: C
    explain: Top-bottom reversal — the top bar moves to the bottom.
    distractors:
      A: Only symmetric letters pass.
      B: That is a rotation.
      C: Correct.
      D: Reflection ≠ rotation.
  - q: A vertical mirror followed by a horizontal mirror equals…
    options:
      A: Another reflection with no rotation
      B: Identity
      C: A 90-degree rotation
      D: A 180-degree rotation
    answer: D
    explain: Two perpendicular reflections compose a half-turn.
    distractors:
      A: Two parallel reflections give translation.
      B: One flip only.
      C: Wrong composition.
      D: Correct.
pitfalls:
- Rotation mistaken for mirroring.
- Wrong axis — vertical vs horizontal.
- b/d and p/q pairs swapped.
- Overlooking ornament position in option matching.
- Words — reading from the wrong side after mirroring.
