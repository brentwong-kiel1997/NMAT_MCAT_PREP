review_questions:
- q: The vertical mirror of 'q' is…
  options:
    A: b
    B: p
    C: d
    D: q
  answer: B
  explain: A left-right flip mirrors q into p — the bowl stays left while the stem's horizontal position
    is preserved in mirror terms.
  distractors:
    A: b is q rotated 180 degrees, not mirrored.
    C: d is the mirror of b, not of q.
    D: q is not vertically symmetric.
- q: Which digit is vertically symmetric?
  options:
    A: '8'
    B: '2'
    C: '5'
    D: '3'
  answer: A
  explain: 8 is symmetric under a vertical mirror.
  distractors:
    A: Correct.
    B: 2 reverses.
    C: 5 reverses.
    D: 3 reverses.
- q: An upward arrow mirrored across a HORIZONTAL axis points…
  options:
    A: Down
    B: Up
    C: Left
    D: Right
  answer: A
  explain: The perpendicular direction reverses.
  distractors:
    A: Correct.
    B: Parallel directions hold only under the parallel axis.
    C: No horizontal shift.
    D: No.
- q: Two reflections across the same vertical line applied twice produce…
  options:
    A: Identity
    B: A translation
    C: A rotation
    D: A new mirror
  answer: A
  explain: Applying the same reflection twice returns the original.
  distractors:
    A: Correct.
    B: Needs two different axes.
    C: Reflections have no pivot.
    D: Same line — no new image.
