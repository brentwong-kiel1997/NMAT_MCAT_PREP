review_questions:
- q: A target square appears rotated 45 degrees (diamond). It is…
  options:
    A: A pentagon
    B: Invalid
    C: Mirrored only
    D: Still the target
  answer: D
  explain: Rotation is tolerated.
  distractors:
    A: Same sides.
    B: Rotation is fine.
    C: Rotation only.
    D: Correct.
- q: Hatching inside the target area…
  options:
    A: Does not affect the outline
    B: Erases the shape
    C: Nulls the item
    D: Makes it a mirror
  answer: A
  explain: Texture is clutter, not contour.
  distractors:
    A: Correct.
    B: Outlines endure.
    C: No such rule.
    D: No.
- q: Two shapes share one full edge. The shared edge…
  options:
    A: Belongs to both — verify the corners of each
    B: Belongs to neither
    C: Ends the item
    D: is always the target
  answer: A
  explain: Shared edges are common; each shape still closes.
  distractors:
    A: Correct.
    B: Every edge belongs to something.
    C: No.
    D: Only if it matches.
- q: Region-region scanning helps most when…
  options:
    A: You are stuck fixating one area
    B: The target is tiny
    C: The clutter is light
    D: Time is short
  answer: A
  explain: Switching regions breaks fixation.
  distractors:
    A: Correct — the classic binder.
    B: Any region works.
    C: Light clutter is easy anyway.
    D: It still helps.
