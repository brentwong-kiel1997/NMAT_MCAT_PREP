review_questions:
- q: Applying a passage's principle to a new case requires…
  options:
    A: Extracting the general rule first
    B: Memorizing examples
    C: Counting paragraphs
    D: Outside facts
  answer: A
  explain: Abstract the rule, then map the new facts.
  distractors:
    A: Correct.
    B: Examples are raw material.
    C: Structure aids, but the rule matters.
    D: Unprovided facts fail.
- q: New evidence that creates an alternative explanation…
  options:
    A: Weakens the passage's causal claim
    B: Strengthens it
    C: Is neutral
    D: Changes the conclusion
  answer: A
  explain: Rivals for the same outcome erode the attribution.
  distractors:
    A: Correct.
    B: It competes, not confirms.
    C: It bears directly.
    D: It weakens, not switches.
- q: A viewpoint item asks what the author would…
  options:
    A: Think, say, or do in a new case
    B: Remember
    C: Define
    D: Arrange
  answer: A
  explain: Dispositions follow commitments.
  distractors:
    A: Correct.
    B: No recall.
    C: No definitions.
    D: No ordering.
- q: Analogies pass when…
  options:
    A: The logical relations match
    B: The subjects match
    C: The words rhyme
    D: The lengths match
  answer: A
  explain: Structure is the criterion.
  distractors:
    A: Correct.
    B: Surface similarity misleads.
    C: Irrelevant.
    D: Irrelevant.
