review_questions:
- q: A detail item asks about a passage sentence. The strongest answer…
  options:
    A: Paraphrases that sentence without adding scope
    B: Adds a generality
    C: Uses common knowledge
    D: Agrees with the author
  answer: A
  explain: Accurate paraphrase, unchanged scope.
  distractors:
    A: Correct.
    B: Scope additions fail.
    C: Outside knowledge fails.
    D: Agreement is irrelevant to accuracy.
- q: '''The author is mainly concerned with…'' is which family?'
  options:
    A: Main idea
    B: Function
    C: Tone
    D: Reasoning beyond
  answer: A
  explain: Concern = central claim.
  distractors:
    A: Correct.
    B: Function asks the paragraph's role.
    C: Tone asks attitude.
    D: Beyond asks the next step.
- q: A paragraph that starts 'Critics argue...' then details their objections is…
  options:
    A: Presenting a position the author will engage
    B: The author's own view
    C: A definition
    D: A conclusion
  answer: A
  explain: '''Critics argue'' flags a presented view, usually to refute or qualify.'
  distractors:
    A: Correct.
    B: Third-person attribution disowns it.
    C: No term defined.
    D: Not the close.
- q: An answer saying the author is 'ambivalent' when the passage is clearly approving…
  options:
    A: Reverses the tone
    B: Is safe
    C: Is the best answer
    D: Is ungraded
  answer: A
  explain: Approval evidence contradicts ambivalence.
  distractors:
    A: Correct.
    B: Evidence mismatch.
    C: No.
    D: All are graded.
