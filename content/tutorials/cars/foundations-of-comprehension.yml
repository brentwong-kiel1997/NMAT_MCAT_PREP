subject: cars
chapter: Foundations of Comprehension
title: Foundations of Comprehension
overview: The literal layer of CARS — main idea, paragraph function, detail location, and tone. CARS tests
  how precisely you read, not what you knew before. All answers must come from the passage.
sections:
- heading: The CARS game — what is actually asked
  body:
  - ==CARS passages are argumentative; every question rewards EXACT reading of the passage, never outside
    knowledge==. ==Question families — main idea, detail, inference (within), function, tone, and reasoning-beyond
    == — this chapter builds the literal floor for all of them==
  - ==The passage is the sole authority — the author's claim, not your opinion, decides the answer==
  check:
  - q: Which is the best answer source for a CARS main-idea item?
    options:
      A: Your background knowledge
      B: The other examinees' notes
      C: The answer key pattern
      D: The passage's own assertions
    answer: D
    explain: CARS is a reading test — the passage is the text.
    distractors:
      A: Outside knowledge is excluded.
      B: Not available.
      C: No such pattern is reliable.
      D: Correct.
- heading: Main idea — thesis hunting
  body:
  - ==Thesis signals — the first paragraph's last sentence, the closing paragraph, contrast markers (however,
    yet, but) that pivot the argument==. ==The main idea = the author's central claim — usually one paragraph's
    sentence, not a summary of every detail==
  - ==Wrong-answer shapes — too narrow (one detail), too broad (a generalization beyond scope), outside
    the passage, or the opposite of the claim==
  check:
  - q: Where do authors most often state the main claim?
    options:
      A: In the footnotes
      B: Never explicitly
      C: Randomly mid-passage
      D: First paragraph, often its final sentence
    answer: D
    explain: Thesis-first is the dominant organization.
    distractors:
      A: Footnotes hold citations.
      B: Usually explicit.
      C: Not typical.
      D: Correct.
- heading: Paragraph function — the roadmap layer
  body:
  - ==Every paragraph does a job — introduce, define, exemplify, contrast, refute, qualify, transition,
    conclude==. ==Function items ask what the paragraph DOES for the argument, not what it says==
  - ==Read the first and last sentences of each paragraph as a skeleton — the functions chain into the
    passage's structure==
  check:
  - q: A paragraph opens by defining a term, then gives two examples. Its function is…
    options:
      A: Refute a claim
      B: Conclude the passage
      C: Compare two positions
      D: Define and illustrate
    answer: D
    explain: Definition plus exemplification is the paragraph's role.
    distractors:
      A: No opponent is attacked.
      B: Not the close.
      C: No second position shown.
      D: Correct.
- heading: Detail location and accuracy
  body:
  - ==Detail items point at specific claims — relocate the exact sentence, then paraphrase precisely==.
    ==The trap — answer choices that change ONE word (scope, degree, or polarity) of the passage's claim==
  - ==Scope-check words — all, always, never, only (absolute) vs some, most, usually (measured) — passage
    wording dictates which is correct==
  check:
  - q: A passage states 'most historians agree'. A detail answer claiming 'all historians agree'…
    options:
      A: Is unrelated
      B: Overstates the passage
      C: Is milder
      D: Matches the passage
    answer: B
    explain: Most → all is a scope change — the classic trap.
    distractors:
      A: It is the same topic.
      B: Correct.
      C: It is stronger, not milder.
      D: All exceeds most.
- heading: Tone and attitude
  body:
  - '==Tone items — map adjectives and adverbs: approving, skeptical, neutral, critical, ambivalent==.
    ==The acid test — the author''s attitude must be evidenced in the PASSAGE, not your feelings about
    the topic=='
  - ==Distractor tones — too strong (outrage vs mild concern), too weak (neutral vs qualified support),
    or reversed polarity. ==Neutral answers are rarely right when evaluative language appears==
  check:
  - q: An author calls the proposal 'bold but impractical'. The tone is…
    options:
      A: Neutral
      B: Entirely hostile
      C: Mixed — admiring yet skeptical
      D: Entirely approving
    answer: C
    explain: '''Bold'' credits it; ''impractical'' withholds support — ambivalence.'
    distractors:
      A: Judgment appears.
      B: Bold blocks hostility.
      C: Correct.
      D: Impractical blocks approval.
examples:
- prompt: 'Passage opening: ''Urban beekeeping is usually presented as a purely environmental success.
    But the hives also concentrate pesticide exposure in densely planted neighborhoods, and city ordinances
    rarely account for it.'' Ask: the main idea of these two sentences.'
  solution:
  - The pivot is 'But' — the claim shifts after it.
  - First sentence gives the common framing (environmental success).
  - Second sentence is the author's counter — the concentration risk.
  - 'Main idea: the environmental framing obscures a real pesticide concentration problem.'
  answer: The author argues that urban beekeeping's known benefits hide a less-considered pesticide risk.
  distractors:
    A: Beekeeping is harmless — opposite of the passage.
    B: Ordinances must ban beekeeping — too strong, no ban proposed.
    C: Beekeeping is good for cities — only the first sentence.
key_points:
- The passage is the sole authority.
- Main idea — thesis-first, contrast-marked, closing-restated.
- Paragraph function — what it does, not what it says.
- Detail accuracy — one changed scope word is a trap.
- Tone must be evidenced in the passage.
- Absolute wording needs absolute passage support.
mnemonics:
- phrase: Who, what, why, but
  means: Find the actor, claim, support, and the pivot.
- phrase: One-word scope changes kill answers
  means: Most vs all; sometimes vs always.
maps:
- title: Passage skeleton
  steps:
  - opening — hook and thesis
  - support paragraphs — example, contrast, qualifier
  - contrast markers — pivot points
  - closing — restate or extend the thesis
- title: Answer filter
  steps:
  - supported by the passage? (match wording)
  - scope matches (no absolutes added)
  - tone matches author's
  - not outside knowledge
  - not a reversed claim
passage:
  text: Historians once described the medieval guild as a simple monopoly protecting masters. More recent
    scholarship notes the guilds' genuine apprenticeship function — transferring real skills to outsiders
    — and their civic role in urban governance. Still, monopoly pressures never vanished; guilds restricted
    entry wherever demand ran high. The revision is therefore partial, not total.
  questions:
  - q: The main idea of the passage is…
    options:
      A: Guilds were civic utopias
      B: Guilds had no economic role
      C: The guilds' civic and training functions were real, but monopoly behavior persisted
      D: Guilds were simple monopolies
    answer: C
    explain: The 'therefore partial' close updates the thesis — both sides kept.
    distractors:
      A: Ignores the monopoly caveat.
      B: Contradicts the passage.
      C: Correct.
      D: That is the older account.
  - q: The final sentence functions as…
    options:
      A: A definition
      B: A list of examples
      C: A qualification of the revision
      D: An attack on the author
    answer: C
    explain: '''Partial, not total'' qualifies how far the revision displaces the old view.'
    distractors:
      A: No term defined.
      B: No list appears.
      C: Correct.
      D: No attack.
  - q: A tone not evidenced in the passage is…
    options:
      A: Measured scholarly assessment
      B: Outrage at the guilds
      C: Qualified sympathy for the revision
      D: Analytical distance
    answer: B
    explain: No intense emotion appears — the register is scholarly.
    distractors:
      A: '''Partial'' is measured.'
      B: Correct.
      C: '''Not total'' qualifies.'
      D: Neutral vocabulary dominates.
pitfalls:
- Answering from personal knowledge.
- Sweeping one-paragraph claims across the whole passage.
- Adding absolutes to measured claims.
- Reading tone from the topic rather than the language.
- Summarizing all details instead of the argument.
