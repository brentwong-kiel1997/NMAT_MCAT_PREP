subject: cars
chapter: Reasoning Within the Text
title: Reasoning Within the Text
overview: The inference, function, and structure layer of CARS — what the text implies, why each paragraph
  exists, and how claims connect. Answers stay inside the passage's own logic; nothing from outside enters.
sections:
- heading: Inference — the inside-the-text layer
  objectives:
  - Move exactly one measured step from the passage's wording to a safe inference.
  - Reject inferences that import outside facts, reverse direction, or overreach the stated relation.
  body:
  - ==Inference items ask what the author's words LOGICALLY imply, without stating==. ==The safe inference
    moves one measured step from the passage — closer paraphrases of examples, stated consequences, or
    the author's clear assumption==
  - ==The failure mode — jumping two steps, importing outside facts, or choosing what the author would
    likely reject==
  check:
  - q: 'Passage: ''Rising nitrate levels have coincided with increased algal blooms.'' A safe inference
      is…'
    options:
      A: Nitrates cause all blooms
      B: Algae cause nitrates
      C: The author links the two trends as associated, possibly causally
      D: Rising nitrates are natural
    answer: C
    explain: Coincidence wording licenses association, not full causation.
    distractors:
      A: Overreaches.
      B: Reversed direction.
      C: Correct.
      D: Outside the passage.
  - q: 'Mini-passage: ''Clinics that adopted shared decision-making aids saw appointment lengths rise
      about ten percent; malpractice claims did not rise over the same period.'' A safe inference is…'
    options:
      A: Shared decision-making prevents lawsuits
      B: Patients prefer longer appointments
      C: The aids coincided with longer visits, and no rise in claims was observed over the period described
      D: Appointment length determines claim rates
    answer: C
    explain: Both halves are stated; neither causation between them nor preference is.
    distractors:
      A: No causal link between the aids and claims is offered.
      B: No preference data appears.
      D: Direction of causation is absent from the passage.
- heading: Question forms — strengthen, weaken, assumption
  objectives:
  - Identify the unstated assumption an argument needs and apply the negation test.
  - Choose the option that adds or removes support through the claim's own mechanism.
  body:
  - ==Strengthen/weaken — add or subtract support from the author's claim; the correct answer connects
    directly to the claim's mechanism or evidence==. ==Assumption — the unstated link the argument needs;
    negating it collapses the argument==
  - ==The negation test — an assumption is a statement whose falsehood would break the argument==
  check:
  - q: An argument relies on the assumption that…
    options:
      A: An outside fact
      B: Any statement the author mentions
      C: The conclusion itself
      D: A gap the argument needs but never states
    answer: D
    explain: Assumptions bridge unstated gaps.
    distractors:
      A: Outside facts are excluded.
      B: Mentioned statements are explicit.
      C: The conclusion is the destination.
      D: Correct.
  - q: 'Mini-passage: ''The village''s new well reduced gastrointestinal illness; therefore the old well
      water was the source of the earlier illness.'' The argument requires the assumption that…'
    options:
      A: Villagers now drink more water than before
      B: Nothing else changed at the same time that could account for the drop
      C: The old well was deeper than the new one
      D: Illness reports had been falsified
    answer: B
    explain: Negate it and the inference collapses — an alternative cause could explain the improvement,
      which is exactly the assumption's signature.
    distractors:
      A: Consumption volume is not required by the reasoning.
      C: Well depth is irrelevant to the inference.
      D: Falsification is not assumed by the argument; it would refute the data, not bridge them.
- heading: Structure questions — how the argument is built
  objectives:
  - Label passages into premise, counterclaim, concession, evidence, and qualification.
  - Recognize the grant-then-pivot concession pattern and hedged versus asserted claims.
  body:
  - ==Structure items — identify premise, counterclaim, concession, evidence, qualification — and the
    logical relationship between chunks==. ==The concession — the author grants a point before limiting
    it; 'to be sure... but' == is the classic pattern==
  - ==Qualifiers — 'some', 'may', 'tends', 'in some cases' limit the claim; structure answers track which
    parts are asserted vs hedged==
  check:
  - q: '''To be sure, the data are preliminary. But the trend cannot be ignored.'' The first sentence
      is…'
    options:
      A: An example
      B: A concession that limits the evidence's weight
      C: The main claim
      D: The conclusion
    answer: B
    explain: The author grants weakness before pivoting — the concession pattern.
    distractors:
      A: No example given.
      B: Correct.
      C: The pivot follows it.
      D: The 'But' clause concludes.
  - q: 'Mini-passage: ''Critics argue the archive''s digitisation favours famous letters. Admittedly,
      the famous ones are scanned first. But the ordering reflects fragility rather than fame — the most
      damaged items go first, whatever their subject.'' Which structure describes this?'
    options:
      A: Thesis, example, conclusion
      B: Counterclaim, concession, rebuttal
      C: Definition, list, definition
      D: Question, answer, question
    answer: B
    explain: The critics' view is presented, the ordering fact is conceded, and 'But' pivots into the
      author's rebuttal.
    distractors:
      A: No thesis is stated at the start — the critics' claim is.
      C: No terms are defined.
      D: No question is posed.
- heading: Purposes and functions of sentences
  objectives:
  - Classify a sentence's role — premise, evidence, counter, conclusion — from its connectives.
  - Distinguish what a sentence says from what it does for the argument.
  body:
  - '==Function questions — what a sentence does: introduce the thesis, give evidence, present a counterargument,
    draw a conclusion==. ==Evidence vs conclusion — evidence supports; conclusions assert; counterarguments
    resist=='
  - ==The stem asks about the sentence's ROLE, not its subject matter. ==Connectives — 'for', 'since'
    (support), 'however' (pivot), 'therefore' (conclusion)==.
  check:
  - q: '''Since the serum occludes the artery, the heart muscle beyond it starves.'' The first clause…'
    options:
      A: Is an analogy
      B: Contradicts the second
      C: Is the conclusion
      D: Gives the reason for the second
    answer: D
    explain: '''Since'' marks a premise supporting the consequence.'
    distractors:
      A: No analogy.
      B: Same direction.
      C: The second clause concludes.
      D: Correct.
  - q: 'Mini-passage: ''Fern regeneration requires canopy gaps. Because fern spores persist in soil for
      decades, such gaps can be recolonised long after a clearing closes.'' The first sentence functions
      as…'
    options:
      A: A conclusion drawn from the second sentence
      B: A statement of requirement whose consequence the second sentence supplies
      C: A counterexample to the second sentence
      D: A definition of 'canopy gap'
    answer: B
    explain: The requirement is asserted first; 'Because' then licenses the recolonisation consequence.
    distractors:
      A: The second sentence depends on the first, not the reverse.
      C: The two sentences agree rather than oppose.
      D: No definition is offered.
- heading: Answer hygiene for within-the-text items
  objectives:
  - Test each answer for scope, polarity, and degree against the passage's wording.
  - Reject true-but-irrelevant answers by checking the question asked.
  body:
  - ==Every word of an answer is testable — scope, polarity, and degree all come from the passage==. ==Reject
    bars — outside information, overstatement, understatement (missing the author's strength), and half-right
    answers==
  - ==The single best answer must be true per the passage AND answer the question asked — a true statement
    about the wrong thing fails==
  check:
  - q: An inference answer that is true but about a different part of the passage…
    options:
      A: Beats the wrong one
      B: Passes anyway
      C: Is a free point
      D: Fails — it must answer the question asked
    answer: D
    explain: Relevance to the stem is mandatory.
    distractors:
      A: No partial credit.
      B: Relevance is scored.
      C: Nothing is free.
      D: Correct.
  - q: 'Mini-passage: ''Ferry service to the island runs twice weekly in winter and daily in summer; the
      year-round population is under 300 while summer visitors number in the thousands.'' The question
      asks why winter service is reduced. Which option best answers it?'
    options:
      A: Ferries burn fuel
      B: Summer service runs daily
      C: The island's year-round population is under 300 while summer visitors number in the thousands
      D: The island has two harbours
    answer: C
    explain: It ties the passage's own numbers to a demand account of the reduced winter schedule.
    distractors:
      A: True in general but not stated or needed here.
      B: Restates the pattern instead of explaining it.
      D: Not in the passage and not explanatory.
examples:
- prompt: 'Passage: ''The museum''s acquisitions policy favors modern works. Consequently, its nineteenth-century
    holdings are thinning — many sold to fund purchases. The director defends the pattern as fiscal, but
    the effect on the collection''s coherence is undeniable.'' — Ask: which statement is best supported?'
  strategy: Layer the claims before answering. Tag each sentence — policy, consequence, reported rebuttal,
    author's judgment — and answer from the layer the question targets, since most wrong options are borrowed
    from a different layer.
  solution:
  - 'Layer the claims — policy (modern focus), consequence (thinning 19th-c holdings), rebuttal (director:
    fiscal), author''s judgment (coherence eroding).'
  - 'Supported inference: the shift is deliberate and has a real cost — the author believes policy choices
    erode coherence.'
  - 'Not supported: the director''s defense is false (must be shown wrong, not merely doubted).'
  - Answer — the author contends the sales impair collection coherence.
  answer: The author believes the policy, however justified fiscally, damages coherence.
  discussion: 'Layering scales to full passages: it shows where the author''s voice sits and which options
    merely restate a reported claim. A defense being reported is never a defense being endorsed — the
    most common within-the-text trap — and an untested explanation is not thereby a false one.'
  distractors:
    A: The director lies — the passage only reports the defense.
    B: Modern works are bad — no valuation stated.
    C: All nineteenth-century works are gone — 'thinning' ≠ absent.
  practice:
    q: 'Mini-passage: ''The library cut weekend hours, citing utility costs. Staff call the reductions
      manageable. Patrons in outlying districts report losing their only study space, and the board records
      no plan to restore hours.'' Which is best supported?'
    options:
      A: The utility-cost explanation is false
      B: Staff are lying about the cuts being manageable
      C: The author presents the reduction as cost-driven while recording a real loss for outlying patrons
      D: Every patron lost a study space
    answer: C
    explain: The passage reports the fiscal reason and the patron harm without endorsing or refuting either
      — the author's own stance is the pairing of the two.
    distractors:
      A: The reason is reported, not tested.
      B: No evidence of deception appears.
      D: Only outlying districts are said to have lost access.
key_points:
- Inference — one measured step, inside the logic.
- Assumption — negation breaks the argument.
- Premise supports; conclusion asserts; counter resists.
- Concession — grant-then-pivot structure.
- Qualifiers — some/may/tends limit claims.
- Answers must be true AND relevant.
mnemonics:
- phrase: To be sure... but
  means: The concession-pivot pattern.
- phrase: Negate to test
  means: The assumption test — negating breaks the argument.
maps:
- title: Argument anatomy
  steps:
  - premise — support
  - evidence — examples and data
  - counterclaim — the resisted view
  - concession — granted limits
  - conclusion — asserted claim
- title: Inference check
  steps:
  - locate the claim
  - name the direction (support/contrast)
  - move ONE step
  - reject overreach
  - reject outside facts
passage:
  text: A nutritional study found that participants who replaced dairy with plant-based alternatives showed
    no bone-density change over two years. The authors cautiously attribute this to compensatory calcium
    intake elsewhere. Critics note the follow-up is short.
  questions:
  - q: The best-supported inference is…
    options:
      A: The study was fraudulent
      B: Plant milk causes bone loss
      C: The authors regard two years as enough to see major density shifts but flag causation
      D: The authors proved dairy is harmful
    answer: C
    explain: '''Cautiously attribute'' + ''critics note follow-up is short'' — a qualified claim.'
    distractors:
      A: No fraud suggested.
      B: No density change was found.
      C: Correct.
      D: No harm shown.
  - q: Which statement, if true, most weakens the authors' attribution?
    options:
      A: Calcium intake rose in the plant group
      B: Calcium intake did not differ between groups
      C: Follow-up instruments were validated
      D: Dropout was balanced
    answer: B
    explain: Removing the mechanism (compensatory calcium) guts the attribution.
    distractors:
      A: That SUPPORTS it.
      B: Correct — the mechanism dies.
      C: Strengthens measurement.
      D: Strengthens internal validity.
  - q: The critics' remark functions as…
    options:
      A: A definition
      B: A limitation flag on external validity
      C: A new conclusion
      D: A refutation of all findings
    answer: B
    explain: Short follow-up limits generalizing the no-change result.
    distractors:
      A: No term defined.
      B: Correct.
      C: No new claim.
      D: They dispute only duration.
pitfalls:
- Two-step jumps masquerading as inference.
- Outside facts smuggled into answers.
- Confusing premise and conclusion.
- Reading concessions as the author's own view.
- Absolute readings of hedged claims.
