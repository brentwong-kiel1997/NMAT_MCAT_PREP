review_questions:
- q: Strengthen questions ask for…
  options:
    A: The option that adds support to the claim
    B: The claim itself
    C: The strongest wording
    D: The longest answer
  answer: A
  explain: Support addition — mechanism, evidence, or exclusion of rivals.
  distractors:
    A: Correct.
    B: The claim is given.
    C: Strength is in support.
    D: Length is irrelevant.
- q: '''Which is most analogous to the author''s reasoning?'' tests…'
  options:
    A: Structure recognition
    B: Memory
    C: Outside knowledge
    D: Grammar
  answer: A
  explain: It asks for the same argument shape elsewhere.
  distractors:
    A: Correct.
    B: No recall.
    C: No facts.
    D: No syntax.
- q: A premise is…
  options:
    A: Support for a claim
    B: A conclusion
    C: An objection
    D: A question
  answer: A
  explain: Premises ground the conclusion.
  distractors:
    A: Correct.
    B: Conclusions follow.
    C: Objections oppose.
    D: Stems ask.
- q: When the author says 'tends to', the claim is…
  options:
    A: Hedged, not absolute
    B: Absolute
    C: Retracted
    D: Unsupported
  answer: A
  explain: Frequency qualifiers measure the claim.
  distractors:
    A: Correct.
    B: Absolutes would say 'always'.
    C: Hedged ≠ retracted.
    D: It is supported by context.
