practice:
- id: beh-7
  q: 'Cognitive dissonance theory predicts that when attitudes and behavior clash, people often:'
  choices:
    A: Change attitudes or reinterpret behavior to reduce discomfort
    B: Permanently lose memory
    C: Only increase arousal with no psychological change
    D: Always admit error immediately
  answer: A
  explain: Inconsistency is aversive, motivating attitude/belief shifts to restore consistency.
