id: 2a-assemblies-of-molecules-cells-and-cell-groups
title: 2A · Assemblies of molecules, cells, and cell groups
discipline: biology
exams:
- NMAT
- MCAT
points:
- Organization from single cells to multicellular assemblies
- Assemblies of molecules, cells, and cell groups
notes:
- 'Hierarchy: macromolecules → organelles → tissues'
- Junctions and ECM support tissue function
- Amphipathic phospholipids define the bilayer core
- Tight junctions block leak; desmosomes resist pull
- 'Tissues: epithelial, connective, muscle, nervous'
- Fluid mosaic and selective permeability
- Tissue types matched to function
- Gap junctions permit small-molecule intercellular signaling
- 'Basement membrane: epithelial–connective interface'
- 'Cytoskeleton roles: microtubules, microfilaments, intermediate filaments'
- ECM collagen supplies tensile strength
practice:
- id: bb-4
  q: 'The plasma membrane bilayer is mainly built from:'
  choices:
    A: Nucleic acid duplexes
    B: Free glucose
    C: Metallic ion crystals
    D: Phospholipids
  answer: D
  explain: Amphipathic phospholipids form the bilayer; proteins and cholesterol are embedded within.
  chapter: 2A · Assemblies of molecules, cells, and cell groups
- id: 2a-assemblies-of-molecules-cells-and-cell-groups-p1
  q: In an epithelial sheet, which junction primarily seals the intercellular space so solutes cannot
    leak between the cells?
  choices:
    A: Gap junctions
    B: Desmosomes
    C: Tight junctions
    D: Basement membrane
  answer: C
  explain: Tight junctions block paracellular leak; desmosomes instead resist mechanical pull, and the
    basement membrane anchors epithelium to connective tissue.
  chapter: 2A · Assemblies of molecules, cells, and cell groups
- id: 2a-assemblies-of-molecules-cells-and-cell-groups-p2
  q: Which junction allows small ions and second messengers to pass directly between neighboring cells?
  choices:
    A: Tight junction
    B: Desmosome
    C: Gap junction
    D: Hemidesmosome
  answer: C
  explain: Gap junctions are connexon channels that permit small-molecule intercellular signaling; tight
    junctions seal and desmosomes anchor.
  chapter: 2A · Assemblies of molecules, cells, and cell groups
