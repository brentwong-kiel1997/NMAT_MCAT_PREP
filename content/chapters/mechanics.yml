practice:
- id: phy-1
  q: 'If net work on an object is positive, its kinetic energy:'
  choices:
    A: Must decrease
    B: Must increase
    C: Stays the same
    D: Is unrelated to work
  answer: B
  explain: 'Work–energy theorem: net work equals change in kinetic energy.'
  chapter: Mechanics
- id: phy-5
  q: 'In uniform circular motion, centripetal acceleration points:'
  choices:
    A: Tangent to the path, same as velocity
    B: Toward the center of the circle
    C: Away from the center
    D: Is zero
  answer: B
  explain: Centripetal acceleration changes velocity direction; velocity is tangential,
    acceleration points inward.
  chapter: Mechanics
- id: mechanics-p1
  q: 'A 2.0 kg block slides at 3.0 m/s. Its kinetic energy is:'
  choices:
    A: 3.0 J
    B: 9.0 J
    C: 18 J
    D: 6.0 J
  answer: B
  explain: Ek = ½mv² = ½(2.0)(3.0)² = 9.0 J. 18 J omits the ½ factor, 6.0 J uses mv,
    and 3.0 J is neither.
  chapter: Mechanics
