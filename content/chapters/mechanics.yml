practice:
- id: phy-1
  q: 'If net work on an object is positive, its kinetic energy:'
  choices:
    A: Must decrease
    B: Must increase
    C: Stays the same
    D: Is unrelated to work
  answer: B
  explain: 'Work–energy theorem: net work equals change in kinetic energy.'
  chapter: Mechanics
- id: phy-5
  q: 'In uniform circular motion, centripetal acceleration points:'
  choices:
    A: Tangent to the path, same as velocity
    B: Toward the center of the circle
    C: Away from the center
    D: Is zero
  answer: B
  explain: Centripetal acceleration changes velocity direction; velocity is tangential, acceleration points
    inward.
  chapter: Mechanics
