id: 1c-heritable-information-diversity
title: 1C · Heritable information & diversity
discipline: biochemistry
exams:
- NMAT
- MCAT
points:
- Molecular machinery that copies, damages, repairs, and reshuffles DNA
notes:
- Semiconservative replication with polymerase proofreading + mismatch repair sets fidelity
- Mutation types — point (silent/missense/nonsense) vs frameshift; frameshift usually costs more
- Repair lanes — mismatch, base excision, nucleotide excision, double-strand break (HR/NHEJ)
- Homologous and V(D)J recombination reshuffle DNA at the sequence level
- Telomerase compensates end shortening in germline/stem cells
- Epigenetics — methylation, histone marks, imprinting, X-inactivation silence without changing sequence
practice:
- id: bb-2
  q: 'In the DNA double helix, base pairing follows:'
  choices:
    A: Only U participates
    B: Random pairing of any bases
    C: A–T (2 H-bonds), G–C (3 H-bonds)
    D: A–G, T–C
  answer: C
  explain: Watson–Crick pairing enables complementary-strand replication and transcription templates.
  chapter: 1C · Heritable information & diversity
- id: bioc-5
  q: 'A missense point mutation means:'
  choices:
    A: An entire chromosome is deleted
    B: The amino acid sequence is unchanged
    C: A premature stop codon appears
    D: One codon codes for a different amino acid
  answer: D
  explain: Missense swaps one amino acid; nonsense introduces stop; silent leaves the protein sequence
    unchanged.
  chapter: 1C · Heritable information & diversity
- id: 1c-heritable-information-diversity-p1
  q: Which change can silence a gene while leaving its DNA sequence intact?
  choices:
    A: A double-strand break repaired by NHEJ
    B: A nonsense codon in the open reading frame
    C: Methylation of cytosines in the promoter region
    D: A single-base deletion in the coding sequence
  answer: C
  explain: Promoter methylation is an epigenetic mark — it represses transcription without changing the
    sequence. The others are sequence-level mutations or rearrangements.
  chapter: 1C · Heritable information & diversity
