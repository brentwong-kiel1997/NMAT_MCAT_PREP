practice:
- id: bb-6
  q: 'A defining feature of stem cells is:'
  choices:
    A: Self-renewal plus differentiation potential
    B: Inability to divide
    C: Loss of the nucleus
    D: Production of only one terminal cell type ever
  answer: A
  explain: Stem cells replenish themselves and can differentiate; potency varies by stem-cell type.
  chapter: 2C · Cell division, differentiation, specialization
- id: bio-9
  q: 'After mitosis, daughter cells have chromosome number:'
  choices:
    A: Halved
    B: The same as the parent (diploidy maintained)
    C: Quadrupled
    D: Randomly variable
  answer: B
  explain: Mitosis duplicates then evenly partitions chromosomes, yielding genetically identical diploid
    daughters.
  chapter: 2C · Cell division, differentiation, specialization
