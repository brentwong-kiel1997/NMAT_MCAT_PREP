id: 1b-gene-to-protein
title: 1B · Gene to protein
discipline: biochemistry
exams:
- NMAT
- MCAT
points:
- Genetic information from gene to protein
- Transmission of genetic information from gene to protein
notes:
- Transcription and eukaryotic RNA processing
- Degenerate code; start/stop codons
- 'Translation: ribosome, tRNA, peptide elongation'
- 5' cap and poly-A tail stabilize eukaryotic mRNA
- Intron splicing catalyzed by snRNPs
- Wobble hypothesis explains third-base codon degeneracy
- Transcriptional control and translation initiation are high-yield
- Degeneracy softens some mutation effects
- 'Prokaryotes: transcription and translation can couple'
- 'RNAi: small RNAs silence gene expression'
- Promoters and transcription factors set expression timing
- tRNA anticodons pair mRNA; aminoacyl-tRNA synthetases ensure fidelity
- 'Translation: initiation→elongation→termination; A/P/E sites'
practice:
- id: bb-3
  q: 'Ribosomes directly:'
  choices:
    A: Replicate DNA
    B: Pump protons
    C: Synthesize fatty acids
    D: Catalyze peptide-bond formation (translation)
  answer: D
  explain: Ribosomes read mRNA; tRNAs deliver amino acids; rRNA/protein components catalyze peptide elongation.
  chapter: 1B · Gene to protein
- id: bioc-4
  q: Where does transcription occur in eukaryotes?
  choices:
    A: Mitochondrial intermembrane space alone
    B: Outside the plasma membrane
    C: Golgi lumen
    D: Nucleus
  answer: D
  explain: DNA is transcribed to mRNA in the nucleus; mature mRNA is translated in the cytoplasm.
  chapter: 1B · Gene to protein
- id: 1b-gene-to-protein-p1
  q: 'In eukaryotes, intron removal from pre-mRNA is carried out by:'
  choices:
    A: DNA polymerase proofreading
    B: Aminoacyl-tRNA synthetases
    C: The spliceosome, a complex of snRNPs
    D: Ribosomal A-site peptidyl transferase
  answer: C
  explain: snRNPs assemble into the spliceosome, which catalyzes intron excision and exon ligation; the
    other enzymes act in replication, tRNA charging, and translation.
  chapter: 1B · Gene to protein
