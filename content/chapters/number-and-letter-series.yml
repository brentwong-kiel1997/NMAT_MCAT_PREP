id: number-and-letter-series
title: Number and Letter Series
discipline: inductive-reasoning
exams:
- NMAT
points:
- Arithmetic/geometric/alternating rules
- Letter positions and interleaved dual series
notes:
- Check arithmetic, multiplicative, alternating, place-value rules
- Letters often map to alphabet indices
- 'Second-order difference: deltas form an arithmetic series'
- Prime/composite or square/cube subsequences
practice:
- id: ind-3
  q: 'In the number series 2, 6, 18, 54, … the next term is most likely:'
  choices:
    A: '162'
    B: '108'
    C: '72'
    D: '60'
  answer: A
  explain: 'Geometric sequence with ratio 3: 54 × 3 = 162.'
  chapter: Number and Letter Series
- id: number-and-letter-series-p4
  q: What letter comes next in the series C, F, I, L, … ?
  choices:
    A: N
    B: M
    C: O
    D: P
  answer: C
  explain: 'Map to alphabet indices: C=3, F=6, I=9, L=12 — a constant step of +3. 12 + 3 = 15, and the
    15th letter is O. N=14 and M=13 are off-by-one slips, P=16 assumes a +4 step.'
  chapter: Number and Letter Series
- id: number-and-letter-series-p5
  q: What number continues the series 2, 3, 6, 11, 18, … ?
  choices:
    A: '27'
    B: '26'
    C: '25'
    D: '29'
  answer: A
  explain: 'Second-order rule: the differences 1, 3, 5, 7 are consecutive odd numbers, so the next difference
    is 9 and 18 + 9 = 27. 26 takes the last difference as 8, 25 forces the terms onto the squares 1, 4,
    9, 16, 25, and 29 skips ahead to a difference of 11.'
  chapter: Number and Letter Series
