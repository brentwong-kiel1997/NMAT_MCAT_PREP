- 'Niche: functional role across resource and time dimensions'
practice:
- id: bio-4
  q: 'Energy flow in ecosystems is basically:'
  choices:
    A: Fully cyclic with no loss
    B: One-way with stepwise dissipation
    C: Cycling only inside producers
    D: Identical to matter cycling
  answer: B
  explain: Energy moves one way with heat loss; matter can cycle.
  chapter: Organisms and Their Environment
- id: bio-8
  q: 'A food web better reflects an ecosystem’s:'
  choices:
    A: Single linear feeding path
    B: Complex feeding links among many species
    C: Energy cycling with no loss
    D: Equal biomass at every trophic level
  answer: B
  explain: Most species participate in multiple feeding links; webs are more realistic
    than single chains.
  chapter: Organisms and Their Environment
- id: organisms-and-their-environment-p1
  q: 'Producers in an ecosystem fix 20,000 kJ m⁻² yr⁻¹. With the ~10% transfer rule,
    the energy reaching tertiary consumers is about:'
  choices:
    A: 2,000 kJ
    B: 200 kJ
    C: 20 kJ
    D: 20,000 kJ
  answer: C
  explain: 'Three transfers separate producers from tertiary consumers: 20,000 → 2,000
    → 200 → 20 kJ. 2,000 and 200 stop one or two levels short; 20,000 assumes no loss.'
  chapter: Organisms and Their Environment
