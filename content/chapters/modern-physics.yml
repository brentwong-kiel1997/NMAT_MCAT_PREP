id: modern-physics
title: Modern Physics
discipline: physics
exams:
- NMAT
- MCAT
points:
- Intro modern physics (e.g., quantum/nuclear basics)
notes:
- Photon energy E = hf; photoelectric highlights
- Energy levels and spectral lines
- 'Nuclear decay: half-life and conserved quantities'
- E = hf; photon momentum p = h/λ
- de Broglie λ = h/p
- Half-life decay N = N₀(½)^(t/t½)
practice:
- id: phy-4
  q: 'Photon energy relates to frequency as:'
  choices:
    A: E = hf
    B: E = h/f
    C: E = f/h
    D: E = h + f
  answer: A
  explain: E = hf (or E = hc/λ).
  chapter: Modern Physics
- id: phy-9
  q: 'The photoelectric effect shows that light has:'
  choices:
    A: Wave nature only, no particle nature
    B: Quantized energy (photons)
    C: Energy independent of frequency
    D: Infinitely long wavelength
  answer: B
  explain: Electrons emit only when hf exceeds the work function; classical waves
    cannot explain a cutoff frequency.
  chapter: Modern Physics
- id: modern-physics-p1
  q: 'Using h = 6.6×10⁻³⁴ J·s, an electron with momentum p = 1.0×10⁻²⁴ kg·m/s has
    a de Broglie wavelength of:'
  choices:
    A: 6.6×10⁻⁵⁸ m
    B: 1.5×10⁹ m
    C: 6.6×10⁻³⁴ m
    D: 6.6×10⁻¹⁰ m
  answer: D
  explain: λ = h/p = 6.6×10⁻³⁴ / 1.0×10⁻²⁴ = 6.6×10⁻¹⁰ m. Multiplying h by p gives
    6.6×10⁻⁵⁸, inverting gives 1.5×10⁹, and 6.6×10⁻³⁴ forgets to divide by p.
  chapter: Modern Physics
