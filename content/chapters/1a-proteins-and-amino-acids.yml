practice:
- id: bb-1
  q: 'Peptide-bond formation involves:'
  choices:
    A: Changing element identities
    B: Breaking all hydrogen bonds
    C: Condensation linking amino acids with water loss
    D: Hydrolysis that consumes water
  answer: C
  explain: Carboxyl + amino condense with water loss; hydrolysis reverses it.
  chapter: 1A · Proteins and amino acids
- id: bioc-1
  q: 'Enzymes speed reactions primarily by:'
  choices:
    A: Destroying all products
    B: Changing the sign of ΔG°
    C: Raising temperature
    D: Lowering activation energy
  answer: D
  explain: Enzymes stabilize the transition state and lower Ea; overall ΔG is unchanged.
  chapter: 1A · Proteins and amino acids
- id: bioc-3
  q: 'Primary protein structure refers to:'
  choices:
    A: The binding site alone
    B: Assembly of multiple subunits
    C: Alpha-helix content alone
    D: The linear sequence of amino acids
  answer: D
  explain: Primary structure is residue order, which constrains higher-order folding and function.
  chapter: 1A · Proteins and amino acids
- id: bioc-7
  q: 'A competitive inhibitor typically:'
  choices:
    A: Denatures and precipitates the enzyme
    B: Leaves both Km and Vmax unchanged
    C: Increases Km with unchanged Vmax
    D: Drops Vmax to zero with unchanged Km
  answer: C
  explain: Competitive inhibitors bind the active site; high substrate can overcome inhibition, so Vmax
    is reachable.
  chapter: 1A · Proteins and amino acids
- id: bch-8
  q: 'Competitive inhibition typically:'
  choices:
    A: Leaves Km unchanged and raises Vmax
    B: Lowers both Km and Vmax
    C: Raises Km, leaves Vmax unchanged
    D: Lowers Km and raises Vmax
  answer: C
  explain: Competitor fights for the active site; more substrate can still reach Vmax.
  chapter: 1A · Proteins and amino acids
