id: 4b-fluids-for-circulation-and-gas-exchange
title: 4B · Fluids for circulation and gas exchange
discipline: physics
exams:
- NMAT
- MCAT
points:
- Fluids in blood circulation and gas exchange
- Fluids in circulation, gas movement, and gas exchange
notes:
- 'Continuity: A₁v₁ = A₂v₂'
- 'Bernoulli: speed up → pressure down (ideal intuition)'
- 'Poiseuille: flow extremely sensitive to radius'
- Buoyancy Fb = ρfluid Vdisplaced g
- Blood pressure ≈ flow × resistance (Ohm-like analogy)
- Surface tension and capillary rise in narrow tubes
- Continuity equation and Bernoulli intuition
- Resistance, radius, flow (Poiseuille idea)
