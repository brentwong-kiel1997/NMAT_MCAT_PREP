id: 1d-bioenergetics-and-fuel-metabolism
title: 1D · Bioenergetics and fuel metabolism
discipline: biochemistry
exams:
- NMAT
- MCAT
points:
- Bioenergetics and fuel molecule metabolism
notes:
- ATP as energy currency; coupled reactions
- Glycolysis vs gluconeogenesis; glycogen regulation
- Fatty-acid oxidation and ketone bodies (intro)
- 'OxPhos: proton gradient drives ATP synthesis'
- Glycolysis nets 2 ATP + 2 NADH (cytoplasm)
- 'TCA per acetyl-CoA: 3 NADH, 1 FADH₂, 1 GTP'
- Fatty-acid β-oxidation in mitochondria yields acetyl-CoA
- Pathways regulated by energy charge (ATP/NADH)
- Aerobic vs anaerobic products and ATP yield
- Phosphocreatine buffers rapid ATP demand
- 'Cori cycle: muscle lactate → liver gluconeogenesis'
- 'Fed: insulin-driven storage; fasting: glucagon mobilization'
- Each β-oxidation cycle cleaves 2 carbons as acetyl-CoA plus 1 NADH and 1 FADH₂
practice:
- id: bb-5
  q: 'The terminal electron acceptor in aerobic respiration is:'
  choices:
    A: Glucose
    B: CO₂
    C: O₂
    D: N₂
  answer: C
  explain: Complex IV passes electrons to O₂ forming H₂O, completing the ETC.
  chapter: 1D · Bioenergetics and fuel metabolism
- id: bb-8
  q: After an all-out sprint, muscle lactate travels to the liver, is converted back to glucose, and returns
    to the muscle. This shuttle is the…
  choices:
    A: malate–aspartate shuttle
    B: glycerol-3-phosphate shuttle
    C: enterohepatic circulation
    D: Cori cycle
  answer: D
  explain: Muscle lactate → liver gluconeogenesis → blood glucose → muscle is the Cori cycle; it recycles
    the anaerobic burden and clears lactate.
  chapter: 1D · Bioenergetics and fuel metabolism
- id: bioc-2
  q: 'Oxidative phosphorylation most directly depends on:'
  choices:
    A: Golgi budding
    B: Plasma-membrane cholesterol alone
    C: Nuclear transcription rate
    D: A proton gradient across the inner mitochondrial membrane
  answer: D
  explain: ETC pumps protons; ATP synthase uses the return flow.
  chapter: 1D · Bioenergetics and fuel metabolism
- id: bioc-6
  q: 'The net products of glycolysis per glucose are:'
  choices:
    A: Only O₂
    B: Only CO₂
    C: 38 ATP, no NADH
    D: 2 ATP, 2 NADH, 2 pyruvate
  answer: D
  explain: Glycolysis occurs in the cytosol; 2 ATP invested and 4 produced → net 2 ATP plus 2 NADH.
  chapter: 1D · Bioenergetics and fuel metabolism
- id: bch-9
  q: 'Net ATP from glycolysis per glucose is about:'
  choices:
    A: 36–38
    B: '32'
    C: '2'
    D: '0'
  answer: C
  explain: Uses 2 and makes 4 → net 2 ATP (plus NADH).
  chapter: 1D · Bioenergetics and fuel metabolism
