id: fundamental-operations
title: Fundamental Operations
discipline: quantitative
exams:
- NMAT
points:
- Four operations and order of operations
- Quick work with fractions, percents, ratios
notes:
- Be fluent converting fractions ↔ percents
- Estimation kills absurd options
- 'Proportions: cross-multiply only after unit alignment'
- Scientific notation simplifies large-number multiply/divide
- Estimate magnitude first, then compute; drop absurd choices
- 'Percent change: distinguish percentage points from relative percent'
practice:
- id: quant-2
  q: '15% of 80 equals:'
  choices:
    A: '12'
    B: '8'
    C: '15'
    D: '120'
  answer: A
  explain: 0.15 × 80 = 12.
  chapter: Fundamental Operations
- id: quan-6
  q: If x/3 = 12/9, then x =
  choices:
    A: '3'
    B: '4'
    C: '9'
    D: '36'
  answer: B
  explain: 'Cross-multiply: 9x=36 → x=4.'
  chapter: Fundamental Operations
- id: fundamental-operations-p7
  q: A tax rate rises from 4% to 5%. Which statement is correct?
  choices:
    A: It rose by 25 percentage points
    B: It rose by 0.25 percentage points
    C: It rose by 4 percentage points
    D: It rose by 1 percentage point, which is a 25% relative increase
  answer: D
  explain: 'Percentage points subtract the rates: 5 − 4 = 1 point. Relative percent change divides by
    the baseline: 1 ÷ 4 = 25%. Option A promotes the relative figure to points, B swaps the two, C uses
    the old rate as the change.'
  chapter: Fundamental Operations
