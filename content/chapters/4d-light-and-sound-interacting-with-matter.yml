practice:
- id: cp-5
  q: 'For sound in air (a longitudinal wave), particle vibration is:'
  choices:
    A: Parallel to the direction of propagation
    B: Perpendicular to propagation
    C: There is no vibration
    D: Only transverse, never longitudinal
  answer: A
  explain: Longitudinal waves travel via compressions and rarefactions; transverse waves vibrate perpendicular
    to travel.
