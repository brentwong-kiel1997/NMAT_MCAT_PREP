id: figure-grouping
title: Figure Grouping
discipline: inductive-reasoning
exams:
- NMAT
points:
- Group by shared attributes
- Exclude the odd one out
notes:
- Find the shared trait or the odd one out
- Ignore decoration; grab topology/count structure
- Symmetry (line/point) is a common grouping key
- 'Seek shared features: sides, symmetry, fill, rotation'
- Eliminate near-miss distractors that almost match
- Group by rule consistency, not subjective preference
practice:
- id: ind-2
  q: 'On figure-grouping items, the first step is usually to:'
  choices:
    A: Find the attribute shared by most figures
    B: Pick a group at random
    C: Count vertices only, ignore shape
    D: Assume there is no rule
  answer: A
  explain: Grouping tests shared features; the odd figure is often the key.
  chapter: Figure Grouping
- id: ind-5
  q: 'In figure grouping, the most reliable strategy is to:'
  choices:
    A: Pick the group that looks nicest
    B: Find a consistent rule and test all options
    C: Guess randomly
    D: Ignore shape and use color only
  answer: B
  explain: Inductive items test rule consistency, not aesthetic preference.
  chapter: Figure Grouping
- id: figure-grouping-p6
  q: 'Four figures are shown: (1) a square with 3 dots inside; (2) an equilateral triangle with 3 dots
    inside; (3) a pentagon with 4 dots inside; (4) a circle with 3 dots inside. Which figure does NOT
    belong with the other three?'
  choices:
    A: Figure 1, the square
    B: Figure 2, the triangle
    C: Figure 3, the pentagon
    D: Figure 4, the circle
  answer: C
  explain: The steady attribute across three figures is “exactly 3 dots inside,” so the pentagon with
    4 dots is the odd one out. Outer shape (square, triangle, circle) is decoration — count structure
    carries the rule.
  chapter: Figure Grouping
