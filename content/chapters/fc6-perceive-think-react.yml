practice:
- id: beh-6
  q: 'Figure–ground organization in perception means:'
  choices:
    A: Splitting a scene into a salient object and a less salient background
    B: Denying depth perception
    C: Processing only audition
    D: All stimuli are equally salient
  answer: A
  explain: The perceptual system tends to organize one region as figure and the rest as ground.
