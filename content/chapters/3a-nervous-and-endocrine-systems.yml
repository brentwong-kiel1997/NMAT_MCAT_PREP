practice:
- id: bio-12
  q: 'The “all-or-none” property of a neuronal action potential means:'
  choices:
    A: Stronger stimuli produce larger single action potentials
    B: At threshold a fixed-size spike occurs; below threshold, none
    C: Neurons never fire
    D: Synaptic transmission needs no neurotransmitter
  answer: B
  explain: Single spike amplitude is constant; stimulus strength mainly affects firing frequency.
